<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f1117" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>PlanMyTrip</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f1117; --bg2:#1a1d27; --bg3:#232736;
      --surface:#2a2e3f; --surface2:#333849; --border:#3d4358;
      --text:#e8eaf0; --text2:#9aa0b8; --text3:#6b7295;
      --accent:#1a73e8; --accent2:#4f8ef7;
      --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --purple:#a855f7;
      --nav-h:58px;
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-t:env(safe-area-inset-top,0px);
    }
    html,body { height:100%; width:100%; font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; direction:rtl; -webkit-tap-highlight-color:transparent; }
    #root { height:100%; display:flex; flex-direction:column; }

    /* ── Bottom nav ── */
    .bnav { position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--safe-b)); background:var(--bg2); border-top:1px solid var(--border); display:flex; align-items:stretch; padding-bottom:var(--safe-b); z-index:900; }
    .nbtn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:none; background:none; color:var(--text3); font-family:'Heebo',sans-serif; cursor:pointer; padding:5px 0; position:relative; }
    .nbtn.active { color:var(--accent2); }
    .nbtn.active::after { content:''; position:absolute; top:0; left:15%; right:15%; height:2px; background:var(--accent2); border-radius:0 0 3px 3px; }
    .nicon { font-size:20px; line-height:1; }
    .nlabel { font-size:10px; font-weight:600; }

    /* ── Screens ── */
    .sw { flex:1; overflow:hidden; position:relative; padding-top:var(--safe-t); padding-bottom:calc(var(--nav-h) + var(--safe-b)); }
    .screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; transition:opacity .18s ease,transform .18s ease; }
    .screen.h { opacity:0; pointer-events:none; transform:translateY(5px); }
    .map-screen { overflow:hidden !important; }

    /* ── Screen header ── */
    .sh { background:var(--bg2); border-bottom:1px solid var(--border); padding:13px 16px 11px; flex-shrink:0; position:sticky; top:0; z-index:10; }
    .stitle { font-size:17px; font-weight:700; }
    .ssub { font-size:12px; color:var(--text3); margin-top:2px; }

    /* ── Sub-tabs ── */
    .sub-tabs { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0; padding:0 8px; gap:2px; }
    .sub-tab { flex-shrink:0; padding:10px 14px; border:none; background:none; color:var(--text3); font-family:'Heebo',sans-serif; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
    .sub-tab.active { color:var(--accent2); border-bottom-color:var(--accent2); }

    /* ── Cards ── */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .crow { display:flex; align-items:center; gap:11px; padding:13px 15px; border-bottom:1px solid var(--border); }
    .crow:last-child { border-bottom:none; }
    .cicon { font-size:21px; width:34px; text-align:center; flex-shrink:0; }
    .cmain { flex:1; min-width:0; }
    .ctitle { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .csub { font-size:11px; color:var(--text3); margin-top:2px; }
    .cend { font-size:12px; color:var(--text3); flex-shrink:0; }

    /* ── Section label ── */
    .slabel { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; padding:14px 16px 5px; }

    /* ── Stat pills ── */
    .spill { display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:5px 13px; font-size:12px; font-weight:600; color:var(--text2); }
    .spill span { font-size:14px; }

    /* ── Empty state ── */
    .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; padding:40px 20px; text-align:center; color:var(--text3); }
    .eicon { font-size:46px; opacity:.45; }
    .etitle { font-size:16px; font-weight:600; color:var(--text2); }
    .edesc { font-size:13px; line-height:1.65; }

    /* ── Toast ── */
    .toast-w { position:fixed; top:calc(var(--safe-t) + 12px); left:14px; right:14px; z-index:9999; display:flex; flex-direction:column; gap:7px; pointer-events:none; }
    .toast { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,.5); animation:tIn .22s ease; display:flex; align-items:center; gap:7px; }
    .toast.s { border-color:var(--green); color:var(--green); }
    .toast.e { border-color:var(--red); color:var(--red); }
    .toast.i { border-color:var(--accent2); color:var(--accent2); }
    @keyframes tIn { from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:none} }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Map screen ── */
    .map-container { position:absolute; inset:0; }
    .map-searchbar { position:absolute; top:12px; left:12px; right:12px; z-index:10; display:flex; gap:8px; }
    .map-si { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 13px; color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; outline:none; direction:rtl; box-shadow:0 2px 10px rgba(0,0,0,.4); }
    .map-si::placeholder { color:var(--text3); }
    .map-fab { position:absolute; left:14px; z-index:10; width:44px; height:44px; border-radius:50%; border:none; background:var(--bg2); color:var(--text); font-size:20px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
    .map-fab.loc-fab { bottom:calc(14px); }
    .map-loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:var(--bg3); z-index:5; }
    .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent2); border-radius:50%; animation:spin .8s linear infinite; }

    /* ── Bottom sheet ── */
    .sheet-ov { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:800; }
    .bsheet { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b)); left:0; right:0; background:var(--bg2); border-radius:18px 18px 0 0; border-top:1px solid var(--border); transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); z-index:801; max-height:72vh; overflow-y:auto; }
    .bsheet.open { transform:translateY(0); }
    .bsheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 6px; }
    .bsheet-name { font-size:17px; font-weight:700; padding:6px 16px 2px; }
    .bsheet-type { font-size:12px; color:var(--text3); padding:0 16px 8px; }
    .bsheet-addr { font-size:13px; color:var(--text2); padding:0 16px 12px; line-height:1.5; }
    .bsheet-actions { display:flex; gap:9px; padding:0 16px 16px; flex-wrap:wrap; }
    .bsheet-btn { flex:1; min-width:120px; padding:11px 10px; border:none; border-radius:10px; font-family:'Heebo',sans-serif; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
    .bsheet-btn.web { background:var(--accent); color:#fff; }
    .bsheet-btn.bank { background:rgba(245,158,11,.15); color:var(--amber); border:1px solid rgba(245,158,11,.3); }
    .bsheet-btn.sched { background:rgba(34,197,94,.15); color:var(--green); border:1px solid rgba(34,197,94,.3); }

    /* ── Day selector overlay ── */
    .day-ov { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000; display:flex; align-items:flex-end; }
    .day-panel { background:var(--bg2); border-radius:18px 18px 0 0; border-top:1px solid var(--border); width:100%; padding-bottom:var(--safe-b); max-height:60vh; overflow-y:auto; }
    .day-panel-title { font-size:15px; font-weight:700; padding:14px 16px 10px; border-bottom:1px solid var(--border); }
    .day-opt { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
    .day-opt:active { background:var(--surface); }
    .day-opt:last-child { border-bottom:none; }

    /* ── Checklist ── */
    .add-row { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg2); flex-shrink:0; }
    .add-inp { flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; outline:none; direction:rtl; }
    .add-inp::placeholder { color:var(--text3); }
    .add-btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 16px; font-family:'Heebo',sans-serif; font-size:18px; cursor:pointer; font-weight:700; }
    .ci { display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--border); }
    .ci:last-child { border-bottom:none; }
    .cbox { width:26px; height:26px; border-radius:6px; border:2px solid var(--border); background:none; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; transition:all .12s; }
    .cbox.chk { background:var(--green); border-color:var(--green); }
    .ci-text { flex:1; font-size:14px; line-height:1.4; word-break:break-word; }
    .ci-text.done { text-decoration:line-through; color:var(--text3); }
    .ci-del { background:none; border:none; color:var(--text3); cursor:pointer; font-size:16px; padding:4px 6px; opacity:.5; }
    .ci-del:active { opacity:1; color:var(--red); }
    .ci-cat { font-size:10px; color:var(--text3); margin-top:2px; }
    .prog-bar { height:3px; background:var(--bg3); flex-shrink:0; }
    .prog-fill { height:100%; background:var(--green); transition:width .3s; }

    /* ── Notes ── */
    .note-ta { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; line-height:1.7; resize:none; outline:none; direction:rtl; }
    .qnote { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
    .qnote:last-child { border-bottom:none; }
    .qnote-text { flex:1; font-size:13px; line-height:1.55; }
    .qnote-date { font-size:10px; color:var(--text3); margin-top:3px; }

    /* ── Docs ── */
    .doc-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:14px 16px; }
    .doc-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
    .doc-icon { font-size:30px; }
    .doc-name { font-size:12px; color:var(--text2); word-break:break-word; line-height:1.35; }
    .doc-meta { font-size:10px; color:var(--text3); }

    /* ── Bank items ── */
    .bitem { display:flex; align-items:center; gap:11px; padding:12px 15px; border-bottom:1px solid var(--border); }
    .bitem:last-child { border-bottom:none; }

    /* ── Schedule ── */
    .blk { display:flex; align-items:center; gap:11px; padding:11px 15px; border-bottom:1px solid var(--border); }
    .blk:last-child { border-bottom:none; }
    .bdot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .btime { font-size:11px; color:var(--text3); width:38px; flex-shrink:0; }
    .bname { font-size:13px; font-weight:500; flex:1; min-width:0; }
    .bdur { font-size:11px; color:var(--text3); }

    /* ── Trip screen ── */
    .sync-b { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:10px; }
    .sync-b.synced { color:var(--green); background:rgba(34,197,94,.1); }
    .sync-b.syncing { color:var(--amber); background:rgba(245,158,11,.1); }
    .sync-b.error { color:var(--red); background:rgba(239,68,68,.1); }
    .sync-b.idle { color:var(--text3); background:var(--surface); }
    .trip-chip { flex-shrink:0; padding:5px 13px; border-radius:16px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text2); cursor:pointer; white-space:nowrap; }
    .trip-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    ::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    /* ── Day navigation (schedule) ── */
    .day-nav { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; flex-shrink:0; gap:8px; }
    .day-nav-btn { background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text2); font-size:18px; width:40px; height:40px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .day-nav-btn:disabled { opacity:.3; cursor:default; }
    .day-nav-center { flex:1; text-align:center; }
    .day-nav-title { font-size:15px; font-weight:700; }
    .day-nav-sub { font-size:11px; color:var(--text3); margin-top:2px; }
    .day-dots { display:flex; justify-content:center; gap:6px; padding:0 16px 10px; flex-shrink:0; }
    .day-dot { width:7px; height:7px; border-radius:50%; background:var(--border); transition:all .2s; cursor:pointer; }
    .day-dot.active { background:var(--accent2); width:18px; border-radius:4px; }
    .blk-row { display:flex; gap:0; padding:0 14px; border-bottom:1px solid var(--border); cursor:pointer; position:relative; }
    .blk-row:last-child { border-bottom:none; }
    .blk-row:active { background:var(--surface2); }
    .blk-left { display:flex; flex-direction:column; align-items:center; width:40px; flex-shrink:0; padding:14px 0; }
    .blk-circle { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid var(--bg2); flex-shrink:0; }
    .blk-line { flex:1; width:2px; background:var(--border); min-height:8px; }
    .blk-content { flex:1; min-width:0; padding:14px 0 14px 10px; }
    .blk-title { font-size:14px; font-weight:600; }
    .blk-meta { font-size:11px; color:var(--text3); margin-top:3px; }
    .blk-map-btn { align-self:center; flex-shrink:0; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:none; color:var(--accent2); font-size:12px; cursor:pointer; white-space:nowrap; }

    /* ── Map button on bank items ── */
    .map-btn { padding:7px 11px; border:1px solid var(--border); border-radius:8px; background:none; color:var(--accent2); font-size:12px; cursor:pointer; flex-shrink:0; }

    /* ── Version badge ── */
    .ver-badge { display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:3px 9px; font-size:11px; font-weight:600; color:var(--text3); }
    .ver-badge .v-app { color:var(--accent2); }
    .ver-badge .v-mob { color:var(--green); }

    /* ── Map day legend ── */
    .map-legend { position:absolute; bottom:calc(64px); right:12px; z-index:10; display:flex; flex-direction:column; gap:5px; }
    .map-legend-item { display:flex; align-items:center; gap:6px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:11px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .map-legend-dot { width:11px; height:11px; border-radius:50%; border:2px solid #fff; flex-shrink:0; }

    /* ── Block complete toggle ── */
    .blk-circle.done { opacity:.5; }
    .blk-title.done { text-decoration:line-through; opacity:.55; }

    /* ── Inline note editor ── */
    .note-inline { background:var(--bg3); border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:12px; font-family:'Heebo',sans-serif; color:var(--text); direction:rtl; resize:none; outline:none; width:100%; margin-top:5px; line-height:1.5; }

    /* ── Expense row ── */
    .exp-row { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
    .exp-row:last-child { border-bottom:none; }
    .exp-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .exp-cat { font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; flex-shrink:0; }
    .exp-desc { flex:1; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .exp-amt { font-size:14px; font-weight:700; flex-shrink:0; }
    .exp-del { background:none; border:none; color:var(--text3); cursor:pointer; font-size:15px; padding:3px 5px; opacity:.4; }
    .exp-del:active { opacity:1; color:var(--red); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useMemo,useCallback}=React;

/* ─── constants ─── */
const MOB_VER='m77';
const FB_URL='https://planmytrip-de33c-default-rtdb.firebaseio.com';
const LS_KEY='caravanCtrl_he';
const GMAPS_KEY='AIzaSyAZhMPQ3rdplpqNhYx5oNrZV5HJfcTq1Dw';

const BLOCK_TYPES=['travel','activity','stop','rest','games','free'];
const BLOCK_EMOJI={travel:'🚗',activity:'🎯',stop:'⏸️',rest:'😴',games:'🎮',free:'🕐'};
const BLOCK_HE={travel:'נסיעה',activity:'פעילות',stop:'עצירה',rest:'מנוחה',games:'משחקים',free:'זמן פנוי'};
const BLOCK_COLOR={travel:'#4f8ef7',activity:'#22c55e',stop:'#f59e0b',rest:'#94a3b8',games:'#a855f7',free:'#64748b'};
const MAX_TRAVEL_MINS=600; // 10 שעות — גבול לזיהוי שגיאה (אתרים ביבשות שונות)
const fmt2=n=>String(n).padStart(2,'0');
const addMins=(t,m)=>{const[h,mi]=(t||'00:00').split(':').map(Number),tot=h*60+mi+(m||0);return`${fmt2(Math.floor(tot/60)%24)}:${fmt2(tot%60)}`;};
const nowTimeStr=()=>{const n=new Date();return`${fmt2(n.getHours())}:${fmt2(n.getMinutes())}`;};
const toMinsStr=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;};

const normalizeCountry=(raw,fullAddr)=>{
  if(!raw)return'ללא כתובת';
  const lo=raw.toLowerCase().trim();
  if(COUNTRY_HE[lo])return COUNTRY_HE[lo];
  for(const[en,he] of Object.entries(COUNTRY_HE)){if(lo.includes(en))return he;}
  if(ISRAEL_CITIES.has(lo))return'ישראל';
  if(/israel/i.test(fullAddr)||/ישראל/.test(fullAddr))return'ישראל';
  return raw;
};
const getCountry=item=>{
  if(item.country)return normalizeCountry(item.country,item.address||'');
  const addr=(item.address||'').trim();
  if(!addr)return'ללא כתובת';
  const parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
  if(parts.length<2)return normalizeCountry(parts[0]||'ללא כתובת',addr);
  let last=parts[parts.length-1];
  last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').trim();
  last=last.replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
  if(!last||/^\d+$/.test(last)){
    last=parts[parts.length-2]||'';
    last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
  }
  return normalizeCountry(last||'ללא כתובת',addr);
};

const fetchWeatherDay=async(lat,lng,date)=>{
  if(!lat||!lng||!date)return null;
  const key=`${parseFloat(lat).toFixed(2)}_${parseFloat(lng).toFixed(2)}`;
  if(!_wxCache[key]){
    try{
      const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&daily=weathercode,temperature_2m_max,temperature_2m_min&forecast_days=3&timezone=auto`);
      const d=await r.json();
      if(!d?.daily?.time)return null;
      _wxCache[key]=d.daily.time.map((dt,i)=>({date:dt,code:d.daily.weathercode[i],tMax:Math.round(d.daily.temperature_2m_max[i]),tMin:Math.round(d.daily.temperature_2m_min[i])}));
    }catch{return null;}
  }
  return _wxCache[key]?.find(f=>f.date===date)||null;
};

/* ─── OSRM travel time (100% free, no Google, no billing) ─── */
const _osrmCache={};
const fetchOsrmMinutes=async(fromLat,fromLng,toLat,toLng,profile='driving')=>{
  const key=`${profile}:${fromLng.toFixed(4)},${fromLat.toFixed(4)}|${toLng.toFixed(4)},${toLat.toFixed(4)}`;
  if(key in _osrmCache)return _osrmCache[key];
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),9000);
    const url=`https://router.project-osrm.org/route/v1/${profile}/${fromLng},${fromLat};${toLng},${toLat}?overview=false`;
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok){_osrmCache[key]=null;return null;}
    const d=await r.json();
    const sec=d?.routes?.[0]?.duration;
    const distM=d?.routes?.[0]?.distance;
    const min=sec!=null?Math.round(sec/60):null;
    const km=distM!=null?Math.round(distM/100)/10:null;
    _osrmCache[key]={min,km};
    return{min,km};
  }catch{_osrmCache[key]=null;return null;}
};
const fmtKm=km=>km==null?'':km<1?`${Math.round(km*1000)}מ'`:`${km<10?km.toFixed(1):Math.round(km)} ק"מ`;
const fmtTravelMin=m=>{
  if(m==null)return'?';
  if(m<60)return`${m} דק'`;
  const h=Math.floor(m/60),mn=m%60;
  return mn?`${h}ש' ${mn}דק'`:`${h} שעות`;
};

  return<div className="day-ov" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="day-panel">
      <div className="day-panel-title">{title}</div>
      {days.map((d,i)=>(
        <div key={d.id} className="day-opt" onClick={()=>onSelect(d.id)}>
          <span style={{fontSize:18}}>📅</span>
          <div>
            <div style={{fontWeight:600,fontSize:14}}>יום {i+1}{d.startLocation?` — ${d.startLocation}`:''}</div>
            <div style={{fontSize:11,color:'var(--text3)'}}>{d.startTime}–{d.endTime} · {(d.blocks||[]).length} פעילויות</div>
          </div>
        </div>
      ))}
      <div className="day-opt" onClick={onClose} style={{color:'var(--text3)',justifyContent:'center'}}>ביטול</div>
    </div>
  </div>;
}

/* ════════════════════════════════
   MAP SCREEN
════════════════════════════════ */
function MapScreen({trip,active,mapsReady,onUpdate,mapFocusRef,mapPickCallbackRef,mapPickLabel,onCancelMapPick}){
  const mapDivRef=useRef(null);
  const mapRef=useRef(null);
  const bankMkRef=useRef([]);
  const dayMkRef=useRef([]);
  const dayMkHiddenRef=useRef(false); // true כשסמני-ימים מוסתרים בגלל הדגשת יום
  const hlDayMkRef=useRef([]); // סמנים ממוספרים ל"הצג יום על מפה"
  const hlDayRtRef=useRef([]); // מסלולים בין עצירות
  const srchMkRef=useRef([]);
  const svcRef=useRef(null);
  const iwRef=useRef(null);
  const srchInputRef=useRef(null);
  const refreshedIdsRef=useRef(new Set()); // session cache: IDs already attempted refresh
  const[sheet,setSheet]=useState(null);
  const[daySelPlace,setDaySelPlace]=useState(null);
  const[daySelMode,setDaySelMode]=useState(null); // 'sched'|'start'|'end'
  const[loading,setLoading]=useState(false);
  const[showDayLegend,setShowDayLegend]=useState(true);

  /* init map */
  useEffect(()=>{
    if(!mapsReady||!mapDivRef.current||mapRef.current)return;
    const m=new window.google.maps.Map(mapDivRef.current,{
      center:{lat:32,lng:35},zoom:8, // ישראל כברירת מחדל — מוחלף ב-GPS תוך שניה
      disableDefaultUI:true,gestureHandling:'greedy',
      // ללא styles — שימוש בסגנון הסטנדרטי של גוגל מפות (הכי קריא)
    });
    svcRef.current=new window.google.maps.places.PlacesService(m);
    iwRef.current=new window.google.maps.InfoWindow();
    m.addListener('click',async e=>{
      // pick mode — intercept for start/end location selection
      if(mapPickCallbackRef?.current){
        const lat=e.latLng.lat(),lng=e.latLng.lng();
        if(e.placeId){
          e.stop();
          svcRef.current.getDetails(
            {placeId:e.placeId,fields:['name','formatted_address','geometry']},
            (place,status)=>{
              const cb=mapPickCallbackRef.current;
              mapPickCallbackRef.current=null;
              cb(status==='OK'
                ?{name:place.name||'',lat,lng,address:place.formatted_address||''}
                :{name:`${lat.toFixed(5)}, ${lng.toFixed(5)}`,lat,lng,address:''});
            }
          );
        }else{
          const cb=mapPickCallbackRef.current;
          mapPickCallbackRef.current=null;
          cb({name:`${lat.toFixed(5)}, ${lng.toFixed(5)}`,lat,lng,address:''});
        }
        return;
      }
      if(!e.placeId)return;
      e.stop();
      loadPlace(e.placeId,e.latLng.lat(),e.latLng.lng());
    });
    mapRef.current=m;
    // מרכז על מיקום GPS אמיתי ברגע שזמין
    navigator.geolocation?.getCurrentPosition(
      p=>{
        if(!mapRef.current)return;
        mapRef.current.panTo({lat:p.coords.latitude,lng:p.coords.longitude});
        mapRef.current.setZoom(12);
      },
      null,
      {timeout:6000,maximumAge:60000,enableHighAccuracy:false}
    );
  },[mapsReady]);

  /* resize + handle focus request when tab activates */
  useEffect(()=>{
    if(!active)return;
    const t=setTimeout(()=>{
      if(mapRef.current)window.google?.maps?.event?.trigger(mapRef.current,'resize');
      const req=mapFocusRef?.current;
      if(!req||!mapRef.current)return;
      mapFocusRef.current=null;
      // אם עוברים ממצב הדגשת-יום לנקודה בודדת — שחזר סמני ימים
      if(!req.fitBounds&&dayMkHiddenRef.current){
        dayMkRef.current.forEach(m=>m.setMap(mapRef.current));
        dayMkHiddenRef.current=false;
      }
      // ניקוי סמנים ומסלולים קודמים של יום
      hlDayMkRef.current.forEach(m=>m.setMap(null)); hlDayMkRef.current=[];
      hlDayRtRef.current.forEach(r=>{try{r.setMap(null);}catch(e){}});  hlDayRtRef.current=[];
      // מצב fitBounds — הצג כל עצירות יום
      if(req.fitBounds&&req.hlBlocks?.length>0&&window.google?.maps){
        const DAY_C=DAY_COLORS_MAP[req.dayIndex%DAY_COLORS_MAP.length];
        const bounds=new window.google.maps.LatLngBounds();
        let pinNum=1;
        req.hlBlocks.forEach((block,i)=>{
          if(!block.lat||!block.lng)return;
          const isStart=block.id==='__start__';
          const isEnd=block.id==='__end__';
          const fc=isStart?'#16a34a':isEnd?'#dc2626':DAY_C;
          const lbl=String(pinNum++);
          const m=new window.google.maps.Marker({
            position:{lat:block.lat,lng:block.lng},
            map:mapRef.current,
            label:{text:lbl,color:'#fff',fontSize:'11px',fontWeight:'bold'},
            icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:16,fillColor:fc,fillOpacity:1,strokeColor:'#fff',strokeWeight:2},
            title:block.title||'',
            zIndex:110,
          });
          bounds.extend({lat:block.lat,lng:block.lng});
          hlDayMkRef.current.push(m);
        });
        const valid=req.hlBlocks.filter(b=>b.lat&&b.lng);
        if(valid.length===1){mapRef.current.panTo({lat:valid[0].lat,lng:valid[0].lng});mapRef.current.setZoom(15);}
        else if(valid.length>1){mapRef.current.fitBounds(bounds,{top:60,right:60,bottom:60,left:60});}
        // ── מסלולים בין עצירות ──
        if(window.google.maps.DirectionsService){
          const sortedAll=[...req.hlBlocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
          const startPin=req.hlBlocks.find(b=>b.id==='__start__');
          const endPin=req.hlBlocks.find(b=>b.id==='__end__');
          const regBlocks=req.hlBlocks
            .filter(b=>b.id!=='__start__'&&b.id!=='__end__'&&b.lat&&b.lng&&!b.isAutoTravel)
            .sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
          const coordSeq=[];
          if(startPin?.lat&&startPin?.lng)coordSeq.push(startPin);
          regBlocks.forEach(b=>coordSeq.push(b));
          if(endPin?.lat&&endPin?.lng)coordSeq.push(endPin);
          const routeColor=DAY_C;
          for(let ci=0;ci<coordSeq.length-1;ci++){
            const from=coordSeq[ci],to=coordSeq[ci+1];
            const travelBlock=sortedAll.find(b=>b.isAutoTravel&&
              (b.startTime||'')>=(from.startTime||'00:00')&&
              (b.startTime||'')<(to.startTime||'23:59'));
            if(!travelBlock)continue;
            const tMode=travelBlock.isTransit
              ?window.google.maps.TravelMode.TRANSIT
              :travelBlock.isWalking
                ?window.google.maps.TravelMode.WALKING
                :window.google.maps.TravelMode.DRIVING;
            const renderer=new window.google.maps.DirectionsRenderer({
              suppressMarkers:true,
              polylineOptions:{strokeColor:routeColor,strokeWeight:4,strokeOpacity:0.65},
              map:mapRef.current
            });
            hlDayRtRef.current.push(renderer);
            new window.google.maps.DirectionsService().route({
              origin:{lat:from.lat,lng:from.lng},
              destination:{lat:to.lat,lng:to.lng},
              travelMode:tMode,
              ...(tMode===window.google.maps.TravelMode.TRANSIT?{transitOptions:{departureTime:new Date()}}:{})
            },(result,status)=>{
              if(status==='OK'&&result?.routes?.length){
                renderer.setDirections(result);
              } else {
                renderer.setMap(null);
                if(mapRef.current){
                  const poly=new window.google.maps.Polyline({
                    path:[{lat:from.lat,lng:from.lng},{lat:to.lat,lng:to.lng}],
                    strokeColor:routeColor,strokeWeight:3,strokeOpacity:0.5,
                    icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,scale:3},offset:'0',repeat:'12px'}],
                    map:mapRef.current
                  });
                  hlDayRtRef.current.push(poly);
                }
              }
            });
          }
        }
        // הסתר סמני-ימים רגילים — רואים רק את הממוספרים של היום הנוכחי
        dayMkRef.current.forEach(m=>m.setMap(null));
        dayMkHiddenRef.current=true;
        return;
      }
      if(req.lat&&req.lng){mapRef.current.panTo({lat:req.lat,lng:req.lng});mapRef.current.setZoom(16);}
      if(req.placeId)loadPlace(req.placeId,req.lat||0,req.lng||0);
      else if(req.name)setSheet({lat:req.lat,lng:req.lng,name:req.name,address:req.address||'',inBank:true});
    },120);
    return()=>clearTimeout(t);
  },[active,mapsReady]);// eslint-disable-line

  /* bank markers — SVG circle icons by _listSource; plain red pin if no known status */
  useEffect(()=>{
    if(!mapsReady||!mapRef.current)return;
    bankMkRef.current.forEach(m=>m.setMap(null));
    bankMkRef.current=[];
    (trip?.interestBank||[]).forEach(item=>{
      if(!item.lat||!item.lng)return;
      const src=getBankSrc(item);
      const icon=makeBankIcon(src); // null → default red pin
      const mk=new window.google.maps.Marker({
        position:{lat:item.lat,lng:item.lng},map:mapRef.current,
        title:src?`${src.emoji} ${item.name||''}`:item.name||'',
        zIndex:5,
        ...(icon?{icon}:{}),
      });
      mk.addListener('click',()=>{
        if(mapPickCallbackRef?.current){const cb=mapPickCallbackRef.current;mapPickCallbackRef.current=null;cb({name:item.name||'',lat:item.lat,lng:item.lng,address:item.address||''});return;}
        loadPlace(item.placeId,item.lat,item.lng,item);
      });
      bankMkRef.current.push(mk);
    });
  },[trip?.interestBank,mapsReady]);

  /* day route markers — colored circles per day */
  useEffect(()=>{
    if(!mapsReady||!mapRef.current)return;
    dayMkRef.current.forEach(m=>m.setMap(null));
    dayMkRef.current=[];
    (trip?.days||[]).forEach((day,di)=>{
      const color=DAY_COLORS_MAP[di%DAY_COLORS_MAP.length];
      (day.blocks||[]).forEach(b=>{
        // get coordinates: from block directly, or look up bank item
        const lat=b.lat||(b.placeId?(trip.interestBank||[]).find(i=>i.placeId===b.placeId)?.lat:null);
        const lng=b.lng||(b.placeId?(trip.interestBank||[]).find(i=>i.placeId===b.placeId)?.lng:null);
        if(!lat||!lng)return;
        const mk=new window.google.maps.Marker({
          position:{lat,lng},map:mapRef.current,title:`יום ${di+1}: ${b.title||''}`,zIndex:8,
          icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:10,fillColor:color,fillOpacity:.92,strokeColor:'#fff',strokeWeight:2},
          label:{text:String(di+1),color:'#fff',fontSize:'10px',fontWeight:'bold'},
        });
        mk.addListener('click',()=>{
          if(mapPickCallbackRef?.current){const cb=mapPickCallbackRef.current;mapPickCallbackRef.current=null;cb({name:b.title||BLOCK_HE[b.type]||'פעילות',lat,lng,address:b.address||''});return;}
          setSheet({lat,lng,name:b.title||BLOCK_HE[b.type]||'פעילות',address:b.address||'',inBank:false,placeId:b.placeId||null,website:'',dayLabel:`יום ${di+1}`});
        });
        dayMkRef.current.push(mk);
      });
    });
    // אם יום מודגש — שמור סמנים מוסתרים גם אחרי בנייה מחדש
    if(dayMkHiddenRef.current) dayMkRef.current.forEach(m=>m.setMap(null));
  },[trip?.days,trip?.interestBank,mapsReady]);

  const loadPlace=(placeId,lat,lng,bankItem=null)=>{
    if(!svcRef.current){return;}
    const inBank=bankItem!=null||!!(trip?.interestBank||[]).find(i=>i.placeId===placeId);

    // show stored bank data IMMEDIATELY so bottom sheet opens with existing info
    if(bankItem){
      setSheet({placeId:placeId||null,lat,lng,inBank,
        name:bankItem.name||'',address:bankItem.address||'',
        rating:bankItem.rating??null,website:bankItem.website||'',
        types:bankItem.types||[],placeType:bankItem.placeType||'',
        openStatus:bankItem.openStatus||'',
        todayHours:bankItem.todayHours||'',phone:bankItem.phone||''});
    }

    if(!placeId){
      // no placeId — already showed bank data above; try refresh by name
      if(bankItem?.name&&lat&&lng)tryRefresh(bankItem.name,lat,lng,bankItem.id);
      return;
    }

    // SESSION CACHE — כבר שלפנו מקום זה בסשן הנוכחי?
    window.__placeCache=window.__placeCache||{};
    if(window.__placeCache[placeId]){
      setSheet({...window.__placeCache[placeId],inBank});
      return;
    }
    // STALENESS CHECK — אם הנתונים עדכניים (פחות מ-7 ימים) — אין צורך לפנות ל-Google
    const STALE_SEC=7*24*3600;
    const nowSec=Math.floor(Date.now()/1000);
    if(bankItem?.lastFetched&&(nowSec-bankItem.lastFetched)<STALE_SEC){
      return; // נתונים טריים — כבר הצגנו אותם למעלה
    }

    setLoading(true);

    // helper: parse getDetails result into sheet fields + persist back to bank item
    const parseDetails=(res,pid,la,lo)=>{
      const dow=new Date().getDay(),wdIdx=dow===0?6:dow-1;
      let openStatus='';
      try{openStatus=res.opening_hours?.isOpen()?'פתוח עכשיו':'סגור עכשיו';}catch{}
      const todayHours=res.opening_hours?.weekday_text?.[wdIdx]?.replace(/^[^:]+:\s*/,'')||'';
      // merge: prefer fresh Google data, fall back to whatever is stored in bankItem
      const fields={placeId:pid,
        lat:res.geometry?.location?.lat()||la,lng:res.geometry?.location?.lng()||lo,
        name:res.name||bankItem?.name||'',
        address:res.formatted_address||bankItem?.address||'',
        rating:res.rating??bankItem?.rating??null,
        website:res.website||bankItem?.website||'',
        types:res.types||bankItem?.types||[],
        openStatus:openStatus||bankItem?.openStatus||'',
        todayHours:todayHours||bankItem?.todayHours||'',
        phone:res.international_phone_number||bankItem?.phone||''};
      // persist fresh data back to bank item so it survives future stale placeId failures
      if(inBank&&bankItem&&onUpdate&&trip){
        const patch={rating:fields.rating||bankItem.rating,website:fields.website||bankItem.website,
          openStatus:fields.openStatus||bankItem.openStatus||'',todayHours:fields.todayHours||bankItem.todayHours||'',
          phone:fields.phone||bankItem.phone||'',placeId:pid,
          lastFetched:Math.floor(Date.now()/1000)};
        const needsUpdate=Object.keys(patch).some(k=>bankItem[k]!==patch[k]);
        if(needsUpdate){
          const updated=(trip.interestBank||[]).map(i=>i.id===bankItem.id?{...i,...patch}:i);
          onUpdate({...trip,interestBank:updated});
        }
      }
      return{...fields,inBank};
    };

    // helper: try to refresh stale placeId via text search by name (once per session per item)
    const tryRefresh=(name,la,lo,itemId)=>{
      if(!name)return;
      if(itemId&&refreshedIdsRef.current.has(itemId))return; // already tried this session
      if(itemId)refreshedIdsRef.current.add(itemId);
      const loc=new window.google.maps.LatLng(la,lo);
      svcRef.current.textSearch({query:name,location:loc,radius:500},(results,st2)=>{
        const PS=window.google.maps.places.PlacesServiceStatus;
        if(st2!==PS.OK||!results?.length)return;
        const freshId=results[0].place_id;
        if(!freshId)return;
        svcRef.current.getDetails({placeId:freshId,
          fields:['name','rating','formatted_address','website','types','geometry','opening_hours','international_phone_number']},
          (res2,st3)=>{
            if(st3===PS.OK&&res2){
              setSheet(parseDetails(res2,freshId,la,lo));
              // silently update placeId in bank if item is from bank
              if(bankItem&&onUpdate&&trip&&freshId!==placeId){
                const updated=(trip.interestBank||[]).map(i=>
                  i.id===bankItem.id?{...i,placeId:freshId}:i);
                onUpdate({...trip,interestBank:updated});
              }
            }
          });
      });
    };

    svcRef.current.getDetails({placeId,
      fields:['name','rating','formatted_address','website','types','geometry','opening_hours','international_phone_number']},
      (res,st)=>{
        const PS=window.google.maps.places.PlacesServiceStatus;
        if(st===PS.OK&&res){
          // update sheet with Google data merged on top of bank data
          const parsed=parseDetails(res,placeId,lat,lng);
          setSheet(parsed);
          // שמור ב-session cache — לא נצטרך לקרוא שוב ל-Google בסשן הזה
          window.__placeCache[placeId]=parsed;
        } else {
          // placeId stale — already showing bank data; try to find fresh placeId once
          if(bankItem?.name&&lat&&lng)tryRefresh(bankItem.name,lat,lng,bankItem.id);
        }
        setLoading(false);
      });
  };

  const doSearch=()=>{
    const q=(srchInputRef.current?.value||'').trim();
    if(!q)return;
    if(!mapRef.current||!svcRef.current){toast('המפה עדיין נטענת...','e');return;}
    srchMkRef.current.forEach(m=>m.setMap(null));srchMkRef.current=[];
    const vpBounds=mapRef.current.getBounds();
    const opts={query:q};
    if(vpBounds)opts.bounds=vpBounds;
    svcRef.current.textSearch(opts,(res,st)=>{
      const PS=window.google.maps.places.PlacesServiceStatus;
      if(st!==PS.OK||!res?.length){toast('לא נמצאו תוצאות','e');return;}
      // filter in-viewport first; fall back to all results if none in viewport
      const inView=vpBounds
        ?res.filter(r=>r.geometry?.location&&vpBounds.contains(r.geometry.location))
        :res;
      const list=(inView.length?inView:res).slice(0,8);
      // place markers
      const bounds=new window.google.maps.LatLngBounds();
      list.forEach(r=>{
        const loc=r.geometry?.location;if(!loc)return;
        const icon=makePinIcon(r.types||[])||{
          path:window.google.maps.SymbolPath.FORWARD_CLOSED_ARROW,
          scale:5,fillColor:'#4f8ef7',fillOpacity:1,strokeColor:'#fff',strokeWeight:1.5,rotation:180};
        const mk=new window.google.maps.Marker({
          position:{lat:loc.lat(),lng:loc.lng()},map:mapRef.current,
          title:r.name||'',zIndex:20,icon});
        mk.addListener('click',()=>{
          if(mapPickCallbackRef?.current){const cb=mapPickCallbackRef.current;mapPickCallbackRef.current=null;cb({name:r.name||'',lat:loc.lat(),lng:loc.lng(),address:r.formatted_address||r.vicinity||''});return;}
          loadPlace(r.place_id,loc.lat(),loc.lng());
        });
        srchMkRef.current.push(mk);
        bounds.extend(loc);
      });
      // pan/zoom to results
      if(list.length===1){
        const loc=list[0].geometry.location;
        mapRef.current.panTo(loc);mapRef.current.setZoom(12);
        loadPlace(list[0].place_id,loc.lat(),loc.lng());
      } else if(list.length>1){
        mapRef.current.fitBounds(bounds,{top:60,bottom:60,left:20,right:20});
      }
      if(inView.length===0&&res.length>0)
        toast(`${list.length} תוצאות — גרור לאזור אחר לסינון טוב יותר`,'i');
    });
  };

  const goLoc=()=>{
    if(!navigator.geolocation||!mapRef.current){toast('מיקום לא זמין','e');return;}
    navigator.geolocation.getCurrentPosition(p=>{
      const ll={lat:p.coords.latitude,lng:p.coords.longitude};
      mapRef.current.panTo(ll);mapRef.current.setZoom(14);
    },()=>toast('לא ניתן לגשת למיקום','e'));
  };

  const addToBank=()=>{
    if(!sheet||!onUpdate)return;
    const item={id:uid(),name:sheet.name||'',address:sheet.address||'',placeId:sheet.placeId||'',
      lat:sheet.lat,lng:sheet.lng,types:sheet.types||[],rating:sheet.rating,website:sheet.website,
      openStatus:sheet.openStatus||'',todayHours:sheet.todayHours||'',phone:sheet.phone||''};
    const cur=trip||{interestBank:[]};
    onUpdate({...cur,interestBank:[...(cur.interestBank||[]),item]});
    toast(`"${sheet.name}" נוסף לבנק ⭐`,'s');
    setSheet(s=>({...s,inBank:true}));
  };

  const addToSchedule=(dayId)=>{
    if(!sheet||!onUpdate||!trip)return;
    // smart time: append after last block of the day
    const dayObj=trip.days.find(d=>d.id===dayId);
    const dayBlks=[...(dayObj?.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const lastBlk=dayBlks[dayBlks.length-1];
    const startTime=lastBlk?.endTime||dayObj?.startTime||'10:00';
    const endTime=addMins(startTime,90);
    const block={id:uid(),type:'activity',title:sheet.name||'',startTime,endTime,
      note:'',placeId:sheet.placeId||'',address:sheet.address||'',
      lat:sheet.lat||null,lng:sheet.lng||null,
      placeRating:sheet.rating||null,placeWebsite:sheet.website||'',
      placeOpenStatus:sheet.openStatus||'',placeTodayHours:sheet.todayHours||'',
      placePhone:sheet.phone||'',
      placeType:sheet.types?.length?getTypeLabel(sheet.types):''};
    // גם הוסף לבנק אטרקציות — אותה פעולת onUpdate אטומית
    const _bankAlreadySched=sheet.placeId&&(trip.interestBank||[]).some(i=>i.placeId===sheet.placeId);
    const _newBankSched=_bankAlreadySched
      ?(trip.interestBank||[])
      :[...(trip.interestBank||[]),{id:uid(),name:sheet.name||'',address:sheet.address||'',
          placeId:sheet.placeId||null,lat:sheet.lat,lng:sheet.lng,
          types:sheet.types||[],placeType:sheet.placeType||'',
          rating:sheet.rating,website:sheet.website||'',
          openStatus:sheet.openStatus||'',todayHours:sheet.todayHours||'',phone:sheet.phone||''}];
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,blocks:[...(d.blocks||[]),block]}:d),interestBank:_newBankSched});
    toast(`"${sheet.name}" נוסף ללוז היומי ולבנק האטרקציות ✓`,'s');
    setDaySelPlace(null);setDaySelMode(null);
  };
  const addToDayBank=(dayId)=>{
    if(!sheet||!onUpdate||!trip)return;
    const item={id:uid(),name:sheet.name||'',address:sheet.address||'',placeId:sheet.placeId||'',
      lat:sheet.lat,lng:sheet.lng,rating:sheet.rating||null,
      placeType:sheet.types?.length?getTypeLabel(sheet.types):sheet.placeType||'',
      openStatus:sheet.openStatus||'',todayHours:sheet.todayHours||'',phone:sheet.phone||'',website:sheet.website||''};
    const already=(trip.days.find(d=>d.id===dayId)?.dayBank||[]).some(i=>i.placeId&&i.placeId===item.placeId&&item.placeId);
    if(already){toast(`"${item.name}" כבר בבנק היומי`,'i');setDaySelPlace(null);setDaySelMode(null);return;}
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,dayBank:[...(d.dayBank||[]),item]}:d)});
    toast(`"${sheet.name}" נוסף לבנק היומי 📌`,'s');
    setDaySelPlace(null);setDaySelMode(null);
  };
  const setDayStart=(dayId)=>{
    if(!sheet||!onUpdate||!trip)return;
    const _bankAlreadyStart=sheet.placeId&&(trip.interestBank||[]).some(i=>i.placeId===sheet.placeId);
    const _newBankStart=(_bankAlreadyStart||!sheet.placeId)
      ?(trip.interestBank||[])
      :[...(trip.interestBank||[]),{id:uid(),name:sheet.name||'',address:sheet.address||'',
          placeId:sheet.placeId,lat:sheet.lat,lng:sheet.lng,
          types:sheet.types||[],placeType:sheet.placeType||'',
          rating:sheet.rating,website:sheet.website||'',
          openStatus:sheet.openStatus||'',todayHours:sheet.todayHours||'',phone:sheet.phone||''}];
    onUpdate({...trip,
      days:trip.days.map(d=>d.id===dayId?{...d,startLocation:sheet.name||'',startLat:sheet.lat||null,startLng:sheet.lng||null}:d),
      interestBank:_newBankStart});
    toast(`"${sheet.name}" הוגדר כנקודת מוצא ונוסף לבנק ✓`,'s');
    setDaySelPlace(null);setDaySelMode(null);
  };
  const setDayEnd=(dayId)=>{
    if(!sheet||!onUpdate||!trip)return;
    const _bankAlreadyEnd=sheet.placeId&&(trip.interestBank||[]).some(i=>i.placeId===sheet.placeId);
    const _newBankEnd=(_bankAlreadyEnd||!sheet.placeId)
      ?(trip.interestBank||[])
      :[...(trip.interestBank||[]),{id:uid(),name:sheet.name||'',address:sheet.address||'',
          placeId:sheet.placeId,lat:sheet.lat,lng:sheet.lng,
          types:sheet.types||[],placeType:sheet.placeType||'',
          rating:sheet.rating,website:sheet.website||'',
          openStatus:sheet.openStatus||'',todayHours:sheet.todayHours||'',phone:sheet.phone||''}];
    onUpdate({...trip,
      days:trip.days.map(d=>d.id===dayId?{...d,endLocation:sheet.name||'',endLat:sheet.lat||null,endLng:sheet.lng||null}:d),
      interestBank:_newBankEnd});
    toast(`"${sheet.name}" הוגדר כנקודת יעד ונוסף לבנק ✓`,'s');
    setDaySelPlace(null);setDaySelMode(null);
  };

  return(
    <div className={`screen map-screen${active?'':' h'}`}>
      {/* map div — always rendered */}
      <div ref={mapDivRef} className="map-container"/>

      {/* pick mode banner */}
      {mapPickLabel&&(
        <div style={{position:'absolute',top:0,left:0,right:0,zIndex:100,
          background:'rgba(20,30,80,.94)',backdropFilter:'blur(4px)',
          padding:'12px 14px',display:'flex',alignItems:'center',gap:10,
          boxShadow:'0 4px 16px rgba(0,0,0,.4)',borderBottom:'2px solid var(--accent2)'}}>
          <span style={{flex:1,color:'#fff',fontWeight:700,fontSize:14,lineHeight:1.3}}>{mapPickLabel}</span>
          <button onClick={onCancelMapPick}
            style={{background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.3)',
              borderRadius:8,color:'#fff',fontSize:12,fontWeight:700,cursor:'pointer',
              padding:'6px 12px',fontFamily:'Heebo,sans-serif',flexShrink:0}}>
            ביטול
          </button>
        </div>
      )}

      {/* loading overlay */}
      {!mapsReady&&<div className="map-loading"><div className="spinner"/><div style={{color:'var(--text3)',fontSize:13}}>טוען מפה...</div></div>}

      {/* search bar */}
      <div className="map-searchbar">
        <input ref={srchInputRef} className="map-si" placeholder="🔍 חיפוש מקומות..." dir="rtl"
          onKeyDown={e=>e.key==='Enter'&&doSearch()}/>
        <button onClick={doSearch} style={{background:'var(--accent)',border:'none',borderRadius:10,color:'#fff',padding:'0 14px',fontFamily:'Heebo,sans-serif',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:'0 2px 10px rgba(0,0,0,.4)'}}>חפש</button>
      </div>

      {/* current location FAB */}
      <button className="map-fab loc-fab" onClick={goLoc} title="מיקום נוכחי">◎</button>

      {/* zoom +/− buttons */}
      <div style={{position:'absolute',left:14,bottom:68,zIndex:10,display:'flex',flexDirection:'column',gap:4}}>
        <button onClick={()=>mapRef.current?.setZoom((mapRef.current.getZoom()||8)+1)}
          style={{width:44,height:44,borderRadius:12,border:'1px solid var(--border)',background:'var(--bg2)',
            color:'var(--text)',fontSize:24,fontWeight:300,cursor:'pointer',display:'flex',alignItems:'center',
            justifyContent:'center',boxShadow:'0 2px 10px rgba(0,0,0,.5)',lineHeight:1}}>+</button>
        <button onClick={()=>mapRef.current?.setZoom(Math.max(1,(mapRef.current.getZoom()||8)-1))}
          style={{width:44,height:44,borderRadius:12,border:'1px solid var(--border)',background:'var(--bg2)',
            color:'var(--text)',fontSize:24,fontWeight:300,cursor:'pointer',display:'flex',alignItems:'center',
            justifyContent:'center',boxShadow:'0 2px 10px rgba(0,0,0,.5)',lineHeight:1}}>−</button>
      </div>

      {/* loading indicator */}
      {loading&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',zIndex:20,background:'var(--bg2)',borderRadius:50,padding:14,border:'1px solid var(--border)'}}>
        <div className="spinner"/>
      </div>}

      {/* bottom sheet overlay */}
      {sheet&&!mapPickLabel&&<div className="sheet-ov" onClick={()=>setSheet(null)}/>}

      {/* bottom sheet */}
      <div className={`bsheet${sheet&&!mapPickLabel?' open':''}`}>
        <div className="bsheet-handle"/>
        {sheet&&<>
          <div className="bsheet-name">{sheet.name||'מקום לא ידוע'}</div>
          {(sheet.types?.length>0||sheet.placeType)&&<div className="bsheet-type">{getTypeLabel(sheet.types)||sheet.placeType}</div>}
          <div style={{padding:'0 16px 4px',display:'flex',flexWrap:'wrap',gap:'6px 14px',alignItems:'center'}}>
            {sheet.rating&&<span style={{fontSize:13,color:'var(--amber)'}}>⭐ {sheet.rating}</span>}
            {sheet.openStatus&&<span style={{fontSize:12,fontWeight:600,
              color:sheet.openStatus==='פתוח עכשיו'?'var(--green)':'var(--red)'}}>
              {sheet.openStatus==='פתוח עכשיו'?'✅':'🔴'} {sheet.openStatus}
            </span>}
          </div>
          {sheet.todayHours&&<div style={{padding:'0 16px 4px',fontSize:12,color:'var(--text3)'}}>🕐 {sheet.todayHours}</div>}
          {sheet.phone&&<div style={{padding:'0 16px 4px',fontSize:12,color:'var(--accent2)'}}>📞 {sheet.phone}</div>}
          {sheet.website&&<div style={{padding:'0 16px 4px'}}>
            <a href={sheet.website} target="_blank" rel="noreferrer"
              style={{fontSize:12,color:'var(--accent2)',textDecoration:'none'}}>
              🌐 {sheet.website.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}
            </a>
          </div>}
          {sheet.address&&<div className="bsheet-addr">📍 {sheet.address}</div>}
          <div className="bsheet-actions">
            {!sheet.inBank&&<button className="bsheet-btn bank" onClick={addToBank}>⭐ שמור לבנק</button>}
            {sheet.inBank&&<div style={{padding:'11px 10px',fontSize:12,color:'var(--amber)',fontWeight:600}}>⭐ כבר בבנק</div>}
            {(trip?.days||[]).length>0&&<button className="bsheet-btn sched" onClick={()=>{setDaySelPlace(sheet);setDaySelMode('sched');}}>📅 הוסף ללוז</button>}
            {(trip?.days||[]).length>0&&<button className="bsheet-btn"
              style={{background:'rgba(139,92,246,.12)',color:'#8b5cf6',border:'1px solid rgba(139,92,246,.3)',minWidth:120}}
              onClick={()=>{setDaySelPlace(sheet);setDaySelMode('dayBank');}}>📌 בנק יומי</button>}
            {(trip?.days||[]).length>0&&<button className="bsheet-btn"
              style={{background:'rgba(34,197,94,.12)',color:'var(--green)',border:'1px solid rgba(34,197,94,.3)',minWidth:120}}
              onClick={()=>{setDaySelPlace(sheet);setDaySelMode('start');}}>🟢 מוצא ליום</button>}
            {(trip?.days||[]).length>0&&<button className="bsheet-btn"
              style={{background:'rgba(239,68,68,.1)',color:'var(--red)',border:'1px solid rgba(239,68,68,.25)',minWidth:120}}
              onClick={()=>{setDaySelPlace(sheet);setDaySelMode('end');}}>🔴 יעד ליום</button>}
          </div>
        </>}
      </div>

      {/* day selector */}
      {daySelPlace&&<DaySelector
        days={trip?.days||[]}
        title={daySelMode==='start'?'🟢 קבע כנקודת מוצא ליום:':daySelMode==='end'?'🔴 קבע כנקודת יעד ליום:':daySelMode==='dayBank'?'📌 הוסף לבנק יומי של יום:':'📅 הוסף לאיזה יום?'}
        onSelect={daySelMode==='start'?setDayStart:daySelMode==='end'?setDayEnd:daySelMode==='dayBank'?addToDayBank:addToSchedule}
        onClose={()=>{setDaySelPlace(null);setDaySelMode(null);}}/>}
    </div>
  );
}

/* ════════════════════════════════
   BLOCK EDIT SHEET (mobile)
════════════════════════════════ */
function BlockEditSheet({block,onSave,onDelete,onClose,isNew,prevEndTime,onCascadeSave,onCascadeSaveUnlink}){
  const[b,setB]=useState({...block});
  const[timeError,setTimeError]=useState(false);
  const[unlinkPrompt,setUnlinkPrompt]=useState(false);
  const origStartTime=useRef(block.startTime);
  const origEndTime=useRef(block.endTime);
  const upd=(k,v)=>{
    if(k==='startTime'){
      setB(p=>{
        const durMins=p.endTime&&p.startTime?Math.max(15,toMinsStr(p.endTime)-toMinsStr(p.startTime)):60;
        return{...p,startTime:v,endTime:addMins(v,durMins)};
      });
      setTimeError(false);setUnlinkPrompt(false);
    }else{
      setB(p=>({...p,[k]:v}));
    }
  };
  const doSave=(unlink=false)=>{
    const timeChanged=b.startTime!==origStartTime.current||b.endTime!==origEndTime.current;
    if(unlink&&onCascadeSaveUnlink){onCascadeSaveUnlink(b);}
    else if(!isNew&&timeChanged&&onCascadeSave){onCascadeSave(b);}
    else{onSave(b);}
  };
  const handleSave=()=>{
    if(prevEndTime){
      const prevMins=toMinsStr(prevEndTime),newMins=toMinsStr(b.startTime||'00:00');
      if(newMins<prevMins){setTimeError(true);return;}
      setTimeError(false);
      const wasLinked=origStartTime.current===prevEndTime;
      if(wasLinked&&newMins>prevMins){setUnlinkPrompt(true);return;}
    }
    doSave(false);
  };
  const inp={background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
    padding:'9px 11px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:14,outline:'none',direction:'rtl'};
  const lbl={fontSize:11,fontWeight:600,color:'var(--text3)',display:'block',marginBottom:4};
  return(
    <>
      <div className="sheet-ov" onClick={onClose}/>
      <div className="bsheet open" style={{maxHeight:'86vh',paddingBottom:'calc(var(--safe-b) + 8px)'}}>
        <div className="bsheet-handle"/>
        <div style={{overflowY:'auto',padding:'2px 16px 16px'}}>
          <div style={{fontWeight:700,fontSize:16,marginBottom:12}}>{isNew?'➕ פעילות חדשה':'✏️ עריכת פעילות'}</div>
          {/* type chips */}
          <div style={{display:'flex',gap:5,marginBottom:14,overflowX:'auto',paddingBottom:2}}>
            {BLOCK_TYPES.map(t=>(
              <button key={t} onClick={()=>upd('type',t)}
                style={{padding:'5px 11px',borderRadius:10,
                  border:`1px solid ${b.type===t?BLOCK_COLOR[t]:'var(--border)'}`,
                  background:b.type===t?BLOCK_COLOR[t]+'33':'transparent',
                  color:b.type===t?BLOCK_COLOR[t]:'var(--text3)',
                  fontSize:12,fontWeight:700,fontFamily:'Heebo,sans-serif',
                  cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
                {BLOCK_EMOJI[t]} {BLOCK_HE[t]}
              </button>
            ))}
          </div>
          {/* title */}
          <div style={{marginBottom:10}}>
            <label style={lbl}>שם / כותרת</label>
            <input value={b.title||''} onChange={e=>upd('title',e.target.value)}
              placeholder={`${BLOCK_EMOJI[b.type]} ${BLOCK_HE[b.type]}`}
              style={{...inp,width:'100%'}}/>
          </div>
          {/* times */}
          <div style={{display:'flex',gap:10,marginBottom:10}}>
            <div style={{flex:1}}>
              <label style={lbl}>שעת התחלה</label>
              <input type="time" value={b.startTime||''} onChange={e=>upd('startTime',e.target.value)}
                style={{...inp,direction:'ltr',width:'100%'}}/>
              {prevEndTime&&!unlinkPrompt&&b.startTime&&toMinsStr(b.startTime)>toMinsStr(prevEndTime)&&<div style={{fontSize:10,color:'var(--amber)',marginTop:3}}>
                🔗 קודם: {prevEndTime}
                <button onClick={()=>upd('startTime',prevEndTime)}
                  style={{marginRight:5,fontSize:10,padding:'1px 6px',borderRadius:4,border:'1px solid var(--amber)',background:'rgba(234,179,8,.12)',color:'var(--amber)',cursor:'pointer',fontFamily:'Heebo,sans-serif'}}>סנכרן</button>
              </div>}
            </div>
            <div style={{flex:1}}>
              <label style={lbl}>שעת סיום</label>
              <input type="time" value={b.endTime||''} onChange={e=>upd('endTime',e.target.value)}
                style={{...inp,direction:'ltr',width:'100%'}}/>
            </div>
          </div>
          {/* notes */}
          <div style={{marginBottom:12}}>
            <label style={lbl}>הערות</label>
            <textarea value={b.note||''} onChange={e=>upd('note',e.target.value)}
              rows={3} placeholder="תזכורות, מידע נוסף..."
              style={{...inp,width:'100%',resize:'none',lineHeight:1.55}}/>
          </div>
          {/* place info (readonly) */}
          {(b.address||b.placeRating||b.placeOpenStatus||b.placeWebsite||b.placePhone||b.placeTodayHours)&&(
            <div style={{background:'var(--bg3)',borderRadius:10,padding:10,marginBottom:12,
              border:'1px solid var(--border)'}}>
              <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:6}}>📍 מידע מגוגל</div>
              {b.address&&<div style={{fontSize:12,color:'var(--text2)',marginBottom:3}}>📍 {b.address}</div>}
              {b.placeType&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>{b.placeType}</div>}
              <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:3}}>
                {b.placeRating&&<span style={{fontSize:12,color:'var(--amber)'}}>⭐ {b.placeRating}</span>}
                {b.placeOpenStatus&&<span style={{fontSize:12,fontWeight:600,
                  color:b.placeOpenStatus==='פתוח עכשיו'?'var(--green)':'var(--red)'}}>
                  {b.placeOpenStatus==='פתוח עכשיו'?'✅':'🔴'} {b.placeOpenStatus}
                </span>}
              </div>
              {b.placeTodayHours&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>🕐 {b.placeTodayHours}</div>}
              {b.placePhone&&<a href={`tel:${b.placePhone}`} style={{fontSize:12,color:'var(--accent2)',display:'block',marginBottom:3}}>📞 {b.placePhone}</a>}
              {b.placeWebsite&&<a href={b.placeWebsite} target="_blank" rel="noreferrer"
                style={{fontSize:12,color:'var(--accent2)',display:'block',wordBreak:'break-all'}}>
                🌐 {b.placeWebsite.replace(/^https?:\/\//,'').split('/')[0]}
              </a>}
            </div>
          )}
          {/* שגיאת חפיפה */}
          {timeError&&<div style={{background:'rgba(239,68,68,.12)',border:'1px solid var(--red)',borderRadius:10,padding:'10px 12px',marginBottom:10}}>
            <div style={{fontSize:12,color:'var(--red)',fontWeight:700}}>⛔ חפיפה — הפעילות הקודמת מסתיימת ב-{prevEndTime}</div>
          </div>}
          {/* ניתוק קשר */}
          {unlinkPrompt&&<div style={{background:'rgba(234,179,8,.1)',border:'1px solid var(--amber)',borderRadius:10,padding:'10px 12px',marginBottom:10}}>
            <div style={{fontSize:12,color:'var(--amber)',fontWeight:700,marginBottom:4}}>🔓 נוצר פער מהפעילות הקודמת</div>
            <div style={{fontSize:11,color:'var(--text2)',marginBottom:8}}>לנתק? הנסיעה (אם קיימת) תוסר. הפעילויות הבאות יתעדכנו אוטומטית.</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={()=>doSave(true)}
                style={{flex:1,background:'var(--amber)',color:'#000',border:'none',borderRadius:8,padding:'8px',fontFamily:'Heebo,sans-serif',fontSize:12,fontWeight:700,cursor:'pointer'}}>
                כן, נתק ועדכן ↕
              </button>
              <button onClick={()=>{setUnlinkPrompt(false);setB(p=>({...p,startTime:origStartTime.current,endTime:origEndTime.current}));}}
                style={{flex:1,background:'var(--surface)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:8,padding:'8px',fontFamily:'Heebo,sans-serif',fontSize:12,cursor:'pointer'}}>
                לא, שמור קשר
              </button>
            </div>
          </div>}
          {/* actions */}
          <div style={{display:'flex',gap:8}}>
            <button onClick={handleSave}
              style={{flex:2,background:'var(--accent)',color:'#fff',border:'none',borderRadius:10,
                padding:'13px',fontFamily:'Heebo,sans-serif',fontSize:14,fontWeight:700,cursor:'pointer'}}>
              ✓ שמור
            </button>
            <button onClick={onClose}
              style={{flex:1,background:'var(--surface)',color:'var(--text)',border:'1px solid var(--border)',
                borderRadius:10,padding:'13px',fontFamily:'Heebo,sans-serif',fontSize:14,fontWeight:600,cursor:'pointer'}}>
              ביטול
            </button>
            <button onClick={()=>onDelete(b.id)}
              style={{background:'rgba(239,68,68,.12)',color:'var(--red)',
                border:'1px solid rgba(239,68,68,.3)',borderRadius:10,
                padding:'13px 16px',fontFamily:'Heebo,sans-serif',fontSize:18,cursor:'pointer'}}>
              🗑
            </button>
          </div>
        </div>
      </div>
    </>
  );
}

/* ════════════════════════════════
   LOCATION PICKER SHEET
════════════════════════════════ */
const BANK_SRC_PICKER={liked:{emoji:'❤️',color:'#ec4899'},wantToGo:{emoji:'🏴',color:'#22c55e'},saved:{emoji:'⭐',color:'#f59e0b'},list:{emoji:'📋',color:'#6366f1'},itinerary:{emoji:'🧳',color:'#2563eb'}};
function LocationPickerSheet({bank,title,onPick,onPickFromMap,onClose,onCreateEmpty}){
  const[search,setSearch]=useState('');
  const inp={background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:7,
    padding:'8px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,
    outline:'none',width:'100%',direction:'rtl',boxSizing:'border-box'};
  const q=search.trim().toLowerCase();
  const filtered=bank.filter(i=>!q||(i.name||'').toLowerCase().includes(q)||(i.address||'').toLowerCase().includes(q));
  return(
    <>
      <div className="sheet-ov" onClick={onClose}/>
      <div className="bsheet open" style={{maxHeight:'82vh'}}>
        <div className="bsheet-handle"/>
        <div style={{padding:'4px 16px 16px',display:'flex',flexDirection:'column',maxHeight:'78vh'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10,flexShrink:0}}>
            <div style={{fontWeight:700,fontSize:15}}>{title}</div>
            <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'var(--text3)'}}>✕</button>
          </div>
          {onPickFromMap&&(
            <button onClick={onPickFromMap} style={{width:'100%',padding:'10px',marginBottom:8,flexShrink:0,
              background:'rgba(79,142,247,.12)',border:'1px solid rgba(79,142,247,.3)',
              borderRadius:8,color:'var(--accent2)',fontSize:13,fontWeight:700,
              cursor:'pointer',fontFamily:'Heebo,sans-serif',display:'flex',
              alignItems:'center',justifyContent:'center',gap:6}}>
              🗺️ בחר מהמפה
            </button>
          )}
          {onCreateEmpty&&(
            <button onClick={onCreateEmpty} style={{width:'100%',padding:'10px',marginBottom:10,flexShrink:0,
              background:'var(--bg3)',border:'1px solid var(--border)',
              borderRadius:8,color:'var(--text2)',fontSize:13,fontWeight:600,
              cursor:'pointer',fontFamily:'Heebo,sans-serif',display:'flex',
              alignItems:'center',justifyContent:'center',gap:6}}>
              ✍️ הוסף ידנית (ריק)
            </button>
          )}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="חפש מקום בבנק..." style={{...inp,flexShrink:0}}/>
          <div style={{overflowY:'auto',flex:1,marginTop:8}}>
            {filtered.length===0
              ?<div style={{padding:'20px',textAlign:'center',color:'var(--text3)',fontSize:13}}>
                {bank.length===0?'הבנק ריק — הוסף מקומות קודם':'אין תוצאות'}
              </div>
              :filtered.map(item=>{
                const src=BANK_SRC_PICKER[item._listSource]||null;
                return(
                <div key={item.id} onClick={()=>onPick(item)}
                  style={{padding:'10px 6px',borderRadius:8,cursor:'pointer',
                    borderBottom:'1px solid var(--border)',display:'flex',gap:10,alignItems:'center'}}>
                  <span style={{fontSize:18}}>{getTypeEmoji(item.types||[])}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:600,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
                    {item.address&&<div style={{fontSize:11,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.address}</div>}
                  </div>
                  {src&&<span style={{fontSize:14,flexShrink:0,opacity:.8}}>{src.emoji}</span>}
                </div>
              )})
            }
          </div>
        </div>
      </div>
    </>
  );
}

/* ════════════════════════════════
   SCHEDULE SCREEN — day-by-day
════════════════════════════════ */
function ScheduleScreen({trip,active,onShowOnMap,onUpdate,settings,onPickFromMap}){
  const[dayIdx,setDayIdx]=useState(0);
  const[travelTimes,setTravelTimes]=useState({});
  const[editing,setEditing]=useState(null);
  const[locationPicking,setLocationPicking]=useState(null); // {field:'start'|'end'}
  const[bankPickForBlock,setBankPickForBlock]=useState(null); // {type} — show bank picker for adding block
  const[,setTick]=useState(0);
  const[inlineNote,setInlineNote]=useState(null); // {blockId, value}
  const[dayWx,setDayWx]=useState(null); // מזג אוויר לכרטיס הנוכחי
  const[transitSearch,setTransitSearch]=useState(null); // {loading,fromBlockId,toBlockId,results,error}
  const[showDayBank,setShowDayBank]=useState(false);
  const[swapSrc,setSwapSrc]=useState(null); // פריט בנק יומי הממתין להחלפה עם בלוק
  // drag-and-drop state
  const dragIdxRef=useRef(null);
  const[dragSrc,setDragSrc]=useState(null);
  const[dragOver,setDragOver]=useState(null);

  const days=trip?.days||[];
  const safeIdx=Math.min(dayIdx,Math.max(0,days.length-1));
  const day=days[safeIdx];

  // clock tick for "now" indicator (every 30s)
  useEffect(()=>{const t=setInterval(()=>setTick(n=>n+1),30000);return()=>clearInterval(t);},[]);

  // מזג אוויר — נקודת יעד היום, ואם אין — מיקום נוכחי
  useEffect(()=>{
    setDayWx(null);
    if(!day?.date)return;
    let cancelled=false;
    (async()=>{
      const lat=day.endLat,lng=day.endLng;
      const pos=lat&&lng?{lat,lng}:await getUserLoc();
      if(!pos||cancelled)return;
      const wx=await fetchWeatherDay(pos.lat,pos.lng,day.date);
      if(wx&&!cancelled)setDayWx(wx);
    })();
    return()=>{cancelled=true;};
  },[day?.id,day?.endLat,day?.endLng,day?.date]);// eslint-disable-line

  // sorted blocks
  const sorted=useMemo(()=>
    [...(day?.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')),
  [day?.blocks]);

  /* ── OSRM travel times (including start/end location) ── */
  const blocksKey=sorted.map(b=>b.id).join(',');
  useEffect(()=>{
    setTravelTimes({});
    const bankItems=trip?.interestBank||[];
    if(sorted.length<1)return;
    let cancelled=false;
    const getCoords=blk=>{
      if(blk.lat&&blk.lng)return{lat:blk.lat,lng:blk.lng};
      if(blk.placeId){const bi=bankItems.find(x=>x.placeId===blk.placeId);if(bi?.lat&&bi?.lng)return{lat:bi.lat,lng:bi.lng};}
      return null;
    };
    const distKm=(a,b)=>{const dLat=a.lat-b.lat,dLng=(a.lng-b.lng)*Math.cos(a.lat*Math.PI/180);return Math.sqrt(dLat*dLat+dLng*dLng)*111;};
    (async()=>{
      // start location → first block
      if(day?.startLat&&day?.startLng&&sorted[0].type!=='travel'){
        const fc=getCoords(sorted[0]);
        if(fc&&!cancelled){
          const key=`__start__->${sorted[0].id}`;
          setTravelTimes(prev=>({...prev,[key]:{loading:true,min:null}}));
          const res=await fetchOsrmMinutes(day.startLat,day.startLng,fc.lat,fc.lng)||{min:null,km:null};
          if(!cancelled)setTravelTimes(prev=>({...prev,[key]:{loading:false,min:res.min,km:res.km}}));
          // walking preview for short segments
          if(!cancelled&&distKm({lat:day.startLat,lng:day.startLng},fc)<=10){
            const wres=await fetchOsrmMinutes(day.startLat,day.startLng,fc.lat,fc.lng,'foot')||{min:null};
            if(!cancelled)setTravelTimes(prev=>({...prev,[`walk:${key}`]:{loading:false,min:wres.min}}));
          }
        }
      }
      // between consecutive blocks
      for(let i=0;i<sorted.length-1;i++){
        if(cancelled)break;
        const a=sorted[i],nb=sorted[i+1];
        if(a.type==='travel'||nb.type==='travel')continue;
        const ac=getCoords(a),bc=getCoords(nb);
        if(!ac||!bc)continue;
        const key=`${a.id}->${nb.id}`;
        setTravelTimes(prev=>({...prev,[key]:{loading:true,min:null}}));
        const res=await fetchOsrmMinutes(ac.lat,ac.lng,bc.lat,bc.lng)||{min:null,km:null};
        if(!cancelled)setTravelTimes(prev=>({...prev,[key]:{loading:false,min:res.min,km:res.km}}));
        if(!cancelled&&distKm(ac,bc)<=10){
          const wres=await fetchOsrmMinutes(ac.lat,ac.lng,bc.lat,bc.lng,'foot')||{min:null};
          if(!cancelled)setTravelTimes(prev=>({...prev,[`walk:${key}`]:{loading:false,min:wres.min}}));
        }
      }
      // last block → end location
      const last=sorted[sorted.length-1];
      if(day?.endLat&&day?.endLng&&last.type!=='travel'){
        const lc=getCoords(last);
        if(lc&&!cancelled){
          const key=`${last.id}->__end__`;
          setTravelTimes(prev=>({...prev,[key]:{loading:true,min:null}}));
          const res=await fetchOsrmMinutes(lc.lat,lc.lng,day.endLat,day.endLng)||{min:null,km:null};
          if(!cancelled)setTravelTimes(prev=>({...prev,[key]:{loading:false,min:res.min,km:res.km}}));
          if(!cancelled&&distKm(lc,{lat:day.endLat,lng:day.endLng})<=10){
            const wres=await fetchOsrmMinutes(lc.lat,lc.lng,day.endLat,day.endLng,'foot')||{min:null};
            if(!cancelled)setTravelTimes(prev=>({...prev,[`walk:${key}`]:{loading:false,min:wres.min}}));
          }
        }
      }
    })();
    return()=>{cancelled=true;};
  },[blocksKey,day?.id,day?.startLat,day?.startLng,day?.endLat,day?.endLng]);// eslint-disable-line

  /* swipe */
  const touchX=useRef(null);
  const onTS=e=>{touchX.current=e.touches[0].clientX;};
  const onTE=e=>{
    if(touchX.current===null)return;
    const dx=e.changedTouches[0].clientX-touchX.current;
    touchX.current=null;
    if(Math.abs(dx)<50)return;
    if(dx<0)setDayIdx(i=>Math.min(days.length-1,i+1));
    else setDayIdx(i=>Math.max(0,i-1));
  };

  // day update helper
  const updDay=upd=>{
    if(!onUpdate||!trip||!day)return;
    onUpdate({...trip,days:trip.days.map(d=>d.id===day.id?{...d,...upd}:d)});
  };

  // drag-and-drop reorder — מחשב מחדש startTime/endTime אחרי הזזה
  const handleDrop=(fromIdx,toIdx)=>{
    if(fromIdx===null||toIdx===null||fromIdx===toIdx)return;
    if(sorted[fromIdx]?.isAutoTravel)return; // נסיעות אוטומטיות לא ניתנות להזזה
    const arr=[...sorted];
    const[moved]=arr.splice(fromIdx,1);
    arr.splice(toIdx,0,moved);
    // הסרת בלוקי נסיעה אוטומטיים שהפכו לא-רלוונטיים — OSRM יציע מחדש
    const clean=arr.filter(b=>!b.isAutoTravel);
    if(!clean.length)return;
    let t=clean[0].startTime||'09:00';
    const reordered=clean.map(b=>{
      const dur=b.endTime&&b.startTime?Math.max(1,toMinsStr(b.endTime)-toMinsStr(b.startTime)):60;
      const nb={...b,startTime:t,endTime:addMins(t,dur)};
      t=nb.endTime;
      return nb;
    });
    updDay({blocks:reordered});
    toast('סדר הפעילויות עודכן ✓','s');
  };

  // block operations
  const saveInlineNote=(blockId,note)=>{
    const blk=(day.blocks||[]).find(b=>b.id===blockId);
    if(!blk)return;
    const trimmed=note.trim();
    // עדכן הערה על הבלוק וגם על פריט הבנק המקושר (אם קיים)
    const newBank=blk.placeId
      ?(trip.interestBank||[]).map(i=>i.placeId===blk.placeId?{...i,note:trimmed}:i)
      :(trip.interestBank||[]);
    onUpdate({...trip,
      days:trip.days.map(d=>d.id===day.id?{...d,blocks:d.blocks.map(b=>b.id===blockId?{...b,note:trimmed}:b)}:d),
      interestBank:newBank});
    setInlineNote(null);
  };

  // החלפת פריט בנק יומי עם בלוק קיים בלוז — הבלוק הישן חוזר לבנק היומי
  const executeSwap=(bankItem,targetBlock)=>{
    const nb={
      id:uid(),type:'activity',
      title:bankItem.name,
      startTime:targetBlock.startTime,
      endTime:targetBlock.endTime,
      note:bankItem.note||'',
      address:bankItem.address||'',
      lat:bankItem.lat||null,lng:bankItem.lng||null,
      placeId:bankItem.placeId||'',
      placeRating:bankItem.rating||null,placeType:bankItem.placeType||'',
      placeOpenStatus:bankItem.openStatus||'',placeTodayHours:bankItem.todayHours||'',
      placePhone:bankItem.phone||'',placeWebsite:bankItem.website||'',
    };
    const oldItem={
      id:uid(),name:targetBlock.title||'פעילות',
      address:targetBlock.address||'',
      lat:targetBlock.lat||null,lng:targetBlock.lng||null,
      placeId:targetBlock.placeId||'',
      note:targetBlock.note||'',
      rating:targetBlock.placeRating||null,placeType:targetBlock.placeType||'',
      openStatus:targetBlock.placeOpenStatus||'',todayHours:targetBlock.placeTodayHours||'',
      phone:targetBlock.placePhone||'',website:targetBlock.placeWebsite||'',
    };
    const newBlocks=(day.blocks||[]).map(b=>b.id===targetBlock.id?nb:b);
    const newDayBank=[...(day.dayBank||[]).filter(i=>i.id!==bankItem.id),oldItem];
    onUpdate({...trip,days:trip.days.map(d=>d.id===day.id?{...d,blocks:newBlocks,dayBank:newDayBank}:d)});
    setSwapSrc(null);
    toast(`"${bankItem.name}" הוחלף עם "${targetBlock.title||'פעילות'}" 🔄`,'s');
  };

  const deleteBlock=id=>{
    const blks=[...(day.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const idx=blks.findIndex(b=>b.id===id);
    if(idx<0){setEditing(null);return;}
    const toRemove=new Set([id]);
    if(idx>0&&blks[idx-1].isAutoTravel)toRemove.add(blks[idx-1].id);
    if(idx<blks.length-1&&blks[idx+1].isAutoTravel)toRemove.add(blks[idx+1].id);
    const remaining=blks.filter(b=>!toRemove.has(b.id));
    // cascade הפעילויות שאחרי כדי לסגור את הפער
    const deletedStart=blks[idx].startTime||'';
    const pivotIdx=remaining.findIndex(b=>(b.startTime||'')>deletedStart);
    if(pivotIdx>0){
      const anchor=remaining[pivotIdx-1];
      const anchorEnd=anchor.endTime||addMins(anchor.startTime||'09:00',60);
      let t=anchorEnd;
      const cascaded=remaining.map((b,i)=>{
        if(i<pivotIdx)return b;
        const dur=b.endTime&&b.startTime?Math.max(1,toMinsStr(b.endTime)-toMinsStr(b.startTime)):60;
        const nb={...b,startTime:t,endTime:addMins(t,dur)};t=nb.endTime;return nb;
      });
      onUpdate({...trip,days:trip.days.map(d=>d.id===day.id?{...d,blocks:cascaded}:d)});
    }else{
      updDay({blocks:remaining});
    }
    setEditing(null);
    toast('פעילות הוסרה','i');
  };
  const saveBlock=updated=>{
    const {_isNew,...block}=updated; // strip internal flag
    const exists=(day?.blocks||[]).some(b=>b.id===block.id);
    // new block → append; existing block → update in place
    const newDays=exists
      ?trip.days.map(d=>d.id===day.id?{...d,blocks:(d.blocks||[]).map(b=>b.id===block.id?block:b)}:d)
      :trip.days.map(d=>d.id===day.id?{...d,blocks:[...(d.blocks||[]),block]}:d);
    // sync note to matching bank item (by placeId)
    const newBank=block.placeId
      ?(trip.interestBank||[]).map(i=>i.placeId===block.placeId?{...i,note:block.note||''}:i)
      :(trip.interestBank||[]);
    onUpdate({...trip,days:newDays,interestBank:newBank});
    setEditing(null);
  };
  // קשר פעילויות — עדכן שעות מ-fromIdx ואילך
  const cascadeFrom=fromIdx=>{
    if(fromIdx<=0||fromIdx>=sorted.length)return;
    const prev=sorted[fromIdx-1];
    const prevEnd=prev.endTime||addMins(prev.startTime||'09:00',60);
    let t=prevEnd;
    const tail=sorted.slice(fromIdx).map(b=>{
      const dur=b.endTime&&b.startTime?Math.max(1,toMinsStr(b.endTime)-toMinsStr(b.startTime)):60;
      const nb={...b,startTime:t,endTime:addMins(t,dur)};
      t=nb.endTime;
      return nb;
    });
    const ids=new Set(tail.map(b=>b.id));
    const newBlocks=[...(day.blocks||[]).filter(b=>!ids.has(b.id)),...tail];
    updDay({blocks:newBlocks});
    toast('פעילויות קושרו ✓','s');
  };
  // שמירה עם עדכון שרשרתי
  const cascadeSaveBlock=updated=>{
    const {_isNew,...block}=updated;
    const allBlocks=(day?.blocks||[]).map(b=>b.id===block.id?block:b);
    const sortedUpd=[...allBlocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const siNew=sortedUpd.findIndex(b=>b.id===block.id);
    let t=block.endTime||addMins(block.startTime||'09:00',60);
    const tail=sortedUpd.slice(siNew+1).map(b=>{
      const dur=b.endTime&&b.startTime?Math.max(1,toMinsStr(b.endTime)-toMinsStr(b.startTime)):60;
      const nb={...b,startTime:t,endTime:addMins(t,dur)};
      t=nb.endTime;
      return nb;
    });
    const ids=new Set(tail.map(b=>b.id));
    const finalBlocks=[...allBlocks.filter(b=>!ids.has(b.id)),...tail];
    const newBank=block.placeId?(trip.interestBank||[]).map(i=>i.placeId===block.placeId?{...i,note:block.note||''}:i):(trip.interestBank||[]);
    onUpdate({...trip,days:trip.days.map(d=>d.id===day.id?{...d,blocks:finalBlocks}:d),interestBank:newBank});
    setEditing(null);
    toast('שעות עודכנו ✓','s');
  };
  // ניתוק + cascade — מסיר נסיעה לפני הבלוק ומעדכן שרשרת
  const cascadeSaveBlockUnlink=updated=>{
    const {_isNew,...block}=updated;
    let allBlocks=(day?.blocks||[]).map(b=>b.id===block.id?block:b);
    // מסיר נסיעה אוטומטית שמיד לפני הבלוק המעודכן
    const sortedAll=[...allBlocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const si=sortedAll.findIndex(b=>b.id===block.id);
    if(si>0&&sortedAll[si-1].isAutoTravel){
      allBlocks=allBlocks.filter(b=>b.id!==sortedAll[si-1].id);
    }
    const sortedUpd=[...allBlocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const siNew=sortedUpd.findIndex(b=>b.id===block.id);
    let t=block.endTime||addMins(block.startTime||'09:00',60);
    const tail=sortedUpd.slice(siNew+1).map(b=>{
      const dur=b.endTime&&b.startTime?Math.max(1,toMinsStr(b.endTime)-toMinsStr(b.startTime)):60;
      const nb={...b,startTime:t,endTime:addMins(t,dur)};t=nb.endTime;return nb;
    });
    const ids=new Set(tail.map(b=>b.id));
    const finalBlocks=[...allBlocks.filter(b=>!ids.has(b.id)),...tail];
    const newBank=block.placeId?(trip.interestBank||[]).map(i=>i.placeId===block.placeId?{...i,note:block.note||''}:i):(trip.interestBank||[]);
    onUpdate({...trip,days:trip.days.map(d=>d.id===day.id?{...d,blocks:finalBlocks}:d),interestBank:newBank});
    setEditing(null);
