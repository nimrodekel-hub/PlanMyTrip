      {!trip&&<div className="empty"><div className="eicon">⭐</div><div className="etitle">אין טיול פעיל</div></div>}
      {trip&&bank.length===0&&<div className="empty"><div className="eicon">⭐</div><div className="etitle">בנק האטרקציות ריק</div><div className="edesc">הוסף אטרקציות דרך אפליקציית המחשב או מהמפה</div></div>}
      {search&&displayItems.length===0&&<div className="empty"><div className="eicon">🔍</div><div className="etitle">אין תוצאות</div></div>}

      {/* flat list — search results or distance sort */}

        <div style={{flex:1,overflowY:'auto'}}>
          <div className="card" style={{margin:'12px 14px'}}>
            {displayItems.map(item=><BankItem key={item.id} item={item}/>)}
          </div>
          <div style={{height:16}}/>
        </div>

      {/* grouped by country — collapsible, default closed */}
      {!showFlat&&grouped.length>0&&(
        <div style={{flex:1,overflowY:'auto'}}>
          {grouped.map(([country,items])=>{
            const isOpen=expanded.has(country);
            return(
              <div key={country}>
                {/* country header — tap to expand/collapse */}
                <div onClick={()=>toggleCountry(country)}
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    padding:'11px 16px',cursor:'pointer',userSelect:'none',
                    background:'var(--bg2)',borderBottom:'1px solid var(--border)',
                    borderTop:'1px solid var(--border)',marginTop:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:13,fontWeight:700,color:'var(--text2)'}}>{country}</span>
                    <span style={{fontSize:11,color:'var(--text3)',background:'var(--surface)',
                      border:'1px solid var(--border)',borderRadius:10,padding:'1px 7px'}}>
                      {items.length}
                    </span>
                  </div>
                  <span style={{fontSize:14,color:'var(--text3)',transition:'transform .2s',
                    display:'inline-block',transform:isOpen?'rotate(180deg)':'rotate(0deg)'}}>
                    ›

                </div>

                {isOpen&&(
                  <div className="card" style={{margin:'0 14px 10px',borderRadius:'0 0 10px 10px'}}>
                    {items.map(item=><BankItem key={item.id} item={item}/>)}

          <div style={{height:16}}/>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════
   LISTS SCREEN — shopping/packing/notes/docs
════════════════════════════════ */
function ListsScreen({trip,active,onUpdate}){
  const[sub,setSub]=useState('shopping');
  const tabs=[{id:'shopping',label:'🛒 קניות'},{id:'packing',label:'🎒 ציוד'},{id:'notes',label:'📝 הערות'},{id:'expenses',label:'💰 הוצאות'},{id:'docs',label:'📄 מסמכים'}];
  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh"><div className="stitle">📋 רשימות</div></div>
      <div className="sub-tabs">
        {tabs.map(t=><button key={t.id} className={`sub-tab${sub===t.id?' active':''}`} onClick={()=>setSub(t.id)}>{t.label}</button>)}
      </div>
      {!trip?<div className="empty"><div className="eicon">📋</div><div className="etitle">אין טיול פעיל</div></div>
        :sub==='shopping'?<ChecklistTab key="shop" emoji="🛒" items={trip.shoppingList||[]} emptyText="רשימת הקניות ריקה" addPlaceholder="הוסף פריט לקניות..." onUpdate={items=>onUpdate({...trip,shoppingList:items})}/>
        :sub==='packing'?<ChecklistTab key="pack" emoji="🎒" items={trip.packingList||[]} emptyText="רשימת הציוד ריקה" addPlaceholder="הוסף פריט לציוד..." onUpdate={items=>onUpdate({...trip,packingList:items})}/>
        :sub==='notes'?<NotesTab trip={trip} onUpdate={onUpdate}/>
        :sub==='expenses'?<ExpensesTab trip={trip} onUpdate={onUpdate}/>
        :<DocsTab trip={trip}/>}
    </div>
  );
}

/* ── Checklist tab ── */
function ChecklistTab({emoji,items,emptyText,addPlaceholder,onUpdate}){
  const[text,setText]=useState('');
  const done=items.filter(i=>i.done).length;
  const add=()=>{const t=text.trim();if(!t)return;onUpdate([...items,{id:uid(),text:t,done:false,category:'כללי'}]);setText('');};
  const tog=id=>onUpdate(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const del=id=>onUpdate(items.filter(i=>i.id!==id));
  const grouped=items.reduce((a,i)=>{const c=i.category||'כללי';if(!a[c])a[c]=[];a[c].push(i);return a;},{});
  return(
    <>
      {/* progress bar */}
      {items.length>0&&<div className="prog-bar"><div className="prog-fill" style={{width:`${items.length?(done/items.length)*100:0}%`}}/></div>}
      {/* add row */}
      <div className="add-row">
        <input className="add-inp" value={text} onChange={e=>setText(e.target.value)} placeholder={addPlaceholder} onKeyDown={e=>e.key==='Enter'&&add()}/>
        <button className="add-btn" onClick={add}>+</button>
      </div>
      {/* stats */}
      {items.length>0&&<div style={{padding:'8px 16px',fontSize:12,color:'var(--text3)',display:'flex',gap:10,borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <span>{emoji} {items.length} פריטים</span>
        <span style={{color:'var(--green)'}}>✓ {done} הושלמו</span>
        {done>0&&<button onClick={()=>onUpdate(items.filter(i=>!i.done))} style={{background:'none',border:'none',color:'var(--red)',fontSize:12,cursor:'pointer',padding:0,marginRight:'auto'}}>נקה הושלמו</button>}
      </div>}
      {/* list */}
      <div style={{flex:1,overflowY:'auto'}}>
        {items.length===0&&<div className="empty"><div className="eicon">{emoji}</div><div className="etitle">{emptyText}</div><div className="edesc">הקלד פריט בשדה למעלה והוסף</div></div>}
        {Object.entries(grouped).map(([cat,citems])=>(
          <div key={cat}>
            {Object.keys(grouped).length>1&&<div className="slabel">{cat}</div>}
            <div className="card" style={{margin:'0 14px 10px'}}>
              {citems.map(item=>(
                <div key={item.id} className="ci">
                  <button className={`cbox${item.done?' chk':''}`} onClick={()=>tog(item.id)}>{item.done?'✓':''}</button>
                  <div style={{flex:1,minWidth:0}}>
                    <div className={`ci-text${item.done?' done':''}`}>{item.text}</div>
                  </div>
                  <button className="ci-del" onClick={()=>del(item.id)}>✕</button>
                </div>
              ))}
            </div>
          </div>
        ))}
        <div style={{height:16}}/>
      </div>
    </>
  );
}

/* ── Notes tab ── */
function NotesTab({trip,onUpdate}){
  const[newNote,setNewNote]=useState('');
  const addNote=()=>{const t=newNote.trim();if(!t)return;onUpdate({...trip,quickNotes:[...(trip.quickNotes||[]),{id:uid(),text:t,createdAt:new Date().toISOString()}]});setNewNote('');};
  const delNote=id=>onUpdate({...trip,quickNotes:(trip.quickNotes||[]).filter(n=>n.id!==id)});
  const qnotes=trip.quickNotes||[];
  return(
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {/* general notes */}
      <div className="slabel">📝 הערות כלליות</div>
      <div style={{padding:'0 14px 14px'}}>
        <textarea className="note-ta" rows={5}
          value={trip.generalNotes||''}
          onChange={e=>onUpdate({...trip,generalNotes:e.target.value})}
          placeholder="קשר לאתר קמפינג, טלפונים, קודים, הערות מיוחדות..."/>
      </div>
      {/* quick notes */}
      <div className="add-row">
        <input className="add-inp" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="הוסף פתקית מהירה..." onKeyDown={e=>e.key==='Enter'&&addNote()}/>
        <button className="add-btn" onClick={addNote}>+</button>
      </div>
      <div className="slabel">📌 פתקיות מהירות ({qnotes.length})</div>
      {qnotes.length===0&&<div style={{padding:'20px',textAlign:'center',color:'var(--text3)',fontSize:13}}>אין פתקיות עדיין</div>}
      <div className="card" style={{margin:'0 14px'}}>
        {[...qnotes].reverse().map(n=>(
          <div key={n.id} className="qnote">
            <div style={{flex:1}}>
              <div className="qnote-text">{n.text}</div>
              <div className="qnote-date">{new Date(n.createdAt).toLocaleDateString('he-IL')}</div>
            </div>
            <button className="ci-del" onClick={()=>delNote(n.id)}>✕</button>
          </div>
        ))}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ── Expenses tab ── */
function ExpensesTab({trip,onUpdate}){
  const[form,setForm]=useState({category:'מזון',amount:'',description:'',date:new Date().toISOString().slice(0,10)});
  const expenses=trip?.expenses||[];
  const total=expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const byCat=EXPENSE_CATS.reduce((a,c)=>{a[c]=expenses.filter(e=>e.category===c).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);return a;},{});

  const add=()=>{
    const amt=parseFloat(form.amount);
    if(!amt||isNaN(amt)){toast('הזן סכום תקני','e');return;}
    onUpdate({...trip,expenses:[...expenses,{id:uid(),...form,amount:amt}]});
    setForm(f=>({...f,amount:'',description:''}));
    toast('הוצאה נוספה ✓','s');
  };
  const del=id=>onUpdate({...trip,expenses:expenses.filter(e=>e.id!==id)});

  return(
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {/* total + bar */}
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:total>0?8:0}}>
          <span style={{fontSize:22,fontWeight:800,color:'var(--accent2)'}}>₪{total.toLocaleString()}</span>
          <span style={{fontSize:12,color:'var(--text3)'}}>סה"כ · {expenses.length} הוצאות</span>
        </div>
        {total>0&&<>
          <div style={{display:'flex',borderRadius:4,overflow:'hidden',height:7,marginBottom:7}}>
            {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
              <div key={c} style={{flex:byCat[c]/total,background:CAT_COLORS[c]}} title={`${c}: ₪${byCat[c].toFixed(0)}`}/>
            ))}
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px'}}>
            {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
              <span key={c} style={{fontSize:11,color:CAT_COLORS[c]}}>● {c}: ₪{byCat[c].toFixed(0)}</span>
            ))}
          </div>
        </>}
      </div>

      {/* add form */}
      <div style={{padding:'10px 14px 12px',borderBottom:'1px solid var(--border)',background:'var(--bg3)',flexShrink:0,display:'flex',flexDirection:'column',gap:8}}>
        <div style={{display:'flex',gap:8}}>
          <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}
            style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none'}}>
            {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}
          </select>
          <input value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} type="number" min="0"
            placeholder="סכום ₪" onKeyDown={e=>e.key==='Enter'&&add()}
            style={{width:90,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:14,outline:'none',textAlign:'center'}}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="תיאור (אופציונלי)"
            onKeyDown={e=>e.key==='Enter'&&add()}
            style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none',direction:'rtl'}}/>
          <button onClick={add} style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,padding:'0 18px',fontFamily:'Heebo,sans-serif',fontSize:16,fontWeight:700,cursor:'pointer'}}>+</button>
        </div>
      </div>

      {/* list */}
      {expenses.length===0&&<div className="empty"><div className="eicon">💰</div><div className="etitle">אין הוצאות עדיין</div><div className="edesc">הוסף הוצאות בטופס למעלה</div></div>}
      <div className="card" style={{margin:'12px 14px'}}>
        {[...expenses].reverse().map(ex=>(
          <div key={ex.id} className="exp-row">
            <div className="exp-dot" style={{background:CAT_COLORS[ex.category]||'#888'}}/>
            <span className="exp-cat" style={{background:(CAT_COLORS[ex.category]||'#888')+'22',color:CAT_COLORS[ex.category]||'#888'}}>{ex.category}</span>
            <div className="exp-desc">{ex.description||ex.category}<span style={{color:'var(--text3)',fontSize:10,marginRight:5}}>{ex.date}</span></div>
            <span className="exp-amt">₪{parseFloat(ex.amount).toFixed(0)}</span>
            <button className="exp-del" onClick={()=>del(ex.id)}>✕</button>
          </div>
        ))}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ── Docs tab ── */
function DocsTab({trip}){
  const docs=trip?.documents||[];
  if(docs.length===0)return(
    <div className="empty"><div className="eicon">📁</div><div className="etitle">אין מסמכים</div><div className="edesc">הוסף דרכונים, ביטוח, כרטיסים ועוד<br/>דרך אפליקציית המחשב</div></div>
  );
  return(
    <div style={{flex:1,overflowY:'auto'}}>
      <div className="doc-grid">
        {docs.map(doc=>(
          <div key={doc.id} className="doc-card">
            <div className="doc-icon">{docIcon(doc.type)}</div>
            <div className="doc-name">{doc.name}</div>
            <div className="doc-meta">{fmtSize(doc.size||0)}</div>
            {doc.url&&(
              doc.type?.startsWith('image/')?
                <img src={doc.url} alt={doc.name} style={{width:'100%',height:60,objectFit:'cover',borderRadius:6,marginTop:4}}/>

      </div>
      <div style={{height:16}}/>
    </div>
  );
}

════════════════════════════════ */

  const totalExp=trip?.expenses?.reduce((s,e)=>s+(parseFloat(e.amount)||0),0)||0;
  const sl={idle:'⚪ לא מחובר',syncing:'🔄 מסנכרן...',synced:'✅ מסונכרן',error:'❌ שגיאה'};
  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div className="stitle">✈️ הטיול שלי</div>
          <span className={`sync-b ${syncStatus}`}>{sl[syncStatus]||''}</span>
        </div>
      </div>

        {trips.map(t=><div key={t.id} className={`trip-chip${t.id===activeId?' active':''}`} onClick={()=>onSelectTrip(t.id)}>{t.name}</div>)}
      </div>}
      {trip?<>
        <div className="slabel">פרטי הטיול</div>
        <div className="card" style={{margin:'0 14px'}}>
          <div className="crow"><div className="cicon">✈️</div><div className="cmain"><div className="ctitle">{trip.name}</div><div className="csub">שם הטיול</div></div></div>
          {trip.vehiclePlate&&<div className="crow"><div className="cicon">🚗</div><div className="cmain"><div className="ctitle">{trip.vehiclePlate}</div><div className="csub">רכב</div></div></div>}
        </div>
        <div className="slabel">סטטיסטיקות</div>
        <div style={{display:'flex',gap:8,padding:'0 14px 14px',flexWrap:'wrap'}}>
          <div className="spill"><span>📅</span>{trip.days?.length||0} ימים</div>
          <div className="spill"><span>⭐</span>{trip.interestBank?.length||0} אטרקציות</div>
          <div className="spill"><span>💰</span>₪{totalExp.toLocaleString()}</div>

          <div className="spill"><span>🎒</span>{(trip.packingList||[]).filter(i=>!i.done).length} לארוז</div>
          <div className="spill"><span>📄</span>{trip.documents?.length||0} מסמכים</div>
        </div>

        <div className="card" style={{margin:'0 14px'}}>
          <div className="crow" style={{cursor:'pointer'}} onClick={onRefresh}>
            <div className="cicon">🔄</div><div className="cmain"><div className="ctitle">רענן נתונים מהענן</div><div className="csub">טעינה מחדש מ-Firebase</div></div>
          </div>
          <div className="crow" style={{cursor:'pointer'}} onClick={()=>{if(window.confirm('לפתוח אפליקציית מחשב?'))window.open('index.html','_blank');}}>
            <div className="cicon">💻</div><div className="cmain"><div className="ctitle">פתח אפליקציית מחשב</div><div className="csub">עריכה מלאה</div></div>
          </div>
        </div>
        <div className="slabel">⚙️ הגדרות</div>
        <div className="card" style={{margin:'0 14px'}}>
          {/* ── travel buffer factor ── */}
          <div className="crow" style={{alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
            <div className="cicon" style={{marginTop:3}}>🚗</div>
            <div className="cmain">
              <div className="ctitle">פקטור זמן נסיעה</div>
              <div className="csub" style={{lineHeight:1.55,marginTop:3}}>
                כפיל לזמן הנסיעה המחושב אוטומטית בלוז היומי.
                כולל זמן התארגנות — לדוגמה <b style={{color:'var(--text2)'}}>×1.2</b> אומר שנסיעה של 30 דק' תוצג כ-36 דק' (30 + 6 דק' התארגנות).
              </div>
            </div>
            <select value={settings?.travelBuffer??1.2}
              onChange={e=>onSettingsChange({...settings,travelBuffer:parseFloat(e.target.value)})}
              style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
                padding:'7px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',
                fontSize:13,outline:'none',flexShrink:0,marginTop:2,direction:'ltr'}}>
              <option value={1.0}>×1.0 — ללא תוספת</option>
              <option value={1.1}>×1.1 — +10%</option>
              <option value={1.2}>×1.2 — +20% (מומלץ)</option>
              <option value={1.3}>×1.3 — +30%</option>
              <option value={1.5}>×1.5 — +50%</option>
              <option value={2.0}>×2.0 — כפול</option>
            </select>
          </div>
        </div>
      </>:<div className="empty"><div className="eicon">✈️</div><div className="etitle">לא נמצאו טיולים</div><div className="edesc">צור טיול דרך אפליקציית המחשב</div></div>}
      <div style={{margin:'20px 14px 0',padding:'12px 14px',background:'var(--bg3)',borderRadius:10,display:'flex',flexDirection:'column',alignItems:'center',gap:7}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600}}>PlanMyTrip</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
          <span className="ver-badge"><span className="v-mob">📱 Mobile</span><span className="v-mob">{MOB_VER}</span></span>
        </div>
        <div style={{fontSize:10,color:'var(--text3)',opacity:.6}}>© {new Date().getFullYear()} PlanMyTrip</div>
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ════════════════════════════════
   BOTTOM NAV
════════════════════════════════ */
const NAV=[{id:'map',icon:'🗺️',label:'מפה'},{id:'schedule',icon:'📅',label:'לוז'},{id:'bank',icon:'⭐',label:'בנק'},{id:'lists',icon:'📋',label:'רשימות'},{id:'trip',icon:'✈️',label:'טיול'}];
function BottomNav({active,onChange}){
  return<nav className="bnav">{NAV.map(n=><button key={n.id} className={`nbtn${active===n.id?' active':''}`} onClick={()=>onChange(n.id)}><span className="nicon">{n.icon}</span><span className="nlabel">{n.label}</span></button>)}</nav>;
}

/* ════════════════════════════════
   URL ?key= PARAM — auto-connect on first visit
════════════════════════════════ */
(()=>{
  try{
    const urlKey=new URLSearchParams(window.location.search).get('key');
    if(urlKey){
      const cur=loadState()||{};
      saveState({...cur,settings:{...(cur.settings||{}),syncKey:urlKey,firebaseUrl:FB_URL}});
      window.history.replaceState({},'',window.location.pathname);
      location.reload();
    }
  }catch{}
})();

/* ════════════════════════════════
   APP
════════════════════════════════ */
function App(){
  const saved=useMemo(()=>loadState(),[]);
  const[settings,setSettings]=useState(()=>{
    const def={firebaseUrl:FB_URL,syncKey:'',googleMapsKey:GMAPS_KEY,travelBuffer:1.2};
    return{...def,...(saved?.settings||{}),firebaseUrl:FB_URL};
  });
  const[trips,setTrips]=useState(()=>{
    const raw=saved?.trips;
    if(raw?.length>0){const n=raw.map(normTrip).filter(Boolean);if(n.length>0)return n;}
    return[];
  });
  const[activeId,setActiveId]=useState(saved?.activeId||(saved?.trips?.[0]?.id??null));
  const[screen,setScreen]=useState('map');
  const[syncStatus,setSyncStatus]=useState('idle');
  const[mapsReady,setMapsReady]=useState(!!window.google?.maps);
  const skipPush=useRef(false);
  const autoSaveTimer=useRef(null);
  const syncMounted=useRef(false);
  const tripsRef=useRef(trips);
  tripsRef.current=trips;
  const mapFocusRef=useRef(null);
  const mapPickCallbackRef=useRef(null);

  /* navigate to map and focus on a place */
  const showOnMap=useCallback(item=>{
    mapFocusRef.current=item;
    setScreen('map');
  },[]);

  /* pick location from map for start/end day location */
  const[mapPickLabel,setMapPickLabel]=useState(null);
  const pickLocationFromMap=useCallback((label,callback)=>{
    mapPickCallbackRef.current=place=>{
      callback(place);
      setMapPickLabel(null);
      setScreen('schedule');
    };
    setMapPickLabel(label);
    setScreen('map');
  },[]);
  const cancelMapPick=useCallback(()=>{
    mapPickCallbackRef.current=null;
    setMapPickLabel(null);
    setScreen('schedule');
  },[]);

  const trip=useMemo(()=>trips.find(t=>t.id===activeId)||trips[0]||null,[trips,activeId]);

  /* load Google Maps */
  useEffect(()=>{
    if(window.google?.maps){setMapsReady(true);return;}
    window.__gmMobileInit=()=>setMapsReady(true);
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${settings.googleMapsKey}&libraries=places&callback=__gmMobileInit&language=he`;
    s.async=true;s.defer=true;
    document.head.appendChild(s);
  },[]);// eslint-disable-line

  /* load from Firebase */
  const loadFromFirebase=useCallback(async()=>{
    const{firebaseUrl:fbUrl,syncKey}=settings;
    if(!fbUrl||!syncKey)return;
    setSyncStatus('syncing');
    try{
      const data=await fbRead(fbUrl,syncKey);
      if(data?.trips?.length>0){
        const loaded=data.trips.map(normTrip).filter(Boolean);
        if(loaded.length>0){skipPush.current=true;setTrips(loaded);if(data.activeId)setActiveId(data.activeId);toast('הטיול נטען מ-Firebase ✓','s');}
      }
      setSyncStatus('synced');
    }catch{setSyncStatus('error');toast('שגיאה בטעינה מ-Firebase','e');}
  },[settings]);

  useEffect(()=>{loadFromFirebase();},[]);// eslint-disable-line

  /* persist to localStorage (including settings changes) */
  useEffect(()=>{
    saveState({settings,trips,activeId});
  },[trips,activeId,settings]);// eslint-disable-line

  /* debounced auto-save to Firebase */
  const debounceSave=useCallback((newTrips,newActiveId)=>{
    const{firebaseUrl:fbUrl,syncKey}=settings;
    if(!fbUrl||!syncKey)return;
    clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current=setTimeout(async()=>{
      setSyncStatus('syncing');
      try{await fbWrite(fbUrl,syncKey,{trips:newTrips,activeId:newActiveId,savedAt:new Date().toISOString()});setSyncStatus('synced');}
      catch{setSyncStatus('error');}
    },1800);
  },[settings]);

  /* updateTrip — updates the active trip and triggers save */
  const updateTrip=useCallback(updatedTrip=>{
    setTrips(prev=>{
      const next=prev.map(t=>t.id===updatedTrip.id?updatedTrip:t);
      debounceSave(next,activeId);
      return next;
    });
  },[activeId,debounceSave]);

  return(
    <>
      <ToastLayer/>
      <div className="sw">
        <MapScreen trip={trip} active={screen==='map'} mapsReady={mapsReady} onUpdate={updateTrip} mapFocusRef={mapFocusRef} mapPickCallbackRef={mapPickCallbackRef} mapPickLabel={mapPickLabel} onCancelMapPick={cancelMapPick}/>
        <ScheduleScreen trip={trip} active={screen==='schedule'} onShowOnMap={showOnMap} onUpdate={updateTrip} settings={settings} onPickFromMap={pickLocationFromMap}/>
        <BankScreen trip={trip} active={screen==='bank'} onShowOnMap={showOnMap}/>
        <ListsScreen trip={trip} active={screen==='lists'} onUpdate={updateTrip}/>
        <TripScreen trips={trips} activeId={activeId} onSelectTrip={setActiveId} syncStatus={syncStatus} onRefresh={loadFromFirebase} active={screen==='trip'} settings={settings} onSettingsChange={setSettings}/>
      </div>
      <BottomNav active={screen} onChange={setScreen}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
