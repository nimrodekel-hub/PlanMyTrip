<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a73e8" />
  <title>PlanMyTrip</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #232736;
      --surface: #2a2e3f; --surface2: #333849; --border: #3d4358;
      --text: #e8eaf0; --text2: #9aa0b8; --text3: #6b7295;
      --accent: #1a73e8; --accent2: #4f8ef7;
      --green: #22c55e; --amber: #f59e0b; --red: #ef4444;
      --nav-h: 60px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    html, body {
      height: 100%; width: 100%;
      font-family: 'Heebo', sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden; direction: rtl;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    #root { height: 100%; display: flex; flex-direction: column; }

    /* ── Bottom Navigation ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      background: var(--bg2); border-top: 1px solid var(--border);
      display: flex; align-items: stretch;
      padding-bottom: var(--safe-bottom);
      z-index: 1000;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px; border: none; background: none;
      color: var(--text3); font-family: 'Heebo', sans-serif;
      cursor: pointer; transition: all 0.15s;
      padding: 6px 0;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .nav-btn.active { color: var(--accent2); }
    .nav-btn.active::after {
      content: ''; position: absolute; top: 0; left: 20%; right: 20%;
      height: 2px; background: var(--accent2); border-radius: 0 0 2px 2px;
    }
    .nav-icon { font-size: 22px; line-height: 1; }
    .nav-label { font-size: 10px; font-weight: 600; }

    /* ── Screen container ── */
    .screen-wrap {
      flex: 1; overflow: hidden; position: relative;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom));
    }
    .screen {
      position: absolute; inset: 0;
      overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column;
      transition: opacity 0.18s ease, transform 0.18s ease;
    }
    .screen.hidden {
      opacity: 0; pointer-events: none;
      transform: translateY(6px);
    }

    /* ── Screen header ── */
    .screen-header {
      background: var(--bg2); border-bottom: 1px solid var(--border);
      padding: 14px 16px 12px; flex-shrink: 0;
      position: sticky; top: 0; z-index: 10;
    }
    .screen-title {
      font-size: 18px; font-weight: 700; color: var(--text);
    }
    .screen-subtitle {
      font-size: 12px; color: var(--text3); margin-top: 2px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .card-row {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .card-row:last-child { border-bottom: none; }
    .card-row-icon {
      font-size: 22px; width: 36px; text-align: center; flex-shrink: 0;
    }
    .card-row-main { flex: 1; min-width: 0; }
    .card-row-title {
      font-size: 14px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .card-row-sub {
      font-size: 12px; color: var(--text3); margin-top: 2px;
    }
    .card-row-end { font-size: 12px; color: var(--text3); flex-shrink: 0; }

    /* ── Section label ── */
    .section-label {
      font-size: 11px; font-weight: 700; color: var(--text3);
      text-transform: uppercase; letter-spacing: 0.06em;
      padding: 16px 16px 6px;
    }

    /* ── Stat pills ── */
    .stat-row { display: flex; gap: 10px; padding: 0 16px 14px; flex-wrap: wrap; }
    .stat-pill {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 6px 14px;
      font-size: 12px; font-weight: 600; color: var(--text2);
      display: flex; align-items: center; gap: 6px;
    }
    .stat-pill span { font-size: 15px; }

    /* ── Empty state ── */
    .empty-state {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px; padding: 40px 20px; text-align: center; color: var(--text3);
    }
    .empty-icon { font-size: 48px; opacity: 0.5; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text2); }
    .empty-desc { font-size: 13px; line-height: 1.6; }

    /* ── Loading ── */
    .loading-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
    }
    .spinner {
      width: 36px; height: 36px; border: 3px solid var(--border);
      border-top-color: var(--accent2); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed; top: calc(var(--safe-top) + 12px);
      left: 16px; right: 16px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      animation: toastIn 0.25s ease;
      display: flex; align-items: center; gap: 8px;
    }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error   { border-color: var(--red); color: var(--red); }
    .toast.info    { border-color: var(--accent2); color: var(--accent2); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: none; }
    }

    /* ── Trip selector ── */
    .trip-selector {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; background: var(--bg3);
      border-bottom: 1px solid var(--border);
      overflow-x: auto; flex-shrink: 0;
    }
    .trip-chip {
      flex-shrink: 0; padding: 5px 14px; border-radius: 16px;
      font-size: 12px; font-weight: 600; border: 1px solid var(--border);
      background: var(--surface); color: var(--text2);
      cursor: pointer; white-space: nowrap; transition: all 0.12s;
    }
    .trip-chip.active {
      background: var(--accent); border-color: var(--accent);
      color: #fff;
    }

    /* ── Sync badge ── */
    .sync-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 600; padding: 3px 8px;
      border-radius: 10px;
    }
    .sync-badge.synced { color: var(--green); background: rgba(34,197,94,0.1); }
    .sync-badge.syncing { color: var(--amber); background: rgba(245,158,11,0.1); }
    .sync-badge.error { color: var(--red); background: rgba(239,68,68,0.1); }
    .sync-badge.idle { color: var(--text3); background: var(--surface); }

    /* ── Placeholder map ── */
    .map-placeholder {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: var(--bg3); gap: 12px; position: relative;
    }
    .map-placeholder-grid {
      position: absolute; inset: 0; opacity: 0.05;
      background-image:
        linear-gradient(var(--text) 1px, transparent 1px),
        linear-gradient(90deg, var(--text) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Day blocks ── */
    .day-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 8px;
    }
    .day-title { font-size: 16px; font-weight: 700; }
    .day-meta { font-size: 12px; color: var(--text3); }
    .block-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .block-item:last-child { border-bottom: none; }
    .block-dot {
      width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
    }
    .block-time { font-size: 11px; color: var(--text3); width: 40px; flex-shrink: 0; }
    .block-emoji { font-size: 16px; flex-shrink: 0; }
    .block-title { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; }
    .block-dur { font-size: 11px; color: var(--text3); }

    /* ── Bank item ── */
    .bank-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .bank-item:last-child { border-bottom: none; }
    .bank-type-icon { font-size: 20px; flex-shrink: 0; }
    .bank-name { font-size: 13px; font-weight: 600; }
    .bank-addr { font-size: 11px; color: var(--text3); margin-top: 2px; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ─── constants ─── */
const MOBILE_VERSION = 'm1';
const FB_URL = 'https://planmytrip-de33c-default-rtdb.firebaseio.com';
const LS_KEY = 'caravanCtrl_he';

const BLOCK_EMOJI = {travel:'🚗',activity:'🎯',stop:'⏸️',rest:'😴',games:'🎮',free:'🕐'};
const BLOCK_HE    = {travel:'נסיעה',activity:'פעילות',stop:'עצירה',rest:'מנוחה',games:'משחקים',free:'זמן פנוי'};
const BLOCK_COLOR = {travel:'#4f8ef7',activity:'#22c55e',stop:'#f59e0b',rest:'#94a3b8',games:'#a855f7',free:'#64748b'};

const PLACE_TYPE_HE = {
  campground:'⛺ קמפינג', rv_park:'🏕️ קרוואנים', lodging:'🏨 מלון',
  bakery:'🥐 מאפייה', winery:'🍷 יקב', cafe:'☕ קפה', bar:'🍺 בר',
  restaurant:'🍽️ מסעדה', food:'🍽️ אוכל',
  shopping_mall:'🛍️ קניון', supermarket:'🛒 סופר', grocery_or_supermarket:'🛒 סופר',
  clothing_store:'👕 ביגוד', store:'🏪 חנות',
  zoo:'🦁 גן חיות', aquarium:'🐟 אקווריום', museum:'🏛️ מוזיאון',
  amusement_park:'🎡 פארק שעשועים', playground:'🎠 גן משחקים',
  park:'🌳 פארק', beach:'🏖️ חוף', tourist_attraction:'📸 אטרקציה',
  gym:'💪 חדר כושר', stadium:'🏟️ אצטדיון',
  airport:'✈️ שדה תעופה', train_station:'🚂 רכבת', bus_station:'🚌 אוטובוס',
  gas_station:'⛽ תחנת דלק', hospital:'🏥 בית חולים', pharmacy:'💊 בית מרקחת',
  synagogue:'🕍 בית כנסת', church:'⛪ כנסייה', mosque:'🕌 מסגד',
  natural_feature:'⛰️ טבע', point_of_interest:'📍 אטרקציה', establishment:'🏢 עסק',
};
const PLACE_TYPE_PRIORITY = [
  'campground','rv_park','bakery','winery','cafe','bar','lodging','restaurant',
  'shopping_mall','supermarket','grocery_or_supermarket','clothing_store','store',
  'zoo','aquarium','museum','amusement_park','playground','park','beach',
  'tourist_attraction','gym','stadium','airport','train_station','bus_station',
  'gas_station','hospital','pharmacy','synagogue','church','mosque',
  'natural_feature','food','point_of_interest','establishment',
];
const getPlaceTypeLabel = types => {
  if (!types?.length) return '';
  const key = PLACE_TYPE_PRIORITY.find(p => types.includes(p));
  return key ? PLACE_TYPE_HE[key] : '';
};
const getCountry = item => item.country || item.address?.split(',').slice(-1)[0]?.trim() || '—';

/* ─── Firebase ─── */
const fbBase = url => url.replace(/\/+$/, '');
const fbRead = async (dbUrl, key) => {
  const r = await fetch(`${fbBase(dbUrl)}/planmytrip/${key}.json?_=${Date.now()}`);
  if (!r.ok) throw new Error(`שגיאה ${r.status}`);
  return r.json();
};
const fbWrite = async (dbUrl, key, data) => {
  const r = await fetch(`${fbBase(dbUrl)}/planmytrip/${key}.json`, {
    method: 'PUT', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(data),
  });
  if (!r.ok) throw new Error(`שגיאה ${r.status}`);
  return r.json();
};

/* ─── Local storage ─── */
const loadState = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)||'null'); } catch { return null; } };
const saveState = s => { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch {} };

/* ─── Normalize trip ─── */
const normTrip = t => {
  if (!t || typeof t !== 'object') return null;
  return {
    expenses:[], interestBank:[], packingList:[], shoppingList:[], documents:[], quickNotes:[], days:[], generalNotes:'',
    ...t,
    days:(t.days||[]).map(d=>({blocks:[],...d,
      startLocation:d.startLocation||'', startTime:d.startTime||'08:00',
      endLocation:d.endLocation||'', endTime:d.endTime||'20:00',
    })),
    interestBank: t.interestBank||[],
    expenses: t.expenses||[],
  };
};

/* ─── uid ─── */
const uid = () => Math.random().toString(36).slice(2,10);

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
let _toastFn = null;
const toast = (msg, type='info') => _toastFn?.(msg, type);

function ToastLayer() {
  const [items, setItems] = useState([]);
  _toastFn = useCallback((msg, type) => {
    const id = uid();
    setItems(p => [...p, {id, msg, type}]);
    setTimeout(() => setItems(p => p.filter(t => t.id !== id)), 3000);
  }, []);
  if (!items.length) return null;
  return (
    <div className="toast-wrap">
      {items.map(t => (
        <div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════
   MAP SCREEN (stage 1 – placeholder)
═══════════════════════════════════════ */
function MapScreen({ trip, active }) {
  return (
    <div className={`screen${active ? '' : ' hidden'}`}>
      <div className="map-placeholder" style={{flex:1, minHeight: 0}}>
        <div className="map-placeholder-grid" />
        <div style={{position:'relative', textAlign:'center', zIndex:1, padding:'0 32px'}}>
          <div style={{fontSize:60, marginBottom:12}}>🗺️</div>
          <div style={{fontSize:17, fontWeight:700, color:'var(--text)', marginBottom:8}}>
            המפה תיטען כאן
          </div>
          <div style={{fontSize:13, color:'var(--text3)', lineHeight:1.7}}>
            בשלב הבא יוצג כאן Google Maps מלא עם<br/>
            סמנים לאטרקציות וחיפוש מקומות
          </div>
          {trip && (
            <div style={{marginTop:20, display:'flex', gap:10, justifyContent:'center', flexWrap:'wrap'}}>
              <div className="stat-pill">
                <span>📅</span>{trip.days?.length||0} ימים
              </div>
              <div className="stat-pill">
                <span>⭐</span>{trip.interestBank?.length||0} אטרקציות
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   SCHEDULE SCREEN (stage 1)
═══════════════════════════════════════ */
function ScheduleScreen({ trip, active }) {
  const days = trip?.days || [];

  return (
    <div className={`screen${active ? '' : ' hidden'}`}>
      <div className="screen-header">
        <div className="screen-title">📅 לוז הטיול</div>
        {trip && <div className="screen-subtitle">{trip.name} · {days.length} ימים</div>}
      </div>

      {!trip && (
        <div className="empty-state">
          <div className="empty-icon">📅</div>
          <div className="empty-title">אין טיול פעיל</div>
        </div>
      )}

      {days.length === 0 && trip && (
        <div className="empty-state">
          <div className="empty-icon">📅</div>
          <div className="empty-title">אין ימים בלוז</div>
          <div className="empty-desc">הוסף ימים לטיול דרך אפליקציית המחשב</div>
        </div>
      )}

      {days.map((day, di) => (
        <DayCard key={day.id} day={day} dayIndex={di} />
      ))}

      <div style={{height:16}} />
    </div>
  );
}

function DayCard({ day, dayIndex }) {
  const [open, setOpen] = useState(dayIndex === 0);
  const blocks = day.blocks || [];
  const totalBlocks = blocks.length;

  const blockDuration = b => {
    if (!b.startTime || !b.endTime) return null;
    const [sh,sm] = b.startTime.split(':').map(Number);
    const [eh,em] = b.endTime.split(':').map(Number);
    const mins = (eh*60+em) - (sh*60+sm);
    if (mins <= 0) return null;
    return mins >= 60 ? `${Math.floor(mins/60)}ש${mins%60?` ${mins%60}ד`:''}` : `${mins}ד`;
  };

  return (
    <div style={{margin:'12px 16px 0'}}>
      <div
        className="card"
        style={{cursor:'pointer'}}
        onClick={() => setOpen(o => !o)}
      >
        <div style={{
          display:'flex', alignItems:'center', justifyContent:'space-between',
          padding:'14px 16px',
          borderBottom: open && totalBlocks ? '1px solid var(--border)' : 'none',
        }}>
          <div>
            <div style={{fontSize:15, fontWeight:700}}>
              יום {dayIndex+1}
              {day.startLocation && <span style={{fontWeight:400, color:'var(--text2)', fontSize:13}}> · {day.startLocation}</span>}
            </div>
            <div style={{fontSize:11, color:'var(--text3)', marginTop:3}}>
              {day.startTime}–{day.endTime}
              {totalBlocks > 0 && ` · ${totalBlocks} פעילויות`}
            </div>
          </div>
          <div style={{fontSize:18, color:'var(--text3)', transform: open ? 'rotate(90deg)' : 'none', transition:'transform 0.2s'}}>
            ‹
          </div>
        </div>

        {open && blocks.map(b => (
          <div key={b.id} className="block-item">
            <div className="block-dot" style={{background: BLOCK_COLOR[b.type]||'var(--text3)'}} />
            <div className="block-time">{b.startTime||''}</div>
            <div className="block-emoji">{BLOCK_EMOJI[b.type]||'📌'}</div>
            <div className="block-title">{b.title || BLOCK_HE[b.type] || b.type}</div>
            {blockDuration(b) && <div className="block-dur">{blockDuration(b)}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════
   BANK SCREEN (stage 1)
═══════════════════════════════════════ */
function BankScreen({ trip, active }) {
  const [search, setSearch] = useState('');
  const bank = trip?.interestBank || [];

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return bank;
    return bank.filter(i =>
      (i.name||'').toLowerCase().includes(q) ||
      (i.address||'').toLowerCase().includes(q)
    );
  }, [bank, search]);

  const grouped = useMemo(() => {
    const q = search.trim().toLowerCase();
    const source = q ? filtered : bank;
    const map = {};
    for (const item of source) {
      const c = getCountry(item);
      if (!map[c]) map[c] = [];
      map[c].push(item);
    }
    return Object.entries(map).sort((a,b) => a[0].localeCompare(b[0],'he'));
  }, [bank, filtered, search]);

  return (
    <div className={`screen${active ? '' : ' hidden'}`}>
      <div className="screen-header">
        <div className="screen-title">⭐ בנק אטרקציות</div>
        {trip && <div className="screen-subtitle">{bank.length} מקומות שמורים</div>}
      </div>

      {/* Search bar */}
      {bank.length > 0 && (
        <div style={{padding:'10px 16px', background:'var(--bg2)', borderBottom:'1px solid var(--border)', flexShrink:0}}>
          <div style={{
            display:'flex', alignItems:'center', gap:8,
            background:'var(--bg3)', borderRadius:10, padding:'8px 12px',
            border:'1px solid var(--border)',
          }}>
            <span style={{fontSize:16}}>🔍</span>
            <input
              value={search}
              onChange={e => setSearch(e.target.value)}
              placeholder="חיפוש אטרקציה..."
              style={{
                flex:1, background:'none', border:'none', outline:'none',
                color:'var(--text)', fontSize:14, fontFamily:'Heebo,sans-serif',
                direction:'rtl',
              }}
            />
            {search && (
              <button onClick={() => setSearch('')} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:16,padding:0}}>✕</button>
            )}
          </div>
        </div>
      )}

      {!trip && (
        <div className="empty-state">
          <div className="empty-icon">⭐</div>
          <div className="empty-title">אין טיול פעיל</div>
        </div>
      )}

      {bank.length === 0 && trip && (
        <div className="empty-state">
          <div className="empty-icon">⭐</div>
          <div className="empty-title">בנק האטרקציות ריק</div>
          <div className="empty-desc">הוסף אטרקציות דרך אפליקציית המחשב</div>
        </div>
      )}

      {search && filtered.length === 0 && (
        <div className="empty-state">
          <div className="empty-icon">🔍</div>
          <div className="empty-title">אין תוצאות</div>
          <div className="empty-desc">לא נמצאו אטרקציות עבור "{search}"</div>
        </div>
      )}

      {grouped.map(([country, items]) => (
        <div key={country}>
          <div className="section-label">{country} ({items.length})</div>
          <div className="card" style={{margin:'0 16px'}}>
            {items.map(item => (
              <BankItemRow key={item.id} item={item} />
            ))}
          </div>
        </div>
      ))}

      <div style={{height:16}} />
    </div>
  );
}

function BankItemRow({ item }) {
  const typeLabel = getPlaceTypeLabel(item.types || (item.placeType ? [item.placeType] : []));
  const [icon, label] = typeLabel ? typeLabel.split(' ', 2) : ['📍',''];

  return (
    <div className="bank-item">
      <div className="bank-type-icon">{icon || '📍'}</div>
      <div style={{flex:1, minWidth:0}}>
        <div className="bank-name">{item.name||'—'}</div>
        {(item.address || item.placeType) && (
          <div className="bank-addr">
            {typeLabel && <span style={{marginLeft:4}}>{typeLabel}</span>}
            {item.address && <span style={{color:'var(--text3)'}}> · {item.address}</span>}
          </div>
        )}
        {item.note && (
          <div style={{fontSize:11, color:'var(--accent2)', marginTop:2}}>📝 {item.note}</div>
        )}
      </div>
      {item.rating && (
        <div style={{fontSize:11, color:'var(--amber)', flexShrink:0}}>
          ⭐ {item.rating}
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════
   TRIP SCREEN (stage 1)
═══════════════════════════════════════ */
function TripScreen({ trips, activeId, onSelectTrip, syncStatus, onRefresh, active }) {
  const trip = trips.find(t => t.id === activeId);
  const totalExpenses = trip?.expenses?.reduce((s,e) => s + (parseFloat(e.amount)||0), 0) || 0;

  const syncLabel = {
    idle: '⚪ לא מחובר', syncing: '🔄 מסנכרן...', synced: '✅ מסונכרן', error: '❌ שגיאה'
  }[syncStatus] || '';
  const syncClass = syncStatus;

  return (
    <div className={`screen${active ? '' : ' hidden'}`}>
      <div className="screen-header">
        <div style={{display:'flex', alignItems:'center', justifyContent:'space-between'}}>
          <div className="screen-title">✈️ הטיול שלי</div>
          <span className={`sync-badge ${syncClass}`}>{syncLabel}</span>
        </div>
      </div>

      {/* Trip selector */}
      {trips.length > 1 && (
        <div className="trip-selector">
          {trips.map(t => (
            <div
              key={t.id}
              className={`trip-chip${t.id === activeId ? ' active' : ''}`}
              onClick={() => onSelectTrip(t.id)}
            >
              {t.name}
            </div>
          ))}
        </div>
      )}

      {trip ? (
        <>
          <div className="section-label">פרטי הטיול</div>
          <div className="card" style={{margin:'0 16px'}}>
            <div className="card-row">
              <div className="card-row-icon">✈️</div>
              <div className="card-row-main">
                <div className="card-row-title">{trip.name}</div>
                <div className="card-row-sub">שם הטיול</div>
              </div>
            </div>
            {trip.vehiclePlate && (
              <div className="card-row">
                <div className="card-row-icon">🚗</div>
                <div className="card-row-main">
                  <div className="card-row-title">{trip.vehiclePlate}</div>
                  <div className="card-row-sub">רכב</div>
                </div>
              </div>
            )}
          </div>

          <div className="section-label">סטטיסטיקות</div>
          <div className="stat-row">
            <div className="stat-pill"><span>📅</span>{trip.days?.length||0} ימים</div>
            <div className="stat-pill"><span>⭐</span>{trip.interestBank?.length||0} אטרקציות</div>
            <div className="stat-pill"><span>💰</span>₪{totalExpenses.toLocaleString()}</div>
            <div className="stat-pill"><span>📦</span>{trip.packingList?.length||0} פריטי ציוד</div>
          </div>

          {trip.generalNotes && (
            <>
              <div className="section-label">הערות כלליות</div>
              <div className="card" style={{margin:'0 16px', padding:'14px 16px'}}>
                <div style={{fontSize:13, color:'var(--text2)', lineHeight:1.7, whiteSpace:'pre-wrap'}}>
                  {trip.generalNotes}
                </div>
              </div>
            </>
          )}

          <div className="section-label">פעולות</div>
          <div className="card" style={{margin:'0 16px'}}>
            <div className="card-row" style={{cursor:'pointer'}} onClick={onRefresh}>
              <div className="card-row-icon">🔄</div>
              <div className="card-row-main">
                <div className="card-row-title">רענן נתונים מהענן</div>
                <div className="card-row-sub">טעינה מחדש מ-Firebase</div>
              </div>
            </div>
            <div className="card-row" style={{cursor:'pointer'}} onClick={() => {
              if (window.confirm('לפתוח את אפליקציית המחשב?')) window.open('index.html','_blank');
            }}>
              <div className="card-row-icon">💻</div>
              <div className="card-row-main">
                <div className="card-row-title">פתח אפליקציית מחשב</div>
                <div className="card-row-sub">עריכה מלאה דרך הדפדפן</div>
              </div>
            </div>
          </div>
        </>
      ) : (
        <div className="empty-state">
          <div className="empty-icon">✈️</div>
          <div className="empty-title">לא נמצאו טיולים</div>
          <div className="empty-desc">צור טיול דרך אפליקציית המחשב</div>
        </div>
      )}

      <div style={{
        margin:'24px 16px 0', padding:'12px', background:'var(--bg3)',
        borderRadius:10, textAlign:'center', color:'var(--text3)', fontSize:11,
      }}>
        PlanMyTrip Mobile {MOBILE_VERSION} · אפליקציית סלולר
      </div>

      <div style={{height:16}} />
    </div>
  );
}

/* ═══════════════════════════════════════
   BOTTOM NAV
═══════════════════════════════════════ */
const NAV_ITEMS = [
  { id:'map',      icon:'🗺️', label:'מפה'     },
  { id:'schedule', icon:'📅', label:'לוז'      },
  { id:'bank',     icon:'⭐', label:'אטרקציות' },
  { id:'trip',     icon:'✈️', label:'טיול'     },
];

function BottomNav({ active, onChange }) {
  return (
    <nav className="bottom-nav">
      {NAV_ITEMS.map(n => (
        <button
          key={n.id}
          className={`nav-btn${active===n.id?' active':''}`}
          onClick={() => onChange(n.id)}
        >
          <span className="nav-icon">{n.icon}</span>
          <span className="nav-label">{n.label}</span>
        </button>
      ))}
    </nav>
  );
}

/* ═══════════════════════════════════════
   APP
═══════════════════════════════════════ */
function App() {
  const saved = useMemo(() => loadState(), []);

  const [settings] = useState(() => {
    const def = {
      firebaseUrl: FB_URL, syncKey: '',
      googleMapsKey: 'AIzaSyAZhMPQ3rdplpqNhYx5oNrZV5HJfcTq1Dw',
    };
    return { ...def, ...(saved?.settings || {}), firebaseUrl: FB_URL };
  });

  const [trips, setTrips] = useState(() => {
    const raw = saved?.trips;
    if (raw?.length > 0) {
      const n = raw.map(normTrip).filter(Boolean);
      if (n.length > 0) return n;
    }
    return [];
  });

  const [activeId, setActiveId] = useState(
    saved?.activeId || saved?.trips?.[0]?.id || null
  );
  const [screen, setScreen] = useState('map');
  const [syncStatus, setSyncStatus] = useState('idle');
  const skipNextPush = useRef(false);

  const trip = useMemo(() => trips.find(t => t.id === activeId) || trips[0] || null, [trips, activeId]);

  /* ── load from Firebase on mount ── */
  const loadFromFirebase = useCallback(async () => {
    const { firebaseUrl: fbUrl, syncKey } = settings;
    if (!fbUrl || !syncKey) return;
    setSyncStatus('syncing');
    try {
      const data = await fbRead(fbUrl, syncKey);
      if (data?.trips?.length > 0) {
        const loaded = data.trips.map(normTrip).filter(Boolean);
        if (loaded.length > 0) {
          skipNextPush.current = true;
          setTrips(loaded);
          if (data.activeId) setActiveId(data.activeId);
          toast('הטיול נטען מ-Firebase ✓', 'success');
        }
      }
      setSyncStatus('synced');
    } catch (e) {
      setSyncStatus('error');
      toast('שגיאה בטעינה מ-Firebase', 'error');
    }
  }, [settings]);

  useEffect(() => { loadFromFirebase(); }, []); // eslint-disable-line

  /* ── persist to localStorage when trips change ── */
  useEffect(() => {
    if (trips.length > 0) saveState({ settings, trips, activeId });
  }, [trips, activeId]); // eslint-disable-line

  return (
    <>
      <ToastLayer />
      <div className="screen-wrap">
        <MapScreen
          trip={trip}
          active={screen === 'map'}
        />
        <ScheduleScreen
          trip={trip}
          active={screen === 'schedule'}
        />
        <BankScreen
          trip={trip}
          active={screen === 'bank'}
        />
        <TripScreen
          trips={trips}
          activeId={activeId}
          onSelectTrip={setActiveId}
          syncStatus={syncStatus}
          onRefresh={loadFromFirebase}
          active={screen === 'trip'}
        />
      </div>
      <BottomNav active={screen} onChange={setScreen} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
