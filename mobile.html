    toast('קשר נותק ושעות עודכנו ✓','s');
  };
  const addBlock=type=>{
    setBankPickForBlock({type}); // show bank / map / manual picker
  };
  const addEmptyBlock=type=>{
    const last=sorted[sorted.length-1];
    const startTime=last?.endTime||day?.startTime||'09:00';
    const endTime=addMins(startTime,type==='travel'?30:60);
    const b={id:uid(),type,title:'',startTime,endTime,note:'',placeId:'',address:'',lat:null,lng:null};
    setBankPickForBlock(null);
    setEditing({...b,_isNew:true});
  };
  const bankPickedForBlock=(item,type)=>{
    const last=sorted[sorted.length-1];
    const startTime=last?.endTime||day?.startTime||'09:00';
    const endTime=addMins(startTime,60);
    const b={id:uid(),type,
      title:item.name||'',startTime,endTime,
      note:item.note||'',
      placeId:item.placeId||'',address:item.address||'',
      lat:item.lat||null,lng:item.lng||null,
      placeRating:item.rating||null,placeWebsite:item.website||'',
      placePhone:item.phone||'',placeTodayHours:item.todayHours||'',
      placeOpenStatus:item.openStatus||'',placeType:item.placeType||'',
      placePhotoUrl:item.photoUrl||'',
    };
    setBankPickForBlock(null);
    setEditing({...b,_isNew:true});
  };
  const insertTravelBlock=(dayId,afterBlockId,rawMin,rawKm=null)=>{
    const buf=settings?.travelBuffer??1.2;
    const buffered=Math.round(rawMin*buf);
    const dayBlks=[...(trip.days.find(d=>d.id===dayId)?.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const afterBlk=dayBlks.find(b=>b.id===afterBlockId);
    const travelStart=afterBlk?.endTime||'';
    const travelEnd=travelStart?addMins(travelStart,buffered):'';
    const blk={id:uid(),type:'travel',title:`🚗 נסיעה (~${fmtTravelMin(buffered)}${rawKm!=null?', '+fmtKm(Math.round(rawKm*10)/10):''})`,
      startTime:travelStart,endTime:travelEnd,note:'',isAutoTravel:true};
    onUpdate({...trip,days:trip.days.map(d=>{
      if(d.id!==dayId)return d;
      const idx=dayBlks.findIndex(b=>b.id===afterBlockId);
      if(idx===-1)return{...d,blocks:[...dayBlks,blk]};
      const tail=dayBlks.slice(idx+1).map(b=>({...b,
        startTime:addMins(b.startTime,buffered),
        endTime:b.endTime?addMins(b.endTime,buffered):b.endTime}));
      return{...d,blocks:[...dayBlks.slice(0,idx+1),blk,...tail]};
    })});
    toast(`🚗 נסיעה של ${fmtTravelMin(buffered)} נוספה ✓`,'s');
  };

  /* ── תחבורה ציבורית — Google Directions Transit ── */
  const getVehicleIcon=t=>({BUS:'🚌',RAIL:'🚆',SUBWAY:'🚇',TRAM:'🚊',FERRY:'⛴️',HEAVY_RAIL:'🚆',HIGH_SPEED_TRAIN:'🚅',COMMUTER_TRAIN:'🚃',METRO_RAIL:'🚇',MONORAIL:'🚝',CABLE_CAR:'🚡'}[t]||'🚌');

  const searchTransit=(fromBlock,toBlock,insertMode='between')=>{
    if(!window.google?.maps?.DirectionsService){toast('Google Maps לא זמין','e');return;}
    const{lat:fLat,lng:fLng}=fromBlock,{lat:tLat,lng:tLng}=toBlock;
    if(!fLat||!fLng||!tLat||!tLng){toast('חסרים נתוני מיקום','e');return;}
    setTransitSearch({loading:true,fromBlockId:fromBlock.id,toBlockId:toBlock.id,insertMode,fromLat:fLat,fromLng:fLng,toLat:tLat,toLng:tLng,results:null,error:null});
    let dep=new Date();
    if(day?.date&&fromBlock.endTime){const t=new Date(day.date+'T'+fromBlock.endTime+':00');if(!isNaN(t)&&t>new Date())dep=t;}
    const tRouteOpts={departureTime:dep};
    if(window.google.maps.TransitRoutePreference?.FEWER_TRANSFERS)tRouteOpts.routingPreference=window.google.maps.TransitRoutePreference.FEWER_TRANSFERS;
    new window.google.maps.DirectionsService().route({
      origin:{lat:fLat,lng:fLng},destination:{lat:tLat,lng:tLng},
      travelMode:window.google.maps.TravelMode.TRANSIT,
      transitOptions:tRouteOpts,
      provideRouteAlternatives:true,
    },(result,status)=>{
      if(status!=='OK'||!result?.routes?.length){
        console.warn('[transit]',status,result);
        const errMsg=status==='REQUEST_DENIED'
          ?'REQUEST_DENIED — ב-Google Cloud Console → Credentials → לחץ על המפתח → "API restrictions" → הוסף "Directions API" לרשימת ה-APIs של המפתח (לא רק בפרויקט)'
          :`לא נמצאו קווים בין הנקודות האלה (${status})`;
        setTransitSearch(p=>p?{...p,loading:false,results:null,error:errMsg}:null);return;
      }
      const routes=result.routes.map(r=>{
        const leg=r.legs[0];
        const durationMins=Math.ceil(leg.duration.value/60);
        const steps=(leg.steps||[])
          .filter(s=>s.travel_mode==='TRANSIT'||s.travel_mode==='WALKING')
          .map(s=>s.travel_mode==='WALKING'
            ?{type:'walk',icon:'🚶',durationMins:Math.ceil((s.duration?.value||0)/60),distanceM:s.distance?.value||0}
            :{type:'transit',icon:getVehicleIcon(s.transit.line.vehicle.type),
              lineName:s.transit.line.name||s.transit.line.short_name||'',
              lineShort:s.transit.line.short_name||'',
              departure:s.transit.departure_stop?.name||'',
              arrival:s.transit.arrival_stop?.name||'',
              numStops:s.transit.num_stops||0,
              durationMins:Math.ceil((s.duration?.value||0)/60)});
        const summary=steps.filter(s=>s.type==='transit').map(s=>`${s.icon}${s.lineShort||s.lineName}`).join('+');
        return{durationMins,summary,transfers:Math.max(0,steps.filter(s=>s.type==='transit').length-1),steps};
      });
      setTransitSearch(p=>p?{...p,loading:false,results:routes,error:null}:null);
    });
  };

  const fmtTransitNote=steps=>steps.map(s=>
    s.type==='walk'
      ?`🚶 ${s.durationMins} דק' הליכה${s.distanceM>=50?' ('+( s.distanceM>=1000?(s.distanceM/1000).toFixed(1)+'ק"מ':s.distanceM+'מ\'')+')'  :''}`
      :`${s.icon} ${s.lineName||s.lineShort}: ${s.departure}→${s.arrival}${s.numStops>0?` (${s.numStops} תח')`:''}`
  ).join(' | ');
  const transitFirstIcon=steps=>{const t=steps.find(s=>s.type==='transit');return t?.icon||'🚌';};

  const insertTransitBlock=(dayId,afterBlockId,route)=>{
    const dayBlks=[...(trip.days.find(d=>d.id===dayId)?.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const afterBlk=dayBlks.find(b=>b.id===afterBlockId);
    const tStart=afterBlk?.endTime||'';
    const tEnd=tStart?addMins(tStart,route.durationMins):'';
    const blk={id:uid(),type:'travel',title:`${route.summary} (~${fmtTravelMin(route.durationMins)})`,
      startTime:tStart,endTime:tEnd,note:fmtTransitNote(route.steps),isAutoTravel:true,isTransit:true};
    onUpdate({...trip,days:trip.days.map(d=>{
      if(d.id!==dayId)return d;
      const idx=dayBlks.findIndex(b=>b.id===afterBlockId);
      if(idx===-1)return{...d,blocks:[...dayBlks,blk]};
      const tail=dayBlks.slice(idx+1).map(b=>({...b,
        startTime:addMins(b.startTime,route.durationMins),
        endTime:b.endTime?addMins(b.endTime,route.durationMins):b.endTime}));
      return{...d,blocks:[...dayBlks.slice(0,idx+1),blk,...tail]};
    })});
    setTransitSearch(null);
    toast(`${transitFirstIcon(route.steps)} קו תחבורה נוסף ✓`,'s');
  };

  const insertTransitBlockBeforeFirst=(route)=>{
    if(!sorted.length)return;
    const dayBlks=day?.blocks||[];
    const firstStart=sorted[0].startTime||'09:00';
    const blk={id:uid(),type:'travel',title:`${route.summary} (~${fmtTravelMin(route.durationMins)})`,
      startTime:firstStart,endTime:addMins(firstStart,route.durationMins),
      note:fmtTransitNote(route.steps),isAutoTravel:true,isTransit:true};
    const shifted=dayBlks.map(b=>({...b,
      startTime:addMins(b.startTime,route.durationMins),
      endTime:b.endTime?addMins(b.endTime,route.durationMins):b.endTime}));
    onUpdate({...trip,days:trip.days.map(d=>d.id!==day.id?d:{...d,blocks:[blk,...shifted]})});
    setTransitSearch(null);
    toast(`${transitFirstIcon(route.steps)} קו תחבורה נוסף לתחילת הלוז ✓`,'s');
  };
  const insertTransitBlockEndMob=(route)=>{
    if(!sorted.length)return;
    const last2=sorted[sorted.length-1];
    const tStart=last2.endTime||addMins(last2.startTime||'09:00',60);
    const blk={id:uid(),type:'travel',title:`${route.summary} (~${fmtTravelMin(route.durationMins)})`,
      startTime:tStart,endTime:addMins(tStart,route.durationMins),
      note:fmtTransitNote(route.steps),isAutoTravel:true,isTransit:true};
    onUpdate({...trip,days:trip.days.map(d=>d.id!==day.id?d:{...d,blocks:[...(d.blocks||[]),blk]})});
    setTransitSearch(null);
    toast(`${transitFirstIcon(route.steps)} קו תחבורה נוסף לסיום הלוז ✓`,'s');
  };

  /* ── הליכה רגלית (Google Directions WALKING) ── */
  const searchWalking=(fromBlock,toBlock,insertMode='between')=>{
    if(!window.google?.maps?.DirectionsService){toast('Google Maps לא זמין','e');return;}
    const{lat:fLat,lng:fLng}=fromBlock,{lat:tLat,lng:tLng}=toBlock;
    if(!fLat||!fLng||!tLat||!tLng){toast('חסרים נתוני מיקום','e');return;}
    setTransitSearch({loading:true,fromBlockId:fromBlock.id,toBlockId:toBlock.id,insertMode,
      fromLat:fLat,fromLng:fLng,toLat:tLat,toLng:tLng,results:null,error:null,isWalking:true});
    new window.google.maps.DirectionsService().route({
      origin:{lat:fLat,lng:fLng},destination:{lat:tLat,lng:tLng},
      travelMode:window.google.maps.TravelMode.WALKING,
      provideRouteAlternatives:true,
    },(result,status)=>{
      if(status!=='OK'||!result?.routes?.length){
        const errMsg=status==='REQUEST_DENIED'
          ?'REQUEST_DENIED — ב-Google Cloud Console → הוסף "Directions API" למגבלות המפתח'
          :`לא נמצא מסלול הליכה (${status})`;
        setTransitSearch(p=>p?{...p,loading:false,results:null,error:errMsg}:null);return;
      }
      const routes=result.routes.map(r=>{
        const leg=r.legs[0];
        const durationMins=Math.ceil(leg.duration.value/60);
        const distanceM=leg.distance?.value||0;
        const distanceText=distanceM>=1000?(distanceM/1000).toFixed(1)+'ק"מ':distanceM+'מ\'';
        const steps=(leg.steps||[]).map(s=>({
          type:'walk_step',
          instruction:(s.html_instructions||'').replace(/<[^>]+>/g,'').trim(),
          durationMins:Math.ceil((s.duration?.value||0)/60),
          distanceM:s.distance?.value||0,
        }));
        return{durationMins,distanceM,distanceText,steps};
      });
      setTransitSearch(p=>p?{...p,loading:false,results:routes,error:null}:null);
    });
  };
  const insertWalkingBlock=(dayId,afterBlockId,route)=>{
    const dayBlks=[...(trip.days.find(d=>d.id===dayId)?.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const afterBlk=dayBlks.find(b=>b.id===afterBlockId);
    const tStart=afterBlk?.endTime||'';
    const tEnd=tStart?addMins(tStart,route.durationMins):'';
    const blk={id:uid(),type:'travel',
      title:`🚶 הליכה (~${fmtTravelMin(route.durationMins)}, ${route.distanceText})`,
      startTime:tStart,endTime:tEnd,note:'',isAutoTravel:true,isWalking:true};
    onUpdate({...trip,days:trip.days.map(d=>{
      if(d.id!==dayId)return d;
      const idx=dayBlks.findIndex(b=>b.id===afterBlockId);
      if(idx===-1)return{...d,blocks:[...dayBlks,blk]};
      const tail=dayBlks.slice(idx+1).map(b=>({...b,
        startTime:addMins(b.startTime,route.durationMins),
        endTime:b.endTime?addMins(b.endTime,route.durationMins):b.endTime}));
      return{...d,blocks:[...dayBlks.slice(0,idx+1),blk,...tail]};
    })});
    setTransitSearch(null);
    toast(`🚶 הליכה ${route.distanceText} נוספה ✓`,'s');
  };
  const insertWalkingBlockBeforeFirst=(route)=>{
    if(!sorted.length)return;
    const dayBlks=day?.blocks||[];
    const firstStart=sorted[0].startTime||'09:00';
    const blk={id:uid(),type:'travel',
      title:`🚶 הליכה (~${fmtTravelMin(route.durationMins)}, ${route.distanceText})`,
      startTime:firstStart,endTime:addMins(firstStart,route.durationMins),
      note:'',isAutoTravel:true,isWalking:true};
    const shifted=dayBlks.map(b=>({...b,
      startTime:addMins(b.startTime,route.durationMins),
      endTime:b.endTime?addMins(b.endTime,route.durationMins):b.endTime}));
    onUpdate({...trip,days:trip.days.map(d=>d.id!==day.id?d:{...d,blocks:[blk,...shifted]})});
    setTransitSearch(null);
    toast(`🚶 הליכה נוספה לתחילת הלוז ✓`,'s');
  };
  const insertWalkingBlockEndMob=(route)=>{
    if(!sorted.length)return;
    const last2=sorted[sorted.length-1];
    const tStart=last2.endTime||addMins(last2.startTime||'09:00',60);
    const blk={id:uid(),type:'travel',
      title:`🚶 הליכה (~${fmtTravelMin(route.durationMins)}, ${route.distanceText})`,
      startTime:tStart,endTime:addMins(tStart,route.durationMins),
      note:'',isAutoTravel:true,isWalking:true};
    onUpdate({...trip,days:trip.days.map(d=>d.id!==day.id?d:{...d,blocks:[...(d.blocks||[]),blk]})});
    setTransitSearch(null);
    toast(`🚶 הליכה נוספה לסיום הלוז ✓`,'s');
  };

  // הוספת נסיעה לפני הבלוק הראשון (מוצא → ראשון)
  // נסיעה מתחילה בשעת הבלוק הראשון, כל הבלוקים מוזזים buffered דקות קדימה
  const insertTravelBeforeFirst=(dayId,rawMin)=>{
    const buf=settings?.travelBuffer??1.2;
    const buffered=Math.round(rawMin*buf);
    const dayBlks=trip.days.find(d=>d.id===dayId)?.blocks||[];
    if(!dayBlks.length)return;
    const firstStart=[...dayBlks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''))[0].startTime||'09:00';
    const blk={id:uid(),type:'travel',title:`🚗 נסיעה (~${fmtTravelMin(buffered)})`,
      startTime:firstStart,endTime:addMins(firstStart,buffered),note:'',isAutoTravel:true};
    // כל הבלוקים הקיימים מוזזים קדימה ב-buffered דקות
    const shifted=dayBlks.map(b=>({
      ...b,
      startTime:addMins(b.startTime,buffered),
      endTime:b.endTime?addMins(b.endTime,buffered):b.endTime,
    }));
    onUpdate({...trip,days:trip.days.map(d=>
      d.id!==dayId?d:{...d,blocks:[blk,...shifted]}
    )});
    toast(`🚗 נסיעה של ${fmtTravelMin(buffered)} נוספה לתחילת הלוז ✓`,'s');
  };

  const blockDurStr=b=>{
    if(!b.startTime||!b.endTime)return null;
    const m=toMinsStr(b.endTime)-toMinsStr(b.startTime);
    if(m<=0)return null;
    return m>=60?`${Math.floor(m/60)}ש'${m%60?` ${m%60}ד`:''}`:` ${m}ד`;
  };

  // cascade all blocks to match day.startTime
  const cascadeBlocks=()=>{
    if(!sorted.length)return;
    const dayStartM=toMinsStr(day.startTime||'08:00');
    const firstM=toMinsStr(sorted[0].startTime);
    const delta=dayStartM-firstM;
    if(delta===0){toast('הפעילויות כבר מסונכרנות עם שעת ההתחלה ✓','s');return;}
    const newBlocks=sorted.map(b=>({
      ...b,
      startTime:addMins(b.startTime,delta),
      endTime:b.endTime?addMins(b.endTime,delta):b.endTime
    }));
    updDay({blocks:newBlocks});
    toast(`שעות עודכנו ${delta>0?'+':''}${delta} דקות ✓`,'s');
  };

  // pick location from bank
  const pickLocation=(item,field)=>{
    updDay(field==='start'
      ?{startLocation:item.name,startLat:item.lat||null,startLng:item.lng||null}
      :{endLocation:item.name,endLat:item.lat||null,endLng:item.lng||null});
    setLocationPicking(null);
    toast(`${field==='start'?'נקודת מוצא':'נקודת יעד'} עודכנה ✓`,'s');
  };

  // end time overrun
  const lastBlock=sorted[sorted.length-1];
  const dayEndM=toMinsStr(day?.endTime||'20:00');
  const lastEndM=lastBlock?toMinsStr(lastBlock.endTime||lastBlock.startTime):0;
  const overrunMins=lastEndM-dayEndM;

  // cascade needed?
  const cascadeNeeded=sorted.length>0&&toMinsStr(sorted[0].startTime)!==toMinsStr(day?.startTime||'08:00');

  // "now" indicator
  const nowStr=nowTimeStr();
  const nowM=toMinsStr(nowStr);
  const isToday=!day?.date||day.date===todayISO();
  let nowInsertIdx=-1;
  if(isToday&&sorted.length>0){
    const firstM=toMinsStr(sorted[0].startTime);
    const lastEndM=toMinsStr(sorted[sorted.length-1].endTime||sorted[sorted.length-1].startTime);
    if(nowM>=firstM-5&&nowM<=lastEndM+30){
      nowInsertIdx=sorted.findIndex(b=>nowM<toMinsStr(b.startTime));
      if(nowInsertIdx===-1)nowInsertIdx=sorted.length;
    }
  }

  const nowLine=(
    <div style={{display:'flex',alignItems:'center',gap:6,margin:'2px 0 6px',pointerEvents:'none'}}>
      <span style={{background:'#ef4444',color:'#fff',fontSize:10,fontWeight:700,
        padding:'2px 8px',borderRadius:10,flexShrink:0,letterSpacing:'0.02em'}}>⏱ {nowStr}</span>
      <div style={{flex:1,height:2,background:'#ef4444',borderRadius:2,opacity:.8}}/>
    </div>
  );

  const inpSt={background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:7,
    padding:'7px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none'};

  return(
    <div className={`screen${active?'':' h'}`} onTouchStart={onTS} onTouchEnd={onTE}>
      <div className="sh">
        <div className="stitle">📅 לוז הטיול</div>
        {trip&&<div className="ssub">{trip.name} · {days.length} ימים</div>}
      </div>

      {!trip&&<div className="empty"><div className="eicon">📅</div><div className="etitle">אין טיול פעיל</div></div>}
      {trip&&days.length===0&&<div className="empty"><div className="eicon">📅</div><div className="etitle">אין ימים בלוז</div><div className="edesc">הוסף ימים דרך אפליקציית המחשב</div></div>}

      {day&&<>
        {/* day navigation */}
        <div className="day-nav">
          <button className="day-nav-btn" onClick={()=>setDayIdx(i=>i+1)} disabled={safeIdx>=days.length-1}>‹</button>
          <div className="day-nav-center">
            <div className="day-nav-title">יום {safeIdx+1}</div>
            <div className="day-nav-sub">
              {sorted.length} פעילויות{dayWx&&<span style={{opacity:.8}}> · {WMO[dayWx.code]?.[0]||'🌡️'}{dayWx.tMax}°</span>}
            </div>
          </div>
          {onShowOnMap&&(sorted.some(b=>b.lat&&b.lng)||(day.startLat&&day.startLng)||(day.endLat&&day.endLng))&&(
            <button title="הצג את כל עצירות היום על המפה"
              onClick={()=>{
                const hlBlocks=[
                  ...(day.startLat&&day.startLng?[{id:'__start__',lat:day.startLat,lng:day.startLng,title:`🟢 ${day.startLocation||'מוצא'}`,startTime:'00:00'}]:[]),
                  ...sorted, // כולל בלוקי נסיעה (ללא lat/lng) לצורך ציור מסלולים
                  ...(day.endLat&&day.endLng?[{id:'__end__',lat:day.endLat,lng:day.endLng,title:`🔴 ${day.endLocation||'יעד'}`,startTime:'23:59'}]:[]),
                ];
                onShowOnMap({fitBounds:true,hlBlocks,dayIndex:safeIdx});
              }}
              style={{fontSize:16,width:36,height:36,borderRadius:9,border:'1px solid var(--border)',background:'var(--surface)',cursor:'pointer',flexShrink:0}}>🗺️</button>
          )}
          <button className="day-nav-btn" onClick={()=>setDayIdx(i=>i-1)} disabled={safeIdx<=0}>›</button>
        </div>
        {days.length>1&&<div className="day-dots">
          {days.map((_,i)=><div key={i} className={`day-dot${i===safeIdx?' active':''}`} onClick={()=>setDayIdx(i)}/>)}
        </div>}

        {/* start / end location */}
        <div style={{padding:'8px 14px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          {/* מוצא */}
          <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:4}}>
            <span style={{fontSize:11,color:'var(--green)',fontWeight:700,width:42,flexShrink:0}}>🟢 מוצא</span>
            <input value={day.startLocation||''} onChange={e=>updDay({startLocation:e.target.value})}
              placeholder="מאיפה יוצאים..." style={{...inpSt,flex:1,direction:'rtl',minWidth:0}}/>
            <input type="time" value={day.startTime||'08:00'} onChange={e=>updDay({startTime:e.target.value})}
              style={{...inpSt,direction:'ltr',width:72,flexShrink:0}}/>
            <button onClick={()=>setLocationPicking({field:'start'})}
              title="בחר מהבנק או מהמפה"
              style={{flexShrink:0,padding:'6px 7px',fontSize:14,background:'var(--bg2)',
                border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',lineHeight:1}}>📍</button>
            {day.startLat&&day.startLng&&<a href={`https://www.google.com/maps?q=${day.startLat},${day.startLng}`}
              target="_blank" rel="noreferrer"
              style={{padding:'0 4px',fontSize:16,textDecoration:'none',color:'#4285F4',display:'inline-flex',alignItems:'center',flexShrink:0}}
              title="פתח בגוגל מפות">↗</a>}
          </div>
          {/* cascade hint */}
          {cascadeNeeded&&(
            <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4,paddingRight:48}}>
              <span style={{fontSize:10,color:'var(--text3)',flex:1}}>פעילות ראשונה ב-{sorted[0].startTime} — שעת יום שונה</span>
              <button onClick={cascadeBlocks}
                style={{fontSize:10,padding:'3px 8px',borderRadius:6,border:'1px solid var(--accent2)',
                  background:'rgba(79,142,247,.12)',color:'var(--accent2)',cursor:'pointer',
                  fontFamily:'Heebo,sans-serif',fontWeight:700,flexShrink:0}}>
                ↕ הזז הכל
              </button>
            </div>
          )}
          {/* יעד */}
          <div style={{display:'flex',alignItems:'center',gap:5}}>
            <span style={{fontSize:11,color:'var(--red)',fontWeight:700,width:42,flexShrink:0}}>🔴 יעד</span>
            <input value={day.endLocation||''} onChange={e=>updDay({endLocation:e.target.value})}
              placeholder="לאן מגיעים..." style={{...inpSt,flex:1,direction:'rtl',minWidth:0}}/>
            <input type="time" value={day.endTime||'20:00'} onChange={e=>updDay({endTime:e.target.value})}
              style={{...inpSt,direction:'ltr',width:72,flexShrink:0}}/>
            <button onClick={()=>setLocationPicking({field:'end'})}
              title="בחר מהבנק או מהמפה"
              style={{flexShrink:0,padding:'6px 7px',fontSize:14,background:'var(--bg2)',
                border:'1px solid var(--border)',borderRadius:7,cursor:'pointer',lineHeight:1}}>📍</button>
            {day.endLat&&day.endLng&&<a href={`https://www.google.com/maps?q=${day.endLat},${day.endLng}`}
              target="_blank" rel="noreferrer"
              style={{padding:'0 4px',fontSize:16,textDecoration:'none',color:'#4285F4',display:'inline-flex',alignItems:'center',flexShrink:0}}
              title="פתח בגוגל מפות">↗</a>}
          </div>
        </div>

        {/* add block buttons */}
        <div style={{display:'flex',gap:6,padding:'8px 14px',overflowX:'auto',
          borderBottom:'1px solid var(--border)',flexShrink:0,background:'var(--bg2)'}}>
          {BLOCK_TYPES.map(t=>(
            <button key={t} onClick={()=>addBlock(t)}
              style={{padding:'5px 11px',borderRadius:10,flexShrink:0,
                border:`1px solid ${BLOCK_COLOR[t]}55`,background:`${BLOCK_COLOR[t]}22`,
                color:BLOCK_COLOR[t],fontSize:12,fontWeight:700,
                fontFamily:'Heebo,sans-serif',cursor:'pointer',whiteSpace:'nowrap'}}>
              + {BLOCK_EMOJI[t]}
            </button>
          ))}
        </div>

        {/* swap mode banner */}
        {swapSrc&&(
          <div style={{background:'rgba(245,158,11,.15)',border:'1px solid rgba(245,158,11,.45)',
            margin:'8px 14px 0',borderRadius:10,padding:'9px 12px',
            display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
            <span style={{fontSize:15}}>🔄</span>
            <div style={{flex:1,fontSize:12,fontWeight:600,color:'#d97706',lineHeight:1.4}}>
              בחר פעילות בלו"ז להחלפה עם "{swapSrc.name}"
            </div>
            <button onClick={()=>setSwapSrc(null)}
              style={{background:'none',border:'none',cursor:'pointer',fontSize:18,
                color:'var(--text3)',padding:'0 2px',lineHeight:1,flexShrink:0}}>✕</button>
          </div>
        )}

        {/* blocks list */}
        {sorted.length===0&&(
          <div style={{padding:'28px 16px',textAlign:'center',color:'var(--text3)',fontSize:13}}>
            אין פעילויות — לחץ + להוסיף
          </div>
        )}
        <div style={{flex:1,overflowY:'auto'}}>
          <div style={{padding:'10px 14px 4px'}}>
            {/* start location → first block connector */}
            {sorted.length>0&&day?.startLat&&day?.startLng&&sorted[0].type!=='travel'&&(()=>{
              const first=sorted[0];
              const firstHasCoords=!!(first.lat&&first.lng);
              const key=`__start__->${first.id}`;
              const tt=travelTimes[key];
              const wt=travelTimes[`walk:${key}`];
              const hasCar=tt&&!tt.loading&&tt.min!=null;
              if(!hasCar&&!firstHasCoords)return null;
              const buf2=settings?.travelBuffer??1.2;
              return(
                <div style={{display:'flex',alignItems:'center',gap:7,padding:'5px 10px',marginBottom:8,
                    background:'rgba(34,197,94,.07)',borderRadius:8,border:'1px solid rgba(34,197,94,.2)',flexWrap:'wrap'}}>
                  <span style={{fontSize:11,color:'var(--green)',flex:1,lineHeight:1.45}}>
                    🟢 {day.startLocation||'מוצא'} → ראשון
                    {hasCar&&<>: {fmtTravelMin(tt.min)} נסיעה{buf2>1.01&&<span style={{opacity:.75}}> = <b>{fmtTravelMin(Math.round(tt.min*buf2))}</b></span>}</>}
                  </span>

                      <span style={{fontWeight:700,fontSize:14,color:'var(--text)',flex:1,textAlign:'right'}}>{route.distanceText}</span>
                      <span style={{fontWeight:700,color:'var(--accent2)',fontSize:14,flexShrink:0}}>{fmtTravelMin(route.durationMins)}</span>
                    </div>
                  ):(
                    /* תחבורה — קווים + זמן + תחנות */
                    <>
                      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                        <span style={{fontSize:18}}>{route.steps.find(s=>s.type==='transit')?.icon||'🚌'}</span>
                        <span style={{fontWeight:700,fontSize:14,color:'var(--text)',flex:1,textAlign:'right'}}>{route.summary||'קו תחבורה'}</span>
                        <span style={{fontWeight:700,color:'var(--accent2)',fontSize:14,flexShrink:0}}>{fmtTravelMin(route.durationMins)}</span>
                      </div>
                      {(()=>{
                        const ts=route.steps.filter(s=>s.type==='transit');
                        if(!ts.length)return null;
                        return(
                          <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.8,direction:'ltr',textAlign:'left'}}>
                            {ts.map((s,i)=>(
                              <React.Fragment key={i}>
                                {i===0&&<div>📍 <b>Board:</b> {s.departure}</div>}
                                <div style={{paddingLeft:12,color:'var(--text3)'}}>
                                  {s.icon} {s.lineShort||s.lineName}{s.numStops>0?` · ${s.numStops} stop${s.numStops!==1?'s':''}`:''}

                                <div style={{color:i<ts.length-1?'var(--amber)':'inherit'}}>

                                    :<span>📍 <b>Alight:</b> {s.arrival}</span>
                                  }
                                </div>
                              </React.Fragment>
                            ))}
                          </div>
                        );
                      })()}
                    </>
                  )}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* end time overrun warning */}
      {day&&overrunMins>0&&(
        <div style={{margin:'6px 14px 0',padding:'8px 12px',flexShrink:0,
          background:'rgba(234,179,8,.07)',borderRadius:8,border:'1px solid rgba(234,179,8,.3)',
          display:'flex',gap:8,alignItems:'center'}}>
          <span style={{fontSize:11,color:'var(--amber)',flex:1,lineHeight:1.4}}>
            ⚠️ הלוז חורג מזמן הסיום ({day.endTime}) ב-<b>{fmtTravelMin(overrunMins)}</b>
            {lastBlock&&` — הפעילות האחרונה מסתיימת ב-${lastBlock.endTime||lastBlock.startTime}`}
          </span>
        </div>
      )}

      {/* block edit sheet */}
      {editing&&(()=>{
        const esi=sorted.findIndex(b=>b.id===editing.id);
        const editPrev=esi>0?sorted[esi-1]:null;
        const editPrevEnd=editPrev?(editPrev.endTime||addMins(editPrev.startTime||'09:00',60)):null;
        return <BlockEditSheet
          block={editing} isNew={!!editing._isNew} onSave={saveBlock}
          onDelete={editing._isNew?()=>setEditing(null):()=>deleteBlock(editing.id)}
          onClose={()=>setEditing(null)}
          prevEndTime={editPrevEnd} onCascadeSave={cascadeSaveBlock} onCascadeSaveUnlink={cascadeSaveBlockUnlink}/>;
      })()}

      {/* location picker sheet */}
      {locationPicking&&(
        <LocationPickerSheet
          bank={trip?.interestBank||[]}
          title={locationPicking.field==='start'?'🟢 בחר נקודת מוצא':'🔴 בחר נקודת יעד'}
          onPick={item=>pickLocation(item,locationPicking.field)}
          onPickFromMap={onPickFromMap?()=>{
            const f=locationPicking.field;
            setLocationPicking(null);
            onPickFromMap(
              f==='start'?'🟢 גע על המפה לבחירת נקודת המוצא':'🔴 גע על המפה לבחירת נקודת היעד',
              place=>{
                updDay(f==='start'
                  ?{startLocation:place.name,startLat:place.lat,startLng:place.lng}

      {/* bank picker for adding a block */}

        <LocationPickerSheet
          bank={trip?.interestBank||[]}

          onPick={item=>bankPickedForBlock(item,bankPickForBlock.type)}
          onPickFromMap={onPickFromMap?()=>{
            const t=bankPickForBlock.type;
            setBankPickForBlock(null);
            onPickFromMap(
              `${BLOCK_EMOJI[t]} בחר מקום על המפה`,
              place=>{
                const last=sorted[sorted.length-1];
                const startTime=last?.endTime||day?.startTime||'09:00';
                const endTime=addMins(startTime,60);
                const b={id:uid(),type:t,title:place.name||'',startTime,endTime,
                  note:'',placeId:'',address:place.address||'',
                  lat:place.lat||null,lng:place.lng||null};

          onCreateEmpty={()=>addEmptyBlock(bankPickForBlock.type)}

      )}
    </div>
  );

/* ════════════════════════════════
   BANK SCREEN
════════════════════════════════ */
const haversineKm=(lat1,lng1,lat2,lng2)=>{
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
};
const fmtDist=km=>km===Infinity?'':km<1?`${Math.round(km*1000)}מ׳`:`${km<10?km.toFixed(1):Math.round(km)}ק"מ`;

function BankScreen({trip,active,onShowOnMap,onUpdate}){
  const[search,setSearch]=useState('');
  const[sortMode,setSortMode]=useState('default'); // 'default'|'name'|'distance'
  const[userPos,setUserPos]=useState(null); // {lat,lng}
  const[expanded,setExpanded]=useState(new Set()); // מדינות פתוחות — ברירת מחדל: סגורות
  const[filterSrc,setFilterSrc]=useState(null);
  const[dayBankSel,setDayBankSel]=useState(null); // פריט הממתין להוספה לבנק יומי
  const[dayActionSel,setDayActionSel]=useState(null); // {item, mode:'sched'|'start'|'end'}
  const[noteEditItem,setNoteEditItem]=useState(null); // פריט שעורכים הערה שלו
  const[noteEditVal,setNoteEditVal]=useState('');
  const openNoteEdit=(item)=>{setNoteEditItem(item);setNoteEditVal(item.note||'');};
  const saveNoteEdit=()=>{
    if(!noteEditItem||!trip)return;
    const note=noteEditVal.trim();
    onUpdate({...trip,interestBank:(trip.interestBank||[]).map(i=>i.id===noteEditItem.id?{...i,note}:i)});
    setNoteEditItem(null);
  };
  const bank=trip?.interestBank||[];
  const days=trip?.days||[];

  const addToDayBank=(dayId)=>{
    if(!dayBankSel||!trip)return;
    const day=trip.days.find(d=>d.id===dayId);
    if(!day)return;
    const already=(day.dayBank||[]).some(i=>i.placeId&&i.placeId===dayBankSel.placeId&&dayBankSel.placeId);
    if(already){toast('כבר קיים בבנק היומי','w');setDayBankSel(null);return;}
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,dayBank:[...(d.dayBank||[]),{...dayBankSel,id:uid()}]}:d)});
    toast(`"${dayBankSel.name}" נוסף לבנק יומי 📌`,'s');
    setDayBankSel(null);
  };

  const execDayAction=(dayId)=>{
    if(!dayActionSel||!trip)return;
    const{item,mode}=dayActionSel;
    if(mode==='sched'){
      const day=trip.days.find(d=>d.id===dayId);
      if(!day)return;
      const sorted=[...(day.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
      const last=sorted[sorted.length-1];
      const start=last?.endTime||day.startTime||'09:00';
      const blk={id:uid(),type:'activity',title:item.name,
        startTime:start,endTime:addMins(start,90),
        note:'',address:item.address||'',lat:item.lat||null,lng:item.lng||null,
        placeId:item.placeId||'',placeRating:item.rating||null,placeType:item.placeType||'',
        placeOpenStatus:item.openStatus||'',placeTodayHours:item.todayHours||'',
        placePhone:item.phone||'',placeWebsite:item.website||''};
      onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,blocks:[...(d.blocks||[]),blk]}:d)});
      toast(`"${item.name}" נוסף ללוז 📅`,'s');
    } else if(mode==='start'){
      onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,startLocation:item.name||'',startLat:item.lat||null,startLng:item.lng||null}:d)});
      toast(`"${item.name}" הוגדר כנקודת מוצא 🟢`,'s');
    } else if(mode==='end'){
      onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,endLocation:item.name||'',endLat:item.lat||null,endLng:item.lng||null}:d)});
      toast(`"${item.name}" הוגדר כנקודת יעד 🔴`,'s');
    }
    setDayActionSel(null);
  };

  const toggleCountry=country=>setExpanded(prev=>{
    const s=new Set(prev);
    s.has(country)?s.delete(country):s.add(country);
    return s;
  });

  const getDistPos=()=>{
    if(!navigator.geolocation){toast('GPS לא זמין','e');return;}
    navigator.geolocation.getCurrentPosition(
      p=>{setUserPos({lat:p.coords.latitude,lng:p.coords.longitude});setSortMode('distance');},
      ()=>toast('לא ניתן לגשת למיקום','e'),
      {timeout:8000}
    );
  };

  const handleSortClick=mode=>{
    if(mode==='distance'){
      if(sortMode==='distance'){setSortMode('default');return;}
      getDistPos();
    } else {
      setSortMode(s=>s===mode?'default':mode);
    }
  };

  /* filtered + sorted flat list */
  const matchesSrc=(item,f)=>!f||(item._listSource||'saved')===f;
  const displayItems=useMemo(()=>{
    let items=bank.filter(i=>matchesSrc(i,filterSrc));
    const q=search.trim().toLowerCase();
    if(q)items=items.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.address||'').toLowerCase().includes(q));
    if(sortMode==='name'){
      items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','he'));
    } else if(sortMode==='distance'&&userPos){
      items=items.map(i=>({...i,_dist:i.lat&&i.lng?haversineKm(userPos.lat,userPos.lng,i.lat,i.lng):Infinity}));
      items.sort((a,b)=>a._dist-b._dist);
    }
    return items;
  },[bank,search,sortMode,userPos,filterSrc]);

  /* grouped (used when not searching and not distance-sorting) */
  const grouped=useMemo(()=>{
    const m={};
    for(const i of bank){
      if(!matchesSrc(i,filterSrc))continue;
      const c=getCountry(i);if(!m[c])m[c]=[];m[c].push(i);
    }
    const entries=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'he'));
    if(sortMode==='name')entries.forEach(([,items])=>items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','he')));
    return entries;
  },[bank,sortMode,filterSrc]);

  const showFlat=!!(search.trim())||sortMode==='distance';

  const BankItem=({item})=>{
    const src=getBankSrc(item); // null if no known _listSource
    const types=item.types||(item.placeType?[item.placeType]:[]);
    const catEmoji=getTypeEmoji(types);
    const lbl=getTypeLabel(types);
    const hasLoc=!!(item.lat&&item.lng);
    return(
      <div className="bitem">
        {/* status circle — matches map marker */}
        <div style={{
          width:36,height:36,borderRadius:'50%',flexShrink:0,
          background:src?src.color:'#e53935',
          border:'2.5px solid #fff',
          boxShadow:'0 1px 4px rgba(0,0,0,.25)',
          display:'flex',alignItems:'center',justifyContent:'center',
          fontSize:src?17:14,
        }}>
          {src?src.emoji:'📍'}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:600}}>{item.name||'—'}</div>

            <button onClick={()=>setDayActionSel({item,mode:'start'})}
              style={{background:'rgba(34,197,94,.12)',color:'var(--green)',border:'1px solid rgba(34,197,94,.3)',
                borderRadius:7,padding:'5px 7px',fontSize:14,cursor:'pointer',lineHeight:1}}
              title="קבע כנקודת מוצא">🟢</button>
            <button onClick={()=>setDayActionSel({item,mode:'end'})}
              style={{background:'rgba(239,68,68,.1)',color:'var(--red)',border:'1px solid rgba(239,68,68,.25)',

              title="קבע כנקודת יעד">🔴</button>
            <button onClick={()=>setDayBankSel(item)}
              style={{background:'rgba(139,92,246,.13)',color:'#8b5cf6',border:'1px solid rgba(139,92,246,.3)',

              title="הוסף לבנק יומי">📌</button>
          </div>
        )}
        {hasLoc&&<button className="map-btn" onClick={()=>onShowOnMap&&onShowOnMap({lat:item.lat,lng:item.lng,placeId:item.placeId,name:item.name,address:item.address||''})}>🗺️</button>}
      </div>
    );
  };

  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh"><div className="stitle">⭐ בנק אטרקציות</div>{trip&&<div className="ssub">{bank.length} מקומות שמורים</div>}</div>

      {bank.length>0&&<>
        {/* search bar */}
        <div style={{padding:'9px 14px 7px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',flexShrink:0}}>

            <span style={{fontSize:15}}>🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="חיפוש אטרקציה..." style={{flex:1,background:'none',border:'none',outline:'none',color:'var(--text)',fontSize:14,fontFamily:'Heebo,sans-serif',direction:'rtl'}}/>
            {search&&<button onClick={()=>setSearch('')} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:15,padding:0}}>✕</button>}
          </div>
        </div>
        {/* sort bar */}
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <span style={{fontSize:11,color:'var(--text3)',flexShrink:0}}>מיון:</span>
          {[['default','📋 ברירת מחדל'],['name','א-ת שם'],['distance','📍 מרחק']].map(([mode,label])=>(
            <button key={mode} onClick={()=>handleSortClick(mode)}
              style={{padding:'5px 10px',borderRadius:8,border:`1px solid ${sortMode===mode?'var(--accent2)':'var(--border)'}`,
                background:sortMode===mode?'rgba(79,142,247,.15)':'var(--bg3)',

              {label}
            </button>

        </div>
        {sortMode==='distance'&&userPos&&<div style={{padding:'4px 14px',fontSize:10,color:'var(--text3)',background:'var(--bg3)',borderBottom:'1px solid var(--border)',flexShrink:0}}>

        </div>}

      {/* filter by listSource — only show types that exist in data */}
      {bank.length>0&&(()=>{
        const existing=new Set(bank.map(i=>i._listSource||'saved'));
        const chips=Object.entries(BANK_SRC).filter(([k])=>existing.has(k));

                fontSize:11,fontWeight:600,fontFamily:'Heebo,sans-serif',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>

            {chips.map(([k,v])=>(
              <button key={k} onClick={()=>setFilterSrc(f=>f===k?null:k)}
                style={{padding:'4px 10px',borderRadius:10,border:`1px solid ${filterSrc===k?v.color:'var(--border)'}`,
                  background:filterSrc===k?v.color+'22':'transparent',
                  color:filterSrc===k?v.color:'var(--text3)',
                  fontSize:11,fontWeight:600,fontFamily:'Heebo,sans-serif',cursor:'pointer',whiteSpace:'nowrap',flexShrink:0}}>
                {v.emoji} {v.label}
              </button>

      {!trip&&<div className="empty"><div className="eicon">⭐</div><div className="etitle">אין טיול פעיל</div></div>}
      {trip&&bank.length===0&&<div className="empty"><div className="eicon">⭐</div><div className="etitle">בנק האטרקציות ריק</div><div className="edesc">הוסף אטרקציות דרך אפליקציית המחשב או מהמפה</div></div>}
      {search&&displayItems.length===0&&<div className="empty"><div className="eicon">🔍</div><div className="etitle">אין תוצאות</div></div>}

      {/* flat list — search results or distance sort */}
      {showFlat&&displayItems.length>0&&(
        <div style={{flex:1,overflowY:'auto'}}>
          <div className="card" style={{margin:'12px 14px'}}>
            {displayItems.map(item=><BankItem key={item.id} item={item}/>)}
          </div>
          <div style={{height:16}}/>
        </div>
      )}

      {/* grouped by country — collapsible, default closed */}
      {!showFlat&&grouped.length>0&&(
        <div style={{flex:1,overflowY:'auto'}}>
          {grouped.map(([country,items])=>{
            const isOpen=expanded.has(country);
            return(
              <div key={country}>
                {/* country header — tap to expand/collapse */}
                <div onClick={()=>toggleCountry(country)}
                  style={{display:'flex',alignItems:'center',justifyContent:'space-between',
                    padding:'11px 16px',cursor:'pointer',userSelect:'none',
                    background:'var(--bg2)',borderBottom:'1px solid var(--border)',
                    borderTop:'1px solid var(--border)',marginTop:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:8}}>
                    <span style={{fontSize:13,fontWeight:700,color:'var(--text2)'}}>{country}</span>
                    <span style={{fontSize:11,color:'var(--text3)',background:'var(--surface)',
                      border:'1px solid var(--border)',borderRadius:10,padding:'1px 7px'}}>
                      {items.length}
                    </span>
                  </div>
                  <span style={{fontSize:14,color:'var(--text3)',transition:'transform .2s',
                    display:'inline-block',transform:isOpen?'rotate(180deg)':'rotate(0deg)'}}>
                    ›
                  </span>
                </div>
                {/* items — shown only when expanded */}
                {isOpen&&(
                  <div className="card" style={{margin:'0 14px 10px',borderRadius:'0 0 10px 10px'}}>
                    {items.map(item=><BankItem key={item.id} item={item}/>)}

            );

          <div style={{height:16}}/>
        </div>
      )}

      {/* day selector — מוצג כשלוחצים על 📌 */}
      {dayBankSel&&<DaySelector
        days={trip?.days||[]}
        title="📌 הוסף לבנק יומי של יום:"
        onSelect={addToDayBank}
        onClose={()=>setDayBankSel(null)}/>}
      {dayActionSel&&<DaySelector
        days={trip?.days||[]}
        title={dayActionSel.mode==='sched'?'📅 הוסף ללוז של יום:':dayActionSel.mode==='start'?'🟢 קבע כמוצא של יום:':'🔴 קבע כיעד של יום:'}
        onSelect={execDayAction}
        onClose={()=>setDayActionSel(null)}/>}
      {noteEditItem&&(
        <div style={{position:'fixed',inset:0,zIndex:200,display:'flex',alignItems:'flex-end'}}>
          <div onClick={()=>setNoteEditItem(null)} style={{position:'absolute',inset:0,background:'rgba(0,0,0,.5)'}}/>
          <div style={{position:'relative',width:'100%',background:'var(--bg2)',borderRadius:'16px 16px 0 0',
            padding:16,paddingBottom:'calc(16px + var(--safe-b))'}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:10}}>📝 הערה על "{noteEditItem.name}"</div>
            <textarea value={noteEditVal} onChange={e=>setNoteEditVal(e.target.value)} rows={3}
              autoFocus placeholder="הוסף הערה..."
              style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
                color:'var(--text)',fontSize:14,padding:'8px 10px',fontFamily:'Heebo,sans-serif',
                outline:'none',direction:'rtl',resize:'none',lineHeight:1.55}}/>
            <div style={{display:'flex',gap:8,marginTop:10}}>
              <button onClick={saveNoteEdit}
                style={{flex:1,background:'var(--green)',border:'none',borderRadius:9,color:'#fff',
                  fontSize:14,fontWeight:700,padding:10,cursor:'pointer',fontFamily:'Heebo,sans-serif'}}>שמור</button>
              <button onClick={()=>setNoteEditItem(null)}
                style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:9,
                  color:'var(--text)',fontSize:14,padding:'10px 16px',cursor:'pointer',fontFamily:'Heebo,sans-serif'}}>ביטול</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ════════════════════════════════
   LISTS SCREEN — shopping/packing/notes/docs
════════════════════════════════ */
function ListsScreen({trip,active,onUpdate}){
  const[sub,setSub]=useState('shopping');
  const tabs=[{id:'shopping',label:'🛒 קניות'},{id:'packing',label:'🎒 ציוד'},{id:'notes',label:'📝 הערות'},{id:'expenses',label:'💰 הוצאות'},{id:'docs',label:'📄 מסמכים'}];
  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh"><div className="stitle">📋 רשימות</div></div>
      <div className="sub-tabs">
        {tabs.map(t=><button key={t.id} className={`sub-tab${sub===t.id?' active':''}`} onClick={()=>setSub(t.id)}>{t.label}</button>)}
      </div>
      {!trip?<div className="empty"><div className="eicon">📋</div><div className="etitle">אין טיול פעיל</div></div>
        :sub==='shopping'?<ChecklistTab key="shop" emoji="🛒" items={trip.shoppingList||[]} emptyText="רשימת הקניות ריקה" addPlaceholder="הוסף פריט לקניות..." onUpdate={items=>onUpdate({...trip,shoppingList:items})}/>
        :sub==='packing'?<ChecklistTab key="pack" emoji="🎒" items={trip.packingList||[]} emptyText="רשימת הציוד ריקה" addPlaceholder="הוסף פריט לציוד..." onUpdate={items=>onUpdate({...trip,packingList:items})}/>
        :sub==='notes'?<NotesTab trip={trip} onUpdate={onUpdate}/>
        :sub==='expenses'?<ExpensesTab trip={trip} onUpdate={onUpdate}/>
        :<DocsTab trip={trip}/>}
    </div>
  );
}

/* ── Checklist tab ── */
function ChecklistTab({emoji,items,emptyText,addPlaceholder,onUpdate}){
  const[text,setText]=useState('');
  const done=items.filter(i=>i.done).length;
  const add=()=>{const t=text.trim();if(!t)return;onUpdate([...items,{id:uid(),text:t,done:false,category:'כללי'}]);setText('');};
  const tog=id=>onUpdate(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const del=id=>onUpdate(items.filter(i=>i.id!==id));
  const grouped=items.reduce((a,i)=>{const c=i.category||'כללי';if(!a[c])a[c]=[];a[c].push(i);return a;},{});
  return(
    <>
      {/* progress bar */}
      {items.length>0&&<div className="prog-bar"><div className="prog-fill" style={{width:`${items.length?(done/items.length)*100:0}%`}}/></div>}
      {/* add row */}
      <div className="add-row">
        <input className="add-inp" value={text} onChange={e=>setText(e.target.value)} placeholder={addPlaceholder} onKeyDown={e=>e.key==='Enter'&&add()}/>
        <button className="add-btn" onClick={add}>+</button>
      </div>
      {/* stats */}
      {items.length>0&&<div style={{padding:'8px 16px',fontSize:12,color:'var(--text3)',display:'flex',gap:10,borderBottom:'1px solid var(--border)',flexShrink:0}}>
        <span>{emoji} {items.length} פריטים</span>
        <span style={{color:'var(--green)'}}>✓ {done} הושלמו</span>
        {done>0&&<button onClick={()=>onUpdate(items.filter(i=>!i.done))} style={{background:'none',border:'none',color:'var(--red)',fontSize:12,cursor:'pointer',padding:0,marginRight:'auto'}}>נקה הושלמו</button>}
      </div>}
      {/* list */}
      <div style={{flex:1,overflowY:'auto'}}>
        {items.length===0&&<div className="empty"><div className="eicon">{emoji}</div><div className="etitle">{emptyText}</div><div className="edesc">הקלד פריט בשדה למעלה והוסף</div></div>}
        {Object.entries(grouped).map(([cat,citems])=>(
          <div key={cat}>
            {Object.keys(grouped).length>1&&<div className="slabel">{cat}</div>}
            <div className="card" style={{margin:'0 14px 10px'}}>
              {citems.map(item=>(
                <div key={item.id} className="ci">
                  <button className={`cbox${item.done?' chk':''}`} onClick={()=>tog(item.id)}>{item.done?'✓':''}</button>
                  <div style={{flex:1,minWidth:0}}>
                    <div className={`ci-text${item.done?' done':''}`}>{item.text}</div>
                  </div>
                  <button className="ci-del" onClick={()=>del(item.id)}>✕</button>
                </div>
              ))}
            </div>
          </div>
        ))}
        <div style={{height:16}}/>
      </div>
    </>
  );
}

/* ── Notes tab ── */
function NotesTab({trip,onUpdate}){
  const[newNote,setNewNote]=useState('');
  const[newLinkUrl,setNewLinkUrl]=useState('');
  const[newLinkName,setNewLinkName]=useState('');
  const addNote=()=>{const t=newNote.trim();if(!t)return;onUpdate({...trip,quickNotes:[...(trip.quickNotes||[]),{id:uid(),text:t,createdAt:new Date().toISOString()}]});setNewNote('');};
  const delNote=id=>onUpdate({...trip,quickNotes:(trip.quickNotes||[]).filter(n=>n.id!==id)});
  const links=trip.links||[];
  const addLink=()=>{
    const url=newLinkUrl.trim();if(!url)return;
    const name=newLinkName.trim();
    onUpdate({...trip,links:[...links,{id:uid(),url,name}]});
    setNewLinkUrl('');setNewLinkName('');
  };
  const delLink=id=>onUpdate({...trip,links:links.filter(l=>l.id!==id)});
  const qnotes=trip.quickNotes||[];
  return(
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {/* general notes */}
      <div className="slabel">📝 הערות כלליות</div>
      <div style={{padding:'0 14px 14px'}}>
        <textarea className="note-ta" rows={5}
          value={trip.generalNotes||''}
          onChange={e=>onUpdate({...trip,generalNotes:e.target.value})}
          placeholder="קשר לאתר קמפינג, טלפונים, קודים, הערות מיוחדות..."/>
      </div>
      {/* quick notes */}
      <div className="add-row">
        <input className="add-inp" value={newNote} onChange={e=>setNewNote(e.target.value)} placeholder="הוסף פתקית מהירה..." onKeyDown={e=>e.key==='Enter'&&addNote()}/>
        <button className="add-btn" onClick={addNote}>+</button>
      </div>
      <div className="slabel">📌 פתקיות מהירות ({qnotes.length})</div>
      {qnotes.length===0&&<div style={{padding:'0 0 8px',textAlign:'center',color:'var(--text3)',fontSize:13}}>אין פתקיות עדיין</div>}
      {qnotes.length>0&&<div className="card" style={{margin:'0 14px'}}>
        {[...qnotes].reverse().map(n=>(
          <div key={n.id} className="qnote">
            <div style={{flex:1}}>
              <div className="qnote-text">{n.text}</div>
              <div className="qnote-date">{new Date(n.createdAt).toLocaleDateString('he-IL')}</div>
            </div>
            <button className="ci-del" onClick={()=>delNote(n.id)}>✕</button>
          </div>
        ))}
      </div>}
      {/* links */}
      <div className="slabel">🔗 קישורים לאתרים ({links.length})</div>
      <div style={{padding:'0 14px 10px',display:'flex',flexDirection:'column',gap:7}}>
        <input className="add-inp" value={newLinkUrl} onChange={e=>setNewLinkUrl(e.target.value)}
          placeholder="הדבק קישור (URL)..."
          onKeyDown={e=>e.key==='Enter'&&newLinkUrl.trim()&&addLink()}
          style={{width:'100%',direction:'ltr',textAlign:'right'}}/>
        <div style={{display:'flex',gap:7}}>
          <input className="add-inp" value={newLinkName} onChange={e=>setNewLinkName(e.target.value)}
            placeholder="שם לקישור (אופציונלי)..."
            onKeyDown={e=>e.key==='Enter'&&newLinkUrl.trim()&&addLink()}
            style={{flex:1}}/>
          <button className="add-btn" onClick={addLink} disabled={!newLinkUrl.trim()}
            style={{opacity:newLinkUrl.trim()?1:0.4,flexShrink:0}}>+</button>
        </div>
      </div>
      {links.length===0&&<div style={{padding:'0 0 12px',textAlign:'center',color:'var(--text3)',fontSize:13}}>אין קישורים עדיין</div>}
      {links.length>0&&<div className="card" style={{margin:'0 14px'}}>
        {links.map(l=>(
          <div key={l.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid var(--border)'}}>
            <span style={{fontSize:18,flexShrink:0}}>🔗</span>
            <div style={{flex:1,minWidth:0}}>
              <a href={l.url} target="_blank" rel="noreferrer"
                style={{fontSize:13,color:'var(--accent2)',wordBreak:'break-all',display:'block',lineHeight:1.4,textDecoration:'none',fontWeight:600}}>
                {l.name||l.url}
              </a>
              {l.name&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2,wordBreak:'break-all',direction:'ltr',textAlign:'right'}}>{l.url}</div>}
            </div>
            <button className="ci-del" style={{flexShrink:0}} onClick={()=>delLink(l.id)}>✕</button>
          </div>
        ))}
      </div>}
      <div style={{height:16}}/>
    </div>
  );
}

/* ── Expenses tab ── */
function ExpensesTab({trip,onUpdate}){
  const[form,setForm]=useState({category:'מזון',amount:'',description:'',date:new Date().toISOString().slice(0,10)});
  const expenses=trip?.expenses||[];
  const total=expenses.reduce((s,e)=>s+(parseFloat(e.amount)||0),0);
  const byCat=EXPENSE_CATS.reduce((a,c)=>{a[c]=expenses.filter(e=>e.category===c).reduce((s,e)=>s+(parseFloat(e.amount)||0),0);return a;},{});

  const add=()=>{
    const amt=parseFloat(form.amount);
    if(!amt||isNaN(amt)){toast('הזן סכום תקני','e');return;}
    onUpdate({...trip,expenses:[...expenses,{id:uid(),...form,amount:amt}]});
    setForm(f=>({...f,amount:'',description:''}));
    toast('הוצאה נוספה ✓','s');
  };
  const del=id=>onUpdate({...trip,expenses:expenses.filter(e=>e.id!==id)});

  return(
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {/* total + bar */}
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:total>0?8:0}}>
          <span style={{fontSize:22,fontWeight:800,color:'var(--accent2)'}}>₪{total.toLocaleString()}</span>
          <span style={{fontSize:12,color:'var(--text3)'}}>סה"כ · {expenses.length} הוצאות</span>
        </div>
        {total>0&&<>
          <div style={{display:'flex',borderRadius:4,overflow:'hidden',height:7,marginBottom:7}}>
            {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
              <div key={c} style={{flex:byCat[c]/total,background:CAT_COLORS[c]}} title={`${c}: ₪${byCat[c].toFixed(0)}`}/>
            ))}
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px'}}>
            {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
              <span key={c} style={{fontSize:11,color:CAT_COLORS[c]}}>● {c}: ₪{byCat[c].toFixed(0)}</span>
            ))}
          </div>
        </>}
      </div>

      {/* add form */}
      <div style={{padding:'10px 14px 12px',borderBottom:'1px solid var(--border)',background:'var(--bg3)',flexShrink:0,display:'flex',flexDirection:'column',gap:8}}>
        <div style={{display:'flex',gap:8}}>
          <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}
            style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none'}}>
            {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}
          </select>
          <input value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} type="number" min="0"
            placeholder="סכום ₪" onKeyDown={e=>e.key==='Enter'&&add()}
            style={{width:90,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:14,outline:'none',textAlign:'center'}}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="תיאור (אופציונלי)"
            onKeyDown={e=>e.key==='Enter'&&add()}
            style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none',direction:'rtl'}}/>
          <button onClick={add} style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,padding:'0 18px',fontFamily:'Heebo,sans-serif',fontSize:16,fontWeight:700,cursor:'pointer'}}>+</button>
        </div>
      </div>

      {/* list */}
      {expenses.length===0&&<div className="empty"><div className="eicon">💰</div><div className="etitle">אין הוצאות עדיין</div><div className="edesc">הוסף הוצאות בטופס למעלה</div></div>}
      <div className="card" style={{margin:'12px 14px'}}>
        {[...expenses].reverse().map(ex=>(
          <div key={ex.id} className="exp-row">
            <div className="exp-dot" style={{background:CAT_COLORS[ex.category]||'#888'}}/>
            <span className="exp-cat" style={{background:(CAT_COLORS[ex.category]||'#888')+'22',color:CAT_COLORS[ex.category]||'#888'}}>{ex.category}</span>
            <div className="exp-desc">{ex.description||ex.category}<span style={{color:'var(--text3)',fontSize:10,marginRight:5}}>{ex.date}</span></div>
            <span className="exp-amt">₪{parseFloat(ex.amount).toFixed(0)}</span>
            <button className="exp-del" onClick={()=>del(ex.id)}>✕</button>
          </div>
        ))}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ── Docs tab ── */
function DocsTab({trip}){
  const docs=trip?.documents||[];
  if(docs.length===0)return(
    <div className="empty"><div className="eicon">📁</div><div className="etitle">אין מסמכים</div><div className="edesc">הוסף דרכונים, ביטוח, כרטיסים ועוד<br/>דרך אפליקציית המחשב</div></div>
  );
  return(
    <div style={{flex:1,overflowY:'auto'}}>
      <div className="doc-grid">
        {docs.map(doc=>(
          <div key={doc.id} className="doc-card">
            <div className="doc-icon">{docIcon(doc.type)}</div>
            <div className="doc-name">{doc.name}</div>
            <div className="doc-meta">{fmtSize(doc.size||0)}</div>
            {doc.url&&(
              doc.type?.startsWith('image/')?
                <img src={doc.url} alt={doc.name} style={{width:'100%',height:60,objectFit:'cover',borderRadius:6,marginTop:4}}/>
                :<a href={doc.url} target="_blank" rel="noreferrer" download={doc.name} style={{fontSize:11,color:'var(--accent2)',textDecoration:'none',marginTop:4,display:'block'}}>
                  {doc.type?.startsWith('image/')?'פתח 🖼️':'הורד ↓'}
                </a>
            )}
          </div>
        ))}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ════════════════════════════════
   TRIP SCREEN
════════════════════════════════ */
function TripScreen({trips,activeId,onSelectTrip,syncStatus,onRefresh,active,settings,onSettingsChange}){
  const trip=trips.find(t=>t.id===activeId)||trips[0]||null;
  const totalExp=trip?.expenses?.reduce((s,e)=>s+(parseFloat(e.amount)||0),0)||0;
  const sl={idle:'⚪ לא מחובר',syncing:'🔄 מסנכרן...',synced:'✅ מסונכרן',error:'❌ שגיאה'};
  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div className="stitle">✈️ הטיול שלי</div>
          <span className={`sync-b ${syncStatus}`}>{sl[syncStatus]||''}</span>
        </div>
      </div>
      {trips.length>1&&<div style={{display:'flex',gap:8,padding:'10px 14px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',overflowX:'auto',flexShrink:0}}>
        {trips.map(t=><div key={t.id} className={`trip-chip${t.id===activeId?' active':''}`} onClick={()=>onSelectTrip(t.id)}>{t.name}</div>)}
      </div>}
      {trip?<>
        <div className="slabel">פרטי הטיול</div>
        <div className="card" style={{margin:'0 14px'}}>
          <div className="crow"><div className="cicon">✈️</div><div className="cmain"><div className="ctitle">{trip.name}</div><div className="csub">שם הטיול</div></div></div>
          {trip.vehiclePlate&&<div className="crow"><div className="cicon">🚗</div><div className="cmain"><div className="ctitle">{trip.vehiclePlate}</div><div className="csub">רכב</div></div></div>}
        </div>
        <div className="slabel">סטטיסטיקות</div>
        <div style={{display:'flex',gap:8,padding:'0 14px 14px',flexWrap:'wrap'}}>
          <div className="spill"><span>📅</span>{trip.days?.length||0} ימים</div>
          <div className="spill"><span>⭐</span>{trip.interestBank?.length||0} אטרקציות</div>
          <div className="spill"><span>💰</span>₪{totalExp.toLocaleString()}</div>
          <div className="spill"><span>🛒</span>{(trip.shoppingList||[]).filter(i=>!i.done).length} לקנות</div>
          <div className="spill"><span>🎒</span>{(trip.packingList||[]).filter(i=>!i.done).length} לארוז</div>
          <div className="spill"><span>📄</span>{trip.documents?.length||0} מסמכים</div>
        </div>
        <div className="slabel">פעולות</div>
        <div className="card" style={{margin:'0 14px'}}>
          <div className="crow" style={{cursor:'pointer'}} onClick={onRefresh}>
            <div className="cicon">🔄</div><div className="cmain"><div className="ctitle">רענן נתונים מהענן</div><div className="csub">טעינה מחדש מ-Firebase</div></div>
          </div>
          <div className="crow" style={{cursor:'pointer'}} onClick={()=>{if(window.confirm('לפתוח אפליקציית מחשב?'))window.open('index.html','_blank');}}>
            <div className="cicon">💻</div><div className="cmain"><div className="ctitle">פתח אפליקציית מחשב</div><div className="csub">עריכה מלאה</div></div>
          </div>
        </div>
        <div className="slabel">⚙️ הגדרות</div>
        <div className="card" style={{margin:'0 14px'}}>
          {/* ── travel buffer factor ── */}
          <div className="crow" style={{alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
            <div className="cicon" style={{marginTop:3}}>🚗</div>
            <div className="cmain">
              <div className="ctitle">פקטור זמן נסיעה</div>
              <div className="csub" style={{lineHeight:1.55,marginTop:3}}>
                כפיל לזמן הנסיעה המחושב אוטומטית בלוז היומי.
                כולל זמן התארגנות — לדוגמה <b style={{color:'var(--text2)'}}>×1.2</b> אומר שנסיעה של 30 דק' תוצג כ-36 דק' (30 + 6 דק' התארגנות).
              </div>
            </div>
            <select value={settings?.travelBuffer??1.2}
              onChange={e=>onSettingsChange({...settings,travelBuffer:parseFloat(e.target.value)})}
              style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
                padding:'7px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',
                fontSize:13,outline:'none',flexShrink:0,marginTop:2,direction:'ltr'}}>
              <option value={1.0}>×1.0 — ללא תוספת</option>
              <option value={1.1}>×1.1 — +10%</option>
              <option value={1.2}>×1.2 — +20% (מומלץ)</option>
              <option value={1.3}>×1.3 — +30%</option>
              <option value={1.5}>×1.5 — +50%</option>
              <option value={2.0}>×2.0 — כפול</option>
            </select>
          </div>
        </div>
      </>:<div className="empty"><div className="eicon">✈️</div><div className="etitle">לא נמצאו טיולים</div><div className="edesc">צור טיול דרך אפליקציית המחשב</div></div>}
      <div style={{margin:'14px 14px 0',padding:'12px 14px',background:'var(--bg3)',borderRadius:10,display:'flex',flexDirection:'column',alignItems:'center',gap:7}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600}}>PlanMyTrip</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
          <span className="ver-badge"><span className="v-mob">📱 Mobile</span><span className="v-mob">{MOB_VER}</span></span>
        </div>
        <div style={{fontSize:10,color:'var(--text3)',opacity:.6}}>© {new Date().getFullYear()} PlanMyTrip</div>
      </div>
      <div style={{height:'calc(var(--nav-h) + var(--safe-b) + 12px)'}}/>
    </div>
  );
}

/* ════════════════════════════════
   BOTTOM NAV
════════════════════════════════ */
const NAV=[{id:'map',icon:'🗺️',label:'מפה'},{id:'schedule',icon:'📅',label:'לוז'},{id:'bank',icon:'⭐',label:'בנק'},{id:'lists',icon:'📋',label:'רשימות'},{id:'trip',icon:'✈️',label:'טיול'}];
function BottomNav({active,onChange}){
  return<nav className="bnav">{NAV.map(n=><button key={n.id} className={`nbtn${active===n.id?' active':''}`} onClick={()=>onChange(n.id)}><span className="nicon">{n.icon}</span><span className="nlabel">{n.label}</span></button>)}</nav>;
}

/* ════════════════════════════════
   URL ?key= PARAM — auto-connect on first visit
════════════════════════════════ */
(()=>{
  try{
    const urlKey=new URLSearchParams(window.location.search).get('key');
    if(urlKey){
      const cur=loadState()||{};
      saveState({...cur,settings:{...(cur.settings||{}),syncKey:urlKey,firebaseUrl:FB_URL}});
      window.history.replaceState({},'',window.location.pathname);
      location.reload();
    }
  }catch{}
})();

/* ════════════════════════════════
   APP
════════════════════════════════ */
function App(){
  const saved=useMemo(()=>loadState(),[]);
  const[settings,setSettings]=useState(()=>{
    const def={firebaseUrl:FB_URL,syncKey:'',googleMapsKey:GMAPS_KEY,travelBuffer:1.2};
    return{...def,...(saved?.settings||{}),firebaseUrl:FB_URL};
  });
  const[trips,setTrips]=useState(()=>{
    const raw=saved?.trips;
    if(raw?.length>0){const n=raw.map(normTrip).filter(Boolean);if(n.length>0)return n;}
    return[];
  });
  const[activeId,setActiveId]=useState(saved?.activeId||(saved?.trips?.[0]?.id??null));
  const[screen,setScreen]=useState('map');
  const[syncStatus,setSyncStatus]=useState('idle');
  const[mapsReady,setMapsReady]=useState(!!window.google?.maps);
  const skipPush=useRef(false);
  const autoSaveTimer=useRef(null);
  const syncMounted=useRef(false);
  const tripsRef=useRef(trips);
  tripsRef.current=trips;
  const mapFocusRef=useRef(null);
  const mapPickCallbackRef=useRef(null);

  /* navigate to map and focus on a place */
  const showOnMap=useCallback(item=>{
    mapFocusRef.current=item;
    setScreen('map');
  },[]);

  /* pick location from map for start/end day location */
  const[mapPickLabel,setMapPickLabel]=useState(null);
  const pickLocationFromMap=useCallback((label,callback)=>{
    mapPickCallbackRef.current=place=>{
      callback(place);
      setMapPickLabel(null);
      setScreen('schedule');
    };
    setMapPickLabel(label);
    setScreen('map');
  },[]);
  const cancelMapPick=useCallback(()=>{
    mapPickCallbackRef.current=null;
    setMapPickLabel(null);
    setScreen('schedule');
  },[]);

  const trip=useMemo(()=>trips.find(t=>t.id===activeId)||trips[0]||null,[trips,activeId]);

  /* load Google Maps */
  useEffect(()=>{
    if(window.google?.maps){setMapsReady(true);return;}
    window.__gmMobileInit=()=>setMapsReady(true);
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${settings.googleMapsKey}&libraries=places&callback=__gmMobileInit&language=he`;
    s.async=true;s.defer=true;
    document.head.appendChild(s);
  },[]);// eslint-disable-line

  /* load from Firebase */
  const loadFromFirebase=useCallback(async()=>{
    const{firebaseUrl:fbUrl,syncKey}=settings;
    if(!fbUrl||!syncKey)return;
    setSyncStatus('syncing');
    try{
      const data=await fbRead(fbUrl,syncKey);
      if(data?.trips?.length>0){
        const loaded=data.trips.map(normTrip).filter(Boolean);
        if(loaded.length>0){skipPush.current=true;setTrips(loaded);if(data.activeId)setActiveId(data.activeId);toast('הטיול נטען מ-Firebase ✓','s');}
      }
      setSyncStatus('synced');
    }catch{setSyncStatus('error');toast('שגיאה בטעינה מ-Firebase','e');}
  },[settings]);

  useEffect(()=>{loadFromFirebase();},[]);// eslint-disable-line

  /* persist to localStorage (including settings changes) */
  useEffect(()=>{
    saveState({settings,trips,activeId});
  },[trips,activeId,settings]);// eslint-disable-line

  /* debounced auto-save to Firebase */
  const debounceSave=useCallback((newTrips,newActiveId)=>{
    const{firebaseUrl:fbUrl,syncKey}=settings;
    if(!fbUrl||!syncKey)return;
    clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current=setTimeout(async()=>{
      setSyncStatus('syncing');
      try{await fbWrite(fbUrl,syncKey,{trips:newTrips,activeId:newActiveId,savedAt:new Date().toISOString()});setSyncStatus('synced');}
      catch{setSyncStatus('error');}
    },1800);
  },[settings]);

  /* updateTrip — updates the active trip and triggers save */
  const updateTrip=useCallback(updatedTrip=>{
    setTrips(prev=>{
      const next=prev.map(t=>t.id===updatedTrip.id?updatedTrip:t);
      debounceSave(next,activeId);
      return next;
    });
  },[activeId,debounceSave]);

  return(
    <>
      <ToastLayer/>
      <div className="sw">
        <MapScreen trip={trip} active={screen==='map'} mapsReady={mapsReady} onUpdate={updateTrip} mapFocusRef={mapFocusRef} mapPickCallbackRef={mapPickCallbackRef} mapPickLabel={mapPickLabel} onCancelMapPick={cancelMapPick}/>
        <ScheduleScreen trip={trip} active={screen==='schedule'} onShowOnMap={showOnMap} onUpdate={updateTrip} settings={settings} onPickFromMap={pickLocationFromMap}/>
        <BankScreen trip={trip} active={screen==='bank'} onShowOnMap={showOnMap} onUpdate={updateTrip}/>
        <ListsScreen trip={trip} active={screen==='lists'} onUpdate={updateTrip}/>
        <TripScreen trips={trips} activeId={activeId} onSelectTrip={setActiveId} syncStatus={syncStatus} onRefresh={loadFromFirebase} active={screen==='trip'} settings={settings} onSettingsChange={setSettings}/>
      </div>
      <BottomNav active={screen} onChange={setScreen}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
