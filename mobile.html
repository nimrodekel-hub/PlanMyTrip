  <title>PlanMyTrip</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f1117; --bg2:#1a1d27; --bg3:#232736;
      --surface:#2a2e3f; --surface2:#333849; --border:#3d4358;
      --text:#e8eaf0; --text2:#9aa0b8; --text3:#6b7295;
      --accent:#1a73e8; --accent2:#4f8ef7;
      --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --purple:#a855f7;
      --nav-h:58px;
      --safe-b:env(safe-area-inset-bottom,0px);
      --safe-t:env(safe-area-inset-top,0px);
    }
    html,body { height:100%; width:100%; font-family:'Heebo',sans-serif; background:var(--bg); color:var(--text); overflow:hidden; direction:rtl; -webkit-tap-highlight-color:transparent; }
    #root { height:100%; display:flex; flex-direction:column; }

    /* ── Bottom nav ── */
    .bnav { position:fixed; bottom:0; left:0; right:0; height:calc(var(--nav-h) + var(--safe-b)); background:var(--bg2); border-top:1px solid var(--border); display:flex; align-items:stretch; padding-bottom:var(--safe-b); z-index:900; }
    .nbtn { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; border:none; background:none; color:var(--text3); font-family:'Heebo',sans-serif; cursor:pointer; padding:5px 0; position:relative; }
    .nbtn.active { color:var(--accent2); }
    .nbtn.active::after { content:''; position:absolute; top:0; left:15%; right:15%; height:2px; background:var(--accent2); border-radius:0 0 3px 3px; }
    .nicon { font-size:20px; line-height:1; }
    .nlabel { font-size:10px; font-weight:600; }

    /* ── Screens ── */
    .sw { flex:1; overflow:hidden; position:relative; padding-top:var(--safe-t); padding-bottom:calc(var(--nav-h) + var(--safe-b)); }
    .screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; transition:opacity .18s ease,transform .18s ease; }
    .screen.h { opacity:0; pointer-events:none; transform:translateY(5px); }
    .map-screen { overflow:hidden !important; }

    /* ── Screen header ── */
    .sh { background:var(--bg2); border-bottom:1px solid var(--border); padding:13px 16px 11px; flex-shrink:0; position:sticky; top:0; z-index:10; }
    .stitle { font-size:17px; font-weight:700; }
    .ssub { font-size:12px; color:var(--text3); margin-top:2px; }

    /* ── Sub-tabs ── */
    .sub-tabs { display:flex; background:var(--bg2); border-bottom:1px solid var(--border); overflow-x:auto; flex-shrink:0; padding:0 8px; gap:2px; }
    .sub-tab { flex-shrink:0; padding:10px 14px; border:none; background:none; color:var(--text3); font-family:'Heebo',sans-serif; font-size:13px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
    .sub-tab.active { color:var(--accent2); border-bottom-color:var(--accent2); }

    /* ── Cards ── */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .crow { display:flex; align-items:center; gap:11px; padding:13px 15px; border-bottom:1px solid var(--border); }
    .crow:last-child { border-bottom:none; }
    .cicon { font-size:21px; width:34px; text-align:center; flex-shrink:0; }
    .cmain { flex:1; min-width:0; }
    .ctitle { font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .csub { font-size:11px; color:var(--text3); margin-top:2px; }
    .cend { font-size:12px; color:var(--text3); flex-shrink:0; }

    /* ── Section label ── */
    .slabel { font-size:11px; font-weight:700; color:var(--text3); text-transform:uppercase; letter-spacing:.05em; padding:14px 16px 5px; }

    /* ── Stat pills ── */
    .spill { display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:5px 13px; font-size:12px; font-weight:600; color:var(--text2); }
    .spill span { font-size:14px; }

    /* ── Empty state ── */
    .empty { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; padding:40px 20px; text-align:center; color:var(--text3); }
    .eicon { font-size:46px; opacity:.45; }
    .etitle { font-size:16px; font-weight:600; color:var(--text2); }
    .edesc { font-size:13px; line-height:1.65; }

    /* ── Toast ── */
    .toast-w { position:fixed; top:calc(var(--safe-t) + 12px); left:14px; right:14px; z-index:9999; display:flex; flex-direction:column; gap:7px; pointer-events:none; }
    .toast { background:var(--surface2); border:1px solid var(--border); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:500; box-shadow:0 4px 20px rgba(0,0,0,.5); animation:tIn .22s ease; display:flex; align-items:center; gap:7px; }
    .toast.s { border-color:var(--green); color:var(--green); }
    .toast.e { border-color:var(--red); color:var(--red); }
    .toast.i { border-color:var(--accent2); color:var(--accent2); }
    @keyframes tIn { from{opacity:0;transform:translateY(-7px)} to{opacity:1;transform:none} }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* ── Map screen ── */
    .map-container { position:absolute; inset:0; }
    .map-searchbar { position:absolute; top:12px; left:12px; right:12px; z-index:10; display:flex; gap:8px; }
    .map-si { flex:1; background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:10px 13px; color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; outline:none; direction:rtl; box-shadow:0 2px 10px rgba(0,0,0,.4); }
    .map-si::placeholder { color:var(--text3); }
    .map-fab { position:absolute; left:14px; z-index:10; width:44px; height:44px; border-radius:50%; border:none; background:var(--bg2); color:var(--text); font-size:20px; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; border:1px solid var(--border); }
    .map-fab.loc-fab { bottom:calc(14px); }
    .map-loading { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; background:var(--bg3); z-index:5; }
    .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent2); border-radius:50%; animation:spin .8s linear infinite; }

    /* ── Bottom sheet ── */
    .sheet-ov { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:800; }
    .bsheet { position:fixed; bottom:calc(var(--nav-h) + var(--safe-b)); left:0; right:0; background:var(--bg2); border-radius:18px 18px 0 0; border-top:1px solid var(--border); transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1); z-index:801; max-height:72vh; overflow-y:auto; }
    .bsheet.open { transform:translateY(0); }
    .bsheet-handle { width:36px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 6px; }
    .bsheet-name { font-size:17px; font-weight:700; padding:6px 16px 2px; }
    .bsheet-type { font-size:12px; color:var(--text3); padding:0 16px 8px; }
    .bsheet-addr { font-size:13px; color:var(--text2); padding:0 16px 12px; line-height:1.5; }
    .bsheet-actions { display:flex; gap:9px; padding:0 16px 16px; flex-wrap:wrap; }
    .bsheet-btn { flex:1; min-width:120px; padding:11px 10px; border:none; border-radius:10px; font-family:'Heebo',sans-serif; font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; }
    .bsheet-btn.web { background:var(--accent); color:#fff; }
    .bsheet-btn.bank { background:rgba(245,158,11,.15); color:var(--amber); border:1px solid rgba(245,158,11,.3); }
    .bsheet-btn.sched { background:rgba(34,197,94,.15); color:var(--green); border:1px solid rgba(34,197,94,.3); }

    /* ── Day selector overlay ── */
    .day-ov { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000; display:flex; align-items:flex-end; }
    .day-panel { background:var(--bg2); border-radius:18px 18px 0 0; border-top:1px solid var(--border); width:100%; padding-bottom:var(--safe-b); max-height:60vh; overflow-y:auto; }
    .day-panel-title { font-size:15px; font-weight:700; padding:14px 16px 10px; border-bottom:1px solid var(--border); }
    .day-opt { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); cursor:pointer; }
    .day-opt:active { background:var(--surface); }
    .day-opt:last-child { border-bottom:none; }

    /* ── Checklist ── */
    .add-row { display:flex; gap:8px; padding:10px 14px; border-bottom:1px solid var(--border); background:var(--bg2); flex-shrink:0; }
    .add-inp { flex:1; background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:9px 12px; color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; outline:none; direction:rtl; }
    .add-inp::placeholder { color:var(--text3); }
    .add-btn { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0 16px; font-family:'Heebo',sans-serif; font-size:18px; cursor:pointer; font-weight:700; }
    .ci { display:flex; align-items:center; gap:11px; padding:13px 16px; border-bottom:1px solid var(--border); }
    .ci:last-child { border-bottom:none; }
    .cbox { width:26px; height:26px; border-radius:6px; border:2px solid var(--border); background:none; flex-shrink:0; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:14px; color:#fff; transition:all .12s; }
    .cbox.chk { background:var(--green); border-color:var(--green); }
    .ci-text { flex:1; font-size:14px; line-height:1.4; word-break:break-word; }
    .ci-text.done { text-decoration:line-through; color:var(--text3); }
    .ci-del { background:none; border:none; color:var(--text3); cursor:pointer; font-size:16px; padding:4px 6px; opacity:.5; }
    .ci-del:active { opacity:1; color:var(--red); }
    .ci-cat { font-size:10px; color:var(--text3); margin-top:2px; }
    .prog-bar { height:3px; background:var(--bg3); flex-shrink:0; }
    .prog-fill { height:100%; background:var(--green); transition:width .3s; }

    /* ── Notes ── */
    .note-ta { width:100%; background:var(--bg3); border:1px solid var(--border); border-radius:10px; padding:12px; color:var(--text); font-family:'Heebo',sans-serif; font-size:14px; line-height:1.7; resize:none; outline:none; direction:rtl; }
    .qnote { display:flex; align-items:flex-start; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
    .qnote:last-child { border-bottom:none; }
    .qnote-text { flex:1; font-size:13px; line-height:1.55; }
    .qnote-date { font-size:10px; color:var(--text3); margin-top:3px; }

    /* ── Docs ── */
    .doc-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:14px 16px; }
    .doc-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px; display:flex; flex-direction:column; gap:6px; min-width:0; }
    .doc-icon { font-size:30px; }
    .doc-name { font-size:12px; color:var(--text2); word-break:break-word; line-height:1.35; }
    .doc-meta { font-size:10px; color:var(--text3); }

    /* ── Bank items ── */
    .bitem { display:flex; align-items:center; gap:11px; padding:12px 15px; border-bottom:1px solid var(--border); }
    .bitem:last-child { border-bottom:none; }

    /* ── Schedule ── */
    .blk { display:flex; align-items:center; gap:11px; padding:11px 15px; border-bottom:1px solid var(--border); }
    .blk:last-child { border-bottom:none; }
    .bdot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
    .btime { font-size:11px; color:var(--text3); width:38px; flex-shrink:0; }
    .bname { font-size:13px; font-weight:500; flex:1; min-width:0; }
    .bdur { font-size:11px; color:var(--text3); }

    /* ── Trip screen ── */
    .sync-b { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:10px; }
    .sync-b.synced { color:var(--green); background:rgba(34,197,94,.1); }
    .sync-b.syncing { color:var(--amber); background:rgba(245,158,11,.1); }
    .sync-b.error { color:var(--red); background:rgba(239,68,68,.1); }
    .sync-b.idle { color:var(--text3); background:var(--surface); }
    .trip-chip { flex-shrink:0; padding:5px 13px; border-radius:16px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--surface); color:var(--text2); cursor:pointer; white-space:nowrap; }
    .trip-chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }

    ::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-track { background:transparent; } ::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

    /* ── Day navigation (schedule) ── */
    .day-nav { display:flex; align-items:center; justify-content:space-between; padding:12px 16px 8px; flex-shrink:0; gap:8px; }
    .day-nav-btn { background:var(--surface); border:1px solid var(--border); border-radius:10px; color:var(--text2); font-size:18px; width:40px; height:40px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .day-nav-btn:disabled { opacity:.3; cursor:default; }
    .day-nav-center { flex:1; text-align:center; }
    .day-nav-title { font-size:15px; font-weight:700; }
    .day-nav-sub { font-size:11px; color:var(--text3); margin-top:2px; }
    .day-dots { display:flex; justify-content:center; gap:6px; padding:0 16px 10px; flex-shrink:0; }
    .day-dot { width:7px; height:7px; border-radius:50%; background:var(--border); transition:all .2s; cursor:pointer; }
    .day-dot.active { background:var(--accent2); width:18px; border-radius:4px; }
    .blk-row { display:flex; gap:0; padding:0 14px; border-bottom:1px solid var(--border); cursor:pointer; position:relative; }
    .blk-row:last-child { border-bottom:none; }
    .blk-row:active { background:var(--surface2); }
    .blk-left { display:flex; flex-direction:column; align-items:center; width:40px; flex-shrink:0; padding:14px 0; }
    .blk-circle { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; border:2px solid var(--bg2); flex-shrink:0; }
    .blk-line { flex:1; width:2px; background:var(--border); min-height:8px; }
    .blk-content { flex:1; min-width:0; padding:14px 0 14px 10px; }
    .blk-title { font-size:14px; font-weight:600; }
    .blk-meta { font-size:11px; color:var(--text3); margin-top:3px; }
    .blk-map-btn { align-self:center; flex-shrink:0; padding:6px 10px; border:1px solid var(--border); border-radius:8px; background:none; color:var(--accent2); font-size:12px; cursor:pointer; white-space:nowrap; }

    /* ── Map button on bank items ── */
    .map-btn { padding:7px 11px; border:1px solid var(--border); border-radius:8px; background:none; color:var(--accent2); font-size:12px; cursor:pointer; flex-shrink:0; }

    /* ── Version badge ── */
    .ver-badge { display:inline-flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:3px 9px; font-size:11px; font-weight:600; color:var(--text3); }
    .ver-badge .v-app { color:var(--accent2); }
    .ver-badge .v-mob { color:var(--green); }

    /* ── Map day legend ── */
    .map-legend { position:absolute; bottom:calc(64px); right:12px; z-index:10; display:flex; flex-direction:column; gap:5px; }
    .map-legend-item { display:flex; align-items:center; gap:6px; background:var(--bg2); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:11px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.4); }
    .map-legend-dot { width:11px; height:11px; border-radius:50%; border:2px solid #fff; flex-shrink:0; }

    /* ── Block complete toggle ── */
    .blk-circle.done { opacity:.5; }
    .blk-title.done { text-decoration:line-through; opacity:.55; }

    /* ── Inline note editor ── */
    .note-inline { background:var(--bg3); border:1px solid var(--border); border-radius:7px; padding:7px 10px; font-size:12px; font-family:'Heebo',sans-serif; color:var(--text); direction:rtl; resize:none; outline:none; width:100%; margin-top:5px; line-height:1.5; }

    /* ── Expense row ── */
    .exp-row { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
    .exp-row:last-child { border-bottom:none; }
    .exp-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
    .exp-cat { font-size:11px; font-weight:600; padding:2px 8px; border-radius:10px; flex-shrink:0; }
    .exp-desc { flex:1; font-size:13px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .exp-amt { font-size:14px; font-weight:700; flex-shrink:0; }
    .exp-del { background:none; border:none; color:var(--text3); cursor:pointer; font-size:15px; padding:3px 5px; opacity:.4; }
    .exp-del:active { opacity:1; color:var(--red); }
  </style>
</head>

const normalizeCountry=(raw,fullAddr)=>{
  if(!raw)return'ללא כתובת';
  const lo=raw.toLowerCase().trim();
  if(COUNTRY_HE[lo])return COUNTRY_HE[lo];
  for(const[en,he] of Object.entries(COUNTRY_HE)){if(lo.includes(en))return he;}
  if(ISRAEL_CITIES.has(lo))return'ישראל';
  if(/israel/i.test(fullAddr)||/ישראל/.test(fullAddr))return'ישראל';
  return raw;
};
const getCountry=item=>{
  if(item.country)return normalizeCountry(item.country,item.address||'');
  const addr=(item.address||'').trim();
  if(!addr)return'ללא כתובת';
  const parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
  if(parts.length<2)return normalizeCountry(parts[0]||'ללא כתובת',addr);
  let last=parts[parts.length-1];
  last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').trim();
  last=last.replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
  if(!last||/^\d+$/.test(last)){
    last=parts[parts.length-2]||'';
    last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
  }
  return normalizeCountry(last||'ללא כתובת',addr);
};

let _toast=null;
const toast=(msg,type='i')=>_toast?.(msg,type);
function ToastLayer(){
  const[items,setItems]=useState([]);
  _toast=useCallback((msg,type)=>{const id=uid();setItems(p=>[...p,{id,msg,type}]);setTimeout(()=>setItems(p=>p.filter(t=>t.id!==id)),3200);},[]);
  if(!items.length)return null;
  return<div className="toast-w">{items.map(t=><div key={t.id} className={`toast ${t.type}`}>{t.msg}</div>)}</div>;
}

/* ════════════════════════════════
   MAP SCREEN
════════════════════════════════ */
function MapScreen({trip,active,mapsReady,onUpdate,mapFocusRef}){
  const mapDivRef=useRef(null);
  const mapRef=useRef(null);
  const bankMkRef=useRef([]);
  const dayMkRef=useRef([]);
  const srchMkRef=useRef([]);
  const svcRef=useRef(null);
  const iwRef=useRef(null);
  const srchInputRef=useRef(null);
  const[sheet,setSheet]=useState(null);
  const[daySelPlace,setDaySelPlace]=useState(null);
  const[loading,setLoading]=useState(false);
  const[showDayLegend,setShowDayLegend]=useState(true);

  /* init map */
  useEffect(()=>{
    if(!mapsReady||!mapDivRef.current||mapRef.current)return;
    const m=new window.google.maps.Map(mapDivRef.current,{
      center:{lat:46,lng:14},zoom:5,
      disableDefaultUI:true,gestureHandling:'greedy',styles:DARK_MAP,
    });
    svcRef.current=new window.google.maps.places.PlacesService(m);
    iwRef.current=new window.google.maps.InfoWindow();
    m.addListener('click',async e=>{
      if(!e.placeId)return;
      e.stop();
      loadPlace(e.placeId,e.latLng.lat(),e.latLng.lng());
    });
    mapRef.current=m;
  },[mapsReady]);

  /* resize + handle focus request when tab activates */
  useEffect(()=>{
    if(!active)return;
    const t=setTimeout(()=>{
      if(mapRef.current)window.google?.maps?.event?.trigger(mapRef.current,'resize');
      const req=mapFocusRef?.current;
      if(!req||!mapRef.current)return;
      mapFocusRef.current=null;
      if(req.lat&&req.lng){mapRef.current.panTo({lat:req.lat,lng:req.lng});mapRef.current.setZoom(16);}
      if(req.placeId)loadPlace(req.placeId,req.lat||0,req.lng||0);
      else if(req.name)setSheet({lat:req.lat,lng:req.lng,name:req.name,address:req.address||'',inBank:true});
    },120);
    return()=>clearTimeout(t);
  },[active,mapsReady]);// eslint-disable-line

  /* bank markers — gold dots */
  useEffect(()=>{
    if(!mapsReady||!mapRef.current)return;
    bankMkRef.current.forEach(m=>m.setMap(null));
    bankMkRef.current=[];
    (trip?.interestBank||[]).forEach(item=>{
      if(!item.lat||!item.lng)return;
      const mk=new window.google.maps.Marker({
        position:{lat:item.lat,lng:item.lng},map:mapRef.current,title:item.name||'',zIndex:5,
        icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:8,fillColor:'#f59e0b',fillOpacity:.9,strokeColor:'#fff',strokeWeight:1.5},
      });
      mk.addListener('click',()=>loadPlace(item.placeId,item.lat,item.lng,item));
      bankMkRef.current.push(mk);
    });
  },[trip?.interestBank,mapsReady]);

  /* day route markers — colored circles per day */
  useEffect(()=>{
    if(!mapsReady||!mapRef.current)return;
    dayMkRef.current.forEach(m=>m.setMap(null));
    dayMkRef.current=[];
    (trip?.days||[]).forEach((day,di)=>{
      const color=DAY_COLORS_MAP[di%DAY_COLORS_MAP.length];
      (day.blocks||[]).forEach(b=>{
        // get coordinates: from block directly, or look up bank item
        const lat=b.lat||(b.placeId?(trip.interestBank||[]).find(i=>i.placeId===b.placeId)?.lat:null);
        const lng=b.lng||(b.placeId?(trip.interestBank||[]).find(i=>i.placeId===b.placeId)?.lng:null);
        if(!lat||!lng)return;
        const mk=new window.google.maps.Marker({
          position:{lat,lng},map:mapRef.current,title:`יום ${di+1}: ${b.title||''}`,zIndex:8,
          icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:10,fillColor:color,fillOpacity:.92,strokeColor:'#fff',strokeWeight:2},
          label:{text:String(di+1),color:'#fff',fontSize:'10px',fontWeight:'bold'},
        });
        mk.addListener('click',()=>setSheet({lat,lng,name:b.title||BLOCK_HE[b.type]||'פעילות',address:b.address||'',inBank:false,placeId:b.placeId||null,website:'',dayLabel:`יום ${di+1}`}));
        dayMkRef.current.push(mk);
      });
    });
  },[trip?.days,trip?.interestBank,mapsReady]);

  const loadPlace=(placeId,lat,lng,bankItem=null)=>{
    if(!svcRef.current){return;}
    setLoading(true);
    const inBank=bankItem!=null||!!(trip?.interestBank||[]).find(i=>i.placeId===placeId);
    if(!placeId){
      setSheet({lat,lng,name:bankItem?.name||'',address:bankItem?.address||'',inBank,bankItem});
      setLoading(false);return;
    }
    svcRef.current.getDetails({placeId,fields:['name','rating','formatted_address','website','types','geometry']},
      (res,st)=>{
        const PS=window.google.maps.places.PlacesServiceStatus;
        if(st===PS.OK&&res){
          setSheet({placeId,lat:res.geometry?.location?.lat()||lat,lng:res.geometry?.location?.lng()||lng,
            name:res.name,address:res.formatted_address,rating:res.rating,website:res.website,types:res.types,inBank});
        } else {
          setSheet({placeId,lat,lng,name:bankItem?.name||'',address:bankItem?.address||'',inBank});
        }
        setLoading(false);
      });
  };

  const doSearch=()=>{
    const q=(srchInputRef.current?.value||'').trim();
    if(!q||!mapRef.current||!svcRef.current)return;
    srchMkRef.current.forEach(m=>m.setMap(null));srchMkRef.current=[];
    const bounds=mapRef.current.getBounds();
    const opts={query:q,language:'he'};
    if(bounds)opts.bounds=bounds;
    svcRef.current.textSearch(opts,(res,st)=>{
      const PS=window.google.maps.places.PlacesServiceStatus;
      if(st!==PS.OK||!res?.length){toast('לא נמצאו תוצאות','e');return;}
      const toShow=(bounds?res.filter(r=>r.geometry?.location&&bounds.contains(r.geometry.location)):res).slice(0,10);
      const list=toShow.length?toShow:res.slice(0,5);
      list.forEach(r=>{
        const loc=r.geometry?.location;if(!loc)return;
        const mk=new window.google.maps.Marker({position:{lat:loc.lat(),lng:loc.lng()},map:mapRef.current,title:r.name||'',zIndex:20,
          icon:{path:window.google.maps.SymbolPath.FORWARD_CLOSED_ARROW,scale:5,fillColor:'#4f8ef7',fillOpacity:1,strokeColor:'#fff',strokeWeight:1.5,rotation:180}});
        mk.addListener('click',()=>loadPlace(r.place_id,loc.lat(),loc.lng()));
        srchMkRef.current.push(mk);
      });
      if(list.length===1){const loc=list[0].geometry.location;loadPlace(list[0].place_id,loc.lat(),loc.lng());}
    });
  };

  const goLoc=()=>{
    if(!navigator.geolocation||!mapRef.current){toast('מיקום לא זמין','e');return;}
    navigator.geolocation.getCurrentPosition(p=>{
      const ll={lat:p.coords.latitude,lng:p.coords.longitude};
      mapRef.current.panTo(ll);mapRef.current.setZoom(14);
    },()=>toast('לא ניתן לגשת למיקום','e'));
  };

  const addToBank=()=>{
    if(!sheet||!onUpdate)return;
    const item={id:uid(),name:sheet.name||'',address:sheet.address||'',placeId:sheet.placeId||'',
      lat:sheet.lat,lng:sheet.lng,types:sheet.types||[],rating:sheet.rating,website:sheet.website};
    const cur=trip||{interestBank:[]};
    onUpdate({...cur,interestBank:[...(cur.interestBank||[]),item]});
    toast(`"${sheet.name}" נוסף לבנק ⭐`,'s');
    setSheet(s=>({...s,inBank:true}));
  };

  const addToSchedule=(dayId)=>{
    if(!sheet||!onUpdate||!trip)return;
    const block={id:uid(),type:'activity',title:sheet.name||'',startTime:'10:00',endTime:'12:00',
      note:'',placeId:sheet.placeId||'',address:sheet.address||'',
      lat:sheet.lat||null,lng:sheet.lng||null};
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,blocks:[...(d.blocks||[]),block]}:d)});
    toast(`"${sheet.name}" נוסף ליום ✓`,'s');
    setDaySelPlace(null);
  };

  return(
    <div className={`screen map-screen${active?'':' h'}`}>
      {/* map div — always rendered */}
      <div ref={mapDivRef} className="map-container"/>

      {/* loading overlay */}
      {!mapsReady&&<div className="map-loading"><div className="spinner"/><div style={{color:'var(--text3)',fontSize:13}}>טוען מפה...</div></div>}

      {/* search bar */}
      <div className="map-searchbar">
        <input ref={srchInputRef} className="map-si" placeholder="🔍 חיפוש מקומות..." dir="rtl"
          onKeyDown={e=>e.key==='Enter'&&doSearch()}/>
        <button onClick={doSearch} style={{background:'var(--accent)',border:'none',borderRadius:10,color:'#fff',padding:'0 14px',fontFamily:'Heebo,sans-serif',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:'0 2px 10px rgba(0,0,0,.4)'}}>חפש</button>
      </div>

      {/* current location FAB */}
      <button className="map-fab loc-fab" onClick={goLoc} title="מיקום נוכחי">◎</button>

      {/* loading indicator */}
      {loading&&<div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',zIndex:20,background:'var(--bg2)',borderRadius:50,padding:14,border:'1px solid var(--border)'}}>
        <div className="spinner"/>
      </div>}

      {/* bottom sheet overlay */}
      {sheet&&<div className="sheet-ov" onClick={()=>setSheet(null)}/>}

      {/* bottom sheet */}
      <div className={`bsheet${sheet?' open':''}`}>
        <div className="bsheet-handle"/>
        {sheet&&<>
          <div className="bsheet-name">{sheet.name||'מקום לא ידוע'}</div>
          {sheet.types?.length>0&&<div className="bsheet-type">{getTypeLabel(sheet.types)}</div>}
          {sheet.rating&&<div style={{padding:'0 16px 6px',fontSize:13,color:'var(--amber)'}}>⭐ {sheet.rating}</div>}
          {sheet.address&&<div className="bsheet-addr">📍 {sheet.address}</div>}
          <div className="bsheet-actions">
            {sheet.website&&<a href={sheet.website} target="_blank" rel="noreferrer" style={{textDecoration:'none',flex:1,minWidth:120}}>
              <button className="bsheet-btn web" style={{width:'100%'}}>🌐 אתר</button>
            </a>}

}

/* ════════════════════════════════
   SCHEDULE SCREEN — day-by-day
════════════════════════════════ */
function ScheduleScreen({trip,active,onShowOnMap,onUpdate}){
  const[dayIdx,setDayIdx]=useState(0);
  const[expandedId,setExpandedId]=useState(null);
  const days=trip?.days||[];
  const safeIdx=Math.min(dayIdx,Math.max(0,days.length-1));
  const day=days[safeIdx];

  /* swipe gesture */
  const touchX=useRef(null);
  const onTS=e=>{touchX.current=e.touches[0].clientX;};
  const onTE=e=>{
    if(touchX.current===null)return;
    const dx=e.changedTouches[0].clientX-touchX.current;
    touchX.current=null;
    if(Math.abs(dx)<50)return;
    // RTL: swipe left → next day, swipe right → prev day
    if(dx<0)setDayIdx(i=>Math.min(days.length-1,i+1));
    else setDayIdx(i=>Math.max(0,i-1));
  };

  const blockDur=b=>{
    if(!b.startTime||!b.endTime)return null;
    const[sh,sm]=b.startTime.split(':').map(Number),[eh,em]=b.endTime.split(':').map(Number);
    const m=(eh*60+em)-(sh*60+sm);if(m<=0)return null;
    return m>=60?`${Math.floor(m/60)}ש'${m%60?` ${m%60}ד`:''}`:` ${m}ד`;
  };

  const toggleComplete=(dayId,blockId)=>{
    if(!onUpdate||!trip)return;
    onUpdate({...trip,days:trip.days.map(d=>d.id!==dayId?d:{
      ...d,blocks:(d.blocks||[]).map(b=>b.id!==blockId?b:{...b,isCompleted:!b.isCompleted})
    })});
  };

  const updateNote=(dayId,blockId,note)=>{
    if(!onUpdate||!trip)return;
    onUpdate({...trip,days:trip.days.map(d=>d.id!==dayId?d:{
      ...d,blocks:(d.blocks||[]).map(b=>b.id!==blockId?b:{...b,note})
    })});
  };

  return(
    <div className={`screen${active?'':' h'}`} onTouchStart={onTS} onTouchEnd={onTE}>
      <div className="sh">
        <div className="stitle">📅 לוז הטיול</div>
        {trip&&<div className="ssub">{trip.name} · {days.length} ימים</div>}
      </div>

      {!trip&&<div className="empty"><div className="eicon">📅</div><div className="etitle">אין טיול פעיל</div></div>}
      {trip&&days.length===0&&<div className="empty"><div className="eicon">📅</div><div className="etitle">אין ימים בלוז</div><div className="edesc">הוסף ימים דרך אפליקציית המחשב</div></div>}

      {day&&<>
        {/* day navigation arrows */}
        <div className="day-nav">
          <button className="day-nav-btn" onClick={()=>setDayIdx(i=>i+1)} disabled={safeIdx>=days.length-1}>‹</button>
          <div className="day-nav-center">
            <div className="day-nav-title">
              יום {safeIdx+1}
              {day.startLocation&&<span style={{fontWeight:400,color:'var(--text2)'}}> — {day.startLocation}</span>}
            </div>
            <div className="day-nav-sub">{day.startTime}–{day.endTime} · {(day.blocks||[]).length} פעילויות</div>
          </div>
          <button className="day-nav-btn" onClick={()=>setDayIdx(i=>i-1)} disabled={safeIdx<=0}>›</button>
        </div>

        {/* dot indicators */}
        {days.length>1&&<div className="day-dots">
          {days.map((_,i)=><div key={i} className={`day-dot${i===safeIdx?' active':''}`} onClick={()=>setDayIdx(i)}/>)}
        </div>}

        {/* blocks timeline */}
        {(day.blocks||[]).length===0&&(
          <div style={{padding:'30px 16px',textAlign:'center',color:'var(--text3)',fontSize:13}}>אין פעילויות ביום זה</div>
        )}
        <div style={{flex:1,overflowY:'auto'}}>
          {(day.blocks||[]).map((b,bi,arr)=>{
            const hasLoc=!!(b.placeId||(b.lat&&b.lng));
            const isExp=expandedId===b.id;
            const done=!!b.isCompleted;
            return(
              <div key={b.id}>
                <div className="blk-row" onClick={()=>setExpandedId(isExp?null:b.id)}>
                  <div className="blk-left">
                    <div
                      className={`blk-circle${done?' done':''}`}
                      style={{background:BLOCK_COLOR[b.type]||'#555',cursor:'pointer'}}
                      onClick={e=>{e.stopPropagation();toggleComplete(day.id,b.id);}}
                      title={done?'סמן כלא הושלם':'סמן כהושלם'}
                    >
                      {done?'✓':BLOCK_EMOJI[b.type]||'📌'}
                    </div>
                    {bi<arr.length-1&&<div className="blk-line"/>}
                  </div>
                  <div className="blk-content">
                    <div className={`blk-title${done?' done':''}`}>{b.title||BLOCK_HE[b.type]||b.type}</div>
                    <div className="blk-meta">
                      {b.startTime&&`${b.startTime}${b.endTime?` — ${b.endTime}`:''}`}
                      {blockDur(b)&&<span style={{color:'var(--text3)'}}> · {blockDur(b)}</span>}
                      {!isExp&&b.note&&<span style={{color:'var(--accent2)',display:'block',marginTop:2}}>📝 {b.note}</span>}
                    </div>
                    {/* inline note editor — shown when expanded */}
                    {isExp&&<textarea
                      className="note-inline"
                      rows={3}
                      defaultValue={b.note||''}
                      placeholder="הוסף הערה לפעילות..."
                      onClick={e=>e.stopPropagation()}
                      onBlur={e=>updateNote(day.id,b.id,e.target.value.trim())}
                    />}
                  </div>
                  {hasLoc&&<button className="blk-map-btn" onClick={e=>{e.stopPropagation();onShowOnMap&&onShowOnMap({lat:b.lat,lng:b.lng,placeId:b.placeId,name:b.title||BLOCK_HE[b.type],address:b.address||''});}}>🗺️</button>}
                </div>
              </div>
            );
          })}
          <div style={{height:16}}/>
        </div>
      </>}
    </div>
  );
}

const haversineKm=(lat1,lng1,lat2,lng2)=>{
  const R=6371,toR=x=>x*Math.PI/180;
  const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
};
const fmtDist=km=>km===Infinity?'':km<1?`${Math.round(km*1000)}מ׳`:`${km<10?km.toFixed(1):Math.round(km)}ק"מ`;

function BankScreen({trip,active,onShowOnMap}){
  const[search,setSearch]=useState('');
  const[sortMode,setSortMode]=useState('default'); // 'default'|'name'|'distance'
  const[userPos,setUserPos]=useState(null); // {lat,lng}
  const bank=trip?.interestBank||[];

  const getDistPos=()=>{
    if(!navigator.geolocation){toast('GPS לא זמין','e');return;}
    navigator.geolocation.getCurrentPosition(
      p=>{setUserPos({lat:p.coords.latitude,lng:p.coords.longitude});setSortMode('distance');},
      ()=>toast('לא ניתן לגשת למיקום','e'),
      {timeout:8000}
    );
  };

  const handleSortClick=mode=>{
    if(mode==='distance'){
      if(sortMode==='distance'){setSortMode('default');return;}
      getDistPos();
    } else {
      setSortMode(s=>s===mode?'default':mode);
    }
  };

  /* filtered + sorted flat list */
  const displayItems=useMemo(()=>{
    let items=[...bank];
    const q=search.trim().toLowerCase();
    if(q)items=items.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.address||'').toLowerCase().includes(q));
    if(sortMode==='name'){
      items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','he'));
    } else if(sortMode==='distance'&&userPos){
      items=items.map(i=>({...i,_dist:i.lat&&i.lng?haversineKm(userPos.lat,userPos.lng,i.lat,i.lng):Infinity}));
      items.sort((a,b)=>a._dist-b._dist);
    }
    return items;
  },[bank,search,sortMode,userPos]);

  /* grouped (used when not searching and not distance-sorting) */
  const grouped=useMemo(()=>{
    const m={};
    for(const i of bank){const c=getCountry(i);if(!m[c])m[c]=[];m[c].push(i);}
    const entries=Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'he'));
    if(sortMode==='name')entries.forEach(([,items])=>items.sort((a,b)=>(a.name||'').localeCompare(b.name||'','he')));
    return entries;
  },[bank,sortMode]);

  const showFlat=!!(search.trim())||sortMode==='distance';

  const BankItem=({item})=>{
    const lbl=getTypeLabel(item.types||(item.placeType?[item.placeType]:[]));
    const ic=lbl?lbl.split(' ')[0]:'📍';
    const hasLoc=!!(item.lat&&item.lng);
    return(
      <div className="bitem">
        <div style={{fontSize:20,flexShrink:0}}>{ic}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:600}}>{item.name||'—'}</div>
          {(item.address||lbl)&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{lbl}{item.address&&<span> · {item.address}</span>}</div>}
          {item._dist!==undefined&&<div style={{fontSize:11,color:'var(--accent2)',marginTop:2}}>📍 {fmtDist(item._dist)}</div>}
          {item.note&&<div style={{fontSize:11,color:'var(--accent2)',marginTop:2}}>📝 {item.note}</div>}
        </div>
        {item.rating&&<div style={{fontSize:11,color:'var(--amber)',flexShrink:0,marginLeft:4}}>⭐ {item.rating}</div>}
        {hasLoc&&<button className="map-btn" onClick={()=>onShowOnMap&&onShowOnMap({lat:item.lat,lng:item.lng,placeId:item.placeId,name:item.name,address:item.address||''})}>🗺️</button>}
      </div>
    );
  };

  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh"><div className="stitle">⭐ בנק אטרקציות</div>{trip&&<div className="ssub">{bank.length} מקומות שמורים</div>}</div>

      {bank.length>0&&<>
        {/* search bar */}
        <div style={{padding:'9px 14px 7px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,background:'var(--bg3)',borderRadius:9,padding:'8px 12px',border:'1px solid var(--border)'}}>
            <span style={{fontSize:15}}>🔍</span>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="חיפוש אטרקציה..." style={{flex:1,background:'none',border:'none',outline:'none',color:'var(--text)',fontSize:14,fontFamily:'Heebo,sans-serif',direction:'rtl'}}/>
            {search&&<button onClick={()=>setSearch('')} style={{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:15,padding:0}}>✕</button>}
          </div>
        </div>
        {/* sort bar */}
        <div style={{display:'flex',alignItems:'center',gap:6,padding:'7px 14px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          <span style={{fontSize:11,color:'var(--text3)',flexShrink:0}}>מיון:</span>
          {[['default','📋 ברירת מחדל'],['name','א-ת שם'],['distance','📍 מרחק']].map(([mode,label])=>(
            <button key={mode} onClick={()=>handleSortClick(mode)}
              style={{padding:'5px 10px',borderRadius:8,border:`1px solid ${sortMode===mode?'var(--accent2)':'var(--border)'}`,
                background:sortMode===mode?'rgba(79,142,247,.15)':'var(--bg3)',
                color:sortMode===mode?'var(--accent2)':'var(--text3)',
                fontSize:11,fontWeight:600,fontFamily:'Heebo,sans-serif',cursor:'pointer',whiteSpace:'nowrap'}}>
              {label}
            </button>
          ))}
        </div>
        {sortMode==='distance'&&userPos&&<div style={{padding:'4px 14px',fontSize:10,color:'var(--text3)',background:'var(--bg3)',borderBottom:'1px solid var(--border)',flexShrink:0}}>
          ממיקומך הנוכחי · לחץ "מרחק" שוב לביטול
        </div>}
      </>}

      {!trip&&<div className="empty"><div className="eicon">⭐</div><div className="etitle">אין טיול פעיל</div></div>}
      {trip&&bank.length===0&&<div className="empty"><div className="eicon">⭐</div><div className="etitle">בנק האטרקציות ריק</div><div className="edesc">הוסף אטרקציות דרך אפליקציית המחשב או מהמפה</div></div>}
      {search&&displayItems.length===0&&<div className="empty"><div className="eicon">🔍</div><div className="etitle">אין תוצאות</div></div>}

      {/* flat list — search results or distance sort */}
      {showFlat&&displayItems.length>0&&(
        <div style={{flex:1,overflowY:'auto'}}>
          <div className="card" style={{margin:'12px 14px'}}>
            {displayItems.map(item=><BankItem key={item.id} item={item}/>)}
          </div>
          <div style={{height:16}}/>
        </div>
      )}

      {/* grouped by country — default & name sort */}
      {!showFlat&&grouped.length>0&&(
        <div style={{flex:1,overflowY:'auto'}}>
          {grouped.map(([country,items])=>(
            <div key={country}>
              <div className="slabel">{country} ({items.length})</div>
              <div className="card" style={{margin:'0 14px'}}>
                {items.map(item=><BankItem key={item.id} item={item}/>)}
              </div>
            </div>
          ))}
          <div style={{height:16}}/>
        </div>
      )}
    </div>
  );
}

/* ── Checklist tab ── */
function ChecklistTab({emoji,items,emptyText,addPlaceholder,onUpdate}){
  const[text,setText]=useState('');
  const done=items.filter(i=>i.done).length;
  const add=()=>{const t=text.trim();if(!t)return;onUpdate([...items,{id:uid(),text:t,done:false,category:'כללי'}]);setText('');};
  const tog=id=>onUpdate(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const del=id=>onUpdate(items.filter(i=>i.id!==id));
  const grouped=items.reduce((a,i)=>{const c=i.category||'כללי';if(!a[c])a[c]=[];a[c].push(i);return a;},{});
  return(
    <>
      {/* progress bar */}
      {items.length>0&&<div className="prog-bar"><div className="prog-fill" style={{width:`${items.length?(done/items.length)*100:0}%`}}/></div>}
      {/* add row */}
      <div className="add-row">
        <input className="add-inp" value={text} onChange={e=>setText(e.target.value)} placeholder={addPlaceholder} onKeyDown={e=>e.key==='Enter'&&add()}/>
        <button className="add-btn" onClick={add}>+</button>
      </div>
      {/* stats */}

        <span>{emoji} {items.length} פריטים</span>
        <span style={{color:'var(--green)'}}>✓ {done} הושלמו</span>
        {done>0&&<button onClick={()=>onUpdate(items.filter(i=>!i.done))} style={{background:'none',border:'none',color:'var(--red)',fontSize:12,cursor:'pointer',padding:0,marginRight:'auto'}}>נקה הושלמו</button>}
      </div>}
      {/* list */}
      <div style={{flex:1,overflowY:'auto'}}>
        {items.length===0&&<div className="empty"><div className="eicon">{emoji}</div><div className="etitle">{emptyText}</div><div className="edesc">הקלד פריט בשדה למעלה והוסף</div></div>}
        {Object.entries(grouped).map(([cat,citems])=>(
          <div key={cat}>
            {Object.keys(grouped).length>1&&<div className="slabel">{cat}</div>}
            <div className="card" style={{margin:'0 14px 10px'}}>
              {citems.map(item=>(
                <div key={item.id} className="ci">

                    <div className={`ci-text${item.done?' done':''}`}>{item.text}</div>
                  </div>
                  <button className="ci-del" onClick={()=>del(item.id)}>✕</button>
                </div>
              ))}
            </div>
          </div>
        ))}
        <div style={{height:16}}/>
      </div>
    </>
  );
}

    setForm(f=>({...f,amount:'',description:''}));
    toast('הוצאה נוספה ✓','s');

  return(
    <div style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      {/* total + bar */}
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'baseline',gap:8,marginBottom:total>0?8:0}}>
          <span style={{fontSize:22,fontWeight:800,color:'var(--accent2)'}}>₪{total.toLocaleString()}</span>
          <span style={{fontSize:12,color:'var(--text3)'}}>סה"כ · {expenses.length} הוצאות</span>
        </div>
        {total>0&&<>
          <div style={{display:'flex',borderRadius:4,overflow:'hidden',height:7,marginBottom:7}}>
            {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
              <div key={c} style={{flex:byCat[c]/total,background:CAT_COLORS[c]}} title={`${c}: ₪${byCat[c].toFixed(0)}`}/>
            ))}
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'4px 12px'}}>
            {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
              <span key={c} style={{fontSize:11,color:CAT_COLORS[c]}}>● {c}: ₪{byCat[c].toFixed(0)}</span>
            ))}
          </div>
        </>}
      </div>

      {/* add form */}
      <div style={{padding:'10px 14px 12px',borderBottom:'1px solid var(--border)',background:'var(--bg3)',flexShrink:0,display:'flex',flexDirection:'column',gap:8}}>
        <div style={{display:'flex',gap:8}}>
          <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}
            style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none'}}>
            {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}
          </select>
          <input value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} type="number" min="0"
            placeholder="סכום ₪" onKeyDown={e=>e.key==='Enter'&&add()}
            style={{width:90,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:14,outline:'none',textAlign:'center'}}/>
        </div>
        <div style={{display:'flex',gap:8}}>
          <input value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="תיאור (אופציונלי)"
            onKeyDown={e=>e.key==='Enter'&&add()}
            style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 10px',color:'var(--text)',fontFamily:'Heebo,sans-serif',fontSize:13,outline:'none',direction:'rtl'}}/>
          <button onClick={add} style={{background:'var(--accent)',color:'#fff',border:'none',borderRadius:8,padding:'0 18px',fontFamily:'Heebo,sans-serif',fontSize:16,fontWeight:700,cursor:'pointer'}}>+</button>
        </div>
      </div>

      {/* list */}
      {expenses.length===0&&<div className="empty"><div className="eicon">💰</div><div className="etitle">אין הוצאות עדיין</div><div className="edesc">הוסף הוצאות בטופס למעלה</div></div>}
      <div className="card" style={{margin:'12px 14px'}}>
        {[...expenses].reverse().map(ex=>(
          <div key={ex.id} className="exp-row">
            <div className="exp-dot" style={{background:CAT_COLORS[ex.category]||'#888'}}/>
            <span className="exp-cat" style={{background:(CAT_COLORS[ex.category]||'#888')+'22',color:CAT_COLORS[ex.category]||'#888'}}>{ex.category}</span>
            <div className="exp-desc">{ex.description||ex.category}<span style={{color:'var(--text3)',fontSize:10,marginRight:5}}>{ex.date}</span></div>
            <span className="exp-amt">₪{parseFloat(ex.amount).toFixed(0)}</span>
            <button className="exp-del" onClick={()=>del(ex.id)}>✕</button>
          </div>
        ))}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ── Docs tab ── */
function DocsTab({trip}){
  const docs=trip?.documents||[];
  if(docs.length===0)return(
    <div className="empty"><div className="eicon">📁</div><div className="etitle">אין מסמכים</div><div className="edesc">הוסף דרכונים, ביטוח, כרטיסים ועוד<br/>דרך אפליקציית המחשב</div></div>
  );
  return(
    <div style={{flex:1,overflowY:'auto'}}>
      <div className="doc-grid">
        {docs.map(doc=>(
          <div key={doc.id} className="doc-card">
            <div className="doc-icon">{docIcon(doc.type)}</div>
            <div className="doc-name">{doc.name}</div>
            <div className="doc-meta">{fmtSize(doc.size||0)}</div>
            {doc.url&&(
              doc.type?.startsWith('image/')?
                <img src={doc.url} alt={doc.name} style={{width:'100%',height:60,objectFit:'cover',borderRadius:6,marginTop:4}}/>
                :<a href={doc.url} target="_blank" rel="noreferrer" download={doc.name} style={{fontSize:11,color:'var(--accent2)',textDecoration:'none',marginTop:4,display:'block'}}>
                  {doc.type?.startsWith('image/')?'פתח 🖼️':'הורד ↓'}
                </a>
            )}
          </div>
        ))}
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ════════════════════════════════
   TRIP SCREEN
════════════════════════════════ */
function TripScreen({trips,activeId,onSelectTrip,syncStatus,onRefresh,active}){
  const trip=trips.find(t=>t.id===activeId)||trips[0]||null;
  const totalExp=trip?.expenses?.reduce((s,e)=>s+(parseFloat(e.amount)||0),0)||0;
  const sl={idle:'⚪ לא מחובר',syncing:'🔄 מסנכרן...',synced:'✅ מסונכרן',error:'❌ שגיאה'};
  return(
    <div className={`screen${active?'':' h'}`}>
      <div className="sh">
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div className="stitle">✈️ הטיול שלי</div>
          <span className={`sync-b ${syncStatus}`}>{sl[syncStatus]||''}</span>
        </div>
      </div>
      {trips.length>1&&<div style={{display:'flex',gap:8,padding:'10px 14px',background:'var(--bg3)',borderBottom:'1px solid var(--border)',overflowX:'auto',flexShrink:0}}>
        {trips.map(t=><div key={t.id} className={`trip-chip${t.id===activeId?' active':''}`} onClick={()=>onSelectTrip(t.id)}>{t.name}</div>)}
      </div>}
      {trip?<>
        <div className="slabel">פרטי הטיול</div>
        <div className="card" style={{margin:'0 14px'}}>
          <div className="crow"><div className="cicon">✈️</div><div className="cmain"><div className="ctitle">{trip.name}</div><div className="csub">שם הטיול</div></div></div>
          {trip.vehiclePlate&&<div className="crow"><div className="cicon">🚗</div><div className="cmain"><div className="ctitle">{trip.vehiclePlate}</div><div className="csub">רכב</div></div></div>}
        </div>
        <div className="slabel">סטטיסטיקות</div>
        <div style={{display:'flex',gap:8,padding:'0 14px 14px',flexWrap:'wrap'}}>
          <div className="spill"><span>📅</span>{trip.days?.length||0} ימים</div>
          <div className="spill"><span>⭐</span>{trip.interestBank?.length||0} אטרקציות</div>
          <div className="spill"><span>💰</span>₪{totalExp.toLocaleString()}</div>
          <div className="spill"><span>🛒</span>{(trip.shoppingList||[]).filter(i=>!i.done).length} לקנות</div>
          <div className="spill"><span>🎒</span>{(trip.packingList||[]).filter(i=>!i.done).length} לארוז</div>
          <div className="spill"><span>📄</span>{trip.documents?.length||0} מסמכים</div>
        </div>
        <div className="slabel">פעולות</div>
        <div className="card" style={{margin:'0 14px'}}>
          <div className="crow" style={{cursor:'pointer'}} onClick={onRefresh}>
            <div className="cicon">🔄</div><div className="cmain"><div className="ctitle">רענן נתונים מהענן</div><div className="csub">טעינה מחדש מ-Firebase</div></div>
          </div>
          <div className="crow" style={{cursor:'pointer'}} onClick={()=>{if(window.confirm('לפתוח אפליקציית מחשב?'))window.open('index.html','_blank');}}>
            <div className="cicon">💻</div><div className="cmain"><div className="ctitle">פתח אפליקציית מחשב</div><div className="csub">עריכה מלאה</div></div>
          </div>
        </div>
      </>:<div className="empty"><div className="eicon">✈️</div><div className="etitle">לא נמצאו טיולים</div><div className="edesc">צור טיול דרך אפליקציית המחשב</div></div>}
      <div style={{margin:'20px 14px 0',padding:'12px 14px',background:'var(--bg3)',borderRadius:10,display:'flex',flexDirection:'column',alignItems:'center',gap:7}}>
        <div style={{fontSize:11,color:'var(--text3)',fontWeight:600}}>PlanMyTrip</div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center'}}>
          <span className="ver-badge"><span className="v-mob">📱 Mobile</span><span className="v-mob">{MOB_VER}</span></span>
        </div>
        <div style={{fontSize:10,color:'var(--text3)',opacity:.6}}>© {new Date().getFullYear()} PlanMyTrip</div>
      </div>
      <div style={{height:16}}/>
    </div>
  );
}

/* ════════════════════════════════
   BOTTOM NAV
════════════════════════════════ */
const NAV=[{id:'map',icon:'🗺️',label:'מפה'},{id:'schedule',icon:'📅',label:'לוז'},{id:'bank',icon:'⭐',label:'בנק'},{id:'lists',icon:'📋',label:'רשימות'},{id:'trip',icon:'✈️',label:'טיול'}];
function BottomNav({active,onChange}){
  return<nav className="bnav">{NAV.map(n=><button key={n.id} className={`nbtn${active===n.id?' active':''}`} onClick={()=>onChange(n.id)}><span className="nicon">{n.icon}</span><span className="nlabel">{n.label}</span></button>)}</nav>;
}

/* ════════════════════════════════
   URL ?key= PARAM — auto-connect on first visit
════════════════════════════════ */
(()=>{
  try{
    const urlKey=new URLSearchParams(window.location.search).get('key');
    if(urlKey){
      const cur=loadState()||{};
      saveState({...cur,settings:{...(cur.settings||{}),syncKey:urlKey,firebaseUrl:FB_URL}});
      window.history.replaceState({},'',window.location.pathname);
      location.reload();
    }
  }catch{}
})();

/* ════════════════════════════════
   APP
════════════════════════════════ */
function App(){
  const saved=useMemo(()=>loadState(),[]);
  const[settings]=useState(()=>{
    const def={firebaseUrl:FB_URL,syncKey:'',googleMapsKey:GMAPS_KEY};
    return{...def,...(saved?.settings||{}),firebaseUrl:FB_URL};
  });
  const[trips,setTrips]=useState(()=>{
    const raw=saved?.trips;
    if(raw?.length>0){const n=raw.map(normTrip).filter(Boolean);if(n.length>0)return n;}
    return[];
  });
  const[activeId,setActiveId]=useState(saved?.activeId||(saved?.trips?.[0]?.id??null));
  const[screen,setScreen]=useState('map');
  const[syncStatus,setSyncStatus]=useState('idle');
  const[mapsReady,setMapsReady]=useState(!!window.google?.maps);
  const skipPush=useRef(false);
  const autoSaveTimer=useRef(null);
  const syncMounted=useRef(false);
  const tripsRef=useRef(trips);
  tripsRef.current=trips;
  const mapFocusRef=useRef(null);

  /* navigate to map and focus on a place */
  const showOnMap=useCallback(item=>{
    mapFocusRef.current=item;
    setScreen('map');
  },[]);

  const trip=useMemo(()=>trips.find(t=>t.id===activeId)||trips[0]||null,[trips,activeId]);

  /* load Google Maps */
  useEffect(()=>{
    if(window.google?.maps){setMapsReady(true);return;}
    window.__gmMobileInit=()=>setMapsReady(true);
    const s=document.createElement('script');
    s.src=`https://maps.googleapis.com/maps/api/js?key=${settings.googleMapsKey}&libraries=places&callback=__gmMobileInit&language=he`;
    s.async=true;s.defer=true;
    document.head.appendChild(s);
  },[]);// eslint-disable-line

  /* load from Firebase */
  const loadFromFirebase=useCallback(async()=>{
    const{firebaseUrl:fbUrl,syncKey}=settings;
    if(!fbUrl||!syncKey)return;
    setSyncStatus('syncing');
    try{
      const data=await fbRead(fbUrl,syncKey);
      if(data?.trips?.length>0){
        const loaded=data.trips.map(normTrip).filter(Boolean);
        if(loaded.length>0){skipPush.current=true;setTrips(loaded);if(data.activeId)setActiveId(data.activeId);toast('הטיול נטען מ-Firebase ✓','s');}
      }
      setSyncStatus('synced');
    }catch{setSyncStatus('error');toast('שגיאה בטעינה מ-Firebase','e');}
  },[settings]);

  useEffect(()=>{loadFromFirebase();},[]);// eslint-disable-line

  /* persist to localStorage */
  useEffect(()=>{
    if(trips.length>0)saveState({settings,trips,activeId});
  },[trips,activeId]);// eslint-disable-line

  /* debounced auto-save to Firebase */
  const debounceSave=useCallback((newTrips,newActiveId)=>{
    const{firebaseUrl:fbUrl,syncKey}=settings;
    if(!fbUrl||!syncKey)return;
    clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current=setTimeout(async()=>{
      setSyncStatus('syncing');
      try{await fbWrite(fbUrl,syncKey,{trips:newTrips,activeId:newActiveId,savedAt:new Date().toISOString()});setSyncStatus('synced');}
      catch{setSyncStatus('error');}
    },1800);
  },[settings]);

  /* updateTrip — updates the active trip and triggers save */
  const updateTrip=useCallback(updatedTrip=>{
    setTrips(prev=>{
      const next=prev.map(t=>t.id===updatedTrip.id?updatedTrip:t);
      debounceSave(next,activeId);
      return next;
    });
  },[activeId,debounceSave]);

  return(
    <>
      <ToastLayer/>
      <div className="sw">
        <MapScreen trip={trip} active={screen==='map'} mapsReady={mapsReady} onUpdate={updateTrip} mapFocusRef={mapFocusRef}/>
        <ScheduleScreen trip={trip} active={screen==='schedule'} onShowOnMap={showOnMap} onUpdate={updateTrip}/>
        <BankScreen trip={trip} active={screen==='bank'} onShowOnMap={showOnMap}/>
        <ListsScreen trip={trip} active={screen==='lists'} onUpdate={updateTrip}/>
        <TripScreen trips={trips} activeId={activeId} onSelectTrip={setActiveId} syncStatus={syncStatus} onRefresh={loadFromFirebase} active={screen==='trip'}/>
      </div>
      <BottomNav active={screen} onChange={setScreen}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
