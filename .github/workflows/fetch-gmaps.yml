name: Fetch Google Maps List
on:
  repository_dispatch:
    types: [fetch-gmaps]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch from Google and save via API
        env:
          GMAPS_URL: ${{ github.event.client_payload.api_url }}
          REQ_ID: ${{ github.event.client_payload.req_id }}
          REPO: ${{ github.repository }}
        run: |
          # שליפה מגוגל
          curl -sf --max-time 30 -A "Mozilla/5.0" "$GMAPS_URL" -o /tmp/resp.txt || true

          # בדיקת תקינות: תשובת גוגל מפות תמיד מתחילה ב-")"
          if [ -s /tmp/resp.txt ] && [ "$(head -c1 /tmp/resp.txt)" = ")" ]; then
            echo "Valid response: $(wc -c < /tmp/resp.txt) bytes"
          else
            printf 'FETCH_FAILED' > /tmp/resp.txt
          fi

          # פונקציה: העלאת קובץ ישירות ל-GitHub API (ללא git checkout/push)
          gh_upload() {
            local API_PATH="$1" CONTENT="$2"
            local SHA BODY
            SHA=$(gh api "repos/$REPO/contents/$API_PATH" --jq '.sha' 2>/dev/null || true)
            BODY="{\"message\":\"cache [skip ci]\",\"content\":\"$CONTENT\""
            [ -n "$SHA" ] && BODY="$BODY,\"sha\":\"$SHA\""
            BODY="$BODY}"
            gh api "repos/$REPO/contents/$API_PATH" -X PUT --input - <<< "$BODY"
          }

          RESP_B64=$(base64 -w0 /tmp/resp.txt)
          ID_B64=$(printf '%s' "$REQ_ID" | base64 -w0)

          # חשוב: response קודם, id אחרון (id מסמן לאפליקציה שהתוצאה מוכנה)
          gh_upload "_cache/gmaps_response.txt" "$RESP_B64"
          gh_upload "_cache/gmaps_id.txt" "$ID_B64"
          echo "Done - reqId: $REQ_ID"
