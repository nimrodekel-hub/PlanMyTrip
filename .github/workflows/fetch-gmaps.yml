name: Fetch Google Maps List
on:
  repository_dispatch:
    types: [fetch-gmaps]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from Google
        env:
          GMAPS_URL: ${{ github.event.client_payload.api_url }}
          REQ_ID: ${{ github.event.client_payload.req_id }}
        run: |
          mkdir -p _cache
          curl -sf --max-time 30 -A "Mozilla/5.0" "$GMAPS_URL" > _cache/gmaps_response.txt || true
          echo "$REQ_ID" > _cache/gmaps_id.txt
      - name: Commit
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add _cache/
          git diff --staged --quiet || git commit -m "cache: gmaps [skip ci]"
          git push
