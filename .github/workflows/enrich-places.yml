name: Enrich Places Data
on:
  repository_dispatch:
    types: [enrich-places]

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install Playwright + Chromium
        run: |
          pip install playwright --quiet
          playwright install chromium --with-deps --quiet
          echo "Playwright ready"

      - name: Enrich place details (headless Chrome)
        env:
          PLACES_B64: ${{ github.event.client_payload.places_b64 }}
          REQ_ID: ${{ github.event.client_payload.req_id }}
          REPO: ${{ github.repository }}
        run: |
          echo "$PLACES_B64" | base64 -d > /tmp/places.json
          COUNT=$(python3 -c 'import json; print(len(json.load(open("/tmp/places.json"))))')
          echo "Enriching $COUNT places with Playwright..."

          python3 << 'PYEOF'
import asyncio, json, re, time, urllib.parse, urllib.request

# ── JavaScript injected into each place page ──────────────────────────────────
EXTRACT_JS = """
() => {
  const r = {};
  const txt = el => el ? el.textContent.trim().replace(/\\s+/g,' ') : '';
  const q   = sel => document.querySelector(sel);
  const qa  = sel => Array.from(document.querySelectorAll(sel));

  // ── Rating: aria-label "X.X stars" ──
  for (const el of qa('[aria-label]')) {
    const lbl = el.getAttribute('aria-label') || '';
    const m = lbl.match(/^(\\d\\.\\d)\\s*stars?/i);
    if (m) { r.rating = parseFloat(m[1]); break; }
  }

  // ── Review count: aria-label "NNN reviews" ──
  for (const el of qa('[aria-label]')) {
    const lbl = el.getAttribute('aria-label') || '';
    const m = lbl.match(/^([\\d,]+)\\s+reviews?$/i);
    if (m) { r.userRatingsTotal = parseInt(m[1].replace(/,/g,'')); break; }
  }

  // ── Category / type (subtitle below name) ──
  const catEl = q('button.DkEaL') || q('span.DkEaL')
             || qa('span').find(el => el.parentElement && el.parentElement.tagName === 'BUTTON' && el.closest('[jsaction*="category"]'));
  if (catEl) r.placeType = txt(catEl);

  // ── Address: data-item-id="address" ──
  const addrEl = q('[data-item-id="address"]');
  if (addrEl) {
    r.address = txt(addrEl)
      .replace(/Copy address/gi,'')
      .replace(/^(Get directions|Directions)\\b.*$/gi,'')
      .trim();
  }

  // ── Phone: data-item-id contains "phone:tel" ──
  const phoneEl = qa('[data-item-id]').find(e => (e.getAttribute('data-item-id')||'').includes('phone:tel'));
  if (phoneEl) r.phone = txt(phoneEl).replace(/Copy phone number/gi,'').trim();

  // ── Website: data-item-id="authority" ──
  const webEl = q('[data-item-id="authority"]');
  if (webEl) {
    const a = webEl.tagName==='A' ? webEl : webEl.querySelector('a');
    r.website = (a && a.href && !a.href.includes('google.com')) ? a.href : txt(webEl);
  }

  // ── Hours: open/closed status ──
  const ohBtn = q('[data-item-id="oh"]');
  if (ohBtn) {
    const hoursText = txt(ohBtn);
    r.todayHours = hoursText.split(/[·•]/)[0].trim() || hoursText;
    r.openStatus = /open/i.test(hoursText) ? 'פתוח עכשיו' :
                   /clos/i.test(hoursText)  ? 'סגור עכשיו'  : '';
  }

  return r;
}
"""

async def run(places):
    from playwright.async_api import async_playwright

    enriched = []
    sem = asyncio.Semaphore(5)   # 5 concurrent Chrome pages

    async with async_playwright() as pw:
        browser = await pw.chromium.launch(
            headless=True,
            args=['--no-sandbox','--disable-setuid-sandbox',
                  '--disable-dev-shm-usage','--disable-gpu']
        )
        ctx = await browser.new_context(
            user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
            locale='en-US'
        )

        async def enrich_one(place):
            pid  = place.get('id','')
            cid  = str(place.get('_cid','')).strip()
            name = place.get('name','')
            lat  = place.get('lat')
            lng  = place.get('lng')

            async with sem:
                page = await ctx.new_page()
                try:
                    if cid:
                        url = f"https://www.google.com/maps?cid={cid}&hl=en"
                    elif lat and lng:
                        url = f"https://www.google.com/maps/place/{urllib.parse.quote(name)}/@{lat},{lng},17z?hl=en"
                    else:
                        return {'id': pid}

                    await page.goto(url, wait_until='domcontentloaded', timeout=25000)

                    # Wait for the place detail card to appear
                    try:
                        await page.wait_for_selector(
                            '[data-item-id], [aria-label*="stars"], .DkEaL',
                            timeout=8000
                        )
                    except Exception:
                        pass  # continue anyway — might still have partial data

                    data = await page.evaluate(EXTRACT_JS)
                    result = {k: v for k, v in data.items() if v}  # drop empty values
                    result['id'] = pid
                    return result

                except Exception as e:
                    print(f"  ✗ {name}: {e}")
                    return {'id': pid}
                finally:
                    await page.close()

        tasks = [enrich_one(p) for p in places]
        results = await asyncio.gather(*tasks, return_exceptions=True)
        await browser.close()

    for i, r in enumerate(results):
        if isinstance(r, Exception):
            enriched.append({'id': places[i].get('id','')})
        else:
            enriched.append(r)
    return enriched


# ── Nominatim fallback (address only) ─────────────────────────────────────────
def nominatim_reverse(lat, lng):
    url = f"https://nominatim.openstreetmap.org/reverse?lat={lat}&lon={lng}&format=json&zoom=18&accept-language=en"
    req = urllib.request.Request(url, headers={'User-Agent': 'PlanMyTrip/1.0'})
    try:
        with urllib.request.urlopen(req, timeout=10) as resp:
            d = json.loads(resp.read())
        a = d.get('address', {})
        road   = a.get('road') or a.get('pedestrian') or a.get('footway') or ''
        num    = a.get('house_number', '')
        suburb = a.get('neighbourhood') or a.get('suburb') or ''
        city   = a.get('city') or a.get('town') or a.get('village') or ''
        state  = a.get('state', '')
        country= a.get('country', '')
        parts = []
        if road: parts.append((num+' '+road).strip() if num else road)
        if suburb and suburb != city: parts.append(suburb)
        if city: parts.append(city)
        if state and state != city: parts.append(state)
        if country: parts.append(country)
        return ', '.join(parts[:5]) if parts else ''
    except Exception:
        return ''


# ── Main ──────────────────────────────────────────────────────────────────────
places = json.load(open('/tmp/places.json'))
enriched = asyncio.run(run(places))

# Nominatim fallback for places without address
nom_done = 0
for item in enriched:
    if not item.get('address'):
        place = next((p for p in places if p.get('id') == item.get('id')), None)
        if place and place.get('lat') and place.get('lng'):
            if nom_done > 0:
                time.sleep(1.1)          # Nominatim rate limit: 1 req/s
            addr = nominatim_reverse(place['lat'], place['lng'])
            if addr:
                item['address'] = addr
            nom_done += 1

json.dump(enriched, open('/tmp/enriched.json', 'w'), ensure_ascii=False)

addr_c  = sum(1 for r in enriched if r.get('address'))
rate_c  = sum(1 for r in enriched if r.get('rating'))
phone_c = sum(1 for r in enriched if r.get('phone'))
web_c   = sum(1 for r in enriched if r.get('website'))
print(f"✅ Done: {len(enriched)} places | address:{addr_c} | rating:{rate_c} | phone:{phone_c} | website:{web_c}")
PYEOF

          # ── Upload results via GitHub API ──────────────────────────────────
          gh_upload() {
            local API_PATH="$1" CONTENT="$2"
            local SHA BODY
            SHA=$(gh api "repos/$REPO/contents/$API_PATH" --jq '.sha' 2>/dev/null || true)
            BODY="{\"message\":\"enrich [skip ci]\",\"content\":\"$CONTENT\""
            [ -n "$SHA" ] && BODY="$BODY,\"sha\":\"$SHA\""
            BODY="$BODY}"
            gh api "repos/$REPO/contents/$API_PATH" -X PUT --input - <<< "$BODY"
          }

          RESULT_B64=$(base64 -w0 /tmp/enriched.json)
          ID_B64=$(printf '%s' "$REQ_ID" | base64 -w0)

          # response first, id last (id = "ready" signal for the app)
          gh_upload "_cache/enrich_response.txt" "$RESULT_B64"
          gh_upload "_cache/enrich_id.txt" "$ID_B64"
          echo "Uploaded — reqId: $REQ_ID"
