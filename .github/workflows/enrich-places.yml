name: Enrich Places Data
on:
  repository_dispatch:
    types: [enrich-places]

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo (to get enrich.py script)
        uses: actions/checkout@v4

      - name: Decode payload
        env:
          PLACES_B64: ${{ github.event.client_payload.places_b64 }}
        run: |
          printf '%s' "$PLACES_B64" | base64 -d > /tmp/places.json
          echo "places.json: $(wc -c < /tmp/places.json) bytes"
          python3 -c "import json; d=json.load(open('/tmp/places.json')); print(len(d),'places, first:',d[0].get('name','?') if d else '(empty)')"

      - name: Enrich places (BigDataCloud + Overpass/OSM)
        run: python3 .github/scripts/enrich.py

      - name: Upload result as unique per-request file
        env:
          REQ_ID: ${{ github.event.client_payload.req_id }}
          REPO:   ${{ github.repository }}
        run: |
          RESULT_B64=$(base64 -w0 /tmp/enriched.json)
          echo "Uploading _cache/${REQ_ID}.json (${#RESULT_B64} chars)"

          BODY="{\"message\":\"enrich result [skip ci]\",\"content\":\"$RESULT_B64\"}"
          if gh api "repos/$REPO/contents/_cache/${REQ_ID}.json" \
               -X PUT --input - <<< "$BODY" > /dev/null 2>&1; then
            echo "Upload OK — reqId: $REQ_ID"
          else
            echo "WARN: first upload failed, retrying in 5s..."
            sleep 5
            gh api "repos/$REPO/contents/_cache/${REQ_ID}.json" \
               -X PUT --input - <<< "$BODY" > /dev/null 2>&1 \
               && echo "Retry OK" || echo "ERROR: upload failed"
          fi
