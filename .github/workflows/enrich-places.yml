name: Enrich Places Data
on:
  repository_dispatch:
    types: [enrich-places]

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Enrich place details (Nominatim + HTML scraping)
        env:
          PLACES_B64: ${{ github.event.client_payload.places_b64 }}
          REQ_ID:     ${{ github.event.client_payload.req_id }}
          REPO:       ${{ github.repository }}
        run: |
          set -e
          echo "$PLACES_B64" | base64 -d > /tmp/places.json
          python3 - << 'PYEOF'
import json, re, time, urllib.request, urllib.parse, sys
from concurrent.futures import ThreadPoolExecutor, as_completed

# ── Nominatim reverse geocoding (address from lat/lng) ───────────────────────
def nominatim_reverse(lat, lng):
    url = (f"https://nominatim.openstreetmap.org/reverse"
           f"?lat={lat}&lon={lng}&format=json&zoom=18&accept-language=en")
    req = urllib.request.Request(url, headers={"User-Agent": "PlanMyTrip/1.0"})
    try:
        with urllib.request.urlopen(req, timeout=10) as resp:
            d = json.loads(resp.read())
        a = d.get("address", {})
        road    = a.get("road") or a.get("pedestrian") or a.get("footway") or ""
        num     = a.get("house_number", "")
        suburb  = a.get("neighbourhood") or a.get("suburb") or ""
        city    = a.get("city") or a.get("town") or a.get("village") or ""
        state   = a.get("state", "")
        country = a.get("country", "")
        parts   = []
        if road:   parts.append((num + " " + road).strip() if num else road)
        if suburb and suburb != city: parts.append(suburb)
        if city:   parts.append(city)
        if state and state != city:   parts.append(state)
        if country: parts.append(country)
        return ", ".join(parts[:5]) if parts else d.get("display_name", "").split(",")[0]
    except Exception as e:
        print(f"  nominatim error {lat},{lng}: {e}", file=sys.stderr)
        return ""

# ── Fetch Google Maps CID page and extract data ───────────────────────────────
GMAPS_HDR = {
    "User-Agent": (
        "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
        "(KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    ),
    "Accept-Language": "en-US,en;q=0.9",
    "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
}

def fetch_html(url, timeout=15):
    req = urllib.request.Request(url, headers=GMAPS_HDR)
    try:
        with urllib.request.urlopen(req, timeout=timeout) as r:
            return r.read().decode("utf-8", errors="replace")
    except Exception:
        return ""

def scrape_gmaps(html):
    """Best-effort extraction from Google Maps HTML (no JS rendering)."""
    result = {}
    if not html or len(html) < 500:
        return result

    # ── JSON-LD (most reliable when present) ──────────────────────────────────
    for m in re.finditer(
        r"<script[^>]*type=[\"']application/ld\+json[\"'][^>]*>(.*?)</script>",
        html, re.DOTALL | re.IGNORECASE
    ):
        try:
            d = json.loads(m.group(1))
            if isinstance(d, list): d = d[0] if d else {}
            if not isinstance(d, dict): continue
            t = str(d.get("@type", ""))
            addr = d.get("address", {})
            if isinstance(addr, dict):
                parts = [addr.get("streetAddress",""), addr.get("addressLocality",""),
                         addr.get("addressRegion",""), addr.get("addressCountry","")]
                a = ", ".join(p for p in parts if p)
                if a: result["address"] = a
            elif isinstance(addr, str) and addr:
                result["address"] = addr
            if d.get("telephone"):   result["phone"]   = str(d["telephone"])
            url = d.get("url","")
            if url and "google.com" not in url: result["website"] = url
            ag = d.get("aggregateRating", {})
            if isinstance(ag, dict) and ag.get("ratingValue"):
                result["rating"] = round(float(ag["ratingValue"]), 1)
                if ag.get("ratingCount") or ag.get("reviewCount"):
                    result["userRatingsTotal"] = int(ag.get("ratingCount") or ag.get("reviewCount"))
            if t: result["placeType"] = t
            break
        except Exception:
            pass

    # ── Phone from tel: href ──────────────────────────────────────────────────
    if not result.get("phone"):
        m = re.search(r'href=["\']tel:([+\d\s\(\)\-\.]{7,25})["\']', html)
        if m: result["phone"] = m.group(1).strip()

    # ── Website (non-Google URL) ──────────────────────────────────────────────
    if not result.get("website"):
        SKIP = r"(?:google|goo\.gl|schema\.org|w3\.org|apple\.com|fb\.com|twitter|instagram)"
        m = re.search(
            r'"(https?://(?!' + SKIP + r')[\w\-]{2,}\.[\w\-]{2,10}[^\s"\'\\<>]{0,120})"',
            html
        )
        if m:
            u = m.group(1)
            if len(u) > 8 and "\\" not in u:
                result["website"] = u

    # ── Rating from context ───────────────────────────────────────────────────
    if not result.get("rating"):
        m = re.search(r'([1-4]\.[0-9])\s*(?:stars?|★|out of 5|\([\d,]+ review)',
                      html, re.IGNORECASE)
        if m:
            v = float(m.group(1))
            if 1.0 <= v <= 5.0:
                result["rating"] = v

    return result

def enrich_one(place):
    pid = place.get("id", "")
    cid = str(place.get("_cid", "")).strip()
    if cid:
        html = fetch_html(f"https://www.google.com/maps?cid={cid}&hl=en")
        if html:
            data = scrape_gmaps(html)
            if data:
                data["id"] = pid
                return data
    return {"id": pid}

# ── Main ──────────────────────────────────────────────────────────────────────
places = json.load(open("/tmp/places.json"))
print(f"Loaded {len(places)} places")
if places:
    print(f"  first CID: {places[0].get('_cid','(empty)')}")

enriched = []

# Parallel HTML scraping (5 workers)
with ThreadPoolExecutor(max_workers=5) as ex:
    future_map = {ex.submit(enrich_one, p): p for p in places}
    done = 0
    for fut in as_completed(future_map):
        done += 1
        try:
            enriched.append(fut.result())
        except Exception:
            enriched.append({"id": future_map[fut].get("id", "")})
        if done % 25 == 0:
            print(f"  HTML scraped {done}/{len(places)}")

# Nominatim for missing addresses (1 req/s rate limit)
nom_done = 0
for item in enriched:
    if not item.get("address"):
        p = next((x for x in places if x.get("id") == item.get("id")), None)
        if p and p.get("lat") and p.get("lng"):
            if nom_done > 0:
                time.sleep(1.1)
            addr = nominatim_reverse(p["lat"], p["lng"])
            if addr:
                item["address"] = addr
            nom_done += 1

json.dump(enriched, open("/tmp/enriched.json", "w"), ensure_ascii=False)

addr_c  = sum(1 for r in enriched if r.get("address"))
rate_c  = sum(1 for r in enriched if r.get("rating"))
phone_c = sum(1 for r in enriched if r.get("phone"))
web_c   = sum(1 for r in enriched if r.get("website"))
print(f"Done: {len(enriched)} | address:{addr_c} | rating:{rate_c} | phone:{phone_c} | website:{web_c}")
PYEOF

          # ── Upload results ──────────────────────────────────────────────────
          gh_upload() {
            local API_PATH="$1" CONTENT="$2"
            local SHA BODY
            SHA=$(gh api "repos/$REPO/contents/$API_PATH" --jq '.sha' 2>/dev/null || true)
            BODY="{\"message\":\"enrich [skip ci]\",\"content\":\"$CONTENT\""
            [ -n "$SHA" ] && BODY="$BODY,\"sha\":\"$SHA\""
            BODY="$BODY}"
            gh api "repos/$REPO/contents/$API_PATH" -X PUT --input - <<< "$BODY"
          }

          RESULT_B64=$(base64 -w0 /tmp/enriched.json)
          ID_B64=$(printf '%s' "$REQ_ID" | base64 -w0)

          gh_upload "_cache/enrich_response.txt" "$RESULT_B64"
          gh_upload "_cache/enrich_id.txt" "$ID_B64"
          echo "Done — reqId: $REQ_ID"
