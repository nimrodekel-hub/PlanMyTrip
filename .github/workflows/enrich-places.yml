name: Enrich Places Data
on:
  repository_dispatch:
    types: [enrich-places]

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repo (to get enrich.py script)
        uses: actions/checkout@v4

      - name: Decode payload
        env:
          PLACES_B64: ${{ github.event.client_payload.places_b64 }}
        run: |
          printf '%s' "$PLACES_B64" | base64 -d > /tmp/places.json
          echo "places.json: $(wc -c < /tmp/places.json) bytes, $(python3 -c "import json; d=json.load(open('/tmp/places.json')); print(len(d),'places')" 2>/dev/null || echo '?')"

      - name: Geocode addresses
        run: python3 .github/scripts/enrich.py

      - name: Upload results
        env:
          REQ_ID: ${{ github.event.client_payload.req_id }}
          REPO:   ${{ github.repository }}
        run: |
          gh_upload() {
            local API_PATH="$1" CONTENT="$2"
            local SHA BODY
            SHA=$(gh api "repos/$REPO/contents/$API_PATH" --jq '.sha' 2>/dev/null || true)
            BODY="{\"message\":\"enrich [skip ci]\",\"content\":\"$CONTENT\""
            [ -n "$SHA" ] && BODY="$BODY,\"sha\":\"$SHA\""
            BODY="$BODY}"
            if gh api "repos/$REPO/contents/$API_PATH" -X PUT --input - <<< "$BODY" > /dev/null 2>&1; then
              echo "  OK: uploaded $API_PATH"
            else
              echo "  WARN: upload failed for $API_PATH — retrying once"
              sleep 3
              gh api "repos/$REPO/contents/$API_PATH" -X PUT --input - <<< "$BODY" > /dev/null || true
            fi
          }

          RESULT_B64=$(base64 -w0 /tmp/enriched.json)
          ID_B64=$(printf '%s' "$REQ_ID" | base64 -w0)
          echo "Uploading results (${#RESULT_B64} chars) for reqId=$REQ_ID"

          gh_upload "_cache/enrich_response.txt" "$RESULT_B64"
          gh_upload "_cache/enrich_id.txt"       "$ID_B64"
          echo "All done."
