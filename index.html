<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <title>CaravanControl — מנהל טיולים v25</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #232736;
      --surface: #2a2e3f; --surface2: #333849; --border: #3d4358;
      --text: #e8eaf0; --text2: #9aa0b8; --text3: #6b7295;
      --accent: #4f8ef7; --green: #22c55e; --amber: #f59e0b;
      --red: #ef4444; --purple: #a855f7; --orange: #f97316;
      --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .light {
      --bg: #f0f4f8; --bg2: #e8edf3; --bg3: #dde3ec;
      --surface: #ffffff; --surface2: #f5f7fa; --border: #d1d9e6;
      --text: #1a2035; --text2: #4a5568; --text3: #8896aa;
      --shadow: 0 4px 24px rgba(0,0,0,0.1);
    }

    html, body { height: 100%; font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; direction: rtl; }
    #root { height: 100%; display: flex; flex-direction: column; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .app-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 20px; flex-shrink: 0; z-index: 100; }
    .vehicle-banner { display: flex; align-items: center; gap: 16px; padding: 10px 0 6px; flex-wrap: wrap; }
    .tab-bar { display: flex; gap: 2px; padding: 6px 0 0; overflow-x: auto; }
    .tab-btn { padding: 8px 16px; border: none; background: none; color: var(--text2); font-size: 13px; font-weight: 500; font-family: 'Heebo', sans-serif; cursor: pointer; border-radius: 8px 8px 0 0; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text); background: var(--surface); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface); }
    .main-content { flex: 1; overflow: hidden; display: flex; width: 100%; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; font-family: 'Heebo', sans-serif; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3a7de8; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface2); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 7px; border-radius: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: 'Heebo', sans-serif; width: 100%; transition: border-color 0.15s; direction: rtl; }
    .input:focus { outline: none; border-color: var(--accent); }
    .input::placeholder { color: var(--text3); }
    textarea.input { resize: vertical; min-height: 80px; }
    select.input { cursor: pointer; }
    .label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 4px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-body { padding: 16px; }

    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .chip-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .chip-amber { background: rgba(245,158,11,0.15); color: var(--amber); }
    .chip-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .chip-blue { background: rgba(79,142,247,0.15); color: var(--accent); }
    .chip-purple { background: rgba(168,85,247,0.15); color: var(--purple); }

    .progress { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-start; }

    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .timeline { display: flex; flex-direction: column; position: relative; }
    .timeline::before { content: ''; position: absolute; right: 44px; top: 0; bottom: 0; width: 2px; background: var(--border); z-index: 0; }
    .timeline-block { display: flex; flex-direction: row-reverse; gap: 12px; position: relative; animation: fadeIn 0.3s ease; padding-bottom: 6px; }
    .timeline-dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; margin-top: 12px; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid var(--bg2); }
    .block-travel { background: rgba(79,142,247,0.1); border: 1px solid rgba(79,142,247,0.3); }
    .block-activity { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .block-stop { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }

    .stars { display: flex; gap: 3px; }
    .star { font-size: 20px; cursor: pointer; transition: transform 0.1s; user-select: none; }
    .star:hover { transform: scale(1.2); }

    /* ── תצוגת מפה 3 עמודות ── */
    .map-view-3col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: row; height: 100%; overflow: hidden; }
    .map-col { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
    .map-col + .map-col { border-left: 1px solid var(--border); }

    .interest-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); transition: all 0.15s; animation: slideIn 0.2s ease; }
    .interest-item:hover { border-color: var(--accent); }

    .expense-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .expense-row:last-child { border-bottom: none; }

    .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; transition: background 0.15s; }
    .list-item:hover { background: var(--surface2); }
    .list-item.done span.item-text { text-decoration: line-through; opacity: 0.5; }

    .weather-card { background: linear-gradient(135deg, #1e3a5f, #1a2d4e); border-radius: 12px; padding: 14px; color: #fff; }
    .sidebar-panel { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

    .toast-container { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13px; box-shadow: var(--shadow); animation: modalIn 0.25s ease; display: flex; align-items: center; gap: 10px; min-width: 240px; cursor: pointer; }
    .toast.success { border-right: 3px solid var(--green); }
    .toast.error { border-right: 3px solid var(--red); }
    .toast.info { border-right: 3px solid var(--accent); }

    .scroll-y { overflow-y: auto; }
    .flex-1 { flex: 1; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 20px; color: var(--text3); text-align: center; }
    .empty-state .emoji { font-size: 48px; }
    .empty-state p { font-size: 14px; line-height: 1.7; max-width: 320px; }

    .gauge { display: flex; flex-direction: column; gap: 3px; min-width: 80px; }
    .gauge-label { font-size: 10px; color: var(--text3); font-weight: 600; }
    .gauge-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; width: 100%; }
    .gauge-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }

    .day-header { padding: 12px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .day-header:hover { background: var(--surface); }
    .time-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(79,142,247,0.12); border-radius: 8px; font-size: 12px; }

    .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .doc-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
    .doc-item:hover { border-color: var(--accent); transform: translateY(-2px); }

    .mobile-toggle { display: none; }
    .mobile-bottom-nav { display: none; }
    .bank-backdrop { display: none; }
    .bank-close-btn { display: none; }

    @media (max-width: 768px) {
      /* ── כללי ── */
      html, body { overflow: hidden; -webkit-text-size-adjust: 100%; }

      /* ── כותרת ── */
      .app-header { padding: 0 12px; }
      .vehicle-banner { gap: 8px; padding: 6px 0 4px; flex-wrap: wrap; }
      .vehicle-banner .btn { padding: 5px 10px; font-size: 12px; }

      /* ── לשוניות — מוסתר על מובייל, מוחלף בניווט תחתון ── */
      .tab-bar { display: none; }
      .mobile-toggle { display: none; }

      /* ── תוכן ראשי ── */
      .main-content { padding-bottom: 56px; }

      /* ── ניווט תחתון ── */
      .mobile-bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 500;
        background: var(--bg2);
        border-top: 1px solid var(--border);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        gap: 0;
        padding: 0;
      }
      .mobile-bottom-nav::-webkit-scrollbar { display: none; }
      .mobile-nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 6px 10px;
        min-width: 56px;
        min-height: 52px;
        flex-shrink: 0;
        border: none;
        background: none;
        color: var(--text3);
        font-family: 'Heebo', sans-serif;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
        border-top: 2px solid transparent;
      }
      .mobile-nav-btn.active { color: var(--accent); border-top-color: var(--accent); background: rgba(79,142,247,0.08); }
      .mobile-nav-icon { font-size: 18px; line-height: 1; }
      .mobile-nav-label { font-size: 9px; font-weight: 600; white-space: nowrap; }

      /* ── מודאלים ── */
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal { max-width: 100%; width: 100%; border-radius: 20px 20px 0 0; max-height: 92vh; }

      /* ── תצוגת מפה 3 עמודות: בסלולר רק המפה גלויה, שאר הפאנלים bottom-sheets ── */
      .map-col + .map-col { border-left: none; }
      .map-col-map { flex: 1 1 100%; }
      .map-col-timeline, .map-col-bank {
        position: fixed !important;
        bottom: 56px; left: 0; right: 0;
        height: 68vh;
        z-index: 450;
        background: var(--bg2);
        border-radius: 20px 20px 0 0 !important;
        border-top: 2px solid var(--accent) !important;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        transform: translateY(105%);
        transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      }
      .map-col-timeline.mob-open, .map-col-bank.mob-open {
        transform: translateY(0);
      }
      .mob-panel-backdrop {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 440;
      }
      .mob-panel-backdrop.show { display: block; }

      /* ── בנק אטרקציות בלשונית לוח זמנים עצמאית ── */
      .sidebar-panel {
        position: fixed !important;
        bottom: 56px; left: 0; right: 0;
        height: 68vh;
        width: 100% !important;
        z-index: 450;
        border-radius: 20px 20px 0 0 !important;
        border-right: none !important;
        border-top: 2px solid var(--accent) !important;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        animation: slideUp .28s ease;
      }
      .bank-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 440; }
      .bank-close-btn { display: flex; }

      /* ── בלוקי ציר זמן ── */
      .timeline-block { gap: 8px; }
      .timeline-dot { width: 28px; height: 28px; font-size: 13px; }
      .card.block-activity, .card.block-travel, .card.block-stop { border-radius: 10px; }
      .day-header { padding: 10px 12px; gap: 8px; }

      /* ── כפתורים — גודל מגע ── */
      .btn { min-height: 38px; }
      .btn-sm { min-height: 32px; }
      .btn-icon { min-height: 36px; min-width: 36px; }
      .tab-btn { min-height: 44px; padding: 10px 14px; }
      input[type="checkbox"] { min-width: 20px; min-height: 20px; }

      /* ── toast ── */
      .toast-container { bottom: 68px; left: 12px; right: 12px; }
      .toast { min-width: unset; width: 100%; }

      /* ── doc grid ── */
      .doc-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

      /* ── הוצאות ── */
      .expense-row { flex-wrap: wrap; gap: 6px; }
    }

    /* ── מסכים גדולים ── */
    @media (min-width: 769px) {
      .mobile-bottom-nav { display: none !important; }
    }

    .gm-style .gm-style-iw-c { padding: 0 !important; }

    @media print {
      .app-header, .tab-bar, .mobile-bottom-nav, .report-toolbar { display: none !important; }
      html, body, #root, .main-content { overflow: visible !important; height: auto !important; }
      .scroll-y { overflow: visible !important; height: auto !important; max-height: none !important; }
      .modal-overlay { display: none !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── עזרים ── */
const APP_VERSION = 'v37';
const uid = () => Math.random().toString(36).slice(2,10);
const fmt2 = n => n?.toString().padStart(2,'0');
const dateStr = d => { if (!d) return ''; return new Date(d).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); };
const nowTime = () => { const n=new Date(); return `${fmt2(n.getHours())}:${fmt2(n.getMinutes())}`; };
const addMins = (t,m) => { const [h,mi]=t.split(':').map(Number),tot=h*60+mi+m; return `${fmt2(Math.floor(tot/60)%24)}:${fmt2(tot%60)}`; };

const EXPENSE_CATS    = ['דלק','אוכל','קמפינג','אגרות','פעילויות','קניות','תחזוקה','אחר'];
const CAT_COLORS      = {'דלק':'#ef4444','אוכל':'#f59e0b','קמפינג':'#22c55e','אגרות':'#8b5cf6','פעילויות':'#4f8ef7','קניות':'#ec4899','תחזוקה':'#f97316','אחר':'#6b7280'};
const BLOCK_TYPES     = ['travel','activity','stop','rest','games','free'];
const BLOCK_HE        = {travel:'נסיעה',activity:'פעילות',stop:'עצירה',rest:'מנוחה',games:'משחקים',free:'זמן פנוי'};
const BLOCK_EMOJI     = {travel:'🚗',activity:'🎯',stop:'⏸️',rest:'😴',games:'🎮',free:'🕐'};
const BLOCK_COLOR     = {travel:'var(--accent)',activity:'var(--green)',stop:'var(--amber)',rest:'#94a3b8',games:'#a855f7',free:'#64748b'};
const PLACE_TYPE_HE={restaurant:'🍽️ מסעדה',cafe:'☕ קפה',bar:'🍺 בר',food:'🍽️ אוכל',
  lodging:'🏨 מלון',shopping_mall:'🛍️ קניון',store:'🛍️ חנות',supermarket:'🛒 סופרמרקט',
  grocery_or_supermarket:'🛒 סופר',clothing_store:'👗 ביגוד',
  tourist_attraction:'🎯 אטרקציה',museum:'🏛️ מוזיאון',park:'🌳 פארק',
  natural_feature:'🏔️ טבע',campground:'⛺ קמפינג',beach:'🏖️ חוף ים',
  amusement_park:'🎢 פארק שעשועים',zoo:'🦁 גן חיות',aquarium:'🐠 אקווריום',
  movie_theater:'🎬 קולנוע',gym:'💪 ספורט',stadium:'🏟️ אצטדיון',
  airport:'✈️ שדה תעופה',train_station:'🚂 רכבת',bus_station:'🚌 אוטובוס',
  gas_station:'⛽ תחנת דלק',hospital:'🏥 בית חולים',pharmacy:'💊 בית מרקחת',
  synagogue:'🕍 בית כנסת',church:'⛪ כנסייה',mosque:'🕌 מסגד',
  spa:'💆 ספא',bank:'🏦 בנק',atm:'🏧 כספומט',
  point_of_interest:'📍 אטרקציה',establishment:'🏢 עסק'};
const PLACE_TYPE_PRIORITY=['restaurant','cafe','bar','lodging','shopping_mall','supermarket',
  'grocery_or_supermarket','clothing_store','store','museum','zoo','aquarium','amusement_park',
  'park','campground','beach','movie_theater','tourist_attraction','gym','stadium',
  'airport','train_station','bus_station','gas_station','hospital','pharmacy','spa','bank','atm',
  'synagogue','church','mosque','natural_feature','food','point_of_interest','establishment'];
const getPlaceTypeLabel=types=>{
  if(!types?.length) return '';
  for(const t of PLACE_TYPE_PRIORITY){ if(types.includes(t)) return PLACE_TYPE_HE[t]||''; }
  return '';
};
const WMO = {0:['☀️','בהיר'],1:['🌤️','בהיר ברובו'],2:['⛅','מעונן חלקית'],3:['☁️','מעונן'],45:['🌫️','ערפל'],51:['🌦️','טפטוף קל'],61:['🌧️','גשם קל'],63:['🌧️','גשם'],65:['🌧️','גשם כבד'],71:['🌨️','שלג קל'],80:['🌦️','מטר'],95:['⛈️','סופת רעמים']};

/* ── ברירות מחדל ── */
const defaultTrip = (name='טיול חדש') => ({
  id:uid(),name,startDate:'',endDate:'',
  vehicle:{name:'הקרוון שלי',height:'',width:'',weight:'',plate:'',waterFillDate:'',wasteEmptyDate:'',waterLog:[],wasteLog:[]},
  days:[],expenses:[],interestBank:[],packingList:[],shoppingList:[],documents:[],generalNotes:'',quickNotes:[],
});
const defaultDay  = (date='') => ({id:uid(),date,location:'',coordinates:null,blocks:[],notes:'',summary:'',currentTime:'08:00',
  startLocation:'',startTime:'08:00',endLocation:'',endTime:'20:00',startPending:false});
const defaultBlock= (type='activity',start='09:00') => ({id:uid(),type,title:'',startTime:start,durationMins:60,location:'',notes:'',rating:0,isCompleted:false,cost:0});

/* ── שמירה מקומית ── */
const loadState = () => { try { return JSON.parse(localStorage.getItem('caravanCtrl_he')||'null'); } catch { return null; } };

/* ── GitHub ── */
const ghFetch = async (tok,user,repo,path,method='GET',body=null) => {
  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`,{
    method, headers:{Authorization:`token ${tok}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
    ...(body?{body:JSON.stringify(body)}:{})
  });
  if (!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||`HTTP ${res.status}`);}
  return res.json();
};
const ghSave = (tok,user,repo,path,data,sha=null) => ghFetch(tok,user,repo,path,'PUT',{message:`עדכון ${path}`,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),...(sha?{sha}:{})});
const ghLoad = async (tok,user,repo,path) => { const d=await ghFetch(tok,user,repo,path); return {content:JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))))),sha:d.sha}; };

/* ── Google Takeout parser ──
   תומך במספר פורמטים של Saved Places.json (גרסאות שונות של גוגל)
*/
const parseTakeoutFeatures = (data) => {
  // מצא את מערך הפריטים בכל מבנה אפשרי
  const features =
    (Array.isArray(data) ? data : null) ||
    data?.features ||
    data?.geometry?.geometries ||
    [];
  if (!features.length) return [];

  return features.map(f => {
    if (!f) return null;
    const p = f.properties || f; // תמיכה גם בפורמט שטוח ללא properties
    const loc = p.Location || p.location || {};
    const geo = loc['Geo Coordinates'] || loc.geoCoordinates || {};

    // שם — חיפוש בכל המפתחות האפשריים
    const name = (
      p.Title || p.title ||
      loc.Name || loc.name ||
      p.name || p.Name ||
      ''
    ).toString().trim();

    // כתובת
    const address = (
      loc.Address || loc.address ||
      p.address || p.Address ||
      ''
    ).toString().trim();

    // אתר / קישור
    const website = p.URL || p.url || p['Google Maps URL'] || '';

    // קואורדינטות: geometry.coordinates [lng,lat] (GeoJSON) או Geo Coordinates
    let lat = null, lng = null;
    const coords = f.geometry?.coordinates || f.coordinates;
    if (Array.isArray(coords) && coords.length >= 2) {
      const c0 = parseFloat(coords[0]), c1 = parseFloat(coords[1]);
      if (!isNaN(c0) && !isNaN(c1)) { lng = c0; lat = c1; }
    }
    if (lat === null && geo.Latitude) {
      const la = parseFloat(geo.Latitude), lo = parseFloat(geo.Longitude);
      if (!isNaN(la) && !isNaN(lo)) { lat = la; lng = lo; }
    }

    // סנן רק פריטים ריקים לגמרי — בלי שם, כתובת וקואורדינטות
    if (!name && !address && lat === null) return null;

    return {
      id: uid(),
      name: name || 'מקום ללא שם',
      address,
      lat,
      lng,
      website,
    };
  }).filter(Boolean);
};

/* ── Google Takeout CSV parser (תיקיית Saved — לבבות / Want to go / רשימות פרטיות) ──
   פורמט: Title,Note,URL[,Comment]   (ללא קואורדינטות — ניתן להעשיר אחרי ייבוא עם 🔍)
*/
const parseTakeoutCSV = text => {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  // פרסר CSV פשוט — תומך בשדות עם מרכאות ופסיקים פנימיים
  const parseRow = line => {
    const vals = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; } // escaped quote
        else inQ = !inQ;
      } else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += c;
    }
    vals.push(cur);
    return vals.map(v => v.trim());
  };
  const header = parseRow(lines[0]).map(h => h.toLowerCase().trim());
  // מיפוי כותרות — תמיכה בעברית ובאנגלית
  const findCol = (...names) => { for(const n of names){ const i=header.indexOf(n); if(i>=0) return i; } return -1; };
  const titleIdx = findCol('title','כותרת','שם','name');
  const noteIdx  = findCol('note','הערה','notes','תגובה','comment');
  const urlIdx   = findCol('url','כתובת אתר','website','link','קישור','google maps url');
  if (titleIdx === -1) return []; // לא נראה כקובץ Takeout
  // דלג על שורות ריקות לחלוטין (שורה 2 בקובצי גוגל בדרך כלל ריקה)
  return lines.slice(1).map(line => {
    if (!line.trim()||line.split(',').every(c=>!c.trim())) return null;
    const v = parseRow(line);
    const name    = (v[titleIdx] || '').trim();
    const note    = noteIdx  >= 0 ? (v[noteIdx]  || '').trim() : '';
    const website = urlIdx   >= 0 ? (v[urlIdx]   || '').trim() : '';
    if (!name) return null;
    return { id: uid(), name, address: '', lat: null, lng: null, website,
             notes: note, _noCoords: true };
  }).filter(Boolean);
};

  if(!_setToasts)return; const id=++_tid;

}

function TrackerBtn({label,date,color,warnDays,log,onSave}){
  const [open,setOpen]=useState(false);
  const [editDate,setEditDate]=useState('');
  const ref=useRef(null);
  const days=daysSince(date);
  const warn=days!==null&&days>=warnDays;

  // פתיחה → מאתחל את שדה התאריך לתאריך הנוכחי (או היום אם ריק)
  const openPopover=()=>{ setEditDate(date||todayISO()); setOpen(true); };

  // סגירה בלחיצה מחוץ לפופאובר
  useEffect(()=>{
    if(!open) return;
    const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',h);
    return ()=>document.removeEventListener('mousedown',h);
  },[open]);

  const save=(d)=>{
    if(!d) return;
    onSave(d);
    setOpen(false);
  };

  return <div ref={ref} style={{position:'relative'}}>
    {/* כפתור תצוגה */}
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,cursor:'pointer',minWidth:94,padding:'4px 6px',borderRadius:8,transition:'background .15s'}}
      onClick={openPopover}
      onMouseEnter={e=>e.currentTarget.style.background='rgba(255,255,255,0.06)'}
      onMouseLeave={e=>e.currentTarget.style.background=''}
      title="לחץ לעדכון / עריכה">
      <span style={{fontSize:10,color:'var(--text3)',fontWeight:600}}>{label}</span>
      <span style={{fontSize:12,fontWeight:700,color:warn?'#ef4444':color}}>
        {date?new Date(date).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'}):'לא עודכן'}
      </span>
      {days!==null
        ?<span style={{fontSize:10,color:warn?'#ef4444':'var(--text3)'}}>לפני {days} ימים{warn?' ⚠️':''}</span>
        :<span style={{fontSize:9,color:'var(--accent)'}}>לחץ לעדכון ✎</span>}
    </div>

    {/* פופאובר עריכה */}
    {open&&<div style={{
      position:'absolute',top:'calc(100% + 6px)',right:0,zIndex:600,
      background:'var(--bg2)',border:'1px solid var(--border)',
      borderRadius:12,padding:14,minWidth:230,boxShadow:'var(--shadow)',
      animation:'modalIn .15s ease'
    }}>
      <div style={{fontSize:12,fontWeight:700,color:'var(--text)',marginBottom:10}}>{label}</div>

      {/* בחירת תאריך */}
      <label className="label">בחר תאריך</label>
      <input type="date" className="input" value={editDate}
        onChange={e=>setEditDate(e.target.value)}
        style={{marginBottom:8}}/>

      <div style={{display:'flex',gap:6,marginBottom:12}}>
        <button className="btn btn-primary btn-sm" style={{flex:1}}
          onClick={()=>save(editDate)}>✓ שמור</button>
        <button className="btn btn-secondary btn-sm"
          onClick={()=>{const t=todayISO();setEditDate(t);save(t);}}>📅 היום</button>
      </div>

      {/* היסטוריה */}
      {log?.length>0&&<>
        <div style={{fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>היסטוריה</div>
        <div style={{display:'flex',flexDirection:'column',gap:3,maxHeight:140,overflowY:'auto'}}>
          {[...log].reverse().map((entry,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
              fontSize:11,color:i===0?color:'var(--text2)',padding:'3px 6px',
              background:i===0?`${color}18`:'var(--surface)',borderRadius:6}}>
              <span>{new Date(entry).toLocaleDateString('he-IL',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'})}</span>
              {i===0&&<span style={{fontSize:9,color}}>אחרון</span>}
            </div>
          ))}
        </div>
      </>}
    </div>}
  </div>;
}

function VehicleHeader({trip,theme,syncStatus,hasGh,hasFb,onThemeToggle,onUpdate,onGoSettings}){
  const v=trip?.vehicle||{};
  const hasSync=hasGh||hasFb;
  const syncLabel=hasFb?'Firebase':hasGh?'גיטהאב':'';
  const syncIcon=hasSync
    ?syncStatus==='syncing'?{i:'🔄',c:'var(--amber)',t:`מסנכרן עם ${syncLabel}...`}
    :syncStatus==='synced' ?{i:'☁️',c:'var(--green)',t:`מסונכרן עם ${syncLabel} ✓`}
    :syncStatus==='error'  ?{i:'⚠️',c:'var(--red)',  t:'שגיאת סנכרון — עבור לחיבוריות 🔗'}
    :{i:'☁️',c:'var(--text3)',t:'ממתין לסנכרון...'}
    :{i:'🔴',c:'var(--red)',t:'סנכרון לא מוגדר — לחץ להגדרה'};

  const saveTracker=(dateKey,logKey,newDate)=>{
    if(!trip) return;
    const oldDate=v[dateKey]||'';
    // מוסיף לרקורד רק אם התאריך השתנה

      ?[...(v[logKey]||[]),newDate]
      :(v[logKey]||[]);
    onUpdate({...trip,vehicle:{...trip.vehicle,[dateKey]:newDate,[logKey]:newLog}});
  };

  return <div className="vehicle-banner">
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:24}}>🚐</span>
      <div>
        <div style={{fontSize:13,fontWeight:700}}>{v.name||'הקרוון שלי'}</div>
        <div style={{fontSize:11,color:'var(--text3)'}}>{[v.height&&`גובה:${v.height}מ`,v.width&&`רוחב:${v.width}מ`,v.plate].filter(Boolean).join(' · ')||'לא הוגדרו מידות'}</div>
      </div>
    </div>
    <div style={{display:'flex',gap:14,flex:1,justifyContent:'center',flexWrap:'wrap',alignItems:'center'}}>
      <TrackerBtn label="💧 מולאו מים" date={v.waterFillDate} color="#4f8ef7" warnDays={3}
        log={v.waterLog||[]} onSave={d=>saveTracker('waterFillDate','waterLog',d)}/>
      <TrackerBtn label="🪣 רוקן קקי" date={v.wasteEmptyDate} color="#f59e0b" warnDays={4}
        log={v.wasteLog||[]} onSave={d=>saveTracker('wasteEmptyDate','wasteLog',d)}/>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginRight:'auto'}}>
      {trip&&<div style={{fontSize:12,color:'var(--text2)',textAlign:'right'}}>
        <div style={{fontWeight:600}}>{trip.name}</div>
        <div style={{color:'var(--text3)'}}>{trip.startDate||'—'} ← {trip.endDate||'—'}</div>
      </div>}
      <span title={syncIcon.t} onClick={!hasSync?onGoSettings:undefined}
        style={{fontSize:14,cursor:hasSync?'default':'pointer',userSelect:'none',color:syncIcon.c,
        animation:syncStatus==='syncing'?'spin 1s linear infinite':''}}>{syncIcon.i}</span>
      <button className="btn btn-secondary btn-icon btn-sm" onClick={onThemeToggle}>{theme==='dark'?'☀️':'🌙'}</button>
      <span style={{fontSize:10,color:'var(--text3)',fontWeight:600,letterSpacing:'0.03em',userSelect:'none',opacity:.7}}>{APP_VERSION}</span>
    </div>
  </div>;
}

function MapView({mapsKey,trip,onAddToBank,onAddToDay,highlightDay,highlightItem}){
  const mapRef=useRef(null), mapInst=useRef(null), markers=useRef([]);
  const hlDayMarkers=useRef([]), hlItemMarker=useRef(null);
  const [ready,setReady]=useState(false);
  const [wxOpen,setWxOpen]=useState(false);
  const [wxCity,setWxCity]=useState('');
  const [wxData,setWxData]=useState(null);
  const [wxLabel,setWxLabel]=useState('');
  const [wxLoading,setWxLoading]=useState(false);
  const searchBoxRef=useRef(null);
  // refs כדי שהפונקציות הגלובליות תמיד יקבלו את הנתונים העדכניים
  const tripRef=useRef(trip);
  const onAddToBankRef=useRef(onAddToBank);
  const onAddToDayRef=useRef(onAddToDay);
  const mapsKeyRef=useRef(mapsKey);
  useEffect(()=>{tripRef.current=trip;},[trip]);
  useEffect(()=>{onAddToBankRef.current=onAddToBank;},[onAddToBank]);
  useEffect(()=>{onAddToDayRef.current=onAddToDay;},[onAddToDay]);
  useEffect(()=>{mapsKeyRef.current=mapsKey;},[mapsKey]);

  useEffect(()=>{
    if (!mapsKey) return;
    if (window.google?.maps){setReady(true);return;}
    if (document.getElementById('gmaps-script')) return;
    window.__gmapsReady=()=>setReady(true);
    const s=document.createElement('script');
    s.id='gmaps-script';
    s.src=`https://maps.googleapis.com/maps/api/js?key=${mapsKey}&libraries=places&language=he&region=IL&callback=__gmapsReady`;
    s.async=true;
    s.onerror=()=>toast('נכשל טעינת מפות גוגל — בדוק את מפתח ה-API','error');
    document.head.appendChild(s);
  },[mapsKey]);

  useEffect(()=>{
    if (!ready||!mapRef.current||mapInst.current) return;
    const map=new window.google.maps.Map(mapRef.current,{
      center:{lat:32.0853,lng:34.7818}, zoom:14,
      mapTypeControl:true, streetViewControl:true, fullscreenControl:true,
      clickableIcons:true,
      styles:[
        {featureType:'poi',elementType:'labels',stylers:[{visibility:'on'}]},
        {featureType:'poi.business',elementType:'labels',stylers:[{visibility:'on'}]},
        {featureType:'poi.attraction',elementType:'labels',stylers:[{visibility:'on'}]},
        {featureType:'transit',elementType:'labels',stylers:[{visibility:'on'}]},
      ],
    });
    mapInst.current=map;
    window.__gmFocus=(lat,lng,zoom=17)=>{ map.panTo({lat,lng}); map.setZoom(zoom); };

    // ResizeObserver — מפעיל resize כשהמיכל חוזר להיות גלוי (סלולר: מעבר בין תצוגות)
    if(window.ResizeObserver&&mapRef.current){
      const ro=new ResizeObserver(()=>{
        if(mapRef.current?.offsetWidth>0&&mapRef.current?.offsetHeight>0){
          window.google.maps.event.trigger(map,'resize');
        }
      });
      ro.observe(mapRef.current);
    }

    // חיפוש — שלוש שכבות: Places API → Nominatim (OpenStreetMap) → Geocoder
    const input=document.getElementById('map-search-input');
    const searchSvc=new window.google.maps.places.PlacesService(map);
    const geocoder=new window.google.maps.Geocoder();

    const nominatimSearch=async(q)=>{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=4&accept-language=he`,{headers:{'Accept-Language':'he'}});
      return r.json();
    };
    const nominatimReverse=async(lat,lng)=>{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=he`,{headers:{'Accept-Language':'he'}});
      return r.json();
    };
    const panToNominatim=(results)=>{
      if (!results?.length) return false;
      const first=results[0];
      const bb=first.boundingbox;
      if (bb){
        map.fitBounds(new window.google.maps.LatLngBounds(
          {lat:parseFloat(bb[0]),lng:parseFloat(bb[2])},
          {lat:parseFloat(bb[1]),lng:parseFloat(bb[3])}
        ));
      } else {
        map.setCenter({lat:parseFloat(first.lat),lng:parseFloat(first.lon)});
        map.setZoom(16);
      }
      return true;
    };

    if (input){
      const doSearch=async()=>{
        const q=input.value.trim(); if (!q) return;
        // 1. Places textSearch
        const placesOk=await new Promise(res=>{
          searchSvc.textSearch({query:q,language:'he'},(results,status)=>{
            if (status===window.google.maps.places.PlacesServiceStatus.OK&&results?.length){
              const bounds=new window.google.maps.LatLngBounds();
              results.slice(0,6).forEach(p=>{
                if (p.geometry?.viewport) bounds.union(p.geometry.viewport);
                else if (p.geometry?.location) bounds.extend(p.geometry.location);
              });
              map.fitBounds(bounds);
              if (results.length===1) map.setZoom(17);
              res(true);
            } else { res(false); }
          });
        });
        if (placesOk) return;
        // 2. Nominatim — מוצא חופים, פארקים, מסעדות, ערים
        try{
          const nRes=await nominatimSearch(q);
          if (panToNominatim(nRes)) return;
        }catch{}
        // 3. Google Geocoder — כתובות
        geocoder.geocode({address:q,language:'he'},(gr,gs)=>{
          if (gs==='OK'&&gr[0]){
            const loc=gr[0].geometry;
            if (loc.viewport) map.fitBounds(loc.viewport);
            else { map.setCenter(loc.location); map.setZoom(15); }
          } else { toast('מקום לא נמצא — נסה שם ספציפי יותר','error'); }
        });
      };
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();doSearch();} });
      window.__gmSearch=doSearch;
    }

    // InfoWindow גלובלי
    const iwPlace={};
    const iw=new window.google.maps.InfoWindow({maxWidth:320});

    const buildIwContent=(p)=>{
      const days=tripRef.current?.days||[];
      const daysHtml=days.length>0
        ? days.map((d,i)=>`<option value="${d.id}">יום ${i+1}${d.location?' — '+d.location:''}${d.date?' ('+d.date+')':''}</option>`).join('')
        : '<option disabled>אין ימים בלוח הזמנים</option>';
      const price=p.priceLevel?'₪'.repeat(p.priceLevel):'';
      const starsHtml=p.rating?`${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5-Math.round(p.rating))}`:'';
      const reviewsHtml=(p.reviews||[]).slice(0,2).map(r=>`
        <div style="background:#f9f9f9;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11px;color:#444;line-height:1.4;direction:rtl">
          <span style="color:#f59e0b;font-size:11px">${'★'.repeat(r.rating||0)}</span>
          <span style="color:#999;margin-right:4px">${r.author_name||''}</span><br/>
          ${(r.text||'').slice(0,120)}${(r.text||'').length>120?'…':''}
        </div>`).join('');
      return `<div style="font-family:Heebo,Arial,sans-serif;direction:rtl;text-align:right;padding:6px;min-width:240px;max-width:310px">
        ${p.photoUrl?`<img src="${p.photoUrl}" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:10px;display:block"/>`:''}
        <input id="gm-name-edit" value="${(p.name||'').replace(/"/g,'&quot;')}"
          style="width:100%;border:1px solid #ddd;border-radius:6px;padding:5px 8px;font-size:14px;font-weight:700;font-family:Heebo,Arial,sans-serif;direction:rtl;color:#111;margin-bottom:3px;box-sizing:border-box"/>
        <div style="font-size:11px;color:#888;margin-bottom:6px;line-height:1.4">${p.address}</div>
        ${p._noGoogle?`<div style="font-size:10px;color:#f59e0b;background:#fffbeb;border-radius:5px;padding:4px 7px;margin-bottom:6px">⚠️ פרטים מלאים דורשים <a href="https://console.cloud.google.com/billing" target="_blank" style="color:#d97706">Billing Account</a> ב-Google Cloud</div>`:''}
        ${p.rating?`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">
          <span style="color:#f59e0b;font-size:14px">${starsHtml}</span>
          <span style="font-size:12px;font-weight:600;color:#333">${p.rating}</span>
          ${p.userRatingsTotal?`<span style="font-size:11px;color:#888">(${p.userRatingsTotal.toLocaleString()} ביקורות)</span>`:''}
          ${price?`<span style="font-size:11px;color:#22c55e;font-weight:700">${price}</span>`:''}
        </div>`:''}
        ${p.openStatus?`<div style="font-size:12px;font-weight:600;margin-bottom:4px;${p.openStatus==='פתוח עכשיו'?'color:#22c55e':'color:#ef4444'}">${p.openStatus==='פתוח עכשיו'?'✅':'🔴'} ${p.openStatus}</div>`:''}
        ${p.todayHours?`<div style="font-size:11px;color:#555;margin-bottom:6px">🕐 ${p.todayHours}</div>`:''}
        ${p.phone?`<div style="font-size:11px;color:#4f8ef7;margin-bottom:4px">📞 ${p.phone}</div>`:''}
        ${p.website?`<a href="${p.website}" target="_blank" rel="noreferrer" style="font-size:11px;color:#4f8ef7;display:block;margin-bottom:8px;word-break:break-all">🌐 ${p.website.replace(/^https?:\/\//,'').split('/')[0]}</a>`:''}
        ${reviewsHtml?`<div style="margin-bottom:8px">${reviewsHtml}</div>`:''}
        ${p.allHours?`<details style="margin-bottom:8px;font-size:11px;color:#555"><summary style="cursor:pointer;font-weight:600">🕐 שעות פעילות</summary><div style="margin-top:4px;line-height:1.8">${p.allHours}</div></details>`:''}
        ${p.placeId?`<a href="https://www.google.com/maps/place/?q=place_id:${p.placeId}" target="_blank" rel="noreferrer"
          style="display:block;text-align:center;padding:7px;background:#e8f0fe;border-radius:7px;color:#1a73e8;font-size:12px;font-weight:600;text-decoration:none;margin-bottom:8px">
          🗺️ פתח בגוגל מפות לפרטים מלאים ↗
        </a>`:''}
        <hr style="border:none;border-top:1px solid #eee;margin:8px 0"/>
        <button onclick="window.__gmBank()"
          style="background:#f59e0b;color:#fff;border:none;border-radius:7px;padding:8px 0;font-size:13px;cursor:pointer;width:100%;margin-bottom:8px;font-family:Heebo,Arial,sans-serif;font-weight:600">
          🌟 שמור לבנק האטרקציות
        </button>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="gm-day-sel" style="flex:1;border:1px solid #ccc;border-radius:7px;padding:7px 8px;font-size:12px;font-family:Heebo,Arial,sans-serif;direction:rtl">
            <option value="">➕ הוסף ליום...</option>
            ${daysHtml}
          </select>
          <button onclick="window.__gmDay()"
            style="background:#4f8ef7;color:#fff;border:none;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:Heebo,Arial,sans-serif;font-weight:600;white-space:nowrap">
            הוסף
          </button>
        </div>
      </div>`;
    };

    // חשיפת globals לשימוש ב-markers effect
    window.__gmIw=iw;
    window.__gmIwPlace=iwPlace;
    window.__gmBuild=buildIwContent;

    window.__gmBank=()=>{
      if (!iwPlace.data) return;
      const p=iwPlace.data;
      const nameEl=document.getElementById('gm-name-edit');
      const name=nameEl?.value?.trim()||p.name;
      onAddToBankRef.current({name,address:p.address,lat:p.lat,lng:p.lng,placeId:p.placeId,
        rating:p.rating,userRatingsTotal:p.userRatingsTotal,openStatus:p.openStatus,
        todayHours:p.todayHours,allHours:p.allHours,phone:p.phone,website:p.website,photoUrl:p.photoUrl,placeType:p.placeType||''});
      iw.close();
      toast(`"${name}" נוסף לבנק האטרקציות`,'success');
    };
    window.__gmDay=()=>{
      const sel=document.getElementById('gm-day-sel');
      if (!sel||!sel.value||!iwPlace.data) return;
      const p=iwPlace.data;
      const nameEl=document.getElementById('gm-name-edit');
      const name=nameEl?.value?.trim()||p.name;
      onAddToDayRef.current(sel.value,{name,address:p.address,lat:p.lat,lng:p.lng,placeId:p.placeId,
        rating:p.rating,userRatingsTotal:p.userRatingsTotal,openStatus:p.openStatus,
        todayHours:p.todayHours,allHours:p.allHours,phone:p.phone,website:p.website,photoUrl:p.photoUrl,placeType:p.placeType||''});
      iw.close();
      toast(`"${name}" נוסף ליום`,'success');
    };

    map.addListener('click',async e=>{
      if (!e.placeId) return;
      e.stop();
      const placeId=e.placeId;
      const lat0=e.latLng.lat(), lng0=e.latLng.lng();
      iwPlace.data={name:'טוען...',address:'',lat:lat0,lng:lng0,placeId};
      iw.setContent('<div style="padding:16px;font-family:Heebo,sans-serif;direction:rtl;font-size:13px;color:#555">⏳ טוען פרטי מקום...</div>');
      iw.setPosition(e.latLng);
      iw.open(map);

      const svc=new window.google.maps.places.PlacesService(map);
      const OK_ST=window.google.maps.places.PlacesServiceStatus.OK;
      const dow=new Date().getDay(), wdIdx=dow===0?6:dow-1;

      /* ── מקור 1: Legacy Places API שדות בסיסיים ── */
      const legacyBasic=()=>new Promise(res=>{
        svc.getDetails({placeId,fields:['name','formatted_address','geometry','photos','place_id','types']},
          (p,st)=>{console.log('[DEBUG] legacyBasic:',st,p?.name);res(st===OK_ST&&p?p:null);});
      });

      /* ── מקור 2: Legacy Places API שדות בתשלום ── */
      const legacyRich=(geo)=>new Promise(res=>{
        svc.getDetails({placeId,fields:['rating','opening_hours','reviews','website','formatted_phone_number','user_ratings_total','price_level']},
          (p,st)=>{console.log('[DEBUG] legacyRich:',st,'rating=',p?.rating,'hours=',!!p?.opening_hours);res(st===OK_ST&&p?{...p,geometry:geo}:null);});
      });

      /* ── מקור 3: Google Geocoder עם placeId (חינמי, מזהה מדויק) ── */
      const geocoderLookup=()=>new Promise(res=>{
        geocoder.geocode({placeId,language:'he'},(results,status)=>{
          console.log('[DEBUG] geocoder status:',status,results?.[0]?.formatted_address||'no addr');
          if(status!=='OK'||!results?.[0]){res(null);return;}
          const comps=results[0].address_components||[];
          const addr=results[0].formatted_address||'';
          const loc=results[0].geometry?.location;
          // point_of_interest הוא הסוג הנפוץ ביותר ל-POI בגוגל
          const poiTypes=['establishment','point_of_interest','natural_feature',
            'tourist_attraction','park','airport','premise','colloquial_area',
            'shopping_mall','restaurant','food','store','lodging','transit_station',
            'zoo','amusement_park','aquarium','stadium','museum','school','university'];
          const poiComp=comps.find(c=>c.types.some(t=>poiTypes.includes(t)));
          // אם הרכיב הראשון הוא רחוב/כתובת → formatted_address מתחיל בכתובת, לא בשם
          const firstIsStreet=comps[0]?.types.some(t=>['route','street_address','intersection'].includes(t));
          const hasStreetNum=comps.some(c=>c.types.includes('street_number'));
          const fromAddr=(!firstIsStreet&&!hasStreetNum)?addr.split(',')[0]?.trim():'';
          const name=poiComp?.long_name||fromAddr||'';
          res({name,address:addr,lat:loc?.lat()||lat0,lng:loc?.lng()||lng0});
        });
      });

      /* ── מקור 4: Places API v1 (New REST) — שם + פרטים מלאים ── */
      const placesV1=async()=>{
        const key=mapsKeyRef.current; if(!key) return null;
        try{
          const r=await fetch(
            `https://places.googleapis.com/v1/places/${placeId}?languageCode=he&key=${key}`,
            {headers:{'X-Goog-FieldMask':'displayName,formattedAddress,rating,currentOpeningHours,regularOpeningHours,websiteUri,nationalPhoneNumber,userRatingCount,priceLevel,reviews,types','Accept-Language':'he'}}
          );
          if(!r.ok){const e=await r.json().catch(()=>({}));console.error('[DEBUG] placesV1 failed',r.status,e?.error?.message||e);return null;}
          const d=await r.json();
          const lvl={'PRICE_LEVEL_INEXPENSIVE':1,'PRICE_LEVEL_MODERATE':2,'PRICE_LEVEL_EXPENSIVE':3,'PRICE_LEVEL_VERY_EXPENSIVE':4};
          const ohArr=d.currentOpeningHours?.weekdayDescriptions||d.regularOpeningHours?.weekdayDescriptions||[];
          return{
            name:d.displayName?.text||null,
            address:d.formattedAddress||null,
            rating:d.rating||null,
            userRatingsTotal:d.userRatingCount||null,
            openStatus:d.currentOpeningHours?.openNow===true?'פתוח עכשיו':d.currentOpeningHours?.openNow===false?'סגור עכשיו':'',
            todayHours:ohArr[wdIdx]?.replace(/^[^:]+:\s*/,'')||'',
            allHours:ohArr.join('<br/>'),
            priceLevel:lvl[d.priceLevel]??null,
            phone:d.nationalPhoneNumber||'',
            website:d.websiteUri||'',
            reviews:(d.reviews||[]).slice(0,2).map(rv=>({author_name:rv.authorAttribution?.displayName||'',rating:rv.rating||0,text:rv.text?.text||''})),
            types:d.types||[],
          };
        }catch{return null;}
      };

      /* ── מקור 5: Nominatim — גיבוי אחרון לשם בלבד ── */
      const nominatimLookup=async()=>{
        try{
          // מנסה שני zoom: 18 לבניין/עסק ספציפי, 16 לאזור/POI גדול (נמל, קניון, פארק)
          const [r18,r16]=await Promise.all([
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat0}&lon=${lng0}&format=json&zoom=18&namedetails=1&extratags=1&accept-language=he`,{headers:{'Accept-Language':'he'}}),
            fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat0}&lon=${lng0}&format=json&zoom=16&namedetails=1&accept-language=he`,{headers:{'Accept-Language':'he'}}),
          ]);
          const [d18,d16]=await Promise.all([r18.json(),r16.json()]);
          const pickName=(d)=>{
            const isRoad=d.class==='highway'||d.type==='road'||d.type==='residential'||d.type==='service';
            const poi=d.namedetails?.['name:he']||d.namedetails?.name||(!isRoad?d.name:'')||'';
            const cat=d.address?.tourism||d.address?.amenity||d.address?.leisure||d.address?.natural||d.address?.historic||d.address?.shop||'';
            return poi||cat||'';
          };
          const n18=pickName(d18), n16=pickName(d16);
          // מעדיף zoom 18 אם יש שם, אחרת zoom 16
          const name=n18||n16||null;
          const parts=[d18.address?.road,d18.address?.city||d18.address?.town||d18.address?.village].filter(Boolean);
          const address=parts.join(', ')||d18.display_name?.split(',').slice(0,2).join(',')||'';
          return{name,address};
        }catch{return null;}
      };

      // בודק אם מחרוזת נראית כמו כתובת רחוב (ולא שם מקום)
      const isStreetAddr=s=>/^\d|.*\s\d+$|^דרך\s|^רחוב\s|^שדרות\s|^הרחוב\s|^St\s|^Rd\s|^Ave\s/i.test(s?.trim()||'');

      try{
        // מריץ מקורות מבוססי placeId במקביל (Overpass הוסר — מחזיר מקומות ליד ולא את המקום המדויק)
        const [basic, geo, v1]=await Promise.all([legacyBasic(), geocoderLookup(), placesV1()]);

        // שדות בתשלום של Legacy (רק אם basic הצליח)
        const rich=basic?await legacyRich(basic.geometry):null;

        // ── בוחר שם: v1 > legacy > geocoder(poi/fromAddr) ──
        let name=v1?.name||basic?.name||geo?.name||'';
        let address=v1?.address||basic?.formatted_address||geo?.address||'';
        let lat=basic?.geometry?.location?.lat()||geo?.lat||lat0;
        let lng=basic?.geometry?.location?.lng()||geo?.lng||lng0;

        if(!name){
          const fromAddr=(address||'').split(',')[0]?.trim()||'';
          if(fromAddr&&!isStreetAddr(fromAddr)){
            name=fromAddr;
          } else {
            const nom=await nominatimLookup();
            const nomName=nom?.name||'';
            if(nom?.address&&!address) address=nom.address;
            // גם אם אין שם POI — ניסה להשתמש בחלק הראשון של הכתובת מ-Nominatim
            const nomFromAddr=(nom?.address||address||'').split(',')[0]?.trim()||'';
            name=nomName&&!isStreetAddr(nomName)?nomName
                :fromAddr&&!isStreetAddr(fromAddr)?fromAddr
                :nomFromAddr?nomFromAddr
                :'מקום';
          }
        }

        // ── בוחר פרטים: v1 > rich legacy ──
        let details={};
        if(v1){
          details={rating:v1.rating,userRatingsTotal:v1.userRatingsTotal,openStatus:v1.openStatus,todayHours:v1.todayHours,allHours:v1.allHours,priceLevel:v1.priceLevel,phone:v1.phone,website:v1.website,reviews:v1.reviews};
        } else if(rich){
          let openStatus='';
          try{openStatus=rich.opening_hours?.isOpen()?'פתוח עכשיו':'סגור עכשיו';}catch{}
          details={
            rating:rich.rating,userRatingsTotal:rich.user_ratings_total,openStatus,
            todayHours:rich.opening_hours?.weekday_text?.[wdIdx]?.replace(/^[^:]+:\s*/,'')||'',
            allHours:(rich.opening_hours?.weekday_text||[]).join('<br/>'),
            priceLevel:rich.price_level,phone:rich.formatted_phone_number||'',
            website:rich.website||'',reviews:rich.reviews||[],
          };
        }

        const photoUrl=basic?.photos?.[0]?.getUrl({maxWidth:300,maxHeight:110})||'';
        const _noGoogle=!v1&&!basic&&!geo;
        const placeType=getPlaceTypeLabel(v1?.types||basic?.types||[]);
        iwPlace.data={name,address,lat,lng,placeId,photoUrl,placeType,
          rating:details.rating||null,
          userRatingsTotal:details.userRatingsTotal||null,
          openStatus:details.openStatus||'',
          todayHours:details.todayHours||'',
          allHours:details.allHours||'',
          phone:details.phone||'',
          website:details.website||'',
          reviews:details.reviews||[],
        };
        iw.setContent(buildIwContent({name,address,lat,lng,placeId,photoUrl,...details,_noGoogle}));
      }catch(err){
        iwPlace.data={name:'מקום',address:'',lat:lat0,lng:lng0,placeId};
        iw.setContent(buildIwContent({name:'מקום',address:'',lat:lat0,lng:lng0,placeId}));
      }
    });
  },[ready]);

  // סמנים על המפה
  useEffect(()=>{
    if (!mapInst.current) return;
    markers.current.forEach(m=>m.setMap(null)); markers.current=[];
    if (!trip) return;
    const iw=window.__gmIw, build=window.__gmBuild, iwPlace=window.__gmIwPlace;

    trip.days.forEach((day,i)=>{
      const color=DAY_COLORS[i%DAY_COLORS.length];
      // סמן מיקום יום — עיגול גדול עם מספר
      if (day.coordinates){
        const m=new window.google.maps.Marker({
          position:{lat:day.coordinates.lat,lng:day.coordinates.lng},
          map:mapInst.current,
          label:{text:String(i+1),color:'#fff',fontSize:'12px',fontWeight:'bold'},
          title:day.location||`יום ${i+1}`,
          icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:14,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:2},
          zIndex:10,
        });
        markers.current.push(m);
      }
      // סמני פעילויות — עיגול ממוספר בצבע היום
      const sortedBlocks=[...(day.blocks||[])].sort((a,b)=>a.startTime.localeCompare(b.startTime));
      sortedBlocks.forEach((block,blockIdx)=>{
        if (!block.lat||!block.lng) return;
        const bm=new window.google.maps.Marker({
          position:{lat:block.lat,lng:block.lng},
          map:mapInst.current,
          title:block.title||'',
          label:{text:String(blockIdx+1),color:'#fff',fontSize:'10px',fontWeight:'bold'},
          icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:10,fillColor:color,fillOpacity:0.9,strokeColor:'#fff',strokeWeight:1.5},
          zIndex:5,
        });
        if (iw&&build&&iwPlace){
          bm.addListener('click',()=>{
            iwPlace.data={name:block.title||'פעילות',address:block.location||'',lat:block.lat,lng:block.lng,placeId:null};
            iw.setContent(build({name:block.title||'פעילות',address:block.location||'',lat:block.lat,lng:block.lng}));
            iw.setPosition({lat:block.lat,lng:block.lng});
            iw.open(mapInst.current);
          });
        }
        markers.current.push(bm);
      });
    });

    // סמני בנק אטרקציות — צבע וסמל לפי מקור הרשימה
    // נתיב SVG של מזוודה: גוף + ידית עליונה + רצועה אמצעית
    const SUITCASE_PATH='M-7,-2 L-7,7 L7,7 L7,-2 Z M-3,-2 L-3,-7 L3,-7 L3,-2 Z M-5,2 L5,2';
    const BANK_ICON={
      liked:    {color:'#ec4899',label:'♥',scale:9},   // ❤️ מועדפים
      wantToGo: {color:'#22c55e',label:'⚑',scale:9},   // 🏴 רוצה להגיע
      saved:    {color:'#f59e0b',label:'★',scale:8},   // ⭐ מקומות שמורים
      list:     {color:'#6366f1',label:'♦',scale:8},   // 📋 רשימה
      itinerary:{color:'#16a34a',label:'',  scale:1, svgPath:SUITCASE_PATH}, // 🧳 תוכנית נסיעה — ירוק + מזוודה
    };
    const TITLE_EMOJI={liked:'❤️',wantToGo:'🏴',saved:'⭐',list:'📋',itinerary:'🧳'};
    trip.interestBank.forEach(item=>{
      if (!item.lat) return;
      const ic=BANK_ICON[item._listSource]||BANK_ICON.saved;
      const iconSpec=ic.svgPath
        ? {path:ic.svgPath,fillColor:ic.color,fillOpacity:0.95,strokeColor:'#fff',strokeWeight:1.5,scale:1}
        : {path:window.google.maps.SymbolPath.CIRCLE,scale:ic.scale,fillColor:ic.color,fillOpacity:0.95,strokeColor:'#fff',strokeWeight:1.5};
      const m=new window.google.maps.Marker({
        position:{lat:item.lat,lng:item.lng},
        map:mapInst.current,
        title:`${TITLE_EMOJI[item._listSource]||'📍'} ${item.name}`,
        ...(ic.label?{label:{text:ic.label,color:'#fff',fontSize:'11px',fontWeight:'bold'}}:{}),
        icon:iconSpec,
        zIndex:3,
      });
      if (iw&&build&&iwPlace){
        m.addListener('click',()=>{
          iwPlace.data={name:item.name,address:item.address||'',lat:item.lat,lng:item.lng,placeId:null};
          iw.setContent(build({name:item.name,address:item.address||'',lat:item.lat,lng:item.lng}));
          iw.setPosition({lat:item.lat,lng:item.lng});
          iw.open(mapInst.current);
        });
      }
      markers.current.push(m);
    });
  },[trip,ready]);

  // הדגשת יום שלם — סמנים ממוספרים גדולים
  useEffect(()=>{
    hlDayMarkers.current.forEach(m=>m.setMap(null)); hlDayMarkers.current=[];
    if (!highlightDay||!mapInst.current||!window.google?.maps) return;
    const color=DAY_COLORS[highlightDay.dayIndex%DAY_COLORS.length];
    const validBlocks=[...highlightDay.blocks]
      .filter(b=>b.lat&&b.lng)
      .sort((a,b)=>a.startTime.localeCompare(b.startTime));
    if (validBlocks.length===0) return;
    const bounds=new window.google.maps.LatLngBounds();
    validBlocks.forEach((block,i)=>{
      const m=new window.google.maps.Marker({
        position:{lat:block.lat,lng:block.lng},
        map:mapInst.current,
        label:{text:String(i+1),color:'#fff',fontSize:'13px',fontWeight:'bold'},
        icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:18,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:3},
        title:`${i+1}. ${block.title||''}`,
        zIndex:100,
      });
      bounds.extend({lat:block.lat,lng:block.lng});
      hlDayMarkers.current.push(m);
    });
    if (validBlocks.length===1){
      mapInst.current.panTo({lat:validBlocks[0].lat,lng:validBlocks[0].lng});
      mapInst.current.setZoom(15);
    } else {
      mapInst.current.fitBounds(bounds,{top:60,right:60,bottom:60,left:60});
    }
  },[highlightDay]);

  // הדגשת פריט בודד — סיכה אדומה רגילה מנפנפת
  useEffect(()=>{
    if (hlItemMarker.current){hlItemMarker.current.setMap(null);hlItemMarker.current=null;}
    if (!highlightItem||!mapInst.current||!window.google?.maps) return;
    const m=new window.google.maps.Marker({
      position:{lat:highlightItem.lat,lng:highlightItem.lng},
      map:mapInst.current,
      title:highlightItem.name||'',
      // ללא icon מותאם = סיכה אדומה ברירת מחדל של גוגל מפות
      animation:window.google.maps.Animation.BOUNCE,
      zIndex:200,
    });
    setTimeout(()=>{if(m.getMap())m.setAnimation(null);},1800);
    mapInst.current.panTo({lat:highlightItem.lat,lng:highlightItem.lng});
    if (mapInst.current.getZoom()<15) mapInst.current.setZoom(15);
    hlItemMarker.current=m;
  },[highlightItem]);

  if (!mapsKey) return (
    <div className="empty-state" style={{height:'100%',background:'var(--bg)'}}>
      <div className="emoji">🗺️</div>
      <div style={{fontWeight:600,color:'var(--text)'}}>מפות גוגל לא מוגדרות</div>
      <p>עבור להגדרות ⚙️ והזן מפתח API של גוגל מפות.</p>
    </div>
  );

  const fetchWxByCity=async(cityQ)=>{
    const q=(cityQ||wxCity).trim(); if (!q) return;
    setWxLoading(true);
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=he&format=json`);
      const d=await r.json();
      const loc=d.results?.[0]; if (!loc){toast('עיר לא נמצאה','error');return;}
      const w=await fetchWeather(loc.latitude,loc.longitude);
      setWxData(w); setWxLabel(loc.name||q);
    }catch{toast('שגיאה בטעינת מזג אוויר','error');}
    finally{setWxLoading(false);}
  };

  const WMO_MAP={0:['☀️','בהיר'],1:['🌤️','בהיר בעיקר'],2:['⛅','מעונן חלקית'],3:['☁️','מעונן'],45:['🌫️','ערפל'],48:['🌫️','ערפל'],51:['🌦️','טפטוף קל'],53:['🌦️','טפטוף'],55:['🌧️','טפטוף כבד'],61:['🌧️','גשם קל'],63:['🌧️','גשם'],65:['🌧️','גשם כבד'],71:['🌨️','שלג קל'],73:['🌨️','שלג'],75:['❄️','שלג כבד'],80:['🌦️','מקלחות'],95:['⛈️','סערה'],96:['⛈️','סערה עם ברד'],99:['⛈️','סערה חזקה']};

  return <div style={{height:'100%',width:'100%',position:'relative',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',display:'flex',gap:6,alignItems:'center'}}>
      <input id="map-search-input" className="input" placeholder="🔍 חפש מקום, עיר, אטרקציה… (Enter)" style={{fontSize:13,flex:1}}/>
      <button className="btn btn-secondary btn-sm" onClick={()=>window.__gmSearch?.()}>חפש</button>
      <button className="btn btn-secondary btn-sm" title="מזג אוויר" onClick={()=>setWxOpen(o=>!o)}
        style={{background:wxOpen?'var(--accent)':undefined,color:wxOpen?'#fff':undefined}}>🌤️</button>
    </div>
    {wxOpen&&<div style={{background:'var(--bg2)',borderBottom:'1px solid var(--border)',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <input className="input" style={{flex:1,fontSize:12}} value={wxCity} onChange={e=>setWxCity(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&fetchWxByCity()}
          placeholder="הקלד עיר — אילת, תל אביב, פריז…"/>
        <button className="btn btn-primary btn-sm" onClick={()=>fetchWxByCity()} disabled={wxLoading||!wxCity.trim()}>
          {wxLoading?'⏳':'חפש'}
        </button>
        {trip?.days?.find(d=>d.coordinates)&&<button className="btn btn-secondary btn-sm" title="מיקום יום ראשון"
          onClick={async()=>{
            const day=trip.days.find(d=>d.coordinates);
            if (!day) return;
            setWxLoading(true);
            try{const w=await fetchWeather(day.coordinates.lat,day.coordinates.lng);setWxData(w);setWxLabel(day.location||`יום 1`);}
            catch{}finally{setWxLoading(false);}
          }}>📍 יום ראשון</button>}
      </div>
      {wxData&&(()=>{
        const code=wxData.current_weather?.weathercode;
        const [icon,desc]=WMO_MAP[code]||['🌡️','לא ידוע'];
        const temp=Math.round(wxData.current_weather?.temperature);
        const days=(wxData.daily?.time||[]).slice(0,5);
        return <div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
            <span style={{fontSize:28}}>{icon}</span>
            <div><div style={{fontSize:18,fontWeight:700,color:'var(--text)'}}>{temp}°C</div>
              <div style={{fontSize:11,color:'var(--text2)'}}>{desc}{wxLabel?` — ${wxLabel}`:''}</div></div>
          </div>
          <div style={{display:'flex',gap:6,overflowX:'auto'}}>
            {days.map((date,i)=>{
              const c=wxData.daily?.weathercode?.[i];
              const [di]=WMO_MAP[c]||['🌡️'];
              const mn=Math.round(wxData.daily?.temperature_2m_min?.[i]);
              const mx=Math.round(wxData.daily?.temperature_2m_max?.[i]);
              const d=new Date(date);

              return <div key={date} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 10px',textAlign:'center',minWidth:52,fontSize:11,color:'var(--text2)'}}>
                <div style={{fontWeight:600,color:'var(--text)'}}>יום {dayName}</div>
                <div style={{fontSize:18,margin:'2px 0'}}>{di}</div>
                <div>{mx}°/{mn}°</div>
              </div>;
            })}
          </div>
        </div>;
      })()}
    </div>}
    <div ref={mapRef} style={{flex:1,width:'100%'}}/>
  </div>;
}

/* ══════════════════════════════════
   מזג אוויר
══════════════════════════════════ */
function Weather({coordinates,location}){
  const[w,setW]=useState(null),[loading,setL]=useState(false);
  const[customCoords,setCustomCoords]=useState(null),[customLabel,setCustomLabel]=useState('');
  const[searchInput,setSearchInput]=useState('');
  const effCoords=customCoords||coordinates;
  const effLabel=customLabel||(customCoords?'':location);

  // ברירת מחדל: מיקום נוכחי אם אין קואורדינטות ליום
  useEffect(()=>{
    if(coordinates?.lat||customCoords) return;
    navigator.geolocation?.getCurrentPosition(
      pos=>{setCustomCoords({lat:pos.coords.latitude,lng:pos.coords.longitude});setCustomLabel('המיקום הנוכחי שלי');},
      ()=>{}
    );
  },[]);

  useEffect(()=>{
    if(!effCoords?.lat) return; setL(true);
    fetchWeather(effCoords.lat,effCoords.lng).then(setW).catch(()=>setW(null)).finally(()=>setL(false));
  },[effCoords?.lat,effCoords?.lng]);

  const searchPlace=async()=>{
    const q=searchInput.trim(); if(!q) return;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=he`,{headers:{'Accept-Language':'he'}});
      const d=await r.json();
      if(d[0]){setCustomCoords({lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)});setCustomLabel(d[0].display_name.split(',')[0]);setSearchInput('');}
    }catch{}
  };

  const[icon,desc]=WMO[w?.current_weather?.weathercode]||['🌡️','לא ידוע'];
  return <div className="weather-card" style={{marginBottom:12}}>
    <div style={{display:'flex',gap:6,marginBottom:8}}>
      <input value={searchInput} onChange={e=>setSearchInput(e.target.value)}
        onKeyDown={e=>e.key==='Enter'&&searchPlace()}
        placeholder="מיקום אחר (Enter לחיפוש)..."
        style={{flex:1,background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.25)',borderRadius:7,padding:'5px 9px',fontSize:11,color:'inherit',fontFamily:'Heebo,sans-serif',direction:'rtl'}}/>
      <button onClick={searchPlace} style={{background:'rgba(255,255,255,.2)',border:'none',borderRadius:7,padding:'5px 8px',cursor:'pointer',fontSize:13}}>🔍</button>
    </div>
    {loading&&<div style={{fontSize:12,opacity:.7,textAlign:'center',padding:'8px 0'}}>⏳ טוען...</div>}
    {!loading&&!w&&<div style={{fontSize:11,opacity:.6,textAlign:'center',padding:'4px 0'}}>מזג האוויר לא זמין</div>}
    {w&&<>
      <div style={{fontSize:11,fontWeight:600,opacity:.7,marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>{effLabel||'מזג אוויר'} — 3 ימים קרובים</div>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
        <span style={{fontSize:32}}>{icon}</span>
        <div><div style={{fontSize:22,fontWeight:700}}>{Math.round(w.current_weather?.temperature)}°C</div><div style={{fontSize:12,opacity:.8}}>{desc}</div></div>
      </div>
      <div style={{display:'flex',gap:8}}>
        {(w.daily?.time||[]).slice(0,3).map((date,i)=>{
          const[di]=WMO[w.daily.weathercode[i]]||['🌡️'];
          return <div key={date} style={{flex:1,background:'rgba(255,255,255,.1)',borderRadius:8,padding:'6px 8px',textAlign:'center'}}>
            <div style={{fontSize:10,opacity:.7,marginBottom:2}}>{new Date(date).toLocaleDateString('he-IL',{weekday:'short'})}</div>
            <div style={{fontSize:16}}>{di}</div>
            <div style={{fontSize:11,fontWeight:600}}>{Math.round(w.daily.temperature_2m_max[i])}°</div>
            <div style={{fontSize:10,opacity:.6}}>{Math.round(w.daily.temperature_2m_min[i])}°</div>
          </div>;
        })}
      </div>
    </>}
  </div>;
}

        <button className="btn btn-primary btn-sm" onClick={()=>{onSave(b);onClose();}}>שמור</button>

/* ══════════════════════════════════
   פאנל יום
══════════════════════════════════ */
function DayPanel({day,idx,onUpdate,onDelete,onFocusDay,onFocusItem,onMoveToBank}){
  const[open,setOpen]=useState(true),[editing,setEd]=useState(null);
  const dragIdxRef=useRef(null);
  const[dragOver,setDragOver]=useState(null);
  const updBlock=upd=>onUpdate({...day,blocks:day.blocks.map(b=>b.id===upd.id?upd:b)});
  const delBlock=id=>onUpdate({...day,blocks:day.blocks.filter(b=>b.id!==id)});
  const handleDrop=(toIdx)=>{
    const from=dragIdxRef.current;
    if(from===null||from===toIdx){dragIdxRef.current=null;setDragOver(null);return;}
    const arr=[...sorted];
    const[moved]=arr.splice(from,1);
    arr.splice(toIdx,0,moved);
    // עדכון שעות: הראשון שומר על שעתו, השאר קוסקדה
    let t=arr[0].startTime;
    const reordered=arr.map(b=>{const nb={...b,startTime:t};t=addMins(t,b.durationMins||60);return nb;});
    onUpdate({...day,blocks:reordered});
    dragIdxRef.current=null;setDragOver(null);
  };
  const addBlock=type=>{
    const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    onUpdate({...day,blocks:[...day.blocks,defaultBlock(type,start)]});
  };
  const total=day.blocks.reduce((s,b)=>s+(b.cost||0),0);
  const done=day.blocks.filter(b=>b.isCompleted).length;
  const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
  const dayColor=DAY_COLORS[idx%DAY_COLORS.length];
  const hasMapBlocks=day.blocks.some(b=>b.lat&&b.lng);

  return <div className="card" style={{marginBottom:12,animation:'fadeIn .3s ease'}}>
    <div className="day-header" onClick={()=>setOpen(o=>!o)}>
      <span style={{fontSize:20,color:dayColor}}>📅</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:14}}>יום {idx+1}{day.date?` — ${dateStr(day.date)}`:''}</div>
        {/* תצוגת מסלול: מוצא → יעד */}
        {(day.startLocation||day.endLocation)
          ?<div style={{fontSize:11,color:'var(--text3)',display:'flex',alignItems:'center',gap:4,flexWrap:'wrap',marginTop:1}}>
              {day.startLocation
                ?<span style={{color:day.startPending?'var(--amber)':'var(--green)',fontWeight:600}}>
                    {day.startPending?'❓':'🟢'} {day.startLocation}{day.startTime?` ${day.startTime}`:''}
                  </span>
                :<span style={{color:'var(--text3)'}}>🟢 —</span>}
              <span style={{color:'var(--text3)'}}>→</span>
              {day.endLocation
                ?<span style={{color:'var(--red)',fontWeight:600}}>🔴 {day.endLocation}{day.endTime?` ${day.endTime}`:''}</span>
                :<span style={{color:'var(--text3)'}}>🔴 —</span>}
            </div>
          :day.location&&<div style={{fontSize:11,color:'var(--text3)'}}>📍 {day.location}</div>
        }
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        {day.blocks.length>0&&<span className="chip chip-blue" style={{fontSize:10}}>{done}/{day.blocks.length}</span>}
        {total>0&&<span style={{fontSize:11,color:'var(--amber)'}}>₪{total.toFixed(0)}</span>}
        {onFocusDay&&hasMapBlocks&&(
          <button className="btn btn-secondary btn-icon btn-sm"
            title="הצג את כל עצירות היום על המפה"
            style={{background:dayColor,color:'#fff',border:'none',fontSize:12,padding:'4px 8px'}}
            onClick={e=>{e.stopPropagation();onFocusDay(day.id,idx,day.blocks);}}>
            🗺️
          </button>
        )}
        <span style={{color:'var(--text3)',fontSize:13}}>{open?'▼':'◀'}</span>
      </div>
    </div>

    {open&&<div style={{padding:'14px 16px'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
        <div><label className="label">תאריך</label>
          <input className="input" type="date" value={day.date} onChange={e=>onUpdate({...day,date:e.target.value})}/></div>
        <div><label className="label">מיקום / אתר לינה</label>
          <input className="input" value={day.location} onChange={e=>onUpdate({...day,location:e.target.value})} placeholder="עיר / אתר קמפינג"/></div>
      </div>

      {/* ── נקודת מוצא ויעד ── */}
      <div style={{background:'var(--bg3)',borderRadius:10,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:8}}>🗺️ מסלול היום</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {/* מוצא */}
          <div>
            <label className="label" style={{color:'var(--green)'}}>🟢 נקודת מוצא</label>
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              <input className="input" style={{flex:1,
                background:day.startPending?'rgba(234,179,8,0.13)':'',
                borderColor:day.startPending?'var(--amber)':''}}
                value={day.startLocation}
                onChange={e=>onUpdate({...day,startLocation:e.target.value,startPending:false})}
                placeholder="מאיפה יוצאים..."/>
              <input type="time" value={day.startTime||'08:00'}
                onChange={e=>onUpdate({...day,startTime:e.target.value})}
                style={{width:72,background:'var(--bg2)',border:'1px solid var(--border)',
                  color:'var(--text)',borderRadius:6,padding:'6px 4px',fontSize:12,
                  fontFamily:'Heebo,sans-serif',flexShrink:0}}/>
            </div>
            {day.startPending&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:5}}>
              <span style={{fontSize:11,color:'var(--amber)'}}>❓ הועתק מיעד אתמול — לאשר?</span>
              <button className="btn btn-sm" style={{padding:'1px 8px',fontSize:11,
                background:'var(--amber)',color:'#000',border:'none',borderRadius:5,cursor:'pointer'}}
                onClick={()=>onUpdate({...day,startPending:false})}>✓ אשר</button>
              <button className="btn btn-sm" style={{padding:'1px 8px',fontSize:11,
                background:'var(--bg2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:5,cursor:'pointer'}}
                onClick={()=>onUpdate({...day,startLocation:'',startPending:false})}>✕ נקה</button>
            </div>}
          </div>
          {/* יעד */}
          <div>
            <label className="label" style={{color:'var(--red)'}}>🔴 נקודת יעד</label>
            <div style={{display:'flex',gap:4,alignItems:'center'}}>
              <input className="input" style={{flex:1}}
                value={day.endLocation}
                onChange={e=>onUpdate({...day,endLocation:e.target.value})}
                placeholder="לאן מגיעים..."/>
              <input type="time" value={day.endTime||'20:00'}
                onChange={e=>onUpdate({...day,endTime:e.target.value})}
                style={{width:72,background:'var(--bg2)',border:'1px solid var(--border)',
                  color:'var(--text)',borderRadius:6,padding:'6px 4px',fontSize:12,
                  fontFamily:'Heebo,sans-serif',flexShrink:0}}/>
            </div>
          </div>
        </div>
      </div>

      <Weather coordinates={day.coordinates} location={day.location}/>

      <div className="timeline">
        {sorted.length===0&&<div style={{padding:'12px 0',color:'var(--text3)',fontSize:13,textAlign:'center'}}>אין בלוקים עדיין — הוסף בלוק למטה</div>}
        {(()=>{
          /* קו "עכשיו" — מחושב לפי השעה הנוכחית ביחס לבלוקים */
          const toMins=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;};
          const nowMins=toMins(nowTime());
          const isToday=!day.date||day.date===todayISO();

          /* מצא בלוק פעיל — כשהשעה הנוכחית בתוך משך הבלוק */
          let activeIdx=-1;
          let nowBlockProgress=null;
          /* מצא נקודת הוספה בין בלוקים (כאשר אין בלוק פעיל) */
          let nowInsert=-1;

          if(isToday&&sorted.length>0){
            const firstMins=toMins(sorted[0].startTime);
            const lastEnd=toMins(sorted[sorted.length-1].startTime)+(sorted[sorted.length-1].durationMins||60);
            if(nowMins>=firstMins-5&&nowMins<=lastEnd+30){
              /* בדוק האם השעה בתוך בלוק כלשהו */
              activeIdx=sorted.findIndex(b=>{
                const s=toMins(b.startTime);
                return nowMins>=s&&nowMins<s+(b.durationMins||60);
              });
              if(activeIdx>=0){
                /* חשב התקדמות יחסית בתוך הבלוק (0–1) */
                const s=toMins(sorted[activeIdx].startTime);
                nowBlockProgress=(nowMins-s)/(sorted[activeIdx].durationMins||60);
              } else {
                /* בין בלוקים — חשב מיקום הוספה */
                nowInsert=sorted.findIndex(b=>nowMins<toMins(b.startTime));
                if(nowInsert===-1) nowInsert=sorted.length;
              }
            }
          }

          /* קו בין-בלוקים */
          const nowLine=<div key="__nowline__" style={{display:'flex',alignItems:'center',gap:6,margin:'2px 0',pointerEvents:'none'}}>
            <span style={{background:'#ef4444',color:'#fff',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10,flexShrink:0,letterSpacing:'0.02em'}}>
              ⏱ {nowTime()}
            </span>
            <div style={{flex:1,height:2,background:'#ef4444',borderRadius:2,opacity:0.75}}/>
          </div>;

          return sorted.map((bl,si)=>[
            nowInsert===si&&nowLine,
            <BlockItem key={bl.id} block={bl} onEdit={setEd} onDelete={delBlock} onMoveToBank={onMoveToBank} onFocusItem={onFocusItem}
              dragging={dragOver!==null&&dragIdxRef.current===si} dragOver={dragOver===si}
              nowProgress={activeIdx===si?nowBlockProgress:null}
              onDragStart={e=>{e.dataTransfer.effectAllowed='move';dragIdxRef.current=si;}}
              onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';if(dragOver!==si)setDragOver(si);}}
              onDrop={e=>{e.preventDefault();handleDrop(si);}}
              onDragEnd={()=>{dragIdxRef.current=null;setDragOver(null);}}/>,
            nowInsert===sorted.length&&si===sorted.length-1&&nowLine,
          ]);
        })()}
      </div>

      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:12}}>
        {BLOCK_TYPES.map(t=>(
          <button key={t} className="btn btn-secondary btn-sm" onClick={()=>addBlock(t)}>{BLOCK_EMOJI[t]} הוסף {BLOCK_HE[t]}</button>
        ))}
      </div>

      <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>
        <div><label className="label">הערות יומיות</label>
          <textarea className="input" rows={2} value={day.notes} onChange={e=>onUpdate({...day,notes:e.target.value})} placeholder="הערות להיום…"/></div>
        <div><label className="label">סיכום / יומן</label>
          <textarea className="input" rows={3} value={day.summary} onChange={e=>onUpdate({...day,summary:e.target.value})} placeholder="איך היה היום? כתוב את רשומת היומן שלך…"/></div>
      </div>
      <div style={{marginTop:12,display:'flex',justifyContent:'flex-start'}}>
        <button className="btn btn-danger btn-sm" onClick={onDelete}>🗑 מחק יום</button>
      </div>
    </div>}

    {editing&&<BlockModal block={editing} onSave={updBlock} onClose={()=>setEd(null)} onDelete={()=>{delBlock(editing.id);setEd(null);}}/>}
  </div>;
}

/* ══════════════════════════════════
   פריט בנק אטרקציות
