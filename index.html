/* ══════════════════════════════════
   ERROR BOUNDARY
══════════════════════════════════ */
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null,info:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,i){console.error('CaravanControl crash:',e,i?.componentStack);}
  render(){
    if(this.state.err){
      const msg=String(this.state.err);
      const isData=msg.includes('undefined')||msg.includes('null')||msg.includes('forEach')||msg.includes('map')||msg.includes('filter');
      return(
        <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,padding:32,background:'var(--bg)'}}>
          <div style={{fontSize:52}}>⚠️</div>
          <div style={{fontSize:20,fontWeight:800,color:'var(--text)'}}>שגיאה בטעינת האפליקציה</div>
          <div style={{fontSize:13,color:'var(--text2)',maxWidth:420,textAlign:'center',lineHeight:1.8}}>
            {isData?'נתוני הטיול אינם תואמים את הגרסה הנוכחית. לחץ "אפס ונסה שוב" כדי לנקות את הנתונים המקומיים ולרענן.':'אירעה שגיאה בלתי צפויה. נסה לרענן את הדף.'}
          </div>
          <div style={{fontSize:11,color:'var(--text3)',fontFamily:'monospace',maxWidth:460,wordBreak:'break-word',textAlign:'center',opacity:.7}}>{msg}</div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',justifyContent:'center'}}>
            <button className="btn btn-primary" onClick={()=>location.reload()}>🔄 רענן דף</button>
            <button className="btn btn-danger" onClick={()=>{try{const raw=localStorage.getItem('caravanCtrl_he');const parsed=raw?JSON.parse(raw):null;const s=parsed?.settings;localStorage.removeItem('caravanCtrl_he');if(s)localStorage.setItem('caravanCtrl_he',JSON.stringify({settings:s}));}catch(e){}location.reload();}}>🗑️ אפס ונסה שוב</button>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',textAlign:'center',lineHeight:1.7}}>
            ⚠️ <strong>אפס ונסה שוב</strong> ימחק את הנתונים המקומיים בדפדפן זה בלבד.<br/>
            הטיולים השמורים ב-Firebase לא יימחקו.
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ══════════════════════════════════
   APP
══════════════════════════════════ */
function App(){
  const saved=useMemo(()=>loadState(),[]);
  const[isAdmin,setIsAdmin]=useState(false); // מתאפס בכל רענון — כניסה דרך סיסמה בלבד
  const[settings,setSettings]=useState(()=>{
    const def={githubToken:'',githubUsername:'nimrodekel-hub',githubRepo:'PlanMyTrip',
      theme:'dark',
      firebaseUrl:FB_URL, syncKey:'', proxyUrl:'', travelBuffer:1.2};
    const merged={...def,...(saved?.settings||{})};
    // אם אין Firebase URL — הכנס את ברירת המחדל
    // תמיד השתמש בכתובת הנכונה — לא כתובת הקונסול
    merged.firebaseUrl=FB_URL;
    // אם אין syncKey — צור אחד אוטומטית
    if(!merged.syncKey) merged.syncKey=genSyncKey();
    return merged;
  });
  const[trips,setTrips]=useState(()=>{
    const raw=saved?.trips;
    if(raw?.length>0){const n=raw.map(normTrip).filter(Boolean);if(n.length>0)return n;}
    return[defaultTrip('הטיול הראשון שלי')];
  });
  const[activeId,setActiveId]=useState(saved?.activeId||(saved?.trips?.[0]?.id??null));
  const[tab,setTab]=useState('map');
  const[mobilePanel,setMobilePanel]=useState('map'); // 'map'|'timeline'|'bank'
  const[ghBusy,setGhBusy]=useState(false);
  const[syncStatus,setSyncStatus]=useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  const[hlDay,setHlDay]=useState(null);
  const[hlItem,setHlItem]=useState(null);
  const[hlRoute,setHlRoute]=useState(null);
  const[scrollToDayId,setScrollToDayId]=useState(null); // גלילה לכרטיסיית יום בסרגל הצד
  const[shownDayIds,setShownDayIds]=useState(null); // null=הכל, Set=ימים נבחרים
  const ghSha=useRef(null);
  const autoSyncTimer=useRef(null);
  const skipNextPush=useRef(false);
  const lastPushTime=useRef(0); // timestamp של הפוש האחרון שלנו — לזיהוי שינויים חיצוניים
  const syncMounted=useRef(false);
  const mapPickCallbackRef=useRef(null);
  const[mapPickLabel,setMapPickLabel]=useState(null);
  const prevTabRef=useRef('timeline'); // tab to return to after map pick

  const toggleDayVisibility=useCallback((dayId)=>{
    if(dayId==='__all__'){setShownDayIds(null);setHlDay(null);return;}
    const days=trip?.days||[];
    const dayIdx=days.findIndex(d=>d.id===dayId);
    const day=dayIdx>=0?days[dayIdx]:null;
    const mkBlocks=d=>d?[
      ...(d.startLat&&d.startLng?[{id:'__start__',type:'travel',title:`🟢 ${d.startLocation||'מוצא'}`,lat:d.startLat,lng:d.startLng,startTime:'00:00'}]:[]),
      ...(d.blocks||[]),
      ...(d.endLat&&d.endLng?[{id:'__end__',type:'travel',title:`🔴 ${d.endLocation||'יעד'}`,lat:d.endLat,lng:d.endLng,startTime:'23:59'}]:[]),
    ]:[];
    if(shownDayIds===null){
      // כל הימים גלויים → בחר יום זה בלבד
      setShownDayIds(new Set([dayId]));
      if(day){setHlDay({dayId,dayIndex:dayIdx,blocks:mkBlocks(day)});setHlRoute(null);}
      return;
    }
    const next=new Set(shownDayIds);
    if(next.has(dayId)){
      // בטל בחירה
      next.delete(dayId);
      if(next.size===0){setShownDayIds(null);setHlDay(null);}
      else{setShownDayIds(next);setHlDay(null);}
    } else {
      // הוסף יום
      next.add(dayId);
      if(next.size===days.length){setShownDayIds(null);setHlDay(null);}
      else{
        setShownDayIds(next);
        if(day){setHlDay({dayId,dayIndex:dayIdx,blocks:mkBlocks(day)});setHlRoute(null);}
      }
    }
  },[trip,shownDayIds]);

  const pickLocationFromMap=useCallback((label,callback)=>{
    prevTabRef.current=tab; // capture current tab before switching
    mapPickCallbackRef.current=place=>{
      callback(place);
      setMapPickLabel(null);
      setTab(prevTabRef.current); // return to where we came from
    };
    window.__gmIw?.close(); // close any open InfoWindow before switching
    setMapPickLabel(label);
    setTab('map');
  },[tab]);
  const cancelMapPick=useCallback(()=>{
    mapPickCallbackRef.current=null;
    setMapPickLabel(null);
    setTab(prevTabRef.current); // return to where we came from
  },[]);

  useEffect(()=>saveState({settings,trips,activeId}),[settings,trips,activeId]);
  useEffect(()=>{document.body.className=settings.theme==='light'?'light':'';},[settings.theme]);

  // ── טעינה אוטומטית בעת פתיחה ──
  useEffect(()=>{
    const{firebaseUrl:fbUrl,syncKey,githubToken:tok,githubUsername:user,githubRepo:repo}=settings;

    if(fbUrl&&syncKey){
      // Firebase — המסלול המועדף
      setSyncStatus('syncing');
      fbRead(fbUrl,syncKey)
        .then(data=>{
          if(data?.githubToken&&!settings.githubToken){
            setSettings(s=>({...s,githubToken:data.githubToken}));
          }
          if(data?.trips?.length>0){
            const loaded=data.trips.map(normTrip).filter(Boolean);
            if(loaded.length>0){
              skipNextPush.current=true;
              setTrips(loaded);
              if(data.activeId) setActiveId(data.activeId);
              toast('הטיול נטען מ-Firebase ✓','success');
            }
            setSyncStatus('synced');
          } else if(trips.length>0){
            // Firebase ריק אבל יש נתונים מקומיים — דחוף אוטומטית
            toast('☁️ מעלה נתונים ל-Firebase...','info');
            fbWrite(fbUrl,syncKey,{trips,activeId,savedAt:new Date().toISOString(),githubToken:settings.githubToken||''})
              .then(()=>{setSyncStatus('synced');toast('☁️ נתונים נשלחו ל-Firebase — ניתן לטעון מהמכשיר השני ✓','success');})
              .catch(e=>{
                setSyncStatus('error');
                if(e.message==='rules_denied') toast('🔒 Firebase חסם גישה — עדכן Rules בלשונית 🔗 חיבוריות','error');
                else toast(`שגיאה בשליחה ל-Firebase: ${e.message}`,'error');
              });
          } else {
            setSyncStatus('synced');
          }
        })
        .catch(e=>{setSyncStatus('error');toast(`שגיאת קריאה מ-Firebase: ${e.message}`,'error');});
    } else if(tok&&user&&repo){
      // GitHub API — מסלול גיבוי
      setSyncStatus('syncing');
      ghLoad(tok,user,repo,'trip_data.json')
        .then(({content,sha})=>{
          ghSha.current=sha;
          if(content.trips?.length>0){
            skipNextPush.current=true;
            setTrips(content.trips);
            if(content.activeId) setActiveId(content.activeId);
            toast('נטען מגיטהאב ✓','success');
          }
          setSyncStatus('synced');
        })
        .catch(()=>setSyncStatus('idle'));
    } else {
      // אין סנכרון — הצג תזכורת חד-פעמית במחשב
      if(!(navigator.maxTouchPoints>0)&&!window.matchMedia('(max-width:768px)').matches){
        setTimeout(()=>toast('☁️ הסנכרון לא מוגדר — עבור להגדרות ⚙️ להפעלה','info'),4000);
      }
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // ── טעינה מחדש כשחוזרים לטאב (סנכרון דו-כיווני) ──
  useEffect(()=>{
    const onVisible=()=>{
      if(document.visibilityState!=='visible')return;
      const{firebaseUrl:fbUrl,syncKey}=settings;
      if(!fbUrl||!syncKey)return;
      fbRead(fbUrl,syncKey).then(data=>{
        if(data?.githubToken&&!settings.githubToken){
          setSettings(s=>({...s,githubToken:data.githubToken}));
        }
        if(!data?.trips?.length)return;
        const remote=data.trips.map(normTrip).filter(Boolean);
        if(!remote.length)return;
        // בדוק אם יש שינוי לפי savedAt לפני שמחליפים
        const remoteTime=data.savedAt?new Date(data.savedAt).getTime():0;
        const localTime=lastPushTime.current||0;
        if(remoteTime>localTime){
          skipNextPush.current=true;
          const remoteIds=new Set(remote.map(t=>t.id));
          setTrips(prev=>{
            const localOnly=prev.filter(t=>!remoteIds.has(t.id));
            return [...remote,...localOnly];
          });
          if(data.activeId)setActiveId(data.activeId);
          setSyncStatus('synced');
        }
      }).catch(()=>{});
    };
    document.addEventListener('visibilitychange',onVisible);
    return()=>document.removeEventListener('visibilitychange',onVisible);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[settings]);

  // ── שמירה אוטומטית אחרי כל שינוי (debounce 2s) ──
  useEffect(()=>{
    if(!syncMounted.current){syncMounted.current=true;return;}
    if(skipNextPush.current){skipNextPush.current=false;return;}
    const{firebaseUrl:fbUrl,syncKey,githubToken:tok,githubUsername:user,githubRepo:repo}=settings;
    if(!fbUrl&&(!tok||!user||!repo)) return;
    setSyncStatus('syncing');
    clearTimeout(autoSyncTimer.current);
    autoSyncTimer.current=setTimeout(async()=>{
      try{
        if(fbUrl&&syncKey){
          await fbWrite(fbUrl,syncKey,{trips,activeId,savedAt:new Date().toISOString(),githubToken:settings.githubToken||''});
          lastPushTime.current=Date.now();
        } else if(tok&&user&&repo){
          if(!ghSha.current){try{const r=await ghLoad(tok,user,repo,'trip_data.json');ghSha.current=r.sha;}catch{}}
          const res=await ghSave(tok,user,repo,'trip_data.json',{trips,activeId,savedAt:new Date().toISOString()},ghSha.current);
          ghSha.current=res.content.sha;
        }
        setSyncStatus('synced');
      }catch(e){
        setSyncStatus('error');
        if(e.message==='rules_denied')toast('🔒 Firebase חסם גישה — עדכן Rules בלשונית 🔗 חיבוריות','error');
        else console.error('Sync error:',e.message);
      }
    },2000);
    return ()=>clearTimeout(autoSyncTimer.current);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[trips,activeId]);

  const trip=useMemo(()=>trips.find(t=>t.id===activeId)||trips[0]||null,[trips,activeId]);

  const updTrip=useCallback(upd=>{
    if (typeof upd==='function') setTrips(ts=>ts.map(t=>t.id===activeId?upd(t):t));
    else setTrips(ts=>ts.map(t=>t.id===upd.id?upd:t));
  },[activeId]);

  const newTrip=(name,template=null)=>{
    const t=template?{...template,id:uid(),name:name||template.name+' עותק'}:defaultTrip(name||'טיול חדש');
    setTrips(ts=>[...ts,t]); setActiveId(t.id);
    toast(`הטיול "${t.name}" נוצר`,'success');
  };
  const loadTrip=(id,direct=null)=>{
    if (direct){setTrips(ts=>ts.map(t=>t.id===direct.id?direct:t));return;}
    setActiveId(id); setTab('timeline');
  };
  const delTrip=id=>{
    const rest=trips.filter(t=>t.id!==id);
    setTrips(rest); if(activeId===id)setActiveId(rest[0]?.id||null);
  };
  const addToBank=useCallback(item=>{
    if (!trip) return;
    updTrip({...trip,interestBank:[...trip.interestBank,{...item,id:uid()}]});
  },[trip,updTrip]);
  const updateBankItem=useCallback((id,patch)=>{
    if(!trip)return;
    updTrip({...trip,interestBank:trip.interestBank.map(i=>i.id===id?{...i,...patch}:i)});
  },[trip,updTrip]);
  // מיפוי כלל-טיולי: name/coords → placeId+נתונים — מונע קריאות כפולות לגוגל
  const allKnownPlaces=useMemo(()=>{
    const m={};
    trips.forEach(t=>{
      (t.interestBank||[]).forEach(item=>{
        if(!item.placeId)return;
        const nk=(item.name||'').trim().toLowerCase();
        const entry={placeId:item.placeId,rating:item.rating||null,openStatus:item.openStatus||'',
          todayHours:item.todayHours||'',phone:item.phone||'',website:item.website||'',
          placeType:item.placeType||'',address:item.address||''};
        if(nk)m[nk]=entry;
        if(item.lat&&item.lng)m[`${Math.round(item.lat*1e4)},${Math.round(item.lng*1e4)}`]=entry;
      });
    });
    return m;
  },[trips]);

  const saveCustomName=useCallback((placeId,bankItemId,customName)=>{
    if(!trip)return;
    const cn=(customName||'').trim()||undefined;
    updTrip(prev=>({
      ...prev,
      interestBank:(prev.interestBank||[]).map(i=>
        (placeId&&i.placeId===placeId)||(bankItemId&&!placeId&&i.id===bankItemId)
          ?{...i,customName:cn}:i
      ),
      days:placeId?prev.days.map(d=>({
        ...d,
        blocks:d.blocks.map(b=>b.placeId===placeId?{...b,customName:cn}:b),
        dayBank:(d.dayBank||[]).map(i=>i.placeId===placeId?{...i,customName:cn}:i)
      })):prev.days
    }));
  },[trip,updTrip]);


  const setDayLocation=useCallback((dayId,field,name,lat,lng,placeData=null)=>{
    if(!trip)return;
    const patch=field==='start'
      ?{startLocation:name,startLat:lat,startLng:lng}
      :{endLocation:name,endLat:lat,endLng:lng};
    // גם הוסף לבנק האטרקציות אם יש placeId
    const bankAlready=placeData?.placeId&&(trip.interestBank||[]).some(i=>i.placeId===placeData.placeId);
    const newBank=(placeData?.placeId&&!bankAlready)
      ?[...(trip.interestBank||[]),{id:uid(),name,address:placeData.address||'',
          placeId:placeData.placeId,lat,lng,
          types:placeData.types||[],placeType:placeData.placeType||'',
          rating:placeData.rating,website:placeData.website||'',
          openStatus:placeData.openStatus||'',todayHours:placeData.todayHours||'',phone:placeData.phone||''}]
      :(trip.interestBank||[]);
    updTrip({...trip,days:trip.days.map(d=>d.id===dayId?{...d,...patch}:d),interestBank:newBank});
  },[trip,updTrip]);

  const addToDay=useCallback((dayId,item)=>{
    if (!trip) return;
    const day=trip.days.find(d=>d.id===dayId);
    if (!day) return;
    const sorted=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    const newBlock=defaultBlock('activity',start);
    newBlock.title=item.customName||item.name;
    if(item.customName) newBlock.customName=item.customName;
    newBlock.location=item.address||'';
    if(item.lat){newBlock.lat=item.lat; newBlock.lng=item.lng;}
    if(item.placeId) newBlock.placeId=item.placeId;
    if(item.rating) newBlock.placeRating=item.rating;
    if(item.userRatingsTotal) newBlock.placeUserRatings=item.userRatingsTotal;
    if(item.openStatus) newBlock.placeOpenStatus=item.openStatus;
    if(item.todayHours) newBlock.placeTodayHours=item.todayHours;
    if(item.phone) newBlock.placePhone=item.phone;
    if(item.website) newBlock.placeWebsite=item.website;
    if(item.photoUrl) newBlock.placePhotoUrl=item.photoUrl;
    if(item.placeType) newBlock.placeType=item.placeType;
    const updatedDay={...day,blocks:[...day.blocks,newBlock]};
    // גם הוסף לבנק האטרקציות (אטומי — אותו updTrip)
    const bankAlready=item.placeId&&(trip.interestBank||[]).some(i=>i.placeId===item.placeId);
    const newBank=bankAlready
      ?(trip.interestBank||[])
      :[...(trip.interestBank||[]),{id:uid(),name:item.customName||item.name,customName:item.customName||undefined,address:item.address||'',
          placeId:item.placeId||'',lat:item.lat,lng:item.lng,
          types:item.types||[],placeType:item.placeType||'',
          rating:item.rating,website:item.website||'',
          openStatus:item.openStatus||'',todayHours:item.todayHours||'',phone:item.phone||''}];
    updTrip({...trip,days:trip.days.map(d=>d.id===dayId?updatedDay:d),interestBank:newBank});
  },[trip,updTrip]);

  const addToDayBank=useCallback((dayId,item)=>{
    if(!trip)return;
    const day=trip.days.find(d=>d.id===dayId);if(!day)return;
    const already=(day.dayBank||[]).some(i=>i.placeId&&i.placeId===item.placeId&&item.placeId);
    if(already){toast(`"${item.customName||item.name}" כבר בבנק היומי`,'info');return;}
    updTrip({...trip,days:trip.days.map(d=>d.id===dayId?{...d,dayBank:[...(d.dayBank||[]),{...item,id:uid()}]}:d)});
  },[trip,updTrip]);

  const push=async(s=settings)=>{
    setGhBusy(true); setSyncStatus('syncing');
    try{
      if(s.firebaseUrl&&s.syncKey){
        await fbWrite(s.firebaseUrl,s.syncKey,{trips,activeId,savedAt:new Date().toISOString(),githubToken:s.githubToken||''});
        lastPushTime.current=Date.now();
        toast('נשמר ב-Firebase ✓','success');
      } else {
        if(!ghSha.current){try{const r=await ghLoad(s.githubToken,s.githubUsername,s.githubRepo,'trip_data.json');ghSha.current=r.sha;}catch{}}
        const res=await ghSave(s.githubToken,s.githubUsername,s.githubRepo,'trip_data.json',{trips,activeId,savedAt:new Date().toISOString()},ghSha.current);
        ghSha.current=res.content.sha;
        toast('נדחף לגיטהאב ✓','success');
      }
      setSyncStatus('synced');
    }catch(e){
      setSyncStatus('error');
      if(e.message==='rules_denied'){
        toast('🔒 Firebase חסם גישה — יש לעדכן Rules. עבור ל-🔗 חיבוריות לפרטים','error');
      } else {
        toast(`שגיאת שמירה: ${e.message}`,'error');
      }
    }
    finally{setGhBusy(false);}
  };
  const pull=async(s=settings)=>{
    setGhBusy(true); setSyncStatus('syncing');
    try{
      let data=null;
      if(s.firebaseUrl&&s.syncKey){
        data=await fbRead(s.firebaseUrl,s.syncKey);
        if(!data){
          toast('לא נמצאו נתונים לקוד זה — ודא שהקוד נכון ושהמכשיר המקורי סינכרן לאחרונה','error');
          setSyncStatus('error'); return;
        }
      } else {
        const{content,sha}=await ghLoad(s.githubToken,s.githubUsername,s.githubRepo,'trip_data.json');
        ghSha.current=sha; data=content;
      }
      if(data?.githubToken&&!settings.githubToken){
        setSettings(sv=>({...sv,githubToken:data.githubToken}));
      }
      if(data?.trips){
        const remote=data.trips.map(normTrip).filter(Boolean);
        if(remote.length>0){
          skipNextPush.current=true;
          // ── Merge: remote גובר על קונפליקטים, טיולים מקומיים-בלבד נשמרים ──
          const remoteIds=new Set(remote.map(t=>t.id));
          const localOnly=trips.filter(t=>!remoteIds.has(t.id));
          const merged=[...remote,...localOnly];
          const added=remote.filter(t=>!trips.find(l=>l.id===t.id)).length;
          const updated=remote.filter(t=> trips.find(l=>l.id===t.id)).length;
          const kept=localOnly.length;
          setTrips(merged);
          if(data.activeId)setActiveId(data.activeId);
          const parts=[];
          if(added)parts.push(`${added} נוספו`);
          if(updated)parts.push(`${updated} עודכנו`);
          if(kept)parts.push(`${kept} מקומיים נשמרו`);
          toast(`✅ מוזג: ${parts.join(' · ')}`, 'success');
        } else {
          toast('הנתונים נטענו אך אין טיולים שמורים','info');
        }
      } else {
        toast('נתונים לא תקינים — לא ניתן לטעון','error');
        setSyncStatus('error'); return;
      }
      setSyncStatus('synced');
    }catch(e){setSyncStatus('error');toast(`שגיאת טעינה: ${e.message}`,'error');}
    finally{setGhBusy(false);}
  };

  const exportData=()=>{
    const blob=new Blob([JSON.stringify({trips,activeId,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
    const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(blob),download:`planmytrip-${new Date().toISOString().slice(0,10)}.json`});
    a.click(); URL.revokeObjectURL(a.href);
    toast('קובץ גיבוי הורד ✓','success');
  };
  const importData=(file)=>{
    if(!file)return;
    const reader=new FileReader();
    reader.onload=e=>{try{const d=JSON.parse(e.target.result);
      if(d?.trips?.length>0){const loaded=d.trips.map(normTrip).filter(Boolean);
        if(loaded.length>0){setTrips(loaded);if(d.activeId)setActiveId(d.activeId);toast('נתונים יובאו בהצלחה ✓','success');return;}}
      toast('הקובץ ריק או לא תקין','error');
    }catch{toast('קובץ JSON לא תקין','error');}};
    reader.readAsText(file);
  };

  const TABS=[
    {id:'map',label:'🗺️ מפה'},
    {id:'timeline',label:'🗓 לוח זמנים'},
    {id:'expenses',label:'💰 הוצאות'},
    {id:'documents',label:'📁 מסמכים'},
    {id:'packing',label:'🎒 ציוד'},
    {id:'shopping',label:'🛒 קניות'},
    {id:'notes',label:'📝 הערות'},
    {id:'report',label:'📋 דו"ח'},
    {id:'connectivity',label:'🔗 חיבוריות'},
    {id:'settings',label:'⚙️ הגדרות'},
  ];

  const noTrip=<div className="empty-state" style={{height:'100%'}}>
    <div className="emoji">🚐</div>
    <div style={{fontWeight:600,color:'var(--text)'}}>אין טיול פעיל</div>
    <p>עבור להגדרות ⚙️ כדי ליצור טיול חדש.</p>
    <button className="btn btn-primary" onClick={()=>setTab('settings')}>⚙️ הגדרות</button>
  </div>;

  const renderMain=()=>{
    if (!trip&&tab!=='settings'&&tab!=='connectivity') return noTrip;
    switch(tab){
      case 'map': return (
        <div className="map-view-3col">
          {/* עמודה 1: מפה */}
          <div className="map-col map-col-map">
            <MapView mapsKey={settings.googleMapsKey||GMAPS_KEY} trip={trip} onAddToBank={addToBank} onAddToDay={addToDay}
              onSetDayLocation={setDayLocation} onUpdateBankItem={updateBankItem}
              highlightDay={hlDay} highlightItem={hlItem} routeHighlight={hlRoute}
              mapPickCallbackRef={mapPickCallbackRef} mapPickLabel={mapPickLabel} onCancelMapPick={cancelMapPick}
              onAddToDayBank={addToDayBank} shownDayIds={shownDayIds} onSaveCustomName={saveCustomName}/>
          </div>
          {/* backdrop בסלולר */}
          <div className={`mob-panel-backdrop${mobilePanel!=='map'?' show':''}`}
            onClick={()=>setMobilePanel('map')}/>
          {/* עמודה 2: לוח זמנים */}
          <div className={`map-col map-col-timeline${mobilePanel==='timeline'?' mob-open':''}`}>
            {trip?<TimelineTab trip={trip} onUpdate={updTrip} compact={true}
              onLocate={(lat,lng)=>window.__gmFocus?.(lat,lng)}
              onFocusDay={(dayId,dayIndex,blocks)=>{setHlDay({dayId,dayIndex,blocks});setHlRoute(null);setShownDayIds(new Set([dayId]));}}
              onFocusItem={(lat,lng,name)=>{setHlItem({lat,lng,name});setHlDay(null);setHlRoute(null);}}
              onFocusRoute={r=>setHlRoute(r)}
              settings={settings} onPickFromMap={pickLocationFromMap}
              shownDayIds={shownDayIds} onToggleDayVisibility={toggleDayVisibility}
              scrollToDayId={scrollToDayId}
            />:noTrip}
          </div>
          {/* עמודה 3: בנק אטרקציות */}
          <div className={`map-col map-col-bank${mobilePanel==='bank'?' mob-open':''}`}>
            {trip?<BankPanel trip={trip} onUpdate={updTrip}
              onLocate={(lat,lng)=>window.__gmFocus?.(lat,lng)}
              onFocusItem={(lat,lng,name)=>{setHlItem({lat,lng,name});setHlDay(null);}}
              onClose={()=>setMobilePanel('map')}
              settings={settings} onSetDayLocation={setDayLocation}
              allKnownPlaces={allKnownPlaces}
            />:noTrip}
          </div>
        </div>
      );
      case 'timeline': return <TimelineTab trip={trip} onUpdate={updTrip} onPickFromMap={pickLocationFromMap} settings={settings} shownDayIds={shownDayIds} onToggleDayVisibility={toggleDayVisibility}
          onFocusItem={(lat,lng,name,dayId)=>{setHlItem({lat,lng,name});setHlDay(null);setHlRoute(null);if(dayId)setScrollToDayId(dayId);setTab('map');}}
          onFocusRoute={r=>{setHlRoute(r);setHlDay(null);if(r?.dayId)setScrollToDayId(r.dayId);setTab('map');}}/>;
      case 'expenses': return <ExpensesTab trip={trip} onUpdate={updTrip}/>;
      case 'documents': return <DocsTab trip={trip} onUpdate={updTrip} settings={settings}/>;
      case 'packing': return <Checklist title="רשימת ציוד" emoji="🎒" items={trip.packingList} onUpdate={items=>updTrip({...trip,packingList:items})}/>;
      case 'shopping': return <Checklist title="רשימת קניות" emoji="🛒" items={trip.shoppingList} onUpdate={items=>updTrip({...trip,shoppingList:items})}/>;
      case 'notes': return <NotesTab trip={trip} onUpdate={updTrip}/>;
      case 'report': return <ReportTab trip={trip}/>;
      case 'connectivity': return <ConnectivityTab settings={settings} onSettings={setSettings} onPush={push} onPull={pull} ghBusy={ghBusy} syncStatus={syncStatus} onExport={exportData} onImport={importData} isAdmin={isAdmin} onAdminLogin={()=>setIsAdmin(true)} onAdminLogout={()=>setIsAdmin(false)}/>;
      case 'settings': return <SettingsTab settings={settings} onSettings={setSettings} trips={trips} activeTrip={trip} onNewTrip={newTrip} onLoadTrip={loadTrip} onDeleteTrip={delTrip} onPush={push} onPull={pull} ghBusy={ghBusy} genKey={genSyncKey}/>;
      default: return null;
    }
  };

  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="app-header">
      <VehicleHeader trip={trip} theme={settings.theme} syncStatus={syncStatus} hasGh={!!settings.githubToken} hasFb={!!(settings.firebaseUrl&&settings.syncKey)} syncKey={settings.syncKey||''} onThemeToggle={()=>setSettings(s=>({...s,theme:s.theme==='dark'?'light':'dark'}))} onUpdate={updTrip} onGoSettings={()=>setTab('connectivity')}/>
      <div className="tab-bar">
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
    </div>
    <div className="main-content">{renderMain()}</div>
    <nav className="mobile-bottom-nav">
      {TABS.map(t=>{
        const [icon,...words]=t.label.split(' ');
        return <button key={t.id} className={`mobile-nav-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
          <span className="mobile-nav-icon">{icon}</span>
          <span className="mobile-nav-label">{words.join(' ')}</span>
        </button>;
      })}
      {tab==='map'&&<>
        <button className={`mobile-nav-btn${mobilePanel==='timeline'?' active':''}`}
          style={mobilePanel==='timeline'?{color:'var(--green)',borderTopColor:'var(--green)'}:{}}
          onClick={()=>setMobilePanel(p=>p==='timeline'?'map':'timeline')}>
          <span className="mobile-nav-icon">📅</span>
          <span className="mobile-nav-label">לוז</span>
        </button>
        <button className={`mobile-nav-btn${mobilePanel==='bank'?' active':''}`}
          style={mobilePanel==='bank'?{color:'var(--amber)',borderTopColor:'var(--amber)'}:{}}
          onClick={()=>setMobilePanel(p=>p==='bank'?'map':'bank')}>
          <span className="mobile-nav-icon">⭐</span>
          <span className="mobile-nav-label">אטרקציות</span>
        </button>
      </>}
    </nav>
    <Toasts/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
</html>
