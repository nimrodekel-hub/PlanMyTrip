          <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:10,flexWrap:'wrap'}}>
            <span style={labelStyle}>טווח:</span>
            {[2,5,10,20,50].map(r=>(
              <button key={r} onClick={()=>setRadius(r)} style={chip(radius===r)}>{r} ק"מ</button>
            ))}
          </div>

          {results.length===0?(
            <div style={{fontSize:12,color:'var(--text3)',textAlign:'center',padding:'10px 0'}}>
              🔍 לא נמצאו מקומות בטווח {radius} ק"מ — נסה טווח גדול יותר
            </div>
          ):(
            <>
              <div style={{fontSize:11,color:'var(--text3)',marginBottom:6}}>
                נמצאו <strong style={{color:'var(--text)'}}>{results.length}</strong> מקומות
                {hasRoute?` לאורך המסלול בטווח ${radius} ק"מ`:`בטווח ${radius} ק"מ`}:
              </div>
              {/* רשימת תוצאות */}
              <div style={{display:'flex',flexDirection:'column',gap:5,maxHeight:260,overflowY:'auto',paddingLeft:2}}>
                {results.map(item=>{
                  const mapsUrl=mkMapsUrl(item.placeId,item.lat,item.lng,item.customName||item.name);
                  return(
                  <div key={item.id} style={{
                    display:'flex',alignItems:'center',gap:8,
                    background:'var(--surface)',border:'1px solid var(--border)',
                    borderRadius:7,padding:'7px 10px',
                  }}>
                    <span style={{fontSize:18,flexShrink:0,lineHeight:1}}>{peEmoji(item.placeType)}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.customName||item.name}</div>
                      <div style={{display:'flex',alignItems:'center',gap:5,marginTop:1,flexWrap:'wrap'}}>
                        {item.rating&&<span style={{fontSize:10,color:'var(--amber)'}}>⭐ {item.rating}</span>}
                        {item.placeType&&<span style={{fontSize:10,color:'var(--text3)'}}>{item.placeType}</span>}
                        {item.openStatus&&<span style={{fontSize:10,fontWeight:600,
                          color:item.openStatus==='פתוח עכשיו'?'#22c55e':'#ef4444'}}>
                          {item.openStatus==='פתוח עכשיו'?'✅ פתוח':'🔴 סגור'}</span>}
                      </div>
                      {/* קישורים: אתר + גוגל מפות */}
                      <div style={{display:'flex',gap:5,marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
                        {item.website&&(
                          <a href={item.website} target="_blank" rel="noreferrer"
                            style={{fontSize:10,color:'var(--accent2)',textDecoration:'none',
                              display:'inline-flex',alignItems:'center',gap:2,
                              background:'rgba(79,142,247,.08)',border:'1px solid rgba(79,142,247,.25)',
                              borderRadius:5,padding:'1px 6px',flexShrink:0}}>
                            🌐 אתר
                          </a>
                        )}
                        {mapsUrl&&(
                          <a href={mapsUrl} target="_blank" rel="noreferrer"
                            style={{fontSize:10,color:'#4285f4',textDecoration:'none',
                              display:'inline-flex',alignItems:'center',gap:2,
                              background:'rgba(66,133,244,.08)',border:'1px solid rgba(66,133,244,.25)',
                              borderRadius:5,padding:'1px 6px',flexShrink:0}}>
                            <span style={{fontWeight:900,fontSize:11,fontFamily:'Arial,sans-serif'}}>G</span> מפות
                          </a>
                        )}
                      </div>
                    </div>
                    {/* תג מרחק */}
                    <span style={{fontSize:10,color:'#059669',fontWeight:700,flexShrink:0,
                      background:'rgba(16,185,129,.1)',padding:'2px 7px',borderRadius:10,textAlign:'center',
                      whiteSpace:'nowrap',minWidth:40}}>
                      {fmtDist(item._dist)}
                    </span>
                    {/* כפתור הוספה */}
                    <button onClick={()=>addOne(item)} title="הוסף לבנק היומי"
                      style={{fontSize:20,width:32,height:32,borderRadius:7,cursor:'pointer',flexShrink:0,
                        display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1,
                        background:'rgba(16,185,129,.12)',border:'1px solid rgba(16,185,129,.35)',
                        color:'#059669',fontWeight:700,padding:0}}>
                      +
                    </button>
                  </div>
                  );
                })}
              </div>
              {/* הוסף הכל */}
              {results.length>1&&(
                <div style={{marginTop:9,display:'flex',justifyContent:'flex-end'}}>
                  <button onClick={addAll} style={{
                    fontSize:12,padding:'5px 16px',borderRadius:6,cursor:'pointer',fontWeight:600,
                    background:'rgba(16,185,129,.15)',border:'1px solid rgba(16,185,129,.4)',color:'#059669',
                  }}>➕ הוסף הכל לבנק היומי ({results.length})</button>
                </div>
              )}
            </>
          )}
        </>
      )}
    </div>
  );
}

function DayPanel({day,idx,onUpdate,onDelete,onFocusDay,onFocusItem,onFocusRoute,onMoveToBank,settings,onPickFromMap,onBankNoteUpdate,dayVisible=true,allDaysVisible=true,onToggleVisibility}){
  // פתוח כברירת מחדל רק אם היום הוא היום או מחר (לפי תאריך), אחרת — מכווץ
  const _today=new Date().toISOString().slice(0,10);
  const _tomorrow=new Date(Date.now()+864e5).toISOString().slice(0,10);
  const _defaultOpen=day.date?(day.date===_today||day.date===_tomorrow):idx<2;
  const[open,setOpen]=useState(_defaultOpen),[editing,setEd]=useState(null);
  const[travelTimes,setTravelTimes]=useState({});
  const[locationPicking,setLocationPicking]=useState(null); // {field:'start'|'end'}
  const[bankPickForBlock,setBankPickForBlock]=useState(null); // {type}
  const[showDayBank,setShowDayBank]=useState(false);
  const[showSuggestions,setShowSuggestions]=useState(false);
  const[swapSrc,setSwapSrc]=useState(null); // פריט בנק יומי הממתין להחלפה עם בלוק
  const dragIdxRef=useRef(null);
  const[dragOver,setDragOver]=useState(null);
  const updBlock=upd=>onUpdate({...day,blocks:day.blocks.map(b=>b.id===upd.id?upd:b)});
  const delBlock=id=>{
    const blks=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const idx=blks.findIndex(b=>b.id===id);
    if(idx<0)return;
    const toRemove=new Set([id]);
    if(idx>0&&blks[idx-1].isAutoTravel)toRemove.add(blks[idx-1].id);
    if(idx<blks.length-1&&blks[idx+1].isAutoTravel)toRemove.add(blks[idx+1].id);
    const remaining=blks.filter(b=>!toRemove.has(b.id));
    // cascade הפעילויות שאחרי כדי לסגור את הפער
    const deletedStart=blks[idx].startTime;
    const pivotIdx=remaining.findIndex(b=>b.startTime>deletedStart);
    if(pivotIdx>0){
      const anchor=remaining[pivotIdx-1];
      let t=addMins(anchor.startTime,bDur(anchor));
      const cascaded=remaining.map((b,i)=>{if(i<pivotIdx)return b;const nb={...b,startTime:t};t=addMins(t,bDur(b));return nb;});
      onUpdate({...day,blocks:cascaded});
    }else{
      onUpdate({...day,blocks:remaining});
    }
  };
  const moveBlockToDayBank=(block)=>{
    const bankItem={id:uid(),name:block.customName||block.title||'פעילות',customName:block.customName||undefined,address:block.location||'',
      lat:block.lat||null,lng:block.lng||null,placeId:block.placeId||'',
      rating:block.placeRating||null,placeType:block.placeType||'',
      openStatus:block.placeOpenStatus||'',todayHours:block.placeTodayHours||'',
      phone:block.placePhone||'',website:block.placeWebsite||''};
    onUpdate({...day,blocks:day.blocks.filter(b=>b.id!==block.id),dayBank:[...(day.dayBank||[]),bankItem]});
    toast(`"${block.customName||block.title||'פעילות'}" הועבר לבנק היומי 📌`,'success');
  };
  const addSuggestedItems=items=>{
    const existKeys=new Set((day.dayBank||[]).map(i=>i.placeId?'p:'+i.placeId:'n:'+(i.name||'').trim().toLowerCase()));
    const toAdd=items
      .filter(i=>i.placeId?!existKeys.has('p:'+i.placeId):!existKeys.has('n:'+(i.name||'').trim().toLowerCase()))
      .map(i=>({...i,id:uid()}));
    if(!toAdd.length)return;
    onUpdate({...day,dayBank:[...(day.dayBank||[]),...toAdd]});
    toast(toAdd.length===1?`"${toAdd[0].customName||toAdd[0].name}" נוסף לבנק היומי ✨`:`${toAdd.length} מקומות נוספו לבנק היומי ✨`,'success');
  };
  const handleDrop=(toIdx)=>{
    const from=dragIdxRef.current;
    dragIdxRef.current=null;setDragOver(null);
    if(from===null||from===toIdx)return;
    if(sorted[from]?.isAutoTravel)return; // נסיעות אוטומטיות לא ניתנות להזזה
    const arr=[...sorted];
    const[moved]=arr.splice(from,1);
    arr.splice(toIdx,0,moved);
    // הסרת בלוקי נסיעה אוטומטיים שהפכו לא-רלוונטיים — OSRM יציע מחדש
    const clean=arr.filter(b=>!b.isAutoTravel);
    if(!clean.length)return;
    let t=clean[0].startTime;
    const reordered=clean.map(b=>{const nb={...b,startTime:t};t=addMins(t,bDur(b));return nb;});
    onUpdate({...day,blocks:reordered});
  };
  const addBlock=type=>{
    setBankPickForBlock({type}); // show bank / map / manual picker
  };
  const addEmptyBlock=type=>{
    setBankPickForBlock(null);
    const s=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const last=s[s.length-1];
    const start=last?addMins(last.startTime,bDur(last)):(day.currentTime||'09:00');
    onUpdate({...day,blocks:[...day.blocks,defaultBlock(type,start)]});
  };
  const bankPickedForBlock=(item,type)=>{
    setBankPickForBlock(null);
    const s=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const last=s[s.length-1];
    const start=last?addMins(last.startTime,bDur(last)):(day.currentTime||'09:00');
    const block={
      ...defaultBlock(type,start),
      title:item.customName||item.name||'',location:item.address||'',
      lat:item.lat||null,lng:item.lng||null,placeId:item.placeId||'',
      notes:item.note||'',
      placeRating:item.rating||null,placeUserRatings:item.userRatingsTotal||null,
      placeOpenStatus:item.openStatus||'',placeTodayHours:item.todayHours||'',
      placePhone:item.phone||'',placeWebsite:item.website||'',
      placePhotoUrl:item.photoUrl||'',placeType:item.placeType||'',
    };
    onUpdate({...day,blocks:[...day.blocks,block]});
  };
  const total=day.blocks.reduce((s,b)=>s+(b.cost||0),0);
  const done=day.blocks.filter(b=>b.isCompleted).length;
  const sorted=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
  // מספור לטיימליין — תואם מספרי פינים במפה (ללא autoTravel, רק פעילויות עם קואורדינטות)
  let _mn=0; const _mapNums=sorted.map(bl=>(bl.lat&&bl.lng&&!bl.isAutoTravel)?++_mn:null);
  const dayColor=DAY_COLORS[idx%DAY_COLORS.length];
  // מציאת נקודות מוצא/יעד של בלוק נסיעה והעברתן למפה
  const focusRoute=React.useCallback((block)=>{
    if(!onFocusRoute)return;
    const bi=sorted.indexOf(block);
    let fromLat,fromLng,toLat,toLng;
    for(let i=bi-1;i>=0;i--){if(!sorted[i].isAutoTravel&&sorted[i].lat&&sorted[i].lng){fromLat=sorted[i].lat;fromLng=sorted[i].lng;break;}}
    if(!fromLat&&day.startLat&&day.startLng){fromLat=day.startLat;fromLng=day.startLng;}
    for(let i=bi+1;i<sorted.length;i++){if(!sorted[i].isAutoTravel&&sorted[i].lat&&sorted[i].lng){toLat=sorted[i].lat;toLng=sorted[i].lng;break;}}
    if(!toLat&&day.endLat&&day.endLng){toLat=day.endLat;toLng=day.endLng;}
    if(fromLat&&toLat)onFocusRoute({fromLat,fromLng,toLat,toLng,isTransit:!!block.isTransit,isWalking:!!block.isWalking,dayId:day.id});
  },[sorted,day,onFocusRoute]);
  const hasMapBlocks=day.blocks.some(b=>b.lat&&b.lng)||(day.startLat&&day.startLng)||(day.endLat&&day.endLng);

  // מזג אוויר — נקודת יעד היום, ואם אין — מיקום נוכחי
  const[dayWx,setDayWx]=useState(null);
  const[transitSearch,setTransitSearch]=useState(null);
  useEffect(()=>{
    setDayWx(null);
    if(!day.date)return;
    let cancelled=false;
    (async()=>{
      const lat=day.endLat,lng=day.endLng;
      const pos=lat&&lng?{lat,lng}:await getUserLoc();
      if(!pos||cancelled)return;
      const wx=await fetchWeatherDay(pos.lat,pos.lng,day.date);
      if(wx&&!cancelled)setDayWx(wx);
    })();
    return()=>{cancelled=true;};
  },[day.id,day.endLat,day.endLng,day.date]);// eslint-disable-next-line react-hooks/exhaustive-deps

  /* ── cascade / end-time helpers ── */
  const toMinsD=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;};
  // תומך בפורמט מובייל (endTime) ובפורמט דסקטופ (durationMins)
  const bDur=b=>{
    if(b.durationMins!=null)return b.durationMins;
    if(b.startTime&&b.endTime)return Math.max(0,toMinsD(b.endTime)-toMinsD(b.startTime));
    return 60;
  };
  // החלפת פריט בנק יומי עם בלוק קיים בלוז — הבלוק הישן חוזר לבנק היומי
  const executeSwap=(targetBlock)=>{
    if(!swapSrc)return;
    const nb={
      id:uid(),type:'activity',
      title:swapSrc.customName||swapSrc.name,location:swapSrc.address||'',
      startTime:targetBlock.startTime,durationMins:bDur(targetBlock),
      lat:swapSrc.lat||null,lng:swapSrc.lng||null,
      placeId:swapSrc.placeId||'',
      placeRating:swapSrc.rating||null,placeType:swapSrc.placeType||'',
      placeOpenStatus:swapSrc.openStatus||'',placeTodayHours:swapSrc.todayHours||'',
      placePhone:swapSrc.phone||'',placeWebsite:swapSrc.website||'',
      notes:swapSrc.note||'',isCompleted:false,rating:0,cost:0,
    };
    const oldItem={
      id:uid(),name:targetBlock.title||'פעילות',
      address:targetBlock.location||'',
      lat:targetBlock.lat||null,lng:targetBlock.lng||null,
      placeId:targetBlock.placeId||'',
      note:targetBlock.notes||'',
      rating:targetBlock.placeRating||null,placeType:targetBlock.placeType||'',
      openStatus:targetBlock.placeOpenStatus||'',todayHours:targetBlock.placeTodayHours||'',
      phone:targetBlock.placePhone||'',website:targetBlock.placeWebsite||'',
    };
    const newBlocks=(day.blocks||[]).map(b=>b.id===targetBlock.id?nb:b);
    const newDayBank=[...(day.dayBank||[]).filter(i=>i.id!==swapSrc.id),oldItem];
    onUpdate({...day,blocks:newBlocks,dayBank:newDayBank});
    setSwapSrc(null);
    toast(`"${swapSrc.customName||swapSrc.name}" הוחלף עם "${targetBlock.customName||targetBlock.title||'פעילות'}" 🔄`,'success');
  };

  const cascadeBlocks=()=>{
    if(!sorted.length)return;
    const delta=toMinsD(day.startTime||'08:00')-toMinsD(sorted[0].startTime);
    if(delta===0){toast('הפעילויות כבר מסונכרנות ✓','success');return;}
    let t=day.startTime||'08:00';
    const reordered=sorted.map(b=>{const d=bDur(b);const nb={...b,startTime:t,endTime:addMins(t,d)};t=addMins(t,d);return nb;});
    onUpdate({...day,blocks:reordered});
    toast(`שעות עודכנו ${delta>0?'+':''}${delta} דקות ✓`,'success');
  };
  // קשר פעילויות — עדכן שעות של הבאים החל מ-fromIdx
  const cascadeFrom=(fromIdx)=>{
    if(fromIdx<=0||fromIdx>=sorted.length)return;
    const prevEnd=addMins(sorted[fromIdx-1].startTime,bDur(sorted[fromIdx-1]));
    let t=prevEnd;
    const tail=sorted.slice(fromIdx).map(b=>{const d=bDur(b);const nb={...b,startTime:t,endTime:addMins(t,d)};t=addMins(t,d);return nb;});
    const ids=new Set(tail.map(b=>b.id));
    onUpdate({...day,blocks:[...day.blocks.filter(b=>!ids.has(b.id)),...tail]});
    toast('פעילויות קושרו ✓','success');
  };
  // שמירה עם עדכון שרשרתי של כל הבאים
  const cascadeSave=(updBlock)=>{
    const si=sorted.findIndex(b=>b.id===updBlock.id);
    const blocksUpd=day.blocks.map(b=>b.id===updBlock.id?updBlock:b);
    if(si<0){onUpdate({...day,blocks:blocksUpd});return;}
    const sortedUpd=[...blocksUpd].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const siNew=sortedUpd.findIndex(b=>b.id===updBlock.id);
    let t=addMins(updBlock.startTime,bDur(updBlock));
    const tail=sortedUpd.slice(siNew+1).map(b=>{const d=bDur(b);const nb={...b,startTime:t,endTime:addMins(t,d)};t=addMins(t,d);return nb;});
    const ids=new Set(tail.map(b=>b.id));
    onUpdate({...day,blocks:[...blocksUpd.filter(b=>!ids.has(b.id)),...tail]});
    toast('שעות עודכנו ✓','success');
  };
  // ניתוק + cascade — מסיר נסיעה אוטומטית לפני הבלוק ומעדכן שרשרת
  const cascadeSaveUnlink=(updBlock)=>{
    const si=sorted.findIndex(b=>b.id===updBlock.id);
    let blocksUpd=day.blocks.map(b=>b.id===updBlock.id?updBlock:b);
    if(si>0&&sorted[si-1].isAutoTravel)blocksUpd=blocksUpd.filter(b=>b.id!==sorted[si-1].id);
    const sortedUpd=[...blocksUpd].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const siNew=sortedUpd.findIndex(b=>b.id===updBlock.id);
    let t=addMins(updBlock.startTime,bDur(updBlock));
    const tail=sortedUpd.slice(siNew+1).map(b=>{const d=bDur(b);const nb={...b,startTime:t,endTime:addMins(t,d)};t=addMins(t,d);return nb;});
    const ids=new Set(tail.map(b=>b.id));
    onUpdate({...day,blocks:[...blocksUpd.filter(b=>!ids.has(b.id)),...tail]});
    toast('קשר נותק ושעות עודכנו ✓','success');
  };
  const pickLocationItem=(item,field)=>{
    onUpdate({...day,
      ...(field==='start'
        ?{startLocation:item.customName||item.name,startLat:item.lat||null,startLng:item.lng||null,startPending:false}
        :{endLocation:item.customName||item.name,endLat:item.lat||null,endLng:item.lng||null})
    });
    setLocationPicking(null);
    toast(`${field==='start'?'נקודת מוצא':'נקודת יעד'} עודכנה ✓`,'success');
  };
  const lastSortedBlock=sorted[sorted.length-1];
  const dayEndMins=toMinsD(day.endTime||'20:00');
  const lastEndMins=lastSortedBlock?toMinsD(lastSortedBlock.startTime)+bDur(lastSortedBlock):0;
  const overrunMins=lastEndMins-dayEndMins;
  const cascadeNeeded=sorted.length>0&&toMinsD(sorted[0].startTime)!==toMinsD(day.startTime||'08:00');

  /* ── OSRM travel times (including start/end location) ── */
  const blocksKey=sorted.map(b=>b.id).join(',');
  // helper: approximate straight-line distance in km
  const distKm=(a,b)=>{const dLat=a.lat-b.lat,dLng=(a.lng-b.lng)*Math.cos(a.lat*Math.PI/180);return Math.sqrt(dLat*dLat+dLng*dLng)*111;};
  useEffect(()=>{
    setTravelTimes({});
    if(sorted.length<1)return;
    let cancelled=false;
    const getC=b=>(b.lat&&b.lng?{lat:b.lat,lng:b.lng}:null);
    (async()=>{
      // start location → first block
      if(day.startLat&&day.startLng&&sorted[0].type!=='travel'){
        const fc=getC(sorted[0]);
        if(fc&&!cancelled){
          const key=`__start__->${sorted[0].id}`;
          setTravelTimes(prev=>({...prev,[key]:{loading:true,min:null}}));
          const res=await fetchOsrmMinutes(day.startLat,day.startLng,fc.lat,fc.lng)||{min:null,km:null};
          if(!cancelled)setTravelTimes(prev=>({...prev,[key]:{loading:false,min:res.min,km:res.km}}));
          // walking time (only if close enough)
          const startC={lat:day.startLat,lng:day.startLng};
          if(!cancelled&&distKm(startC,fc)<=10){
            const wkey=`walk:__start__->${sorted[0].id}`;
            setTravelTimes(prev=>({...prev,[wkey]:{loading:true,min:null}}));
            const wres=await fetchOsrmMinutes(day.startLat,day.startLng,fc.lat,fc.lng,'foot')||{min:null};
            if(!cancelled)setTravelTimes(prev=>({...prev,[wkey]:{loading:false,min:wres.min}}));
          }
        }
      }
      // between consecutive blocks
      for(let i=0;i<sorted.length-1;i++){
        if(cancelled)break;
        const a=sorted[i],nb=sorted[i+1];
        if(a.type==='travel'||nb.type==='travel')continue;
        const ac=getC(a),bc=getC(nb);
        if(!ac||!bc)continue;
        const key=`${a.id}->${nb.id}`;
        setTravelTimes(prev=>({...prev,[key]:{loading:true,min:null}}));
        const res=await fetchOsrmMinutes(ac.lat,ac.lng,bc.lat,bc.lng)||{min:null,km:null};
        if(!cancelled)setTravelTimes(prev=>({...prev,[key]:{loading:false,min:res.min,km:res.km}}));
        // walking time (only if close enough)
        if(!cancelled&&distKm(ac,bc)<=10){
          const wkey=`walk:${a.id}->${nb.id}`;
          setTravelTimes(prev=>({...prev,[wkey]:{loading:true,min:null}}));
          const wres=await fetchOsrmMinutes(ac.lat,ac.lng,bc.lat,bc.lng,'foot')||{min:null};
          if(!cancelled)setTravelTimes(prev=>({...prev,[wkey]:{loading:false,min:wres.min}}));
        }
      }
      // last block → end location
      const last=sorted[sorted.length-1];
      if(day.endLat&&day.endLng&&last.type!=='travel'){
        const lc=getC(last);
        if(lc&&!cancelled){
          const key=`${last.id}->__end__`;
          setTravelTimes(prev=>({...prev,[key]:{loading:true,min:null}}));
          const res=await fetchOsrmMinutes(lc.lat,lc.lng,day.endLat,day.endLng)||{min:null,km:null};
          if(!cancelled)setTravelTimes(prev=>({...prev,[key]:{loading:false,min:res.min,km:res.km}}));
          // walking time
          const endC={lat:day.endLat,lng:day.endLng};
          if(!cancelled&&distKm(lc,endC)<=10){
            const wkey=`walk:${last.id}->__end__`;
            setTravelTimes(prev=>({...prev,[wkey]:{loading:true,min:null}}));
            const wres=await fetchOsrmMinutes(lc.lat,lc.lng,day.endLat,day.endLng,'foot')||{min:null};
            if(!cancelled)setTravelTimes(prev=>({...prev,[wkey]:{loading:false,min:wres.min}}));
          }
        }
      }
    })();
    return()=>{cancelled=true;};
  },[blocksKey,day.startLat,day.startLng,day.endLat,day.endLng]);// eslint-disable-next-line react-hooks/exhaustive-deps

  /* ── תחבורה ציבורית ── */
  const getVehicleIcon=t=>({BUS:'🚌',RAIL:'🚆',SUBWAY:'🚇',TRAM:'🚊',FERRY:'⛴️',HEAVY_RAIL:'🚆',HIGH_SPEED_TRAIN:'🚅',COMMUTER_TRAIN:'🚃',METRO_RAIL:'🚇',MONORAIL:'🚝',CABLE_CAR:'🚡'}[t]||'🚌');
  const searchTransit=(fromBlock,toBlock,insertMode='between')=>{
    if(!window.google?.maps?.DirectionsService){toast('Google Maps לא זמין','error');return;}
    const{lat:fLat,lng:fLng}=fromBlock,{lat:tLat,lng:tLng}=toBlock;
    if(!fLat||!fLng||!tLat||!tLng){toast('חסרים נתוני מיקום','error');return;}
    setTransitSearch({loading:true,fromBlockIdx:sorted.indexOf(fromBlock),insertMode,fromLat:fLat,fromLng:fLng,toLat:tLat,toLng:tLng,results:null,error:null});
    let dep=new Date();
    if(day.date&&fromBlock.startTime){const dMins=bDur(fromBlock);const t=new Date(day.date+'T'+addMins(fromBlock.startTime,dMins)+':00');if(!isNaN(t)&&t>new Date())dep=t;}
    const tRouteOpts={departureTime:dep};
    if(window.google.maps.TransitRoutePreference?.FEWER_TRANSFERS)tRouteOpts.routingPreference=window.google.maps.TransitRoutePreference.FEWER_TRANSFERS;
    new window.google.maps.DirectionsService().route({
      origin:{lat:fLat,lng:fLng},destination:{lat:tLat,lng:tLng},
      travelMode:window.google.maps.TravelMode.TRANSIT,
      transitOptions:tRouteOpts,
      provideRouteAlternatives:true,
    },(result,status)=>{
      if(status!=='OK'||!result?.routes?.length){
        console.warn('[transit]',status,result);
        const errMsg=status==='REQUEST_DENIED'
          ?'REQUEST_DENIED — נסיעות רכב עובדות כי הן משתמשות ב-OSRM (ללא Google). תחבורה ציבורית משתמשת ב-Directions API של Google. יש לוודא: ב-Google Cloud Console → Credentials → לחץ על מפתח ה-API → "API restrictions" → הוסף "Directions API" לרשימת ה-APIs המורשים למפתח.'
          :`לא נמצאו קווים בין הנקודות האלה (${status})`;
        setTransitSearch(p=>p?{...p,loading:false,results:null,error:errMsg}:null);return;
      }
      const routes=result.routes.map(r=>{
        const leg=r.legs[0];
        const durationMins=Math.ceil(leg.duration.value/60);
        const steps=(leg.steps||[])
          .filter(s=>s.travel_mode==='TRANSIT'||s.travel_mode==='WALKING')
          .map(s=>s.travel_mode==='WALKING'
            ?{type:'walk',icon:'🚶',durationMins:Math.ceil((s.duration?.value||0)/60),distanceM:s.distance?.value||0}
            :{type:'transit',icon:getVehicleIcon(s.transit.line.vehicle.type),
              lineName:s.transit.line.name||s.transit.line.short_name||'',
              lineShort:s.transit.line.short_name||'',
              departure:s.transit.departure_stop?.name||'',
              arrival:s.transit.arrival_stop?.name||'',
              numStops:s.transit.num_stops||0,
              durationMins:Math.ceil((s.duration?.value||0)/60)});
        const ts=steps.filter(s=>s.type==='transit');
        const summary=ts.map(s=>`${s.icon}${s.lineShort||s.lineName}`).join('+');
        return{durationMins,summary,transfers:Math.max(0,ts.length-1),steps};
      });
      setTransitSearch(p=>p?{...p,loading:false,results:routes,error:null}:null);
    });
  };
  const searchWalking=(fromBlock,toBlock,insertMode='between')=>{
    if(!window.google?.maps?.DirectionsService){toast('Google Maps לא זמין','error');return;}
    const{lat:fLat,lng:fLng}=fromBlock,{lat:tLat,lng:tLng}=toBlock;
    if(!fLat||!fLng||!tLat||!tLng){toast('חסרים נתוני מיקום','error');return;}
    setTransitSearch({loading:true,fromBlockIdx:sorted.indexOf(fromBlock),insertMode,
      fromLat:fLat,fromLng:fLng,toLat:tLat,toLng:tLng,results:null,error:null,isWalking:true});
    new window.google.maps.DirectionsService().route({
      origin:{lat:fLat,lng:fLng},destination:{lat:tLat,lng:tLng},
      travelMode:window.google.maps.TravelMode.WALKING,
      provideRouteAlternatives:true,
    },(result,status)=>{
      if(status!=='OK'||!result?.routes?.length){
        const errMsg=status==='REQUEST_DENIED'
          ?'REQUEST_DENIED — יש לוודא ש-Directions API מופעל במפתח ה-API שלך'
          :`לא נמצא מסלול הליכה (${status})`;
        setTransitSearch(p=>p?{...p,loading:false,results:null,error:errMsg}:null);return;
      }
      const routes=result.routes.map(r=>{
        const leg=r.legs[0];
        const durationMins=Math.ceil(leg.duration.value/60);
        const distanceM=leg.distance?.value||0;
        const distanceText=distanceM>=1000?(distanceM/1000).toFixed(1)+'ק"מ':distanceM+'מ\'';
        const steps=(leg.steps||[]).map(s=>({
          type:'walk_step',
          instruction:(s.html_instructions||'').replace(/<[^>]+>/g,'').trim(),
          durationMins:Math.ceil((s.duration?.value||0)/60),
          distanceM:s.distance?.value||0,
        }));
        return{durationMins,distanceM,distanceText,steps};
      });
      setTransitSearch(p=>p?{...p,loading:false,results:routes,error:null}:null);
    });
  };
  const insertWalkingRouteBlock=(afterBlock,route)=>{
    const si=sorted.findIndex(b=>b.id===afterBlock.id);
    const travelStart=addMins(afterBlock.startTime,bDur(afterBlock));
    const nb={id:uid(),type:'travel',title:`🚶 הליכה (~${fmtTravelMin(route.durationMins)}${route.distanceText?', '+route.distanceText:''})`,
      startTime:travelStart,durationMins:route.durationMins,notes:'',
      isAutoTravel:true,isWalking:true};
    let t=addMins(travelStart,route.durationMins);
    const tail=sorted.slice(si+1).map(b2=>{const s={...b2,startTime:t};t=addMins(t,bDur(b2));return s;});
    onUpdate({...day,blocks:[...sorted.slice(0,si+1),nb,...tail]});
    setTransitSearch(null);toast(`🚶 הליכה נוספה`,'success');
  };
  const insertWalkingRouteBlockStart=(route)=>{
    if(!sorted.length)return;
    const firstStart=sorted[0].startTime;
    const nb={id:uid(),type:'travel',title:`🚶 הליכה (~${fmtTravelMin(route.durationMins)}${route.distanceText?', '+route.distanceText:''})`,
      startTime:firstStart,durationMins:route.durationMins,notes:'',
      isAutoTravel:true,isWalking:true};
    const shifted=day.blocks.map(b=>({...b,startTime:addMins(b.startTime,route.durationMins)}));
    onUpdate({...day,blocks:[nb,...shifted]});
    setTransitSearch(null);toast(`🚶 הליכה נוספה לתחילת הלוז`,'success');
  };
  const insertWalkingRouteBlockEnd=(route)=>{
    if(!sorted.length)return;
    const last2=sorted[sorted.length-1];
    const travelStart=addMins(last2.startTime,bDur(last2));
    const nb={id:uid(),type:'travel',title:`🚶 הליכה (~${fmtTravelMin(route.durationMins)}${route.distanceText?', '+route.distanceText:''})`,
      startTime:travelStart,durationMins:route.durationMins,notes:'',
      isAutoTravel:true,isWalking:true};
    onUpdate({...day,blocks:[...day.blocks,nb]});
    setTransitSearch(null);toast(`🚶 הליכה נוספה לסיום הלוז`,'success');
  };
  const fmtTransitNotes=steps=>steps.map(s=>
    s.type==='walk'
      ?`🚶 ${s.durationMins} דק' הליכה${s.distanceM>=50?' ('+( s.distanceM>=1000?(s.distanceM/1000).toFixed(1)+'ק"מ':s.distanceM+'מ\'')+')'  :''}`
      :`${s.icon} ${s.lineName||s.lineShort}: ${s.departure}→${s.arrival}${s.numStops>0?` (${s.numStops} תח')`:''}`
  ).join(' | ');
  const transitFirstIcon=steps=>{const t=steps.find(s=>s.type==='transit');return t?.icon||'🚌';};
  const insertTransitBlock=(afterBlock,route)=>{
    const si=sorted.findIndex(b=>b.id===afterBlock.id);
    const travelStart=addMins(afterBlock.startTime,bDur(afterBlock));
    const nb={id:uid(),type:'travel',
      title:`${route.summary} (~${fmtTravelMin(route.durationMins)})`,
      startTime:travelStart,durationMins:route.durationMins,
      notes:fmtTransitNotes(route.steps),isAutoTravel:true,isTransit:true};
    let t=addMins(travelStart,route.durationMins);
    const tail=sorted.slice(si+1).map(b2=>{const s={...b2,startTime:t};t=addMins(t,bDur(b2));return s;});
    onUpdate({...day,blocks:[...sorted.slice(0,si+1),nb,...tail]});
    setTransitSearch(null);
    toast(`${transitFirstIcon(route.steps)} קו תחבורה נוסף`,'success');
  };
  const insertTransitBlockStart=(route)=>{
    if(!sorted.length)return;
    const firstStart=sorted[0].startTime;
    const nb={id:uid(),type:'travel',
      title:`${route.summary} (~${fmtTravelMin(route.durationMins)})`,
      startTime:firstStart,durationMins:route.durationMins,
      notes:fmtTransitNotes(route.steps),isAutoTravel:true,isTransit:true};
    const shifted=day.blocks.map(b=>({...b,startTime:addMins(b.startTime,route.durationMins)}));
    onUpdate({...day,blocks:[nb,...shifted]});
    setTransitSearch(null);
    toast(`${transitFirstIcon(route.steps)} קו תחבורה נוסף לתחילת הלוז`,'success');
  };
  const insertTransitBlockEnd=(route)=>{
    if(!sorted.length)return;
    const last2=sorted[sorted.length-1];
    const travelStart=addMins(last2.startTime,bDur(last2));
    const nb={id:uid(),type:'travel',
      title:`${route.summary} (~${fmtTravelMin(route.durationMins)})`,
      startTime:travelStart,durationMins:route.durationMins,
      notes:fmtTransitNotes(route.steps),isAutoTravel:true,isTransit:true};
    onUpdate({...day,blocks:[...day.blocks,nb]});
    setTransitSearch(null);
    toast(`${transitFirstIcon(route.steps)} קו תחבורה נוסף לסיום הלוז`,'success');
  };

  return <div className="card" data-day-id={day.id} style={{marginBottom:12,animation:'fadeIn .3s ease'}}>
    <div className="day-header" onClick={()=>setOpen(o=>!o)}>
      <span style={{fontSize:20,color:dayColor}}>📅</span>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:14}}>
          יום {idx+1}{day.date?` — ${dateStr(day.date)}`:''}
          {dayWx&&<span style={{fontWeight:400,fontSize:11,color:'var(--text3)',marginRight:6,opacity:.85}}>{WMO[dayWx.code]?.[0]||'🌡️'}{dayWx.tMax}°</span>}
        </div>
        {/* תצוגת מסלול: מוצא → יעד */}
        {(day.startLocation||day.endLocation)
          ?<div style={{fontSize:11,color:'var(--text3)',display:'flex',alignItems:'baseline',gap:4,flexWrap:'wrap',marginTop:2}}>
              {day.startLocation
                ?<span style={{color:day.startPending?'var(--amber)':'var(--green)',fontWeight:600,whiteSpace:'nowrap'}}>
                    {day.startPending?'❓':'🟢'} {day.startLocation}
                    {day.startTime&&<span style={{fontWeight:400,fontSize:9,opacity:.75,marginRight:2}}> {day.startTime}</span>}
                  </span>
                :<span style={{color:'var(--text3)'}}>🟢 —</span>}
              <span style={{color:'var(--text3)',flexShrink:0}}>→</span>
              {day.endLocation
                ?<span style={{color:'var(--red)',fontWeight:600,whiteSpace:'nowrap'}}>
                    🔴 {day.endLocation}
                    {day.endTime&&<span style={{fontWeight:400,fontSize:9,opacity:.75,marginRight:2}}> {day.endTime}</span>}
                  </span>
                :<span style={{color:'var(--text3)'}}>🔴 —</span>}
            </div>
          :day.location&&<div style={{fontSize:11,color:'var(--text3)'}}>📍 {day.location}</div>
        }
      </div>
      <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
        {day.blocks.length>0&&<span className="chip chip-blue" style={{fontSize:9,padding:'1px 5px'}}>{done}/{day.blocks.length}</span>}
        {total>0&&<span style={{fontSize:10,color:'var(--amber)'}}>₪{total.toFixed(0)}</span>}
        {onToggleVisibility&&(()=>{
          // 3 מצבים: all=כולם גלויים, on=יום זה נבחר, off=יום זה מוסתר
          const st=allDaysVisible?'all':dayVisible?'on':'off';
          const styles={
            all:{background:'var(--bg2)',color:'var(--text3)',border:'1px solid var(--border)'},
            on: {background:dayColor,color:'#fff',border:`1px solid ${dayColor}`,boxShadow:`0 0 0 2px ${dayColor}44`},
            off:{background:'var(--bg2)',color:'var(--text3)',border:'1px solid var(--border)',opacity:.35},
          };
          const titles={
            all:'לחץ להתמקד ביום זה בלבד',
            on: 'יום זה נבחר — לחץ לבטל בחירה',
            off:'יום זה מוסתר — לחץ להציג',
          };
          return(
            <button title={titles[st]}
              style={{...styles[st],fontSize:12,padding:'2px 6px',lineHeight:1,borderRadius:6,cursor:'pointer',transition:'all .15s'}}
              onClick={e=>{e.stopPropagation();onToggleVisibility(day.id);}}>
              {st==='off'?'🙈':'👁️'}
            </button>
          );
        })()}
        <span style={{color:'var(--text3)',fontSize:11}}>{open?'▼':'◀'}</span>
      </div>
    </div>

    {open&&<div style={{padding:'14px 16px'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:12}}>
        <div><label className="label">תאריך</label>
          <input className="input" type="date" value={day.date} onChange={e=>onUpdate({...day,date:e.target.value})}/></div>
        <div><label className="label">מיקום / אתר לינה</label>
          <input className="input" value={day.location} onChange={e=>onUpdate({...day,location:e.target.value})} placeholder="עיר / אתר קמפינג"/></div>
      </div>

      {/* ── נקודת מוצא ויעד ── */}
      <div style={{background:'var(--bg3)',borderRadius:10,padding:12,marginBottom:12}}>
        <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:8}}>🗺️ מסלול היום</div>
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {/* מוצא */}
          <div>
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <span style={{fontSize:11,color:'var(--green)',fontWeight:700,width:42,flexShrink:0}}>🟢 מוצא</span>
              <input className="input" style={{flex:1,minWidth:0,
                background:day.startPending?'rgba(234,179,8,0.13)':'',
                borderColor:day.startPending?'var(--amber)':''}}
                value={day.startLocation}
                onChange={e=>onUpdate({...day,startLocation:e.target.value,startPending:false})}
                placeholder="מאיפה יוצאים..."/>
              <div style={{display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                <input type="time" value={day.startTime||'08:00'}
                  onChange={e=>onUpdate({...day,startTime:e.target.value})}
                  style={{width:58,background:'var(--bg2)',border:'1px solid var(--border)',
                    color:'var(--text)',borderRadius:6,padding:'4px 2px',fontSize:11,
                    fontFamily:'Heebo,sans-serif'}}/>
                <button title="בחר מהבנק או מהמפה" onClick={()=>setLocationPicking({field:'start'})}
                  className="btn btn-secondary btn-icon btn-sm" style={{fontSize:12,padding:'3px 5px'}}>📍</button>
                {day.startLat&&day.startLng&&<button title="הצג במפה הפנימית"
                  style={{background:'none',border:'1px solid var(--border)',borderRadius:6,cursor:'pointer',padding:'3px 5px',fontSize:12}}
                  onClick={()=>window.__gmFocus?.(day.startLat,day.startLng,16)}>🗺️</button>}
                {day.startLat&&day.startLng&&<GLink lat={day.startLat} lng={day.startLng}/>}
              </div>
            </div>
            {cascadeNeeded&&(
              <div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,paddingRight:52}}>
                <span style={{fontSize:11,color:'var(--text3)',flex:1}}>פעילות ראשונה ב-{sorted[0].startTime} — שעה שונה מהיום</span>
                <button className="btn btn-sm" style={{padding:'2px 8px',fontSize:11,
                  background:'rgba(79,142,247,.12)',color:'var(--accent)',border:'1px solid var(--accent)',borderRadius:5,cursor:'pointer'}}
                  onClick={cascadeBlocks}>↕ הזז הכל</button>
              </div>
            )}
            {day.startPending&&<div style={{display:'flex',alignItems:'center',gap:6,marginTop:4,paddingRight:52}}>
              <span style={{fontSize:11,color:'var(--amber)',flex:1}}>❓ הועתק מיעד אתמול — לאשר?</span>
              <button className="btn btn-sm" style={{padding:'1px 8px',fontSize:11,
                background:'var(--amber)',color:'#000',border:'none',borderRadius:5,cursor:'pointer'}}
                onClick={()=>onUpdate({...day,startPending:false})}>✓ אשר</button>
              <button className="btn btn-sm" style={{padding:'1px 8px',fontSize:11,
                background:'var(--bg2)',color:'var(--text)',border:'1px solid var(--border)',borderRadius:5,cursor:'pointer'}}
                onClick={()=>onUpdate({...day,startLocation:'',startPending:false})}>✕ נקה</button>
            </div>}
          </div>
          {/* יעד */}
          <div>
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              <span style={{fontSize:11,color:'var(--red)',fontWeight:700,width:42,flexShrink:0}}>🔴 יעד</span>
              <input className="input" style={{flex:1,minWidth:0}}
                value={day.endLocation}
                onChange={e=>onUpdate({...day,endLocation:e.target.value})}
                placeholder="לאן מגיעים..."/>
              <div style={{display:'flex',alignItems:'center',gap:2,flexShrink:0}}>
                <input type="time" value={day.endTime||'20:00'}
                  onChange={e=>onUpdate({...day,endTime:e.target.value})}
                  style={{width:58,background:'var(--bg2)',border:'1px solid var(--border)',
                    color:'var(--text)',borderRadius:6,padding:'4px 2px',fontSize:11,
                    fontFamily:'Heebo,sans-serif'}}/>
                <button title="בחר מהבנק או מהמפה" onClick={()=>setLocationPicking({field:'end'})}
                  className="btn btn-secondary btn-icon btn-sm" style={{fontSize:12,padding:'3px 5px'}}>📍</button>
                {day.endLat&&day.endLng&&<button title="הצג במפה הפנימית"
                  style={{background:'none',border:'1px solid var(--border)',borderRadius:6,cursor:'pointer',padding:'3px 5px',fontSize:12}}
                  onClick={()=>window.__gmFocus?.(day.endLat,day.endLng,16)}>🗺️</button>}
                {day.endLat&&day.endLng&&<GLink lat={day.endLat} lng={day.endLng}/>}
              </div>
            </div>
            {overrunMins>0&&(
              <div style={{display:'flex',alignItems:'center',gap:6,marginTop:5}}>
                <span style={{fontSize:11,color:'var(--amber)'}}>
                  ⚠️ הלוז חורג מזמן הסיום ({day.endTime}) ב-<b>{fmtTravelMin(overrunMins)}</b>
                  {lastSortedBlock&&` (אחרון: ${addMins(lastSortedBlock.startTime,bDur(lastSortedBlock))})`}
                </span>
              </div>
            )}
          </div>
        </div>
      </div>

      <Weather coordinates={day.endLat&&day.endLng?{lat:day.endLat,lng:day.endLng}:null} location={day.endLocation||day.location}/>

      <div className="timeline">
        {swapSrc&&(
          <div style={{background:'rgba(245,158,11,.12)',border:'1px solid rgba(245,158,11,.45)',
            borderRadius:8,padding:'7px 10px',marginBottom:6,display:'flex',alignItems:'center',gap:8}}>
            <span>🔄</span>
            <span style={{flex:1,fontSize:11,fontWeight:700,color:'#d97706'}}>
              לחץ על פעילות בלו"ז להחלפה עם "{swapSrc.customName||swapSrc.name}"
            </span>
            <button onClick={()=>setSwapSrc(null)}
              style={{background:'none',border:'none',cursor:'pointer',fontSize:13,
                color:'var(--text3)',padding:'0 3px',lineHeight:1}}>✕</button>
          </div>
        )}
        {sorted.length===0&&<div style={{padding:'12px 0',color:'var(--text3)',fontSize:13,textAlign:'center'}}>אין בלוקים עדיין — הוסף בלוק למטה</div>}
        {(()=>{
          /* קו "עכשיו" — מחושב לפי השעה הנוכחית ביחס לבלוקים */
          const toMins=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;};
          const nowMins=toMins(nowTime());
          const isToday=!day.date||day.date===todayISO();

          /* מצא בלוק פעיל — כשהשעה הנוכחית בתוך משך הבלוק */
          let activeIdx=-1;
          let nowBlockProgress=null;
          /* מצא נקודת הוספה בין בלוקים (כאשר אין בלוק פעיל) */
          let nowInsert=-1;

          if(isToday&&sorted.length>0){
            const firstMins=toMins(sorted[0].startTime);
            const lastEnd=toMins(sorted[sorted.length-1].startTime)+bDur(sorted[sorted.length-1]);
            if(nowMins>=firstMins-5&&nowMins<=lastEnd+30){
              /* בדוק האם השעה בתוך בלוק כלשהו */
              activeIdx=sorted.findIndex(b=>{
                const s=toMins(b.startTime);
                return nowMins>=s&&nowMins<s+bDur(b);
              });
              if(activeIdx>=0){
                /* חשב התקדמות יחסית בתוך הבלוק (0–1) */
                const s=toMins(sorted[activeIdx].startTime);
                nowBlockProgress=(nowMins-s)/bDur(sorted[activeIdx]);
              } else {
                /* בין בלוקים — חשב מיקום הוספה */
                nowInsert=sorted.findIndex(b=>nowMins<toMins(b.startTime));
                if(nowInsert===-1) nowInsert=sorted.length;
              }
            }
          }

          /* קו בין-בלוקים */
          const nowLine=<div key="__nowline__" style={{display:'flex',alignItems:'center',gap:6,margin:'2px 0',pointerEvents:'none'}}>
            <span style={{background:'#ef4444',color:'#fff',fontSize:10,fontWeight:700,padding:'2px 7px',borderRadius:10,flexShrink:0,letterSpacing:'0.02em'}}>
              ⏱ {nowTime()}
            </span>
            <div style={{flex:1,height:2,background:'#ef4444',borderRadius:2,opacity:0.75}}/>
          </div>;

          const startConn=(()=>{
            if(!sorted.length||!day.startLat||!day.startLng||sorted[0].type==='travel')return null;
            const first=sorted[0];
            const firstHasCoords=!!(first.lat&&first.lng);
            const key=`__start__->${first.id}`;
            const tt=travelTimes[key];
            const wt=travelTimes[`walk:__start__->${first.id}`];
            const hasCar=tt&&!tt.loading&&tt.min!=null;
            // הצג קונקטור אם יש נסיעה ברכב OR אם לפעילות הראשונה יש קואורדינטות (להליכה/תחבורה)
            if(!hasCar&&!firstHasCoords)return null;
            const buf2=settings?.travelBuffer??1.2;
            const insertTravelStart=()=>{
              const buffered=Math.round(tt.min*buf2);
              const kmVal=tt?.km;
              const firstStart=first.startTime;
              const nb={id:uid(),type:'travel',title:`🚗 נסיעה (~${fmtTravelMin(buffered)}${kmVal?', '+fmtKm(kmVal):''})`,
                startTime:firstStart,durationMins:buffered,notes:'',isAutoTravel:true};
              const shifted=day.blocks.map(b=>({...b,startTime:addMins(b.startTime,buffered)}));
              onUpdate({...day,blocks:[nb,...shifted]});
              toast(`🚗 נסיעה של ${fmtTravelMin(buffered)} נוספה לתחילת הלוז`,'success');
            };
            return(
              <div key="__start_conn__" style={{display:'flex',alignItems:'center',gap:8,
                padding:'6px 8px 6px 40px',margin:'0 0 6px',flexWrap:'wrap',
                background:'rgba(34,197,94,.07)',borderRadius:8,border:'1px solid rgba(34,197,94,.25)',marginRight:36}}>
                <span style={{fontSize:11,color:'var(--green)',flex:1}}>
                  🟢 {day.startLocation||'מוצא'} → ראשון
                  {hasCar&&<>: {fmtTravelMin(tt.min)}{tt.km?`, ${fmtKm(tt.km)}`:''} נסיעה{buf2>1.01&&<span style={{opacity:.75}}> + {Math.round(tt.min*(buf2-1))} דק' = <b>{fmtTravelMin(Math.round(tt.min*buf2))}</b></span>}</>}
                </span>
                {hasCar&&(
                  <button title="הוסף נסיעה ברכב" onClick={insertTravelStart}
                    style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(34,197,94,.4)',
                      borderRadius:6,background:'rgba(34,197,94,.12)',color:'var(--green)',cursor:'pointer'}}>
                    🚗
                  </button>
                )}
                {firstHasCoords&&(
                  <button title="הוסף מסלול הליכה" onClick={()=>searchWalking(
                    {lat:day.startLat,lng:day.startLng,startTime:day.startTime||'08:00',durationMins:0},
                    first,'start')}
                    style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(234,179,8,.4)',
                      borderRadius:6,background:'rgba(234,179,8,.12)',color:'var(--amber)',cursor:'pointer'}}>
                    🚶
                  </button>
                )}
                {firstHasCoords&&(
                  <button title="תחבורה ציבורית" onClick={()=>searchTransit(
                    {lat:day.startLat,lng:day.startLng,startTime:day.startTime||'08:00',durationMins:0},
                    first,'start')}
                    style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(34,197,94,.4)',
                      borderRadius:6,background:'rgba(34,197,94,.12)',color:'var(--green)',cursor:'pointer'}}>
                    🚌
                  </button>
                )}
              </div>
            );
          })();
          const endConn=(()=>{
            if(!sorted.length||!day.endLat||!day.endLng)return null;
            const last2=sorted[sorted.length-1];
            /* Case 1: last block is auto-travel to end location → show arrival card */
            if(last2.isAutoTravel){
              const arrivalTime=addMins(last2.startTime,bDur(last2));
              const arrM=toMins(arrivalTime);
              const dayEndM=toMins(day.endTime||'20:00');
              const overrun=arrM-dayEndM;
              return(
                <div key="__end_conn__" style={{display:'flex',alignItems:'center',gap:8,
                  padding:'6px 8px 6px 40px',margin:'0 0 6px',flexWrap:'wrap',
                  background:'rgba(239,68,68,.07)',borderRadius:8,border:'1px solid rgba(239,68,68,.25)',marginRight:36}}>
                  <span style={{fontSize:11,color:'var(--red)',flex:1}}>
                    🔴 {day.endLocation||'יעד'}{arrivalTime?` — מגיע בשעה ${arrivalTime}`:''}
                    {overrun>0&&<span style={{color:'var(--amber)',fontWeight:600,display:'block',marginTop:2}}>
                      ⚠️ חריגה {fmtTravelMin(overrun)} מזמן הסיום ({day.endTime})
                    </span>}
                  </span>
                </div>
              );
            }
            /* Case 2: non-auto travel block (manual) → skip */
            if(last2.type==='travel')return null;
            const lastHasCoords=!!(last2.lat&&last2.lng);
            const key=`${last2.id}->__end__`;
            const tt=travelTimes[key];
            const wt=travelTimes[`walk:${last2.id}->__end__`];
            const hasCar=tt&&!tt.loading&&tt.min!=null;
            const buf2=settings?.travelBuffer??1.2;
            const insertTravelEnd=()=>{
              const buffered=Math.round(tt.min*buf2);
              const kmVal=tt?.km;
              const travelStart=addMins(last2.startTime,bDur(last2));
              const nb={id:uid(),type:'travel',
                title:`🚗 נסיעה (~${fmtTravelMin(buffered)}${kmVal?', '+fmtKm(kmVal):''})`,
                startTime:travelStart,durationMins:buffered,notes:'',isAutoTravel:true};
              onUpdate({...day,blocks:[...day.blocks,nb]});
              toast(`🚗 נסיעה של ${fmtTravelMin(buffered)} נוספה לסיום הלוז`,'success');
            };
            return(
              <div key="__end_conn__" style={{display:'flex',alignItems:'center',gap:8,
                padding:'6px 8px 6px 40px',margin:'0 0 6px',flexWrap:'wrap',
                background:'rgba(239,68,68,.07)',borderRadius:8,border:'1px solid rgba(239,68,68,.25)',marginRight:36}}>
                <span style={{fontSize:11,color:'var(--red)',flex:1}}>
                  🔴 אחרון → {day.endLocation||'יעד'}
                  {tt?.loading&&<span style={{opacity:.55}}> חישוב...</span>}
                  {hasCar&&<>: {fmtTravelMin(tt.min)}{tt.km?`, ${fmtKm(tt.km)}`:''} נסיעה
                    {buf2>1.01&&<span style={{opacity:.75}}> + {Math.round(tt.min*(buf2-1))} דק' = <b>{fmtTravelMin(Math.round(tt.min*buf2))}</b></span>}
                  </>}
                </span>
                {hasCar&&(
                  <button title="הוסף נסיעה ברכב" onClick={insertTravelEnd}
                    style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(239,68,68,.4)',
                      borderRadius:6,background:'rgba(239,68,68,.12)',color:'var(--red)',cursor:'pointer'}}>
                    🚗
                  </button>
                )}
                {lastHasCoords&&(
                  <button title="הוסף מסלול הליכה" onClick={()=>searchWalking(last2,{lat:day.endLat,lng:day.endLng},'end')}
                    style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(234,179,8,.4)',
                      borderRadius:6,background:'rgba(234,179,8,.12)',color:'var(--amber)',cursor:'pointer'}}>
                    🚶
                  </button>
                )}
                {lastHasCoords&&(
                  <button title="תחבורה ציבורית" onClick={()=>searchTransit(last2,{lat:day.endLat,lng:day.endLng},'end')}
                    style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(239,68,68,.4)',
                      borderRadius:6,background:'rgba(239,68,68,.12)',color:'var(--red)',cursor:'pointer'}}>
                    🚌
                  </button>
                )}
              </div>
            );
          })();
          return [startConn,...sorted.map((bl,si)=>[
            nowInsert===si&&nowLine,
            <BlockItem key={bl.id} block={bl} interestBank={day._tripBank||[]} onEdit={setEd} onDelete={delBlock} onMoveToBank={onMoveToBank} onMoveToDayBank={moveBlockToDayBank} onFocusItem={(lat,lng,name)=>onFocusItem?.(lat,lng,name,day.id)} onFocusRoute={focusRoute}
              onSwap={swapSrc?executeSwap:null}
              onNoteChange={(id,note)=>{const b=day.blocks.find(x=>x.id===id);if(b){updBlock({...b,notes:note});if(b.placeId)onBankNoteUpdate?.(b.placeId,note);}}}
              dragging={dragOver!==null&&dragIdxRef.current===si} dragOver={dragOver===si}
              nowProgress={activeIdx===si?nowBlockProgress:null}
              mapNum={_mapNums[si]}
              onDragStart={e=>{e.dataTransfer.effectAllowed='move';dragIdxRef.current=si;}}
              onDragOver={e=>{e.preventDefault();e.dataTransfer.dropEffect='move';if(dragOver!==si)setDragOver(si);}}
              onDrop={e=>{e.preventDefault();handleDrop(si);}}
              onDragEnd={()=>{dragIdxRef.current=null;setDragOver(null);}}/>,
            /* ── connector: link status + travel time ── */
            (()=>{
              if(si>=sorted.length-1||bl.type==='travel'||sorted[si+1].type==='travel')return null;
              const next=sorted[si+1];
              const ttKey=`${bl.id}->${next.id}`;
              const tt=travelTimes[ttKey];
              const prevEnd=addMins(bl.startTime,bDur(bl));
              const isLinked=prevEnd===next.startTime;
              const gapMins=toMinsD(next.startTime)-toMinsD(prevEnd);
              const connBase={display:'flex',alignItems:'center',gap:6,padding:'4px 8px 4px 40px',margin:'0 0 4px',borderRadius:8,marginRight:36};
              /* ── 10h cap ── */
              if(tt&&!tt.loading&&tt.min>600){
                return(
                  <div key={`tt-${ttKey}`} style={{...connBase,background:'rgba(239,68,68,.07)',border:'1px solid rgba(239,68,68,.25)'}}>
                    <span style={{fontSize:11,color:'var(--red)',flex:1}}>
                      🚨 נסיעה ארוכה מ-10 שעות ({fmtTravelMin(tt.min)}) — בדוק שהאתרים באותה מדינה / יבשת
                    </span>
                  </div>
                );
              }
              /* ── פער / חפיפה — כפתור קישור ── */
              const linkBtn=!isLinked&&(
                <button key="lnkbtn" title="קשר פעילויות — עדכן שעה לפי סיום הקודם"
                  onClick={()=>cascadeFrom(si+1)}
                  style={{fontSize:10,padding:'2px 7px',border:'1px solid rgba(234,179,8,.5)',
                    borderRadius:5,background:'rgba(234,179,8,.12)',color:'var(--amber)',
                    cursor:'pointer',fontFamily:'Heebo,sans-serif',fontWeight:700,whiteSpace:'nowrap',flexShrink:0}}>
                  🔗 קשר
                </button>
              );
              const gapLabel=!isLinked&&(
                <span key="gaplbl" style={{fontSize:10,color:gapMins>=0?'var(--amber)':'var(--red)',opacity:.85}}>
                  {gapMins>0?`⏳ פער ${fmtTravelMin(gapMins)}`:gapMins<0?`⚠️ חפיפה ${fmtTravelMin(-gapMins)}`:''}
                </span>
              );
              /* ── OSRM travel time ── */
              const wt=travelTimes[`walk:${ttKey}`];
              if(tt&&!tt.loading&&tt.min!=null){
                const buf=settings?.travelBuffer??1.2;
                const buffered=Math.round(tt.min*buf);
                const insertTravel=()=>{
                  const kmVal=tt?.km;
                  const travelStart=addMins(bl.startTime,bDur(bl));
                  const nb2={id:uid(),type:'travel',
                    title:`🚗 נסיעה (~${fmtTravelMin(buffered)}${kmVal?', '+fmtKm(kmVal):''})`,
                    startTime:travelStart,durationMins:buffered,notes:'',isAutoTravel:true};
                  let t=addMins(travelStart,buffered);
                  const tail=sorted.slice(si+1).map(b2=>{const s={...b2,startTime:t};t=addMins(t,bDur(b2));return s;});
                  onUpdate({...day,blocks:[...sorted.slice(0,si+1),nb2,...tail]});
                  toast(`🚗 נסיעה של ${fmtTravelMin(buffered)} נוספה`,'success');
                };
                return(
                  <div key={`tt-${ttKey}`} style={{...connBase,background:'rgba(79,142,247,.06)',border:'1px solid rgba(79,142,247,.18)',flexWrap:'wrap'}}>
                    {gapLabel}{linkBtn}
                    <span style={{fontSize:11,color:'var(--text3)',flex:1}}>
                      {isLinked&&<span style={{color:'var(--text3)',opacity:.4,marginLeft:4}}>🔗 </span>}
                      🚗 {fmtTravelMin(tt.min)}{tt.km?`, ${fmtKm(tt.km)}`:''} נסיעה
                      {buf>1.01&&<span style={{opacity:.75}}> + {Math.round(tt.min*(buf-1))} דק' = <b style={{color:'var(--text2)'}}>{fmtTravelMin(buffered)}</b></span>}
                    </span>
                    <button title="הוסף נסיעה ברכב" onClick={insertTravel}
                      style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(79,142,247,.4)',
                        borderRadius:6,background:'rgba(79,142,247,.12)',color:'var(--accent)',cursor:'pointer'}}>
                      🚗
                    </button>
                    {bl.lat&&bl.lng&&next.lat&&next.lng&&(
                      <button title="הוסף מסלול הליכה" onClick={()=>searchWalking(bl,next)}
                        style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(234,179,8,.4)',
                          borderRadius:6,background:'rgba(234,179,8,.12)',color:'var(--amber)',cursor:'pointer'}}>
                        🚶
                      </button>
                    )}
                    {bl.lat&&bl.lng&&next.lat&&next.lng&&(
                      <button title="תחבורה ציבורית" onClick={()=>searchTransit(bl,next)}
                        style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(34,197,94,.4)',
                          borderRadius:6,background:'rgba(34,197,94,.12)',color:'var(--green)',cursor:'pointer'}}>
                        🚌
                      </button>
                    )}
                  </div>
                );
              }
              /* ── no OSRM: show link status only if relevant ── */
              if(!isLinked){
                return(
                  <div key={`lnk-${ttKey}`} style={{...connBase,background:'rgba(234,179,8,.06)',border:'1px solid rgba(234,179,8,.2)',flexWrap:'wrap'}}>
                    {gapLabel}{linkBtn}
                    {bl.lat&&bl.lng&&next.lat&&next.lng&&(
                      <button onClick={()=>searchWalking(bl,next)}
                        style={{fontSize:11,padding:'3px 9px',border:'1px solid rgba(234,179,8,.4)',
                          borderRadius:6,background:'rgba(234,179,8,.12)',color:'var(--amber)',
                          cursor:'pointer',fontFamily:'Heebo,sans-serif',fontWeight:700,whiteSpace:'nowrap'}}>
                        🚶
                      </button>
                    )}
                    {bl.lat&&bl.lng&&next.lat&&next.lng&&(
                      <button title="תחבורה ציבורית" onClick={()=>searchTransit(bl,next)}
                        style={{fontSize:15,padding:'2px 8px',border:'1px solid rgba(34,197,94,.4)',
                          borderRadius:6,background:'rgba(34,197,94,.12)',color:'var(--green)',cursor:'pointer'}}>
                        🚌
                      </button>
                    )}
                  </div>
                );
              }
              /* ── linked & no OSRM: tiny icon ── */
              return <div key={`lnk-${ttKey}`} style={{textAlign:'center',padding:'0 0 3px',marginRight:36}}><span style={{fontSize:10,color:'var(--text3)',opacity:.3}}>🔗</span></div>;
            })(),
            nowInsert===sorted.length&&si===sorted.length-1&&nowLine,
          ]),endConn];
        })()}
      </div>

      {/* ── modal תחבורה ציבורית / הליכה ── */}
      {transitSearch&&(
        <div style={{position:'fixed',inset:0,zIndex:500,background:'rgba(0,0,0,.6)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}
          onClick={e=>{if(e.target===e.currentTarget)setTransitSearch(null);}}>
          <div style={{background:'var(--bg2)',borderRadius:16,width:'100%',maxWidth:480,maxHeight:'80vh',display:'flex',flexDirection:'column',overflow:'hidden',boxShadow:'0 20px 60px rgba(0,0,0,.5)'}}>
            <div style={{padding:'14px 18px 12px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontWeight:700,fontSize:15,flex:1}}>{transitSearch.isWalking?'🚶 הליכה רגלית':'🚌 תחבורה ציבורית'}</span>
              <button onClick={()=>setTransitSearch(null)} style={{background:'none',border:'none',color:'var(--text3)',fontSize:20,cursor:'pointer',lineHeight:1}}>✕</button>
            </div>
            <div style={{overflowY:'auto',flex:1,padding:'12px 16px 16px'}}>
              {transitSearch.loading&&<div style={{textAlign:'center',padding:'32px',color:'var(--text3)',fontSize:13}}>
                🔍 {transitSearch.isWalking?'מחפש מסלול הליכה...':'מחפש קווי תחבורה...'}
              </div>}
              {!transitSearch.loading&&transitSearch.error&&(
                <div style={{padding:'20px 16px',textAlign:'center'}}>
                  <div style={{color:'var(--red)',fontSize:13,marginBottom:12}}>{transitSearch.error}</div>
                  {transitSearch.fromLat&&<a href={`https://www.google.com/maps/dir/?api=1&origin=${transitSearch.fromLat},${transitSearch.fromLng}&destination=${transitSearch.toLat},${transitSearch.toLng}&travelmode=${transitSearch.isWalking?'walking':'transit'}`}
                    target="_blank" rel="noreferrer"
                    style={{display:'inline-flex',alignItems:'center',gap:6,fontSize:12,padding:'7px 14px',
                      borderRadius:8,background:'rgba(66,133,244,.1)',color:'#4285f4',
                      border:'1px solid rgba(66,133,244,.35)',textDecoration:'none',fontWeight:700}}>
                    <span style={{fontWeight:900,fontSize:13,fontFamily:'Arial,sans-serif'}}>G</span> פתח ב-Google Maps
                  </a>}
                </div>
              )}
              {!transitSearch.loading&&transitSearch.results?.map((route,i)=>(
                <button key={i} onClick={()=>{
                  const{insertMode,fromBlockIdx,isWalking:iw}=transitSearch;
                  if(iw){
                    if(insertMode==='start')insertWalkingRouteBlockStart(route);
                    else if(insertMode==='end')insertWalkingRouteBlockEnd(route);
                    else insertWalkingRouteBlock(sorted[fromBlockIdx],route);
                  } else {
                    if(insertMode==='start')insertTransitBlockStart(route);
                    else if(insertMode==='end')insertTransitBlockEnd(route);
                    else insertTransitBlock(sorted[fromBlockIdx],route);
                  }
                }}
                  style={{width:'100%',textAlign:'right',padding:'12px 14px',marginBottom:8,borderRadius:10,
                    border:'1px solid var(--border)',background:'var(--surface)',cursor:'pointer',
                    fontFamily:'Heebo,sans-serif',transition:'background .15s'}}>
                  {transitSearch.isWalking?(
                    <>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{fontSize:18}}>🚶</span>
                        <span style={{fontWeight:700,fontSize:14,color:'var(--text)',flex:1}}>
                          {route.distanceText}
                        </span>
                        <span style={{fontWeight:700,color:'var(--amber)',fontSize:14}}>{fmtTravelMin(route.durationMins)}</span>
                      </div>
                      {route.steps.slice(0,5).map((s,j)=>(
                        <div key={j} style={{fontSize:11,paddingRight:26,marginTop:3,color:'var(--text2)'}}>
                          🚶 {s.instruction}{s.distanceM>=20?` (${s.distanceM>=1000?(s.distanceM/1000).toFixed(1)+'ק"מ':s.distanceM+'מ\''})`:''}
                        </div>
                      ))}
                      {route.steps.length>5&&<div style={{fontSize:10,color:'var(--text3)',paddingRight:26,marginTop:3}}>...ועוד {route.steps.length-5} צעדים</div>}
                    </>
                  ):(
                    <>
                      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
                        <span style={{fontSize:18}}>{route.steps.find(s=>s.type==='transit')?.icon||'🚌'}</span>
                        <span style={{fontWeight:700,fontSize:14,color:'var(--text)',flex:1}}>{route.summary}</span>
                        <span style={{fontWeight:700,color:'var(--accent)',fontSize:14}}>{fmtTravelMin(route.durationMins)}</span>
                      </div>
                      {(()=>{
                        const ts=route.steps.filter(s=>s.type==='transit');
                        if(!ts.length)return null;
                        return(
                          <div style={{fontSize:11,marginTop:4,color:'var(--text2)',lineHeight:1.8,direction:'ltr',textAlign:'left'}}>
                            {ts.map((s,i)=>(
                              <React.Fragment key={i}>
                                {i===0&&<div>📍 <b>Board:</b> {s.departure}</div>}
                                <div style={{paddingLeft:12,color:'var(--text3)'}}>
                                  {s.icon} {s.lineShort||s.lineName}{s.numStops>0?` · ${s.numStops} stop${s.numStops!==1?'s':''}`:''}
                                </div>
                                <div style={{color:i<ts.length-1?'var(--amber)':'inherit'}}>
                                  {i<ts.length-1
                                    ?<span>↔️ <b>Transfer:</b> {s.arrival}</span>
                                    :<span>📍 <b>Alight:</b> {s.arrival}</span>
                                  }
                                </div>
                              </React.Fragment>
                            ))}
                          </div>
                        );
                      })()}
                    </>
                  )}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* overrun warning banner */}
      {overrunMins>0&&<div style={{margin:'8px 0',padding:'10px 14px',
        background:'rgba(234,179,8,.1)',borderRadius:10,border:'2px solid rgba(234,179,8,.4)',
        display:'flex',gap:10,alignItems:'center'}}>
        <span style={{fontSize:22}}>⚠️</span>
        <span style={{fontSize:13,color:'var(--amber)',fontWeight:600,flex:1}}>
          הלוז חורג מזמן הסיום ({day.endTime}) ב-<b>{fmtTravelMin(overrunMins)}</b>
          {lastSortedBlock&&` — פעילות אחרונה מסתיימת ב-${addMins(lastSortedBlock.startTime,bDur(lastSortedBlock))}`}
        </span>
      </div>}

      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:12}}>
        {BLOCK_TYPES.map(t=>(
          <button key={t} className="btn btn-secondary btn-sm" onClick={()=>addBlock(t)}>{BLOCK_EMOJI[t]} הוסף {BLOCK_HE[t]}</button>
        ))}
      </div>

      <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>
        <div><label className="label">הערות יומיות</label>
          <textarea className="input" rows={2} value={day.notes} onChange={e=>onUpdate({...day,notes:e.target.value})} placeholder="הערות להיום…"/></div>
        <div><label className="label">סיכום / יומן</label>
          <textarea className="input" rows={3} value={day.summary} onChange={e=>onUpdate({...day,summary:e.target.value})} placeholder="איך היה היום? כתוב את רשומת היומן שלך…"/></div>
      </div>
      <div style={{marginTop:12,display:'flex',justifyContent:'flex-start'}}>
        <button className="btn btn-danger btn-sm" onClick={onDelete}>🗑 מחק יום</button>
      </div>
    </div>}

    {editing&&(()=>{
      const esi=sorted.findIndex(b=>b.id===editing.id);
      const editPrevEnd=esi>0?addMins(sorted[esi-1].startTime,bDur(sorted[esi-1])):null;
      const saveBlock=b=>{updBlock(b);if(b.placeId&&b.notes!==undefined)onBankNoteUpdate?.(b.placeId,b.notes||'');};
      const saveCascade=b=>{cascadeSave(b);if(b.placeId&&b.notes!==undefined)onBankNoteUpdate?.(b.placeId,b.notes||'');};
      const saveCascadeUnlink=b=>{cascadeSaveUnlink(b);if(b.placeId&&b.notes!==undefined)onBankNoteUpdate?.(b.placeId,b.notes||'');};
      return <BlockModal block={editing} onSave={saveBlock} onClose={()=>setEd(null)} onDelete={()=>{delBlock(editing.id);setEd(null);}} prevEndTime={editPrevEnd} onCascadeSave={saveCascade} onCascadeSaveUnlink={saveCascadeUnlink} onPickFromMap={onPickFromMap}/>;
    })()}

    {locationPicking&&(
      <LocationPickerModal
        bank={day._tripBank||[]}
        title={locationPicking.field==='start'?'🟢 בחר נקודת מוצא':'🔴 בחר נקודת יעד'}
        onPick={item=>pickLocationItem(item,locationPicking.field)}
        onPickFromMap={onPickFromMap?()=>{
          const f=locationPicking.field;
          setLocationPicking(null);
          onPickFromMap(
            f==='start'?'🟢 לחץ על המפה לבחירת נקודת המוצא':'🔴 לחץ על המפה לבחירת נקודת היעד',
            place=>{
              onUpdate({...day,
                ...(f==='start'
                  ?{startLocation:place.customName||place.name,startLat:place.lat,startLng:place.lng,startPending:false}
                  :{endLocation:place.customName||place.name,endLat:place.lat,endLng:place.lng})
              });
              toast(`${f==='start'?'נקודת מוצא':'נקודת יעד'} עודכנה ✓`,'success');
            }
          );
        }:null}
        onClose={()=>setLocationPicking(null)}
      />
    )}

    {bankPickForBlock&&(
      <LocationPickerModal
        bank={day._tripBank||[]}
        title={`${BLOCK_EMOJI[bankPickForBlock.type]} הוסף ${BLOCK_HE[bankPickForBlock.type]}`}
        onPick={item=>bankPickedForBlock(item,bankPickForBlock.type)}
        onPickFromMap={onPickFromMap?()=>{
          const t=bankPickForBlock.type;
          setBankPickForBlock(null);
          onPickFromMap(
            `${BLOCK_EMOJI[t]} בחר מקום על המפה`,
            place=>{
              const s=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
              const last=s[s.length-1];
              const start=last?addMins(last.startTime,bDur(last)):(day.currentTime||'09:00');
              const block={...defaultBlock(t,start),
                title:place.name||'',location:place.address||'',
                lat:place.lat||null,lng:place.lng||null};
              onUpdate({...day,blocks:[...day.blocks,block]});
            }
          );
        }:null}
        onCreateEmpty={()=>addEmptyBlock(bankPickForBlock.type)}
        onClose={()=>setBankPickForBlock(null)}
      />
    )}

    {/* ── המלצות מבנק האטרקציות ── */}
    <div style={{margin:'4px 0'}}>
      <button
        onClick={()=>setShowSuggestions(o=>!o)}
        style={{
          width:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:8,
          padding:'7px 14px',borderRadius:8,cursor:'pointer',fontSize:12,fontWeight:600,
          background:showSuggestions?'rgba(16,185,129,.18)':'rgba(16,185,129,.07)',
          border:`1px solid rgba(16,185,129,${showSuggestions?.5:.25})`,
          color:'#059669',transition:'all .15s',
        }}>
        <span>✨</span>
        <span>מצא מבנק האטרקציות</span>
        <span style={{fontSize:10,color:'var(--text3)',fontWeight:400}}>⭐ בנק האטרקציות → 📌 בנק יומי</span>
        <span style={{marginRight:'auto',fontSize:11}}>{showSuggestions?'▲':'▼'}</span>
      </button>
      {showSuggestions&&<DayBankSuggestions day={day} onAddItems={addSuggestedItems}/>}
    </div>

    {/* ── בנק יומי ── */}
    {(()=>{
      const addDayBankItemToSchedule=(item)=>{
        const sorted=[...(day.blocks||[])].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
        const last=sorted[sorted.length-1];
        const start=last?addMins(last.startTime,last.durationMins||60):(day.startTime||'09:00');
        const nb=defaultBlock('activity',start);
        nb.title=item.customName||item.name;nb.location=item.address||'';
        if(item.lat){nb.lat=item.lat;nb.lng=item.lng;}
        if(item.placeId)nb.placeId=item.placeId;
        if(item.rating)nb.placeRating=item.rating;
        if(item.placeType)nb.placeType=item.placeType;
        if(item.openStatus)nb.placeOpenStatus=item.openStatus;
        if(item.todayHours)nb.placeTodayHours=item.todayHours;
        if(item.phone)nb.placePhone=item.phone;
        if(item.website)nb.placeWebsite=item.website;
        const newDayBank=(day.dayBank||[]).filter(i=>i.id!==item.id);
        onUpdate({...day,blocks:[...(day.blocks||[]),nb],dayBank:newDayBank});
      };
      const removeDayBankItem=(id)=>{
        onUpdate({...day,dayBank:(day.dayBank||[]).filter(i=>i.id!==id)});
      };
      return(
        <div style={{margin:'8px 0',borderRadius:10,border:'1px solid var(--border)',overflow:'hidden'}}>
          <div onClick={()=>setShowDayBank(o=>!o)}
            style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',cursor:'pointer',background:'var(--bg2)',userSelect:'none'}}>
            <span style={{fontSize:13,fontWeight:700}}>📌 בנק יומי</span>
            <span className="chip chip-blue" style={{fontSize:10}}>{(day.dayBank||[]).length}</span>
            <div style={{flex:1}}/>
            <span style={{fontSize:11,color:'var(--text3)'}}>{showDayBank?'▲':'▼'}</span>
          </div>
          {showDayBank&&(
            <div style={{padding:'6px 10px',display:'flex',flexDirection:'column',gap:6}}>
              {(day.dayBank||[]).length===0
                ?<div style={{fontSize:11,color:'var(--text3)',textAlign:'center',padding:'10px 0'}}>אין פעילויות בבנק היומי — הוסף מהמפה או מבנק האטרקציות</div>
                :(day.dayBank||[]).map(item=>{
                  const tripBank=day._tripBank||[];
                  const bankInfo=tripBank.find(i=>
                    (item.placeId&&i.placeId===item.placeId)||(item.lat&&i.lat&&Math.abs(i.lat-item.lat)<0.0001&&Math.abs(i.lng-item.lng)<0.0001));
                  const src=BANK_SRC_PICKER[item._listSource||bankInfo?._listSource]||null;
                  const rating=item.rating??bankInfo?.rating??null;
                  const openStatus=item.openStatus||bankInfo?.openStatus||'';
                  const todayHours=item.todayHours||bankInfo?.todayHours||'';
                  const phone=item.phone||bankInfo?.phone||'';
                  const website=item.website||bankInfo?.website||'';
                  const placeType=item.placeType||bankInfo?.placeType||'';
                  const hasLoc=!!(item.lat&&item.lng);
                  const btnS={background:'none',border:'none',cursor:'pointer',padding:'2px 5px',borderRadius:4,fontSize:14,lineHeight:1,flexShrink:0};
                  return(
                    <div key={item.id} style={{background:'var(--surface)',border:'1px solid var(--border)',
                      borderRight:'4px solid #8b5cf6',borderRadius:8,overflow:'hidden'}}>
                      <div style={{padding:'8px 10px'}}>
                        <div style={{display:'flex',alignItems:'flex-start',gap:6}}>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
                              {src&&<span style={{fontSize:12,opacity:.8}} title={item._listSource||bankInfo?._listSource}>{src.emoji}</span>}
                              <span>📌 {item.customName||item.name}</span>
                            </div>
                            {placeType&&<div style={{fontSize:10,color:'var(--text3)',marginTop:1}}>{placeType}</div>}
                            {item.address&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>📍 {item.address}</div>}
                            <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:2}}>
                              {rating&&<span style={{fontSize:11,color:'var(--amber)'}}>⭐ {rating}</span>}
                              {openStatus&&<span style={{fontSize:11,fontWeight:600,color:openStatus==='פתוח עכשיו'?'#22c55e':'#ef4444'}}>
                                {openStatus==='פתוח עכשיו'?'✅':'🔴'} {openStatus}
                              </span>}
                            </div>
                            {todayHours&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>🕐 {todayHours}</div>}
                            {phone&&<div style={{fontSize:11,color:'var(--accent)',marginTop:2}}>📞 {phone}</div>}
                            {website&&<a href={website} target="_blank" rel="noreferrer"
                              style={{fontSize:11,color:'var(--accent)',display:'block',marginTop:2}}
                              onClick={e=>e.stopPropagation()}>
                              🌐 {website.replace(/^https?:\/\//,'').split('/')[0]}
                            </a>}
                            {item.note&&<div style={{fontSize:11,color:'var(--text2)',marginTop:4,fontStyle:'italic',lineHeight:1.4}}>📝 {item.note}</div>}
                          </div>
                          <div style={{display:'flex',flexDirection:'column',gap:3,flexShrink:0,alignItems:'flex-end'}}>
                            {hasLoc&&<button style={{...btnS,color:'#4f8ef7'}} title="הצג במפה הפנימית"
                              onClick={()=>window.__gmFocus?.(item.lat,item.lng,17)}>🗺️</button>}
                            {hasLoc&&<GLink url={mkMapsUrl(item.placeId,item.lat,item.lng,item.customName||item.name)}
                              onClick={e=>e.stopPropagation()}/>}
                            <button className="btn btn-primary btn-sm" style={{fontSize:10,padding:'3px 8px'}}
                              onClick={()=>addDayBankItemToSchedule(item)}>➕ ללוז</button>
                            <button className="btn btn-sm"
                              onClick={()=>setSwapSrc(swapSrc?.id===item.id?null:item)}
                              style={{fontSize:10,padding:'3px 8px',
                                background:swapSrc?.id===item.id?'rgba(245,158,11,.35)':'rgba(245,158,11,.13)',
                                color:'#d97706',border:`1px solid rgba(245,158,11,${swapSrc?.id===item.id?.55:.3})`}}
                              title={'החלף עם פעילות בלו"ז'}>🔄 החלף</button>
                            <button style={{...btnS,color:'#ef4444',fontWeight:700,fontSize:13}} title="הסר"
                              onClick={()=>removeDayBankItem(item.id)}>✕</button>
                          </div>
                        </div>
                      </div>
                    </div>
                  );
                })
              }
            </div>
          )}
        </div>
      );
    })()}
  </div>;
}

/* ══════════════════════════════════
   לשונית לוח זמנים
══════════════════════════════════ */
/* ══════════════════════════════════
   פריט בנק אטרקציות
══════════════════════════════════ */
function BankItem({item,days,onAddToDay,onDelete,onLocate,onFocusItem,selected,onSelect,onEnrich,enriching,onNoteChange,onAddToDayBank,onSetDayStart,onSetDayEnd,onSaveCustomName,onChangeListSource}){
  const[actTab,setActTab]=useState('day');
  const[actDay,setActDay]=useState('');
  const[noteVal,setNoteVal]=useState(item.note||'');
  const[showNote,setShowNote]=useState(!!(item.note));
  const[nameEdit,setNameEdit]=useState(false);
  const[nameVal,setNameVal]=useState(item.customName||item.name||'');
  useEffect(()=>{setNoteVal(item.note||'');setShowNote(!!(item.note));},[item.id,item.note]);
  useEffect(()=>{setNameVal(item.customName||item.name||'');},[item.id,item.customName,item.name]);
  const focusMap=()=>{if(item.lat){onLocate?.(item.lat,item.lng);onFocusItem?.(item.lat,item.lng,item.customName||item.name);}};
  const saveNote=(val)=>{if(onNoteChange&&val!==item.note)onNoteChange(item.id,val);};
  const doSaveNameWith=(val)=>{onSaveCustomName?.(item.placeId,item.id,val);};
  const doSaveName=()=>{doSaveNameWith(nameVal);setNameEdit(false);toast(`שם עודכן: "${nameVal}"`,nameVal?'success':'info');};
  const smallBtnStyle={fontSize:11,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:4,padding:'2px 5px',cursor:'pointer',fontFamily:'Heebo,Arial,sans-serif',lineHeight:1.4};
  /* קישור גוגל מפות — מה-url שנשמר בייבוא, או בנה מ-placeId */
  const mapsUrl=item.url||mkMapsUrl(item.placeId,item.lat,item.lng,item.customName||item.name);
  const srcInfo=BANK_SRC_PICKER[item._listSource]||null;

  return <div className="interest-item" style={{marginBottom:6,flexDirection:'column',alignItems:'stretch',gap:8,
    outline:selected?'2px solid var(--accent)':'2px solid transparent',borderRadius:8,transition:'outline 0.15s'}}>
    <div style={{display:'flex',alignItems:'flex-start',gap:6}}>
      {onSelect&&<input type="checkbox" checked={!!selected} onChange={e=>onSelect(item.id,e.target.checked)}
