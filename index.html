function BankItem({item,days,onAddToDay,onDelete,onLocate,onFocusItem,selected,onSelect,onEnrich,enriching}){
  const[selDay,setSelDay]=useState('');
  const focusMap=()=>{if(item.lat){onLocate?.(item.lat,item.lng);onFocusItem?.(item.lat,item.lng,item.name);}};
  return <div className="interest-item" style={{marginBottom:6,flexDirection:'column',alignItems:'stretch',gap:8,
    outline:selected?'2px solid var(--accent)':'2px solid transparent',borderRadius:8,transition:'outline 0.15s'}}>
    <div style={{display:'flex',alignItems:'flex-start',gap:6}}>
      {onSelect&&<input type="checkbox" checked={!!selected} onChange={e=>onSelect(item.id,e.target.checked)}
        style={{marginTop:3,flexShrink:0,cursor:'pointer',width:14,height:14}} onClick={e=>e.stopPropagation()}/>}
      <div style={{flex:1,minWidth:0,cursor:item.lat?'pointer':'default'}} onClick={focusMap}>
        <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
        {item.placeType&&<div style={{fontSize:10,color:'var(--text3)',marginTop:1,lineHeight:1.4}}>{item.placeType}</div>}
        {item._noCoords&&!item.placeId&&<div style={{fontSize:10,color:'var(--amber)',marginTop:1}}>📍 ללא מיקום — לחץ 🔍 להשלמה מגוגל מפות</div>}
        {item.address&&<div style={{fontSize:11,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginTop:1}}>{item.address}</div>}
        {item.rating&&<div style={{fontSize:11,color:'var(--amber)',marginTop:2}}>⭐ {item.rating}{item.userRatingsTotal?` (${Number(item.userRatingsTotal).toLocaleString()})`:''}</div>}
        {item.openStatus&&<div style={{fontSize:11,fontWeight:600,marginTop:1,color:item.openStatus==='פתוח עכשיו'?'#22c55e':'#ef4444'}}>{item.openStatus==='פתוח עכשיו'?'✅':'🔴'} {item.openStatus}</div>}
        {item.todayHours&&<div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>🕐 {item.todayHours}</div>}
        {item.phone&&<div style={{fontSize:11,color:'var(--accent)',marginTop:1}}>📞 {item.phone}</div>}
        {item.website&&<a href={item.website} target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--accent)',display:'block',marginTop:1,wordBreak:'break-all'}} onClick={e=>e.stopPropagation()}>🌐 {item.website.replace(/^https?:\/\//,'').split('/')[0]}</a>}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:4,flexShrink:0}}>
        {item.lat&&(onLocate||onFocusItem)&&(
          <button className="btn btn-secondary btn-icon btn-sm" title="הצג במפה" onClick={focusMap}>📍</button>
        )}
        {onEnrich&&<button className="btn btn-secondary btn-icon btn-sm"
          title={item.placeId?'רענן פרטים מגוגל מפות':'קשר לגוגל מפות והשלם פרטים'}
          onClick={()=>onEnrich(item)} disabled={!!enriching}
          style={{fontSize:enriching?12:11,opacity:enriching?0.6:1}}>{enriching?'⏳':'🔍'}</button>}
        <button className="btn btn-danger btn-icon btn-sm" onClick={onDelete} title="הסר">✕</button>
      </div>
    </div>
    <div style={{display:'flex',gap:5}}>
      <select value={selDay} onChange={e=>setSelDay(e.target.value)}
        style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:7,padding:'5px 8px',fontSize:11,fontFamily:'Heebo,sans-serif',direction:'rtl'}}>
        <option value="">➕ בחר יום להוסיף...</option>
        {days.map((d,i)=><option key={d.id} value={d.id}>יום {i+1}{d.location?' — '+d.location:''}</option>)}
      </select>
      <button className="btn btn-primary btn-sm" disabled={!selDay}
        onClick={()=>{if(selDay){onAddToDay(selDay,item);setSelDay('');}}}
        style={{opacity:selDay?1:0.4,flexShrink:0}}>הוסף</button>
    </div>
  </div>;
}

const DAYS_PER_PAGE=4;

function TimelineTab({trip,onUpdate,onLocate,onFocusDay,onFocusItem,compact=false}){
  const[showBank,setShowBank]=useState(!compact);
  const[dayOffset,setDayOffset]=useState(0);

  const updDay=upd=>onUpdate({...trip,days:trip.days.map(d=>d.id===upd.id?upd:d)});
  const addDay=()=>{
    const last=trip.days[trip.days.length-1];
    let nd='';
    if(last?.date){const d=new Date(last.date);d.setDate(d.getDate()+1);nd=d.toISOString().slice(0,10);}
    const newDay={
      ...defaultDay(nd),
      // מוצא חדש = יעד היום הקודם (ממתין לאישור)
      startLocation:last?.endLocation||'',
      startTime:last?.endLocation?(last?.endTime||'08:00'):'08:00',
      startPending:!!(last?.endLocation),
    };
    const newTrip={...trip,days:[...trip.days,newDay]};
    onUpdate(newTrip);
    // גלול אוטומטית לדף האחרון אחרי הוספה
    const newLen=newTrip.days.length;
    setDayOffset(Math.floor((newLen-1)/DAYS_PER_PAGE)*DAYS_PER_PAGE);
  };
  const delDay=id=>{
    onUpdate({...trip,days:trip.days.filter(d=>d.id!==id)});
    setDayOffset(prev=>Math.max(0,Math.min(prev,trip.days.length-2-((trip.days.length-1)%DAYS_PER_PAGE))));
  };
  const moveBlockToBank=(block,dayId)=>{
    const bankItem={id:uid(),name:block.title||'פעילות',address:block.location||'',
      lat:block.lat,lng:block.lng,placeId:block.placeId,
      rating:block.placeRating,userRatingsTotal:block.placeUserRatings,
      openStatus:block.placeOpenStatus,todayHours:block.placeTodayHours,
      phone:block.placePhone,website:block.placeWebsite,photoUrl:block.placePhotoUrl,
      placeType:block.placeType||''};
    onUpdate({...trip,
      interestBank:[...trip.interestBank,bankItem],
      days:trip.days.map(d=>d.id===dayId?{...d,blocks:d.blocks.filter(b=>b.id!==block.id)}:d)
    });
    toast(`"${bankItem.name}" הועבר לבנק האטרקציות`,'success');
  };

  // במצב compact — תצוגה רגילה אנכית (עמודה צרה בתצוגת 3 עמודות)
  if(compact){
    return <div style={{display:'flex',height:'100%',overflow:'hidden',flexDirection:'column'}}>
      <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexShrink:0}}>
        <span style={{fontWeight:700,fontSize:14}}>🗓 לוח זמנים</span>
        <button className="btn btn-primary btn-sm" onClick={addDay}>+ יום</button>
      </div>
      <div className="scroll-y flex-1" style={{padding:'10px'}}>
        {trip.days.length===0
          ?<div className="empty-state"><div className="emoji">🗓️</div><div style={{fontWeight:600}}>אין ימים</div>
             <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={addDay}>+ הוסף יום</button></div>
          :trip.days.map((day,i)=>(
            <DayPanel key={day.id} day={day} idx={i} onUpdate={updDay} onDelete={()=>delDay(day.id)}
              onFocusDay={onFocusDay} onFocusItem={onFocusItem}
              onMoveToBank={(block)=>moveBlockToBank(block,day.id)}/>
          ))
        }
      </div>
    </div>;
  }

  // מצב מלא — 4 ימים בעמודות + עמודת אטרקציות
  const totalDays=trip.days.length;
  const clampedOffset=Math.min(dayOffset,Math.max(0,totalDays-1));
  const visibleDays=trip.days.slice(clampedOffset,clampedOffset+DAYS_PER_PAGE);
  const pageFrom=clampedOffset+1;
  const pageTo=Math.min(clampedOffset+DAYS_PER_PAGE,totalDays);
  const canPrev=clampedOffset>0;
  const canNext=clampedOffset+DAYS_PER_PAGE<totalDays;

  return <div style={{display:'flex',height:'100%',overflow:'hidden',flexDirection:'column'}}>
    {/* ── סרגל עליון ── */}
    <div style={{padding:'8px 14px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:8,flexShrink:0,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:14}}>🗓 לוח זמנים</span>
      <button className="btn btn-primary btn-sm" onClick={addDay}>+ הוסף יום</button>
      <div style={{flex:1}}/>
      {/* ניווט ימים */}
      {totalDays>DAYS_PER_PAGE&&<div style={{display:'flex',alignItems:'center',gap:6}}>
        <button className="btn btn-secondary btn-sm" disabled={!canNext}
          onClick={()=>setDayOffset(o=>Math.min(o+DAYS_PER_PAGE,totalDays-1))}
          style={{padding:'3px 9px',opacity:canNext?1:0.35}}>הבא ▶</button>
        <span style={{fontSize:12,color:'var(--text2)',minWidth:90,textAlign:'center'}}>
          ימים {pageFrom}–{pageTo} / {totalDays}
        </span>
        <button className="btn btn-secondary btn-sm" disabled={!canPrev}
          onClick={()=>setDayOffset(o=>Math.max(0,o-DAYS_PER_PAGE))}
          style={{padding:'3px 9px',opacity:canPrev?1:0.35}}>◀ קודם</button>
      </div>}
      <button className="btn btn-secondary btn-sm" onClick={()=>setShowBank(b=>!b)}>
        🌟 {showBank?'הסתר':'הצג'} אטרקציות
      </button>
    </div>

    {/* ── עמודות ימים + בנק ── */}
    <div style={{flex:1,display:'flex',overflow:'hidden'}}>
      {totalDays===0
        ?<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
           <div className="empty-state">
             <div className="emoji">🗓️</div>
             <div style={{fontWeight:600,color:'var(--text)'}}>אין ימים עדיין</div>
             <p>לחץ "+ הוסף יום" כדי להתחיל לבנות את המסלול.</p>
             <button className="btn btn-primary" onClick={addDay}>+ הוסף יום</button>
           </div>
         </div>
        :visibleDays.map((day,i)=>(
          <div key={day.id} style={{
            flex:1,minWidth:0,borderRight:'1px solid var(--border)',
            display:'flex',flexDirection:'column',overflow:'hidden'
          }}>
            <div className="scroll-y flex-1" style={{padding:'8px'}}>
              <DayPanel day={day} idx={clampedOffset+i} onUpdate={updDay} onDelete={()=>delDay(day.id)}
                onFocusDay={onFocusDay} onFocusItem={onFocusItem}
                onMoveToBank={(block)=>moveBlockToBank(block,day.id)}/>
            </div>
          </div>
        ))
      }
      {/* עמודת אטרקציות */}
      {showBank&&<div style={{width:270,flexShrink:0,borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <BankPanel trip={trip} onUpdate={onUpdate} onLocate={onLocate} onFocusItem={onFocusItem} onClose={()=>setShowBank(false)}/>
      </div>}
    </div>
  </div>;
}

/* ══════════════════════════════════
   פאנל בנק אטרקציות (עמודה עצמאית)
   תכונות: קיבוץ לפי מדינה, בחירה קבוצתית, העשרת פרטים מגוגל מפות
══════════════════════════════════ */
function BankPanel({trip,onUpdate,onLocate,onFocusItem,onClose}){
  const[showTakeout,setShowTakeout]=useState(false);
  const[showLinkImport,setShowLinkImport]=useState(false);
  const[linkUrl,setLinkUrl]=useState('');
  const[linkSource,setLinkSource]=useState('saved'); // liked|wantToGo|saved|list
  const[linkImporting,setLinkImporting]=useState(false);
  const[selected,setSelected]=useState(()=>new Set());
  const[enrichingId,setEnrichingId]=useState(null);
  const[batchProgress,setBatchProgress]=useState(null); // null | {done,total,name}
  // expanded = קבוצות פתוחות; ברירת מחדל: ריק = כולן סגורות
  const[expanded,setExpanded]=useState(()=>new Set());
  const takeoutRef=useRef(null);
  // ref לטיול — מונע stale-closure בלולאות async
  const tripRef=useRef(trip);
  useEffect(()=>{tripRef.current=trip;},[trip]);

  /* חילוץ שם מדינה מהכתובת — חלק אחרון אחרי פסיק, ללא מיקוד */
  const getCountry=item=>{
    const addr=(item.address||'').trim();
    if(!addr) return 'ללא כתובת';
    const parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
    if(parts.length<2) return parts[0]||'ללא כתובת';
    let last=parts[parts.length-1];
    // הסר מיקוד בתחילה: "1013 הונגריה" → "הונגריה"
    last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').trim();
    // הסר מיקוד בסוף: "הונגריה 1013" → "הונגריה"
    last=last.replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
    // אם נשאר ריק או רק ספרות (מיקוד בלבד) → קח את החלק שלפניו ונקה גם אותו
    if(!last||/^\d+$/.test(last)){
      last=parts[parts.length-2]||'';
      last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
    }
    return last||'ללא כתובת';
  };

  /* קיבוץ לפי מדינה, ממויין אלפביתית */
  const grouped=useMemo(()=>{
    const map={};
    for(const item of trip.interestBank){
      const c=getCountry(item);
      if(!map[c]) map[c]=[];
      map[c].push(item);
    }
    return Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],'he'));
  },[trip.interestBank]);

  /* ניהול בחירה */
  const toggleSelect=(id,val)=>setSelected(prev=>{const s=new Set(prev);val?s.add(id):s.delete(id);return s;});
  const toggleCountry=(items,allSel)=>setSelected(prev=>{
    const s=new Set(prev);
    items.forEach(i=>allSel?s.delete(i.id):s.add(i.id));
    return s;
  });
  const delMany=ids=>{
    onUpdate({...trip,interestBank:trip.interestBank.filter(i=>!ids.has(i.id))});
    setSelected(prev=>{const s=new Set(prev);ids.forEach(id=>s.delete(id));return s;});
    toast(`נמחקו ${ids.size} פריטים`,'success');
  };

  /* פעולות בודדות */
  const addToBank=item=>onUpdate({...trip,interestBank:[...trip.interestBank,{...item,id:uid()}]});
  const delBank=id=>{
    onUpdate({...trip,interestBank:trip.interestBank.filter(i=>i.id!==id)});
    setSelected(prev=>{const s=new Set(prev);s.delete(id);return s;});
  };
  const toggleCollapse=country=>setExpanded(prev=>{const s=new Set(prev);s.has(country)?s.delete(country):s.add(country);return s;});

  /* הוספה ליום */
  const addItemToDay=(dayId,item)=>{
    const day=trip.days.find(d=>d.id===dayId); if(!day) return;
    const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    const nb=defaultBlock('activity',start);
    nb.title=item.name; nb.location=item.address||'';
    if(item.lat){nb.lat=item.lat;nb.lng=item.lng;}
    if(item.placeId)nb.placeId=item.placeId;
    if(item.rating)nb.placeRating=item.rating;
    if(item.userRatingsTotal)nb.placeUserRatings=item.userRatingsTotal;
    if(item.openStatus)nb.placeOpenStatus=item.openStatus;
    if(item.todayHours)nb.placeTodayHours=item.todayHours;
    if(item.phone)nb.placePhone=item.phone;
    if(item.website)nb.placeWebsite=item.website;
    if(item.photoUrl)nb.placePhotoUrl=item.photoUrl;
    if(item.placeType)nb.placeType=item.placeType;
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,blocks:[...d.blocks,nb]}:d)});
    toast(`"${item.name}" נוסף ליום`,'success');
  };

  /* ── ליבת ה-enrichment — Promise-based, ללא תלות ב-state ── */
  const enrichOneAsync=item=>new Promise(resolve=>{
    if(!window.google?.maps?.places){resolve(null);return;}
    const svc=new window.google.maps.places.PlacesService(document.createElement('div'));
    const query=item.name+(item.address?' '+item.address:'');
    svc.textSearch({query},(results,status)=>{
      const PS=window.google.maps.places.PlacesServiceStatus;
      if(status!==PS.OK||!results?.length){resolve(null);return;}
      svc.getDetails({
        placeId:results[0].place_id,
        fields:['name','formatted_address','geometry','rating','user_ratings_total',
                'opening_hours','formatted_phone_number','website','types','photos','place_id']
      },(pl,st)=>{
        if(st!==PS.OK||!pl){resolve(null);return;}
        const oh=pl.opening_hours;
        const isOpenNow=oh?.isOpen?.();
        const todayLine=oh?.weekday_text?.[new Date().getDay()]||'';
        resolve({...item,
          placeId:pl.place_id||item.placeId,
          name:pl.name||item.name,
          address:pl.formatted_address||item.address,   // ← תמיד מעדכן כתובת
          lat:pl.geometry?.location?.lat()??item.lat,
          lng:pl.geometry?.location?.lng()??item.lng,
          rating:pl.rating||item.rating||null,
          userRatingsTotal:pl.user_ratings_total||item.userRatingsTotal||null,
          phone:pl.formatted_phone_number||item.phone||'',
          website:pl.website||item.website||'',
          openStatus:isOpenNow===true?'פתוח עכשיו':isOpenNow===false?'סגור עכשיו':item.openStatus||'',
          todayHours:todayLine||item.todayHours||'',
          placeType:getPlaceTypeLabel(pl.types)||item.placeType||'',
          photoUrl:pl.photos?.[0]?.getUrl({maxWidth:400})||item.photoUrl||'',
          _noCoords:false,  // מסיר את הדגל אחרי עדכון מוצלח
        });
      });
    });
  });

  /* העשרת פריט בודד (כפתור 🔍) */
  const enrichItem=async item=>{
    if(!window.google?.maps?.places){toast('Google Maps אינו זמין — יש לוודא שהמפה טעונה','error');return;}
    if(enrichingId||batchProgress){toast('המתן לסיום ההעשרה הנוכחית','error');return;}
    setEnrichingId(item.id);
    const updated=await enrichOneAsync(item);
    setEnrichingId(null);
    if(!updated){toast('לא נמצאו תוצאות בגוגל מפות','error');return;}
    onUpdate({...tripRef.current,interestBank:tripRef.current.interestBank.map(i=>i.id===item.id?updated:i)});
    toast(`✓ "${updated.name}" עודכן — ${updated.address||'ללא כתובת'}`,'success');
  };

  /* העשרה קבוצתית — כל הפריטים ללא כתובת, אחד אחרי השני */
  const batchEnrichMissing=async()=>{
    if(!window.google?.maps?.places){toast('Google Maps אינו זמין — יש לוודא שהמפה טעונה','error');return;}
    const toEnrich=tripRef.current.interestBank.filter(i=>!i.address||i._noCoords);
    if(!toEnrich.length){toast('כל הפריטים כבר מכילים כתובת ✓','success');return;}
    let currentBank=[...tripRef.current.interestBank];
    let successCount=0;
    for(let idx=0;idx<toEnrich.length;idx++){
      setBatchProgress({done:idx,total:toEnrich.length,name:toEnrich[idx].name});
      const updated=await enrichOneAsync(toEnrich[idx]);
      if(updated){
        currentBank=currentBank.map(b=>b.id===toEnrich[idx].id?updated:b);
        onUpdate({...tripRef.current,interestBank:currentBank});
        successCount++;
      }
      await new Promise(r=>setTimeout(r,400)); // הגבלת קצב בקשות API
    }
    setBatchProgress(null);
    const skipped=toEnrich.length-successCount;
    toast(`הושלמו ${successCount} פריטים${skipped?` (${skipped} לא נמצאו)`:''}  ✓`,'success');
  };

  /* ══════════════════════════════════
     ייבוא מקישור שיתוף של גוגל מפות
     תומך: מקום בודד + רשימת מועדפים/רוצה לבקר/רשימה מותאמת
  ══════════════════════════════════ */

  /* ─── חילוץ שם + קואורדינטות מ-URL מלא של מקום בודד ─── */
  const parseMapsUrl=urlStr=>{
    let name='',lat=null,lng=null;
    const nameM=urlStr.match(/\/maps\/place\/([^/@?&#]+)/);
    if(nameM) name=decodeURIComponent(nameM[1].replace(/\+/g,' '));
    if(!name){const qM=urlStr.match(/[?&]q=([^&#]+)/);if(qM) name=decodeURIComponent(qM[1].replace(/\+/g,' '));}
    const cM=urlStr.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(cM){lat=parseFloat(cM[1]);lng=parseFloat(cM[2]);}
    if(!lat){const d3=urlStr.match(/!3d(-?\d+\.\d+)/),d4=urlStr.match(/!4d(-?\d+\.\d+)/);if(d3&&d4){lat=parseFloat(d3[1]);lng=parseFloat(d4[1]);}}
    return{name,lat,lng};
  };

  /* ─── שליפת תוכן + URL הסופי דרך proxy (allorigins → corsproxy.io) ─── */
  const fetchViaProxy=async(targetUrl)=>{
    const proxies=[
      async()=>{
        const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,{signal:AbortSignal.timeout(10000)});
        const d=await r.json();
        return{finalUrl:d?.status?.url||'',html:d?.contents||''};
      },
      async()=>{
        const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,{signal:AbortSignal.timeout(10000)});
        const html=await r.text();
        const canonM=html.match(/<link[^>]+rel="canonical"[^>]+href="([^"]+)"/i);
        return{finalUrl:canonM?.[1]||'',html};
      },
    ];
    for(const tryProxy of proxies){try{return await tryProxy();}catch{}}
    return{finalUrl:'',html:''};
  };

  /* ─── חילוץ שם מ-HTML (OG title / title tag) ─── */
  const extractNameFromHtml=html=>{
    const og=html.match(/<meta[^>]+property="og:title"[^>]+content="([^"]+)"/i)?.[1]
             ||html.match(/<meta[^>]+content="([^"]+)"[^>]+property="og:title"/i)?.[1]
             ||html.match(/<title[^>]*>([^<]+)<\/title>/i)?.[1]||'';
    return og.replace(/^Google Maps\s*[-–|·]?\s*/i,'').replace(/\s*[-–|·]?\s*Google Maps$/i,'').trim();
  };

  /* ─── חילוץ ID רשימה מ-URL ─── */
  const extractListId=url=>url.match(/!11m2[^!]*!2s([^!?&]+)/)?.[1]||null;

  /* ─── בניית URL של ה-API הפנימי לשליפת רשימה ─── */
  /* גוגל מפות preload-ает את הנתונים עם pb= מלא; נחלץ אותו מה-HTML ─── */
  const buildListApiUrl=(html,listId)=>{
    /* חלץ את ה-link המדויק מה-HTML */
    const m=html.match(/<link[^>]+href="(\/maps\/preview\/entitylist\/getlist[^"]+)"[^>]*as="fetch"/i)
           ||html.match(/<link[^>]*as="fetch"[^>]+href="(\/maps\/preview\/entitylist\/getlist[^"]+)"/i);
    if(m){
      /* הגדל את המגבלה ל-2000 פריטים (גוגל ברירת מחדל: 500) */
      const href=m[1].replace(/&amp;/g,'&').replace(/4i\d+/,'4i2000');
      return 'https://www.google.com'+href;
    }
    /* fallback — pb מינימלי מ-listId */
    const pb=`!1m4!1s${listId}!2e2!3m1!1e1!2e2!3e2!4i2000`;
    return `https://www.google.com/maps/preview/entitylist/getlist?hl=en&pb=${encodeURIComponent(pb)}`;
  };

  /* ─── פרסור תגובת ה-API של רשימת מקומות ─── */
  /* מבנה: data[0][4]=שם הרשימה, data[0][8]=מערך מקומות                  */
  /* כל מקום: p[2]=שם, p[1][2]=כתובת מלאה, p[1][5]=[null,null,lat,lng]  */
  const parseGmapsListResponse=text=>{
    const cleaned=text.replace(/^\)\]\}'\n?/,'').trim();
    const data=JSON.parse(cleaned);
    const listData=data[0];
    const listName=listData[4]||'רשימה';
    const placeEntries=listData[8]||[];
    /* total count מה-metadata (ייתכן שרשימה גדולה חוזרת חלקית) */
    const totalInList=typeof listData[12]==='number'?listData[12]:placeEntries.length;
    const places=[];
    for(const p of placeEntries){
      try{
        const name=(p[2]||'').trim();
        if(!name) continue;
        const loc=p[1]||[];
        const address=loc[2]||'';
        const coords=loc[5];
        const lat=coords?.[2]??null;
        const lng=coords?.[3]??null;
        const googlePath=loc[7]||'';
        places.push({
          id:uid(),name,address,lat,lng,
          _noCoords:!lat,
          url:googlePath?`https://www.google.com${googlePath}`:'',
        });
      }catch{}
    }
    return{listName,places,totalInList};
  };

  /* ─── ייבוא רשימה שלמה מ-API ─── */
  const importListFromLink=async(listId,html,listSrc)=>{
    const apiUrl=buildListApiUrl(html,listId);
    const{html:apiResp}=await fetchViaProxy(apiUrl);
    if(!apiResp||!apiResp.includes(")]}'")) throw new Error('לא ניתן לשלוף את נתוני הרשימה מגוגל');
    const{listName,places,totalInList}=parseGmapsListResponse(apiResp);
    if(!places.length) throw new Error('הרשימה ריקה — לא נמצאו מקומות');
    /* שיוך מקור + כפילויות */
    places.forEach(p=>p._listSource=listSrc);
    const existing=tripRef.current.interestBank;
    const newPlaces=places.filter(p=>!existing.some(ex=>isTakeoutDup(p,ex)));
    const dupCount=places.length-newPlaces.length;
    if(newPlaces.length>0){
      onUpdate({...tripRef.current,interestBank:[...existing,...newPlaces]});
    }
    /* אם קיבלנו פחות מהסה"כ — הצג אזהרה */
    const partial=totalInList>places.length;
    const msg=`✓ יובאו ${newPlaces.length} מקומות מ"${listName}"`
      +(dupCount?` (${dupCount} כפילויות דולגו)`:'')
      +(partial?` ⚠️ הרשימה מכילה ${totalInList} — ייתכן שחלק לא יובא, נסה שוב`:'');
    toast(msg,partial?'error':'success');
  };

  /* ─── כניסה ראשית: מקום בודד או רשימה ─── */
  const importFromLink=async(rawUrl,listSrc)=>{
    const url=(rawUrl||'').trim();
    if(!url){toast('הזן קישור לגוגל מפות','error');return;}
    setLinkImporting(true);
    try{
      /* ── קישור מלא (לא goo.gl) ── */
      if(!/goo\.gl/.test(url)){
        if(/!11m2/.test(url)){
          /* רשימה — URL מלא בלי HTML (אין preload); נבנה pb מ-listId */
          const listId=extractListId(url);
          if(!listId) throw new Error('לא ניתן לחלץ את מזהה הרשימה');
          await importListFromLink(listId,'',listSrc);
          setShowLinkImport(false);setLinkUrl('');setLinkImporting(false);return;
        }
        /* מקום בודד — מלא */
        const{name,lat,lng}=parseMapsUrl(url);
        if(!name&&!lat) throw new Error('לא ניתן לפרש את הקישור');
        const base={id:uid(),name:name||'מקום מגוגל מפות',address:'',lat,lng,url,_listSource:listSrc,_noCoords:!lat};
        const enriched=window.google?.maps?.places?await enrichOneAsync(base):null;
        const fi=enriched?{...enriched,_listSource:listSrc,url}:base;
        if(tripRef.current.interestBank.some(ex=>isTakeoutDup(fi,ex))){toast(`"${fi.name}" כבר קיים`,'error');setLinkImporting(false);return;}
        onUpdate({...tripRef.current,interestBank:[...tripRef.current.interestBank,fi]});
        toast(`✓ "${fi.name}" נוסף לאטרקציות`,'success');
        setShowLinkImport(false);setLinkUrl('');setLinkImporting(false);return;
      }

      /* ── קישור קצר goo.gl — פתור דרך proxy ── */
      const{finalUrl,html}=await fetchViaProxy(url);

      /* רשימה */
      if(finalUrl&&/!11m2/.test(finalUrl)){
        const listId=extractListId(finalUrl);
        if(!listId) throw new Error('לא ניתן לחלץ מזהה רשימה');
        await importListFromLink(listId,html,listSrc);
        setShowLinkImport(false);setLinkUrl('');setLinkImporting(false);return;
      }

      /* מקום בודד */
      let placeName='',lat=null,lng=null;
      if(finalUrl){const p=parseMapsUrl(finalUrl);if(p.name)placeName=p.name;if(p.lat){lat=p.lat;lng=p.lng;}}
      if(!placeName&&html) placeName=extractNameFromHtml(html);
      if(!lat&&(finalUrl||html)){const cM=(finalUrl||html).match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(cM){lat=parseFloat(cM[1]);lng=parseFloat(cM[2]);}}
      if(!placeName) throw new Error('לא ניתן לפרש את הקישור — נסה קישור ישיר מגוגל מפות');
      const base={id:uid(),name:placeName,address:'',lat,lng,url,_listSource:listSrc,_noCoords:!lat};
      const enriched=window.google?.maps?.places?await enrichOneAsync(base):null;
      const fi=enriched?{...enriched,_listSource:listSrc,url}:base;
      if(tripRef.current.interestBank.some(ex=>isTakeoutDup(fi,ex))){toast(`"${fi.name}" כבר קיים`,'error');setLinkImporting(false);return;}
      onUpdate({...tripRef.current,interestBank:[...tripRef.current.interestBank,fi]});
      toast(`✓ "${fi.name}" נוסף לאטרקציות`,'success');
      setShowLinkImport(false);setLinkUrl('');
    }catch(e){
      toast('שגיאה: '+e.message,'error');
    }
    setLinkImporting(false);
  };

  /* ייבוא Google Takeout — JSON (קואורדינטות) + CSV (לבבות/Want to go/רשימות) */
  /* בדיקת כפילות — שם זהה / קואורדינטות קרובות / URL זהה */
  const isTakeoutDup=(newItem,existing)=>{
    const norm=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
    const n=norm(newItem.name);
    if(n&&n!=='מקום ללא שם'&&n===norm(existing.name)) return true;
    if(newItem.lat!=null&&existing.lat!=null){
      if(Math.abs(newItem.lat-existing.lat)<0.0005&&Math.abs(newItem.lng-existing.lng)<0.0005) return true;
    }
    if(newItem.website&&existing.website&&newItem.website===existing.website) return true;
    return false;
  };

  const importTakeout=files=>{
    const fileList=Array.from(files);
    if(!fileList.length) return;
    /* זיהוי מקור לפי שם קובץ — לסמן על המפה */
    const detectSource=name=>{
      const n=name.toLowerCase();
      if(n.includes('liked')||n.includes('מועדפים')||n.includes('favorites')) return 'liked';
      if(n.includes('want')||n.includes('רוצה')) return 'wantToGo';
      return 'list';
    };
    const readOne=(file,done)=>{
      const r=new FileReader();
      r.onload=e=>{
        try{
          const text=e.target.result;
          const isCSV=file.name.toLowerCase().endsWith('.csv');
          const items=isCSV
            ? parseTakeoutCSV(text)
            : parseTakeoutFeatures(JSON.parse(text));
          const src=isCSV?detectSource(file.name):'saved';
          items.forEach(i=>{ if(!i._listSource) i._listSource=src; });
          done(items,isCSV);
        }catch(err){done([],false);}
      };
      r.onerror=()=>done([],false);
      r.readAsText(file,'utf-8');
    };
    const allItems=[];
    let jsonCount=0,csvCount=0;
    let pending=fileList.length;
    fileList.forEach(file=>readOne(file,(items,isCSV)=>{
      allItems.push(...items);
      if(isCSV) csvCount+=items.length; else jsonCount+=items.length;
      if(--pending===0){
        if(!allItems.length){
          toast('לא נמצאו מקומות — ודא שבחרת קבצי JSON או CSV מגוגל טייקאוט','error');
          return;
        }
        /* סינון כפילויות — כנגד הבנק הקיים וגם בתוך הקובץ החדש */
        const existing=trip.interestBank;
        const unique=[];
        for(const item of allItems){
          const dupInExisting=existing.some(e=>isTakeoutDup(item,e));
          const dupInNew=unique.some(e=>isTakeoutDup(item,e));
          if(!dupInExisting&&!dupInNew) unique.push(item);
        }
        const dupCount=allItems.length-unique.length;
        if(!unique.length){
          toast(`כל ${allItems.length} המקומות כבר קיימים בבנק — אין חדשים להוסיף`,'error');
          return;
        }
        onUpdate({...trip,interestBank:[...existing,...unique]});
        const parts=[];
        if(jsonCount) parts.push(`${unique.filter(i=>!i._noCoords).length} עם GPS`);
        if(csvCount)  parts.push(`${unique.filter(i=>i._noCoords).length} ללא GPS (לחץ 🔍)`);
        const dupMsg=dupCount>0?` (${dupCount} כפילויות דולגו)`:'';
        toast(`יובאו ${unique.length} מקומות${dupMsg} ✓`,'success');
        setShowTakeout(false);
      }
    }));
  };

  return <div style={{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--bg2)'}}>
    {/* כותרת */}
    <div style={{padding:'12px 14px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
      <span style={{fontWeight:700,fontSize:14}}>⭐ בנק אטרקציות</span>
      <span className="chip chip-blue" style={{fontSize:10}}>{trip.interestBank.length}</span>
      {selected.size>0&&<button className="btn btn-danger btn-sm"
        style={{padding:'2px 8px',fontSize:11,marginRight:2}}
        onClick={()=>{if(confirm(`למחוק ${selected.size} פריטים מסומנים?`))delMany(new Set(selected));}}>
        🗑 מחק {selected.size}
      </button>}
      <div style={{flex:1}}/>
      {(enrichingId||batchProgress)&&<span style={{fontSize:10,color:'var(--amber)'}}>⏳{batchProgress?` ${batchProgress.done}/${batchProgress.total}`:' מעשיר...'}</span>}
      {onClose&&<button onClick={onClose} style={{background:'none',border:'none',color:'var(--text3)',fontSize:20,cursor:'pointer',lineHeight:1,padding:'0 2px'}}>✕</button>}
    </div>

    {/* רשימה מקובצת */}
    <div className="scroll-y flex-1" style={{padding:'8px 10px'}}>
      {trip.interestBank.length===0
        ?<div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'24px 8px',lineHeight:1.9}}>
            לחץ על מקום במפה ← "הוסף לבנק האטרקציות".<br/>או ייבא מ-Google Takeout.
          </div>
        :grouped.map(([country,items])=>{
          const allSel=items.every(i=>selected.has(i.id));
          const someSel=items.some(i=>selected.has(i.id));
          const isCollapsed=!expanded.has(country);
          const selCount=items.filter(i=>selected.has(i.id)).length;
          return <div key={country} style={{marginBottom:10}}>
            {/* כותרת מדינה */}
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 8px',
              background:'var(--bg3)',borderRadius:8,cursor:'pointer',userSelect:'none',
              marginBottom:isCollapsed?0:6,borderBottom:isCollapsed?'none':'1px solid var(--border)'}}
              onClick={()=>toggleCollapse(country)}>
              <span style={{fontSize:10,color:'var(--text3)',lineHeight:1}}>{isCollapsed?'▶':'▼'}</span>
              <span style={{fontSize:12,fontWeight:700,flex:1,color:'var(--text)'}}>{country}</span>
              <span style={{fontSize:10,color:'var(--text3)'}}>({items.length})</span>
              {/* צ'קבוקס לבחירת כל המדינה */}
              <input type="checkbox"
                checked={allSel}
                ref={el=>{if(el)el.indeterminate=someSel&&!allSel;}}
                onChange={e=>{e.stopPropagation();toggleCountry(items,allSel);}}
                onClick={e=>e.stopPropagation()}
                style={{cursor:'pointer',width:13,height:13,flexShrink:0}}
                title="בחר/בטל הכל"/>
              {someSel&&<button className="btn btn-danger btn-sm"
                style={{padding:'1px 6px',fontSize:10,flexShrink:0}}
                onClick={e=>{e.stopPropagation();
                  if(confirm(`למחוק ${selCount} פריטים מסומנים מ-${country}?`))
                    delMany(new Set(items.filter(i=>selected.has(i.id)).map(i=>i.id)));}}
                title={`מחק פריטים מסומנים מ-${country}`}>🗑 {selCount}</button>}
            </div>
            {/* פריטים */}
            {!isCollapsed&&items.map(item=>(
              <BankItem key={item.id} item={item} days={trip.days} onAddToDay={addItemToDay}
                onDelete={()=>delBank(item.id)} onLocate={onLocate} onFocusItem={onFocusItem}
                selected={selected.has(item.id)} onSelect={toggleSelect}
                onEnrich={enrichItem} enriching={enrichingId===item.id}/>
            ))}
          </div>;
        })
      }
    </div>

    {/* כפתורי תחתית */}
    <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
      {/* סרגל התקדמות העשרה קבוצתית */}
      {batchProgress&&<div style={{background:'var(--bg3)',borderRadius:8,padding:'8px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text2)',marginBottom:5}}>
          <span>🔍 מאתר כתובות...</span>
          <span style={{color:'var(--amber)',fontWeight:700}}>{batchProgress.done}/{batchProgress.total}</span>
        </div>
        <div style={{background:'var(--border)',borderRadius:4,height:5,overflow:'hidden'}}>
          <div style={{background:'var(--amber)',height:'100%',borderRadius:4,
            width:`${Math.round(batchProgress.done/batchProgress.total*100)}%`,
            transition:'width 0.3s'}}/>
        </div>
        {batchProgress.name&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          ⏳ {batchProgress.name}
        </div>}
      </div>}
      {/* כפתור השלמת כתובות קבוצתית — מופיע רק כשיש פריטים ללא כתובת */}
      {!batchProgress&&trip.interestBank.some(i=>!i.address||i._noCoords)&&(
        <button className="btn btn-amber btn-sm" style={{width:'100%'}}
          disabled={!!enrichingId} onClick={batchEnrichMissing}>
          🔍 השלם כתובות לכל הפריטים ({trip.interestBank.filter(i=>!i.address||i._noCoords).length})
        </button>
      )}
      <button className="btn btn-secondary btn-sm" style={{width:'100%'}}
        onClick={()=>{const n=prompt('שם המקום:');if(n)addToBank({name:n,address:'',id:uid()});}}>
        + הוסף ידנית
      </button>
      <button className="btn btn-secondary btn-sm" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)'}}
        onClick={()=>setShowLinkImport(true)}>
        🔗 ייבא מקישור גוגל מפות
      </button>
      <button className="btn btn-amber btn-sm" style={{width:'100%'}} onClick={()=>setShowTakeout(true)}>
        ⭐ ייבא מ-Google Takeout
      </button>
    </div>

    {/* מודל ייבוא מקישור גוגל מפות */}
    {showLinkImport&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowLinkImport(false)}>
      <div className="modal" style={{maxWidth:480,width:'95vw'}}>
        <div className="modal-header">
          <span style={{fontWeight:700}}>🔗 ייבוא מקישור גוגל מפות</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>setShowLinkImport(false)}>✕</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:14}}>

          {/* הסבר */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:12,fontSize:12,lineHeight:1.9,color:'var(--text2)'}}>
            <div style={{fontWeight:700,color:'var(--text)',marginBottom:6,fontSize:13}}>תומך בשני סוגי קישורים:</div>
            <div style={{marginBottom:6}}>
              <span style={{fontWeight:700,color:'var(--green)'}}>📍 מקום בודד</span> — שתף מקום ספציפי בגוגל מפות<br/>
              <span style={{color:'var(--text3)',fontSize:11}}>לחץ על מקום ← ↗ שתף ← העתק קישור</span>
            </div>
            <div>
              <span style={{fontWeight:700,color:'var(--green)'}}>🗂️ רשימה שלמה</span> — שתף רשימת מועדפים / רוצה לבקר / רשימה מותאמת<br/>
              <span style={{color:'var(--text3)',fontSize:11}}>תפריט ☰ ← Saved ← בחר רשימה ← שתף (↗) ← העתק קישור</span>
            </div>
          </div>

          {/* שדה URL */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--text2)',display:'block',marginBottom:5}}>
              קישור גוגל מפות
            </label>
            <input
              type="url"
              value={linkUrl}
              onChange={e=>setLinkUrl(e.target.value)}
              placeholder="https://maps.app.goo.gl/..."
              style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid var(--border)',
                background:'var(--bg2)',color:'var(--text)',fontSize:13,direction:'ltr',boxSizing:'border-box'}}
              onKeyDown={e=>e.key==='Enter'&&!linkImporting&&importFromLink(linkUrl,linkSource)}
              autoFocus
            />
          </div>

          {/* סוג הרשימה */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--text2)',display:'block',marginBottom:8}}>
              סוג הסימון במפה
            </label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {[
                {val:'liked',     emoji:'❤️', label:'מועדפים (לב)',       color:'#ec4899'},
                {val:'wantToGo',  emoji:'🏴', label:'רוצה לבקר (דגל)',   color:'#22c55e'},
                {val:'saved',     emoji:'⭐', label:'שמור (כוכב)',        color:'#f59e0b'},
                {val:'list',      emoji:'📋', label:'רשימה (יהלום)',      color:'#6366f1'},
                {val:'itinerary', emoji:'🧳', label:'תוכנית נסיעה (לינה)',color:'#16a34a'},
              ].map(opt=>(
                <div key={opt.val}
                  onClick={()=>setLinkSource(opt.val)}
                  style={{
                    padding:'9px 12px',borderRadius:9,cursor:'pointer',fontSize:13,fontWeight:600,
                    display:'flex',alignItems:'center',gap:8,
                    border:`2px solid ${linkSource===opt.val?opt.color:'var(--border)'}`,
                    background:linkSource===opt.val?opt.color+'22':'var(--bg3)',
                    color:linkSource===opt.val?opt.color:'var(--text2)',
                    transition:'all 0.15s',
                  }}>
                  <span style={{fontSize:16}}>{opt.emoji}</span>
                  <span>{opt.label}</span>
                </div>
              ))}
            </div>
          </div>

          {/* כפתור ייבוא */}
          <button
            className="btn btn-primary"
            style={{width:'100%',justifyContent:'center',gap:8,fontSize:14,fontWeight:700,padding:'10px 0'}}
            disabled={linkImporting||!linkUrl.trim()}
            onClick={()=>importFromLink(linkUrl,linkSource)}>
            {linkImporting
              ? <><span style={{display:'inline-block',animation:'spin 1s linear infinite'}}>⏳</span> מייבא...</>
              : '🔗 ייבא מקום'}
          </button>
        </div>
      </div>
    </div>}

    {/* מודל ייבוא Takeout */}
    {showTakeout&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowTakeout(false)}>
      <div className="modal" style={{maxWidth:520,width:'95vw'}}>
        <div className="modal-header">
          <span style={{fontWeight:700}}>📥 ייבוא מקומות מגוגל מפות</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>setShowTakeout(false)}>✕</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:12}}>

          {/* שלב 1 — הורדה */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:13,fontSize:13,lineHeight:1.9}}>
            <div style={{fontWeight:700,color:'var(--text)',marginBottom:4}}>שלב 1 — הורד מ-Google Takeout</div>
            <div style={{color:'var(--text2)'}}>
              1. עבור ל-<a href="https://takeout.google.com" target="_blank" rel="noreferrer" style={{color:'var(--accent)'}}>takeout.google.com</a>
              {' '}← לחץ <strong>"בטל בחירת הכל"</strong><br/>
              2. חפש וסמן ✅ <strong>"Maps (your places)"</strong><br/>
              3. חפש וסמן ✅ <strong>"Saved"</strong> <span style={{color:'var(--text3)',fontSize:11}}>(ללא זה — לא יהיו לבבות ורשימות פרטיות)</span><br/>
              4. לחץ <strong>"Next step"</strong> → <strong>"Create export"</strong> → הורד את ה-ZIP
            </div>
          </div>

          {/* שלב 2 — איפה הקבצים */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:13,fontSize:12,lineHeight:1.8}}>
            <div style={{fontWeight:700,color:'var(--text)',marginBottom:6,fontSize:13}}>שלב 2 — אילו קבצים לפתוח מה-ZIP?</div>
            {/* JSON עם GPS */}
            <div style={{marginBottom:8}}>
              <div style={{fontWeight:600,color:'var(--text)',fontSize:12,marginBottom:3}}>
                📁 <code style={{background:'var(--bg2)',padding:'1px 5px',borderRadius:4}}>Takeout / Maps (your places) /</code>
              </div>
              <div style={{color:'var(--text2)',paddingRight:16,lineHeight:2}}>
                🔖 <strong>Saved Places.json</strong> — מקומות שמורים, עם GPS ✅<br/>
              </div>
            </div>
            {/* CSV ללא GPS */}
            <div>
              <div style={{fontWeight:600,color:'var(--text)',fontSize:12,marginBottom:3}}>
                📁 <code style={{background:'var(--bg2)',padding:'1px 5px',borderRadius:4}}>Takeout / Saved /</code>
              </div>
              <div style={{color:'var(--text2)',paddingRight:16,lineHeight:2}}>
                ❤️ <strong>Liked places.csv</strong> — מקומות שסימנת בלב<br/>
                🏴 <strong>Want to go.csv</strong> — "רוצה לבקר"<br/>
                📋 <strong>[שם הרשימה].csv</strong> — כל רשימה פרטית שיצרת<br/>
              </div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:2,paddingRight:16}}>
                ⚠️ קבצי CSV ללא קואורדינטות — לאחר ייבוא לחץ 🔍 על כל פריט להשלמת פרטים מגוגל מפות
              </div>
            </div>
          </div>

          {/* שלב 3 — אזור גרירה */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:10}}>
            <div style={{fontWeight:700,color:'var(--text)',fontSize:13,marginBottom:8}}>שלב 3 — טען את הקבצים</div>
            <div style={{border:'2px dashed var(--border)',borderRadius:8,padding:18,textAlign:'center',cursor:'pointer'}}
              onClick={()=>takeoutRef.current?.click()}
              onDragOver={e=>e.preventDefault()}
              onDrop={e=>{e.preventDefault();if(e.dataTransfer.files.length)importTakeout(e.dataTransfer.files);}}>
              <div style={{fontSize:26,marginBottom:5}}>📂</div>
              <div style={{fontSize:13,color:'var(--text2)',fontWeight:600}}>לחץ לבחירה או גרור קבצים לכאן</div>
              <div style={{fontSize:11,color:'var(--text3)',marginTop:3}}>ניתן לבחור כמה קבצים יחד — JSON וגם CSV בו-זמנית</div>
            </div>
          </div>

          <input ref={takeoutRef} type="file" accept=".json,.csv" multiple style={{display:'none'}}
            onChange={e=>e.target.files.length&&importTakeout(e.target.files)}/>
        </div>
      </div>
    </div>}
  </div>;
}

/* ══════════════════════════════════
   לשונית הוצאות
══════════════════════════════════ */
function ExpensesTab({trip,onUpdate}){
  const[form,setForm]=useState({category:'דלק',amount:'',description:'',date:new Date().toISOString().slice(0,10)});
  const add=()=>{
    if (!form.amount||isNaN(parseFloat(form.amount))){toast('הזן סכום תקני','error');return;}
    onUpdate({...trip,expenses:[...trip.expenses,{id:uid(),...form,amount:parseFloat(form.amount)}]});
    setForm(f=>({...f,amount:'',description:''})); toast('הוצאה נוספה','success');
  };
  const del=id=>onUpdate({...trip,expenses:trip.expenses.filter(e=>e.id!==id)});
  const byCat=EXPENSE_CATS.reduce((a,c)=>{a[c]=trip.expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0);return a;},{});
  const total=trip.expenses.reduce((s,e)=>s+e.amount,0);

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
        <span style={{fontWeight:700,fontSize:15}}>💰 מעקב הוצאות</span>
        <span style={{fontFamily:'Heebo,sans-serif',fontSize:22,fontWeight:800,color:'var(--accent)',marginRight:'auto'}}>
          סה"כ: ₪{total.toFixed(0)}
        </span>
      </div>
      {total>0&&<>
        <div style={{display:'flex',borderRadius:6,overflow:'hidden',height:10,marginBottom:8}}>
          {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
            <div key={c} style={{flex:byCat[c]/total,background:CAT_COLORS[c]}} title={`${c}: ₪${byCat[c].toFixed(0)}`}/>
          ))}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
            <span key={c} style={{fontSize:11,color:CAT_COLORS[c]}}>● {c}: ₪{byCat[c].toFixed(0)}</span>
          ))}
        </div>
      </>}
    </div>

    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 130px',gap:8,marginBottom:8}}>
        <div><label className="label">קטגוריה</label>
          <select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="label">תיאור</label>
          <input className="input" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="אופציונלי…" onKeyDown={e=>e.key==='Enter'&&add()}/></div>
        <div><label className="label">תאריך</label>
          <input className="input" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
        <div style={{flex:1}}><label className="label">סכום (₪)</label>
          <input className="input" type="number" min="0" step="1" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0" onKeyDown={e=>e.key==='Enter'&&add()}/></div>
        <button className="btn btn-primary" onClick={add}>+ הוסף</button>
      </div>
    </div>

    <div className="scroll-y flex-1">
      {trip.expenses.length===0?(
        <div className="empty-state"><div className="emoji">💸</div><p>אין הוצאות עדיין. התחל לרשום הוצאות למעלה.</p></div>
      ):[...trip.expenses].reverse().map(ex=>(
        <div key={ex.id} className="expense-row">
          <div style={{width:10,height:10,borderRadius:'50%',background:CAT_COLORS[ex.category]||'#888',flexShrink:0}}/>
          <span className="chip" style={{background:(CAT_COLORS[ex.category]||'#888')+'22',color:CAT_COLORS[ex.category]||'#888',fontSize:11}}>{ex.category}</span>
          <div style={{flex:1,fontSize:13}}>{ex.description||ex.category}<span style={{color:'var(--text3)',fontSize:11,marginRight:8}}>{ex.date}</span></div>
          <span style={{fontWeight:700,fontSize:14}}>₪{ex.amount.toFixed(0)}</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>del(ex.id)}>✕</button>
        </div>
      ))}
    </div>
  </div>;
}

/* ══════════════════════════════════
   רשימת תיוג (ציוד / קניות)
══════════════════════════════════ */
function Checklist({title,emoji,items,onUpdate}){
  const[text,setText]=useState(''),[cat,setCat]=useState('כללי');
  const add=()=>{const t=text.trim();if(!t)return;onUpdate([...items,{id:uid(),text:t,done:false,category:cat||'כללי'}]);setText('');};
  const tog=id=>onUpdate(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const del=id=>onUpdate(items.filter(i=>i.id!==id));
  const done=items.filter(i=>i.done).length;
  const cats=[...new Set(items.map(i=>i.category||'כללי'))];
  const grouped=items.reduce((a,i)=>{const c=i.category||'כללי';if(!a[c])a[c]=[];a[c].push(i);return a;},{});

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:15}}>{emoji} {title}</span>
      <span className="chip chip-green" style={{fontSize:11}}>{done}/{items.length} הושלמו</span>
      {items.length>0&&<div className="progress" style={{flex:1}}><div className="progress-fill" style={{width:`${items.length?(done/items.length)*100:0}%`,background:'var(--green)'}}/></div>}
      <button className="btn btn-danger btn-sm" onClick={()=>onUpdate(items.filter(i=>!i.done))}>נקה הושלמו</button>
    </div>
    <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',gap:8}}>
      <input className="input" value={text} onChange={e=>setText(e.target.value)} placeholder={`הוסף פריט ל${title}…`} onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:2}}/>
      <input className="input" value={cat} onChange={e=>setCat(e.target.value)} placeholder="קטגוריה" list={`cats-${title}`} style={{flex:1}}/>
      <datalist id={`cats-${title}`}>{cats.map(c=><option key={c} value={c}/>)}</datalist>
      <button className="btn btn-primary" onClick={add}>+</button>
    </div>
    <div className="scroll-y flex-1" style={{padding:'12px 16px'}}>
      {items.length===0?(
        <div className="empty-state"><div className="emoji">{emoji}</div><p>{title} ריקה. הוסף פריטים למעלה.</p></div>
      ):Object.entries(grouped).map(([c,citems])=>(
        <div key={c} style={{marginBottom:16}}>
          <div className="section-title">{c}</div>
          {citems.map(item=>(
            <div key={item.id} className={`list-item${item.done?' done':''}`}>
              <input type="checkbox" checked={item.done} onChange={()=>tog(item.id)} style={{cursor:'pointer',accentColor:'var(--accent)',flexShrink:0}}/>
              <span className="item-text" style={{flex:1,fontSize:13}}>{item.text}</span>
              <button className="btn btn-secondary btn-icon btn-sm" style={{opacity:.35,transition:'opacity .15s'}}
                onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=.35}
                onClick={()=>del(item.id)}>✕</button>
            </div>
          ))}
        </div>
      ))}
    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית מסמכים
══════════════════════════════════ */
function DocsTab({trip,onUpdate,settings}){
  const[busy,setBusy]=useState(false);
  const fileRef=useRef(null);
  const hasFb=!!(settings.firebaseUrl&&settings.syncKey);
  const MAX_BYTES=8*1024*1024; // 8MB — Firebase REST practical limit
  const WARN_BYTES=3*1024*1024; // 3MB — אזהרה
  const fmtSize=b=>b>=1024*1024?`${(b/1024/1024).toFixed(1)}MB`:b>=1024?`${Math.round(b/1024)}KB`:`${b}B`;
  const icon=t=>t?.includes('pdf')?'📄':t?.startsWith('image')?'🖼️':t?.includes('word')||t?.includes('document')?'📝':t?.includes('sheet')||t?.includes('excel')?'📊':'📎';

  const upload=async file=>{
    if(file.size>MAX_BYTES){
      toast(`הקובץ גדול מדי (${fmtSize(file.size)}) — המגבלה היא ${fmtSize(MAX_BYTES)} לקובץ`,'error');
      return;
    }
    setBusy(true);
    try{
      const url=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result);
        r.onerror=rej;
        r.readAsDataURL(file);
      });
      const doc={id:uid(),name:file.name,type:file.type,size:file.size,
        url,savedAt:new Date().toISOString(),
        source:hasFb?'firebase':'local'};
      onUpdate({...trip,documents:[...trip.documents,doc]});
      if(file.size>WARN_BYTES)
        toast(`"${file.name}" נשמר (${fmtSize(file.size)}) — קובץ גדול עלול להאט סנכרון`,'info');
      else
        toast(`"${file.name}" ${hasFb?'נשמר ויסונכרן ל-Firebase ✓':'נשמר מקומית — הגדר Firebase לסנכרון'}`,'success');
    }catch(e){toast(`שגיאה בשמירה: ${e.message}`,'error');}
    finally{setBusy(false);}
  };

  const totalSize=trip.documents.reduce((s,d)=>s+(d.size||0),0);
  const srcLabel=doc=>doc.source==='github'?'☁️ גיטהאב':hasFb?'☁️ Firebase':'💾 מקומי';

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    {/* כותרת */}
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:15}}>📁 מסמכים</span>
      <span className="chip chip-blue" style={{fontSize:11}}>{trip.documents.length} קבצים</span>
      {trip.documents.length>0&&<span style={{fontSize:11,color:'var(--text3)'}}>{fmtSize(totalSize)} סה"כ</span>}
      <div style={{flex:1}}/>
      <button className="btn btn-primary" onClick={()=>fileRef.current?.click()} disabled={busy}>
        {busy?'⏳ שומר…':'+ העלה קובץ'}
      </button>
      <input ref={fileRef} type="file" style={{display:'none'}} multiple
        onChange={e=>{Array.from(e.target.files).forEach(upload);e.target.value='';}}/>
    </div>

    {/* תוכן */}
    <div className="scroll-y flex-1" style={{padding:16}}
      onDragOver={e=>e.preventDefault()}
      onDrop={e=>{e.preventDefault();Array.from(e.dataTransfer.files).forEach(upload);}}>
      {trip.documents.length===0?(
        <div className="empty-state">
          <div className="emoji">📁</div>
          <div style={{fontWeight:600,color:'var(--text)'}}>אין מסמכים עדיין</div>
          <p style={{lineHeight:1.9}}>
            העלה דרכונים, ביטוח, כרטיסים, מפות קמפינג ועוד.<br/>
            {hasFb
              ?<><strong style={{color:'var(--green)'}}>☁️ Firebase מחובר</strong> — הקבצים יסונכרנו אוטומטית לכל המכשירים.</>
              :<><strong style={{color:'var(--amber)'}}>💾 אחסון מקומי</strong> — הגדר Firebase בלשונית 🔗 חיבוריות כדי לסנכרן.</>}
            <br/><span style={{fontSize:11,color:'var(--text3)'}}>מגבלה: עד {fmtSize(MAX_BYTES)} לקובץ</span>
          </p>
          <button className="btn btn-primary" onClick={()=>fileRef.current?.click()}>+ העלה קובץ</button>
        </div>
      ):(
        <div className="doc-grid">
          {trip.documents.map(doc=>(
            <div key={doc.id} className="doc-item">
              <button onClick={()=>onUpdate({...trip,documents:trip.documents.filter(d=>d.id!==doc.id)})}
                style={{position:'absolute',top:6,left:6,background:'var(--red)',color:'#fff',border:'none',
                  borderRadius:6,width:20,height:20,fontSize:10,cursor:'pointer',
                  display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
              {doc.type?.startsWith('image/')&&doc.url
                ?<img src={doc.url} alt={doc.name} style={{width:'100%',height:80,objectFit:'cover',borderRadius:6,marginBottom:6}}/>
                :<div style={{fontSize:36,marginBottom:8}}>{icon(doc.type)}</div>}
              <div style={{fontSize:11,color:'var(--text2)',wordBreak:'break-word',lineHeight:1.4}}>{doc.name}</div>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:3,display:'flex',gap:6,flexWrap:'wrap'}}>
                <span>{srcLabel(doc)}</span>
                {doc.size>0&&<span>{fmtSize(doc.size)}</span>}
                {doc.savedAt&&<span>{new Date(doc.savedAt).toLocaleDateString('he-IL')}</span>}
              </div>
              {doc.url&&(
                doc.source==='github'
                  ?<a href={doc.url} target="_blank" rel="noreferrer" style={{fontSize:10,color:'var(--accent)',textDecoration:'none',display:'block',marginTop:4}}>פתח ↗</a>
                  :<a href={doc.url} download={doc.name} style={{fontSize:10,color:'var(--accent)',textDecoration:'none',display:'block',marginTop:4}}>הורד ↓</a>
              )}
            </div>
          ))}
        </div>
      )}
    </div>

    {/* פס מידע תחתון */}
    <div style={{padding:'7px 16px',borderTop:'1px solid var(--border)',background:'var(--bg2)',
      fontSize:11,color:'var(--text3)',lineHeight:1.7}}>
      {hasFb
        ?<>☁️ <strong>Firebase</strong> — הקבצים שמורים בתוך ה-JSON ומסונכרנים אוטומטית לכל המכשירים.
          &nbsp;מגבלה: עד {fmtSize(MAX_BYTES)} לקובץ. הנתונים <strong>לא נמחקים לעולם</strong> — רק הגישה יכולה להיחסם אם Rules מוגדרים שגוי.</>
        :<>💾 <strong>מקומי</strong> — הקבצים שמורים בדפדפן זה בלבד ולא מסונכרנים.
          &nbsp;<span style={{color:'var(--amber)'}}>הגדר Firebase בלשונית 🔗 חיבוריות לסנכרון.</span></>}
    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית הערות ומזג אוויר
══════════════════════════════════ */
function NotesTab({trip,onUpdate}){
  const[newNote,setNewNote]=useState('');
  const[weatherData,setWeatherData]=useState(null),[wLoading,setWLoading]=useState(false),[wLabel,setWLabel]=useState('');
  const[cityInput,setCityInput]=useState('');

  const loadWeather=(lat,lng,label)=>{
    setWLoading(true);
    fetchWeather(lat,lng)
      .then(w=>{setWeatherData(w);setWLabel(label);})
      .catch(()=>toast('שגיאה בטעינת מזג האוויר','error'))
      .finally(()=>setWLoading(false));
  };

  const fetchByCity=async()=>{
    const q=cityInput.trim(); if(!q) return;
    setWLoading(true);
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=he&format=json`);
      const d=await r.json();
      if(!d.results?.length){toast('עיר לא נמצאה — נסה שוב','error');setWLoading(false);return;}
      const{latitude:lat,longitude:lng,name,country}=d.results[0];
      loadWeather(lat,lng,`${name}, ${country}`);
    }catch{toast('שגיאה בחיפוש המיקום','error');setWLoading(false);}
  };

  const fetchByGPS=()=>{
    if(!navigator.geolocation){toast('הדפדפן לא תומך במיקום','error');return;}
    setWLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos=>loadWeather(pos.coords.latitude,pos.coords.longitude,'המיקום הנוכחי שלי'),
      ()=>{toast('לא ניתן לגשת למיקום — אשר הרשאה בדפדפן','error');setWLoading(false);}
    );
  };

  const addNote=()=>{
    const t=newNote.trim(); if(!t) return;
    onUpdate({...trip,quickNotes:[...(trip.quickNotes||[]),{id:uid(),text:t,createdAt:new Date().toISOString()}]});
    setNewNote('');
  };
  const delNote=id=>onUpdate({...trip,quickNotes:(trip.quickNotes||[]).filter(n=>n.id!==id)});

  const[wIcon,wDesc]=weatherData?WMO[weatherData.current_weather?.weathercode]||['🌡️','לא ידוע']:[];

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:700,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      {/* מזג אוויר לפי איזור */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🌤️ מזג אוויר לפי איזור</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:6}}>
            <input className="input" style={{flex:1}} value={cityInput} onChange={e=>setCityInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&fetchByCity()}
              placeholder="הקלד עיר או אזור — למשל: אילת, פריז, כנרת…"/>
            <button className="btn btn-primary btn-sm" onClick={fetchByCity} disabled={wLoading||!cityInput.trim()}>חפש</button>
            <button className="btn btn-secondary btn-sm" onClick={fetchByGPS} disabled={wLoading} title="מיקום נוכחי">📍</button>
          </div>
          {wLoading&&<div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:'8px 0'}}>⏳ טוען מזג אוויר...</div>}
          {weatherData&&!wLoading&&(
            <div>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>📍 {wLabel}</div>
              <div className="weather-card" style={{marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                  <span style={{fontSize:40}}>{wIcon}</span>
                  <div>
                    <div style={{fontSize:26,fontWeight:700}}>{Math.round(weatherData.current_weather?.temperature)}°C</div>
                    <div style={{fontSize:13,opacity:.85}}>{wDesc}</div>
                  </div>
                  <div style={{marginRight:'auto'}}>
                    <a href="https://ims.gov.il/he/forecast_regional" target="_blank" rel="noreferrer"
                       style={{fontSize:11,color:'#90cdf4',display:'block',marginBottom:4}}>🇮🇱 שירות מטאורולוגי ↗</a>
                    <a href="https://www.windy.com/" target="_blank" rel="noreferrer"
                       style={{fontSize:11,color:'#90cdf4',display:'block'}}>🌐 Windy ↗</a>
                  </div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  {(weatherData.daily?.time||[]).slice(0,5).map((date,i)=>{
                    const[di]=WMO[weatherData.daily.weathercode[i]]||['🌡️'];
                    return <div key={date} style={{flex:1,background:'rgba(255,255,255,.1)',borderRadius:8,padding:'6px 6px',textAlign:'center'}}>
                      <div style={{fontSize:10,opacity:.7,marginBottom:2}}>{new Date(date).toLocaleDateString('he-IL',{weekday:'short'})}</div>
                      <div style={{fontSize:18}}>{di}</div>
                      <div style={{fontSize:11,fontWeight:600}}>{Math.round(weatherData.daily.temperature_2m_max[i])}°</div>
                      <div style={{fontSize:10,opacity:.6}}>{Math.round(weatherData.daily.temperature_2m_min[i])}°</div>
                    </div>;
                  })}
                </div>
              </div>
            </div>
          )}
          {!weatherData&&!wLoading&&(
            <div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'4px 0'}}>
              הקלד עיר/אזור לתחזית, או לחץ 📍 למיקום הנוכחי
            </div>
          )}
        </div>
      </div>

      {/* הערות כלליות לטיול */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>📝 הערות כלליות לטיול</span></div>
        <div className="card-body">
          <textarea className="input" rows={6}
            value={trip.generalNotes||''}
            onChange={e=>onUpdate({...trip,generalNotes:e.target.value})}
            placeholder="כתוב כאן כל מה שחשוב לזכור — קשר לאתר קמפינג, טלפונים, קודי אזור, הערות מיוחדות..."/>
        </div>
      </div>

      {/* פתקיות מהירות */}
      <div className="card">
        <div className="card-header">
          <span style={{fontWeight:700}}>📌 פתקיות מהירות</span>
          <span className="chip chip-blue" style={{fontSize:11}}>{(trip.quickNotes||[]).length}</span>
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:8}}>
            <input className="input" value={newNote} onChange={e=>setNewNote(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addNote()}
              placeholder="הוסף פתקית (Enter לשמירה)..." style={{flex:1}}/>
            <button className="btn btn-primary btn-sm" onClick={addNote} disabled={!newNote.trim()}>+ הוסף</button>
          </div>
          {(trip.quickNotes||[]).length===0&&(
            <div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:'8px 0'}}>אין פתקיות עדיין</div>
          )}
          {(trip.quickNotes||[]).map(n=>(
            <div key={n.id} className="interest-item" style={{justifyContent:'space-between'}}>
              <div style={{flex:1,fontSize:13,lineHeight:1.5,wordBreak:'break-word'}}>{n.text}</div>
              <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0,marginRight:8}}>
                <span style={{fontSize:10,color:'var(--text3)'}}>{new Date(n.createdAt).toLocaleDateString('he-IL')}</span>
                <button className="btn btn-danger btn-icon btn-sm" onClick={()=>delNote(n.id)}>✕</button>
              </div>
            </div>
          ))}
        </div>
      </div>

    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית הגדרות
══════════════════════════════════ */
function SettingsTab({settings,onSettings,trips,activeTrip,onNewTrip,onLoadTrip,onDeleteTrip,onPush,onPull,ghBusy,genKey}){
  const[s,setS]=useState({...settings});
  const upd=(k,v)=>setS(p=>({...p,[k]:v}));
  const[showForm,setShowForm]=useState(false);
  const[newName,setNewName]=useState('');
  const createTrip=()=>{
    const n=newName.trim()||'טיול חדש';
    onNewTrip(n);
    setNewName(''); setShowForm(false);
  };

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:640,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>✈️ ניהול טיולים</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:12}}>
          {!showForm?(
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={()=>{setNewName('');setShowForm(true);}}>+ טיול חדש</button>
              {activeTrip&&<button className="btn btn-secondary" onClick={()=>{setNewName(activeTrip.name+' עותק');setShowForm(true);}}>📋 שמור כעותק</button>}
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:8,background:'var(--surface2)',borderRadius:10,padding:'12px'}}>
              <label className="label">שם הטיול החדש</label>
              <div style={{display:'flex',gap:6}}>
                <input className="input" style={{flex:1}} value={newName} onChange={e=>setNewName(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')createTrip();if(e.key==='Escape'){setShowForm(false);setNewName('');}}}
                  placeholder="למשל: קיץ 2025 — אירופה" autoFocus/>
                <button className="btn btn-primary btn-sm" onClick={createTrip}>צור</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>{setShowForm(false);setNewName('');}}>ביטול</button>
              </div>
            </div>
          )}
          {trips.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:8,background:t.id===activeTrip?.id?'rgba(79,142,247,.12)':'var(--surface2)'}}>
              <div style={{flex:1,fontSize:13}}>
                <div style={{fontWeight:600}}>{t.name}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>{t.startDate||'—'} → {t.endDate||'—'} · {t.days.length} ימים · {t.expenses.length} הוצאות</div>
              </div>
              {t.id!==activeTrip?.id&&<button className="btn btn-secondary btn-sm" onClick={()=>onLoadTrip(t.id)}>טען</button>}
              {t.id===activeTrip?.id&&<span className="chip chip-green" style={{fontSize:10}}>פעיל</span>}
              <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm(`למחוק את "${t.name}"?`))onDeleteTrip(t.id);}}>🗑</button>
            </div>
          ))}
        </div>
      </div>

      {activeTrip&&<div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🚐 פרופיל רכב ופרטי טיול</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div><label className="label">שם הטיול</label>
            <input className="input" value={activeTrip.name||''} onChange={e=>onLoadTrip(null,{...activeTrip,name:e.target.value})} placeholder="למשל: חופשת קיץ 2025"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {[['name','שם הרכב'],['plate','לוחית רישוי'],['height','גובה (מ׳)'],['width','רוחב (מ׳)'],['weight','משקל (ק"ג)']].map(([k,lbl])=>(
              <div key={k}><label className="label">{lbl}</label>
                <input className="input" value={activeTrip.vehicle[k]||''} onChange={e=>onLoadTrip(null,{...activeTrip,vehicle:{...activeTrip.vehicle,[k]:e.target.value}})} placeholder={lbl}/></div>
            ))}
          </div>
          <div className="section-title" style={{marginTop:8}}>מים וקקי</div>
          {[['waterFillDate','waterLog','💧 תאריך מילוי מים'],['wasteEmptyDate','wasteLog','🪣 תאריך ריקון קקי']].map(([k,lk,lbl])=>{
            const logArr=activeTrip.vehicle[lk]||[];
            const saveDate=(newDate)=>{
              const oldDate=activeTrip.vehicle[k]||'';
              const newLog=newDate&&newDate!==oldDate?[...logArr,newDate]:logArr;
              onLoadTrip(null,{...activeTrip,vehicle:{...activeTrip.vehicle,[k]:newDate,[lk]:newLog}});
            };
            return <div key={k}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                <span style={{fontSize:12,color:'var(--text2)',flex:1}}>{lbl}</span>
                <input type="date" className="input" value={activeTrip.vehicle[k]||''} style={{width:150}}
                  onChange={e=>saveDate(e.target.value)}/>
                <button className="btn btn-secondary btn-sm" onClick={()=>saveDate(todayISO())}>היום</button>
              </div>
              {logArr.length>0&&<div style={{fontSize:10,color:'var(--text3)',paddingRight:4,marginBottom:6}}>
                היסטוריה: {[...logArr].reverse().slice(0,4).map(d=>new Date(d).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'})).join(' ← ')}
              </div>}
            </div>;
          })}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:8}}>
            {[['startDate','תאריך תחילה'],['endDate','תאריך סיום']].map(([k,lbl])=>(
              <div key={k}><label className="label">{lbl}</label>
                <input className="input" type="date" value={activeTrip[k]||''} onChange={e=>onLoadTrip(null,{...activeTrip,[k]:e.target.value})}/></div>
            ))}
          </div>
        </div>
      </div>}

      {/* ── Firebase (מועדף) ── */}
      <div className="card" style={{border:s.firebaseUrl&&s.syncKey?'2px solid var(--green)':!s.githubToken?'2px solid var(--amber)':'1px solid var(--border)'}}>
        <div className="card-header">
          <span style={{fontWeight:700}}>☁️ סנכרון בין מכשירים</span>
          {s.firebaseUrl&&s.syncKey?<span className="chip chip-green" style={{fontSize:10}}>✓ Firebase</span>
            :s.githubToken?<span className="chip chip-blue" style={{fontSize:10}}>GitHub</span>
            :<span className="chip chip-amber" style={{fontSize:10}}>⚠️ לא מוגדר</span>}
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:12}}>

          {/* הוראות Firebase */}
          <div style={{background:'rgba(79,142,247,0.08)',border:'1px solid rgba(79,142,247,0.2)',borderRadius:8,padding:'12px 14px',fontSize:12,lineHeight:2}}>
            <strong style={{color:'var(--accent)',fontSize:13}}>🔥 סנכרון דרך Firebase (מומלץ — חינמי)</strong><br/>
            <span style={{color:'var(--text2)'}}>
              1. פתח <a href="https://console.firebase.google.com" target="_blank" rel="noreferrer" style={{color:'var(--accent)',fontWeight:600}}>console.firebase.google.com</a><br/>
              2. "Add project" → שם → Create<br/>
              3. "Build" → "Realtime Database" → Create → <strong>"Start in test mode"</strong><br/>
              4. העתק את כתובת ה-Database (מסתיימת ב-<code>.firebaseio.com</code>)<br/>
              5. הדבק למטה ← לחץ "צור מפתח סנכרון" ← שמור
            </span>
          </div>

          <div><label className="label">כתובת Firebase (מוגדרת אוטומטית ✓)</label>
            <input className="input" type="text" value={FB_URL} readOnly
              style={{fontFamily:'monospace',fontSize:11,color:'var(--green)',background:'var(--bg3)',cursor:'default'}}/></div>

          <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
            <div style={{flex:1}}><label className="label">מפתח סנכרון (Sync Key) — זהה בכל המכשירים</label>
              <input className="input" type="text" value={s.syncKey||''} onChange={e=>upd('syncKey',e.target.value.trim())}
                placeholder="לחץ 'צור' ליצירת מפתח אוטומטי" style={{fontFamily:'monospace',fontSize:11}}/></div>
            <button className="btn btn-secondary btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}}
              onClick={()=>upd('syncKey',genSyncKey())}>🔑 צור מפתח</button>
          </div>

          {s.syncKey&&<div style={{background:'var(--bg3)',borderRadius:8,padding:'8px 12px',fontSize:11,color:'var(--text2)',lineHeight:1.8}}>
            📱 <strong>להגדרת סלולר:</strong> פתח הגדרות ⚙️ באפליקציה ← הכנס את אותה כתובת Firebase ואת המפתח:<br/>
            <code style={{color:'var(--accent)',wordBreak:'break-all'}}>{s.syncKey}</code>
          </div>}

          <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
            <button className="btn btn-primary" onClick={()=>{
              onSettings(s);
              toast('ההגדרות נשמרו','success');
              if((s.firebaseUrl&&s.syncKey)||s.githubToken) setTimeout(()=>onPush(s),400);
            }}>💾 שמור{(s.firebaseUrl&&s.syncKey)||s.githubToken?' ✓ ויסנכרן':''}</button>
            {activeTrip&&((s.firebaseUrl&&s.syncKey)||s.githubToken)&&<>
              <button className="btn btn-success" onClick={onPush} disabled={ghBusy}>{ghBusy?'⏳…':'⬆ סנכרן עכשיו'}</button>
              <button className="btn btn-secondary" onClick={onPull} disabled={ghBusy}>{ghBusy?'⏳…':'⬇ טען מהענן'}</button>
            </>}
          </div>

          {/* GitHub — אפשרות מתקדמת */}
          <details style={{marginTop:4}}>
            <summary style={{fontSize:11,color:'var(--text3)',cursor:'pointer',userSelect:'none'}}>⚙️ הגדרות GitHub (מתקדם)</summary>
            <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:10}}>
              <div><label className="label">GitHub Personal Access Token</label>
                <input className="input" type="password" value={s.githubToken||''} onChange={e=>upd('githubToken',e.target.value)} placeholder="ghp_xxx" autoComplete="off"/></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
                <div><label className="label">שם משתמש</label>
                  <input className="input" type="text" value={s.githubUsername||''} onChange={e=>upd('githubUsername',e.target.value)}/></div>
                <div><label className="label">שם ריפו</label>
                  <input className="input" type="text" value={s.githubRepo||''} onChange={e=>upd('githubRepo',e.target.value)}/></div>
              </div>
            </div>
          </details>
        </div>
      </div>

      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🗺️ Google Maps API</span></div>
        <div className="card-body">
          <label className="label">מפתח API של גוגל מפות</label>
          <input className="input" type="password" value={s.googleMapsKey||''} onChange={e=>upd('googleMapsKey',e.target.value)} autoComplete="off"/>
        </div>
      </div>

    </div>
  </div>;
}
