        style={{marginTop:3,flexShrink:0,cursor:'pointer',width:14,height:14}} onClick={e=>e.stopPropagation()}/>}
      <div style={{flex:1,minWidth:0,cursor:item.lat?'pointer':'default'}} onClick={focusMap}>
        {nameEdit?(
          <div style={{display:'flex',gap:4,alignItems:'center',marginBottom:4}} onClick={e=>e.stopPropagation()}>
            <input value={nameVal} onChange={e=>setNameVal(e.target.value)}
              style={{flex:1,fontSize:13,fontWeight:600,border:'1px solid var(--accent)',borderRadius:5,padding:'2px 6px',background:'var(--bg)',color:'var(--text)',fontFamily:'Heebo,Arial,sans-serif',direction:'rtl'}}
              onKeyDown={e=>{if(e.key==='Enter')doSaveName();if(e.key==='Escape')setNameEdit(false);}}
              autoFocus/>
            <button onClick={doSaveName} style={{...smallBtnStyle,background:'var(--accent)',color:'#fff'}} title="שמור שם">✓</button>
            <button onClick={()=>setNameEdit(false)} style={smallBtnStyle} title="ביטול">✕</button>
            {item.customName&&<button onClick={()=>{setNameVal(item.name||'');doSaveNameWith(item.name||'');setNameEdit(false);}} style={{...smallBtnStyle,fontSize:9}} title="שחזר שם מקורי">⟲</button>}
          </div>
        ):(
          <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',display:'flex',alignItems:'center',gap:2}}>
            {item.customName&&<span style={{fontSize:9,color:'var(--accent)',marginLeft:3,verticalAlign:'middle'}} title="שם מותאם">✎</span>}
            {srcInfo&&<span style={{marginLeft:4,fontSize:13}} title={item._listSource}>{srcInfo.emoji}</span>}
            <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',flex:1}}>{item.customName||item.name}</span>
            <button onClick={e=>{e.stopPropagation();setNameEdit(true);}} style={{background:'none',border:'none',cursor:'pointer',fontSize:11,opacity:.5,padding:'0 2px',lineHeight:1,marginRight:2,flexShrink:0}} title="שנה שם">✏️</button>
          </div>
        )}
        {item.placeType&&<div style={{fontSize:10,color:'var(--text3)',marginTop:1,lineHeight:1.4}}>{item.placeType}</div>}
        {item.address&&<div style={{fontSize:11,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginTop:1}}>{item.address}</div>}
        {item._notFound&&<div style={{fontSize:10,color:'#9ca3af',display:'inline-flex',alignItems:'center',gap:3,marginTop:2,background:'var(--bg2)',borderRadius:4,padding:'1px 6px',border:'1px solid var(--border)'}}>
          ⚠️ לא נמצא בגוגל — לחץ 🔍 לנסות שוב
        </div>}
        {item.rating&&<div style={{fontSize:11,color:'var(--amber)',marginTop:2}}>⭐ {item.rating}{item.userRatingsTotal?` (${Number(item.userRatingsTotal).toLocaleString()})`:''}</div>}
        {item.openStatus&&<div style={{fontSize:11,fontWeight:600,marginTop:1,color:item.openStatus==='פתוח עכשיו'?'#22c55e':'#ef4444'}}>{item.openStatus==='פתוח עכשיו'?'✅':'🔴'} {item.openStatus}</div>}
        {item.todayHours&&<div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>🕐 {item.todayHours}</div>}
        {item.phone&&<div style={{fontSize:11,color:'var(--accent)',marginTop:1}}>📞 {item.phone}</div>}
        {item.website&&<a href={item.website} target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--accent)',display:'block',marginTop:1,wordBreak:'break-all'}} onClick={e=>e.stopPropagation()}>🌐 {item.website.replace(/^https?:\/\//,'').split('/')[0]}</a>}
        {/* קישור גוגל מפות — אוטומטי מהייבוא או מ-placeId, ללא צורך ב-🔍 */}
        {mapsUrl&&<GLink url={mapsUrl} style={{marginTop:3}} onClick={e=>e.stopPropagation()}/>}
        {/* בחירת סוג רשימה */}
        {onChangeListSource&&(
          <div style={{display:'flex',alignItems:'center',gap:4,marginTop:5,flexWrap:'wrap'}} onClick={e=>e.stopPropagation()}>
            {[
              {key:'liked',   symbol:'♥', color:'#ec4899', label:'מועדפים'},
              {key:'wantToGo',symbol:'⚑', color:'#22c55e', label:'רוצה להגיע'},
              {key:'saved',   symbol:'★', color:'#f59e0b', label:'שמור'},
              {key:'list',    symbol:'♦', color:'#6366f1', label:'רשימה'},
              {key:'itinerary',symbol:'🧳',color:'#2563eb', label:'תוכנית נסיעה'},
            ].map(t=>{
              const active=(item._listSource||'saved')===t.key;
              return <button key={t.key} onClick={()=>onChangeListSource(item.id,t.key)}
                title={t.label}

const DAYS_PER_PAGE=3;

function TimelineTab({trip,onUpdate,onLocate,onFocusDay,onFocusItem,onFocusRoute,compact=false,settings,onPickFromMap,shownDayIds=null,onToggleDayVisibility,scrollToDayId=null}){
  const[showBank,setShowBank]=useState(!compact);
  const[dayOffset,setDayOffset]=useState(0);

  // גלילה אוטומטית לכרטיסיית יום כשמגיעים מלוח הזמנים המלא
  useEffect(()=>{
    if(!scrollToDayId) return;
    const el=document.querySelector(`[data-day-id="${scrollToDayId}"]`);
    if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
  },[scrollToDayId]);

  const updDay=upd=>onUpdate(prev=>({...prev,days:prev.days.map(d=>d.id===upd.id?upd:d)}));
  const updateBankNote=(placeId,note)=>onUpdate(prev=>({...prev,interestBank:(prev.interestBank||[]).map(i=>i.placeId===placeId?{...i,note}:i)}));
  const addDay=()=>{
    const last=trip.days[trip.days.length-1];
    let nd='';
    if(last?.date){const d=new Date(last.date);d.setDate(d.getDate()+1);nd=d.toISOString().slice(0,10);}
    const newDay={
      ...defaultDay(nd),
      // מוצא חדש = יעד היום הקודם (ממתין לאישור)
      startLocation:last?.endLocation||'',
      startTime:last?.endLocation?(last?.endTime||'08:00'):'08:00',
      startPending:!!(last?.endLocation),
    };
    const newTrip={...trip,days:[...trip.days,newDay]};
    onUpdate(newTrip);
    // גלול אוטומטית לדף האחרון אחרי הוספה
    const newLen=newTrip.days.length;
    setDayOffset(Math.floor((newLen-1)/DAYS_PER_PAGE)*DAYS_PER_PAGE);
  };
  const delDay=id=>{
    onUpdate({...trip,days:trip.days.filter(d=>d.id!==id)});
    setDayOffset(prev=>Math.max(0,Math.min(prev,trip.days.length-2-((trip.days.length-1)%DAYS_PER_PAGE))));
  };
  const moveBlockToBank=(block,dayId)=>{
    const bankItem={id:uid(),name:block.customName||block.title||'פעילות',customName:block.customName||undefined,address:block.location||'',
      lat:block.lat,lng:block.lng,placeId:block.placeId,
      rating:block.placeRating,userRatingsTotal:block.placeUserRatings,
      openStatus:block.placeOpenStatus,todayHours:block.placeTodayHours,
      phone:block.placePhone,website:block.placeWebsite,photoUrl:block.placePhotoUrl,
      placeType:block.placeType||''};
    onUpdate({...trip,
      interestBank:[...trip.interestBank,bankItem],
      days:trip.days.map(d=>d.id===dayId?{...d,blocks:d.blocks.filter(b=>b.id!==block.id)}:d)
    });
    toast(`"${block.customName||block.title||'פעילות'}" הועבר לבנק האטרקציות`,'success');
  };

  // במצב compact — תצוגה רגילה אנכית (עמודה צרה בתצוגת 3 עמודות)
  if(compact){
    return <div style={{display:'flex',height:'100%',overflow:'hidden',flexDirection:'column'}}>
      <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexShrink:0,flexWrap:'wrap'}}>
        <span style={{fontWeight:700,fontSize:14}}>🗓 לוח זמנים</span>
        <button className="btn btn-primary btn-sm" onClick={addDay}>+ יום</button>
        {shownDayIds!==null&&(
          <button className="btn btn-secondary btn-sm" style={{fontSize:11}}
            onClick={()=>onToggleDayVisibility('__all__')} title="הצג את כל הימים על המפה">
            👁️ הצג הכל
          </button>
        )}
      </div>
      <div className="scroll-y flex-1" style={{padding:'10px'}}>
        {trip.days.length===0
          ?<div className="empty-state"><div className="emoji">🗓️</div><div style={{fontWeight:600}}>אין ימים</div>
             <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={addDay}>+ הוסף יום</button></div>
          :trip.days.map((day,i)=>(
            <DayPanel key={day.id} day={{...day,_tripBank:trip.interestBank||[]}} idx={i} onUpdate={updDay} onDelete={()=>delDay(day.id)}
              onFocusDay={onFocusDay} onFocusItem={onFocusItem} onFocusRoute={onFocusRoute}
              onMoveToBank={(block)=>moveBlockToBank(block,day.id)} settings={settings} onPickFromMap={onPickFromMap}
              onBankNoteUpdate={updateBankNote}
              dayVisible={shownDayIds===null||shownDayIds.has(day.id)}
              allDaysVisible={shownDayIds===null}
              onToggleVisibility={onToggleDayVisibility}/>
          ))
        }
      </div>
    </div>;
  }

  // מצב מלא — 4 ימים בעמודות + עמודת אטרקציות
  const totalDays=trip.days.length;
  const clampedOffset=Math.min(dayOffset,Math.max(0,totalDays-1));
  const visibleDays=trip.days.slice(clampedOffset,clampedOffset+DAYS_PER_PAGE);
  const pageFrom=clampedOffset+1;
  const pageTo=Math.min(clampedOffset+DAYS_PER_PAGE,totalDays);
  const canPrev=clampedOffset>0;
  const canNext=clampedOffset+DAYS_PER_PAGE<totalDays;

  return <div style={{display:'flex',height:'100%',overflow:'hidden',flexDirection:'column'}}>
    {/* ── סרגל עליון ── */}
    <div style={{padding:'8px 14px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:8,flexShrink:0,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:14}}>🗓 לוח זמנים</span>
      <button className="btn btn-primary btn-sm" onClick={addDay}>+ הוסף יום</button>
      <div style={{flex:1}}/>
      {/* ניווט ימים */}
      {totalDays>DAYS_PER_PAGE&&<div style={{display:'flex',alignItems:'center',gap:6}}>
        <button className="btn btn-secondary btn-sm" disabled={!canNext}
          onClick={()=>setDayOffset(o=>Math.min(o+1,totalDays-DAYS_PER_PAGE))}
          style={{padding:'3px 9px',opacity:canNext?1:0.35}}>הבא ▶</button>
        <span style={{fontSize:12,color:'var(--text2)',minWidth:90,textAlign:'center'}}>
          ימים {pageFrom}–{pageTo} / {totalDays}
        </span>
        <button className="btn btn-secondary btn-sm" disabled={!canPrev}
          onClick={()=>setDayOffset(o=>Math.max(0,o-1))}
          style={{padding:'3px 9px',opacity:canPrev?1:0.35}}>◀ קודם</button>
      </div>}
      <button className="btn btn-secondary btn-sm" onClick={()=>setShowBank(b=>!b)}>
        🌟 {showBank?'הסתר':'הצג'} אטרקציות
      </button>
    </div>

    {/* ── עמודות ימים + בנק ── */}
    <div style={{flex:1,display:'flex',overflow:'hidden'}}>
      {totalDays===0
        ?<div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
           <div className="empty-state">
             <div className="emoji">🗓️</div>
             <div style={{fontWeight:600,color:'var(--text)'}}>אין ימים עדיין</div>
             <p>לחץ "+ הוסף יום" כדי להתחיל לבנות את המסלול.</p>
             <button className="btn btn-primary" onClick={addDay}>+ הוסף יום</button>
           </div>
         </div>
        :visibleDays.map((day,i)=>(
          <div key={day.id} style={{
            flex:1,minWidth:0,borderRight:'1px solid var(--border)',
            display:'flex',flexDirection:'column',overflow:'hidden'
          }}>
            <div className="scroll-y flex-1" style={{padding:'8px'}}>
              <DayPanel day={{...day,_tripBank:trip.interestBank||[]}} idx={clampedOffset+i} onUpdate={updDay} onDelete={()=>delDay(day.id)}
                onFocusDay={onFocusDay} onFocusItem={onFocusItem} onFocusRoute={onFocusRoute}
                onMoveToBank={(block)=>moveBlockToBank(block,day.id)} settings={settings} onPickFromMap={onPickFromMap}
                onBankNoteUpdate={updateBankNote}
                dayVisible={shownDayIds===null||shownDayIds.has(day.id)}
                allDaysVisible={shownDayIds===null}
                onToggleVisibility={onToggleDayVisibility}/>
            </div>
          </div>
        ))
      }
      {/* עמודת אטרקציות */}
      {showBank&&<div style={{width:270,flexShrink:0,borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <BankPanel trip={trip} onUpdate={onUpdate} onLocate={onLocate} onFocusItem={onFocusItem} onClose={()=>setShowBank(false)} settings={settings}/>
      </div>}
    </div>
  </div>;
}

/* ══════════════════════════════════
   GitHub Action — שליפת רשימת גוגל מפות בצד-שרת
   הקובץ .github/workflows/fetch-gmaps.yml נמצא ב-repo
══════════════════════════════════ */

/* פענוח base64 → טקסט UTF-8 (GitHub API מחזיר base64; atob לבדו שובר עברית/CJK) */
const b64ToUtf8=b64=>{
  const bin=atob(b64.replace(/\s/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
};

const fetchViaGitHubAction=async(apiUrl,settings,onStatus)=>{
  const tok=settings?.githubToken||'';
  const user=settings?.githubUsername||'nimrodekel-hub';
  const repo=settings?.githubRepo||'PlanMyTrip';
  if(!tok) throw new Error('חסר GitHub token — הוסף בהגדרות ⚙️');
  const hdr={'Authorization':'token '+tok,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
  const repoBase=`https://api.github.com/repos/${user}/${repo}`;

  /* שלח repository_dispatch — ה-workflow כבר קיים ב-repo */
  const reqId='gmaps_'+Date.now();
  const dispR=await fetch(`${repoBase}/dispatches`,{method:'POST',headers:hdr,
    body:JSON.stringify({event_type:'fetch-gmaps',client_payload:{api_url:apiUrl,req_id:reqId}})});
  if(!dispR.ok){
    const err=await dispR.json().catch(()=>({message:dispR.status}));
    throw new Error('שליחת בקשה נכשלה: '+(err.message||dispR.status));
  }

  onStatus?.('⏳ GitHub שולף מגוגל... (עד 120 שניות)');

  /* סקור כל 4 שניות עד 120 שניות */
  const idUrl =`${repoBase}/contents/_cache/gmaps_id.txt`;
  const respUrl=`${repoBase}/contents/_cache/gmaps_response.txt`;
  for(let i=0;i<30;i++){  /* 30×4s = 120 שניות */
    await new Promise(res=>setTimeout(res,4000));
    try{
      const idR=await fetch(idUrl+'?t='+Date.now(),{headers:hdr});
      if(!idR.ok) continue;
      const idJ=await idR.json();
      const savedId=b64ToUtf8(idJ.content).trim();
      if(savedId!==reqId) continue;
      /* ה-Action סיים — קרא את תוכן התשובה */
      const rR=await fetch(respUrl+'?t='+Date.now(),{headers:hdr});
      if(!rR.ok) throw new Error('קובץ תשובה לא נמצא');
      const rJ=await rR.json();
      const text=b64ToUtf8(rJ.content);
      if(text.startsWith('FETCH_FAILED:'))
        throw new Error('גוגל לא החזיר תוצאה מה-Action ('+text.trim()+') — נסה שוב');
      if(!text.includes(")]}'")) throw new Error('תוכן לא תקין — נסה שוב');
      return text;
    }catch(e){
      if(e.message==='קובץ תשובה לא נמצא'||e.message==='תוכן לא תקין') throw e;
      /* continue polling */
    }
  }
  throw new Error('timeout — ה-Action לא הסתיים בזמן, נסה שוב');
};

/* ══════════════════════════════════
   העשרת פרטי מקומות דרך GitHub Action
   שולף כתובת / דירוג / טלפון / אתר מגוגל מפות + Nominatim
   ── אין שימוש ב-Places API ──
══════════════════════════════════ */
const enrichPlacesBatch=async(places,settings,onStatus,onResult)=>{
  const tok=settings?.githubToken||'';
  const user=settings?.githubUsername||'nimrodekel-hub';
  const repo=settings?.githubRepo||'PlanMyTrip';
  if(!tok||!user||!repo) return;

  const hdr={'Authorization':'token '+tok,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
  const repoBase=`https://api.github.com/repos/${user}/${repo}`;

  /* קידוד בטוח ל-Base64 (תמיכה מלאה ב-Unicode) */
  const jsonStr=JSON.stringify(places.map(p=>({id:p.id,name:p.name,lat:p.lat,lng:p.lng,_cid:p._cid||''})));
  const bytes=new TextEncoder().encode(jsonStr);
  let b64raw='';
  const CHUNK=8192;
  for(let i=0;i<bytes.length;i+=CHUNK) b64raw+=String.fromCharCode(...bytes.subarray(i,i+CHUNK));
  const placesB64=btoa(b64raw);

  const reqId='enrich_'+Date.now();
  console.log('[Enrich] dispatching reqId=',reqId,'places=',places.length,'payload_kb≈',Math.round(placesB64.length/1024));
  const dispR=await fetch(`${repoBase}/dispatches`,{
    method:'POST',headers:hdr,
    body:JSON.stringify({event_type:'enrich-places',client_payload:{places_b64:placesB64,req_id:reqId}})
  });
  if(!dispR.ok){
    const errTxt=await dispR.text().catch(()=>'');
    console.error('[Enrich] dispatch failed',dispR.status,errTxt);
    onStatus?.('');
    throw new Error('dispatch failed '+dispR.status+': '+errTxt.slice(0,100));
  }
  console.log('[Enrich] dispatch OK (204)');
  onStatus?.('⏳ מעשיר פרטי '+places.length+' מקומות... (~3 דק)');

  /* ── Poll for _cache/{reqId}.json — file is created only when Action completes ──
     No caching issue: we poll for a NEW file that does not exist yet (404→200). */
  const resultUrl=`${repoBase}/contents/_cache/${reqId}.json`;
  console.log('[Enrich] polling',resultUrl);
  for(let i=0;i<100;i++){
    await new Promise(r=>setTimeout(r,8000)); // poll every 8 s
    try{
      const r=await fetch(resultUrl,{headers:hdr});
      console.log('[Enrich] poll',i+1,'→',r.status);
      if(r.status===404) continue; // not ready yet
      if(!r.ok){console.warn('[Enrich] unexpected status',r.status);continue;}
      const j=await r.json();
      const text=b64ToUtf8(j.content);
      const enriched=JSON.parse(text);
      console.log('[Enrich] received',enriched?.length,'items, sample:',JSON.stringify(enriched?.[0])?.slice(0,150));
      onStatus?.('');
      onResult?.(enriched);
      return;
    }catch(e){console.warn('[Enrich] poll',i+1,'error:',e?.message);}
  }
  console.error('[Enrich] timed out (13 min) — check GitHub Actions');
  onStatus?.('');
  throw new Error('timeout');
};

/* ══════════════════════════════════
   פאנל בנק אטרקציות (עמודה עצמאית)
   תכונות: קיבוץ לפי מדינה, בחירה קבוצתית, העשרת פרטים מגוגל מפות
══════════════════════════════════ */
function BankPanel({trip,onUpdate,onLocate,onFocusItem,onClose,settings,onSetDayLocation,allKnownPlaces}){
  const[showTakeout,setShowTakeout]=useState(false);
  const[showLinkImport,setShowLinkImport]=useState(false);
  const[linkUrl,setLinkUrl]=useState('');
  const[linkSource,setLinkSource]=useState('saved'); // liked|wantToGo|saved|list
  const[linkImporting,setLinkImporting]=useState(false);
  const[linkStatus,setLinkStatus]=useState('');
  const[selected,setSelected]=useState(()=>new Set());
  const[enrichingId,setEnrichingId]=useState(null);
  const[batchProgress,setBatchProgress]=useState(null); // null | {done,total,name}
  const[enrichStatus,setEnrichStatus]=useState(''); // סטטוס העשרה דרך GitHub Action
  const[bankSearch,setBankSearch]=useState('');
  const[sortMode,setSortMode]=useState('default'); // 'default'|'name'|'distance'
  const[mapCenter,setMapCenter]=useState(null); // {lat,lng} לשימוש במיון לפי מרחק
  // expanded = קבוצות פתוחות; ברירת מחדל: ריק = כולן סגורות
  const[expanded,setExpanded]=useState(()=>new Set());
  const[filterSrc,setFilterSrc]=useState(null);
  const takeoutRef=useRef(null);
  // ref לטיול — מונע stale-closure בלולאות async
  const tripRef=useRef(trip);
  useEffect(()=>{tripRef.current=trip;},[trip]);
  const saveCustomNameLocal=(placeId,bankItemId,customName)=>{
    const cn=(customName||'').trim()||undefined;
    onUpdate(prev=>({
      ...prev,
      interestBank:(prev.interestBank||[]).map(i=>
        (placeId&&i.placeId===placeId)||(bankItemId&&!placeId&&i.id===bankItemId)?{...i,customName:cn}:i
      ),
      days:placeId?prev.days.map(d=>({
        ...d,
        blocks:d.blocks.map(b=>b.placeId===placeId?{...b,customName:cn}:b),
        dayBank:(d.dayBank||[]).map(i=>i.placeId===placeId?{...i,customName:cn}:i)
      })):prev.days
    }));
  };
  const saveListSource=(itemId,listSource)=>{
    onUpdate(prev=>({
      ...prev,
      interestBank:(prev.interestBank||[]).map(i=>i.id===itemId?{...i,_listSource:listSource}:i)
    }));
  };

  // ── ה-auto-enrich האוטומטי הוסר — גרם לחיובים מיותרים ב-Places API ──
  // כעת: המשתמש מחליט מתי לקשר לגוגל (כפתור מפורש בלבד)

  const COUNTRY_HE={

    // עברית → עברית (למקרה שהכתובת כבר בעברית — מונע כפילויות)
    'ישראל':'ישראל','גרמניה':'גרמניה','צרפת':'צרפת','איטליה':'איטליה',
    'ספרד':'ספרד','שווייץ':'שווייץ','הולנד':'הולנד','אוסטריה':'אוסטריה',
    'בלגיה':'בלגיה','הונגריה':'הונגריה','פולין':'פולין','קרואטיה':'קרואטיה',
    'יוון':'יוון','פורטוגל':'פורטוגל','בריטניה':'בריטניה','ארצות הברית':'ארצות הברית',
    'טורקיה':'טורקיה','ירדן':'ירדן','מצרים':'מצרים','צ\'כיה':'צ\'כיה',
    'רומניה':'רומניה','בולגריה':'בולגריה','סרביה':'סרביה','סלובקיה':'סלובקיה',
    'סלובניה':'סלובניה','שוודיה':'שוודיה','נורווגיה':'נורווגיה','דנמרק':'דנמרק',
    'פינלנד':'פינלנד','לוקסמבורג':'לוקסמבורג','אירלנד':'אירלנד','איסלנד':'איסלנד',
    'קנדה':'קנדה','אוסטרליה':'אוסטרליה','יפן':'יפן','סין':'סין','הודו':'הודו',
    'תאילנד':'תאילנד','מרוקו':'מרוקו','רוסיה':'רוסיה','אוקראינה':'אוקראינה',
    'קפריסין':'קפריסין','מלטה':'מלטה','גיאורגיה':'גיאורגיה','ארמניה':'ארמניה',
    'ברזיל':'ברזיל','ארגנטינה':'ארגנטינה','מקסיקו':'מקסיקו','דרום אפריקה':'דרום אפריקה',
    'אלבניה':'אלבניה','מקדוניה':'מקדוניה','בוסניה':'בוסניה','מונטנגרו':'מונטנגרו',
    'אסטוניה':'אסטוניה','לטביה':'לטביה','ליטא':'ליטא',
  };

  /* ערים ישראליות שעלולות להופיע כחלק אחרון בכתובת */
  const ISRAEL_CITIES=new Set([
    'jerusalem','tel aviv','tel aviv-jaffa','tel aviv - jaffa','haifa','eilat',
    'netanya','beer sheva','be\'er sheva','beersheba','herzliya','ramat gan',
    'bnei brak','petah tikva','rishon lezion','rishon le-zion','rehovot','holon',
    'bat yam','ashdod','ashkelon','nahariya','acre','akko','nazareth','tiberias',
    'safed','tzfat','kfar saba','modiin','caesarea','jaffa','yafo','afula',
    'dimona','hadera','lod','ramla','raanana','givatayim','ness ziona',
    'ירושלים','תל אביב','תל אביב-יפו','תל אביב - יפו','חיפה','אילת',
    'נתניה','באר שבע','הרצליה','רמת גן','בני ברק','פתח תקווה',
    'ראשון לציון','רחובות','חולון','בת ים','אשדוד','אשקלון',
    'נהריה','עכו','נצרת','טבריה','צפת','כפר סבא','מודיעין','קיסריה','יפו',
    'רמת השרון','הוד השרון','כפר יונה','נס ציונה','גבעתיים','לוד','רמלה','רעננה',
    'אפולה','דימונה','חדרה',
  ]);

  /* נרמל שם מדינה: אנגלית/שפה מקומית/עברית → עברית */
  const normalizeCountry=(raw,fullAddr)=>{
    if(!raw) return 'ללא כתובת';
    const lo=raw.toLowerCase().trim();
    // התאמה ישירה (כולל עברית→עברית ושפות מקומיות)
    if(COUNTRY_HE[lo]) return COUNTRY_HE[lo];
    // התאמה חלקית (למשל "United States of America")
    for(const[en,he] of Object.entries(COUNTRY_HE)){
      if(lo.includes(en)) return he;
    }
    // עיר ישראלית → ישראל
    if(ISRAEL_CITIES.has(lo)) return 'ישראל';
    // Israel/ישראל בכתובת המלאה — ללא \b כי \b לא עובד עם עברית ב-JS
    if(/israel/i.test(fullAddr)||/ישראל/.test(fullAddr)) return 'ישראל';
    return raw;
  };

  const getCountry=item=>{
    const addr=(item.address||'').trim();
    if(!addr) return 'ללא כתובת';
    const parts=addr.split(',').map(s=>s.trim()).filter(Boolean);
    if(parts.length<2) return normalizeCountry(parts[0]||'ללא כתובת',addr);
    let last=parts[parts.length-1];
    // הסר מיקוד בתחילה: "1013 הונגריה" → "הונגריה"
    last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').trim();
    // הסר מיקוד בסוף: "הונגריה 1013" → "הונגריה"
    last=last.replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
    // אם נשאר ריק או רק ספרות (מיקוד בלבד) → קח את החלק שלפניו ונקה גם אותו
    if(!last||/^\d+$/.test(last)){
      last=parts[parts.length-2]||'';
      last=last.replace(/^\d[\d\s\-]{0,9}\s+/,'').replace(/\s+\d[\d\s\-]{0,9}$/,'').trim();
    }
    return normalizeCountry(last||'ללא כתובת',addr);
  };

  /* קיבוץ לפי מדינה — ממויין לפי א-ת בתוך כל קבוצה כשנבחר מיון שם */
  const matchesSrc=(item,f)=>!f||(item._listSource||'saved')===f;
  const grouped=useMemo(()=>{
    const map={};
    for(const item of trip.interestBank){
      if(!matchesSrc(item,filterSrc))continue;
      const c=getCountry(item);
      if(!map[c]) map[c]=[];
      map[c].push(item);
    }
    const entries=Object.entries(map).sort((a,b)=>a[0].localeCompare(b[0],'he'));
    if(sortMode==='name'){
      entries.forEach(([,items])=>items.sort((a,b)=>(a.customName||a.name||'').localeCompare(b.customName||b.name||'','he')));
    }
    return entries;
  },[trip.interestBank,sortMode,filterSrc]);

  /* מרחק בין שתי נקודות (ק"מ) — Haversine */
  const haversineKm=(lat1,lng1,lat2,lng2)=>{
    const R=6371,toR=x=>x*Math.PI/180;
    const dLat=toR(lat2-lat1),dLng=toR(lng2-lng1);
    const a=Math.sin(dLat/2)**2+Math.cos(toR(lat1))*Math.cos(toR(lat2))*Math.sin(dLng/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  };
  const fmtDist=km=>km===Infinity?'—':km<1?`${Math.round(km*1000)}מ׳`:`${km<10?km.toFixed(1):Math.round(km)}ק"מ`;

  /* פריטים מסוננים + ממוינים */
  const displayItems=useMemo(()=>{
    let items=trip.interestBank.filter(i=>matchesSrc(i,filterSrc));
    // סינון לפי חיפוש
    const q=bankSearch.trim().toLowerCase();
    if(q) items=items.filter(i=>(i.customName||'').toLowerCase().includes(q)||(i.name||'').toLowerCase().includes(q)||(i.address||'').toLowerCase().includes(q)||(i.placeType||'').toLowerCase().includes(q));
    // מיון
    if(sortMode==='name'){
      items.sort((a,b)=>(a.customName||a.name||'').localeCompare(b.customName||b.name||'','he'));
    } else if(sortMode==='distance'&&mapCenter){
      items=items.map(i=>({...i,_dist:i.lat&&i.lng?haversineKm(mapCenter.lat,mapCenter.lng,i.lat,i.lng):Infinity}));
      items.sort((a,b)=>a._dist-b._dist);
    }
    return items;
  },[bankSearch,sortMode,mapCenter,trip.interestBank,filterSrc]);
  // תצוגה שטוחה: רק בחיפוש או מיון לפי מרחק — א-ת נשאר בתוך קבוצות מדינה
  const showFlat=!!(bankSearch.trim())||sortMode==='distance';

  /* ניהול בחירה */
  const toggleSelect=(id,val)=>setSelected(prev=>{const s=new Set(prev);val?s.add(id):s.delete(id);return s;});
  const toggleCountry=(items,allSel)=>setSelected(prev=>{
    const s=new Set(prev);
    items.forEach(i=>allSel?s.delete(i.id):s.add(i.id));
    return s;
  });
  const delMany=ids=>{
    onUpdate({...trip,interestBank:trip.interestBank.filter(i=>!ids.has(i.id))});
    setSelected(prev=>{const s=new Set(prev);ids.forEach(id=>s.delete(id));return s;});
    toast(`נמחקו ${ids.size} פריטים`,'success');
  };

  /* פעולות בודדות */
  const addToBank=item=>onUpdate({...trip,interestBank:[...trip.interestBank,{...item,id:uid()}]});
  const delBank=id=>{
    onUpdate({...trip,interestBank:trip.interestBank.filter(i=>i.id!==id)});
    setSelected(prev=>{const s=new Set(prev);s.delete(id);return s;});
  };
  const toggleCollapse=country=>setExpanded(prev=>{const s=new Set(prev);s.has(country)?s.delete(country):s.add(country);return s;});

  /* הוספה לבנק יומי */
  const addItemToDayBank=(dayId,item)=>{
    const day=trip.days.find(d=>d.id===dayId);if(!day)return;
    const already=(day.dayBank||[]).some(i=>i.placeId&&i.placeId===item.placeId);
    if(already){toast(`"${item.customName||item.name}" כבר בבנק היומי`,'info');return;}
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,dayBank:[...(d.dayBank||[]),{...item,id:uid()}]}:d)});
    toast(`"${item.customName||item.name}" נוסף לבנק היומי 📌`,'success');
  };

  const setItemAsStart=(dayId,item)=>{
    onSetDayLocation?.(dayId,'start',item.customName||item.name,item.lat,item.lng,item);
    toast(`"${item.customName||item.name}" הוגדר כנקודת מוצא 🟢`,'success');
  };
  const setItemAsEnd=(dayId,item)=>{
    onSetDayLocation?.(dayId,'end',item.customName||item.name,item.lat,item.lng,item);
    toast(`"${item.customName||item.name}" הוגדר כנקודת יעד 🔴`,'success');
  };

  /* הוספה ליום */
  const addItemToDay=(dayId,item)=>{
    const day=trip.days.find(d=>d.id===dayId); if(!day) return;
    const sorted=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    const nb=defaultBlock('activity',start);
    nb.title=item.customName||item.name; nb.location=item.address||'';
    if(item.lat){nb.lat=item.lat;nb.lng=item.lng;}
    if(item.placeId)nb.placeId=item.placeId;
    if(item.rating)nb.placeRating=item.rating;
    if(item.userRatingsTotal)nb.placeUserRatings=item.userRatingsTotal;
    if(item.openStatus)nb.placeOpenStatus=item.openStatus;
    if(item.todayHours)nb.placeTodayHours=item.todayHours;
    if(item.phone)nb.placePhone=item.phone;
    if(item.website)nb.placeWebsite=item.website;
    if(item.photoUrl)nb.placePhotoUrl=item.photoUrl;
    if(item.placeType)nb.placeType=item.placeType;
    onUpdate({...trip,days:trip.days.map(d=>d.id===dayId?{...d,blocks:[...d.blocks,nb]}:d)});
    toast(`"${item.customName||item.name}" נוסף ליום`,'success');
  };

  /* ── ליבת ה-enrichment — Promise-based, ללא תלות ב-state ── */
  const enrichOneAsync=item=>new Promise(resolve=>{
    if(!window.google?.maps?.places){resolve(null);return;}
    const svc=new window.google.maps.places.PlacesService(document.createElement('div'));
    const query=item.name+(item.address?' '+item.address:'');
    svc.textSearch({query},(results,status)=>{
      const PS=window.google.maps.places.PlacesServiceStatus;
      if(status!==PS.OK||!results?.length){
        // ZERO_RESULTS → לא נמצא בגוגל; שגיאות אחרות (rate limit, deny) → null (ניסה שוב מאוחר)
        resolve(status===PS.ZERO_RESULTS?{...item,_notFound:true}:null);
        return;
      }
      svc.getDetails({
        placeId:results[0].place_id,
        fields:['name','formatted_address','geometry','rating','user_ratings_total',
                'opening_hours','formatted_phone_number','website','types','photos','place_id']
      },(pl,st)=>{
        if(st!==PS.OK||!pl){resolve(null);return;}
        const oh=pl.opening_hours;
        const isOpenNow=oh?.isOpen?.();
        const todayLine=oh?.weekday_text?.[new Date().getDay()]||'';
        resolve({...item,
          placeId:pl.place_id||item.placeId,
          name:pl.name||item.name,
          address:pl.formatted_address||item.address,   // ← תמיד מעדכן כתובת
          lat:pl.geometry?.location?.lat()??item.lat,
          lng:pl.geometry?.location?.lng()??item.lng,
          rating:pl.rating||item.rating||null,
          userRatingsTotal:pl.user_ratings_total||item.userRatingsTotal||null,
          phone:pl.formatted_phone_number||item.phone||'',
          website:pl.website||item.website||'',
          openStatus:isOpenNow===true?'פתוח עכשיו':isOpenNow===false?'סגור עכשיו':item.openStatus||'',
          todayHours:todayLine||item.todayHours||'',
          placeType:getPlaceTypeLabel(pl.types)||item.placeType||'',
          photoUrl:pl.photos?.[0]?.getUrl({maxWidth:400})||item.photoUrl||'',
          _noCoords:false,  // מסיר את הדגל אחרי עדכון מוצלח
        });
      });
    });
  });

  /* העשרת פריט בודד (כפתור 🔍) */
  const enrichItem=async item=>{
    if(!window.google?.maps?.places){toast('Google Maps אינו זמין — יש לוודא שהמפה טעונה','error');return;}
    if(enrichingId||batchProgress){toast('המתן לסיום ההעשרה הנוכחית','error');return;}
    setEnrichingId(item.id);
    const updated=await enrichOneAsync(item);
    setEnrichingId(null);
    if(!updated){toast('שגיאת API — נסה שוב מאוחר יותר','error');return;}
    onUpdate({...tripRef.current,interestBank:tripRef.current.interestBank.map(i=>i.id===item.id?updated:i)});
    if(updated._notFound){toast(`"${item.name}" לא נמצא בגוגל מפות`,'error');}
    else{toast(`✓ "${updated.name}" קושר לגוגל — ${updated.address||'ללא כתובת'}`,'success');}
  };

  /* בדיקה ב-allKnownPlaces: האם המקום כבר ידוע מטיול אחר? חוסך קריאת API */
  const lookupKnown=(item)=>{
    if(!allKnownPlaces)return null;
    const nk=(item.name||'').trim().toLowerCase();
    const ck=item.lat&&item.lng?`${Math.round(item.lat*1e4)},${Math.round(item.lng*1e4)}`:null;
    return allKnownPlaces[nk]||(ck&&allKnownPlaces[ck])||null;
  };

  /* העשרה קבוצתית — כל הפריטים ללא כתובת, אחד אחרי השני */
  /* אם מקום כבר ידוע מטיול אחר — מעתיק ממנו ללא קריאה לגוגל */
  const batchEnrichMissing=async()=>{
    if(!window.google?.maps?.places){toast('Google Maps אינו זמין — יש לוודא שהמפה טעונה','error');return;}
    const toEnrich=tripRef.current.interestBank.filter(i=>!i.placeId&&!i._notFound);
    if(!toEnrich.length){toast('כל האטרקציות כבר מקושרות לגוגל ✓','success');return;}
    let currentBank=[...tripRef.current.interestBank];
    let successCount=0,notFoundCount=0,cachedCount=0;
    for(let idx=0;idx<toEnrich.length;idx++){
      setBatchProgress({done:idx,total:toEnrich.length,name:toEnrich[idx].name});
      // קודם בדוק אם כבר ידוע מטיול אחר — ללא קריאה ל-API
      const known=lookupKnown(toEnrich[idx]);
      if(known){
        const fromCache={...toEnrich[idx],...known};
        currentBank=currentBank.map(b=>b.id===toEnrich[idx].id?fromCache:b);
        onUpdate({...tripRef.current,interestBank:currentBank});
        cachedCount++;continue;
      }
      const updated=await enrichOneAsync(toEnrich[idx]);
      if(updated){
        currentBank=currentBank.map(b=>b.id===toEnrich[idx].id?updated:b);
        onUpdate({...tripRef.current,interestBank:currentBank});
        if(updated._notFound)notFoundCount++;else successCount++;
      }
      await new Promise(r=>setTimeout(r,500));
    }
    setBatchProgress(null);
    const parts=[];
    if(cachedCount)parts.push(`${cachedCount} מטיולים אחרים (ללא API)`);
    if(successCount)parts.push(`${successCount} מגוגל`);
    if(notFoundCount)parts.push(`${notFoundCount} לא נמצאו`);
    toast(`קושרו: ${parts.join(', ')} ✓`,'success');
  };

  /* ══════════════════════════════════
     ייבוא מקישור שיתוף של גוגל מפות
     תומך: מקום בודד + רשימת מועדפים/רוצה לבקר/רשימה מותאמת
  ══════════════════════════════════ */

  /* ─── חילוץ שם + קואורדינטות מ-URL מלא של מקום בודד ─── */
  const parseMapsUrl=urlStr=>{
    let name='',lat=null,lng=null,placeId='';
    const nameM=urlStr.match(/\/maps\/place\/([^/@?&#]+)/);
    if(nameM) name=decodeURIComponent(nameM[1].replace(/\+/g,' '));
    if(!name){const qM=urlStr.match(/[?&]q=([^&#]+)/);if(qM) name=decodeURIComponent(qM[1].replace(/\+/g,' '));}
    const cM=urlStr.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(cM){lat=parseFloat(cM[1]);lng=parseFloat(cM[2]);}
    if(!lat){const d3=urlStr.match(/!3d(-?\d+\.\d+)/),d4=urlStr.match(/!4d(-?\d+\.\d+)/);if(d3&&d4){lat=parseFloat(d3[1]);lng=parseFloat(d4[1]);}}
    /* חלץ placeId בפורמט ChIJ מה-URL אם קיים */
    const pidM=urlStr.match(/!1s(ChIJ[A-Za-z0-9_\-]+)/);
    if(pidM) placeId=decodeURIComponent(pidM[1]);
    return{name,lat,lng,placeId};
  };

  /* ─── שליפת תוכן + URL הסופי דרך proxy (allorigins → corsproxy.io) ─── */
  const fetchViaProxy=async(targetUrl)=>{
    const proxies=[
      async()=>{
        const r=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`,{signal:AbortSignal.timeout(10000)});
        const d=await r.json();
        return{finalUrl:d?.status?.url||'',html:d?.contents||''};
      },
      async()=>{
        const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,{signal:AbortSignal.timeout(10000)});
        const html=await r.text();
        const canonM=html.match(/<link[^>]+rel="canonical"[^>]+href="([^"]+)"/i);
        return{finalUrl:canonM?.[1]||'',html};
      },
    ];
    for(const tryProxy of proxies){try{return await tryProxy();}catch{}}
    return{finalUrl:'',html:''};
  };

  /* ─── חילוץ שם מ-HTML (OG title / title tag) ─── */
  const extractNameFromHtml=html=>{
    const og=html.match(/<meta[^>]+property="og:title"[^>]+content="([^"]+)"/i)?.[1]
             ||html.match(/<meta[^>]+content="([^"]+)"[^>]+property="og:title"/i)?.[1]
             ||html.match(/<title[^>]*>([^<]+)<\/title>/i)?.[1]||'';
    return og.replace(/^Google Maps\s*[-–|·]?\s*/i,'').replace(/\s*[-–|·]?\s*Google Maps$/i,'').trim();
  };

  /* ─── חילוץ ID רשימה מ-URL ─── */
  const extractListId=url=>url.match(/!11m2[^!]*!2s([^!?&]+)/)?.[1]||null;

  /* ─── בניית URL ה-API (pb סוג 2 עובד לכל סוגי הרשימות) ─── */
  const buildListApiUrl2=(listId,html,bustCache=false)=>{
    const preM=(html||'').match(/<link[^>]+href="(\/maps\/preview\/entitylist\/getlist[^"]+)"[^>]*as="fetch"/i)
              ||(html||'').match(/<link[^>]*as="fetch"[^>]+href="(\/maps\/preview\/entitylist\/getlist[^"]+)"/i);
    const base=preM
      ?'https://www.google.com'+preM[1].replace(/&amp;/g,'&').replace(/4i\d+/,'4i2000')
      :`https://www.google.com/maps/preview/entitylist/getlist?hl=en&pb=${encodeURIComponent(`!1m4!1s${listId}!2e2!3m1!1e1!2e2!3e2!4i2000`)}`;
    /* cache-bust: מונע מ-allorigins להחזיר תגובה שגויה מהcache */
    return bustCache?`${base}&_t=${Date.now()}`:base;
  };

  /* ─── פרסור תגובת ה-API של רשימת מקומות ─── */
  /* שולף את כל השדות הזמינים — ללא קריאה נוספת ל-Places API             */
  const parseGmapsListResponse=text=>{
    const cleaned=text.replace(/^\)\]\}'\n?/,'').trim();
    const data=JSON.parse(cleaned);
    const listData=data[0];
    const listName=listData[4]||'רשימה';
    const placeEntries=listData[8]||[];
    const totalInList=typeof listData[12]==='number'?listData[12]:placeEntries.length;

    /* חילוץ בטוח */
    const sf=fn=>{try{const v=fn();return v??null;}catch{return null;}};
    const sStr=fn=>{const v=sf(fn);return typeof v==='string'&&v.trim()?v.trim():'';};
    const sNum=fn=>{const v=sf(fn);return typeof v==='number'&&isFinite(v)?v:null;};

    const extractPlaceId=path=>{
      if(!path)return'';
      const m=path.match(/!1s(ChIJ[A-Za-z0-9_\-]+)/);
      return m?decodeURIComponent(m[1]):'';
    };

    const extractType=raw=>{
      if(!raw||!Array.isArray(raw))return'';
      const types=raw.map(t=>typeof t==='string'?t:Array.isArray(t)?t[0]:null).filter(Boolean);
      return getPlaceTypeLabel(types)||'';
    };

    /* סריקה חכמה: מחפש ערכים לפי סוג/פורמט בכל מערך */
    const scanStr=(arr,test)=>{
      if(!Array.isArray(arr))return'';
      for(const v of arr){
        if(typeof v==='string'&&v.trim()&&test(v))return v.trim();
      }
      return'';
    };
    const scanNum=(arr,test)=>{
      if(!Array.isArray(arr))return null;
      for(const v of arr){
        if(typeof v==='number'&&isFinite(v)&&test(v))return v;
      }
      return null;
    };

    const places=[];
    for(const p of placeEntries){
      try{
        const name=(p[2]||'').trim();
        if(!name)continue;
        const loc=p[1]||[];

        /* קואורדינטות */
        const coords=sf(()=>loc[5]);
        const lat=sNum(()=>coords?.[2]);
        const lng=sNum(()=>coords?.[3]);

        /* נסה אינדקסים ידועים קודם, אחר כך סריקה חכמה */
        const address=sStr(()=>loc[2])||scanStr(loc,v=>/[,\d]/.test(v)&&v.length>5&&!/^https?:\/\//.test(v)&&!v.startsWith('ChIJ')&&!v.startsWith('/')||false);
        const rating=sNum(()=>(typeof loc[3]==='number'&&loc[3]>=1&&loc[3]<=5)?loc[3]:null)
                  ||scanNum(loc,v=>v>=1.0&&v<=5.0&&v!==Math.floor(v));
        const userRatingsTotal=sNum(()=>(typeof loc[4]==='number'&&loc[4]>0)?loc[4]:null);
        const phone=sStr(()=>loc[6])||scanStr(loc,v=>/^[+\d\s\-\(\)]{7,}$/.test(v));
        const website=sStr(()=>loc[9])||scanStr(loc,v=>/^https?:\/\//.test(v));
        const placeType=extractType(sf(()=>loc[8]));
        const googlePath=sStr(()=>loc[7])||scanStr(loc,v=>v.startsWith('/maps/')&&v.includes('!'));

        /* placeId */
        const placeIdDirect=sStr(()=>typeof loc[12]==='string'&&loc[12].startsWith('ChIJ')?loc[12]:'')
                          ||scanStr(loc,v=>v.startsWith('ChIJ')&&v.length>10);
        const placeId=placeIdDirect||extractPlaceId(googlePath);

        /* CID פנימי מגוגל — loc[6]=[id1_decimal, id2_decimal] */
        const cidArr=sf(()=>loc[6]);
        const _cid=Array.isArray(cidArr)&&cidArr[0]?String(cidArr[0]):'';

        const note=typeof p[3]==='string'?p[3].trim():'';

        /* debug: לוג מבנה הרשומה הראשונה בלבד */
        if(places.length===0){
          console.log('[PlanMyTrip] 📍 מבנה רשומה ראשונה מ-Google Maps API — לאבחון שדות:');
          console.log('  p[0]=',sf(()=>p[0]),'  p[1] (loc) =',loc,'  p[2] (name)=',name,'  p[3] (note)=',p[3]);
          console.log('  loc indices:',Object.fromEntries((loc||[]).map((v,i)=>[i,v])));
          console.log('  → address=',address,'rating=',rating,'phone=',phone,'website=',website,'placeType=',placeType,'placeId=',placeId);
        }

        const hasMeaningfulData=!!(rating||phone||website||address||placeId);
        places.push({
          id:uid(),name,address,lat,lng,
          _cid,       // מזהה CID פנימי (עשרוני) לשימוש בהעשרה
          _noCoords:!lat,
          url:googlePath?`https://www.google.com${googlePath}`:'',
          placeId:placeId||'',
          rating:rating||null,
          userRatingsTotal:userRatingsTotal||null,
          phone:phone||'',
          website:website||'',
          placeType:placeType||'',
          note:note||'',
          lastFetched:hasMeaningfulData?Math.floor(Date.now()/1000):undefined,
        });
      }catch(e){console.warn('[PlanMyTrip] parse error for entry:',e);}
    }
    return{listName,places,totalInList};
  };

  /* ─── שליחת בקשה דרך פרוקסי: מקביל — הראשון שמצליח מנצח ─── */
  const fetchListViaProxy=async(apiUrl)=>{
    const tryOne=async(url,isJson)=>{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),12000); /* 12 שניות timeout לכל פרוקסי */
      try{
        const r=await fetch(url,{signal:ctrl.signal});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const d=isJson?await r.json():await r.text();
        const text=isJson?d?.contents||'':d;
        if(!text.includes(")]}'")) throw new Error('no-data');
        return text;
      }finally{clearTimeout(t);}
    };
    const enc=encodeURIComponent(apiUrl);
    const list=[
      {u:`https://api.allorigins.win/raw?url=${enc}`,j:false},
      {u:`https://api.allorigins.win/get?url=${enc}`,j:true},
      {u:`https://corsproxy.io/?${enc}`,j:false},
      {u:`https://corsproxy.io/?url=${enc}`,j:false},
      {u:`https://proxy.cors.sh/${apiUrl}`,j:false},
      {u:`https://test.cors.workers.dev/?${apiUrl}`,j:false},
      {u:`https://api.codetabs.com/v1/proxy?quest=${enc}`,j:false},
      {u:`https://thingproxy.freeboard.io/fetch/${apiUrl}`,j:false},
    ];
    /* הרץ את כולם במקביל — הראשון שמחזיר תוצאה תקפה מנצח */
    try{
      return await Promise.any(list.map(({u,j})=>tryOne(u,j)));
    }catch{
      throw new Error('all proxies failed');
    }
  };

  /* ─── ייבוא רשימה: פרוקסי ציבורי (מהיר) → GitHub Action (אמין) ─── */
  const importListFromLink=async(listId,html,listSrc,originalUrl='')=>{
    const baseApiUrl=buildListApiUrl2(listId,html||'',false);
    let apiResp='';

    /* שלב 1: ניסיון אחד מהיר דרך פרוקסים (~12 שניות מקסימום) */
    try{ apiResp=await fetchListViaProxy(baseApiUrl); }catch{}

    /* שלב 2: fallback — GitHub Action */
    if(!apiResp){
      const tok=settings?.githubToken||'';
      const user=settings?.githubUsername||'';
      const repo=settings?.githubRepo||'';
      if(!tok){
        /* אין token — הסבר ברור */
        throw new Error(
          'הפרוקסים חסומים כרגע ✋\n\nכדי לייבא, הוסף GitHub Personal Access Token:\n🔗 לשונית "חיבוריות" → שדה "GitHub Token" (בראש הדף) → הדבק את ה-Token → לחץ מחוץ לשדה לשמירה'
        );
      }
      setLinkStatus('⏳ GitHub שולף מגוגל... (עד 120 שניות)');
      try{
        apiResp=await fetchViaGitHubAction(baseApiUrl,settings,msg=>setLinkStatus(msg));
      }catch(e){
        setLinkStatus('');
        throw new Error('GitHub נכשל: '+e.message);
      }
      setLinkStatus('');
    }
    if(!apiResp) throw new Error('לא ניתן לשלוף את נתוני הרשימה מגוגל — נסה שוב');
    const{listName,places,totalInList}=parseGmapsListResponse(apiResp);
    if(!places.length) throw new Error('הרשימה ריקה — לא נמצאו מקומות');
    /* שיוך מקור + כפילויות */
    places.forEach(p=>p._listSource=listSrc);
    const existing=tripRef.current.interestBank;
    const newPlaces=places.filter(p=>!existing.some(ex=>isTakeoutDup(p,ex)));
    const dupCount=places.length-newPlaces.length;
    if(newPlaces.length>0){
      onUpdate({...tripRef.current,interestBank:[...existing,...newPlaces]});
    }
    /* אם קיבלנו פחות מהסה"כ — הצג אזהרה */
    const partial=totalInList>places.length;
    const msg=`✓ יובאו ${newPlaces.length} מקומות מ"${listName}"`
      +(dupCount?` (${dupCount} כפילויות דולגו)`:'')
      +(partial?` ⚠️ הרשימה מכילה ${totalInList} — ייתכן שחלק לא יובא, נסה שוב`:'');
    toast(msg,partial?'error':'success');

    /* ── העשרת פרטים ברקע: כתובת / דירוג / טלפון / אתר ── */
    /* רץ ברקע — לא חוסם את ממשק המשתמש */
    const toEnrich=newPlaces.filter(p=>p._cid||p.lat);
    if(toEnrich.length>0&&settings?.githubToken){
      console.log('[Enrich] triggering batch for',toEnrich.length,'places');
      enrichPlacesBatch(
        toEnrich, settings,
        msg=>setEnrichStatus(msg),
        enriched=>{
          console.log('[Enrich] callback received',enriched?.length,'items');
          if(!Array.isArray(enriched)||!enriched.length){
            toast('⚠️ העשרת פרטים הסתיימה בלי נתונים','error');
            return;
          }
          const map=Object.fromEntries(enriched.map(e=>[e.id,e]));
          onUpdate(prev=>{
            const bank=(prev.interestBank||[]).map(item=>{
              const e=map[item.id];
              if(!e) return item;
              return{
                ...item,
                /* כתובת: תמיד דרוס (כולל כתובות גרועות מריצה קודמת) */
                ...(e.address                               ?{address:e.address}:{}),
                /* שאר השדות: מלא רק אם חסר */
                ...(e.rating        &&!item.rating         ?{rating:e.rating}:{}),
                ...(e.phone         &&!item.phone          ?{phone:e.phone}:{}),
                ...(e.website       &&!item.website        ?{website:e.website}:{}),
                ...(e.placeType     &&!item.placeType      ?{placeType:e.placeType}:{}),
                ...(e.todayHours    &&!item.todayHours     ?{todayHours:e.todayHours}:{}),
                ...(e.openStatus    &&!item.openStatus     ?{openStatus:e.openStatus}:{}),
                ...(e.userRatingsTotal&&!item.userRatingsTotal?{userRatingsTotal:e.userRatingsTotal}:{}),
                lastFetched:Math.floor(Date.now()/1000),
              };
            });
            return{...prev,interestBank:bank};
          });
          const addrCount=enriched.filter(e=>e.address).length;
          const phoneCount=enriched.filter(e=>e.phone).length;
          const webCount=enriched.filter(e=>e.website).length;
          const hoursCount=enriched.filter(e=>e.todayHours).length;
          toast(`✅ פרטים עודכנו: ${addrCount} כתובות${phoneCount?', '+phoneCount+' טלפונים':''}${webCount?', '+webCount+' אתרים':''}${hoursCount?', '+hoursCount+' שעות':''}`,'success');
        }
      ).catch(e=>{
        console.error('[Enrich] failed:',e?.message);
        setEnrichStatus('');
        if(e?.message==='timeout')
          toast('⏱ העשרת פרטים לא הסתיימה בזמן — פתח GitHub Actions לבדיקה','error');
        else
          toast('⚠️ שגיאה בהעשרת פרטים: '+e?.message,'error');
      });
    }
  };

  /* ─── כניסה ראשית: מקום בודד או רשימה ─── */
  const importFromLink=async(rawUrl,listSrc)=>{
    const url=(rawUrl||'').trim();
    if(!url){toast('הזן קישור לגוגל מפות','error');return;}
    setLinkImporting(true);
    try{
      /* ── קישור מלא (לא goo.gl) ── */
      if(!/goo\.gl/.test(url)){
        if(/!11m2/.test(url)){
          /* רשימה — URL מלא; נעביר את ה-URL לחילוץ סוג הרשימה ולשליפת preload */
          const listId=extractListId(url);
          if(!listId) throw new Error('לא ניתן לחלץ את מזהה הרשימה');
          await importListFromLink(listId,'',listSrc,url);
          setShowLinkImport(false);setLinkUrl('');setLinkImporting(false);return;
        }
        /* מקום בודד — מלא */
        const{name,lat,lng,placeId:urlPlaceId}=parseMapsUrl(url);
        if(!name&&!lat) throw new Error('לא ניתן לפרש את הקישור');
        const _known=lookupKnown({name,lat,lng});
        /* שמירה ישירה — ללא קריאת Places API אוטומטית (לחץ 🔍 להשלמה ידנית) */
        const fi={id:uid(),name:name||'מקום מגוגל מפות',address:'',lat,lng,url,
          placeId:urlPlaceId||'',_listSource:listSrc,_noCoords:!lat,
          ...(_known||{})};
        if(tripRef.current.interestBank.some(ex=>isTakeoutDup(fi,ex))){toast(`"${fi.name}" כבר קיים`,'error');setLinkImporting(false);return;}
        onUpdate({...tripRef.current,interestBank:[...tripRef.current.interestBank,fi]});
        toast(`✓ "${fi.name}" נוסף לאטרקציות — לחץ 🔍 להשלמת פרטים`,'success');
        setShowLinkImport(false);setLinkUrl('');setLinkImporting(false);return;
      }

      /* ── קישור קצר goo.gl — פתור דרך proxy ── */
      const{finalUrl,html}=await fetchViaProxy(url);

      /* בדוק אם ה-proxy הצליח לפתור את ה-redirect (finalUrl שונה מה-goo.gl המקורי) */
      const resolvedUrl=finalUrl&&!finalUrl.includes('goo.gl')&&finalUrl!==url?finalUrl:'';

      /* אם הפתרון נכשל — הנח את המשתמש להדביק URL מלא */
      if(!resolvedUrl&&!html){
        throw new Error(
          'לא ניתן לפתוח קישור קצר אוטומטית.\n'+
          'פתח את הקישור בדפדפן, המתן שהדף יטען, '+
          'העתק את הכתובת המלאה מסרגל הכתובות (מתחילה ב-google.com/maps) והדבק אותה כאן'
        );
      }
      const effectiveUrl=resolvedUrl||url;

      /* רשימה */
      if(/!11m2/.test(effectiveUrl)){
        const listId=extractListId(effectiveUrl);
        if(!listId) throw new Error('לא ניתן לחלץ מזהה רשימה');
        await importListFromLink(listId,html,listSrc,effectiveUrl);
        setShowLinkImport(false);setLinkUrl('');setLinkImporting(false);return;
      }

      /* מקום בודד */
      let placeName='',lat=null,lng=null,urlPlaceId='';
      if(resolvedUrl){const p=parseMapsUrl(resolvedUrl);if(p.name)placeName=p.name;if(p.lat){lat=p.lat;lng=p.lng;}if(p.placeId)urlPlaceId=p.placeId;}
      if(!placeName&&html) placeName=extractNameFromHtml(html);
      if(!lat&&html){const cM=html.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);if(cM){lat=parseFloat(cM[1]);lng=parseFloat(cM[2]);}}
      if(!placeName) throw new Error('לא ניתן לפרש את הקישור — נסה קישור ישיר מגוגל מפות');
      const _known=lookupKnown({name:placeName,lat,lng});
      /* שמירה ישירה — ללא קריאת Places API אוטומטית (לחץ 🔍 להשלמה ידנית) */
      const fi={id:uid(),name:placeName,address:'',lat,lng,url,placeId:urlPlaceId||'',
        _listSource:listSrc,_noCoords:!lat,...(_known||{})};
      if(tripRef.current.interestBank.some(ex=>isTakeoutDup(fi,ex))){toast(`"${fi.name}" כבר קיים`,'error');setLinkImporting(false);return;}
      onUpdate({...tripRef.current,interestBank:[...tripRef.current.interestBank,fi]});
      toast(`✓ "${fi.name}" נוסף לאטרקציות — לחץ 🔍 להשלמת פרטים`,'success');
      setShowLinkImport(false);setLinkUrl('');
    }catch(e){
      toast('שגיאה: '+e.message,'error');
    }
    setLinkImporting(false);
  };

  /* ייבוא Google Takeout — JSON (קואורדינטות) + CSV (לבבות/Want to go/רשימות) */
  /* בדיקת כפילות — שם זהה / קואורדינטות קרובות / URL זהה */
  const isTakeoutDup=(newItem,existing)=>{
    const norm=s=>(s||'').toLowerCase().trim().replace(/\s+/g,' ');
    const n=norm(newItem.name);
    if(n&&n!=='מקום ללא שם'&&n===norm(existing.name)) return true;
    if(newItem.lat!=null&&existing.lat!=null){
      if(Math.abs(newItem.lat-existing.lat)<0.0005&&Math.abs(newItem.lng-existing.lng)<0.0005) return true;
    }
    if(newItem.website&&existing.website&&newItem.website===existing.website) return true;
    return false;
  };

  const importTakeout=files=>{
    const fileList=Array.from(files);
    if(!fileList.length) return;
    /* זיהוי מקור לפי שם קובץ — לסמן על המפה */
    const detectSource=name=>{
      const n=name.toLowerCase();
      if(n.includes('liked')||n.includes('מועדפים')||n.includes('favorites')) return 'liked';
      if(n.includes('want')||n.includes('רוצה')) return 'wantToGo';
      return 'list';
    };
    const readOne=(file,done)=>{
      const r=new FileReader();
      r.onload=e=>{
        try{
          const text=e.target.result;
          const isCSV=file.name.toLowerCase().endsWith('.csv');
          const items=isCSV
            ? parseTakeoutCSV(text)
            : parseTakeoutFeatures(JSON.parse(text));
          const src=isCSV?detectSource(file.name):'saved';
          items.forEach(i=>{ if(!i._listSource) i._listSource=src; });
          done(items,isCSV);
        }catch(err){done([],false);}
      };
      r.onerror=()=>done([],false);
      r.readAsText(file,'utf-8');
    };
    const allItems=[];
    let jsonCount=0,csvCount=0;
    let pending=fileList.length;
    fileList.forEach(file=>readOne(file,(items,isCSV)=>{
      allItems.push(...items);
      if(isCSV) csvCount+=items.length; else jsonCount+=items.length;
      if(--pending===0){
        if(!allItems.length){
          toast('לא נמצאו מקומות — ודא שבחרת קבצי JSON או CSV מגוגל טייקאוט','error');
          return;
        }
        /* סינון כפילויות — כנגד הבנק הקיים וגם בתוך הקובץ החדש */
        const existing=trip.interestBank;
        const unique=[];
        for(const item of allItems){
          const dupInExisting=existing.some(e=>isTakeoutDup(item,e));
          const dupInNew=unique.some(e=>isTakeoutDup(item,e));
          if(!dupInExisting&&!dupInNew) unique.push(item);
        }
        const dupCount=allItems.length-unique.length;
        if(!unique.length){
          toast(`כל ${allItems.length} המקומות כבר קיימים בבנק — אין חדשים להוסיף`,'error');
          return;
        }
        onUpdate({...trip,interestBank:[...existing,...unique]});
        const parts=[];
        if(jsonCount) parts.push(`${unique.filter(i=>!i._noCoords).length} עם GPS`);
        if(csvCount)  parts.push(`${unique.filter(i=>i._noCoords).length} ללא GPS (לחץ 🔍)`);
        const dupMsg=dupCount>0?` (${dupCount} כפילויות דולגו)`:'';
        toast(`יובאו ${unique.length} מקומות${dupMsg} ✓`,'success');
        setShowTakeout(false);
      }
    }));
  };

  return <div style={{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden',background:'var(--bg2)'}}>
    {/* כותרת */}
    <div style={{padding:'12px 14px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:6,flexShrink:0}}>
      <span style={{fontWeight:700,fontSize:14}}>⭐ בנק אטרקציות</span>
      <span className="chip chip-blue" style={{fontSize:10}}>{trip.interestBank.length}</span>
      {selected.size>0&&<button className="btn btn-danger btn-sm"
        style={{padding:'2px 8px',fontSize:11,marginRight:2}}
        onClick={()=>{if(confirm(`למחוק ${selected.size} פריטים מסומנים?`))delMany(new Set(selected));}}>
        🗑 מחק {selected.size}
      </button>}
      <div style={{flex:1}}/>
      {(enrichingId||batchProgress)&&<span style={{fontSize:10,color:'var(--amber)'}}>⏳{batchProgress?` ${batchProgress.done}/${batchProgress.total}`:' מעשיר...'}</span>}
      {enrichStatus&&<span style={{fontSize:10,color:'var(--amber)',maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{enrichStatus}</span>}
      {onClose&&<button onClick={onClose} style={{background:'none',border:'none',color:'var(--text3)',fontSize:20,cursor:'pointer',lineHeight:1,padding:'0 2px'}}>✕</button>}
    </div>

    {/* שורת חיפוש + מיון */}
    {trip.interestBank.length>0&&<div style={{padding:'6px 10px',borderBottom:'1px solid var(--border)',flexShrink:0,display:'flex',flexDirection:'column',gap:5}}>
      <div style={{display:'flex',gap:5,alignItems:'center'}}>
        <input
          className="input"
          placeholder="🔍 חפש לפי שם, כתובת, סוג…"
          value={bankSearch}
          onChange={e=>setBankSearch(e.target.value)}
          style={{fontSize:12,padding:'5px 9px',flex:1}}
        />
        {bankSearch&&<button className="btn btn-secondary btn-sm" style={{flexShrink:0,padding:'4px 8px'}}
          onClick={()=>setBankSearch('')}>✕</button>}
      </div>
      <div style={{display:'flex',gap:4,alignItems:'center'}}>
        <span style={{fontSize:10,color:'var(--text3)',flexShrink:0}}>מיון:</span>
        {[['default','📋 ברירת מחדל'],['name','א-ת שם'],['distance','📍 מרחק']].map(([mode,label])=>(
          <button key={mode} className="btn btn-sm"
            style={{fontSize:10,padding:'2px 7px',flex:1,
              background:sortMode===mode?'var(--accent)':'var(--bg3)',
              color:sortMode===mode?'#fff':'var(--text2)',
              border:`1px solid ${sortMode===mode?'var(--accent)':'var(--border)'}`}}
            onClick={()=>{
              if(mode==='distance'){
                const c=window.__gmGetCenter?.();
                if(!c){toast('פתח את המפה כדי למיין לפי מרחק','error');return;}
                setMapCenter(c);
              }
              setSortMode(mode);
            }}>{label}</button>
        ))}
      </div>
      {sortMode==='distance'&&mapCenter&&<div style={{fontSize:10,color:'var(--text3)',textAlign:'center'}}>
        ממרכז המפה · לחץ "מרחק" שוב לעדכן מיקום
      </div>}
      {/* filter chips by listSource */}
      {(()=>{
        const DSRC={
          liked:    {color:'#ec4899',emoji:'❤️',label:'מועדפים'},
          wantToGo: {color:'#22c55e',emoji:'🏴',label:'רוצה לבקר'},
          saved:    {color:'#f59e0b',emoji:'⭐',label:'שמור'},
          list:     {color:'#6366f1',emoji:'📋',label:'רשימה'},
          itinerary:{color:'#16a34a',emoji:'🧳',label:'תוכנית נסיעה'},
        };
        const existing=new Set(trip.interestBank.map(i=>i._listSource||'saved'));
        const chips=Object.entries(DSRC).filter(([k])=>existing.has(k));
        if(chips.length<2)return null;
        return(
          <div style={{display:'flex',gap:4,alignItems:'center',flexWrap:'wrap'}}>
            <span style={{fontSize:10,color:'var(--text3)',flexShrink:0}}>סוג:</span>
            <button className="btn btn-sm"
              style={{fontSize:10,padding:'2px 7px',background:!filterSrc?'var(--accent)':'var(--bg3)',
                color:!filterSrc?'#fff':'var(--text2)',border:`1px solid ${!filterSrc?'var(--accent)':'var(--border)'}`}}
              onClick={()=>setFilterSrc(null)}>הכל</button>
            {chips.map(([k,v])=>(
              <button key={k} className="btn btn-sm"
                style={{fontSize:10,padding:'2px 7px',
                  background:filterSrc===k?v.color+'33':'var(--bg3)',
                  color:filterSrc===k?v.color:'var(--text2)',
                  border:`1px solid ${filterSrc===k?v.color:'var(--border)'}`}}
                onClick={()=>setFilterSrc(f=>f===k?null:k)}>
                {v.emoji} {v.label}
              </button>
            ))}
          </div>
        );
      })()}
    </div>}

    {/* רשימה מקובצת / תצוגה שטוחה */}
    <div className="scroll-y flex-1" style={{padding:'8px 10px'}}>
      {trip.interestBank.length===0
        ?<div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'24px 8px',lineHeight:1.9}}>
            לחץ על מקום במפה ← "הוסף לבנק האטרקציות".<br/>או ייבא מ-Google Takeout.
          </div>
        :showFlat
        ?displayItems.length===0
          ?<div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'24px 8px'}}>
              לא נמצאו אטרקציות
            </div>
          :<>
            <div style={{fontSize:10,color:'var(--text3)',marginBottom:6,paddingRight:2}}>
              {displayItems.length} אטרקציות
            </div>
            {displayItems.map(item=>(
              <div key={item.id}>
                {sortMode==='distance'&&item._dist!==undefined&&(
                  <div style={{fontSize:10,color:'var(--accent)',fontWeight:600,marginBottom:2,paddingRight:2}}>
                    📍 {fmtDist(item._dist)}
                  </div>
                )}
                <BankItem item={item} days={trip.days} onAddToDay={addItemToDay}
                  onDelete={()=>delBank(item.id)} onLocate={onLocate} onFocusItem={onFocusItem}
                  selected={selected.has(item.id)} onSelect={toggleSelect}
                  onEnrich={enrichItem} enriching={enrichingId===item.id}
                  onAddToDayBank={addItemToDayBank}
                  onSetDayStart={setItemAsStart} onSetDayEnd={setItemAsEnd}
                  onSaveCustomName={saveCustomNameLocal}
                  onChangeListSource={saveListSource}
                  onNoteChange={(id,note)=>{onUpdate({...tripRef.current,interestBank:tripRef.current.interestBank.map(i=>i.id===id?{...i,note}:i)});}}/>
              </div>
            ))}
          </>
        :grouped.map(([country,items])=>{
          const allSel=items.every(i=>selected.has(i.id));
          const someSel=items.some(i=>selected.has(i.id));
          const isCollapsed=!expanded.has(country);
          const selCount=items.filter(i=>selected.has(i.id)).length;
          return <div key={country} style={{marginBottom:10}}>
            {/* כותרת מדינה */}
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 8px',
              background:'var(--bg3)',borderRadius:8,cursor:'pointer',userSelect:'none',
              marginBottom:isCollapsed?0:6,borderBottom:isCollapsed?'none':'1px solid var(--border)'}}
              onClick={()=>toggleCollapse(country)}>
              <span style={{fontSize:10,color:'var(--text3)',lineHeight:1}}>{isCollapsed?'▶':'▼'}</span>
              <span style={{fontSize:12,fontWeight:700,flex:1,color:'var(--text)'}}>{country}</span>
              <span style={{fontSize:10,color:'var(--text3)'}}>({items.length})</span>
              {/* צ'קבוקס לבחירת כל המדינה */}
              <input type="checkbox"
                checked={allSel}
                ref={el=>{if(el)el.indeterminate=someSel&&!allSel;}}
                onChange={e=>{e.stopPropagation();toggleCountry(items,allSel);}}
                onClick={e=>e.stopPropagation()}
                style={{cursor:'pointer',width:13,height:13,flexShrink:0}}
                title="בחר/בטל הכל"/>
              {someSel&&<button className="btn btn-danger btn-sm"
                style={{padding:'1px 6px',fontSize:10,flexShrink:0}}
                onClick={e=>{e.stopPropagation();
                  if(confirm(`למחוק ${selCount} פריטים מסומנים מ-${country}?`))
                    delMany(new Set(items.filter(i=>selected.has(i.id)).map(i=>i.id)));}}
                title={`מחק פריטים מסומנים מ-${country}`}>🗑 {selCount}</button>}
            </div>
            {/* פריטים */}
            {!isCollapsed&&items.map(item=>(
              <BankItem key={item.id} item={item} days={trip.days} onAddToDay={addItemToDay}
                onDelete={()=>delBank(item.id)} onLocate={onLocate} onFocusItem={onFocusItem}
                selected={selected.has(item.id)} onSelect={toggleSelect}
                onEnrich={enrichItem} enriching={enrichingId===item.id}
                onAddToDayBank={addItemToDayBank}
                onSetDayStart={setItemAsStart} onSetDayEnd={setItemAsEnd}
                onSaveCustomName={saveCustomNameLocal}
                onChangeListSource={saveListSource}
                onNoteChange={(id,note)=>{onUpdate({...tripRef.current,interestBank:tripRef.current.interestBank.map(i=>i.id===id?{...i,note}:i)});}}/>
            ))}
          </div>;
        })
      }
    </div>

    {/* כפתורי תחתית */}
    <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',flexDirection:'column',gap:6,flexShrink:0}}>
      {/* סרגל התקדמות העשרה קבוצתית */}
      {batchProgress&&<div style={{background:'var(--bg3)',borderRadius:8,padding:'8px 10px'}}>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text2)',marginBottom:5}}>
          <span>🔍 מאתר כתובות...</span>
          <span style={{color:'var(--amber)',fontWeight:700}}>{batchProgress.done}/{batchProgress.total}</span>
        </div>
        <div style={{background:'var(--border)',borderRadius:4,height:5,overflow:'hidden'}}>
          <div style={{background:'var(--amber)',height:'100%',borderRadius:4,
            width:`${Math.round(batchProgress.done/batchProgress.total*100)}%`,
            transition:'width 0.3s'}}/>
        </div>
        {batchProgress.name&&<div style={{fontSize:10,color:'var(--text3)',marginTop:4,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
          ⏳ {batchProgress.name}
        </div>}
      </div>}
      {/* סטטוס העשרה דרך GitHub Action */}
      {enrichStatus&&!batchProgress&&<div style={{background:'rgba(234,179,8,.08)',border:'1px solid rgba(234,179,8,.3)',borderRadius:8,padding:'7px 10px',display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:13}}>⏳</span>
        <span style={{fontSize:11,color:'var(--amber)',flex:1}}>{enrichStatus}</span>
      </div>}
      {/* כפתור השלמת כתובות קבוצתית — מופיע רק כשיש פריטים ללא כתובת */}
      {!batchProgress&&!enrichStatus&&trip.interestBank.some(i=>!i.placeId&&!i._notFound)&&(
        <div style={{background:'rgba(234,179,8,.1)',border:'1px solid rgba(234,179,8,.35)',borderRadius:8,padding:'8px 10px',marginBottom:2}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--amber)',marginBottom:5}}>
            🔍 {trip.interestBank.filter(i=>!i.placeId&&!i._notFound).length} אטרקציות ממתינות לקישור לגוגל מפות
          </div>
          <div style={{fontSize:10,color:'var(--text3)',marginBottom:6,lineHeight:1.4}}>
            קישור מאפשר דירוגים, שעות פתיחה ומיקום מדויק. כל קישור = קריאה ל-API של גוגל.
          </div>
          <button className="btn btn-amber btn-sm" style={{width:'100%'}}
            disabled={!!enrichingId} onClick={batchEnrichMissing}>
            🔗 קשר הכל לגוגל עכשיו
          </button>
        </div>
      )}
      <button className="btn btn-secondary btn-sm" style={{width:'100%'}}
        onClick={()=>{const n=prompt('שם המקום:');if(n)addToBank({name:n,address:'',id:uid()});}}>
        + הוסף ידנית
      </button>
      <button className="btn btn-secondary btn-sm" style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)'}}
        onClick={()=>setShowLinkImport(true)}>
        🔗 ייבא מקישור גוגל מפות
      </button>
      <button className="btn btn-amber btn-sm" style={{width:'100%'}} onClick={()=>setShowTakeout(true)}>
        ⭐ ייבא מ-Google Takeout
      </button>
    </div>

    {/* מודל ייבוא מקישור גוגל מפות */}
    {showLinkImport&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowLinkImport(false)}>
      <div className="modal" style={{maxWidth:480,width:'95vw'}}>
        <div className="modal-header">
          <span style={{fontWeight:700}}>🔗 ייבוא מקישור גוגל מפות</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>setShowLinkImport(false)}>✕</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:14}}>

          {/* הסבר */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:12,fontSize:12,lineHeight:1.9,color:'var(--text2)'}}>
            <div style={{fontWeight:700,color:'var(--text)',marginBottom:6,fontSize:13}}>תומך בשני סוגי קישורים:</div>
            <div style={{marginBottom:6}}>
              <span style={{fontWeight:700,color:'var(--green)'}}>📍 מקום בודד</span> — שתף מקום ספציפי בגוגל מפות<br/>
              <span style={{color:'var(--text3)',fontSize:11}}>לחץ על מקום ← ↗ שתף ← העתק קישור</span>
            </div>
            <div>
              <span style={{fontWeight:700,color:'var(--green)'}}>🗂️ רשימה שלמה</span> — שתף רשימת מועדפים / רוצה לבקר / רשימה מותאמת<br/>
              <span style={{color:'var(--text3)',fontSize:11}}>תפריט ☰ ← Saved ← בחר רשימה ← שתף (↗) ← העתק קישור</span>
            </div>
          </div>

          {/* שדה URL */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--text2)',display:'block',marginBottom:5}}>
              קישור גוגל מפות
            </label>
            <input
              type="url"
              value={linkUrl}
              onChange={e=>setLinkUrl(e.target.value)}
              placeholder="https://maps.app.goo.gl/... או google.com/maps/..."
              style={{width:'100%',padding:'8px 10px',borderRadius:8,border:'1px solid var(--border)',
                background:'var(--bg2)',color:'var(--text)',fontSize:13,direction:'ltr',boxSizing:'border-box'}}
              onKeyDown={e=>e.key==='Enter'&&!linkImporting&&importFromLink(linkUrl,linkSource)}
              autoFocus
            />
            <div style={{fontSize:11,color:'var(--text3)',marginTop:5,lineHeight:1.5}}>
              💡 לייבוא רשימה שלמה: פתח את הקישור בדפדפן, המתן לטעינה, העתק את הכתובת המלאה מסרגל הכתובות והדבק כאן
            </div>
          </div>

          {/* סוג הרשימה */}
          <div>
            <label style={{fontSize:12,fontWeight:600,color:'var(--text2)',display:'block',marginBottom:8}}>
              סוג הסימון במפה
            </label>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              {[
                {val:'liked',     emoji:'❤️', label:'מועדפים (לב)',       color:'#ec4899'},
                {val:'wantToGo',  emoji:'🏴', label:'רוצה לבקר (דגל)',   color:'#22c55e'},
                {val:'saved',     emoji:'⭐', label:'שמור (כוכב)',        color:'#f59e0b'},
                {val:'list',      emoji:'📋', label:'רשימה (יהלום)',      color:'#6366f1'},
                {val:'itinerary', emoji:'🧳', label:'תוכנית נסיעה (לינה)',color:'#16a34a'},
              ].map(opt=>(
                <div key={opt.val}
                  onClick={()=>setLinkSource(opt.val)}
                  style={{
                    padding:'9px 12px',borderRadius:9,cursor:'pointer',fontSize:13,fontWeight:600,
                    display:'flex',alignItems:'center',gap:8,
                    border:`2px solid ${linkSource===opt.val?opt.color:'var(--border)'}`,
                    background:linkSource===opt.val?opt.color+'22':'var(--bg3)',
                    color:linkSource===opt.val?opt.color:'var(--text2)',
                    transition:'all 0.15s',
                  }}>
                  <span style={{fontSize:16}}>{opt.emoji}</span>
                  <span>{opt.label}</span>
                </div>
              ))}
            </div>
          </div>

          {/* סטטוס GitHub Token */}
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:8,
            background:settings?.githubToken?'rgba(34,197,94,0.08)':'rgba(245,158,11,0.08)',
            border:`1px solid ${settings?.githubToken?'rgba(34,197,94,0.25)':'rgba(245,158,11,0.25)'}`}}>
            <span style={{fontSize:14}}>{settings?.githubToken?'🐙✅':'🐙⚠️'}</span>
            <span style={{fontSize:11,color:'var(--text2)',flex:1}}>
              {settings?.githubToken
                ?'GitHub Token מוגדר — ייבוא אמין דרך GitHub זמין'
                :'GitHub Token לא מוגדר — ייבוא יסתמך על פרוקסים בלבד (עלול להיכשל). הגדר בלשונית 🔗 חיבוריות'}
            </span>
          </div>

          {/* כפתור ייבוא */}
          <button
            className="btn btn-primary"
            style={{width:'100%',justifyContent:'center',gap:8,fontSize:14,fontWeight:700,padding:'10px 0'}}
            disabled={linkImporting||!linkUrl.trim()}
            onClick={()=>importFromLink(linkUrl,linkSource)}>
            {linkImporting
              ? <><span style={{display:'inline-block',animation:'spin 1s linear infinite'}}>⏳</span> {linkStatus||'מייבא...'}</>
              : '🔗 ייבא מקום'}
          </button>
        </div>
      </div>
    </div>}

    {/* מודל ייבוא Takeout */}
    {showTakeout&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowTakeout(false)}>
      <div className="modal" style={{maxWidth:520,width:'95vw'}}>
        <div className="modal-header">
          <span style={{fontWeight:700}}>📥 ייבוא מקומות מגוגל מפות</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>setShowTakeout(false)}>✕</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:12}}>

          {/* שלב 1 — הורדה */}
          <div style={{background:'var(--bg3)',borderRadius:10,padding:13,fontSize:13,lineHeight:1.9}}>
            <div style={{fontWeight:700,color:'var(--text)',marginBottom:4}}>שלב 1 — הורד מ-Google Takeout</div>
            <div style={{color:'var(--text2)'}}>
              1. עבור ל-<a href="https://takeout.google.com" target="_blank" rel="noreferrer" style={{color:'var(--accent)'}}>takeout.google.com</a>
              {' '}← לחץ <strong>"בטל בחירת הכל"</strong><br/>
              2. חפש וסמן ✅ <strong>"Maps (your places)"</strong><br/>
              3. חפש וסמן ✅ <strong>"Saved"</strong> <span style={{color:'var(--text3)',fontSize:11}}>(ללא זה — לא יהיו לבבות ורשימות פרטיות)</span><br/>
              4. לחץ <strong>"Next step"</strong> → <strong>"Create export"</strong> → הורד את ה-ZIP
            </div>
          </div>

          {/* שלב 2 — איפה הקבצים */}
