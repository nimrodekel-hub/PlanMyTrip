<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaravanControl — מנהל טיולים</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #232736;
      --surface: #2a2e3f; --surface2: #333849; --border: #3d4358;
      --text: #e8eaf0; --text2: #9aa0b8; --text3: #6b7295;
      --accent: #4f8ef7; --green: #22c55e; --amber: #f59e0b;
      --red: #ef4444; --purple: #a855f7; --orange: #f97316;
      --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .light {
      --bg: #f0f4f8; --bg2: #e8edf3; --bg3: #dde3ec;
      --surface: #ffffff; --surface2: #f5f7fa; --border: #d1d9e6;
      --text: #1a2035; --text2: #4a5568; --text3: #8896aa;
      --shadow: 0 4px 24px rgba(0,0,0,0.1);
    }

    html, body { height: 100%; font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; direction: rtl; }
    #root { height: 100%; display: flex; flex-direction: column; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .app-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 20px; flex-shrink: 0; z-index: 100; }
    .vehicle-banner { display: flex; align-items: center; gap: 16px; padding: 10px 0 6px; flex-wrap: wrap; }
    .tab-bar { display: flex; gap: 2px; padding: 6px 0 0; overflow-x: auto; }
    .tab-btn { padding: 8px 16px; border: none; background: none; color: var(--text2); font-size: 13px; font-weight: 500; font-family: 'Heebo', sans-serif; cursor: pointer; border-radius: 8px 8px 0 0; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text); background: var(--surface); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface); }
    .main-content { flex: 1; overflow: hidden; display: flex; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; font-family: 'Heebo', sans-serif; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3a7de8; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface2); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 7px; border-radius: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: 'Heebo', sans-serif; width: 100%; transition: border-color 0.15s; direction: rtl; }
    .input:focus { outline: none; border-color: var(--accent); }
    .input::placeholder { color: var(--text3); }
    textarea.input { resize: vertical; min-height: 80px; }
    select.input { cursor: pointer; }
    .label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 4px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-body { padding: 16px; }

    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .chip-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .chip-amber { background: rgba(245,158,11,0.15); color: var(--amber); }
    .chip-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .chip-blue { background: rgba(79,142,247,0.15); color: var(--accent); }
    .chip-purple { background: rgba(168,85,247,0.15); color: var(--purple); }

    .progress { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-start; }

    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

    .timeline { display: flex; flex-direction: column; position: relative; }
    .timeline::before { content: ''; position: absolute; right: 44px; top: 0; bottom: 0; width: 2px; background: var(--border); z-index: 0; }
    .timeline-block { display: flex; flex-direction: row-reverse; gap: 12px; position: relative; animation: fadeIn 0.3s ease; padding-bottom: 6px; }
    .timeline-dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; margin-top: 12px; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid var(--bg2); }
    .block-travel { background: rgba(79,142,247,0.1); border: 1px solid rgba(79,142,247,0.3); }
    .block-activity { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .block-stop { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }

    .stars { display: flex; gap: 3px; }
    .star { font-size: 20px; cursor: pointer; transition: transform 0.1s; user-select: none; }
    .star:hover { transform: scale(1.2); }

    .split-view { display: grid; grid-template-columns: 1fr 1fr; height: 100%; overflow: hidden; }
    .split-left { border-left: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; }
    .split-right { overflow: hidden; display: flex; flex-direction: column; }
    @media (max-width: 768px) {
      .split-view { grid-template-columns: 1fr; }
      .split-left.mobile-hidden { display: none; }
      .split-right.mobile-hidden { display: none; }
    }

    .interest-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); transition: all 0.15s; animation: slideIn 0.2s ease; }
    .interest-item:hover { border-color: var(--accent); }

    .expense-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .expense-row:last-child { border-bottom: none; }

    .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; transition: background 0.15s; }
    .list-item:hover { background: var(--surface2); }
    .list-item.done span.item-text { text-decoration: line-through; opacity: 0.5; }

    .weather-card { background: linear-gradient(135deg, #1e3a5f, #1a2d4e); border-radius: 12px; padding: 14px; color: #fff; }
    .sidebar-panel { width: 290px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

    .toast-container { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13px; box-shadow: var(--shadow); animation: modalIn 0.25s ease; display: flex; align-items: center; gap: 10px; min-width: 240px; cursor: pointer; }
    .toast.success { border-right: 3px solid var(--green); }
    .toast.error { border-right: 3px solid var(--red); }
    .toast.info { border-right: 3px solid var(--accent); }

    .scroll-y { overflow-y: auto; }
    .flex-1 { flex: 1; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 20px; color: var(--text3); text-align: center; }
    .empty-state .emoji { font-size: 48px; }
    .empty-state p { font-size: 14px; line-height: 1.7; max-width: 320px; }

    .gauge { display: flex; flex-direction: column; gap: 3px; min-width: 80px; }
    .gauge-label { font-size: 10px; color: var(--text3); font-weight: 600; }
    .gauge-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; width: 100%; }
    .gauge-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }

    .day-header { padding: 12px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .day-header:hover { background: var(--surface); }
    .time-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(79,142,247,0.12); border-radius: 8px; font-size: 12px; }

    .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .doc-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
    .doc-item:hover { border-color: var(--accent); transform: translateY(-2px); }

    .mobile-toggle { display: none; }
    @media (max-width: 768px) {
      .mobile-toggle { display: flex; }
      .sidebar-panel { display: none; }
    }

    .gm-style .gm-style-iw-c { padding: 0 !important; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── עזרים ── */
const uid = () => Math.random().toString(36).slice(2,10);
const fmt2 = n => n?.toString().padStart(2,'0');
const dateStr = d => { if (!d) return ''; return new Date(d).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}); };
const nowTime = () => { const n=new Date(); return `${fmt2(n.getHours())}:${fmt2(n.getMinutes())}`; };
const addMins = (t,m) => { const [h,mi]=t.split(':').map(Number),tot=h*60+mi+m; return `${fmt2(Math.floor(tot/60)%24)}:${fmt2(tot%60)}`; };

const EXPENSE_CATS    = ['דלק','אוכל','קמפינג','אגרות','פעילויות','קניות','תחזוקה','אחר'];
const CAT_COLORS      = {'דלק':'#ef4444','אוכל':'#f59e0b','קמפינג':'#22c55e','אגרות':'#8b5cf6','פעילויות':'#4f8ef7','קניות':'#ec4899','תחזוקה':'#f97316','אחר':'#6b7280'};
const BLOCK_TYPES     = ['travel','activity','stop'];
const BLOCK_HE        = {travel:'נסיעה',activity:'פעילות',stop:'עצירה'};
const BLOCK_EMOJI     = {travel:'🚗',activity:'🎯',stop:'⏸️'};
const BLOCK_COLOR     = {travel:'var(--accent)',activity:'var(--green)',stop:'var(--amber)'};
const WMO = {0:['☀️','בהיר'],1:['🌤️','בהיר ברובו'],2:['⛅','מעונן חלקית'],3:['☁️','מעונן'],45:['🌫️','ערפל'],51:['🌦️','טפטוף קל'],61:['🌧️','גשם קל'],63:['🌧️','גשם'],65:['🌧️','גשם כבד'],71:['🌨️','שלג קל'],80:['🌦️','מטר'],95:['⛈️','סופת רעמים']};

/* ── ברירות מחדל ── */
const defaultTrip = (name='טיול חדש') => ({
  id:uid(),name,startDate:'',endDate:'',
  vehicle:{name:'הקרוון שלי',height:'',width:'',weight:'',plate:'',waterLevel:80,wasteLevel:10,gasLevel:75},
  days:[],expenses:[],interestBank:[],packingList:[],shoppingList:[],documents:[],generalNotes:'',quickNotes:[],
});
const defaultDay  = (date='') => ({id:uid(),date,location:'',coordinates:null,blocks:[],notes:'',summary:'',currentTime:'08:00'});
const defaultBlock= (type='activity',start='09:00') => ({id:uid(),type,title:'',startTime:start,durationMins:60,location:'',notes:'',rating:0,isCompleted:false,cost:0});

/* ── שמירה מקומית ── */
const loadState = () => { try { return JSON.parse(localStorage.getItem('caravanCtrl_he')||'null'); } catch { return null; } };
const saveState = s => { try { localStorage.setItem('caravanCtrl_he',JSON.stringify(s)); } catch {} };

/* ── GitHub ── */
const ghFetch = async (tok,user,repo,path,method='GET',body=null) => {
  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`,{
    method, headers:{Authorization:`token ${tok}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
    ...(body?{body:JSON.stringify(body)}:{})
  });
  if (!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||`HTTP ${res.status}`);}
  return res.json();
};
const ghSave = (tok,user,repo,path,data,sha=null) => ghFetch(tok,user,repo,path,'PUT',{message:`עדכון ${path}`,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2)))),...(sha?{sha}:{})});
const ghLoad = async (tok,user,repo,path) => { const d=await ghFetch(tok,user,repo,path); return {content:JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,''))))),sha:d.sha}; };
const ghUpload = (tok,user,repo,path,b64,sha=null) => ghFetch(tok,user,repo,path,'PUT',{message:`העלאת ${path}`,content:b64,...(sha?{sha}:{})});
const fileToB64 = f => new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});

/* ── מזג אוויר ── */
const fetchWeather = (lat,lon) => fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&current_weather=true&timezone=auto&forecast_days=3`).then(r=>r.json());

/* ══════════════════════════════════
   TOAST
══════════════════════════════════ */
let _setToasts=null, _tid=0;
const toast=(msg,type='info',ms=3500)=>{
  if(!_setToasts)return; const id=++_tid;
  _setToasts(t=>[...t,{id,msg,type}]);
  setTimeout(()=>_setToasts(t=>t.filter(x=>x.id!==id)),ms);
};
function Toasts(){
  const[ts,set]=useState([]); _setToasts=set;
  return <div className="toast-container">{ts.map(t=>(
    <div key={t.id} className={`toast ${t.type}`} onClick={()=>set(x=>x.filter(i=>i.id!==t.id))}>
      <span>{t.type==='success'?'✅':t.type==='error'?'❌':'ℹ️'}</span><span>{t.msg}</span>
    </div>
  ))}</div>;
}

/* ══════════════════════════════════
   כוכבי דירוג
══════════════════════════════════ */
function Stars({value,onChange,size=18}){
  const[hover,setHover]=useState(0);
  return <div className="stars">{[1,2,3,4,5].map(i=>(
    <span key={i} className="star"
      style={{fontSize:size,opacity:i<=(hover||value)?1:0.25,filter:i<=(hover||value)?'none':'grayscale(1)',cursor:onChange?'pointer':'default'}}
      onMouseEnter={()=>onChange&&setHover(i)} onMouseLeave={()=>onChange&&setHover(0)}
      onClick={()=>onChange&&onChange(i===value?0:i)}>⭐</span>
  ))}</div>;
}

/* ══════════════════════════════════
   כותרת רכב
══════════════════════════════════ */
function VehicleHeader({trip,theme,onThemeToggle}){
  const v=trip?.vehicle||{};
  return <div className="vehicle-banner">
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:24}}>🚐</span>
      <div>
        <div style={{fontSize:13,fontWeight:700}}>{v.name||'הקרוון שלי'}</div>
        <div style={{fontSize:11,color:'var(--text3)'}}>{[v.height&&`גובה:${v.height}מ`,v.width&&`רוחב:${v.width}מ`,v.weight&&`${v.weight}ק"ג`,v.plate].filter(Boolean).join(' · ')||'לא הוגדרו מידות'}</div>
      </div>
    </div>
    <div style={{display:'flex',gap:14,flex:1,justifyContent:'center',flexWrap:'wrap'}}>
      {[['💧 מים','waterLevel','#4f8ef7'],['⛽ דלק','gasLevel','#22c55e'],['🪣 פסולת','wasteLevel','#f59e0b']].map(([lbl,key,col])=>(
        <div key={key} className="gauge">
          <span className="gauge-label">{lbl} {v[key]??0}%</span>
          <div className="gauge-bar"><div className="gauge-fill" style={{width:`${v[key]??0}%`,background:col}}/></div>
        </div>
      ))}
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginRight:'auto'}}>
      {trip&&<div style={{fontSize:12,color:'var(--text2)',textAlign:'right'}}>
        <div style={{fontWeight:600}}>{trip.name}</div>
        <div style={{color:'var(--text3)'}}>{trip.startDate||'—'} ← {trip.endDate||'—'}</div>
      </div>}
      <button className="btn btn-secondary btn-icon btn-sm" onClick={onThemeToggle}>{theme==='dark'?'☀️':'🌙'}</button>
    </div>
  </div>;
}

/* ══════════════════════════════════
   מפת גוגל
══════════════════════════════════ */
function MapView({mapsKey,trip,onAddToBank,onAddToDay}){
  const mapRef=useRef(null), mapInst=useRef(null), markers=useRef([]);
  const [ready,setReady]=useState(false);
  const searchBoxRef=useRef(null);
  // refs כדי שהפונקציות הגלובליות תמיד יקבלו את הנתונים העדכניים
  const tripRef=useRef(trip);
  const onAddToBankRef=useRef(onAddToBank);
  const onAddToDayRef=useRef(onAddToDay);
  useEffect(()=>{tripRef.current=trip;},[trip]);
  useEffect(()=>{onAddToBankRef.current=onAddToBank;},[onAddToBank]);
  useEffect(()=>{onAddToDayRef.current=onAddToDay;},[onAddToDay]);

  useEffect(()=>{
    if (!mapsKey) return;
    if (window.google?.maps){setReady(true);return;}
    if (document.getElementById('gmaps-script')) return;
    window.__gmapsReady=()=>setReady(true);
    const s=document.createElement('script');
    s.id='gmaps-script';
    s.src=`https://maps.googleapis.com/maps/api/js?key=${mapsKey}&libraries=places&language=he&region=IL&callback=__gmapsReady`;
    s.async=true;
    s.onerror=()=>toast('נכשל טעינת מפות גוגל — בדוק את מפתח ה-API','error');
    document.head.appendChild(s);
  },[mapsKey]);

  useEffect(()=>{
    if (!ready||!mapRef.current||mapInst.current) return;
    const map=new window.google.maps.Map(mapRef.current,{
      center:{lat:32.0853,lng:34.7818}, zoom:14,
      mapTypeControl:true, streetViewControl:true, fullscreenControl:true,
      clickableIcons:true,
      styles:[
        {featureType:'poi',elementType:'labels',stylers:[{visibility:'on'}]},
        {featureType:'poi.business',elementType:'labels',stylers:[{visibility:'on'}]},
        {featureType:'poi.attraction',elementType:'labels',stylers:[{visibility:'on'}]},
        {featureType:'transit',elementType:'labels',stylers:[{visibility:'on'}]},
      ],
    });
    mapInst.current=map;
    window.__gmFocus=(lat,lng,zoom=17)=>{ map.panTo({lat,lng}); map.setZoom(zoom); };

    // חיפוש — שלוש שכבות: Places API → Nominatim (OpenStreetMap) → Geocoder
    const input=document.getElementById('map-search-input');
    const searchSvc=new window.google.maps.places.PlacesService(map);
    const geocoder=new window.google.maps.Geocoder();

    const nominatimSearch=async(q)=>{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=4&accept-language=he`,{headers:{'Accept-Language':'he'}});
      return r.json();
    };
    const nominatimReverse=async(lat,lng)=>{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&accept-language=he`,{headers:{'Accept-Language':'he'}});
      return r.json();
    };
    const panToNominatim=(results)=>{
      if (!results?.length) return false;
      const first=results[0];
      const bb=first.boundingbox;
      if (bb){
        map.fitBounds(new window.google.maps.LatLngBounds(
          {lat:parseFloat(bb[0]),lng:parseFloat(bb[2])},
          {lat:parseFloat(bb[1]),lng:parseFloat(bb[3])}
        ));
      } else {
        map.setCenter({lat:parseFloat(first.lat),lng:parseFloat(first.lon)});
        map.setZoom(16);
      }
      return true;
    };

    if (input){
      const doSearch=async()=>{
        const q=input.value.trim(); if (!q) return;
        // 1. Places textSearch
        const placesOk=await new Promise(res=>{
          searchSvc.textSearch({query:q,language:'he'},(results,status)=>{
            if (status===window.google.maps.places.PlacesServiceStatus.OK&&results?.length){
              const bounds=new window.google.maps.LatLngBounds();
              results.slice(0,6).forEach(p=>{
                if (p.geometry?.viewport) bounds.union(p.geometry.viewport);
                else if (p.geometry?.location) bounds.extend(p.geometry.location);
              });
              map.fitBounds(bounds);
              if (results.length===1) map.setZoom(17);
              res(true);
            } else { res(false); }
          });
        });
        if (placesOk) return;
        // 2. Nominatim — מוצא חופים, פארקים, מסעדות, ערים
        try{
          const nRes=await nominatimSearch(q);
          if (panToNominatim(nRes)) return;
        }catch{}
        // 3. Google Geocoder — כתובות
        geocoder.geocode({address:q,language:'he'},(gr,gs)=>{
          if (gs==='OK'&&gr[0]){
            const loc=gr[0].geometry;
            if (loc.viewport) map.fitBounds(loc.viewport);
            else { map.setCenter(loc.location); map.setZoom(15); }
          } else { toast('מקום לא נמצא — נסה שם ספציפי יותר','error'); }
        });
      };
      input.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();doSearch();} });
      window.__gmSearch=doSearch;
    }

    // InfoWindow גלובלי
    const iwPlace={};
    const iw=new window.google.maps.InfoWindow({maxWidth:320});

    const buildIwContent=(p)=>{
      const days=tripRef.current?.days||[];
      const daysHtml=days.length>0
        ? days.map((d,i)=>`<option value="${d.id}">יום ${i+1}${d.location?' — '+d.location:''}${d.date?' ('+d.date+')':''}</option>`).join('')
        : '<option disabled>אין ימים בלוח הזמנים</option>';
      const price=p.priceLevel?'₪'.repeat(p.priceLevel):'';
      const starsHtml=p.rating?`${'★'.repeat(Math.round(p.rating))}${'☆'.repeat(5-Math.round(p.rating))}`:'';
      const reviewsHtml=(p.reviews||[]).slice(0,2).map(r=>`
        <div style="background:#f9f9f9;border-radius:6px;padding:6px 8px;margin-top:6px;font-size:11px;color:#444;line-height:1.4;direction:rtl">
          <span style="color:#f59e0b;font-size:11px">${'★'.repeat(r.rating||0)}</span>
          <span style="color:#999;margin-right:4px">${r.author_name||''}</span><br/>
          ${(r.text||'').slice(0,120)}${(r.text||'').length>120?'…':''}
        </div>`).join('');
      return `<div style="font-family:Heebo,Arial,sans-serif;direction:rtl;text-align:right;padding:6px;min-width:240px;max-width:310px">
        ${p.photoUrl?`<img src="${p.photoUrl}" style="width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:10px;display:block"/>`:''}
        <div style="font-weight:700;font-size:15px;margin-bottom:2px;color:#111">${p.name}</div>
        <div style="font-size:11px;color:#888;margin-bottom:6px;line-height:1.4">${p.address}</div>
        ${p.rating?`<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap">
          <span style="color:#f59e0b;font-size:14px">${starsHtml}</span>
          <span style="font-size:12px;font-weight:600;color:#333">${p.rating}</span>
          ${p.userRatingsTotal?`<span style="font-size:11px;color:#888">(${p.userRatingsTotal.toLocaleString()} ביקורות)</span>`:''}
          ${price?`<span style="font-size:11px;color:#22c55e;font-weight:700">${price}</span>`:''}
        </div>`:''}
        ${p.openStatus?`<div style="font-size:12px;font-weight:600;margin-bottom:4px;${p.openStatus==='פתוח עכשיו'?'color:#22c55e':'color:#ef4444'}">${p.openStatus==='פתוח עכשיו'?'✅':'🔴'} ${p.openStatus}</div>`:''}
        ${p.todayHours?`<div style="font-size:11px;color:#555;margin-bottom:6px">🕐 ${p.todayHours}</div>`:''}
        ${p.phone?`<div style="font-size:11px;color:#4f8ef7;margin-bottom:4px">📞 ${p.phone}</div>`:''}
        ${p.website?`<a href="${p.website}" target="_blank" rel="noreferrer" style="font-size:11px;color:#4f8ef7;display:block;margin-bottom:8px;word-break:break-all">🌐 ${p.website.replace(/^https?:\/\//,'').split('/')[0]}</a>`:''}
        ${reviewsHtml?`<div style="margin-bottom:8px">${reviewsHtml}</div>`:''}
        <hr style="border:none;border-top:1px solid #eee;margin:8px 0"/>
        <button onclick="window.__gmBank()"
          style="background:#f59e0b;color:#fff;border:none;border-radius:7px;padding:8px 0;font-size:13px;cursor:pointer;width:100%;margin-bottom:8px;font-family:Heebo,Arial,sans-serif;font-weight:600">
          🌟 שמור לבנק האטרקציות
        </button>
        <div style="display:flex;gap:6px;align-items:center">
          <select id="gm-day-sel" style="flex:1;border:1px solid #ccc;border-radius:7px;padding:7px 8px;font-size:12px;font-family:Heebo,Arial,sans-serif;direction:rtl">
            <option value="">➕ הוסף ליום...</option>
            ${daysHtml}
          </select>
          <button onclick="window.__gmDay()"
            style="background:#4f8ef7;color:#fff;border:none;border-radius:7px;padding:8px 12px;font-size:13px;cursor:pointer;font-family:Heebo,Arial,sans-serif;font-weight:600;white-space:nowrap">
            הוסף
          </button>
        </div>
      </div>`;
    };

    window.__gmBank=()=>{
      if (!iwPlace.data) return;
      const p=iwPlace.data;
      onAddToBankRef.current({name:p.name,address:p.address,lat:p.lat,lng:p.lng});
      iw.close();
      toast(`"${p.name}" נוסף לבנק האטרקציות`,'success');
    };
    window.__gmDay=()=>{
      const sel=document.getElementById('gm-day-sel');
      if (!sel||!sel.value||!iwPlace.data) return;
      const p=iwPlace.data;
      onAddToDayRef.current(sel.value,{name:p.name,address:p.address,lat:p.lat,lng:p.lng});
      iw.close();
      toast(`"${p.name}" נוסף ליום`,'success');
    };

    map.addListener('click',e=>{
      if (!e.placeId) return;
      e.stop();
      iwPlace.data={name:'טוען...',address:'',lat:e.latLng.lat(),lng:e.latLng.lng()};
      iw.setContent('<div style="padding:16px;font-family:Heebo,sans-serif;direction:rtl;font-size:13px;color:#555">⏳ טוען פרטי מקום...</div>');
      iw.setPosition(e.latLng);
      iw.open(map);

      const svc=new window.google.maps.places.PlacesService(map);

      const applyPlace=(place)=>{
        const lat=place.geometry.location.lat(), lng=place.geometry.location.lng();
        iwPlace.data={name:place.name,address:place.formatted_address||'',lat,lng};
        const dow=new Date().getDay();
        const wdIdx=dow===0?6:dow-1;
        const todayHours=place.opening_hours?.weekday_text?.[wdIdx]?.replace(/^[^:]+:\s*/,'')||'';
        let openStatus='';
        try{openStatus=place.opening_hours?.isOpen()?'פתוח עכשיו':'סגור עכשיו';}catch{}
        iw.setContent(buildIwContent({
          name:place.name, address:place.formatted_address||'', lat, lng,
          rating:place.rating, userRatingsTotal:place.user_ratings_total,
          photoUrl:place.photos?.[0]?.getUrl({maxWidth:300,maxHeight:110})||'',
          priceLevel:place.price_level, openStatus, todayHours,
          phone:place.formatted_phone_number||'', website:place.website||'',
          reviews:place.reviews||[],
        }));
      };

      const lat0=e.latLng.lat(), lng0=e.latLng.lng();
      const showNominatim=async()=>{
        try{
          const d=await nominatimReverse(lat0,lng0);
          const name=d.name||d.address?.tourism||d.address?.amenity||d.address?.leisure||d.address?.natural||d.address?.road||d.display_name?.split(',')[0]||'מקום על המפה';
          const addr=d.display_name||'';
          iwPlace.data={name,address:addr,lat:lat0,lng:lng0};
          iw.setContent(buildIwContent({name,address:addr,lat:lat0,lng:lng0}));
        }catch{
          iwPlace.data={name:'מקום על המפה',address:'',lat:lat0,lng:lng0};
          iw.setContent(buildIwContent({name:'מקום על המפה',address:'',lat:lat0,lng:lng0}));
        }
      };

      // ניסיון 1 — Places API פרטים מלאים
      svc.getDetails({
        placeId:e.placeId,
        fields:['name','formatted_address','geometry','rating','photos','opening_hours','reviews','website','formatted_phone_number','user_ratings_total','price_level']
      },(place,st)=>{
        if (st===window.google.maps.places.PlacesServiceStatus.OK&&place){ applyPlace(place); return; }
        // ניסיון 2 — Places API שדות בסיסיים
        svc.getDetails({placeId:e.placeId,fields:['name','formatted_address','geometry','rating','photos']},(p2,st2)=>{
          if (st2===window.google.maps.places.PlacesServiceStatus.OK&&p2){ applyPlace(p2); return; }
          // ניסיון 3 — Nominatim reverse geocoding (ללא API key)
          showNominatim();
        });
      });
    });
  },[ready]);

  // סמנים על המפה
  useEffect(()=>{
    if (!mapInst.current) return;
    markers.current.forEach(m=>m.setMap(null)); markers.current=[];
    if (!trip) return;
    trip.days.forEach((day,i)=>{
      if (!day.coordinates) return;
      const m=new window.google.maps.Marker({
        position:{lat:day.coordinates.lat,lng:day.coordinates.lng},
        map:mapInst.current,
        label:{text:String(i+1),color:'#fff',fontSize:'12px',fontWeight:'bold'},
        title:day.location||`יום ${i+1}`,
        icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:14,fillColor:'#4f8ef7',fillOpacity:1,strokeColor:'#fff',strokeWeight:2},
      });
      markers.current.push(m);
    });
    trip.interestBank.forEach(item=>{
      if (!item.lat) return;
      const m=new window.google.maps.Marker({
        position:{lat:item.lat,lng:item.lng},map:mapInst.current,title:item.name,
        icon:{path:window.google.maps.SymbolPath.BACKWARD_CLOSED_ARROW,scale:8,fillColor:'#f59e0b',fillOpacity:.9,strokeColor:'#fff',strokeWeight:1.5},
      });
      markers.current.push(m);
    });
  },[trip,ready]);

  if (!mapsKey) return (
    <div className="empty-state" style={{height:'100%',background:'var(--bg)'}}>
      <div className="emoji">🗺️</div>
      <div style={{fontWeight:600,color:'var(--text)'}}>מפות גוגל לא מוגדרות</div>
      <p>עבור להגדרות ⚙️ והזן מפתח API של גוגל מפות.</p>
    </div>
  );

  return <div style={{height:'100%',width:'100%',position:'relative',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'8px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',display:'flex',gap:6}}>
      <input id="map-search-input" className="input" placeholder="🔍 חפש מקום, עיר, אטרקציה… (Enter)" style={{fontSize:13,flex:1}}/>
      <button className="btn btn-secondary btn-sm" onClick={()=>window.__gmSearch?.()}>חפש</button>
    </div>
    <div ref={mapRef} style={{flex:1,width:'100%'}}/>
  </div>;
}

/* ══════════════════════════════════
   מזג אוויר
══════════════════════════════════ */
function Weather({coordinates,location}){
  const[w,setW]=useState(null),[loading,setL]=useState(false);
  useEffect(()=>{
    if (!coordinates?.lat) return; setL(true);
    fetchWeather(coordinates.lat,coordinates.lng).then(setW).catch(()=>{}).finally(()=>setL(false));
  },[coordinates?.lat,coordinates?.lng]);
  if (!coordinates?.lat||loading||!w) return null;
  const[icon,desc]=WMO[w.current_weather?.weathercode]||['🌡️','לא ידוע'];
  return <div className="weather-card" style={{marginBottom:12}}>
    <div style={{fontSize:11,fontWeight:600,opacity:.7,marginBottom:8,textTransform:'uppercase',letterSpacing:'.05em'}}>{location||'מזג אוויר'} — 3 ימים קרובים</div>
    <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
      <span style={{fontSize:32}}>{icon}</span>
      <div><div style={{fontSize:22,fontWeight:700}}>{Math.round(w.current_weather?.temperature)}°C</div><div style={{fontSize:12,opacity:.8}}>{desc}</div></div>
    </div>
    <div style={{display:'flex',gap:8}}>
      {(w.daily?.time||[]).slice(0,3).map((date,i)=>{
        const[di]=WMO[w.daily.weathercode[i]]||['🌡️'];
        return <div key={date} style={{flex:1,background:'rgba(255,255,255,.1)',borderRadius:8,padding:'6px 8px',textAlign:'center'}}>
          <div style={{fontSize:10,opacity:.7,marginBottom:2}}>{new Date(date).toLocaleDateString('he-IL',{weekday:'short'})}</div>
          <div style={{fontSize:16}}>{di}</div>
          <div style={{fontSize:11,fontWeight:600}}>{Math.round(w.daily.temperature_2m_max[i])}°</div>
          <div style={{fontSize:10,opacity:.6}}>{Math.round(w.daily.temperature_2m_min[i])}°</div>
        </div>;
      })}
    </div>
  </div>;
}

/* ══════════════════════════════════
   מודל עריכת בלוק
══════════════════════════════════ */
function BlockModal({block,onSave,onClose,onDelete}){
  const[b,setB]=useState({...block});
  const upd=(k,v)=>setB(p=>({...p,[k]:v}));
  return <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal">
      <div className="modal-header">
        <span style={{fontWeight:700,fontSize:15}}>{BLOCK_EMOJI[b.type]} עריכת בלוק</span>
        <button className="btn btn-secondary btn-icon btn-sm" onClick={onClose}>✕</button>
      </div>
      <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:14}}>
        <div><label className="label">סוג</label>
          <select className="input" value={b.type} onChange={e=>upd('type',e.target.value)}>
            {BLOCK_TYPES.map(t=><option key={t} value={t}>{BLOCK_EMOJI[t]} {BLOCK_HE[t]}</option>)}
          </select></div>
        <div><label className="label">כותרת</label>
          <input className="input" value={b.title} onChange={e=>upd('title',e.target.value)} placeholder="למשל: נסיעה לפירנצה" autoFocus/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><label className="label">שעת התחלה</label>
            <input className="input" type="time" value={b.startTime} onChange={e=>upd('startTime',e.target.value)}/></div>
          <div><label className="label">משך (דקות)</label>
            <input className="input" type="number" min="5" step="5" value={b.durationMins} onChange={e=>upd('durationMins',parseInt(e.target.value)||0)}/></div>
        </div>
        <div><label className="label">מיקום</label>
          <input className="input" value={b.location} onChange={e=>upd('location',e.target.value)} placeholder="אופציונלי"/></div>
        <div><label className="label">עלות (₪)</label>
          <input className="input" type="number" min="0" step="1" value={b.cost} onChange={e=>upd('cost',parseFloat(e.target.value)||0)}/></div>
        <div><label className="label">הערות</label>
          <textarea className="input" value={b.notes} onChange={e=>upd('notes',e.target.value)} placeholder="הערות פרטיות…"/></div>
        <div><label className="label">דירוג הנאה</label><Stars value={b.rating} onChange={v=>upd('rating',v)}/></div>
        <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13}}>
          <input type="checkbox" checked={b.isCompleted} onChange={e=>upd('isCompleted',e.target.checked)} style={{accentColor:'var(--green)'}}/>
          סמן כהושלם
        </label>
      </div>
      <div className="modal-footer">
        {onDelete&&<button className="btn btn-danger btn-sm" onClick={onDelete}>🗑 מחק</button>}
        <div style={{flex:1}}/>
        <button className="btn btn-secondary btn-sm" onClick={onClose}>ביטול</button>
        <button className="btn btn-primary btn-sm" onClick={()=>{onSave(b);onClose();}}>שמור</button>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════
   בלוק בציר הזמן
══════════════════════════════════ */
function BlockItem({block,onEdit}){
  const end=addMins(block.startTime,block.durationMins);
  const col=BLOCK_COLOR[block.type]||'var(--text3)';
  return <div className="timeline-block">
    <div className="timeline-dot" style={{background:col}}>{BLOCK_EMOJI[block.type]}</div>
    <div className={`card block-${block.type}`} style={{flex:1,marginRight:4,cursor:'pointer',opacity:block.isCompleted?.6:1}} onClick={()=>onEdit(block)}>
      <div style={{padding:'10px 14px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
          <span style={{fontSize:11,fontWeight:700,color:col}}>{block.startTime}–{end}</span>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            {block.isCompleted&&<span className="chip chip-green" style={{fontSize:10,padding:'2px 7px'}}>✓ הושלם</span>}
            {block.rating>0&&<Stars value={block.rating} size={13}/>}
          </div>
        </div>
        <div style={{fontSize:13,fontWeight:600,color:'var(--text)',marginTop:2}}>{block.title||`(${BLOCK_HE[block.type]} ללא שם)`}</div>
        {block.location&&<div style={{fontSize:11,color:'var(--text3)',marginTop:1}}>📍 {block.location}</div>}
        {block.notes&&<div style={{fontSize:11,color:'var(--text2)',marginTop:4,fontStyle:'italic',lineHeight:1.5}}>{block.notes}</div>}
        <div style={{display:'flex',gap:10,marginTop:6,flexWrap:'wrap'}}>
          {block.durationMins>0&&<span style={{fontSize:11,color:'var(--text3)'}}>⏱ {block.durationMins} דקות</span>}
          {block.cost>0&&<span style={{fontSize:11,color:'var(--amber)'}}>💰 ₪{block.cost.toFixed(0)}</span>}
        </div>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════
   פאנל יום
══════════════════════════════════ */
function DayPanel({day,idx,onUpdate,onDelete}){
  const[open,setOpen]=useState(true),[editing,setEd]=useState(null);
  const updBlock=upd=>onUpdate({...day,blocks:day.blocks.map(b=>b.id===upd.id?upd:b)});
  const delBlock=id=>onUpdate({...day,blocks:day.blocks.filter(b=>b.id!==id)});
  const addBlock=type=>{
    const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    onUpdate({...day,blocks:[...day.blocks,defaultBlock(type,start)]});
  };
  const total=day.blocks.reduce((s,b)=>s+(b.cost||0),0);
  const done=day.blocks.filter(b=>b.isCompleted).length;
  const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));

  return <div className="card" style={{marginBottom:12,animation:'fadeIn .3s ease'}}>
    <div className="day-header" onClick={()=>setOpen(o=>!o)}>
      <span style={{fontSize:20}}>📅</span>
      <div style={{flex:1}}>
        <div style={{fontWeight:700,fontSize:14}}>יום {idx+1}{day.date?` — ${dateStr(day.date)}`:''}</div>
        {day.location&&<div style={{fontSize:11,color:'var(--text3)'}}>📍 {day.location}</div>}
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        {day.blocks.length>0&&<span className="chip chip-blue" style={{fontSize:10}}>{done}/{day.blocks.length}</span>}
        {total>0&&<span style={{fontSize:11,color:'var(--amber)'}}>₪{total.toFixed(0)}</span>}
        <span style={{color:'var(--text3)',fontSize:13}}>{open?'▼':'◀'}</span>
      </div>
    </div>

    {open&&<div style={{padding:'14px 16px'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:14}}>
        <div><label className="label">תאריך</label>
          <input className="input" type="date" value={day.date} onChange={e=>onUpdate({...day,date:e.target.value})}/></div>
        <div><label className="label">מיקום / אתר</label>
          <input className="input" value={day.location} onChange={e=>onUpdate({...day,location:e.target.value})} placeholder="עיר / אתר קמפינג"/></div>
      </div>

      <Weather coordinates={day.coordinates} location={day.location}/>

      <div className="time-indicator" style={{marginBottom:14}}>
        <span style={{fontSize:12,color:'var(--text2)'}}>⏰ שעה נוכחית:</span>
        <input type="time" value={day.currentTime||nowTime()} onChange={e=>onUpdate({...day,currentTime:e.target.value})}
          style={{background:'transparent',border:'none',color:'var(--accent)',fontWeight:700,fontSize:13,fontFamily:'Heebo,sans-serif',cursor:'pointer'}}/>
      </div>

      <div className="timeline">
        {sorted.length===0&&<div style={{padding:'12px 0',color:'var(--text3)',fontSize:13,textAlign:'center'}}>אין בלוקים עדיין — הוסף בלוק למטה</div>}
        {sorted.map(bl=><BlockItem key={bl.id} block={bl} onEdit={setEd}/>)}
      </div>

      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:12}}>
        {BLOCK_TYPES.map(t=>(
          <button key={t} className="btn btn-secondary btn-sm" onClick={()=>addBlock(t)}>{BLOCK_EMOJI[t]} הוסף {BLOCK_HE[t]}</button>
        ))}
      </div>

      <div style={{marginTop:14,display:'flex',flexDirection:'column',gap:10}}>
        <div><label className="label">הערות יומיות</label>
          <textarea className="input" rows={2} value={day.notes} onChange={e=>onUpdate({...day,notes:e.target.value})} placeholder="הערות להיום…"/></div>
        <div><label className="label">סיכום / יומן</label>
          <textarea className="input" rows={3} value={day.summary} onChange={e=>onUpdate({...day,summary:e.target.value})} placeholder="איך היה היום? כתוב את רשומת היומן שלך…"/></div>
      </div>
      <div style={{marginTop:12,display:'flex',justifyContent:'flex-start'}}>
        <button className="btn btn-danger btn-sm" onClick={onDelete}>🗑 מחק יום</button>
      </div>
    </div>}

    {editing&&<BlockModal block={editing} onSave={updBlock} onClose={()=>setEd(null)} onDelete={()=>{delBlock(editing.id);setEd(null);}}/>}
  </div>;
}

function BankItem({item,days,onAddToDay,onDelete,onLocate}){
  const[selDay,setSelDay]=useState('');
  return <div className="interest-item" style={{marginBottom:8,flexDirection:'column',alignItems:'stretch',gap:8}}>
    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:600,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
        {item.address&&<div style={{fontSize:11,color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.address}</div>}
      </div>
      {item.lat&&onLocate&&(
        <button className="btn btn-secondary btn-icon btn-sm" title="הצג במפה"
          onClick={()=>onLocate(item.lat,item.lng)}>📍</button>
      )}
      <button className="btn btn-danger btn-icon btn-sm" onClick={onDelete} title="הסר">✕</button>
    </div>
    <div style={{display:'flex',gap:5}}>
      <select
        value={selDay}
        onChange={e=>setSelDay(e.target.value)}
        style={{flex:1,background:'var(--bg2)',border:'1px solid var(--border)',color:'var(--text)',borderRadius:7,padding:'5px 8px',fontSize:11,fontFamily:'Heebo,sans-serif',direction:'rtl'}}
      >
        <option value="">➕ בחר יום להוסיף...</option>
        {days.map((d,i)=><option key={d.id} value={d.id}>יום {i+1}{d.location?' — '+d.location:''}</option>)}
      </select>
      <button
        className="btn btn-primary btn-sm"
        disabled={!selDay}
        onClick={()=>{if(selDay){onAddToDay(selDay,item);setSelDay('');}}}
        style={{opacity:selDay?1:0.4,flexShrink:0}}
      >הוסף</button>
    </div>
  </div>;
}

function TimelineTab({trip,onUpdate,onLocate}){
  const[showBank,setShowBank]=useState(true);
  const[showTakeout,setShowTakeout]=useState(false);
  const takeoutRef=useRef(null);

  const updDay=upd=>onUpdate({...trip,days:trip.days.map(d=>d.id===upd.id?upd:d)});
  const addDay=()=>{
    const last=trip.days[trip.days.length-1];
    let nd='';
    if (last?.date){const d=new Date(last.date);d.setDate(d.getDate()+1);nd=d.toISOString().slice(0,10);}
    onUpdate({...trip,days:[...trip.days,defaultDay(nd)]});
  };
  const delDay=id=>onUpdate({...trip,days:trip.days.filter(d=>d.id!==id)});
  const addToBank=item=>onUpdate({...trip,interestBank:[...trip.interestBank,{...item,id:uid()}]});
  const delBank=id=>onUpdate({...trip,interestBank:trip.interestBank.filter(i=>i.id!==id)});

  // הוספת פריט מהבנק ישירות ליום ספציפי
  const addItemToDay=(dayId,item)=>{
    const day=trip.days.find(d=>d.id===dayId);
    if (!day) return;
    const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    const newBlock=defaultBlock('activity',start);
    newBlock.title=item.name;
    newBlock.location=item.address||'';
    updDay({...day,blocks:[...day.blocks,newBlock]});
    toast(`"${item.name}" נוסף ליום`,'success');
  };

  // ייבוא Google Takeout
  const importTakeout=file=>{
    const r=new FileReader();
    r.onload=e=>{
      try {
        const data=JSON.parse(e.target.result);
        // תמיכה בפורמט Saved Places של גוגל טייקאוט
        const features=data.features||data.geometry?.geometries||[];
        const items=features.map(f=>{
          const name=f.properties?.Title||f.properties?.name||'מקום ללא שם';
          const addr=f.properties?.['Google Maps URL']||f.properties?.address||'';
          const coords=f.geometry?.coordinates;
          return {id:uid(),name,address:addr,lat:coords?coords[1]:null,lng:coords?coords[0]:null};
        }).filter(i=>i.name);
        if (!items.length){toast('לא נמצאו מקומות בקובץ','error');return;}
        onUpdate({...trip,interestBank:[...trip.interestBank,...items]});
        toast(`יובאו ${items.length} מקומות מגוגל טייקאוט ✓`,'success');
        setShowTakeout(false);
      } catch {toast('שגיאה בקריאת הקובץ — וודא שזה קובץ GeoJSON מגוגל טייקאוט','error');}
    };
    r.readAsText(file);
  };

  return <div style={{display:'flex',height:'100%',overflow:'hidden'}}>
    <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
        <span style={{fontWeight:700,fontSize:15}}>🗓 לוח זמנים</span>
        <button className="btn btn-primary btn-sm" onClick={addDay}>+ הוסף יום</button>
        <div style={{flex:1}}/>
        <button className="btn btn-secondary btn-sm" onClick={()=>setShowBank(b=>!b)}>
          🌟 {showBank?'הסתר':'הצג'} בנק אטרקציות
        </button>
      </div>
      <div className="scroll-y flex-1" style={{padding:'16px'}}>
        {trip.days.length===0?(
          <div className="empty-state">
            <div className="emoji">🗓️</div>
            <div style={{fontWeight:600,color:'var(--text)'}}>אין ימים עדיין</div>
            <p>לחץ "+ הוסף יום" כדי להתחיל לבנות את המסלול.</p>
            <button className="btn btn-primary" onClick={addDay}>+ הוסף יום</button>
          </div>
        ):trip.days.map((day,i)=>(
          <DayPanel key={day.id} day={day} idx={i} onUpdate={updDay} onDelete={()=>delDay(day.id)}/>
        ))}
      </div>
    </div>

    {showBank&&<div className="sidebar-panel">
      <div style={{padding:'12px 14px',borderBottom:'1px solid var(--border)',fontWeight:700,fontSize:13,display:'flex',alignItems:'center',gap:8}}>
        🌟 בנק אטרקציות <span className="chip chip-blue" style={{fontSize:10}}>{trip.interestBank.length}</span>
      </div>
      <div className="scroll-y flex-1" style={{padding:'10px'}}>
        {trip.interestBank.length===0?(
          <div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'20px 8px',lineHeight:1.8}}>
            לחץ על כל אטרקציה במפה גוגל ובחר "הוסף לבנק האטרקציות".<br/>
            או ייבא מקומות מ-Google Takeout.
          </div>
        ):trip.interestBank.map(item=>(
          <BankItem key={item.id} item={item} days={trip.days} onAddToDay={addItemToDay} onDelete={()=>delBank(item.id)} onLocate={onLocate}/>
        ))}
      </div>
      <div style={{padding:'10px 12px',borderTop:'1px solid var(--border)',display:'flex',flexDirection:'column',gap:6}}>
        <button className="btn btn-secondary btn-sm" style={{width:'100%'}} onClick={()=>{const n=prompt('שם המקום:');if(n)addToBank({name:n,address:'',id:uid()});}}>
          + הוסף ידנית
        </button>
        <button className="btn btn-amber btn-sm" style={{width:'100%'}} onClick={()=>setShowTakeout(true)}>
          ⭐ ייבא מ-Google Takeout
        </button>
      </div>
    </div>}

    {showTakeout&&<div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowTakeout(false)}>
      <div className="modal">
        <div className="modal-header">
          <span style={{fontWeight:700}}>⭐ ייבוא מועדפים מגוגל מפות</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>setShowTakeout(false)}>✕</button>
        </div>
        <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:14}}>
          <div style={{background:'var(--bg3)',borderRadius:10,padding:14,fontSize:13,lineHeight:1.8,color:'var(--text2)'}}>
            <strong style={{color:'var(--text)'}}>איך מייצאים כוכבים מגוגל מפות:</strong><br/>
            1. עבור ל-<a href="https://takeout.google.com" target="_blank" rel="noreferrer" style={{color:'var(--accent)'}}>takeout.google.com</a><br/>
            2. בחר רק <strong>"מפות (מקומות שלי)"</strong><br/>
            3. הורד את הקובץ → פתח את התיקייה<br/>
            4. חפש קובץ בשם <strong>"Saved Places.json"</strong><br/>
            5. העלה אותו כאן ↓
          </div>
          <div style={{border:'2px dashed var(--border)',borderRadius:10,padding:24,textAlign:'center',cursor:'pointer'}}
            onClick={()=>takeoutRef.current?.click()}
            onDragOver={e=>e.preventDefault()}
            onDrop={e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)importTakeout(f);}}>
            <div style={{fontSize:32,marginBottom:8}}>📂</div>
            <div style={{fontSize:13,color:'var(--text2)'}}>לחץ כאן או גרור את "Saved Places.json"</div>
          </div>
          <input ref={takeoutRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>e.target.files[0]&&importTakeout(e.target.files[0])}/>
        </div>
      </div>
    </div>}
  </div>;
}

function ExpensesTab({trip,onUpdate}){
  const[form,setForm]=useState({category:'דלק',amount:'',description:'',date:new Date().toISOString().slice(0,10)});
  const add=()=>{
    if (!form.amount||isNaN(parseFloat(form.amount))){toast('הזן סכום תקני','error');return;}
    onUpdate({...trip,expenses:[...trip.expenses,{id:uid(),...form,amount:parseFloat(form.amount)}]});
    setForm(f=>({...f,amount:'',description:''})); toast('הוצאה נוספה','success');
  };
  const del=id=>onUpdate({...trip,expenses:trip.expenses.filter(e=>e.id!==id)});
  const byCat=EXPENSE_CATS.reduce((a,c)=>{a[c]=trip.expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0);return a;},{});
  const total=trip.expenses.reduce((s,e)=>s+e.amount,0);

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
        <span style={{fontWeight:700,fontSize:15}}>💰 מעקב הוצאות</span>
        <span style={{fontFamily:'Heebo,sans-serif',fontSize:22,fontWeight:800,color:'var(--accent)',marginRight:'auto'}}>
          סה"כ: ₪{total.toFixed(0)}
        </span>
      </div>
      {total>0&&<>
        <div style={{display:'flex',borderRadius:6,overflow:'hidden',height:10,marginBottom:8}}>
          {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
            <div key={c} style={{flex:byCat[c]/total,background:CAT_COLORS[c]}} title={`${c}: ₪${byCat[c].toFixed(0)}`}/>
          ))}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
            <span key={c} style={{fontSize:11,color:CAT_COLORS[c]}}>● {c}: ₪{byCat[c].toFixed(0)}</span>
          ))}
        </div>
      </>}
    </div>

    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 130px',gap:8,marginBottom:8}}>
        <div><label className="label">קטגוריה</label>
          <select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="label">תיאור</label>
          <input className="input" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="אופציונלי…" onKeyDown={e=>e.key==='Enter'&&add()}/></div>
        <div><label className="label">תאריך</label>
          <input className="input" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
        <div style={{flex:1}}><label className="label">סכום (₪)</label>
          <input className="input" type="number" min="0" step="1" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0" onKeyDown={e=>e.key==='Enter'&&add()}/></div>
        <button className="btn btn-primary" onClick={add}>+ הוסף</button>
      </div>
    </div>

    <div className="scroll-y flex-1">
      {trip.expenses.length===0?(
        <div className="empty-state"><div className="emoji">💸</div><p>אין הוצאות עדיין. התחל לרשום הוצאות למעלה.</p></div>
      ):[...trip.expenses].reverse().map(ex=>(
        <div key={ex.id} className="expense-row">
          <div style={{width:10,height:10,borderRadius:'50%',background:CAT_COLORS[ex.category]||'#888',flexShrink:0}}/>
          <span className="chip" style={{background:(CAT_COLORS[ex.category]||'#888')+'22',color:CAT_COLORS[ex.category]||'#888',fontSize:11}}>{ex.category}</span>
          <div style={{flex:1,fontSize:13}}>{ex.description||ex.category}<span style={{color:'var(--text3)',fontSize:11,marginRight:8}}>{ex.date}</span></div>
          <span style={{fontWeight:700,fontSize:14}}>₪{ex.amount.toFixed(0)}</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>del(ex.id)}>✕</button>
        </div>
      ))}
    </div>
  </div>;
}
