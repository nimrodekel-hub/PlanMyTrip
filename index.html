function ExpensesTab({trip,onUpdate}){
  const[form,setForm]=useState({category:'דלק',amount:'',description:'',date:new Date().toISOString().slice(0,10)});
  const add=()=>{
    if (!form.amount||isNaN(parseFloat(form.amount))){toast('הזן סכום תקני','error');return;}
    onUpdate({...trip,expenses:[...trip.expenses,{id:uid(),...form,amount:parseFloat(form.amount)}]});
    setForm(f=>({...f,amount:'',description:''})); toast('הוצאה נוספה','success');
  };
  const del=id=>onUpdate({...trip,expenses:trip.expenses.filter(e=>e.id!==id)});
  const byCat=EXPENSE_CATS.reduce((a,c)=>{a[c]=trip.expenses.filter(e=>e.category===c).reduce((s,e)=>s+e.amount,0);return a;},{});
  const total=trip.expenses.reduce((s,e)=>s+e.amount,0);

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:10}}>
        <span style={{fontWeight:700,fontSize:15}}>💰 מעקב הוצאות</span>
        <span style={{fontFamily:'Heebo,sans-serif',fontSize:22,fontWeight:800,color:'var(--accent)',marginRight:'auto'}}>
          סה"כ: ₪{total.toFixed(0)}
        </span>
      </div>
      {total>0&&<>
        <div style={{display:'flex',borderRadius:6,overflow:'hidden',height:10,marginBottom:8}}>
          {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
            <div key={c} style={{flex:byCat[c]/total,background:CAT_COLORS[c]}} title={`${c}: ₪${byCat[c].toFixed(0)}`}/>
          ))}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {EXPENSE_CATS.filter(c=>byCat[c]>0).map(c=>(
            <span key={c} style={{fontSize:11,color:CAT_COLORS[c]}}>● {c}: ₪{byCat[c].toFixed(0)}</span>
          ))}
        </div>
      </>}
    </div>

    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 130px',gap:8,marginBottom:8}}>
        <div><label className="label">קטגוריה</label>
          <select className="input" value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value}))}>
            {EXPENSE_CATS.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="label">תיאור</label>
          <input className="input" value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} placeholder="אופציונלי…" onKeyDown={e=>e.key==='Enter'&&add()}/></div>
        <div><label className="label">תאריך</label>
          <input className="input" type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/></div>
      </div>
      <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
        <div style={{flex:1}}><label className="label">סכום (₪)</label>
          <input className="input" type="number" min="0" step="1" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))} placeholder="0" onKeyDown={e=>e.key==='Enter'&&add()}/></div>
        <button className="btn btn-primary" onClick={add}>+ הוסף</button>
      </div>
    </div>

    <div className="scroll-y flex-1">
      {trip.expenses.length===0?(
        <div className="empty-state"><div className="emoji">💸</div><p>אין הוצאות עדיין. התחל לרשום הוצאות למעלה.</p></div>
      ):[...trip.expenses].reverse().map(ex=>(
        <div key={ex.id} className="expense-row">
          <div style={{width:10,height:10,borderRadius:'50%',background:CAT_COLORS[ex.category]||'#888',flexShrink:0}}/>
          <span className="chip" style={{background:(CAT_COLORS[ex.category]||'#888')+'22',color:CAT_COLORS[ex.category]||'#888',fontSize:11}}>{ex.category}</span>
          <div style={{flex:1,fontSize:13}}>{ex.description||ex.category}<span style={{color:'var(--text3)',fontSize:11,marginRight:8}}>{ex.date}</span></div>
          <span style={{fontWeight:700,fontSize:14}}>₪{ex.amount.toFixed(0)}</span>
          <button className="btn btn-secondary btn-icon btn-sm" onClick={()=>del(ex.id)}>✕</button>
        </div>
      ))}
    </div>
  </div>;
}

/* ══════════════════════════════════
   רשימת תיוג (ציוד / קניות)
══════════════════════════════════ */
function Checklist({title,emoji,items,onUpdate}){
  const[text,setText]=useState(''),[cat,setCat]=useState('כללי');
  const add=()=>{const t=text.trim();if(!t)return;onUpdate([...items,{id:uid(),text:t,done:false,category:cat||'כללי'}]);setText('');};
  const tog=id=>onUpdate(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const del=id=>onUpdate(items.filter(i=>i.id!==id));
  const done=items.filter(i=>i.done).length;
  const cats=[...new Set(items.map(i=>i.category||'כללי'))];
  const grouped=items.reduce((a,i)=>{const c=i.category||'כללי';if(!a[c])a[c]=[];a[c].push(i);return a;},{});

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:15}}>{emoji} {title}</span>
      <span className="chip chip-green" style={{fontSize:11}}>{done}/{items.length} הושלמו</span>
      {items.length>0&&<div className="progress" style={{flex:1}}><div className="progress-fill" style={{width:`${items.length?(done/items.length)*100:0}%`,background:'var(--green)'}}/></div>}
      <button className="btn btn-danger btn-sm" onClick={()=>onUpdate(items.filter(i=>!i.done))}>נקה הושלמו</button>
    </div>
    <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',gap:8}}>
      <input className="input" value={text} onChange={e=>setText(e.target.value)} placeholder={`הוסף פריט ל${title}…`} onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:2}}/>
      <input className="input" value={cat} onChange={e=>setCat(e.target.value)} placeholder="קטגוריה" list={`cats-${title}`} style={{flex:1}}/>
      <datalist id={`cats-${title}`}>{cats.map(c=><option key={c} value={c}/>)}</datalist>
      <button className="btn btn-primary" onClick={add}>+</button>
    </div>
    <div className="scroll-y flex-1" style={{padding:'12px 16px'}}>
      {items.length===0?(
        <div className="empty-state"><div className="emoji">{emoji}</div><p>{title} ריקה. הוסף פריטים למעלה.</p></div>
      ):Object.entries(grouped).map(([c,citems])=>(
        <div key={c} style={{marginBottom:16}}>
          <div className="section-title">{c}</div>
          {citems.map(item=>(
            <div key={item.id} className={`list-item${item.done?' done':''}`}>
              <input type="checkbox" checked={item.done} onChange={()=>tog(item.id)} style={{cursor:'pointer',accentColor:'var(--accent)',flexShrink:0}}/>
              <span className="item-text" style={{flex:1,fontSize:13}}>{item.text}</span>
              <button className="btn btn-secondary btn-icon btn-sm" style={{opacity:.35,transition:'opacity .15s'}}
                onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=.35}
                onClick={()=>del(item.id)}>✕</button>
            </div>
          ))}
        </div>
      ))}
    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית מסמכים
══════════════════════════════════ */
function DocsTab({trip,onUpdate,settings}){
  const[busy,setBusy]=useState(false);
  const fileRef=useRef(null);
  const hasFb=!!(settings.firebaseUrl&&settings.syncKey);
  const MAX_BYTES=8*1024*1024; // 8MB — Firebase REST practical limit
  const WARN_BYTES=3*1024*1024; // 3MB — אזהרה
  const fmtSize=b=>b>=1024*1024?`${(b/1024/1024).toFixed(1)}MB`:b>=1024?`${Math.round(b/1024)}KB`:`${b}B`;
  const icon=t=>t?.includes('pdf')?'📄':t?.startsWith('image')?'🖼️':t?.includes('word')||t?.includes('document')?'📝':t?.includes('sheet')||t?.includes('excel')?'📊':'📎';

  const upload=async file=>{
    if(file.size>MAX_BYTES){
      toast(`הקובץ גדול מדי (${fmtSize(file.size)}) — המגבלה היא ${fmtSize(MAX_BYTES)} לקובץ`,'error');
      return;
    }
    setBusy(true);
    try{
      const url=await new Promise((res,rej)=>{
        const r=new FileReader();
        r.onload=()=>res(r.result);
        r.onerror=rej;
        r.readAsDataURL(file);
      });
      const doc={id:uid(),name:file.name,type:file.type,size:file.size,
        url,savedAt:new Date().toISOString(),
        source:hasFb?'firebase':'local'};
      onUpdate({...trip,documents:[...trip.documents,doc]});
      if(file.size>WARN_BYTES)
        toast(`"${file.name}" נשמר (${fmtSize(file.size)}) — קובץ גדול עלול להאט סנכרון`,'info');
      else
        toast(`"${file.name}" ${hasFb?'נשמר ויסונכרן ל-Firebase ✓':'נשמר מקומית — הגדר Firebase לסנכרון'}`,'success');
    }catch(e){toast(`שגיאה בשמירה: ${e.message}`,'error');}
    finally{setBusy(false);}
  };

  const totalSize=trip.documents.reduce((s,d)=>s+(d.size||0),0);
  const srcLabel=doc=>doc.source==='github'?'☁️ גיטהאב':hasFb?'☁️ Firebase':'💾 מקומי';

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    {/* כותרת */}
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:15}}>📁 מסמכים</span>
      <span className="chip chip-blue" style={{fontSize:11}}>{trip.documents.length} קבצים</span>
      {trip.documents.length>0&&<span style={{fontSize:11,color:'var(--text3)'}}>{fmtSize(totalSize)} סה"כ</span>}
      <div style={{flex:1}}/>
      <button className="btn btn-primary" onClick={()=>fileRef.current?.click()} disabled={busy}>
        {busy?'⏳ שומר…':'+ העלה קובץ'}
      </button>
      <input ref={fileRef} type="file" style={{display:'none'}} multiple
        onChange={e=>{Array.from(e.target.files).forEach(upload);e.target.value='';}}/>
    </div>

    {/* תוכן */}
    <div className="scroll-y flex-1" style={{padding:16}}
      onDragOver={e=>e.preventDefault()}
      onDrop={e=>{e.preventDefault();Array.from(e.dataTransfer.files).forEach(upload);}}>
      {trip.documents.length===0?(
        <div className="empty-state">
          <div className="emoji">📁</div>
          <div style={{fontWeight:600,color:'var(--text)'}}>אין מסמכים עדיין</div>
          <p style={{lineHeight:1.9}}>
            העלה דרכונים, ביטוח, כרטיסים, מפות קמפינג ועוד.<br/>
            {hasFb
              ?<><strong style={{color:'var(--green)'}}>☁️ Firebase מחובר</strong> — הקבצים יסונכרנו אוטומטית לכל המכשירים.</>
              :<><strong style={{color:'var(--amber)'}}>💾 אחסון מקומי</strong> — עבור ל-🔗 חיבוריות כדי לסנכרן.</>}
            <br/><span style={{fontSize:11,color:'var(--text3)'}}>מגבלה: עד {fmtSize(MAX_BYTES)} לקובץ</span>
          </p>
          <button className="btn btn-primary" onClick={()=>fileRef.current?.click()}>+ העלה קובץ</button>
        </div>
      ):(
        <div className="doc-grid">
          {trip.documents.map(doc=>(
            <div key={doc.id} className="doc-item">
              <button onClick={()=>onUpdate({...trip,documents:trip.documents.filter(d=>d.id!==doc.id)})}
                style={{position:'absolute',top:6,left:6,background:'var(--red)',color:'#fff',border:'none',
                  borderRadius:6,width:20,height:20,fontSize:10,cursor:'pointer',
                  display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
              {doc.type?.startsWith('image/')&&doc.url
                ?<img src={doc.url} alt={doc.name} style={{width:'100%',height:80,objectFit:'cover',borderRadius:6,marginBottom:6}}/>
                :<div style={{fontSize:36,marginBottom:8}}>{icon(doc.type)}</div>}
              <div style={{fontSize:11,color:'var(--text2)',wordBreak:'break-word',lineHeight:1.4}}>{doc.name}</div>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:3,display:'flex',gap:6,flexWrap:'wrap'}}>
                <span>{srcLabel(doc)}</span>
                {doc.size>0&&<span>{fmtSize(doc.size)}</span>}
                {doc.savedAt&&<span>{new Date(doc.savedAt).toLocaleDateString('he-IL')}</span>}
              </div>
              {doc.url&&(
                doc.source==='github'
                  ?<a href={doc.url} target="_blank" rel="noreferrer" style={{fontSize:10,color:'var(--accent)',textDecoration:'none',display:'block',marginTop:4}}>פתח ↗</a>
                  :<a href={doc.url} download={doc.name} style={{fontSize:10,color:'var(--accent)',textDecoration:'none',display:'block',marginTop:4}}>הורד ↓</a>
              )}
            </div>
          ))}
        </div>
      )}
    </div>

    {/* פס מידע תחתון */}
    <div style={{padding:'7px 16px',borderTop:'1px solid var(--border)',background:'var(--bg2)',
      fontSize:11,color:'var(--text3)',lineHeight:1.7}}>
      {hasFb
        ?<>☁️ <strong>Firebase</strong> — הקבצים שמורים בתוך ה-JSON ומסונכרנים אוטומטית לכל המכשירים.
          &nbsp;מגבלה: עד {fmtSize(MAX_BYTES)} לקובץ. הנתונים <strong>לא נמחקים לעולם</strong> — רק הגישה יכולה להיחסם אם Rules מוגדרים שגוי.</>
        :<>💾 <strong>מקומי</strong> — הקבצים שמורים בדפדפן זה בלבד ולא מסונכרנים.
          &nbsp;<span style={{color:'var(--amber)'}}>עבור ל-🔗 חיבוריות לסנכרון.</span></>}
    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית הערות ומזג אוויר
══════════════════════════════════ */
function NotesTab({trip,onUpdate}){
  const[newNote,setNewNote]=useState('');
  const[weatherData,setWeatherData]=useState(null),[wLoading,setWLoading]=useState(false),[wLabel,setWLabel]=useState('');
  const[cityInput,setCityInput]=useState('');
  const[newLinkUrl,setNewLinkUrl]=useState('');
  const[newLinkName,setNewLinkName]=useState('');

  const loadWeather=(lat,lng,label)=>{
    setWLoading(true);
    fetchWeather(lat,lng)
      .then(w=>{setWeatherData(w);setWLabel(label);})
      .catch(()=>toast('שגיאה בטעינת מזג האוויר','error'))
      .finally(()=>setWLoading(false));
  };

  const fetchByCity=async()=>{
    const q=cityInput.trim(); if(!q) return;
    setWLoading(true);
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=he&format=json`);
      const d=await r.json();
      if(!d.results?.length){toast('עיר לא נמצאה — נסה שוב','error');setWLoading(false);return;}
      const{latitude:lat,longitude:lng,name,country}=d.results[0];
      loadWeather(lat,lng,`${name}, ${country}`);
    }catch{toast('שגיאה בחיפוש המיקום','error');setWLoading(false);}
  };

  const fetchByGPS=()=>{
    if(!navigator.geolocation){toast('הדפדפן לא תומך במיקום','error');return;}
    setWLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos=>loadWeather(pos.coords.latitude,pos.coords.longitude,'המיקום הנוכחי שלי'),
      ()=>{toast('לא ניתן לגשת למיקום — אשר הרשאה בדפדפן','error');setWLoading(false);}
    );
  };

  const addNote=()=>{
    const t=newNote.trim(); if(!t) return;
    onUpdate({...trip,quickNotes:[...(trip.quickNotes||[]),{id:uid(),text:t,createdAt:new Date().toISOString()}]});
    setNewNote('');
  };
  const delNote=id=>onUpdate({...trip,quickNotes:(trip.quickNotes||[]).filter(n=>n.id!==id)});

  const addLink=()=>{
    const url=newLinkUrl.trim(); if(!url) return;
    const name=newLinkName.trim();
    onUpdate({...trip,links:[...(trip.links||[]),{id:uid(),url,name}]});
    setNewLinkUrl('');setNewLinkName('');
  };
  const delLink=id=>onUpdate({...trip,links:(trip.links||[]).filter(l=>l.id!==id)});

  const[wIcon,wDesc]=weatherData?WMO[weatherData.current_weather?.weathercode]||['🌡️','לא ידוע']:[];

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:700,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      {/* מזג אוויר לפי איזור */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🌤️ מזג אוויר לפי איזור</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:6}}>
            <input className="input" style={{flex:1}} value={cityInput} onChange={e=>setCityInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&fetchByCity()}
              placeholder="הקלד עיר או אזור — למשל: אילת, פריז, כנרת…"/>
            <button className="btn btn-primary btn-sm" onClick={fetchByCity} disabled={wLoading||!cityInput.trim()}>חפש</button>
            <button className="btn btn-secondary btn-sm" onClick={fetchByGPS} disabled={wLoading} title="מיקום נוכחי">📍</button>
          </div>
          {wLoading&&<div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:'8px 0'}}>⏳ טוען מזג אוויר...</div>}
          {weatherData&&!wLoading&&(
            <div>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>📍 {wLabel}</div>
              <div className="weather-card" style={{marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                  <span style={{fontSize:40}}>{wIcon}</span>
                  <div>
                    <div style={{fontSize:26,fontWeight:700}}>{Math.round(weatherData.current_weather?.temperature)}°C</div>

function SettingsTab({settings,onSettings,trips,activeTrip,onNewTrip,onLoadTrip,onDeleteTrip,onPush,onPull,ghBusy,genKey}){
  const[showForm,setShowForm]=useState(false);
  const[newName,setNewName]=useState('');
  const[renameId,setRenameId]=useState(null);
  const[renameName,setRenameName]=useState('');
  const createTrip=()=>{
    const n=newName.trim()||'טיול חדש';
    onNewTrip(n);
    setNewName(''); setShowForm(false);
  };
  const startRename=(t)=>{setRenameId(t.id);setRenameName(t.name);};
  const commitRename=()=>{
    const t=trips.find(x=>x.id===renameId); if(!t) return;
    if(renameName.trim()) onLoadTrip(null,{...t,name:renameName.trim()});
    setRenameId(null);
  };
  // שכפול מלא — כל התוכן כולל בנק, מסמכים, לוז, הוצאות
  const duplicateFull=(t)=>{
    onNewTrip(t.name+' — עותק',{
      ...t,
      days:(t.days||[]).map(d=>({...d,id:uid(),blocks:(d.blocks||[]).map(b=>({...b,id:uid()}))})),
      interestBank:(t.interestBank||[]).map(i=>({...i,id:uid()})),
      expenses:(t.expenses||[]).map(e=>({...e,id:uid()})),
      documents:(t.documents||[]).map(d=>({...d,id:uid()})),
    });
  };
  // שכפול מצומצם — בנק האטרקציות בלבד, ללא לוז/מסמכים/הוצאות
  const duplicateStructure=(t)=>{
    const base=defaultTrip(t.name+' — בנק');
    onNewTrip(base.name,{
      ...base,
      interestBank:(t.interestBank||[]).map(i=>({...i,id:uid()})),
    });
  };

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:640,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>✈️ ניהול טיולים</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:12}}>
          {!showForm?(
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={()=>{setNewName('');setShowForm(true);}}>+ טיול חדש</button>
              {activeTrip&&<button className="btn btn-secondary" onClick={()=>{setNewName(activeTrip.name+' עותק');setShowForm(true);}}>📋 שמור כעותק</button>}
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:8,background:'var(--surface2)',borderRadius:10,padding:'12px'}}>
              <label className="label">שם הטיול החדש</label>
              <div style={{display:'flex',gap:6}}>
                <input className="input" style={{flex:1}} value={newName} onChange={e=>setNewName(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')createTrip();if(e.key==='Escape'){setShowForm(false);setNewName('');}}}
                  placeholder="למשל: קיץ 2025 — אירופה" autoFocus/>
                <button className="btn btn-primary btn-sm" onClick={createTrip}>צור</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>{setShowForm(false);setNewName('');}}>ביטול</button>
              </div>
            </div>
          )}
          <div style={{fontSize:11,color:'var(--text3)',padding:'4px 2px',lineHeight:1.7}}>
            📋 שכפול מלא (בנק + לוז + מסמכים + הוצאות) &nbsp;|&nbsp; 📐 שכפול מבנה בלבד (ימים + לוז, ללא בנק/מסמכים/הוצאות)
          </div>
          {trips.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:8,background:t.id===activeTrip?.id?'rgba(79,142,247,.12)':'var(--surface2)'}}>
              {renameId===t.id?(
                <div style={{flex:1,display:'flex',gap:6}}>
                  <input className="input" style={{flex:1,fontSize:13}} value={renameName} autoFocus
                    onChange={e=>setRenameName(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Enter')commitRename();if(e.key==='Escape')setRenameId(null);}}/>
                  <button className="btn btn-primary btn-sm" onClick={commitRename}>✓</button>
                  <button className="btn btn-secondary btn-sm" onClick={()=>setRenameId(null)}>✕</button>
                </div>
              ):(
                <>
                  <div style={{flex:1,fontSize:13}}>
                    <div style={{fontWeight:600}}>{t.name}</div>
                    <div style={{fontSize:11,color:'var(--text3)'}}>{t.startDate||'—'} → {t.endDate||'—'} · {t.days.length} ימים · {t.expenses.length} הוצאות</div>
                  </div>
                  <button className="btn btn-secondary btn-sm" title="שנה שם" onClick={()=>startRename(t)}>✏️</button>
                  <button className="btn btn-secondary btn-sm" title="שכפול מלא — כל הבנק, הלוז, המסמכים וההוצאות" onClick={()=>duplicateFull(t)}>📋</button>
                  <button className="btn btn-secondary btn-sm" title="שכפול מצומצם — בנק האטרקציות בלבד, ללא לוז/מסמכים/הוצאות" onClick={()=>duplicateStructure(t)}>📐</button>
                  {t.id!==activeTrip?.id&&<button className="btn btn-secondary btn-sm" onClick={()=>onLoadTrip(t.id)}>טען</button>}
                  {t.id===activeTrip?.id&&<span className="chip chip-green" style={{fontSize:10}}>פעיל</span>}
                  <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm(`למחוק את "${t.name}"?`))onDeleteTrip(t.id);}}>🗑</button>
                </>
              )}
            </div>
          ))}
        </div>
      </div>

      {activeTrip&&<div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🚐 פרופיל רכב ופרטי טיול</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div><label className="label">שם הטיול</label>
            <input className="input" value={activeTrip.name||''} onChange={e=>onLoadTrip(null,{...activeTrip,name:e.target.value})} placeholder="למשל: חופשת קיץ 2025"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {[['name','שם הרכב'],['plate','לוחית רישוי'],['height','גובה (מ׳)'],['width','רוחב (מ׳)'],['weight','משקל (ק"ג)']].map(([k,lbl])=>(
              <div key={k}><label className="label">{lbl}</label>
                <input className="input" value={activeTrip.vehicle[k]||''} onChange={e=>onLoadTrip(null,{...activeTrip,vehicle:{...activeTrip.vehicle,[k]:e.target.value}})} placeholder={lbl}/></div>
            ))}
          </div>
          <div className="section-title" style={{marginTop:8}}>מים וקקי</div>
          {[['waterFillDate','waterLog','💧 תאריך מילוי מים'],['wasteEmptyDate','wasteLog','🪣 תאריך ריקון קקי']].map(([k,lk,lbl])=>{
            const logArr=activeTrip.vehicle[lk]||[];
            const saveDate=(newDate)=>{
              const oldDate=activeTrip.vehicle[k]||'';
              const newLog=newDate&&newDate!==oldDate?[...logArr,newDate]:logArr;
              onLoadTrip(null,{...activeTrip,vehicle:{...activeTrip.vehicle,[k]:newDate,[lk]:newLog}});
            };
            return <div key={k}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                <span style={{fontSize:12,color:'var(--text2)',flex:1}}>{lbl}</span>
                <input type="date" className="input" value={activeTrip.vehicle[k]||''} style={{width:150}}
                  onChange={e=>saveDate(e.target.value)}/>
                <button className="btn btn-secondary btn-sm" onClick={()=>saveDate(todayISO())}>היום</button>
              </div>
              {logArr.length>0&&<div style={{fontSize:10,color:'var(--text3)',paddingRight:4,marginBottom:6}}>
                היסטוריה: {[...logArr].reverse().slice(0,4).map(d=>new Date(d).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit',year:'2-digit'})).join(' ← ')}
              </div>}
            </div>;
          })}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:8}}>
            {[['startDate','תאריך תחילה'],['endDate','תאריך סיום']].map(([k,lbl])=>(
              <div key={k}><label className="label">{lbl}</label>
                <input className="input" type="date" value={activeTrip[k]||''} onChange={e=>onLoadTrip(null,{...activeTrip,[k]:e.target.value})}/></div>
            ))}
          </div>
        </div>
      </div>}

      {/* ── travel buffer setting ── */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>⚙️ הגדרות כלליות</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div>
            <label className="label">🚗 פקטור זמן נסיעה + התארגנות</label>
            <select className="input" style={{maxWidth:240,marginTop:4}}
              value={settings?.travelBuffer??1.2}
              onChange={e=>onSettings({...settings,travelBuffer:parseFloat(e.target.value)})}>
              <option value={1.0}>×1.0 — ללא תוספת</option>
              <option value={1.1}>×1.1 — +10%</option>
              <option value={1.2}>×1.2 — +20% (מומלץ)</option>
              <option value={1.3}>×1.3 — +30%</option>
              <option value={1.5}>×1.5 — +50%</option>
              <option value={2.0}>×2.0 — כפול</option>
            </select>
            <div style={{fontSize:12,color:'var(--text3)',marginTop:7,lineHeight:1.65}}>
              כפיל לזמן הנסיעה המחושב בלוח הזמנים — מוסיף זמן התארגנות אוטומטי.
              לדוגמה <b>×1.2</b> = נסיעה של 30 דק' תוצג כ-36 דק'.
              זמן הנסיעה מחושב בחינם דרך OpenStreetMap (OSRM) — ללא עלות וללא גוגל.
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>;
}

const FB_URL='https://planmytrip-de33c-default-rtdb.firebaseio.com';
const FB_RULES_URL='https://console.firebase.google.com/u/1/project/planmytrip-de33c/database/planmytrip-de33c-default-rtdb/rules';

function ConnectivityTab({settings,onSettings,onPush,onPull,ghBusy,syncStatus,onExport,onImport,isAdmin,onAdminLogin,onAdminLogout}){
  const[s,setS]=useState({...settings});
  const[copied,setCopied]=useState(false);
  const[testing,setTesting]=useState(false);
  const[testResult,setTestResult]=useState(null);
  const[gistSaving,setGistSaving]=useState(false);
  const[gistUrl,setGistUrl]=useState(()=>localStorage.getItem('planmytrip-admin-gist-url')||'');
  const[loginInput,setLoginInput]=useState('');
  const[loginError,setLoginError]=useState(false);
  const[savingToken,setSavingToken]=useState(false);
  const[tokenSyncMsg,setTokenSyncMsg]=useState(''); // הודעת מצב שמירת Token

  /* ── משיכת Token מ-Firebase בכניסה לחוצץ (אם אין Token מקומי) ── */
  useEffect(()=>{
    const fbUrl=settings.firebaseUrl;
    const syncKey=settings.syncKey;
    if(!fbUrl||!syncKey||settings.githubToken) return; // כבר יש Token — לא צריך לשלוף
    fbRead(fbUrl,syncKey)
      .then(data=>{
        if(data?.githubToken){
          const merged={...settings,githubToken:data.githubToken};
          onSettings(merged);
          setS(p=>({...p,githubToken:data.githubToken}));
          setTokenSyncMsg('✅ GitHub Token נטען אוטומטית מהענן');
          setTimeout(()=>setTokenSyncMsg(''),4000);
        }
      })
      .catch(()=>{});
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  /* ── שמירת Token וסנכרון לענן ── */
  const saveToken=async()=>{
    const tok=(s.githubToken||'').trim();
    const newS={...settings,...s,githubToken:tok};
    onSettings(newS); // שמור ב-localStorage דרך App state
    setS(p=>({...p,githubToken:tok}));
    const fbUrl=newS.firebaseUrl;
    const syncKey=newS.syncKey;
    if(!fbUrl||!syncKey){
      setTokenSyncMsg('✅ Token נשמר בדפדפן (אין Firebase — לא מסונכרן)');
      setTimeout(()=>setTokenSyncMsg(''),3000);
      return;
    }
    setSavingToken(true);
    setTokenSyncMsg('⏳ מסנכרן ל-Firebase...');
    try{
      const current=await fbRead(fbUrl,syncKey).catch(()=>({}));
      await fbWrite(fbUrl,syncKey,{...(current||{}),githubToken:tok});
      setTokenSyncMsg('✅ Token נשמר ומסונכרן לכל המכשירים');
      setTimeout(()=>setTokenSyncMsg(''),4000);
    }catch(e){
      setTokenSyncMsg('⚠️ נשמר מקומית, סנכרון Firebase נכשל: '+e.message);
      setTimeout(()=>setTokenSyncMsg(''),5000);
    }finally{setSavingToken(false);}
  };

  const doAdminLogin=()=>{
    const stored=localStorage.getItem('planmytrip-admin-code')||'';
    if(!stored){toast('לא הוגדר קוד אדמין','error');return;}
    if(loginInput===stored){setLoginError(false);setLoginInput('');onAdminLogin();}
    else{setLoginError(true);}
  };
  const upd=(k,v)=>setS(p=>({...p,[k]:v}));

  const backupToGist=async()=>{
    const tok=s.githubToken||settings.githubToken;
    if(!tok){toast('הגדר GitHub Token קודם (בעמודת GitHub)','error');return;}
    setGistSaving(true);
    const mkContent=()=>[
      'PlanMyTrip — גיבוי קוד אדמין',
      '================================',
      `קוד אדמין : ${adminCodeInput||_adminCode}`,
      `כתובת ניהול: ${currentAdminUrl||ADMIN_URL}`,
      '',
      `נשמר: ${new Date().toLocaleString('he-IL')}`,
      '',
      'שמור קובץ זה בסוד — אל תשתף אותו.',
    ].join('\n');
    const doFetch=async(gistId)=>{
      const url=gistId?`https://api.github.com/gists/${gistId}`:'https://api.github.com/gists';
      const r=await fetch(url,{method:gistId?'PATCH':'POST',
        headers:{Authorization:`token ${tok}`,'Content-Type':'application/json'},
        body:JSON.stringify({description:'PlanMyTrip Admin Backup',public:false,
          files:{'planmytrip-admin-backup.txt':{content:mkContent()}}})});
      if(!r.ok){
        if(r.status===404&&gistId){
          // Gist ישן נמחק — ניצור חדש אוטומטית
          localStorage.removeItem('planmytrip-admin-gist-id');
          localStorage.removeItem('planmytrip-admin-gist-url');
          setGistUrl('');
          return doFetch(null);
        }
        // GitHub מחזיר 404 (לא 403) כשחסר scope — זו התנהגות ידועה שלהם
        if(r.status===401||r.status===403||r.status===404)
          throw new Error('אין הרשאה ל-Gist. פתרון: ב-GitHub → Settings → Tokens → ערוך את ה-Token ← סמן גם את scope "gist" ← Save');
        throw new Error(`שגיאה ${r.status}`);
      }
      return r.json();
    };
    try{
      const d=await doFetch(localStorage.getItem('planmytrip-admin-gist-id'));
      localStorage.setItem('planmytrip-admin-gist-id',d.id);
      localStorage.setItem('planmytrip-admin-gist-url',d.html_url);
      setGistUrl(d.html_url);
      toast('קוד אדמין גובה ל-Gist פרטי ✓','success');
    }catch(e){toast(`שגיאה בגיבוי: ${e.message}`,'error');}
    setGistSaving(false);
  };

  /* ── קוד אדמין — מצב ושמירה ── */
  const[adminCodeInput,setAdminCodeInput]=useState(_adminCode);
  const[adminSaved,setAdminSaved]=useState(!!_adminCode);
  const[adminEditMode,setAdminEditMode]=useState(false);
  const[adminCurrentVerify,setAdminCurrentVerify]=useState('');
  const[adminNewCode,setAdminNewCode]=useState('');
  const currentAdminUrl=`${location.origin}${location.pathname}?admin=${encodeURIComponent(adminCodeInput||'')}`;

  const saveAdminCode=()=>{
    const code=(adminCodeInput||'').trim();
    if(!code){toast('הכנס קוד תקין','error');return;}
    localStorage.setItem('planmytrip-admin-code',code);
    setAdminSaved(true);
    onAdminLogin();
    toast('קוד אדמין נשמר ✓ — אתה במצב אדמין','success');
  };

  const changeAdminCode=()=>{
    const stored=localStorage.getItem('planmytrip-admin-code')||_adminCode;
    if(adminCurrentVerify!==stored){toast('קוד נוכחי שגוי ❌','error');return;}
    const nc=adminNewCode.trim();
    if(!nc){toast('הכנס קוד חדש','error');return;}
    localStorage.setItem('planmytrip-admin-code',nc);
    setAdminCodeInput(nc);
    setAdminSaved(true);
    setAdminEditMode(false);
    setAdminCurrentVerify('');
    setAdminNewCode('');
    toast('קוד אדמין עודכן ✓','success');
  };

  const effectiveKey=s.syncKey||settings.syncKey;
  const copyKey=()=>{navigator.clipboard?.writeText(effectiveKey||'').then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});};

  const testConnection=async()=>{
    if(!effectiveKey){setTestResult({ok:false,msg:'חסר מפתח סנכרון — צור מפתח'});return;}
    setTesting(true); setTestResult(null);
    try{
      const r=await fetch(`${FB_URL.replace(/\/$/,'')}/planmytrip/${effectiveKey}.json?_=${Date.now()}`);
      if(r.ok){
        const d=await r.json();
        const hasData=d?.trips?.length>0;
        setTestResult({ok:true,msg:hasData
          ?`✅ Firebase תקין — יש ${d.trips.length} טיולים שמורים (${d.savedAt?new Date(d.savedAt).toLocaleString('he-IL'):'תאריך לא ידוע'})`
          :'⚠️ Firebase נגיש אך ריק — יש ללחוץ "📤 שלח עכשיו" כדי להעלות את הנתונים'});
      }
      else{setTestResult({ok:false,msg:`❌ שגיאה ${r.status} — עדכן את ה-Rules (ראה למטה)`});}
    }catch(e){setTestResult({ok:false,msg:`❌ חיבור נכשל — ${e.message}`});}
    finally{setTesting(false);}
  };

  const saveAndSync=()=>{const newS={...s,firebaseUrl:FB_URL};onSettings(newS);setTimeout(()=>onPush(newS),300);};
  const save=()=>{onSettings({...s});toast('ההגדרות נשמרו ✓','success');};

  const statusColor=syncStatus==='synced'?'var(--green)':syncStatus==='syncing'?'var(--amber)':syncStatus==='error'?'var(--red)':'var(--text3)';
  const statusText=syncStatus==='synced'?'מסונכרן ✓':syncStatus==='syncing'?'מסנכרן...':syncStatus==='error'?'שגיאת סנכרון':'לא מסונכרן';

  return <div className="conn-view">

    {/* ══ HEADER — הסבר הוליסטי + דיאגרמה ══ */}
    <div className="conn-header">
      <div style={{display:'flex',alignItems:'flex-start',gap:14,marginBottom:12}}>
        <span style={{fontSize:28,lineHeight:1}}>🔗</span>
        <div style={{flex:1}}>
          <div style={{fontSize:17,fontWeight:800,marginBottom:2}}>חיבוריות</div>
          <div style={{fontSize:12,color:'var(--text2)',lineHeight:1.7}}>
            <strong>הסנכרון בין מכשירים פועל אוטומטית</strong> — ללא הרשמה, ללא הגדרות.{isAdmin&&<span style={{marginRight:6,fontSize:11,background:'rgba(139,92,246,.15)',color:'#a78bfa',padding:'1px 8px',borderRadius:10,fontWeight:700}}>🔐 מצב אדמין</span>}
          </div>
        </div>
      </div>

      {/* ── דיאגרמה ── */}
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:0,userSelect:'none'}}>
        <div style={{display:'flex',alignItems:'flex-end',gap:8,justifyContent:'center',width:'100%',maxWidth:400}}>

          {/* סנכרון */}
          <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
            <div style={{background:'rgba(79,142,247,0.1)',border:'1.5px solid rgba(79,142,247,0.4)',borderRadius:10,padding:'7px 10px',textAlign:'center',width:'100%'}}>
              <div style={{fontSize:18}}>☁️</div>
              <div style={{fontWeight:700,fontSize:11}}>סנכרון</div>
              <div style={{fontSize:10,color:'var(--text3)',lineHeight:1.4}}>שמירה אוטומטית<br/>בין מכשירים</div>
            </div>
            <div style={{fontSize:13,color:'var(--green)',fontWeight:700}}>⇅</div>
          </div>

          {/* App — מרכז */}
          <div style={{flexShrink:0,background:'var(--accent)',color:'#fff',borderRadius:12,padding:'10px 16px',textAlign:'center',minWidth:90,boxShadow:'0 2px 10px rgba(79,142,247,0.35)'}}>
            <div style={{fontSize:20}}>📱</div>
            <div style={{fontWeight:800,fontSize:12,marginTop:2}}>האפליקציה</div>
            <div style={{fontSize:10,opacity:.8,marginTop:1}}>PlanMyTrip</div>
          </div>

          {/* GitHub — מצב אדמין בלבד */}
          {isAdmin&&<div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
            <div style={{background:'rgba(88,96,176,0.1)',border:'1.5px solid rgba(88,96,176,0.35)',borderRadius:10,padding:'7px 10px',textAlign:'center',width:'100%'}}>
              <div style={{fontSize:18}}>🐙</div>
              <div style={{fontWeight:700,fontSize:11}}>GitHub</div>
              <div style={{fontSize:10,color:'var(--text3)',lineHeight:1.4}}>ייבוא רשימות<br/>מגוגל מפות</div>
            </div>
            <div style={{fontSize:13,color:s.githubToken?'var(--green)':'var(--text3)',fontWeight:700}}>↓</div>
          </div>}

        </div>
        {/* קו אופקי מחבר */}
        <div style={{width:'calc(100% - 90px - 16px)',maxWidth:380,height:1,background:'var(--border)',marginBottom:0}}/>
      </div>
    </div>

    {/* ══ כתובת ניהול — פס קבוע מעל העמודות ══ */}
    <div style={{padding:'0 16px 12px',borderBottom:'1px solid var(--border)'}}>
      <details style={{borderRadius:8,border:`1px solid ${isAdmin?'rgba(139,92,246,.5)':'var(--border)'}`,overflow:'hidden'}}>
        <summary style={{padding:'8px 14px',cursor:'pointer',fontWeight:700,fontSize:12,
          background:isAdmin?'rgba(139,92,246,.08)':'var(--surface2)',
          userSelect:'none',listStyle:'none',display:'flex',alignItems:'center',gap:8}}>
          🔐 כניסת אדמין
          {isAdmin
            ?<span style={{fontSize:10,background:'rgba(139,92,246,.2)',color:'#a78bfa',padding:'1px 8px',borderRadius:10,fontWeight:700}}>✓ פעיל</span>
            :<span style={{fontSize:10,color:'var(--text3)',fontWeight:400}}>לחץ לכניסה</span>}
          {isAdmin&&gistUrl&&<span style={{marginRight:'auto',fontSize:10,background:'rgba(34,197,94,.15)',color:'var(--green)',padding:'1px 7px',borderRadius:10}}>✅ מגובה</span>}
        </summary>
        <div style={{padding:'12px 14px',display:'flex',flexDirection:'column',gap:14}}>

          {/* ── כניסה (אורח) ── */}
          {!isAdmin&&<div>
            {!_adminCode
              ?<div style={{fontSize:11,color:'var(--text3)'}}>לא הוגדר קוד אדמין עדיין — הגדר קוד למטה.</div>
              :<div style={{display:'flex',flexDirection:'column',gap:8}}>
                <div style={{fontSize:11,color:'var(--text2)'}}>הכנס את קוד האדמין שלך:</div>
                <div style={{display:'flex',gap:6}}>
                  <input className="input" type="password" style={{flex:1,fontFamily:'monospace',direction:'ltr'}}
                    value={loginInput} onChange={e=>{setLoginInput(e.target.value);setLoginError(false);}}
                    onKeyDown={e=>e.key==='Enter'&&doAdminLogin()}
                    placeholder="קוד אדמין..." autoComplete="off"/>
                  <button className="btn btn-primary btn-sm" style={{flexShrink:0}} onClick={doAdminLogin}>
                    🔓 כנס
                  </button>
                </div>
                {loginError&&<div style={{fontSize:11,color:'var(--red)',fontWeight:600}}>❌ קוד שגוי</div>}
              </div>}
          </div>}

          {/* ── תוכן אדמין ── */}
          {isAdmin&&<>
          <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 12px',
            background:'rgba(139,92,246,.08)',borderRadius:8,border:'1px solid rgba(139,92,246,.3)'}}>
            <span style={{fontSize:12,color:'#a78bfa',fontWeight:700}}>🔐 מצב אדמין פעיל</span>
            <button className="btn btn-secondary btn-sm" style={{marginRight:'auto',fontSize:10}}
              onClick={()=>{onAdminLogout();toast('יצאת ממצב אדמין','info');}}>
              🚪 צא
            </button>
          </div>

          {/* ── 1. קוד אדמין ── */}
          <div>
            <div style={{fontSize:11,fontWeight:700,marginBottom:6}}>🔑 קוד אדמין</div>
            {!adminSaved
              /* מצב א׳ — הגדרה ראשונה */
              ?<>
                <div style={{fontSize:11,color:'var(--text2)',marginBottom:8,lineHeight:1.6}}>
                  בחר קוד שתזכור (כמו סיסמה קצרה) — יעבוד מכל מחשב.
                </div>
                <div style={{display:'flex',gap:6}}>
                  <input className="input" style={{flex:1,fontFamily:'monospace',fontSize:13,direction:'ltr',letterSpacing:1}}
                    value={adminCodeInput} onChange={e=>setAdminCodeInput(e.target.value.trim())}
                    placeholder="הכנס קוד שתזכור..." autoComplete="off"/>
                  <button className="btn btn-primary btn-sm" style={{flexShrink:0}} onClick={saveAdminCode}>
                    💾 שמור
                  </button>
                </div>
              </>
              :!adminEditMode
              /* מצב ב׳ — קוד שמור ומוסתר */
              ?<div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',
                  background:'var(--bg3)',borderRadius:8,border:'1px solid var(--border)'}}>
                <span style={{fontFamily:'monospace',fontSize:16,letterSpacing:3,color:'var(--text3)'}}>••••••••••</span>
                <span style={{fontSize:11,color:'var(--green)',fontWeight:600}}>✓ מוגדר</span>
                <button className="btn btn-secondary btn-sm" style={{marginRight:'auto'}}
                  onClick={()=>setAdminEditMode(true)}>
                  🔓 שנה קוד
                </button>
              </div>
              /* מצב ג׳ — שינוי קוד (דורש אישור) */
              :<div style={{display:'flex',flexDirection:'column',gap:8,padding:'10px 12px',
                  background:'rgba(139,92,246,.06)',borderRadius:8,border:'1px solid rgba(139,92,246,.3)'}}>
                <div style={{fontSize:11,color:'var(--text2)'}}>כדי לשנות, הכנס את הקוד הנוכחי:</div>
                <input className="input" type="password" style={{fontFamily:'monospace',direction:'ltr'}}
                  value={adminCurrentVerify} onChange={e=>setAdminCurrentVerify(e.target.value)}
                  placeholder="קוד נוכחי..." autoComplete="off"/>
                <input className="input" style={{fontFamily:'monospace',direction:'ltr'}}
                  value={adminNewCode} onChange={e=>setAdminNewCode(e.target.value.trim())}
                  placeholder="קוד חדש..." autoComplete="off"/>
                <div style={{display:'flex',gap:6}}>
                  <button className="btn btn-primary btn-sm" onClick={changeAdminCode}>✓ אשר שינוי</button>
                  <button className="btn btn-secondary btn-sm"
                    onClick={()=>{setAdminEditMode(false);setAdminCurrentVerify('');setAdminNewCode('');}}>
                    ✕ ביטול
                  </button>
                </div>
              </div>
            }
          </div>

          {/* ── 2. כתובת הניהול ── */}
          <div>
            <div style={{fontSize:11,fontWeight:700,marginBottom:4}}>🔗 כתובת כניסה לאדמין</div>
            <div style={{background:'var(--bg3)',borderRadius:8,padding:'8px 10px',fontFamily:'monospace',fontSize:11,direction:'ltr',wordBreak:'break-all',color:'var(--accent)',border:'1px solid rgba(79,142,247,0.3)',marginBottom:6}}>
              {currentAdminUrl}
            </div>
            <button className="btn btn-secondary btn-sm"
              onClick={()=>{navigator.clipboard?.writeText(currentAdminUrl).then(()=>toast('כתובת ניהול הועתקה ✓','success'));}}>
              📋 העתק כתובת
            </button>
          </div>

          {/* ── 3. גיבוי לגיטהאב ── */}
          <div>
            <div style={{fontSize:11,fontWeight:700,marginBottom:4}}>☁️ גיבוי הקוד לגיטהאב</div>
            {(s.githubToken||settings.githubToken)
              ?<div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
                <button className="btn btn-primary btn-sm"
                  onClick={backupToGist} disabled={gistSaving||!adminCodeInput}>
                  {gistSaving?'⏳ שומר...':'☁️ גבה לגיטהאב'}
                </button>
                {gistUrl&&<a href={gistUrl} target="_blank" rel="noreferrer"
                  style={{fontSize:11,color:'var(--accent)',fontWeight:600,textDecoration:'none'}}>
                  🔗 פתח Gist השמור
                </a>}
              </div>
              :<div style={{fontSize:11,color:'var(--text3)',lineHeight:1.7,padding:'7px 10px',
                background:'var(--bg3)',borderRadius:8}}>
                כדי לגבות לגיטהאב: כנס למצב אדמין ← הגדר GitHub Token ← חזור לכאן ← לחץ "☁️ גבה".
              </div>}
          </div>

          </>}  {/* סוף תוכן אדמין */}

        </div>
      </details>
    </div>

    {/* ══ GitHub Token — ייבוא מגוגל מפות ══ */}
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--surface2)'}}>
      <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>🐙 GitHub Token — ייבוא רשימות מגוגל מפות</div>
      <div style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>
        <input className="input" type="password"
          value={s.githubToken||''}
          onChange={e=>upd('githubToken',e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&saveToken()}
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autoComplete="off"
          style={{flex:1,minWidth:160,maxWidth:300,direction:'ltr'}}/>
        <button className="btn btn-primary btn-sm" onClick={saveToken} disabled={savingToken}
          style={{flexShrink:0,whiteSpace:'nowrap'}}>
          {savingToken?'⏳ שומר...':'💾 שמור וסנכרן'}
        </button>
        {!s.githubToken&&<a href="https://github.com/settings/tokens/new?scopes=repo&description=PlanMyTrip"
            target="_blank" rel="noreferrer"
            style={{fontSize:11,color:'var(--accent)',flexShrink:0,whiteSpace:'nowrap'}}>+ צור Token</a>}
      </div>
      <div style={{fontSize:11,marginTop:6,minHeight:16,color:tokenSyncMsg?'var(--green)':s.githubToken?'var(--green)':'var(--text3)'}}>
        {tokenSyncMsg||(s.githubToken
          ?'✅ Token מוגדר — ייבוא רשימות מגוגל מפות דרך GitHub זמין'
          :'לא מוגדר — ייבוא יסתמך על פרוקסים בלבד (עלול להיכשל)')}
      </div>
    </div>

    {/* ══ שלוש עמודות ══ */}
    <div className="conn-cols">

      {/* ═══════════════════════
          עמודה 1 — 🔗 סנכרון
          ══════════════════════ */}
      <div className="conn-col">
        <div className="conn-col-title">
          🔗 סנכרון בין מכשירים
          <div style={{marginRight:'auto',display:'flex',gap:6,alignItems:'center'}}>
            <span className="chip chip-green" style={{fontSize:10}}>✓ פעיל</span>
            <span style={{fontSize:11,color:statusColor,fontWeight:700}}>{statusText}</span>
          </div>
        </div>

        <div className="conn-desc" style={{borderRight:'3px solid rgba(79,142,247,0.5)'}}>
          הנתונים נשמרים ומסונכרנים <strong>אוטומטית</strong> — ללא הרשמה. כל מכשיר מחובר דרך <strong>קוד סינכרון</strong> ייחודי שלך.
        </div>

        {/* ── קוד הסינכרון ── */}
        <div style={{background:'var(--bg3)',borderRadius:12,padding:'18px 16px',border:'2px solid var(--accent)',textAlign:'center'}}>
          <div style={{fontSize:11,color:'var(--text2)',marginBottom:6,fontWeight:600,letterSpacing:1,textTransform:'uppercase'}}>הקוד שלך</div>
          <div style={{fontSize:22,fontWeight:800,letterSpacing:5,fontFamily:'monospace',color:'var(--accent)',marginBottom:14,wordBreak:'break-all'}}>
            {settings.syncKey}
          </div>
          <div style={{display:'flex',gap:6,justifyContent:'center',flexWrap:'wrap',marginBottom:8}}>
            <button className="btn btn-primary btn-sm" onClick={copyKey}>
              {copied?'✓ הועתק':'📋 העתק קוד'}
            </button>
            <button className="btn btn-secondary btn-sm"
              onClick={()=>{
                const u=`${location.origin}${location.pathname.replace(/[^\/]*$/,'')}mobile.html#k=${settings.syncKey}`;
                navigator.clipboard?.writeText(u).then(()=>toast('קישור למובייל הועתק — שלח לעצמך 📲','success'));
              }}>
              📲 קישור למובייל
            </button>
            <button className="btn btn-secondary btn-sm" style={{opacity:.7}}
              onClick={()=>{
                if(!confirm('ליצור קוד סנכרון חדש? יש לעדכן את כל המכשירים האחרים לאחר מכן.'))return;
                const newKey=genSyncKey();
                const ns={...settings,syncKey:newKey};
                onSettings(ns);
                setTimeout(()=>onPush(ns),200);
                toast('קוד חדש נוצר — עדכן את שאר המכשירים','info');
              }}>
              🔄 קוד חדש
            </button>
          </div>
        </div>

        {/* ── מה לעשות בכל מכשיר ── */}
        <div className="card">
          <div className="card-header" style={{padding:'8px 12px'}}>
            <span style={{fontWeight:700,fontSize:12}}>📋 מה לעשות בכל מכשיר</span>
          </div>
          <div className="card-body" style={{padding:'12px',display:'flex',flexDirection:'column',gap:10}}>

            {/* מובייל */}
            <div style={{background:'rgba(34,197,94,.07)',borderRadius:8,padding:'11px 12px',border:'1px solid rgba(34,197,94,.25)'}}>
              <div style={{display:'flex',alignItems:'center',gap:7,marginBottom:5}}>
                <span style={{fontWeight:700,fontSize:12}}>📱 מובייל — פעם ראשונה</span>
                <span style={{fontSize:10,background:'rgba(34,197,94,.2)',color:'var(--green)',padding:'1px 7px',borderRadius:10,fontWeight:700}}>הכי פשוט!</span>
              </div>
              <div style={{fontSize:11,color:'var(--text2)',lineHeight:2}}>
                1. לחץ <strong>"📲 קישור למובייל"</strong> למעלה<br/>
                2. שלח לעצמך בWhatsApp / מייל<br/>
                3. פתח בסלולר — הנתונים נטענים אוטומטית ✅<br/>
                <span style={{color:'var(--green)',fontWeight:600}}>לא צריך לעשות שום הגדרה נוספת.</span>
              </div>
            </div>

            {/* מחשב נוסף */}
            <div style={{background:'rgba(79,142,247,.06)',borderRadius:8,padding:'11px 12px',border:'1px solid rgba(79,142,247,.2)'}}>
              <div style={{fontWeight:700,fontSize:12,marginBottom:5}}>💻 מחשב נוסף</div>
              <div style={{fontSize:11,color:'var(--text2)',lineHeight:2}}>
                1. פתח <a href="." target="_blank" rel="noreferrer" style={{color:'var(--accent)',fontWeight:600}}>את האפליקציה</a> במחשב החדש<br/>
                2. לחץ 🔗 בסרגל הניווט<br/>
                3. הכנס את הקוד <code style={{color:'var(--accent)',fontWeight:700,fontSize:10,direction:'ltr',display:'inline-block'}}>{settings.syncKey}</code> בתיבה למטה<br/>
                4. לחץ <strong>"⬇️ טען"</strong>
              </div>
            </div>

            {/* מכשיר נוסף */}
            <div style={{background:'rgba(139,92,246,.05)',borderRadius:8,padding:'11px 12px',border:'1px solid rgba(139,92,246,.2)'}}>
              <div style={{fontWeight:700,fontSize:12,marginBottom:5}}>📱 סלולר נוסף / מכשיר חדש</div>
              <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.9}}>
                שלח שוב את הקישור למובייל (שלבים 1–3 לעיל). אותו קוד עובד על כל מספר מכשירים.
              </div>
            </div>

          </div>
        </div>

        {/* ── טעינה מקוד אחר ── */}
        <div>
          <label className="label">🔄 יש לך קוד ממכשיר אחר? הכנס אותו כאן:</label>
          <div style={{display:'flex',gap:6}}>
            <input className="input" type="text" value={s.syncKey||''}
              onChange={e=>upd('syncKey',e.target.value.trim())}
              placeholder="הדבק קוד מהמכשיר האחר..."
              style={{fontFamily:'monospace',fontSize:13,flex:1,direction:'ltr',letterSpacing:2}}/>
            <button className="btn btn-primary btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}}
              onClick={()=>{const ns={...settings,syncKey:s.syncKey,firebaseUrl:FB_URL};onSettings(ns);onPull(ns);}}
              disabled={!s.syncKey||s.syncKey===settings.syncKey||ghBusy}>
              ⬇️ טען
            </button>
          </div>
          <div style={{fontSize:10,color:'var(--text3)',marginTop:4}}>⚠️ הנתונים הנוכחיים יוחלפו בנתונים מהקוד החדש</div>
        </div>

        {/* ── גיבוי ── */}
        <div className="card">
          <div className="card-header" style={{padding:'8px 12px'}}><span style={{fontWeight:700,fontSize:12}}>💾 גיבוי ידני</span></div>
          <div className="card-body" style={{padding:'10px 12px',display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn btn-secondary btn-sm" onClick={onExport}>📤 ייצא JSON</button>
            <label className="btn btn-secondary btn-sm" style={{cursor:'pointer',margin:0}}>
              📂 ייבא JSON
              <input type="file" accept=".json" style={{display:'none'}} onChange={e=>{onImport(e.target.files?.[0]);e.target.value='';}}/>
            </label>
            <button className="btn btn-secondary btn-sm" onClick={()=>onPull()} disabled={ghBusy}>⬇️ רענן מהענן</button>
            <button className="btn btn-secondary btn-sm" onClick={()=>onPush(settings)} disabled={ghBusy}>☁️ שמור לענן</button>
          </div>
        </div>

        {/* ── סטטוס + בדיקה ── */}
        <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
          <button className="btn btn-secondary btn-sm" onClick={testConnection} disabled={testing}>
            {testing?'⏳ בודק...':'🔌 בדוק חיבור'}

        </div>
        {testResult&&<div style={{padding:'8px 12px',borderRadius:8,fontSize:12,
          background:testResult.ok?'rgba(34,197,94,0.1)':'rgba(239,68,68,0.1)',

        <details style={{borderRadius:8,border:'1px solid rgba(239,68,68,.35)',overflow:'hidden'}}>
          <summary style={{padding:'8px 12px',cursor:'pointer',fontWeight:700,fontSize:12,
            background:'rgba(239,68,68,.07)',color:'var(--red)',userSelect:'none',listStyle:'none',

          <div style={{padding:'12px',display:'flex',flexDirection:'column',gap:10}}>
            <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.7}}>

            </div>

              <button className="btn btn-secondary btn-sm" style={{position:'absolute',top:6,left:6,fontSize:10}}
                onClick={()=>{navigator.clipboard?.writeText(`{\n  "rules": {\n    "planmytrip": {\n      "$key": {\n        ".read": true,\n        ".write": true\n      }\n    }\n  }\n}`);toast('קוד הועתק ✓','success');}}>📋 העתק</button>
            </div>
            <div style={{fontSize:11,color:'var(--text2)',lineHeight:1.9}}>1. לחץ 📋 ← 2. מחק הכל ← 3. הדבק ← 4. <strong>Publish</strong></div>
            <a href={FB_RULES_URL} target="_blank" rel="noreferrer" className="btn btn-danger btn-sm" style={{textDecoration:'none',textAlign:'center'}}>
              🔗 פתח Firebase Rules
            </a>
          </div>
        </details>

      </div>

      {/* ═══════════════════════
          עמודה 2 — 🐙 GitHub (אדמין בלבד)
          ══════════════════════ */}
      {isAdmin&&<div className="conn-col">
        <div className="conn-col-title">
          🐙 GitHub Token
          <div style={{marginRight:'auto'}}>
            {s.githubToken
              ?<span className="chip chip-green" style={{fontSize:10}}>✓ מחובר</span>
              :<span className="chip" style={{background:'rgba(100,100,100,0.15)',color:'var(--text2)',fontSize:10}}>אופציונלי</span>}
          </div>
        </div>

        <div className="conn-desc" style={{borderRight:'3px solid rgba(88,96,176,0.5)'}}>
          <strong>מה זה?</strong> מאפשר לייבא רשימות מגוגל מפות ישירות לאפליקציה — מועדפים ⭐, "רוצה לבקר" 🏷️, תכניות טיול 🗺️.<br/><br/>
          <strong>למה GitHub?</strong> דפדפן לא יכול לגשת ישירות לגוגל (חסימת CORS). כשהפרוקסים הציבוריים חסומים, האפליקציה מפעילה <strong>GitHub Action</strong> — תהליך אוטומטי שרץ בשרתי GitHub, שולף את הרשימה מגוגל ומחזיר לאפליקציה.<br/><br/>
          <span style={{color:'var(--text3)',fontSize:11}}>✅ ללא Token — ייבוא דרך פרוקסים ציבוריים עדיין עובד, אבל עלול להיכשל לפעמים.</span>
        </div>

        <details className="conn-setup">
          <summary>📖 איך יוצרים Token? (פעם אחת בלבד)</summary>
          1. לחץ: <a href="https://github.com/settings/tokens/new?scopes=repo&description=PlanMyTrip" target="_blank" rel="noreferrer" style={{color:'var(--accent)',fontWeight:600}}>פתח יצירת GitHub Token ←</a><br/>
          2. "Note": כתוב <code>PlanMyTrip</code><br/>
          3. "Expiration": בחר <strong>"No expiration"</strong><br/>
          4. "Select scopes": ✅ סמן <strong><code>repo</code></strong> (כולל כל תתי-האפשרויות)<br/>
          5. לחץ <strong>"Generate token"</strong> ← העתק את ה-Token (<code>ghp_...</code>)<br/>

        <div>
          <label className="label">GitHub Personal Access Token</label>
          <input className="input" type="password" value={s.githubToken||''} onChange={e=>upd('githubToken',e.target.value)} placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autoComplete="off"/>
          {s.githubToken
            ?<div style={{fontSize:11,color:'var(--green)',marginTop:3}}>✓ מוגדר — ייבוא מגוגל מפות דרך GitHub זמין</div>
            :<div style={{fontSize:11,color:'var(--text3)',marginTop:3}}>Token נשמר רק בדפדפן שלך — לא עולה לשום שרת</div>}
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <div>
            <label className="label">שם משתמש GitHub</label>
            <input className="input" type="text" value={s.githubUsername||''} onChange={e=>upd('githubUsername',e.target.value)} placeholder="your-username"/>
          </div>
          <div>
            <label className="label">שם ריפוזיטורי</label>
            <input className="input" type="text" value={s.githubRepo||''} onChange={e=>upd('githubRepo',e.target.value)} placeholder="PlanMyTrip"/>
          </div>
        </div>

        <button className="btn btn-primary btn-sm" onClick={save} style={{alignSelf:'flex-start'}}>💾 שמור</button>

        {/* הסבר זרימה */}
        <div className="card" style={{background:'var(--surface2)',border:'none'}}>
          <div className="card-body" style={{padding:'10px 12px'}}>
            <div style={{fontWeight:700,fontSize:12,marginBottom:8}}>🔄 איך זה עובד?</div>
            {[
              {e:'1️⃣',t:'אתה מדביק קישור לרשימת גוגל מפות'},
              {e:'2️⃣',t:'האפליקציה מנסה פרוקסים ציבוריים (שניות)'},
              {e:'3️⃣',t:'אם נכשל — שולחת בקשה לשרתי GitHub'},
              {e:'4️⃣',t:'GitHub שולף מגוגל ישירות (ללא חסימה)'},
              {e:'5️⃣',t:'האפליקציה קולטת את התוצאה — ~40 שניות'},
            ].map(({e,t})=><div key={e} style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:5,fontSize:11,color:'var(--text2)'}}>
              <span style={{flexShrink:0}}>{e}</span><span>{t}</span>
            </div>)}
          </div>
        </div>
      </div>}

      {/* ═══════════════════════
          עמודה 3 — 🗺️ Google Maps (אדמין בלבד)
          ══════════════════════ */}
      {isAdmin&&<div className="conn-col">
        <div className="conn-col-title">
          🗺️ Google Maps API
          <div style={{marginRight:'auto'}}>
            {s.googleMapsKey
              ?<span className="chip chip-green" style={{fontSize:10}}>✓ מפתח מותאם</span>
              :<span className="chip" style={{background:'rgba(34,197,94,0.15)',color:'var(--green)',fontSize:10}}>✓ ברירת מחדל</span>}
          </div>
        </div>
        <div className="conn-desc" style={{borderRight:'3px solid rgba(34,197,94,0.5)'}}>
          מפתח Google Maps מוטמע באפליקציה — משתמשים לא צריכים להגדיר כלום.<br/><br/>
          <span style={{fontSize:11,color:'var(--text3)'}}>כאן תוכל להחליף למפתח אישי שלך אם תרצה להגביל שימוש לדומיין שלך בלבד.</span>
        </div>
        <div>
          <label className="label">מפתח Google Maps API (אופציונלי — לדריסת ברירת המחדל)</label>
          <input className="input" type="password" value={s.googleMapsKey||''} onChange={e=>upd('googleMapsKey',e.target.value)} autoComplete="off" placeholder={`ברירת מחדל: ${GMAPS_KEY.slice(0,12)}...`}/>
          {s.googleMapsKey
            ?<div style={{fontSize:11,color:'var(--green)',marginTop:3}}>✓ מפתח אישי פעיל</div>
            :<div style={{fontSize:11,color:'var(--text3)',marginTop:3}}>משתמש בברירת המחדל המוטמעת</div>}
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <button className="btn btn-primary btn-sm" onClick={()=>{onSettings({...s});toast('נשמר ✓','success');}}>💾 שמור</button>
          {s.googleMapsKey&&<button className="btn btn-secondary btn-sm" onClick={()=>{upd('googleMapsKey','');toast('חזר לברירת מחדל ✓','success');}}>↺ אפס למחדל</button>}
        </div>
        <div className="card" style={{background:'var(--surface2)',border:'none'}}>

    </div>

function ReportSection({title,children}){

    <div style={{fontWeight:700,fontSize:16,color:'var(--text)',borderBottom:'2px solid var(--border)',paddingBottom:8,marginBottom:14}}>{title}</div>

function ReportTab({trip}){
  // ── חישובי סיכום ──
  const totalExp=trip.expenses.reduce((s,e)=>s+(e.amount||0),0);
  const expByCat=trip.expenses.reduce((a,e)=>{const c=e.category||'אחר';a[c]=(a[c]||0)+(e.amount||0);return a;},{});
  const allBlocks=trip.days.flatMap(d=>d.blocks);
  const completedBlocks=allBlocks.filter(b=>b.isCompleted).length;

  // ── ייצוא טקסט ──
  const genText=()=>{
    const hr=(c='─')=>c.repeat(52);
    const lines=[
      `📋 דו"ח טיול: ${trip.name}`,hr('═'),'',
    ];
    if(trip.startDate||trip.endDate) lines.push(`📅 תאריכים: ${trip.startDate||'?'} – ${trip.endDate||'?'}`);
    if(trip.vehicle?.name) lines.push(`🚐 רכב: ${trip.vehicle.name}${trip.vehicle.plate?' | '+trip.vehicle.plate:''}`);
    lines.push(`📊 ימים: ${trip.days.length} | פעילויות בוצעו: ${completedBlocks}/${allBlocks.length} | הוצאות: ₪${totalExp.toFixed(0)}${trip.interestBank.length?` | אטרקציות שמורות: ${trip.interestBank.length}`:''}`,'');

    if(trip.days.length>0){
      lines.push(hr(),'📅 לוח זמנים יומי',hr());
      trip.days.forEach((day,i)=>{
        const sorted=[...day.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
        lines.push('',`יום ${i+1}${day.date?` — ${new Date(day.date).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long'})}`:''}`+(day.location?` | 📍 ${day.location}`:''));
        if(day.startLocation||day.endLocation) lines.push(`  🟢 ${day.startLocation||'—'}${day.startTime?' '+day.startTime:''} → 🔴 ${day.endLocation||'—'}${day.endTime?' '+day.endTime:''}`);
        if(!sorted.length){lines.push('  (אין פעילויות)');return;}
        sorted.forEach(b=>{
          const end=addMins(b.startTime,b.durationMins);
          lines.push(`  ${b.isCompleted?'✅':'⬜'} ${b.startTime}–${end}  ${BLOCK_EMOJI[b.type]} ${b.customName||b.title||BLOCK_HE[b.type]}${b.placeType?' ['+b.placeType+']':''}`);
          if(b.location) lines.push(`       📍 ${b.location}`);
          if(b.notes) lines.push(`       📝 ${b.notes}`);
          if(b.rating>0) lines.push(`       ${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)} דירוג אישי`);
          if(b.placeRating) lines.push(`       ⭐ ${b.placeRating}/5 (גוגל)`);
          if(b.cost>0) lines.push(`       💰 ₪${b.cost}`);
        });
        if(day.notes) lines.push(`  📝 הערות: ${day.notes}`);
        if(day.summary) lines.push(`  📌 סיכום: ${day.summary}`);
      });
      lines.push('');
    }

    if(trip.interestBank.length>0){
      lines.push(hr(),'🌟 בנק אטרקציות',hr());
      trip.interestBank.forEach(item=>{
        lines.push(`• ${item.customName||item.name}${item.placeType?' ['+item.placeType+']':''}${item.address?' — '+item.address:''}`);
        if(item.rating) lines.push(`  ⭐ ${item.rating}`);
        if(item.phone) lines.push(`  📞 ${item.phone}`);
        if(item.website) lines.push(`  🌐 ${item.website}`);
      });
      lines.push('');
    }

    if(trip.expenses.length>0){
      lines.push(hr(),`💰 הוצאות — סה"כ ₪${totalExp.toFixed(0)}`,hr());
      Object.entries(expByCat).sort(([,a],[,b])=>b-a).forEach(([cat,sum])=>lines.push(`  ${cat}: ₪${sum.toFixed(0)}`));
      lines.push('');
      trip.expenses.forEach(e=>lines.push(`  ${e.date||'—'} | ${e.category||'—'} | ${e.description||''} | ₪${e.amount||0}${e.notes?' | '+e.notes:''}`));
      lines.push('');
    }

    if(trip.generalNotes) lines.push(hr(),'📝 הערות כלליות',hr(),trip.generalNotes,'');

    if(trip.quickNotes?.length>0){
      lines.push(hr(),'📌 פתקים מהירים',hr());
      trip.quickNotes.forEach(n=>lines.push(`• ${typeof n==='string'?n:n.text||''}`));
      lines.push('');
    }

    if(trip.packingList?.length>0){
      const done=trip.packingList.filter(i=>i.done), undone=trip.packingList.filter(i=>!i.done);
      lines.push(hr(),`🎒 ציוד (${done.length}/${trip.packingList.length} נארזו)`,hr());
      done.forEach(i=>lines.push(`  ✅ ${i.text}${i.category?' ['+i.category+']':''}`));
      undone.forEach(i=>lines.push(`  ⬜ ${i.text}${i.category?' ['+i.category+']':''}`));
      lines.push('');
    }

    if(trip.shoppingList?.length>0){
      const done=trip.shoppingList.filter(i=>i.done), undone=trip.shoppingList.filter(i=>!i.done);
      lines.push(hr(),`🛒 קניות (${done.length}/${trip.shoppingList.length} נקנו)`,hr());
      done.forEach(i=>lines.push(`  ✅ ${i.text}${i.category?' ['+i.category+']':''}`));
      undone.forEach(i=>lines.push(`  ⬜ ${i.text}${i.category?' ['+i.category+']':''}`));
      lines.push('');
    }

    if(trip.documents?.length>0){
      lines.push(hr(),'📁 מסמכים',hr());
      trip.documents.forEach(d=>lines.push(`• ${d.title}${d.notes?' — '+d.notes:''}`));
      lines.push('');
    }

    lines.push(hr('═'),`הדו"ח נוצר: ${new Date().toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'2-digit',hour:'2-digit',minute:'2-digit'})}`);
    return lines.join('\n');
  };

  const exportTxt=()=>{
    const blob=new Blob(['﻿'+genText()],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${trip.name}-דוח-טיול.txt`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };
  const copyText=async()=>{
    try{await navigator.clipboard.writeText(genText());toast('הדו"ח הועתק ✓','success');}
    catch{toast('העתקה נכשלה — נסה להוריד','error');}
  };

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    {/* ── סרגל כלים ── */}
    <div className="report-toolbar" style={{padding:'12px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',flexShrink:0}}>
      <span style={{fontWeight:700,fontSize:15}}>📋 דו"ח טיול</span>
      <span style={{fontSize:13,color:'var(--text3)'}}>{trip.name}</span>
      <div style={{flex:1}}/>
      <button className="btn btn-secondary btn-sm" onClick={copyText}>📋 העתק טקסט</button>
      <button className="btn btn-secondary btn-sm" onClick={exportTxt}>⬇️ הורד .txt</button>
      <button className="btn btn-primary btn-sm" onClick={()=>window.print()}>🖨️ הדפס</button>
    </div>

    {/* ── תוכן הדו"ח ── */}
    <div className="scroll-y" style={{flex:1,padding:'24px 28px',fontFamily:'Heebo,sans-serif'}}>
      <div style={{maxWidth:860,margin:'0 auto'}}>

        {/* כותרת */}
        <div style={{textAlign:'center',marginBottom:28,paddingBottom:20,borderBottom:'2px solid var(--border)'}}>
          <div style={{fontSize:26,fontWeight:800}}>{trip.name}</div>
          {(trip.startDate||trip.endDate)&&<div style={{fontSize:14,color:'var(--text2)',marginTop:6}}>
            {trip.startDate&&new Date(trip.startDate).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
            {trip.startDate&&trip.endDate&&' — '}
            {trip.endDate&&new Date(trip.endDate).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
          </div>}
          {trip.vehicle?.name&&<div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>🚐 {trip.vehicle.name}{trip.vehicle.plate&&' | '+trip.vehicle.plate}</div>}
        </div>

        {/* כרטיסיות סיכום */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:10,marginBottom:28}}>
          {[
            {e:'📅',v:trip.days.length,l:'ימים'},
            {e:'🎯',v:`${completedBlocks}/${allBlocks.length}`,l:'פעילויות'},
            {e:'💰',v:`₪${totalExp.toFixed(0)}`,l:'הוצאות'},
            {e:'🌟',v:trip.interestBank.length,l:'אטרקציות'},
            {e:'🎒',v:(trip.packingList||[]).filter(i=>i.done).length+'/'+((trip.packingList||[]).length),l:'ציוד נארז'},
          ].map((s,i)=>(
            <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 8px',textAlign:'center'}}>
              <div style={{fontSize:18}}>{s.e}</div>
              <div style={{fontSize:18,fontWeight:800,color:'var(--accent)',lineHeight:1.2}}>{s.v}</div>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>

                {d.savedAt&&<span style={{color:'var(--text3)',fontSize:11}}>{new Date(d.savedAt).toLocaleDateString('he-IL')}</span>}
              </div>

        {/* כלי הרכב */}
        {trip.vehicle&&(trip.vehicle.waterFillDate||trip.vehicle.wasteEmptyDate)&&<ReportSection title="🚐 מצב כלי הרכב">
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            {trip.vehicle.waterFillDate&&<div style={{padding:'8px 14px',background:'rgba(79,142,247,0.1)',borderRadius:8,border:'1px solid rgba(79,142,247,0.3)'}}>
              <div style={{fontSize:11,color:'var(--text3)'}}>💧 מילוי מים אחרון</div>
              <div style={{fontWeight:700,fontSize:13,color:'#4f8ef7'}}>{new Date(trip.vehicle.waterFillDate).toLocaleDateString('he-IL')}</div>
              {(trip.vehicle.waterLog||[]).length>1&&<div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>סה"כ {trip.vehicle.waterLog.length} מילויים</div>}
            </div>}
            {trip.vehicle.wasteEmptyDate&&<div style={{padding:'8px 14px',background:'rgba(245,158,11,0.1)',borderRadius:8,border:'1px solid rgba(245,158,11,0.3)'}}>
              <div style={{fontSize:11,color:'var(--text3)'}}>🪣 ריקון קקי אחרון</div>
              <div style={{fontWeight:700,fontSize:13,color:'#f59e0b'}}>{new Date(trip.vehicle.wasteEmptyDate).toLocaleDateString('he-IL')}</div>
              {(trip.vehicle.wasteLog||[]).length>1&&<div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>סה"כ {trip.vehicle.wasteLog.length} ריקונים</div>}
            </div>}

        {/* תחתית */}
        <div style={{marginTop:28,paddingTop:12,borderTop:'1px solid var(--border)',fontSize:11,color:'var(--text3)',textAlign:'center'}}>

        </div>

    </div>
  </div>;
