<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="pragma" content="no-cache" />
  <title>CaravanControl — מנהל טיולים v28</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117; --bg2: #1a1d27; --bg3: #232736;
      --surface: #2a2e3f; --surface2: #333849; --border: #3d4358;
      --text: #e8eaf0; --text2: #9aa0b8; --text3: #6b7295;
      --accent: #4f8ef7; --green: #22c55e; --amber: #f59e0b;
      --red: #ef4444; --purple: #a855f7; --orange: #f97316;
      --radius: 12px; --shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    .light {
      --bg: #f0f4f8; --bg2: #e8edf3; --bg3: #dde3ec;
      --surface: #ffffff; --surface2: #f5f7fa; --border: #d1d9e6;
      --text: #1a2035; --text2: #4a5568; --text3: #8896aa;
      --shadow: 0 4px 24px rgba(0,0,0,0.1);
    }

    html, body { height: 100%; font-family: 'Heebo', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; direction: rtl; }
    #root { height: 100%; display: flex; flex-direction: column; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .app-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 20px; flex-shrink: 0; z-index: 100; }
    .vehicle-banner { display: flex; align-items: center; gap: 16px; padding: 10px 0 6px; flex-wrap: wrap; }
    .tab-bar { display: flex; gap: 2px; padding: 6px 0 0; overflow-x: auto; }
    .tab-btn { padding: 8px 16px; border: none; background: none; color: var(--text2); font-size: 13px; font-weight: 500; font-family: 'Heebo', sans-serif; cursor: pointer; border-radius: 8px 8px 0 0; border-bottom: 2px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .tab-btn:hover { color: var(--text); background: var(--surface); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--surface); }
    .main-content { flex: 1; overflow: hidden; display: flex; width: 100%; }

    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: var(--radius); font-size: 13px; font-weight: 500; font-family: 'Heebo', sans-serif; cursor: pointer; transition: all 0.15s; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: #3a7de8; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: var(--surface2); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-success { background: var(--green); color: #fff; }
    .btn-amber { background: var(--amber); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-icon { padding: 7px; border-radius: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: 'Heebo', sans-serif; width: 100%; transition: border-color 0.15s; direction: rtl; }
    .input:focus { outline: none; border-color: var(--accent); }
    .input::placeholder { color: var(--text3); }
    textarea.input { resize: vertical; min-height: 80px; }
    select.input { cursor: pointer; }
    .label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 4px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
    .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-body { padding: 16px; }

    .chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .chip-green { background: rgba(34,197,94,0.15); color: var(--green); }
    .chip-amber { background: rgba(245,158,11,0.15); color: var(--amber); }
    .chip-red { background: rgba(239,68,68,0.15); color: var(--red); }
    .chip-blue { background: rgba(79,142,247,0.15); color: var(--accent); }
    .chip-purple { background: rgba(168,85,247,0.15); color: var(--purple); }

    .progress { height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 4px; transition: width 0.4s; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); animation: modalIn 0.2s ease; }
    .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-start; }

    @keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideIn { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .timeline { display: flex; flex-direction: column; position: relative; }
    .timeline::before { content: ''; position: absolute; right: 44px; top: 0; bottom: 0; width: 2px; background: var(--border); z-index: 0; }
    .timeline-block { display: flex; flex-direction: row-reverse; gap: 12px; position: relative; animation: fadeIn 0.3s ease; padding-bottom: 6px; }
    .timeline-dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; margin-right: 8px; margin-top: 12px; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 2px solid var(--bg2); }
    .block-travel { background: rgba(79,142,247,0.1); border: 1px solid rgba(79,142,247,0.3); }
    .block-activity { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); }
    .block-stop { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); }

    .stars { display: flex; gap: 3px; }
    .star { font-size: 20px; cursor: pointer; transition: transform 0.1s; user-select: none; }
    .star:hover { transform: scale(1.2); }

    /* ── תצוגת מפה 3 עמודות ── */
    .map-view-3col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: row; height: 100%; overflow: hidden; }
    .map-col { flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
    .map-col + .map-col { border-left: 1px solid var(--border); }

    /* חיבוריות — פריסת 3 עמודות */
    .conn-view { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
    .conn-header { flex-shrink: 0; padding: 16px 20px 12px; border-bottom: 1px solid var(--border); background: var(--surface); }
    .conn-cols { flex: 1 1 0; min-width: 0; display: flex; flex-direction: row; overflow: hidden; }
    .conn-col { flex: 1 1 0; min-width: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .conn-col + .conn-col { border-right: 1px solid var(--border); }
    .conn-col-title { font-size: 13px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; padding-bottom: 10px; border-bottom: 2px solid var(--border); margin-bottom: 2px; }
    .conn-diagram { display: flex; align-items: center; justify-content: center; gap: 0; padding: 10px 0 4px; }
    .conn-diagram-app { background: var(--accent); color: #fff; border-radius: 12px; padding: 8px 18px; font-weight: 800; font-size: 13px; text-align: center; min-width: 90px; }
    .conn-diagram-svc { border: 2px solid var(--border); border-radius: 10px; padding: 7px 12px; font-size: 11px; text-align: center; min-width: 80px; background: var(--surface2); }
    .conn-diagram-arrow { font-size: 14px; color: var(--text3); padding: 0 4px; flex-shrink: 0; }
    .conn-desc { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 13px; font-size: 12px; line-height: 1.85; }
    .conn-setup { background: rgba(79,142,247,0.06); border: 1px solid rgba(79,142,247,0.18); border-radius: 8px; padding: 10px 13px; font-size: 11.5px; line-height: 2; }
    .conn-setup summary { font-weight: 700; color: var(--accent); cursor: pointer; font-size: 12px; }
    .conn-setup summary:hover { text-decoration: underline; }
    details.conn-setup[open] summary { margin-bottom: 6px; }
    @media (max-width:768px) {
      .conn-cols { flex-direction: column; }
      .conn-col + .conn-col { border-right: none; border-top: 1px solid var(--border); }
    }

    .interest-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface2); border: 1px solid var(--border); transition: all 0.15s; animation: slideIn 0.2s ease; }
    .interest-item:hover { border-color: var(--accent); }

    .expense-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .expense-row:last-child { border-bottom: none; }

    .list-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; transition: background 0.15s; }
    .list-item:hover { background: var(--surface2); }
    .list-item.done span.item-text { text-decoration: line-through; opacity: 0.5; }

    .weather-card { background: linear-gradient(135deg, #1e3a5f, #1a2d4e); border-radius: 12px; padding: 14px; color: #fff; }
    .sidebar-panel { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }

    .toast-container { position: fixed; bottom: 24px; left: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; }
    .toast { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; font-size: 13px; box-shadow: var(--shadow); animation: modalIn 0.25s ease; display: flex; align-items: center; gap: 10px; min-width: 240px; cursor: pointer; }
    .toast.success { border-right: 3px solid var(--green); }
    .toast.error { border-right: 3px solid var(--red); }
    .toast.info { border-right: 3px solid var(--accent); }

    .scroll-y { overflow-y: auto; }
    .flex-1 { flex: 1; }
    .section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 48px 20px; color: var(--text3); text-align: center; }
    .empty-state .emoji { font-size: 48px; }
    .empty-state p { font-size: 14px; line-height: 1.7; max-width: 320px; }

    .gauge { display: flex; flex-direction: column; gap: 3px; min-width: 80px; }
    .gauge-label { font-size: 10px; color: var(--text3); font-weight: 600; }
    .gauge-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; width: 100%; }
    .gauge-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }

    .day-header { padding: 12px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .day-header:hover { background: var(--surface); }
    .time-indicator { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: rgba(79,142,247,0.12); border-radius: 8px; font-size: 12px; }

    .doc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .doc-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; text-align: center; cursor: pointer; transition: all 0.15s; position: relative; }
    .doc-item:hover { border-color: var(--accent); transform: translateY(-2px); }

    .mobile-toggle { display: none; }
    .mobile-bottom-nav { display: none; }
    .bank-backdrop { display: none; }
    .bank-close-btn { display: none; }

    @media (max-width: 768px) {
      /* ── כללי ── */
      html, body { overflow: hidden; -webkit-text-size-adjust: 100%; }

      /* ── כותרת ── */
      .app-header { padding: 0 12px; }
      .vehicle-banner { gap: 8px; padding: 6px 0 4px; flex-wrap: wrap; }
      .vehicle-banner .btn { padding: 5px 10px; font-size: 12px; }

      /* ── לשוניות — מוסתר על מובייל, מוחלף בניווט תחתון ── */
      .tab-bar { display: none; }
      .mobile-toggle { display: none; }

      /* ── תוכן ראשי ── */
      .main-content { padding-bottom: 56px; }

      /* ── ניווט תחתון ── */
      .mobile-bottom-nav {
        display: flex;
        position: fixed;
        bottom: 0; left: 0; right: 0;
        z-index: 500;
        background: var(--bg2);
        border-top: 1px solid var(--border);
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        gap: 0;
        padding: 0;
      }
      .mobile-bottom-nav::-webkit-scrollbar { display: none; }
      .mobile-nav-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        padding: 6px 10px;
        min-width: 56px;
        min-height: 52px;
        flex-shrink: 0;
        border: none;
        background: none;
        color: var(--text3);
        font-family: 'Heebo', sans-serif;
        cursor: pointer;
        transition: color 0.15s, background 0.15s;
        border-top: 2px solid transparent;
      }
      .mobile-nav-btn.active { color: var(--accent); border-top-color: var(--accent); background: rgba(79,142,247,0.08); }
      .mobile-nav-icon { font-size: 18px; line-height: 1; }
      .mobile-nav-label { font-size: 9px; font-weight: 600; white-space: nowrap; }

      /* ── מודאלים ── */
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal { max-width: 100%; width: 100%; border-radius: 20px 20px 0 0; max-height: 92vh; }

      /* ── תצוגת מפה 3 עמודות: בסלולר רק המפה גלויה, שאר הפאנלים bottom-sheets ── */
      .map-col + .map-col { border-left: none; }
      .map-col-map { flex: 1 1 100%; }
      .map-col-timeline, .map-col-bank {
        position: fixed !important;
        bottom: 56px; left: 0; right: 0;
        height: 68vh;
        z-index: 450;
        background: var(--bg2);
        border-radius: 20px 20px 0 0 !important;
        border-top: 2px solid var(--accent) !important;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        transform: translateY(105%);
        transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
      }
      .map-col-timeline.mob-open, .map-col-bank.mob-open {
        transform: translateY(0);
      }
      .mob-panel-backdrop {
        display: none;
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 440;
      }
      .mob-panel-backdrop.show { display: block; }

      /* ── בנק אטרקציות בלשונית לוח זמנים עצמאית ── */
      .sidebar-panel {
        position: fixed !important;
        bottom: 56px; left: 0; right: 0;
        height: 68vh;
        width: 100% !important;
        z-index: 450;
        border-radius: 20px 20px 0 0 !important;
        border-right: none !important;
        border-top: 2px solid var(--accent) !important;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.6);
        animation: slideUp .28s ease;
      }
      .bank-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 440; }
      .bank-close-btn { display: flex; }

      /* ── בלוקי ציר זמן ── */
      .timeline-block { gap: 8px; }
      .timeline-dot { width: 28px; height: 28px; font-size: 13px; }
      .card.block-activity, .card.block-travel, .card.block-stop { border-radius: 10px; }
      .day-header { padding: 10px 12px; gap: 8px; }

      /* ── כפתורים — גודל מגע ── */
      .btn { min-height: 38px; }
      .btn-sm { min-height: 32px; }
      .btn-icon { min-height: 36px; min-width: 36px; }
      .tab-btn { min-height: 44px; padding: 10px 14px; }
      input[type="checkbox"] { min-width: 20px; min-height: 20px; }

      /* ── toast ── */
      .toast-container { bottom: 68px; left: 12px; right: 12px; }
      .toast { min-width: unset; width: 100%; }

      /* ── doc grid ── */
      .doc-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

      /* ── הוצאות ── */
      .expense-row { flex-wrap: wrap; gap: 6px; }
    }

    /* ── מסכים גדולים ── */
    @media (min-width: 769px) {
      .mobile-bottom-nav { display: none !important; }
    }

    .gm-style .gm-style-iw-c { padding: 0 !important; }

    @media print {
      .app-header, .tab-bar, .mobile-bottom-nav, .report-toolbar { display: none !important; }
      html, body, #root, .main-content { overflow: visible !important; height: auto !important; }
      .scroll-y { overflow: visible !important; height: auto !important; max-height: none !important; }
      .modal-overlay { display: none !important; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

/* ── עזרים ── */
const APP_VERSION = 'v202';
const GMAPS_KEY = 'AIzaSyAZhMPQ3rdplpqNhYx5oNrZV5HJfcTq1Dw';

/* ── קוד אדמין — נשמר בדפדפן בלבד, לא מסונכרן ── */
const _adminCode=(()=>{try{return localStorage.getItem('planmytrip-admin-code')||'';}catch{return '';}})();

/* בנה URL לגוגל מפות:
   • placeId → search/?api=1 + name + query_place_id  (פותח כרטיס מקום)
   • name + coords → search/NAME/@LAT,LNG             (חיפוש שם ממורכז בנ"צ)
   • coords בלבד  → maps?q=LAT,LNG                   (סיכה בנ"צ כ-fallback) */
const mkMapsUrl=(placeId,lat,lng,name)=>
  placeId
    ?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(name||(lat?`${lat},${lng}`:'place'))}&query_place_id=${placeId}`
    :name&&lat&&lng
      ?`https://www.google.com/maps/search/${encodeURIComponent(name)}/@${lat},${lng},17z`
      :lat&&lng?`https://www.google.com/maps?q=${lat},${lng}`:'';


/* ─── OSRM travel time (100% free, no Google, no billing) ─── */
const _osrmCache={};
// profile: 'driving' | 'foot' | 'bike'
const fetchOsrmMinutes=async(fromLat,fromLng,toLat,toLng,profile='driving')=>{
  const key=`${profile}:${fromLng.toFixed(4)},${fromLat.toFixed(4)}|${toLng.toFixed(4)},${toLat.toFixed(4)}`;
  if(key in _osrmCache)return _osrmCache[key];
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),9000);
    const url=`https://router.project-osrm.org/route/v1/${profile}/${fromLng},${fromLat};${toLng},${toLat}?overview=false`;
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok){_osrmCache[key]=null;return null;}
    const d=await r.json();
    const sec=d?.routes?.[0]?.duration;
    const distM=d?.routes?.[0]?.distance;
    const min=sec!=null?Math.round(sec/60):null;
    const km=distM!=null?Math.round(distM/100)/10:null;
    _osrmCache[key]={min,km};
    return{min,km};
  }catch{_osrmCache[key]=null;return null;}
};
const fmtKm=km=>km==null?'':km<1?`${Math.round(km*1000)}מ'`:`${km<10?km.toFixed(1):Math.round(km)} ק"מ`;
const fmtTravelMin=m=>{
  if(m==null)return'?';
  if(m<60)return`${m} דק'`;
  const h=Math.floor(m/60),mn=m%60;
  return mn?`${h}ש' ${mn}דק'`:`${h} שעות`;
};
const uid = () => Math.random().toString(36).slice(2,10);
const fmt2 = n => n?.toString().padStart(2,'0');
// ─── geo distance helpers (DayBankSuggestions) ───────────────────────────────
function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371,d2r=Math.PI/180;
  const dLat=(lat2-lat1)*d2r,dLng=(lng2-lng1)*d2r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*d2r)*Math.cos(lat2*d2r)*Math.sin(dLng/2)**2;
  return R*2*Math.asin(Math.sqrt(a));
}
function distToSegKm(pLat,pLng,sLat,sLng,eLat,eLng){
  // min distance from point P to line-segment S→E (flat-earth, good < 500 km)
  const cosLat=Math.cos(((sLat+eLat)/2)*Math.PI/180);
  const px=(pLng-sLng)*cosLat*111.32, py=(pLat-sLat)*111.32;
  const ex=(eLng-sLng)*cosLat*111.32, ey=(eLat-sLat)*111.32;
  const len2=ex*ex+ey*ey;
  if(len2===0)return Math.sqrt(px*px+py*py);
  const t=Math.max(0,Math.min(1,(px*ex+py*ey)/len2));
  return Math.sqrt((px-t*ex)**2+(py-t*ey)**2);
}

/* ── Google Takeout parser ──
   תומך במספר פורמטים של Saved Places.json (גרסאות שונות של גוגל)
*/
const parseTakeoutFeatures = (data) => {
  // מצא את מערך הפריטים בכל מבנה אפשרי
  const features =
    (Array.isArray(data) ? data : null) ||
    data?.features ||
    data?.geometry?.geometries ||
    [];
  if (!features.length) return [];

  return features.map(f => {
    if (!f) return null;
    const p = f.properties || f; // תמיכה גם בפורמט שטוח ללא properties
    const loc = p.Location || p.location || {};
    const geo = loc['Geo Coordinates'] || loc.geoCoordinates || {};

    // שם — חיפוש בכל המפתחות האפשריים
    const name = (
      p.Title || p.title ||
      loc.Name || loc.name ||
      p.name || p.Name ||
      ''
    ).toString().trim();

    // כתובת
    const address = (
      loc.Address || loc.address ||
      p.address || p.Address ||
      ''
    ).toString().trim();

    // אתר / קישור
    const website = p.URL || p.url || p['Google Maps URL'] || '';

    // קואורדינטות: geometry.coordinates [lng,lat] (GeoJSON) או Geo Coordinates
    let lat = null, lng = null;
    const coords = f.geometry?.coordinates || f.coordinates;
    if (Array.isArray(coords) && coords.length >= 2) {
      const c0 = parseFloat(coords[0]), c1 = parseFloat(coords[1]);
      if (!isNaN(c0) && !isNaN(c1)) { lng = c0; lat = c1; }
    }
    if (lat === null && geo.Latitude) {
      const la = parseFloat(geo.Latitude), lo = parseFloat(geo.Longitude);
      if (!isNaN(la) && !isNaN(lo)) { lat = la; lng = lo; }
    }

    // סנן רק פריטים ריקים לגמרי — בלי שם, כתובת וקואורדינטות
    if (!name && !address && lat === null) return null;

    return {
      id: uid(),
      name: name || 'מקום ללא שם',
      address,
      lat,
      lng,
      website,
    };
  }).filter(Boolean);
};

/* ── Google Takeout CSV parser (תיקיית Saved — לבבות / Want to go / רשימות פרטיות) ──
   פורמט: Title,Note,URL[,Comment]   (ללא קואורדינטות — ניתן להעשיר אחרי ייבוא עם 🔍)
*/
const parseTakeoutCSV = text => {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  // פרסר CSV פשוט — תומך בשדות עם מרכאות ופסיקים פנימיים
  const parseRow = line => {
    const vals = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; } // escaped quote
        else inQ = !inQ;
      } else if (c === ',' && !inQ) { vals.push(cur); cur = ''; }
      else cur += c;
    }
    vals.push(cur);
    return vals.map(v => v.trim());
  };
  const header = parseRow(lines[0]).map(h => h.toLowerCase().trim());
  // מיפוי כותרות — תמיכה בעברית ובאנגלית
  const findCol = (...names) => { for(const n of names){ const i=header.indexOf(n); if(i>=0) return i; } return -1; };
  const titleIdx = findCol('title','כותרת','שם','name');
  const noteIdx  = findCol('note','הערה','notes','תגובה','comment');
  const urlIdx   = findCol('url','כתובת אתר','website','link','קישור','google maps url');
  if (titleIdx === -1) return []; // לא נראה כקובץ Takeout
  // דלג על שורות ריקות לחלוטין (שורה 2 בקובצי גוגל בדרך כלל ריקה)
  return lines.slice(1).map(line => {
    if (!line.trim()||line.split(',').every(c=>!c.trim())) return null;
    const v = parseRow(line);
    const name    = (v[titleIdx] || '').trim();
    const note    = noteIdx  >= 0 ? (v[noteIdx]  || '').trim() : '';
    const website = urlIdx   >= 0 ? (v[urlIdx]   || '').trim() : '';
    if (!name) return null;
    return { id: uid(), name, address: '', lat: null, lng: null, website,
             notes: note, _noCoords: true };
  }).filter(Boolean);
};

  if(!lat||!lng||!date)return null;

      <label className="label">בחר תאריך</label>
      <input type="date" className="input" value={editDate}
        onChange={e=>setEditDate(e.target.value)}
        style={{marginBottom:8}}/>

      <div style={{display:'flex',gap:6,marginBottom:12}}>
        <button className="btn btn-primary btn-sm" style={{flex:1}}
          onClick={()=>save(editDate)}>✓ שמור</button>
        <button className="btn btn-secondary btn-sm"
          onClick={()=>{const t=todayISO();setEditDate(t);save(t);}}>📅 היום</button>
      </div>

      {/* היסטוריה */}
      {log?.length>0&&<>
        <div style={{fontSize:10,fontWeight:700,color:'var(--text3)',textTransform:'uppercase',letterSpacing:'0.05em',marginBottom:6}}>היסטוריה</div>
        <div style={{display:'flex',flexDirection:'column',gap:3,maxHeight:140,overflowY:'auto'}}>
          {[...log].reverse().map((entry,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',justifyContent:'space-between',
              fontSize:11,color:i===0?color:'var(--text2)',padding:'3px 6px',
              background:i===0?`${color}18`:'var(--surface)',borderRadius:6}}>
              <span>{new Date(entry).toLocaleDateString('he-IL',{weekday:'short',day:'2-digit',month:'2-digit',year:'2-digit'})}</span>
              {i===0&&<span style={{fontSize:9,color}}>אחרון</span>}
            </div>
          ))}
        </div>
      </>}
    </div>}
  </div>;
}

function VehicleHeader({trip,theme,syncStatus,hasGh,hasFb,syncKey,onThemeToggle,onUpdate,onGoSettings}){
  const v=trip?.vehicle||{};
  const hasSync=hasGh||hasFb;
  const syncLabel=hasFb?'ענן':hasGh?'גיטהאב':'';
  const syncIcon=hasSync
    ?syncStatus==='syncing'?{i:'🔄',c:'var(--amber)',t:`מסנכרן עם ${syncLabel}...`}
    :syncStatus==='synced' ?{i:'☁️',c:'var(--green)',t:`מסונכרן עם ${syncLabel} ✓`}
    :syncStatus==='error'  ?{i:'⚠️',c:'var(--red)',  t:'שגיאת סנכרון — עבור לחיבוריות 🔗'}
    :{i:'☁️',c:'var(--text3)',t:'ממתין לסנכרון...'}
    :{i:'🔴',c:'var(--red)',t:'סנכרון לא מוגדר — לחץ להגדרה'};

  const[showQR,setShowQR]=useState(false);

  const mobileUrl=syncKey
    ?(window.location.origin+window.location.pathname.replace(/[^/]+$/,'')+`mobile.html#k=${syncKey}`)
    :null;

  const saveTracker=(dateKey,logKey,newDate)=>{
    if(!trip) return;
    const oldDate=v[dateKey]||'';
    // מוסיף לרקורד רק אם התאריך השתנה
    const newLog=newDate&&newDate!==oldDate
      ?[...(v[logKey]||[]),newDate]
      :(v[logKey]||[]);
    onUpdate({...trip,vehicle:{...trip.vehicle,[dateKey]:newDate,[logKey]:newLog}});
  };

  return <div className="vehicle-banner">
    {/* QR Modal */}
    {showQR&&mobileUrl&&<div onClick={()=>setShowQR(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.65)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div onClick={e=>e.stopPropagation()} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:'24px',display:'flex',flexDirection:'column',alignItems:'center',gap:14,minWidth:260,boxShadow:'0 8px 40px rgba(0,0,0,.6)'}}>
        <div style={{fontSize:16,fontWeight:700}}>📱 פתח במובייל</div>
        <div style={{fontSize:12,color:'var(--text3)',textAlign:'center',lineHeight:1.6}}>סרוק עם הטלפון כדי לפתוח<br/>PlanMyTrip Mobile עם הסנכרון שלך</div>
        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&color=e8eaf0&bgcolor=1a1d27&data=${encodeURIComponent(mobileUrl)}`}
          alt="QR Code" style={{width:200,height:200,borderRadius:8,border:'1px solid var(--border)'}}/>
        <div style={{fontSize:10,color:'var(--text3)',textAlign:'center',wordBreak:'break-all',maxWidth:240,opacity:.7}}>{mobileUrl}</div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-secondary btn-sm" onClick={()=>{navigator.clipboard?.writeText(mobileUrl);}} style={{fontSize:12}}>📋 העתק קישור</button>
          <button className="btn btn-secondary btn-sm" onClick={()=>setShowQR(false)}>סגור</button>
        </div>
      </div>
    </div>}

    <div style={{display:'flex',alignItems:'center',gap:8}}>
      <span style={{fontSize:24}}>🚐</span>
      <div>
        <div style={{fontSize:13,fontWeight:700}}>{v.name||'הקרוון שלי'}</div>
        <div style={{fontSize:11,color:'var(--text3)'}}>{[v.height&&`גובה:${v.height}מ`,v.width&&`רוחב:${v.width}מ`,v.plate].filter(Boolean).join(' · ')||'לא הוגדרו מידות'}</div>
      </div>
    </div>
    <div style={{display:'flex',gap:14,flex:1,justifyContent:'center',flexWrap:'wrap',alignItems:'center'}}>
      <TrackerBtn label="💧 מולאו מים" date={v.waterFillDate} color="#4f8ef7" warnDays={3}
        log={v.waterLog||[]} onSave={d=>saveTracker('waterFillDate','waterLog',d)}/>
      <TrackerBtn label="🪣 רוקן קקי" date={v.wasteEmptyDate} color="#f59e0b" warnDays={4}
        log={v.wasteLog||[]} onSave={d=>saveTracker('wasteEmptyDate','wasteLog',d)}/>
    </div>
    <div style={{display:'flex',alignItems:'center',gap:10,marginRight:'auto'}}>
      {trip&&<div style={{fontSize:12,color:'var(--text2)',textAlign:'right'}}>
        <div style={{fontWeight:600}}>{trip.name}</div>
        <div style={{color:'var(--text3)'}}>{trip.startDate||'—'} ← {trip.endDate||'—'}</div>
      </div>}
      {syncKey&&<button className="btn btn-secondary btn-icon btn-sm" title="פתח במובייל" onClick={()=>setShowQR(true)} style={{fontSize:14,padding:'5px 8px'}}>📱</button>}
      <span title={syncIcon.t} onClick={!hasSync?onGoSettings:undefined}
        style={{fontSize:14,cursor:hasSync?'default':'pointer',userSelect:'none',color:syncIcon.c,
        animation:syncStatus==='syncing'?'spin 1s linear infinite':''}}>{syncIcon.i}</span>
      <button className="btn btn-secondary btn-icon btn-sm" onClick={onThemeToggle}>{theme==='dark'?'☀️':'🌙'}</button>
      <span style={{fontSize:10,color:'var(--text3)',fontWeight:600,letterSpacing:'0.03em',userSelect:'none',opacity:.7}}>{APP_VERSION}</span>
    </div>
  </div>;
}

function MapBottomSheet({place,trip,onClose,onAddToBank,onAddToDay,onAddToDayBank,onSetDayLocation,onSaveCustomName}){
  const [editName,setEditName]=useState(place.customName||place.name||'');
  const [selDay,setSelDay]=useState('');
  const [selDayBank,setSelDayBank]=useState('');
  const [selLoc,setSelLoc]=useState('');
  const origName=place.name||'';
  useEffect(()=>{setEditName(place.customName||place.name||'');},[place.name,place.customName]);
  const days=trip?.days||[];
  const daysOpts=days.map((d,i)=><option key={d.id} value={d.id}>יום {i+1}{d.location?' — '+d.location:''}{d.date?' ('+d.date+')':''}</option>);
  const mapsUrl=mkMapsUrl(place.placeId,place.lat,place.lng,place.name);
  const shortSite=place.website?place.website.replace(/^https?:\/\/(www\.)?/,'').split('/')[0]:'';
  const price=place.priceLevel?'₪'.repeat(place.priceLevel):'';
  const isOpen=place.openStatus==='פתוח עכשיו';
  const openColor=isOpen?'#22c55e':'#ef4444';
  const handleBank=()=>{
    const cn=editName!==origName?editName:undefined;
    onAddToBank({...place,customName:cn});
    onClose();
    toast(`"${editName}" נוסף לבנק האטרקציות`,'success');
  };
  const handleDay=()=>{
    if(!selDay)return;
    onAddToDay(selDay,{...place,name:editName});
    setSelDay('');onClose();
    toast(`"${editName}" נוסף ללוז היומי ✓`,'success');
  };
  const handleDayBank=()=>{
    if(!selDayBank)return;
    onAddToDayBank(selDayBank,{id:uid(),name:editName,address:place.address||'',lat:place.lat,lng:place.lng,
      placeId:place.placeId||'',rating:place.rating,placeType:place.placeType||'',
      openStatus:place.openStatus||'',todayHours:place.todayHours||'',phone:place.phone||'',website:place.website||''});
    setSelDayBank('');onClose();
    toast(`"${editName}" נוסף לבנק היומי 📌`,'success');
  };
  const handleSetLoc=(type)=>{
    if(!selLoc)return;
    onSetDayLocation(selLoc,type,editName,place.lat,place.lng,place);
    setSelLoc('');onClose();
    toast(`"${editName}" הוגדר כנקודת ${type==='start'?'מוצא':'יעד'} ✓`,'success');
  };
  const selStyle={flex:1,border:'1px solid var(--border)',borderRadius:5,padding:'4px 6px',fontSize:11,
    fontFamily:'Heebo,Arial,sans-serif',direction:'rtl',minWidth:0,background:'var(--bg)',color:'var(--text)'};
  const addBtnStyle=(bg)=>({background:bg,color:'#fff',border:'none',borderRadius:5,padding:'4px 10px',
    fontSize:11,cursor:'pointer',fontFamily:'Heebo,Arial,sans-serif',fontWeight:600,flexShrink:0,whiteSpace:'nowrap'});
  return(
    <div style={{position:'absolute',bottom:0,left:0,right:0,zIndex:300,
      background:'var(--bg)',borderTop:'2px solid var(--accent)',
      borderRadius:'10px 10px 0 0',padding:'8px 12px 14px',
      boxShadow:'0 -4px 24px rgba(0,0,0,0.25)',
      animation:'slideUp 0.22s ease-out',
      fontFamily:'Heebo,Arial,sans-serif',direction:'rtl',
      maxHeight:'45%',overflowY:'auto'}}>
      {/* ידית + סגירה */}

        <div style={{flex:1,display:'flex',justifyContent:'center'}}>
          <div style={{width:38,height:4,background:'var(--border)',borderRadius:2,opacity:0.6}}/>
        </div>
        <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:20,
          color:'var(--text2)',padding:'0 0 0 4px',lineHeight:1}}>✕</button>
      </div>
      {/* שם */}
      <input value={editName} onChange={e=>setEditName(e.target.value)}
        style={{width:'100%',border:'none',borderBottom:'1px solid var(--border)',
          padding:'2px 0 4px',fontSize:14,fontWeight:700,
          fontFamily:'Heebo,Arial,sans-serif',direction:'rtl',
          color:'var(--text)',background:'none',outline:'none',
          boxSizing:'border-box',marginBottom:3}}/>
      {(place.customName&&place.customName!==origName)&&<div style={{fontSize:10,color:'var(--text3)',marginBottom:3}}>שם מקורי: {origName}</div>}
      {place.placeId&&editName!==(place.customName||origName)&&<button
        onClick={()=>{onSaveCustomName?.({placeId:place.placeId,customName:editName});toast(`שם נשמר: "${editName}" ✓`,'success');}}
        style={{fontSize:11,background:'var(--accent)',color:'#fff',border:'none',borderRadius:5,padding:'4px 10px',cursor:'pointer',fontFamily:'Heebo,Arial,sans-serif',fontWeight:600,marginBottom:4,display:'block'}}>
        💾 שמור שם בכל המקומות
      </button>}
      {/* סוג + דירוג + מחיר */}
      <div style={{display:'flex',alignItems:'center',gap:5,flexWrap:'wrap',marginBottom:place.address?3:5}}>
        {place.placeType&&<span style={{fontSize:11,color:'#fff',background:'#888',borderRadius:10,padding:'1px 7px'}}>{place.placeType}</span>}
        {place.rating&&<span style={{fontSize:12,color:'#f59e0b',fontWeight:700}}>★ {place.rating}</span>}
        {place.userRatingsTotal&&<span style={{fontSize:11,color:'#aaa'}}>({place.userRatingsTotal.toLocaleString()})</span>}
        {price&&<span style={{fontSize:12,color:'#22c55e',fontWeight:700}}>{price}</span>}
      </div>
      {/* כתובת */}
      {place.address&&<div style={{fontSize:11,color:'var(--text2)',marginBottom:3,lineHeight:1.3}}>{place.address}</div>}
      {/* הערות */}
      {place.notes&&<div style={{fontSize:11,color:'var(--text2)',marginBottom:3,lineHeight:1.3,background:'rgba(0,0,0,0.04)',borderRadius:5,padding:'3px 6px'}}>💬 {place.notes}</div>}
      {/* שעות */}
      {(place.openStatus||place.todayHours)&&<div style={{display:'flex',alignItems:'center',gap:6,marginBottom:5}}>
        {place.openStatus&&<span style={{fontSize:11,fontWeight:600,color:openColor}}>{isOpen?'✅':'🔴'} {place.openStatus}</span>}
        {place.todayHours&&<span style={{fontSize:10,color:'var(--text2)'}}>🕐 {place.todayHours}</span>}
      </div>}
      {/* קישורים */}
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8,flexWrap:'wrap'}}>
        {shortSite&&<a href={place.website} target="_blank" rel="noreferrer" style={{fontSize:12,color:'#1a73e8',textDecoration:'none'}}>🌐 {shortSite}</a>}
        {place.phone&&<span style={{fontSize:12,color:'var(--text2)'}}>📞 {place.phone}</span>}
        {mapsUrl&&<a href={mapsUrl} target="_blank" rel="noreferrer" style={{fontSize:12,color:'#1a73e8',textDecoration:'none'}}>↗ גוגל מפות</a>}
        {place.placeId&&!place.rating&&!place._loading&&<button onClick={()=>window.__gmShowPlace?.(place.placeId,place.lat,place.lng)} style={{fontSize:11,color:'#1a73e8',background:'none',border:'none',cursor:'pointer',padding:0,fontFamily:'Heebo,Arial,sans-serif'}}>🔄 טען פרטים</button>}
      </div>
      {/* טעינה */}
      {place._loading&&<div style={{textAlign:'center',padding:'12px 0',color:'var(--text2)',fontSize:14}}>⏳ טוען פרטי מקום...</div>}
      {/* כפתורי פעולה */}
      {!place._loading&&<div style={{display:'flex',flexDirection:'column',gap:5}}>
        <button onClick={handleBank} style={{width:'100%',background:'#f59e0b',color:'#fff',border:'none',borderRadius:6,padding:'6px 0',fontSize:12,cursor:'pointer',fontFamily:'Heebo,Arial,sans-serif',fontWeight:600}}>🌟 שמור לבנק</button>
        <div style={{display:'flex',gap:6}}>
          <select value={selDayBank} onChange={e=>setSelDayBank(e.target.value)} style={selStyle}>
            <option value="">📌 בנק יומי...</option>{daysOpts}
          </select>
          <button onClick={handleDayBank} style={addBtnStyle('#8b5cf6')}>הוסף</button>
        </div>
        <div style={{display:'flex',gap:6}}>
          <select value={selDay} onChange={e=>setSelDay(e.target.value)} style={selStyle}>
            <option value="">➕ הוסף ליום...</option>{daysOpts}
          </select>
          <button onClick={handleDay} style={addBtnStyle('#4f8ef7')}>הוסף</button>
        </div>
        <div style={{display:'flex',gap:6}}>
          <select value={selLoc} onChange={e=>setSelLoc(e.target.value)} style={selStyle}>
            <option value="">📍 קבע מוצא/יעד...</option>{daysOpts}
          </select>
          <button onClick={()=>handleSetLoc('start')} style={addBtnStyle('#22c55e')} title="קבע כנקודת מוצא">🟢</button>
          <button onClick={()=>handleSetLoc('end')} style={addBtnStyle('#ef4444')} title="קבע כנקודת יעד">🔴</button>
        </div>
      </div>}
    </div>
  );
}

  const hlDayMarkers=useRef([]), hlItemMarker=useRef(null);
  const hlDayRoutes=useRef([]), hlRouteRenderer=useRef(null);

  const [wxOpen,setWxOpen]=useState(false);
  const [wxCity,setWxCity]=useState('');
  const [wxData,setWxData]=useState(null);
  const [wxLabel,setWxLabel]=useState('');
  const [wxLoading,setWxLoading]=useState(false);
  const [mapSheet,setMapSheet]=useState(null);
  const searchBoxRef=useRef(null);

  const tripRef=useRef(trip);
  const onAddToBankRef=useRef(onAddToBank);
  const onAddToDayRef=useRef(onAddToDay);
  const onSetDayLocationRef=useRef(onSetDayLocation);
  const onUpdateBankRef=useRef(onUpdateBankItem);
  const onAddToDayBankRef=useRef(onAddToDayBank);
  const onSaveCustomNameRef=useRef(onSaveCustomName);
  const mapsKeyRef=useRef(mapsKey);
  useEffect(()=>{tripRef.current=trip;},[trip]);
  useEffect(()=>{onAddToBankRef.current=onAddToBank;},[onAddToBank]);
  useEffect(()=>{onAddToDayRef.current=onAddToDay;},[onAddToDay]);
  useEffect(()=>{onSetDayLocationRef.current=onSetDayLocation;},[onSetDayLocation]);
  useEffect(()=>{onUpdateBankRef.current=onUpdateBankItem;},[onUpdateBankItem]);
  useEffect(()=>{onAddToDayBankRef.current=onAddToDayBank;},[onAddToDayBank]);
  useEffect(()=>{onSaveCustomNameRef.current=onSaveCustomName;},[onSaveCustomName]);
  useEffect(()=>{mapsKeyRef.current=mapsKey;},[mapsKey]);

  useEffect(()=>{
    if (!mapsKey) return;
    if (window.google?.maps){setReady(true);return;}
    if (document.getElementById('gmaps-script')) return;
    window.__gmapsReady=()=>setReady(true);
    const s=document.createElement('script');
    s.id='gmaps-script';
    s.src=`https://maps.googleapis.com/maps/api/js?key=${mapsKey}&libraries=places&language=he&region=IL&callback=__gmapsReady`;
    s.async=true;
    s.onerror=()=>toast('נכשל טעינת מפות גוגל — בדוק את מפתח ה-API','error');
    document.head.appendChild(s);
  },[mapsKey]);

  useEffect(()=>{

        lat:pin.lat,lng:pin.lng,placeId:pin.placeId||null,
        rating:pin.placeRating||null,placeType:pin.placeType||'',notes:pin.notes||''});
    };
    if (startPin?.lat&&startPin?.lng){
      const m=new window.google.maps.Marker({
        position:{lat:startPin.lat,lng:startPin.lng},
        map:mapInst.current,
        icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:18,fillColor:'#16a34a',fillOpacity:1,strokeColor:'#fff',strokeWeight:3},
        title:startPin.customName||startPin.title||'מוצא',
        zIndex:102,
      });
      m.addListener('click',_mkClick(startPin,'נקודת מוצא'));
      bounds.extend({lat:startPin.lat,lng:startPin.lng});
      hlDayMarkers.current.push(m);
    }
    // פעילויות ממוספרות
    regularBlocks.forEach((block,i)=>{
      const m=new window.google.maps.Marker({
        position:{lat:block.lat,lng:block.lng},
        map:mapInst.current,
        label:{text:String(i+1),color:'#fff',fontSize:'13px',fontWeight:'bold'},
        icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:18,fillColor:color,fillOpacity:1,strokeColor:'#fff',strokeWeight:3},
        title:`${i+1}. ${block.customName||block.title||''}`,
        zIndex:100,
      });
      m.addListener('click',_mkClick(block,'פעילות'));
      bounds.extend({lat:block.lat,lng:block.lng});
      hlDayMarkers.current.push(m);
    });
    // נקודת סיום
    if (endPin?.lat&&endPin?.lng){
      const m=new window.google.maps.Marker({
        position:{lat:endPin.lat,lng:endPin.lng},
        map:mapInst.current,
        icon:{path:window.google.maps.SymbolPath.CIRCLE,scale:18,fillColor:'#dc2626',fillOpacity:1,strokeColor:'#fff',strokeWeight:3},
        title:endPin.customName||endPin.title||'יעד',
        zIndex:102,
      });
      m.addListener('click',_mkClick(endPin,'נקודת יעד'));
      bounds.extend({lat:endPin.lat,lng:endPin.lng});
      hlDayMarkers.current.push(m);
    }
    if (allPins.length===1){
      mapInst.current.panTo({lat:allPins[0].lat,lng:allPins[0].lng});
      mapInst.current.setZoom(15);
    } else {
      mapInst.current.fitBounds(bounds,{top:60,right:60,bottom:60,left:60});
    }
    // ── מסלולים בין עצירות ──
    if(window.google.maps.DirectionsService&&highlightDay.blocks){
      const sortedAll=[...highlightDay.blocks].sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
      // רצף מסודר: מוצא → פעילויות לפי זמן → יעד
      const coordSeq=[];
      if(startPin?.lat&&startPin?.lng)coordSeq.push(startPin);
      regularBlocks.forEach(b=>coordSeq.push(b));
      if(endPin?.lat&&endPin?.lng)coordSeq.push(endPin);
      for(let ci=0;ci<coordSeq.length-1;ci++){
        const from=coordSeq[ci],to=coordSeq[ci+1];
        // מצא בלוק נסיעה בין שני האתרים
        const travelBlock=sortedAll.find(b=>b.isAutoTravel&&
          (b.startTime||'')>=(from.startTime||'00:00')&&
          (b.startTime||'')<(to.startTime||'23:59'));
        if(!travelBlock)continue;
        const tMode=travelBlock.isTransit
          ?window.google.maps.TravelMode.TRANSIT
          :travelBlock.isWalking
            ?window.google.maps.TravelMode.WALKING
            :window.google.maps.TravelMode.DRIVING;
        const renderer=new window.google.maps.DirectionsRenderer({
          suppressMarkers:true,
          polylineOptions:{strokeColor:color,strokeWeight:4,strokeOpacity:0.65},
          map:mapInst.current
        });
        hlDayRoutes.current.push(renderer);
        new window.google.maps.DirectionsService().route({
          origin:{lat:from.lat,lng:from.lng},
          destination:{lat:to.lat,lng:to.lng},
          travelMode:tMode,
          ...(tMode===window.google.maps.TravelMode.TRANSIT?{transitOptions:{departureTime:new Date()}}:{})
        },(result,status)=>{
          if(status==='OK'&&result?.routes?.length){
            renderer.setDirections(result);
          } else {
            // fallback: קו מקווקו ישיר
            renderer.setMap(null);
            if(mapInst.current){
              const poly=new window.google.maps.Polyline({
                path:[{lat:from.lat,lng:from.lng},{lat:to.lat,lng:to.lng}],
                strokeColor:color,strokeWeight:3,strokeOpacity:0.5,
                icons:[{icon:{path:'M 0,-1 0,1',strokeOpacity:1,scale:3},offset:'0',repeat:'12px'}],
                map:mapInst.current
              });
              hlDayRoutes.current.push(poly);
            }
          }
        });
      }
    }
  },[highlightDay,ready]);

  // הצגת מסלול נסיעה ספציפי (לחיצה על חלונית נסיעה בלוז)
  useEffect(()=>{
    if(hlRouteRenderer.current){try{hlRouteRenderer.current.setMap(null);}catch(e){}  hlRouteRenderer.current=null;}
    if(!routeHighlight||!mapInst.current||!window.google?.maps?.DirectionsService)return;
    const{fromLat,fromLng,toLat,toLng,isTransit,isWalking}=routeHighlight;
    if(!fromLat||!fromLng||!toLat||!toLng)return;
    const tMode=isTransit?window.google.maps.TravelMode.TRANSIT:isWalking?window.google.maps.TravelMode.WALKING:window.google.maps.TravelMode.DRIVING;
    const renderer=new window.google.maps.DirectionsRenderer({
      suppressMarkers:true,
      polylineOptions:{strokeColor:'#4f8ef7',strokeWeight:6,strokeOpacity:0.9},
      map:mapInst.current
    });
    hlRouteRenderer.current=renderer;
    new window.google.maps.DirectionsService().route({
      origin:{lat:fromLat,lng:fromLng},
      destination:{lat:toLat,lng:toLng},
      travelMode:tMode,
      ...(isTransit?{transitOptions:{departureTime:new Date()}}:{})
    },(result,status)=>{
      if(status==='OK'&&result?.routes?.length){
        renderer.setDirections(result);
        const leg=result.routes[0].legs[0];
        if(leg&&mapInst.current){
          const b=new window.google.maps.LatLngBounds();
          leg.steps.forEach(s=>{b.extend(s.start_location);b.extend(s.end_location);});
          mapInst.current.fitBounds(b,{top:60,right:60,bottom:60,left:60});
        }
      } else {
        renderer.setMap(null);
        if(mapInst.current){
          hlRouteRenderer.current=new window.google.maps.Polyline({
            path:[{lat:fromLat,lng:fromLng},{lat:toLat,lng:toLng}],
            strokeColor:'#4f8ef7',strokeWeight:5,strokeOpacity:0.85,
            map:mapInst.current
          });
          const b=new window.google.maps.LatLngBounds();
          b.extend({lat:fromLat,lng:fromLng});b.extend({lat:toLat,lng:toLng});
          mapInst.current.fitBounds(b,{top:80,right:80,bottom:80,left:80});
        }
      }
    });
  },[routeHighlight,ready]);

  // הדגשת פריט בודד — סיכה אדומה רגילה מנפנפת
  useEffect(()=>{
    if (hlItemMarker.current){hlItemMarker.current.setMap(null);hlItemMarker.current=null;}
    if (!highlightItem||!mapInst.current||!window.google?.maps) return;
    const m=new window.google.maps.Marker({
      position:{lat:highlightItem.lat,lng:highlightItem.lng},
      map:mapInst.current,
      title:highlightItem.customName||highlightItem.name||'',
      // ללא icon מותאם = סיכה אדומה ברירת מחדל של גוגל מפות
      animation:window.google.maps.Animation.BOUNCE,
      zIndex:200,
    });
    setTimeout(()=>{if(m.getMap())m.setAnimation(null);},1800);
    mapInst.current.panTo({lat:highlightItem.lat,lng:highlightItem.lng});
    if (mapInst.current.getZoom()<15) mapInst.current.setZoom(15);
    hlItemMarker.current=m;
  },[highlightItem,ready]);

  if (!mapsKey) return (
    <div className="empty-state" style={{height:'100%',background:'var(--bg)'}}>
      <div className="emoji">🗺️</div>
      <div style={{fontWeight:600,color:'var(--text)'}}>מפות גוגל לא מוגדרות</div>
      <p>עבור להגדרות ⚙️ והזן מפתח API של גוגל מפות.</p>
    </div>
  );

  const fetchWxByCity=async(cityQ)=>{
    const q=(cityQ||wxCity).trim(); if (!q) return;
    setWxLoading(true);
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=he&format=json`);
      const d=await r.json();
      const loc=d.results?.[0]; if (!loc){toast('עיר לא נמצאה','error');return;}
      const w=await fetchWeather(loc.latitude,loc.longitude);
      setWxData(w); setWxLabel(loc.name||q);
    }catch{toast('שגיאה בטעינת מזג אוויר','error');}
    finally{setWxLoading(false);}
  };

  const WMO_MAP={0:['☀️','בהיר'],1:['🌤️','בהיר בעיקר'],2:['⛅','מעונן חלקית'],3:['☁️','מעונן'],45:['🌫️','ערפל'],48:['🌫️','ערפל'],51:['🌦️','טפטוף קל'],53:['🌦️','טפטוף'],55:['🌧️','טפטוף כבד'],61:['🌧️','גשם קל'],63:['🌧️','גשם'],65:['🌧️','גשם כבד'],71:['🌨️','שלג קל'],73:['🌨️','שלג'],75:['❄️','שלג כבד'],80:['🌦️','מקלחות'],95:['⛈️','סערה'],96:['⛈️','סערה עם ברד'],99:['⛈️','סערה חזקה']};

  return <div style={{height:'100%',width:'100%',position:'relative',display:'flex',flexDirection:'column'}}>
    {/* pick mode banner */}
    {mapPickLabel&&(
      <div style={{position:'absolute',top:0,left:0,right:0,zIndex:200,
        background:'rgba(20,30,80,.95)',backdropFilter:'blur(4px)',
        padding:'10px 14px',display:'flex',alignItems:'center',gap:10,
        boxShadow:'0 4px 16px rgba(0,0,0,.4)',borderBottom:'2px solid var(--accent)'}}>
        <span style={{flex:1,color:'#fff',fontWeight:700,fontSize:14,lineHeight:1.3}}>{mapPickLabel}</span>
        <button onClick={onCancelMapPick}
          className="btn btn-sm"
          style={{background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.3)',
            color:'#fff',flexShrink:0}}>
          ביטול
        </button>
      </div>
    )}
    <div style={{padding:'8px',background:'var(--bg2)',borderBottom:'1px solid var(--border)',display:'flex',gap:6,alignItems:'center'}}>
      <input id="map-search-input" className="input" placeholder="🔍 חפש מקום, עיר, מלון, אטרקציה… (Enter)" style={{fontSize:13,flex:1}}/>
      <button className="btn btn-secondary btn-sm" onClick={()=>window.__gmSearch?.()}>חפש</button>
      <button className="btn btn-secondary btn-sm" title="נקה תוצאות חיפוש" onClick={()=>window.__gmClearSearch?.()}>✕</button>
      <button className="btn btn-secondary btn-sm" title="מיקום נוכחי" onClick={()=>window.__gmCurrentLoc?.()}>📍</button>
      <button className="btn btn-secondary btn-sm" title="מזג אוויר" onClick={()=>setWxOpen(o=>!o)}
        style={{background:wxOpen?'var(--accent)':undefined,color:wxOpen?'#fff':undefined}}>🌤️</button>
    </div>
    {wxOpen&&<div style={{background:'var(--bg2)',borderBottom:'1px solid var(--border)',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
      <div style={{display:'flex',gap:6,alignItems:'center'}}>
        <input className="input" style={{flex:1,fontSize:12}} value={wxCity} onChange={e=>setWxCity(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&fetchWxByCity()}
          placeholder="הקלד עיר — אילת, תל אביב, פריז…"/>
        <button className="btn btn-primary btn-sm" onClick={()=>fetchWxByCity()} disabled={wxLoading||!wxCity.trim()}>
          {wxLoading?'⏳':'חפש'}
        </button>
        {trip?.days?.find(d=>d.coordinates)&&<button className="btn btn-secondary btn-sm" title="מיקום יום ראשון"
          onClick={async()=>{
            const day=trip.days.find(d=>d.coordinates);
            if (!day) return;
            setWxLoading(true);
            try{const w=await fetchWeather(day.coordinates.lat,day.coordinates.lng);setWxData(w);setWxLabel(day.location||`יום 1`);}
            catch{}finally{setWxLoading(false);}
          }}>📍 יום ראשון</button>}
      </div>
      {wxData&&(()=>{
        const code=wxData.current_weather?.weathercode;
        const [icon,desc]=WMO_MAP[code]||['🌡️','לא ידוע'];
        const temp=Math.round(wxData.current_weather?.temperature);
        const days=(wxData.daily?.time||[]).slice(0,5);
        return <div>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
            <span style={{fontSize:28}}>{icon}</span>
            <div><div style={{fontSize:18,fontWeight:700,color:'var(--text)'}}>{temp}°C</div>
              <div style={{fontSize:11,color:'var(--text2)'}}>{desc}{wxLabel?` — ${wxLabel}`:''}</div></div>
          </div>
          <div style={{display:'flex',gap:6,overflowX:'auto'}}>
            {days.map((date,i)=>{
              const c=wxData.daily?.weathercode?.[i];
              const [di]=WMO_MAP[c]||['🌡️'];
              const mn=Math.round(wxData.daily?.temperature_2m_min?.[i]);
              const mx=Math.round(wxData.daily?.temperature_2m_max?.[i]);
              const d=new Date(date);
              const dayName=['א','ב','ג','ד','ה','ו','ש'][d.getDay()];
              return <div key={date} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,padding:'6px 10px',textAlign:'center',minWidth:52,fontSize:11,color:'var(--text2)'}}>
                <div style={{fontWeight:600,color:'var(--text)'}}>יום {dayName}</div>
                <div style={{fontSize:18,margin:'2px 0'}}>{di}</div>
                <div>{mx}°/{mn}°</div>
              </div>;
            })}
          </div>
        </div>;
      })()}
    </div>}
    {mapSheet&&<MapBottomSheet
      place={mapSheet}
      trip={trip}
      onClose={()=>setMapSheet(null)}
      onAddToBank={p=>onAddToBankRef.current?.(p)}
      onAddToDay={(dayId,p)=>onAddToDayRef.current?.(dayId,p)}
      onAddToDayBank={(dayId,p)=>onAddToDayBankRef.current?.(dayId,p)}
      onSetDayLocation={(dayId,type,name,lat,lng,p)=>onSetDayLocationRef.current?.(dayId,type,name,lat,lng,p)}
      onSaveCustomName={p=>onSaveCustomNameRef.current?.(p.placeId,null,p.customName)}
    />}
    <div ref={mapRef} style={{flex:1,width:'100%'}}/>
  </div>;
}

/* ══════════════════════════════════
   מזג אוויר
══════════════════════════════════ */
function Weather({coordinates,location}){
  const[w,setW]=useState(null),[loading,setL]=useState(false);
  const[customCoords,setCustomCoords]=useState(null),[customLabel,setCustomLabel]=useState('');
  const[searchInput,setSearchInput]=useState('');
  const effCoords=customCoords||coordinates;
  const effLabel=customLabel||(customCoords?'':location);

  // ברירת מחדל: מיקום נוכחי אם אין קואורדינטות ליום
  useEffect(()=>{
    if(coordinates?.lat||customCoords) return;
    navigator.geolocation?.getCurrentPosition(
      pos=>{setCustomCoords({lat:pos.coords.latitude,lng:pos.coords.longitude});setCustomLabel('המיקום הנוכחי שלי');},
      ()=>{}
    );
  },[]);

  useEffect(()=>{
    if(!effCoords?.lat) return; setL(true);
    fetchWeather(effCoords.lat,effCoords.lng).then(setW).catch(()=>setW(null)).finally(()=>setL(false));
  },[effCoords?.lat,effCoords?.lng]);

  const searchPlace=async()=>{
    const q=searchInput.trim(); if(!q) return;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=1&accept-language=he`,{headers:{'Accept-Language':'he'}});
      const d=await r.json();
      if(d[0]){setCustomCoords({lat:parseFloat(d[0].lat),lng:parseFloat(d[0].lon)});setCustomLabel(d[0].display_name.split(',')[0]);setSearchInput('');}
    }catch{}
  };

  const[icon,desc]=WMO[w?.current_weather?.weathercode]||['🌡️','לא ידוע'];
  return <div className="weather-card" style={{marginBottom:8,padding:'6px 10px'}}>
    {/* שורה 1: חיפוש + מצב נוכחי */}
    <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:w?3:0}}>
      <input value={searchInput} onChange={e=>setSearchInput(e.target.value)}
        onKeyDown={e=>e.key==='Enter'&&searchPlace()}
        placeholder="מיקום..."
        style={{width:72,background:'rgba(255,255,255,.15)',border:'1px solid rgba(255,255,255,.25)',borderRadius:5,padding:'2px 6px',fontSize:10,color:'inherit',fontFamily:'Heebo,sans-serif',direction:'rtl'}}/>
      <button onClick={searchPlace} style={{background:'rgba(255,255,255,.2)',border:'none',borderRadius:5,padding:'2px 5px',cursor:'pointer',fontSize:11,lineHeight:1}}>🔍</button>
      {loading&&<span style={{fontSize:11,opacity:.7}}>⏳</span>}
      {!loading&&!w&&<span style={{fontSize:10,opacity:.5,flex:1}}>אין נתונים</span>}
      {w&&<>
        <span style={{fontSize:18,lineHeight:1}}>{icon}</span>
        <span style={{fontSize:13,fontWeight:700,lineHeight:1}}>{Math.round(w.current_weather?.temperature)}°C</span>
        <span style={{fontSize:10,opacity:.7,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{desc}{effLabel?` · ${effLabel}`:''}</span>
      </>}
    </div>
    {/* שורה 2: תחזית 3 ימים */}
    {w&&<div style={{display:'flex',gap:4}}>
      {(w.daily?.time||[]).slice(0,3).map((date,i)=>{
        const[di]=WMO[w.daily.weathercode[i]]||['🌡️'];
        return <div key={date} style={{flex:1,background:'rgba(255,255,255,.1)',borderRadius:5,padding:'2px 5px',textAlign:'center',lineHeight:1.3}}>
          <span style={{fontSize:9,opacity:.65}}>{new Date(date).toLocaleDateString('he-IL',{weekday:'short'})} </span>
          <span style={{fontSize:14}}>{di}</span>
          <span style={{fontSize:10,fontWeight:600}}> {Math.round(w.daily.temperature_2m_max[i])}°</span>
          <span style={{fontSize:9,opacity:.55}}>/{Math.round(w.daily.temperature_2m_min[i])}°</span>
        </div>;
      })}
    </div>}
  </div>;
}

/* ══════════════════════════════════
   מודל עריכת בלוק
══════════════════════════════════ */
function BlockModal({block,onSave,onClose,onDelete,prevEndTime,onCascadeSave,onCascadeSaveUnlink,onPickFromMap}){
  const[b,setB]=useState({...block});
  const[timeError,setTimeError]=useState(false);
  const[unlinkPrompt,setUnlinkPrompt]=useState(false);
  const origStartTime=useRef(block.startTime);
  const toM=t=>{const[h,m]=(t||'00:00').split(':').map(Number);return h*60+m;};
  const upd=(k,v)=>{
    setB(p=>({...p,[k]:v}));
    if(k==='startTime'){setTimeError(false);setUnlinkPrompt(false);}
  };
  const hasPlaceInfo=!!(b.placeRating||b.placeOpenStatus||b.placeTodayHours||b.placePhone||b.placeWebsite||b.placeType);
  const doSave=(unlink=false)=>{
    // בחר את פונקציית השמירה הנכונה
    if(unlink&&onCascadeSaveUnlink){onCascadeSaveUnlink(b);}
    else if(onCascadeSave&&(b.startTime!==origStartTime.current||b.durationMins!==block.durationMins)){
      onCascadeSave(b); // cascade אוטומטי כשמשתנים זמנים
    }else{onSave(b);}
    onClose();
  };
  const handleSave=()=>{
    if(prevEndTime){
      const prevMins=toM(prevEndTime),newMins=toM(b.startTime);
      // כלל 1: חפיפה עם פעילות קודמת — אסור
      if(newMins<prevMins){setTimeError(true);return;}
      setTimeError(false);
      // כלל 2: היה מקושר ועכשיו נוצר פער — שאל על ניתוק
      const wasLinked=origStartTime.current===prevEndTime;
      if(wasLinked&&newMins>prevMins){setUnlinkPrompt(true);return;}
    }
    doSave(false);
  };
  return <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
    <div className="modal" style={{maxHeight:'90vh',display:'flex',flexDirection:'column'}}>
      <div className="modal-header" style={{flexShrink:0}}>
        <span style={{fontWeight:700,fontSize:15}}>{BLOCK_EMOJI[b.type]} עריכת בלוק</span>
        <button className="btn btn-secondary btn-icon btn-sm" onClick={onClose}>✕</button>
      </div>
      <div className="modal-body" style={{display:'flex',flexDirection:'column',gap:14,overflowY:'auto',flex:1}}>
        <div><label className="label">סוג</label>
          <select className="input" value={b.type} onChange={e=>upd('type',e.target.value)}>
            {BLOCK_TYPES.map(t=><option key={t} value={t}>{BLOCK_EMOJI[t]} {BLOCK_HE[t]}</option>)}
          </select></div>
        <div><label className="label">כותרת</label>
          <input className="input" value={b.title} onChange={e=>upd('title',e.target.value)} placeholder="למשל: נסיעה לפירנצה" autoFocus/></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div><label className="label">שעת התחלה</label>
            <input className="input" type="time" value={b.startTime} onChange={e=>upd('startTime',e.target.value)}/>
            {prevEndTime&&!unlinkPrompt&&toM(b.startTime)>toM(prevEndTime)&&<div style={{fontSize:10,color:'var(--amber)',marginTop:3}}>
              🔗 הפעילות הקודמת מסתיימת ב-{prevEndTime}
              <button onClick={()=>upd('startTime',prevEndTime)}
                style={{marginRight:5,fontSize:10,padding:'1px 6px',borderRadius:4,border:'1px solid var(--amber)',background:'rgba(234,179,8,.12)',color:'var(--amber)',cursor:'pointer',fontFamily:'Heebo,sans-serif'}}>סנכרן</button>
            </div>}
          </div>
          <div><label className="label">משך (דקות)</label>

        </div>
        <div><label className="label">מיקום</label>
          <div style={{display:'flex',gap:6}}>
            <input className="input" style={{flex:1}} value={b.location||''} onChange={e=>upd('location',e.target.value)} placeholder="שם המיקום (אופציונלי)"/>
            {onPickFromMap&&!b.isAutoTravel&&(
              <button type="button" title="בחר מיקום על המפה"
                onClick={()=>onPickFromMap(`📍 ${b.title||'פעילות'}`,place=>{
                  if(place.lat)upd('lat',place.lat);
                  if(place.lng)upd('lng',place.lng);
                  if(place.name)upd('location',place.name);
                  if(place.address&&!place.name)upd('location',place.address);
                })}
                style={{padding:'0 10px',border:'1px solid var(--border)',borderRadius:6,background:'var(--bg3)',cursor:'pointer',fontSize:15,flexShrink:0,color:'var(--accent)'}}>📍</button>
            )}
          </div>
          {(b.lat||b.lng)&&(
            <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4,fontSize:11}}>
              <span style={{color:'var(--text3)',flex:1}}>📐 {b.lat?.toFixed(5)}, {b.lng?.toFixed(5)}</span>
              {!b.isAutoTravel&&<button type="button" onClick={()=>{upd('lat',null);upd('lng',null);}}
                style={{padding:'1px 7px',border:'1px solid rgba(239,68,68,.4)',borderRadius:4,
                  background:'rgba(239,68,68,.08)',color:'var(--red)',cursor:'pointer'}}>✕ נקה</button>}
            </div>
          )}
        </div>
        <div><label className="label">עלות (₪)</label>
          <input className="input" type="number" min="0" step="1" value={b.cost} onChange={e=>upd('cost',parseFloat(e.target.value)||0)}/></div>
        {/* הערות — מסונכרנות עם הבנק אם יש placeId */}
        <div>
          <label className="label">📝 הערות{b.placeId?' (מסונכרנות עם הבנק)':''}</label>
          <textarea className="input" rows={3} value={b.notes||''} onChange={e=>upd('notes',e.target.value)}
            placeholder="הערות, טיפים, מה לא לפספס…"/>
        </div>
        <div><label className="label">דירוג הנאה</label><Stars value={b.rating} onChange={v=>upd('rating',v)}/></div>
        <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',fontSize:13}}>
          <input type="checkbox" checked={b.isCompleted} onChange={e=>upd('isCompleted',e.target.checked)} style={{accentColor:'var(--green)'}}/>
          סמן כהושלם
        </label>
        {/* מידע מגוגל — readonly */}
        {hasPlaceInfo&&<div style={{background:'var(--bg3)',borderRadius:10,padding:'10px 12px',
          border:'1px solid var(--border)'}}>
          <div style={{fontSize:11,fontWeight:700,color:'var(--text2)',marginBottom:6}}>📍 מידע מגוגל (קריאה בלבד)</div>
          {b.placeType&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>{b.placeType}</div>}
          {b.placeRating&&<div style={{fontSize:12,color:'var(--amber)',marginBottom:3}}>⭐ {b.placeRating}{b.placeUserRatings?` (${Number(b.placeUserRatings).toLocaleString()} ביקורות)`:''}</div>}
          {b.placeOpenStatus&&<div style={{fontSize:12,fontWeight:600,marginBottom:3,color:b.placeOpenStatus==='פתוח עכשיו'?'var(--green)':'var(--red)'}}>
            {b.placeOpenStatus==='פתוח עכשיו'?'✅':'🔴'} {b.placeOpenStatus}</div>}
          {b.placeTodayHours&&<div style={{fontSize:11,color:'var(--text3)',marginBottom:3}}>🕐 {b.placeTodayHours}</div>}
          {b.placePhone&&<div style={{fontSize:11,color:'var(--accent)',marginBottom:3}}>📞 {b.placePhone}</div>}
          {b.placeWebsite&&<a href={b.placeWebsite} target="_blank" rel="noreferrer"
            style={{fontSize:11,color:'var(--accent)',display:'block'}} onClick={e=>e.stopPropagation()}>
            🌐 {b.placeWebsite.replace(/^https?:\/\//,'').split('/')[0]}</a>}
        </div>}
      </div>
      {timeError&&<div style={{background:'rgba(239,68,68,.15)',border:'1px solid var(--red)',borderRadius:8,padding:'8px 12px',margin:'0 0 8px',flexShrink:0}}>
        <div style={{fontSize:12,color:'var(--red)',fontWeight:700}}>⛔ חפיפה עם הפעילות הקודמת — הפעילות הקודמת מסתיימת ב-{prevEndTime}</div>
      </div>}
      {unlinkPrompt&&<div style={{background:'rgba(234,179,8,.12)',border:'1px solid var(--amber)',borderRadius:8,padding:'8px 12px',margin:'0 0 8px',flexShrink:0}}>
        <div style={{fontSize:12,color:'var(--amber)',fontWeight:700,marginBottom:4}}>🔓 שינוי יוצר פער מהפעילות הקודמת</div>

        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-sm" style={{background:'var(--amber)',color:'#000',border:'none',flex:1}} onClick={()=>doSave(true)}>כן, נתק ועדכן הבאים ↕</button>

      <div className="modal-footer" style={{flexShrink:0}}>
        {onDelete&&<button className="btn btn-danger btn-sm" onClick={onDelete}>🗑 מחק</button>}

      </div>
    </div>
  </div>;
}

function BlockItem({block,interestBank,onEdit,onDelete,onMoveToBank,onMoveToDayBank,onFocusItem,onFocusRoute,onNoteChange,onSwap,dragging,dragOver,onDragStart,onDragOver,onDrop,onDragEnd,nowProgress,mapNum}){

  const col=BLOCK_COLOR[block.type]||'var(--text3)';
  // look up bank item for display fallback (try placeId first, then lat/lng)
  const bank=interestBank||[];
  const bankInfo=block.placeId
    ?bank.find(i=>i.placeId&&i.placeId===block.placeId)
    :(block.lat&&block.lng?bank.find(i=>i.lat&&Math.abs(i.lat-block.lat)<0.0001&&Math.abs(i.lng-block.lng)<0.0001):null);
  const dispRating=block.placeRating??bankInfo?.rating??null;
  const dispOpenStatus=block.placeOpenStatus||bankInfo?.openStatus||'';
  const dispTodayHours=block.placeTodayHours||bankInfo?.todayHours||'';
  const dispPhone=block.placePhone||bankInfo?.phone||'';
  const dispWebsite=block.placeWebsite||bankInfo?.website||'';
  const locked=!!block.isAutoTravel; // נסיעות אוטומטיות לא ניתנות לגרירה
  const btnStyle={background:'none',border:'none',cursor:'pointer',padding:'2px 5px',borderRadius:4,fontSize:15,lineHeight:1,flexShrink:0};
  const[noteOpen,setNoteOpen]=React.useState(false);
  const[noteVal,setNoteVal]=React.useState(bankInfo?.note||block.notes||'');
  const toggleNote=()=>{if(!noteOpen)setNoteVal(bankInfo?.note||block.notes||'');setNoteOpen(o=>!o);};
  return <div className="timeline-block" draggable={!locked}
    onDragStart={locked?null:onDragStart} onDragOver={onDragOver} onDrop={onDrop} onDragEnd={locked?null:onDragEnd}
    style={{opacity:dragging?0.35:1,transition:'opacity .15s',borderTop:dragOver?'2px solid var(--accent)':'2px solid transparent'}}>
    <div className="timeline-dot" style={{background:col,cursor:locked?'default':'grab'}} title={locked?'נסיעה אוטומטית — לא ניתן להזזה':'גרור לשינוי סדר'}>{locked?'🔒':'☰'}</div>
    <div className={`card block-${block.type}`} style={{flex:1,marginRight:4,opacity:block.isCompleted?0.6:1,position:'relative',overflow:'hidden'}}>
      <div style={{padding:'8px 12px'}}>
        {/* שורת כותרת: שעה + כפתורי פעולה */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:6,marginBottom:4}}>
          <div style={{display:'flex',alignItems:'center',gap:5,flexShrink:0}}>
            {mapNum!=null&&<span style={{display:'inline-flex',alignItems:'center',justifyContent:'center',minWidth:18,height:18,borderRadius:9,background:'var(--accent)',color:'#fff',fontSize:10,fontWeight:700,padding:'0 4px',lineHeight:1,flexShrink:0}}>{mapNum}</span>}
            <span style={{fontSize:11,fontWeight:700,color:col}}>{block.startTime}–{end}</span>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:2}}>
            {block.isCompleted&&<span className="chip chip-green" style={{fontSize:10,padding:'2px 6px'}}>✓</span>}
            {block.rating>0&&<Stars value={block.rating} size={12}/>}
            {locked&&onFocusRoute&&(
              <button style={{...btnStyle,color:'#4f8ef7'}} title="הצג מסלול נסיעה על המפה"
                onClick={e=>{e.stopPropagation();onFocusRoute(block);}}>🗺️</button>
            )}
            {block.lat&&onFocusItem&&(
              <button style={{...btnStyle,color:'#4f8ef7'}} title="הצג במפה הפנימית"
                onClick={e=>{e.stopPropagation();onFocusItem(block.lat,block.lng,block.customName||block.title);}}>🗺️</button>
            )}
            {(block.lat||block.placeId)&&(
              <GLink url={mkMapsUrl(block.placeId,block.lat,block.lng,block.customName||block.title)}
                style={{marginRight:0}} onClick={e=>e.stopPropagation()}/>
            )}
            {onMoveToBank&&(
              <button style={{...btnStyle,color:'#f59e0b'}} title="העבר לבנק האטרקציות"
                onClick={e=>{e.stopPropagation();onMoveToBank(block);}}>⭐</button>
            )}
            {onSwap&&!block.isAutoTravel&&(
              <button style={{...btnStyle,color:'#d97706',fontWeight:700,background:'rgba(245,158,11,.15)',borderRadius:5}}
                title="החלף עם פעילות מהבנק היומי"
                onClick={e=>{e.stopPropagation();onSwap(block);}}>🔄</button>
            )}
            {onNoteChange&&<button style={{...btnStyle,color:(bankInfo?.note||block.notes)?'var(--accent)':'#6b7280'}}
              title="הוסף הערה מהירה"
              onClick={e=>{e.stopPropagation();toggleNote();}}>📝</button>}
            <button style={{...btnStyle,color:'#6b7280'}} title="ערוך פרטים"
              onClick={e=>{e.stopPropagation();onEdit(block);}}>✏️</button>
            {onMoveToDayBank&&!block.isAutoTravel&&(
              <button style={{...btnStyle,color:'#8b5cf6'}} title="החזר לבנק היומי"
                onClick={e=>{e.stopPropagation();onMoveToDayBank(block);}}>📌</button>
            )}
            {onDelete&&(
              <button style={{...btnStyle,color:'#ef4444',fontWeight:700,fontSize:13}} title="הסר מהיום"
                onClick={e=>{e.stopPropagation();if(window.confirm(`להסיר "${block.customName||block.title||'פעילות'}" מהיום?`))onDelete(block.id);}}>✕</button>
            )}
          </div>
        </div>
        {/* תוכן */}
        <div style={{fontSize:13,fontWeight:600,color:'var(--text)',cursor:'pointer',display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}} onClick={()=>onEdit(block)}>
          {BANK_SRC_PICKER[bankInfo?._listSource]&&<span style={{fontSize:12,opacity:.8}} title={bankInfo._listSource}>{BANK_SRC_PICKER[bankInfo._listSource].emoji}</span>}
          {block.customName||block.title||`(${BLOCK_HE[block.type]} ללא שם)`}
        </div>
        {block.placeType&&<div style={{fontSize:10,color:'var(--text3)',marginTop:1,lineHeight:1.4}}>{block.placeType}</div>}
        {block.location&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>📍 {block.location}</div>}
        {(bankInfo?.note||block.notes)&&<div style={{fontSize:11,color:'var(--text2)',marginTop:4,fontStyle:'italic',lineHeight:1.5}}>{bankInfo?.note||block.notes}</div>}
        {/* פרטי מקום שנשמרו — עם fallback לבנק האטרקציות */}
        {dispRating&&<div style={{fontSize:11,color:'var(--amber)',marginTop:3}}>⭐ {dispRating}{block.placeUserRatings?` (${Number(block.placeUserRatings).toLocaleString()})`:''}</div>}
        {dispOpenStatus&&<div style={{fontSize:11,fontWeight:600,marginTop:2,color:dispOpenStatus==='פתוח עכשיו'?'#22c55e':'#ef4444'}}>{dispOpenStatus==='פתוח עכשיו'?'✅':'🔴'} {dispOpenStatus}</div>}
        {dispTodayHours&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>🕐 {dispTodayHours}</div>}
        {dispPhone&&<div style={{fontSize:11,color:'var(--accent)',marginTop:2}}>📞 {dispPhone}</div>}
        {dispWebsite&&<a href={dispWebsite} target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--accent)',display:'block',marginTop:2}} onClick={e=>e.stopPropagation()}>🌐 {dispWebsite.replace(/^https?:\/\//,'').split('/')[0]}</a>}
        <div style={{display:'flex',gap:10,marginTop:5,flexWrap:'wrap'}}>
          {block.durationMins>0&&<span style={{fontSize:11,color:'var(--text3)'}}>⏱ {block.durationMins} דקות</span>}
          {block.cost>0&&<span style={{fontSize:11,color:'var(--amber)'}}>💰 ₪{block.cost.toFixed(0)}</span>}
        </div>
      </div>
      {/* inline note editor */}
      {noteOpen&&onNoteChange&&(
        <div style={{borderTop:'1px solid var(--border)',padding:'7px 12px',display:'flex',gap:7,alignItems:'center'}}>
          <input autoFocus dir="rtl"
            value={noteVal}
            onChange={e=>setNoteVal(e.target.value)}
            onKeyDown={e=>{
              if(e.key==='Enter'){onNoteChange(block.id,noteVal);setNoteOpen(false);}
              if(e.key==='Escape'){setNoteOpen(false);}
            }}
            placeholder="הוסף הערה..."
            style={{flex:1,border:'none',borderBottom:'1px solid var(--border)',background:'none',
              color:'var(--text)',fontSize:12,padding:'3px 2px',fontFamily:'Heebo,sans-serif',outline:'none',direction:'rtl'}}
          />
          <button onClick={()=>{onNoteChange(block.id,noteVal);setNoteOpen(false);}}
            style={{background:'var(--green,#22c55e)',border:'none',borderRadius:5,color:'#fff',
              fontSize:12,fontWeight:700,padding:'4px 10px',cursor:'pointer',fontFamily:'Heebo,sans-serif',flexShrink:0}}>
            ✓
          </button>
          <button onClick={()=>setNoteOpen(false)}
            style={{background:'none',border:'none',color:'var(--text3)',fontSize:14,cursor:'pointer',padding:'4px 5px',flexShrink:0}}>
            ✕
          </button>
        </div>
      )}
      {/* קו "עכשיו" בתוך הבלוק — מופיע כשהשעה הנוכחית תוך כדי פעילות זו */}
      {nowProgress!=null&&<div style={{
        position:'absolute',left:0,right:0,
        top:`${Math.max(2,Math.min(96,nowProgress*100))}%`,
        display:'flex',alignItems:'center',gap:0,
        pointerEvents:'none',zIndex:10,
      }}>
        <span style={{background:'#ef4444',color:'#fff',fontSize:9,fontWeight:700,
          padding:'1px 6px',borderRadius:'0 6px 6px 0',
          flexShrink:0,letterSpacing:'0.02em',boxShadow:'0 1px 3px #0004'}}>
          ⏱ {nowTime()}
        </span>
        <div style={{flex:1,height:2,background:'#ef4444',opacity:0.85,borderRadius:1}}/>
      </div>}
    </div>
  </div>;
}

/* ══════════════════════════════════════════════════════════════════════
   DayBankSuggestions — מציג פריטי בנק כללי הקרובים למסלול/נקודת היום
══════════════════════════════════════════════════════════════════════ */
function DayBankSuggestions({day,onAddItems}){
  const PLACE_EMOJI={
    tourist_attraction:'🎯',museum:'🏛️',park:'🌿',natural_feature:'🏔️',
    restaurant:'🍽️',cafe:'☕',bar:'🍺',food:'🍽️',bakery:'🥐',
    lodging:'🏨',shopping_mall:'🛍️',store:'🛒',beach:'🏖️',
    amusement_park:'🎡',zoo:'🦁',aquarium:'🐠',art_gallery:'🎨',
    movie_theater:'🎬',night_club:'🎵',spa:'💆',stadium:'🏟️',
    church:'⛪',synagogue:'🕍',mosque:'🕌',point_of_interest:'📍',
  };
  const peEmoji=t=>PLACE_EMOJI[t]||'📍';
  const bank=day._tripBank||[];
  const hasBoth=!!(day.startLat&&day.startLng&&day.endLat&&day.endLng);
  const hasRoute=hasBoth&&haversineKm(day.startLat,day.startLng,day.endLat,day.endLng)>0.1;
  const refLat=day.startLat||day.endLat, refLng=day.startLng||day.endLng;
  const hasLocation=!!(refLat&&refLng);
  const bankWithCoords=useMemo(()=>bank.filter(i=>i.lat&&i.lng),[bank]);
  const[radius,setRadius]=useState(hasRoute?10:5);

  const usedKeys=useMemo(()=>{
    const s=new Set();
    (day.blocks||[]).forEach(b=>{
      if(b.placeId)s.add('p:'+b.placeId);
      else if(b.title)s.add('n:'+b.title.trim().toLowerCase());
    });
    (day.dayBank||[]).forEach(b=>{
      if(b.placeId)s.add('p:'+b.placeId);
      else if(b.name)s.add('n:'+b.name.trim().toLowerCase());
    });
    return s;
  },[day.blocks,day.dayBank]);

  const results=useMemo(()=>{
    if(!hasLocation)return[];
    return bankWithCoords
      .filter(item=>{
        if(item.placeId&&usedKeys.has('p:'+item.placeId))return false;
        if(!item.placeId&&item.name&&usedKeys.has('n:'+item.name.trim().toLowerCase()))return false;
        return true;
      })
      .map(item=>{
        const dist=hasRoute
          ?distToSegKm(item.lat,item.lng,day.startLat,day.startLng,day.endLat,day.endLng)
          :haversineKm(item.lat,item.lng,refLat,refLng);
        return{...item,_dist:dist};
      })
      .filter(i=>i._dist<=radius)
      .sort((a,b)=>a._dist-b._dist);
  },[bankWithCoords,radius,usedKeys,hasLocation,hasRoute,
     day.startLat,day.startLng,day.endLat,day.endLng,refLat,refLng]);

  const fmtDist=d=>d<1?(d*1000).toFixed(0)+' מ׳':d.toFixed(1)+' ק"מ';
  const addOne=item=>onAddItems([item]);
  const addAll=()=>{if(results.length)onAddItems(results);};

  const labelStyle={fontSize:11,color:'var(--text3)',flexShrink:0};
  const chip=(active)=>({
    fontSize:11,padding:'3px 11px',borderRadius:20,cursor:'pointer',transition:'all .15s',
    background:active?'rgba(16,185,129,.22)':'var(--bg2)',
    border:active?'1px solid #059669':'1px solid var(--border)',
    color:active?'#059669':'var(--text2)',fontWeight:active?700:400,
  });

  return(
    <div style={{background:'rgba(16,185,129,.04)',border:'1px solid rgba(16,185,129,.22)',
      borderRadius:8,padding:'10px 12px',marginBottom:10}}>
      {/* כותרת + הסבר */}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8,flexWrap:'wrap'}}>
        <span style={{fontSize:12,fontWeight:700,color:'#059669'}}>✨ המלצות מהבנק הכללי</span>
        <span style={{fontSize:11,color:'var(--text3)',flex:1,minWidth:120}}>
          {!hasLocation?'הגדר נקודת התחלה/סיום ליום'
            :hasRoute
              ?`לאורך המסלול: ${day.startLocation||'מוצא'} ← ${day.endLocation||'יעד'}`
              :`סביב ${day.startLocation||day.endLocation||'נקודת הבסיס'}`}
        </span>
      </div>

      {!hasLocation?(
        <div style={{fontSize:12,color:'var(--text3)',textAlign:'center',padding:'12px 0',lineHeight:1.7}}>
          🗺️ הגדר נקודת התחלה או סיום ליום<br/>כדי לקבל המלצות בקרבת המסלול
        </div>
      ):bankWithCoords.length===0?(
        <div style={{fontSize:12,color:'var(--text3)',textAlign:'center',padding:'12px 0',lineHeight:1.7}}>
          📚 בנק האטרקציות ריק או שאין לפריטים קואורדינטות<br/>
          <span style={{fontSize:11}}>הוסף מקומות לבנק הכללי ⭐ כדי לקבל המלצות</span>
        </div>
      ):(
        <>
          {/* בחירת טווח */}
