function Checklist({title,emoji,items,onUpdate}){
  const[text,setText]=useState(''),[cat,setCat]=useState('כללי');
  const add=()=>{const t=text.trim();if(!t)return;onUpdate([...items,{id:uid(),text:t,done:false,category:cat||'כללי'}]);setText('');};
  const tog=id=>onUpdate(items.map(i=>i.id===id?{...i,done:!i.done}:i));
  const del=id=>onUpdate(items.filter(i=>i.id!==id));
  const done=items.filter(i=>i.done).length;
  const cats=[...new Set(items.map(i=>i.category||'כללי'))];
  const grouped=items.reduce((a,i)=>{const c=i.category||'כללי';if(!a[c])a[c]=[];a[c].push(i);return a;},{});

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:15}}>{emoji} {title}</span>
      <span className="chip chip-green" style={{fontSize:11}}>{done}/{items.length} הושלמו</span>
      {items.length>0&&<div className="progress" style={{flex:1}}><div className="progress-fill" style={{width:`${items.length?(done/items.length)*100:0}%`,background:'var(--green)'}}/></div>}
      <button className="btn btn-danger btn-sm" onClick={()=>onUpdate(items.filter(i=>!i.done))}>נקה הושלמו</button>
    </div>
    <div style={{padding:'10px 14px',borderBottom:'1px solid var(--border)',display:'flex',gap:8}}>
      <input className="input" value={text} onChange={e=>setText(e.target.value)} placeholder={`הוסף פריט ל${title}…`} onKeyDown={e=>e.key==='Enter'&&add()} style={{flex:2}}/>
      <input className="input" value={cat} onChange={e=>setCat(e.target.value)} placeholder="קטגוריה" list={`cats-${title}`} style={{flex:1}}/>
      <datalist id={`cats-${title}`}>{cats.map(c=><option key={c} value={c}/>)}</datalist>
      <button className="btn btn-primary" onClick={add}>+</button>
    </div>
    <div className="scroll-y flex-1" style={{padding:'12px 16px'}}>
      {items.length===0?(
        <div className="empty-state"><div className="emoji">{emoji}</div><p>{title} ריקה. הוסף פריטים למעלה.</p></div>
      ):Object.entries(grouped).map(([c,citems])=>(
        <div key={c} style={{marginBottom:16}}>
          <div className="section-title">{c}</div>
          {citems.map(item=>(
            <div key={item.id} className={`list-item${item.done?' done':''}`}>
              <input type="checkbox" checked={item.done} onChange={()=>tog(item.id)} style={{cursor:'pointer',accentColor:'var(--accent)',flexShrink:0}}/>
              <span className="item-text" style={{flex:1,fontSize:13}}>{item.text}</span>
              <button className="btn btn-secondary btn-icon btn-sm" style={{opacity:.35,transition:'opacity .15s'}}
                onMouseEnter={e=>e.target.style.opacity=1} onMouseLeave={e=>e.target.style.opacity=.35}
                onClick={()=>del(item.id)}>✕</button>
            </div>
          ))}
        </div>
      ))}
    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית מסמכים
══════════════════════════════════ */
function DocsTab({trip,onUpdate,settings}){
  const[busy,setBusy]=useState(false),fileRef=useRef(null);
  const upload=async file=>{
    const hasGH=settings.githubToken&&settings.githubUsername&&settings.githubRepo;
    if (!hasGH){
      const r=new FileReader();
      r.onload=()=>{
        onUpdate({...trip,documents:[...trip.documents,{id:uid(),name:file.name,type:file.type,size:file.size,url:r.result,uploadedAt:new Date().toISOString(),source:'local'}]});
        toast(`"${file.name}" נשמר מקומית`,'info');
      }; r.readAsDataURL(file); return;
    }
    setBusy(true);
    try {
      const b64=await fileToB64(file);
      const path=`docs/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;
      const res=await ghUpload(settings.githubToken,settings.githubUsername,settings.githubRepo,path,b64);
      onUpdate({...trip,documents:[...trip.documents,{id:uid(),name:file.name,type:file.type,size:file.size,url:res.content.download_url||res.content.html_url,ghPath:path,uploadedAt:new Date().toISOString(),source:'github'}]});
      toast(`"${file.name}" הועלה לגיטהאב ✓`,'success');
    } catch(err){toast(`העלאה נכשלה: ${err.message}`,'error');}
    finally{setBusy(false);}
  };
  const icon=t=>t?.includes('pdf')?'📄':t?.startsWith('image')?'🖼️':t?.includes('word')?'📝':'📎';

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:12}}>
      <span style={{fontWeight:700,fontSize:15}}>📁 מסמכים</span>
      <span className="chip chip-blue" style={{fontSize:11}}>{trip.documents.length} קבצים</span>
      <div style={{flex:1}}/>
      <button className="btn btn-primary" onClick={()=>fileRef.current?.click()} disabled={busy}>
        {busy?'⏳ מעלה…':'+ העלה קובץ'}
      </button>
      <input ref={fileRef} type="file" style={{display:'none'}} multiple onChange={e=>Array.from(e.target.files).forEach(upload)}/>
    </div>
    <div className="scroll-y flex-1" style={{padding:16}} onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();Array.from(e.dataTransfer.files).forEach(upload);}}>
      {trip.documents.length===0?(
        <div className="empty-state">
          <div className="emoji">📁</div>
          <div style={{fontWeight:600,color:'var(--text)'}}>אין מסמכים עדיין</div>
          <p>העלה דרכונים, ביטוח, כרטיסים, מפות אתרי קמפינג ועוד.<br/>{settings.githubRepo?'הקבצים ישמרו ב-/docs בגיטהאב.':'הגדר גיטהאב בהגדרות לשמירה בענן.'}</p>
          <button className="btn btn-primary" onClick={()=>fileRef.current?.click()}>+ העלה קובץ</button>
        </div>
      ):(
        <div className="doc-grid">
          {trip.documents.map(doc=>(
            <div key={doc.id} className="doc-item">
              <button onClick={()=>onUpdate({...trip,documents:trip.documents.filter(d=>d.id!==doc.id)})}
                style={{position:'absolute',top:6,left:6,background:'var(--red)',color:'#fff',border:'none',borderRadius:6,width:20,height:20,fontSize:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>✕</button>
              {doc.type?.startsWith('image/')&&doc.url?(
                <img src={doc.url} alt={doc.name} style={{width:'100%',height:80,objectFit:'cover',borderRadius:6,marginBottom:6}}/>
              ):<div style={{fontSize:36,marginBottom:8}}>{icon(doc.type)}</div>}
              <div style={{fontSize:11,color:'var(--text2)',wordBreak:'break-all'}}>{doc.name}</div>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>{doc.source==='github'?'☁️ גיטהאב':'💾 מקומי'}</div>
              {doc.url&&doc.source==='github'&&<a href={doc.url} target="_blank" rel="noreferrer" style={{fontSize:10,color:'var(--accent)',textDecoration:'none'}}>פתח ↗</a>}
            </div>
          ))}
        </div>
      )}
    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית הערות ומזג אוויר
══════════════════════════════════ */
function NotesTab({trip,onUpdate}){
  const[newNote,setNewNote]=useState('');
  const[weatherData,setWeatherData]=useState(null),[wLoading,setWLoading]=useState(false),[wLabel,setWLabel]=useState('');
  const[cityInput,setCityInput]=useState('');

  const loadWeather=(lat,lng,label)=>{
    setWLoading(true);
    fetchWeather(lat,lng)
      .then(w=>{setWeatherData(w);setWLabel(label);})
      .catch(()=>toast('שגיאה בטעינת מזג האוויר','error'))
      .finally(()=>setWLoading(false));
  };

  const fetchByCity=async()=>{
    const q=cityInput.trim(); if(!q) return;
    setWLoading(true);
    try{
      const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=he&format=json`);
      const d=await r.json();
      if(!d.results?.length){toast('עיר לא נמצאה — נסה שוב','error');setWLoading(false);return;}
      const{latitude:lat,longitude:lng,name,country}=d.results[0];
      loadWeather(lat,lng,`${name}, ${country}`);
    }catch{toast('שגיאה בחיפוש המיקום','error');setWLoading(false);}
  };

  const fetchByGPS=()=>{
    if(!navigator.geolocation){toast('הדפדפן לא תומך במיקום','error');return;}
    setWLoading(true);
    navigator.geolocation.getCurrentPosition(
      pos=>loadWeather(pos.coords.latitude,pos.coords.longitude,'המיקום הנוכחי שלי'),
      ()=>{toast('לא ניתן לגשת למיקום — אשר הרשאה בדפדפן','error');setWLoading(false);}
    );
  };

  const addNote=()=>{
    const t=newNote.trim(); if(!t) return;
    onUpdate({...trip,quickNotes:[...(trip.quickNotes||[]),{id:uid(),text:t,createdAt:new Date().toISOString()}]});
    setNewNote('');
  };
  const delNote=id=>onUpdate({...trip,quickNotes:(trip.quickNotes||[]).filter(n=>n.id!==id)});

  const[wIcon,wDesc]=weatherData?WMO[weatherData.current_weather?.weathercode]||['🌡️','לא ידוע']:[];

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:700,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      {/* מזג אוויר לפי איזור */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🌤️ מזג אוויר לפי איזור</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:6}}>
            <input className="input" style={{flex:1}} value={cityInput} onChange={e=>setCityInput(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&fetchByCity()}
              placeholder="הקלד עיר או אזור — למשל: אילת, פריז, כנרת…"/>
            <button className="btn btn-primary btn-sm" onClick={fetchByCity} disabled={wLoading||!cityInput.trim()}>חפש</button>
            <button className="btn btn-secondary btn-sm" onClick={fetchByGPS} disabled={wLoading} title="מיקום נוכחי">📍</button>
          </div>
          {wLoading&&<div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:'8px 0'}}>⏳ טוען מזג אוויר...</div>}
          {weatherData&&!wLoading&&(
            <div>
              <div style={{fontSize:12,color:'var(--text3)',marginBottom:8}}>📍 {wLabel}</div>
              <div className="weather-card" style={{marginBottom:10}}>
                <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
                  <span style={{fontSize:40}}>{wIcon}</span>
                  <div>
                    <div style={{fontSize:26,fontWeight:700}}>{Math.round(weatherData.current_weather?.temperature)}°C</div>
                    <div style={{fontSize:13,opacity:.85}}>{wDesc}</div>
                  </div>
                  <div style={{marginRight:'auto'}}>
                    <a href="https://ims.gov.il/he/forecast_regional" target="_blank" rel="noreferrer"
                       style={{fontSize:11,color:'#90cdf4',display:'block',marginBottom:4}}>🇮🇱 שירות מטאורולוגי ↗</a>
                    <a href="https://www.windy.com/" target="_blank" rel="noreferrer"
                       style={{fontSize:11,color:'#90cdf4',display:'block'}}>🌐 Windy ↗</a>
                  </div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  {(weatherData.daily?.time||[]).slice(0,5).map((date,i)=>{
                    const[di]=WMO[weatherData.daily.weathercode[i]]||['🌡️'];
                    return <div key={date} style={{flex:1,background:'rgba(255,255,255,.1)',borderRadius:8,padding:'6px 6px',textAlign:'center'}}>
                      <div style={{fontSize:10,opacity:.7,marginBottom:2}}>{new Date(date).toLocaleDateString('he-IL',{weekday:'short'})}</div>
                      <div style={{fontSize:18}}>{di}</div>
                      <div style={{fontSize:11,fontWeight:600}}>{Math.round(weatherData.daily.temperature_2m_max[i])}°</div>
                      <div style={{fontSize:10,opacity:.6}}>{Math.round(weatherData.daily.temperature_2m_min[i])}°</div>
                    </div>;
                  })}
                </div>
              </div>
            </div>
          )}
          {!weatherData&&!wLoading&&(
            <div style={{color:'var(--text3)',fontSize:12,textAlign:'center',padding:'4px 0'}}>
              הקלד עיר/אזור לתחזית, או לחץ 📍 למיקום הנוכחי
            </div>
          )}
        </div>
      </div>

      {/* הערות כלליות לטיול */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>📝 הערות כלליות לטיול</span></div>
        <div className="card-body">
          <textarea className="input" rows={6}
            value={trip.generalNotes||''}
            onChange={e=>onUpdate({...trip,generalNotes:e.target.value})}
            placeholder="כתוב כאן כל מה שחשוב לזכור — קשר לאתר קמפינג, טלפונים, קודי אזור, הערות מיוחדות..."/>
        </div>
      </div>

      {/* פתקיות מהירות */}
      <div className="card">
        <div className="card-header">
          <span style={{fontWeight:700}}>📌 פתקיות מהירות</span>
          <span className="chip chip-blue" style={{fontSize:11}}>{(trip.quickNotes||[]).length}</span>
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'flex',gap:8}}>
            <input className="input" value={newNote} onChange={e=>setNewNote(e.target.value)}
              onKeyDown={e=>e.key==='Enter'&&addNote()}
              placeholder="הוסף פתקית (Enter לשמירה)..." style={{flex:1}}/>
            <button className="btn btn-primary btn-sm" onClick={addNote} disabled={!newNote.trim()}>+ הוסף</button>
          </div>
          {(trip.quickNotes||[]).length===0&&(
            <div style={{color:'var(--text3)',fontSize:13,textAlign:'center',padding:'8px 0'}}>אין פתקיות עדיין</div>
          )}
          {(trip.quickNotes||[]).map(n=>(
            <div key={n.id} className="interest-item" style={{justifyContent:'space-between'}}>
              <div style={{flex:1,fontSize:13,lineHeight:1.5,wordBreak:'break-word'}}>{n.text}</div>
              <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0,marginRight:8}}>
                <span style={{fontSize:10,color:'var(--text3)'}}>{new Date(n.createdAt).toLocaleDateString('he-IL')}</span>
                <button className="btn btn-danger btn-icon btn-sm" onClick={()=>delNote(n.id)}>✕</button>
              </div>
            </div>
          ))}
        </div>
      </div>

    </div>
  </div>;
}

/* ══════════════════════════════════
   לשונית הגדרות
══════════════════════════════════ */
function SettingsTab({settings,onSettings,trips,activeTrip,onNewTrip,onLoadTrip,onDeleteTrip,onPush,onPull,ghBusy}){
  const[s,setS]=useState({...settings});
  const upd=(k,v)=>setS(p=>({...p,[k]:v}));
  const[showForm,setShowForm]=useState(false);
  const[newName,setNewName]=useState('');
  const createTrip=()=>{
    const n=newName.trim()||'טיול חדש';
    onNewTrip(n);
    setNewName(''); setShowForm(false);
  };

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:640,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>✈️ ניהול טיולים</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:12}}>
          {!showForm?(
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button className="btn btn-primary" onClick={()=>{setNewName('');setShowForm(true);}}>+ טיול חדש</button>
              {activeTrip&&<button className="btn btn-secondary" onClick={()=>{setNewName(activeTrip.name+' עותק');setShowForm(true);}}>📋 שמור כעותק</button>}
            </div>
          ):(
            <div style={{display:'flex',flexDirection:'column',gap:8,background:'var(--surface2)',borderRadius:10,padding:'12px'}}>
              <label className="label">שם הטיול החדש</label>
              <div style={{display:'flex',gap:6}}>
                <input className="input" style={{flex:1}} value={newName} onChange={e=>setNewName(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter')createTrip();if(e.key==='Escape'){setShowForm(false);setNewName('');}}}
                  placeholder="למשל: קיץ 2025 — אירופה" autoFocus/>
                <button className="btn btn-primary btn-sm" onClick={createTrip}>צור</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>{setShowForm(false);setNewName('');}}>ביטול</button>
              </div>
            </div>
          )}
          {trips.map(t=>(
            <div key={t.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:8,background:t.id===activeTrip?.id?'rgba(79,142,247,.12)':'var(--surface2)'}}>
              <div style={{flex:1,fontSize:13}}>
                <div style={{fontWeight:600}}>{t.name}</div>
                <div style={{fontSize:11,color:'var(--text3)'}}>{t.startDate||'—'} → {t.endDate||'—'} · {t.days.length} ימים · {t.expenses.length} הוצאות</div>
              </div>
              {t.id!==activeTrip?.id&&<button className="btn btn-secondary btn-sm" onClick={()=>onLoadTrip(t.id)}>טען</button>}
              {t.id===activeTrip?.id&&<span className="chip chip-green" style={{fontSize:10}}>פעיל</span>}
              <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm(`למחוק את "${t.name}"?`))onDeleteTrip(t.id);}}>🗑</button>
            </div>
          ))}
        </div>
      </div>

      {activeTrip&&<div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>🚐 פרופיל רכב ופרטי טיול</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div><label className="label">שם הטיול</label>
            <input className="input" value={activeTrip.name||''} onChange={e=>onLoadTrip(null,{...activeTrip,name:e.target.value})} placeholder="למשל: חופשת קיץ 2025"/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {[['name','שם הרכב'],['plate','לוחית רישוי'],['height','גובה (מ׳)'],['width','רוחב (מ׳)'],['weight','משקל (ק"ג)']].map(([k,lbl])=>(
              <div key={k}><label className="label">{lbl}</label>
                <input className="input" value={activeTrip.vehicle[k]||''} onChange={e=>onLoadTrip(null,{...activeTrip,vehicle:{...activeTrip.vehicle,[k]:e.target.value}})} placeholder={lbl}/></div>
            ))}
          </div>
          <div className="section-title" style={{marginTop:8}}>רמות מצב</div>
          {[['waterLevel','💧 מים','var(--accent)'],['gasLevel','⛽ דלק','var(--green)'],['wasteLevel','🪣 פסולת','var(--amber)']].map(([k,lbl,col])=>(
            <div key={k} style={{display:'flex',alignItems:'center',gap:10}}>
              <span style={{fontSize:12,color:'var(--text2)',width:90}}>{lbl}</span>
              <input type="range" min="0" max="100" value={activeTrip.vehicle[k]??0} onChange={e=>onLoadTrip(null,{...activeTrip,vehicle:{...activeTrip.vehicle,[k]:parseInt(e.target.value)}})} style={{flex:1,accentColor:col}}/>
              <span style={{fontSize:12,fontWeight:700,color:col,width:36,textAlign:'left'}}>{activeTrip.vehicle[k]??0}%</span>
            </div>
          ))}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginTop:8}}>
            {[['startDate','תאריך תחילה'],['endDate','תאריך סיום']].map(([k,lbl])=>(
              <div key={k}><label className="label">{lbl}</label>
                <input className="input" type="date" value={activeTrip[k]||''} onChange={e=>onLoadTrip(null,{...activeTrip,[k]:e.target.value})}/></div>
            ))}
          </div>
        </div>
      </div>}

      <div className="card">
        <div className="card-header">
          <span style={{fontWeight:700}}>☁️ סנכרון GitHub</span>
          {s.githubToken&&s.githubUsername&&s.githubRepo&&<span className="chip chip-green" style={{fontSize:10}}>מוגדר</span>}
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{fontSize:12,color:'var(--text3)',lineHeight:1.8}}>
            נתוני הטיול נשמרים כ-<code>trip_data.json</code> ומסמכים עוברים ל-<code>/docs/</code> בריפו הפרטי שלך.
            צור Personal Access Token עם הרשאת <code>repo</code> ב-<a href="https://github.com/settings/tokens" target="_blank" rel="noreferrer" style={{color:'var(--accent)'}}>GitHub Settings</a>.
          </div>
          {[['githubToken','GitHub Personal Access Token','password'],['githubUsername','שם משתמש GitHub','text'],['githubRepo','שם הריפו (פרטי)','text'],['googleMapsKey','מפתח API של גוגל מפות','password']].map(([k,lbl,type])=>(
            <div key={k}><label className="label">{lbl}</label>
              <input className="input" type={type} value={s[k]||''} onChange={e=>upd(k,e.target.value)} placeholder={lbl} autoComplete="off"/></div>
          ))}
          <div style={{display:'flex',gap:10,flexWrap:'wrap',marginTop:4}}>
            <button className="btn btn-primary" onClick={()=>{onSettings(s);toast('ההגדרות נשמרו','success');}}>💾 שמור הגדרות</button>
            {activeTrip&&s.githubToken&&<>
              <button className="btn btn-success" onClick={onPush} disabled={ghBusy}>{ghBusy?'⏳…':'⬆ דחוף לגיטהאב'}</button>
              <button className="btn btn-secondary" onClick={onPull} disabled={ghBusy}>{ghBusy?'⏳…':'⬇ משוך מגיטהאב'}</button>
            </>}
          </div>
        </div>
      </div>

    </div>
  </div>;
}

/* ══════════════════════════════════
   APP
══════════════════════════════════ */
function App(){
  const saved=useMemo(()=>loadState(),[]);
  const[settings,setSettings]=useState(saved?.settings||{githubToken:'',githubUsername:'',githubRepo:'',googleMapsKey:'AIzaSyAZhMPQ3rdplpqNhYx5oNrZV5HJfcTq1Dw',theme:'dark'});
  const[trips,setTrips]=useState(saved?.trips||[defaultTrip('הטיול הראשון שלי')]);
  const[activeId,setActiveId]=useState(saved?.activeId||(saved?.trips?.[0]?.id??null));
  const[tab,setTab]=useState('map');
  const[mobileSide,setMobile]=useState('timeline');
  const[ghBusy,setGhBusy]=useState(false);
  const ghSha=useRef(null);

  useEffect(()=>saveState({settings,trips,activeId}),[settings,trips,activeId]);
  useEffect(()=>{document.body.className=settings.theme==='light'?'light':'';},[settings.theme]);

  const trip=useMemo(()=>trips.find(t=>t.id===activeId)||trips[0]||null,[trips,activeId]);

  const updTrip=useCallback(upd=>{
    if (typeof upd==='function') setTrips(ts=>ts.map(t=>t.id===activeId?upd(t):t));
    else setTrips(ts=>ts.map(t=>t.id===upd.id?upd:t));
  },[activeId]);

  const newTrip=(name,template=null)=>{
    const t=template?{...template,id:uid(),name:name||template.name+' עותק'}:defaultTrip(name||'טיול חדש');
    setTrips(ts=>[...ts,t]); setActiveId(t.id);
    toast(`הטיול "${t.name}" נוצר`,'success');
  };
  const loadTrip=(id,direct=null)=>{
    if (direct){setTrips(ts=>ts.map(t=>t.id===direct.id?direct:t));return;}
    setActiveId(id); setTab('timeline');
  };
  const delTrip=id=>{
    const rest=trips.filter(t=>t.id!==id);
    setTrips(rest); if(activeId===id)setActiveId(rest[0]?.id||null);
  };
  const addToBank=useCallback(item=>{
    if (!trip) return;
    updTrip({...trip,interestBank:[...trip.interestBank,{...item,id:uid()}]});
  },[trip,updTrip]);

  const addToDay=useCallback((dayId,item)=>{
    if (!trip) return;
    const day=trip.days.find(d=>d.id===dayId);
    if (!day) return;
    const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    const newBlock=defaultBlock('activity',start);
    newBlock.title=item.name;
    newBlock.location=item.address||'';
    const updatedDay={...day,blocks:[...day.blocks,newBlock]};
    updTrip({...trip,days:trip.days.map(d=>d.id===dayId?updatedDay:d)});
  },[trip,updTrip]);

  const push=async()=>{
    if (!trip) return; setGhBusy(true);
    try{const res=await ghSave(settings.githubToken,settings.githubUsername,settings.githubRepo,'trip_data.json',{trips,activeId,savedAt:new Date().toISOString()},ghSha.current);ghSha.current=res.content.sha;toast('נדחף לגיטהאב ✓','success');}
    catch(e){toast(`שגיאת דחיפה: ${e.message}`,'error');}finally{setGhBusy(false);}
  };
  const pull=async()=>{
    setGhBusy(true);
    try{const{content,sha}=await ghLoad(settings.githubToken,settings.githubUsername,settings.githubRepo,'trip_data.json');ghSha.current=sha;if(content.trips){setTrips(content.trips);setActiveId(content.activeId);}toast('נמשך מגיטהאב ✓','success');}
    catch(e){toast(`שגיאת משיכה: ${e.message}`,'error');}finally{setGhBusy(false);}
  };

  const TABS=[
    {id:'map',label:'🗺️ מפה'},
    {id:'timeline',label:'🗓 לוח זמנים'},
    {id:'expenses',label:'💰 הוצאות'},
    {id:'documents',label:'📁 מסמכים'},
    {id:'packing',label:'🎒 ציוד'},
    {id:'shopping',label:'🛒 קניות'},
    {id:'notes',label:'📝 הערות'},
    {id:'settings',label:'⚙️ הגדרות'},
  ];

  const noTrip=<div className="empty-state" style={{height:'100%'}}>
    <div className="emoji">🚐</div>
    <div style={{fontWeight:600,color:'var(--text)'}}>אין טיול פעיל</div>
    <p>עבור להגדרות ⚙️ כדי ליצור טיול חדש.</p>
    <button className="btn btn-primary" onClick={()=>setTab('settings')}>⚙️ הגדרות</button>
  </div>;

  const renderMain=()=>{
    if (!trip&&tab!=='settings') return noTrip;
    switch(tab){
      case 'map': return (
        <div className="split-view" style={{height:'100%'}}>
          <div className={`split-left${mobileSide==='timeline'?' mobile-hidden':''}`}>
            <MapView mapsKey={settings.googleMapsKey} trip={trip} onAddToBank={addToBank} onAddToDay={addToDay}/>
          </div>
          <div className={`split-right${mobileSide==='map'?' mobile-hidden':''}`} style={{overflow:'hidden'}}>
            {trip?<TimelineTab trip={trip} onUpdate={updTrip} onLocate={(lat,lng)=>window.__gmFocus?.(lat,lng)}/>:noTrip}
          </div>
        </div>
      );
      case 'timeline': return <TimelineTab trip={trip} onUpdate={updTrip}/>;
      case 'expenses': return <ExpensesTab trip={trip} onUpdate={updTrip}/>;
      case 'documents': return <DocsTab trip={trip} onUpdate={updTrip} settings={settings}/>;
      case 'packing': return <Checklist title="רשימת ציוד" emoji="🎒" items={trip.packingList} onUpdate={items=>updTrip({...trip,packingList:items})}/>;
      case 'shopping': return <Checklist title="רשימת קניות" emoji="🛒" items={trip.shoppingList} onUpdate={items=>updTrip({...trip,shoppingList:items})}/>;
      case 'notes': return <NotesTab trip={trip} onUpdate={updTrip}/>;
      case 'settings': return <SettingsTab settings={settings} onSettings={setSettings} trips={trips} activeTrip={trip} onNewTrip={newTrip} onLoadTrip={loadTrip} onDeleteTrip={delTrip} onPush={push} onPull={pull} ghBusy={ghBusy}/>;
      default: return null;
    }
  };

  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="app-header">
      <VehicleHeader trip={trip} theme={settings.theme} onThemeToggle={()=>setSettings(s=>({...s,theme:s.theme==='dark'?'light':'dark'}))}/>
      <div className="tab-bar">
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
        {tab==='map'&&<button className="tab-btn mobile-toggle" style={{marginRight:'auto',color:'var(--amber)'}} onClick={()=>setMobile(s=>s==='map'?'timeline':'map')}>
          {mobileSide==='map'?'📋 לוח זמנים':'🗺️ מפה'}
        </button>}
      </div>
    </div>
    <div className="main-content">{renderMain()}</div>
    <Toasts/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
