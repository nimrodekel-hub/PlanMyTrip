/* ══════════════════════════════════
   לשונית חיבוריות
══════════════════════════════════ */
const FB_URL='https://planmytrip-de33c-default-rtdb.firebaseio.com';
const FB_RULES_URL='https://console.firebase.google.com/u/1/project/planmytrip-de33c/database/planmytrip-de33c-default-rtdb/rules';

function ConnectivityTab({settings,onSettings,onPush,onPull,ghBusy,syncStatus}){
  const[s,setS]=useState({...settings});
  const[copied,setCopied]=useState(false);
  const[testing,setTesting]=useState(false);
  const[testResult,setTestResult]=useState(null);
  const upd=(k,v)=>setS(p=>({...p,[k]:v}));

  // אם אין syncKey — צור אחד אוטומטית
  const effectiveKey = s.syncKey||settings.syncKey;

  const copyKey=()=>{
    navigator.clipboard?.writeText(effectiveKey||'').then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});
  };

  const testConnection=async()=>{
    if(!s.firebaseUrl||!effectiveKey){setTestResult({ok:false,msg:'חסרים כתובת Firebase או מפתח סנכרון'});return;}
    setTesting(true); setTestResult(null);
    try{
      const r=await fetch(`${s.firebaseUrl.replace(/\/$/,'')}/planmytrip/${effectiveKey}.json?_=${Date.now()}`);
      if(r.ok){ setTestResult({ok:true,msg:'✅ החיבור תקין! Firebase נגיש ומוכן.'}); }
      else { setTestResult({ok:false,msg:`❌ שגיאה ${r.status} — בדוק את כתובת ה-URL`}); }
    }catch(e){ setTestResult({ok:false,msg:`❌ חיבור נכשל — ${e.message}`}); }
    finally{setTesting(false);}
  };

  const saveAndSync=()=>{
    const newS={...s,firebaseUrl:FB_URL}; // תמיד FB_URL הנכון
    onSettings(newS);
    setTimeout(()=>onPush(newS),300);
  };

  const statusColor=syncStatus==='synced'?'var(--green)':syncStatus==='syncing'?'var(--amber)':syncStatus==='error'?'var(--red)':'var(--text3)';
  const statusText=syncStatus==='synced'?'מסונכרן ✓':syncStatus==='syncing'?'מסנכרן...':syncStatus==='error'?'שגיאת סנכרון':'לא מסונכרן';

  return <div className="scroll-y" style={{height:'100%',padding:20}}>
    <div style={{maxWidth:660,margin:'0 auto',display:'flex',flexDirection:'column',gap:20}}>

      {/* ── כותרת ── */}
      <div style={{display:'flex',alignItems:'center',gap:14}}>
        <span style={{fontSize:36}}>🔗</span>
        <div>
          <div style={{fontSize:20,fontWeight:800}}>חיבוריות וסנכרון</div>
          <div style={{fontSize:13,color:'var(--text2)',marginTop:2}}>הגדרת סנכרון הטיול בין מחשב, סלולר וטאבלט</div>
        </div>
        <div style={{marginRight:'auto',textAlign:'left'}}>
          <div style={{fontSize:11,color:'var(--text3)'}}>סטטוס</div>
          <div style={{fontSize:13,fontWeight:700,color:statusColor}}>{statusText}</div>
        </div>
      </div>

      {/* ── מצב נוכחי ── */}
      <div className="card" style={{border:`2px solid ${settings.firebaseUrl&&settings.syncKey?'var(--green)':'var(--amber)'}`}}>
        <div className="card-header">
          <span style={{fontWeight:700}}>📊 מצב נוכחי</span>
          {settings.firebaseUrl&&settings.syncKey
            ?<span className="chip chip-green">✓ Firebase מחובר</span>
            :<span className="chip chip-amber">⚠️ לא מחובר</span>}
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:10}}>
          <div style={{display:'grid',gridTemplateColumns:'auto 1fr',gap:'6px 14px',fontSize:13,alignItems:'center'}}>
            <span style={{color:'var(--text3)'}}>כתובת Firebase:</span>
            <code style={{fontSize:11,color:'var(--accent)',wordBreak:'break-all'}}>{settings.firebaseUrl||'לא הוגדר'}</code>
            <span style={{color:'var(--text3)'}}>מפתח סנכרון:</span>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <code style={{fontSize:10,color:'var(--text2)',wordBreak:'break-all',flex:1}}>{settings.syncKey||'לא נוצר'}</code>
              {settings.syncKey&&<button className="btn btn-secondary btn-sm" onClick={()=>{navigator.clipboard?.writeText(settings.syncKey);setCopied(true);setTimeout(()=>setCopied(false),2000);}}>
                {copied?'✓ הועתק':'📋 העתק'}
              </button>}
            </div>
          </div>
          {settings.syncKey&&<div style={{background:'rgba(34,197,94,0.08)',border:'1px solid rgba(34,197,94,0.2)',borderRadius:8,padding:'10px 12px',fontSize:12,lineHeight:1.8}}>
            📱 <strong>לחיבור סלולר:</strong> פתח את האפליקציה בסלולר ← עמוד חיבוריות ← הזן מפתח סנכרון:<br/>
            <code style={{color:'var(--accent)',fontSize:11,wordBreak:'break-all'}}>{settings.syncKey}</code>
          </div>}
        </div>
      </div>

      {/* ── הגדרות ── */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>⚙️ הגדרות חיבור</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <label className="label">כתובת Firebase Database — מוגדרת אוטומטית ✓</label>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input className="input" type="text" value={FB_URL} readOnly
                style={{fontFamily:'monospace',fontSize:11,color:'var(--green)',background:'var(--bg3)',cursor:'default'}}/>
              <button className="btn btn-secondary btn-sm" style={{flexShrink:0,whiteSpace:'nowrap'}}
                onClick={()=>{navigator.clipboard?.writeText(FB_URL);toast('הועתק','success');}}>📋</button>
            </div>
            <div style={{marginTop:6,background:'rgba(239,68,68,0.08)',border:'1px solid rgba(239,68,68,0.25)',borderRadius:6,padding:'7px 10px',fontSize:11,lineHeight:1.7}}>
              ⚠️ <strong>שים לב:</strong> זו כתובת ה-API של מסד הנתונים — <strong>לא</strong> כתובת הקונסול.<br/>
              אל תשנה אותה. הכתובת נקבעת אוטומטית לפי הפרויקט שלך.
            </div>
          </div>
          <div>
            <label className="label">מפתח סנכרון — זהה בכל המכשירים</label>
            <div style={{display:'flex',gap:8}}>
              <input className="input" type="text" value={s.syncKey||effectiveKey||''}
                onChange={e=>upd('syncKey',e.target.value.trim())}
                placeholder="יוצר אוטומטית בשמירה ראשונה"
                style={{fontFamily:'monospace',fontSize:11,flex:1}}/>
              <button className="btn btn-secondary btn-sm" style={{flexShrink:0}}
                onClick={()=>upd('syncKey',genSyncKey())}>🔑 צור חדש</button>
              {(s.syncKey||effectiveKey)&&<button className="btn btn-secondary btn-sm" style={{flexShrink:0}} onClick={copyKey}>
                {copied?'✓':'📋'}
              </button>}
            </div>
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button className="btn btn-primary" onClick={saveAndSync} disabled={ghBusy}>
              {ghBusy?'⏳ שומר...':'💾 שמור וסנכרן עכשיו'}
            </button>
            <button className="btn btn-secondary" onClick={testConnection} disabled={testing}>
              {testing?'⏳ בודק...':'🔌 בדוק חיבור'}
            </button>
            <button className="btn btn-secondary" onClick={()=>onPull()} disabled={ghBusy}>
              ⬇️ טען נתונים מהענן
            </button>
          </div>
          {testResult&&<div style={{padding:'10px 14px',borderRadius:8,fontSize:13,
            background:testResult.ok?'rgba(34,197,94,0.1)':'rgba(239,68,68,0.1)',
            border:`1px solid ${testResult.ok?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'}`}}>
            {testResult.msg}
          </div>}
        </div>
      </div>

      {/* ── הוראות חיבור סלולר ── */}
      <div className="card">
        <div className="card-header"><span style={{fontWeight:700}}>📱 איך מחברים סלולר / מכשיר נוסף?</span></div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:14}}>
          {[
            {n:1,t:'פתח את האפליקציה במכשיר החדש',d:'כנס לכתובת nimrodekel-hub.github.io/PlanMyTrip בדפדפן'},
            {n:2,t:'עבור לעמוד חיבוריות',d:'לחץ על לשונית "🔗 חיבוריות" בסרגל הניווט'},
            {n:3,t:'הזן את מפתח הסנכרון',d:'העתק את המפתח מהמחשב והדבק בשדה "מפתח סנכרון" — הכתובת כבר ממולאת אוטומטית'},
            {n:4,t:'לחץ "שמור וסנכרן"',d:'הטיול שלך יטען תוך שניות מהענן 🎉'},
          ].map(({n,t,d})=><div key={n} style={{display:'flex',gap:14,alignItems:'flex-start'}}>
            <div style={{width:28,height:28,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:13,flexShrink:0}}>{n}</div>
            <div><div style={{fontWeight:600,fontSize:13}}>{t}</div><div style={{fontSize:12,color:'var(--text2)',marginTop:2}}>{d}</div></div>
          </div>)}
        </div>
      </div>

      {/* ── תיקון שגיאת Rules ── */}
      <div className="card" style={{border:'2px solid var(--red)'}}>
        <div className="card-header" style={{background:'rgba(239,68,68,0.08)'}}>
          <span style={{fontWeight:700}}>🔒 קיבלת "bad credential" או "Permission denied"? תקן כאן</span>
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.8}}>
            Firebase חוסם גישה כי ה-Rules לא מוגדרים נכון. פתרון מהיר — העתק את הקוד הבא והדבק ב-Firebase:
          </div>
          {/* קוד Rules להעתקה */}
          <div style={{position:'relative'}}>
            <pre style={{background:'var(--bg3)',borderRadius:10,padding:14,fontSize:12,lineHeight:1.8,direction:'ltr',textAlign:'left',margin:0,overflowX:'auto'}}>{`{
  "rules": {
    "planmytrip": {
      "$key": {
        ".read": true,
        ".write": true
      }
    }
  }
}`}</pre>
            <button className="btn btn-secondary btn-sm" style={{position:'absolute',top:8,left:8}}
              onClick={()=>{navigator.clipboard?.writeText(`{\n  "rules": {\n    "planmytrip": {\n      "$key": {\n        ".read": true,\n        ".write": true\n      }\n    }\n  }\n}`);toast('קוד הועתק ✓','success');}}>
              📋 העתק
            </button>
          </div>
          <div style={{fontSize:12,color:'var(--text2)',lineHeight:2}}>
            <strong>שלבים:</strong><br/>
            1. לחץ: <a href={FB_RULES_URL} target="_blank" rel="noreferrer" style={{color:'var(--accent)',fontWeight:600}}>פתח Firebase Rules ←</a><br/>
            2. מחק את כל הטקסט הקיים בעורך<br/>
            3. הדבק את הקוד שהעתקת למעלה<br/>
            4. לחץ <strong>"Publish"</strong> (כפתור כחול למעלה)<br/>
            5. חזור לכאן ← לחץ <strong>"שמור וסנכרן"</strong>
          </div>
          <a href={FB_RULES_URL} target="_blank" rel="noreferrer"
            className="btn btn-danger" style={{textDecoration:'none',textAlign:'center',display:'block'}}>
            🔗 פתח Firebase Rules עכשיו
          </a>
        </div>
      </div>

      {/* ── שאלות נפוצות ── */}
      <div className="card" style={{border:'1px solid rgba(79,142,247,0.3)'}}>
        <div className="card-header" style={{background:'rgba(79,142,247,0.06)'}}>
          <span style={{fontWeight:700}}>❓ שאלות נפוצות על Firebase</span>
        </div>
        <div className="card-body" style={{display:'flex',flexDirection:'column',gap:16}}>

          {/* שאלה 1 */}
          <div style={{borderBottom:'1px solid var(--border)',paddingBottom:14}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>האם הנתונים שלי יימחקו אחרי 30 יום?</div>
            <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.9,background:'rgba(34,197,94,0.07)',borderRadius:8,padding:'10px 14px'}}>
              <strong style={{color:'var(--green)'}}>לא — הנתונים לא נמחקים לעולם.</strong><br/>
              Firebase שומר את המידע ללא הגבלת זמן. ה-30 יום האגדיים
              קשורים רק לחוקי גישה (Rules) שFirebase מגדיר <em>אוטומטית</em> כשיוצרים מסד בTest Mode.<br/><br/>
              <strong>אם הגדרת את ה-Rules שהנחינו אותך כאן</strong> (הקוד בכרטיס האדום למעלה),
              אין לך שום מגבלת זמן — הגישה פתוחה לנצח.
              רק אם Firebase חסם אותך ← חזור לכרטיס האדום ועדכן את ה-Rules.
            </div>
          </div>

          {/* שאלה 2 */}
          <div style={{borderBottom:'1px solid var(--border)',paddingBottom:14}}>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>מה קורה אם Firebase חוסם גישה?</div>
            <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.8}}>
              הנתונים בטוחים — רק אי אפשר לקרוא/לכתוב אליהם עד לתיקון.<br/>
              <strong>פתרון:</strong> פתח Firebase Rules (הכפתור בכרטיס האדום) ← הדבק את הקוד המוכן ← Publish.
              זה לוקח פחות מדקה.
            </div>
          </div>

          {/* שאלה 3 */}
          <div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>איפה הנתונים שמורים בפועל?</div>
            <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.8}}>
              הכל — נתוני טיולים, ימים, הוצאות, מסמכים, תמונות — נשמר בקובץ JSON אחד
              בשרתי Google (Firebase). ניתן לצפות בנתונים ישירות בקונסול Firebase:
            </div>
            <a href="https://planmytrip-de33c-default-rtdb.firebaseio.com/planmytrip.json"
              target="_blank" rel="noreferrer"
              className="btn btn-secondary btn-sm" style={{marginTop:8,textDecoration:'none',display:'inline-flex'}}>
              🔍 צפה בנתונים גולמיים ↗
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>;
}

function ReportSection({title,children}){
  return <div style={{marginBottom:28}}>
    <div style={{fontWeight:700,fontSize:16,color:'var(--text)',borderBottom:'2px solid var(--border)',paddingBottom:8,marginBottom:14}}>{title}</div>
    {children}
  </div>;
}

function ReportTab({trip}){
  // ── חישובי סיכום ──
  const totalExp=trip.expenses.reduce((s,e)=>s+(e.amount||0),0);
  const expByCat=trip.expenses.reduce((a,e)=>{const c=e.category||'אחר';a[c]=(a[c]||0)+(e.amount||0);return a;},{});
  const allBlocks=trip.days.flatMap(d=>d.blocks);
  const completedBlocks=allBlocks.filter(b=>b.isCompleted).length;

  // ── ייצוא טקסט ──
  const genText=()=>{
    const hr=(c='─')=>c.repeat(52);
    const lines=[
      `📋 דו"ח טיול: ${trip.name}`,hr('═'),'',
    ];
    if(trip.startDate||trip.endDate) lines.push(`📅 תאריכים: ${trip.startDate||'?'} – ${trip.endDate||'?'}`);
    if(trip.vehicle?.name) lines.push(`🚐 רכב: ${trip.vehicle.name}${trip.vehicle.plate?' | '+trip.vehicle.plate:''}`);
    lines.push(`📊 ימים: ${trip.days.length} | פעילויות בוצעו: ${completedBlocks}/${allBlocks.length} | הוצאות: ₪${totalExp.toFixed(0)}${trip.interestBank.length?` | אטרקציות שמורות: ${trip.interestBank.length}`:''}`,'');

    if(trip.days.length>0){
      lines.push(hr(),'📅 לוח זמנים יומי',hr());
      trip.days.forEach((day,i)=>{
        const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
        lines.push('',`יום ${i+1}${day.date?` — ${new Date(day.date).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long'})}`:''}`+(day.location?` | 📍 ${day.location}`:''));
        if(day.startLocation||day.endLocation) lines.push(`  🟢 ${day.startLocation||'—'}${day.startTime?' '+day.startTime:''} → 🔴 ${day.endLocation||'—'}${day.endTime?' '+day.endTime:''}`);
        if(!sorted.length){lines.push('  (אין פעילויות)');return;}
        sorted.forEach(b=>{
          const end=addMins(b.startTime,b.durationMins);
          lines.push(`  ${b.isCompleted?'✅':'⬜'} ${b.startTime}–${end}  ${BLOCK_EMOJI[b.type]} ${b.title||BLOCK_HE[b.type]}${b.placeType?' ['+b.placeType+']':''}`);
          if(b.location) lines.push(`       📍 ${b.location}`);
          if(b.notes) lines.push(`       📝 ${b.notes}`);
          if(b.rating>0) lines.push(`       ${'★'.repeat(b.rating)}${'☆'.repeat(5-b.rating)} דירוג אישי`);
          if(b.placeRating) lines.push(`       ⭐ ${b.placeRating}/5 (גוגל)`);
          if(b.cost>0) lines.push(`       💰 ₪${b.cost}`);
        });
        if(day.notes) lines.push(`  📝 הערות: ${day.notes}`);
        if(day.summary) lines.push(`  📌 סיכום: ${day.summary}`);
      });
      lines.push('');
    }

    if(trip.interestBank.length>0){
      lines.push(hr(),'🌟 בנק אטרקציות',hr());
      trip.interestBank.forEach(item=>{
        lines.push(`• ${item.name}${item.placeType?' ['+item.placeType+']':''}${item.address?' — '+item.address:''}`);
        if(item.rating) lines.push(`  ⭐ ${item.rating}`);
        if(item.phone) lines.push(`  📞 ${item.phone}`);
        if(item.website) lines.push(`  🌐 ${item.website}`);
      });
      lines.push('');
    }

    if(trip.expenses.length>0){
      lines.push(hr(),`💰 הוצאות — סה"כ ₪${totalExp.toFixed(0)}`,hr());
      Object.entries(expByCat).sort(([,a],[,b])=>b-a).forEach(([cat,sum])=>lines.push(`  ${cat}: ₪${sum.toFixed(0)}`));
      lines.push('');
      trip.expenses.forEach(e=>lines.push(`  ${e.date||'—'} | ${e.category||'—'} | ${e.description||''} | ₪${e.amount||0}${e.notes?' | '+e.notes:''}`));
      lines.push('');
    }

    if(trip.generalNotes) lines.push(hr(),'📝 הערות כלליות',hr(),trip.generalNotes,'');

    if(trip.quickNotes?.length>0){
      lines.push(hr(),'📌 פתקים מהירים',hr());
      trip.quickNotes.forEach(n=>lines.push(`• ${typeof n==='string'?n:n.text||''}`));
      lines.push('');
    }

    if(trip.packingList?.length>0){
      const done=trip.packingList.filter(i=>i.done), undone=trip.packingList.filter(i=>!i.done);
      lines.push(hr(),`🎒 ציוד (${done.length}/${trip.packingList.length} נארזו)`,hr());
      done.forEach(i=>lines.push(`  ✅ ${i.text}${i.category?' ['+i.category+']':''}`));
      undone.forEach(i=>lines.push(`  ⬜ ${i.text}${i.category?' ['+i.category+']':''}`));
      lines.push('');
    }

    if(trip.shoppingList?.length>0){
      const done=trip.shoppingList.filter(i=>i.done), undone=trip.shoppingList.filter(i=>!i.done);
      lines.push(hr(),`🛒 קניות (${done.length}/${trip.shoppingList.length} נקנו)`,hr());
      done.forEach(i=>lines.push(`  ✅ ${i.text}${i.category?' ['+i.category+']':''}`));
      undone.forEach(i=>lines.push(`  ⬜ ${i.text}${i.category?' ['+i.category+']':''}`));
      lines.push('');
    }

    if(trip.documents?.length>0){
      lines.push(hr(),'📁 מסמכים',hr());
      trip.documents.forEach(d=>lines.push(`• ${d.title}${d.notes?' — '+d.notes:''}`));
      lines.push('');
    }

    lines.push(hr('═'),`הדו"ח נוצר: ${new Date().toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'2-digit',hour:'2-digit',minute:'2-digit'})}`);
    return lines.join('\n');
  };

  const exportTxt=()=>{
    const blob=new Blob(['﻿'+genText()],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${trip.name}-דוח-טיול.txt`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  };
  const copyText=async()=>{
    try{await navigator.clipboard.writeText(genText());toast('הדו"ח הועתק ✓','success');}
    catch{toast('העתקה נכשלה — נסה להוריד','error');}
  };

  return <div style={{height:'100%',overflow:'hidden',display:'flex',flexDirection:'column'}}>
    {/* ── סרגל כלים ── */}
    <div className="report-toolbar" style={{padding:'12px 20px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',gap:10,flexWrap:'wrap',flexShrink:0}}>
      <span style={{fontWeight:700,fontSize:15}}>📋 דו"ח טיול</span>
      <span style={{fontSize:13,color:'var(--text3)'}}>{trip.name}</span>
      <div style={{flex:1}}/>
      <button className="btn btn-secondary btn-sm" onClick={copyText}>📋 העתק טקסט</button>
      <button className="btn btn-secondary btn-sm" onClick={exportTxt}>⬇️ הורד .txt</button>
      <button className="btn btn-primary btn-sm" onClick={()=>window.print()}>🖨️ הדפס</button>
    </div>

    {/* ── תוכן הדו"ח ── */}
    <div className="scroll-y" style={{flex:1,padding:'24px 28px',fontFamily:'Heebo,sans-serif'}}>
      <div style={{maxWidth:860,margin:'0 auto'}}>

        {/* כותרת */}
        <div style={{textAlign:'center',marginBottom:28,paddingBottom:20,borderBottom:'2px solid var(--border)'}}>
          <div style={{fontSize:26,fontWeight:800}}>{trip.name}</div>
          {(trip.startDate||trip.endDate)&&<div style={{fontSize:14,color:'var(--text2)',marginTop:6}}>
            {trip.startDate&&new Date(trip.startDate).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
            {trip.startDate&&trip.endDate&&' — '}
            {trip.endDate&&new Date(trip.endDate).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
          </div>}
          {trip.vehicle?.name&&<div style={{fontSize:12,color:'var(--text3)',marginTop:4}}>🚐 {trip.vehicle.name}{trip.vehicle.plate&&' | '+trip.vehicle.plate}</div>}
        </div>

        {/* כרטיסיות סיכום */}
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(110px,1fr))',gap:10,marginBottom:28}}>
          {[
            {e:'📅',v:trip.days.length,l:'ימים'},
            {e:'🎯',v:`${completedBlocks}/${allBlocks.length}`,l:'פעילויות'},
            {e:'💰',v:`₪${totalExp.toFixed(0)}`,l:'הוצאות'},
            {e:'🌟',v:trip.interestBank.length,l:'אטרקציות'},
            {e:'🎒',v:(trip.packingList||[]).filter(i=>i.done).length+'/'+((trip.packingList||[]).length),l:'ציוד נארז'},
          ].map((s,i)=>(
            <div key={i} style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:10,padding:'12px 8px',textAlign:'center'}}>
              <div style={{fontSize:18}}>{s.e}</div>
              <div style={{fontSize:18,fontWeight:800,color:'var(--accent)',lineHeight:1.2}}>{s.v}</div>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>{s.l}</div>
            </div>
          ))}
        </div>

        {/* לוח זמנים */}
        {trip.days.length>0&&<ReportSection title="📅 לוח זמנים יומי">
          {trip.days.map((day,i)=>{
            const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
            const dayColor=DAY_COLORS[i%DAY_COLORS.length];
            return <div key={day.id} style={{marginBottom:18,borderRight:`3px solid ${dayColor}`,paddingRight:14}}>
              <div style={{fontWeight:700,fontSize:13,color:dayColor,marginBottom:8,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                יום {i+1}
                {day.date&&<span style={{color:'var(--text)'}}>{new Date(day.date).toLocaleDateString('he-IL',{weekday:'long',day:'2-digit',month:'long'})}</span>}
                {day.location&&<span style={{color:'var(--text3)',fontWeight:400}}>📍 {day.location}</span>}
              </div>
              {(day.startLocation||day.endLocation)&&<div style={{fontSize:11,color:'var(--text2)',marginBottom:6,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                <span style={{color:'var(--green)',fontWeight:600}}>🟢 {day.startLocation||'—'}{day.startTime?' '+day.startTime:''}</span>
                <span>→</span>
                <span style={{color:'var(--red)',fontWeight:600}}>🔴 {day.endLocation||'—'}{day.endTime?' '+day.endTime:''}</span>
              </div>}
              {sorted.length===0
                ?<div style={{color:'var(--text3)',fontSize:12,fontStyle:'italic'}}>אין פעילויות</div>
                :sorted.map(b=>{
                  const end=addMins(b.startTime,b.durationMins);
                  const col=BLOCK_COLOR[b.type]||'var(--text3)';
                  return <div key={b.id} style={{display:'flex',gap:10,marginBottom:6,padding:'8px 10px',background:b.isCompleted?'rgba(34,197,94,0.07)':'var(--surface2)',borderRadius:8}}>
                    <div style={{minWidth:90,flexShrink:0,display:'flex',flexDirection:'column',gap:2}}>
                      <span style={{fontSize:11,color:col,fontWeight:700}}>{b.startTime}–{end}</span>
                      <span style={{fontSize:9,color:'var(--text3)'}}>{BLOCK_HE[b.type]}</span>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                        {b.isCompleted&&<span style={{color:'var(--green)'}}>✅</span>}
                        {BLOCK_EMOJI[b.type]} {b.title||BLOCK_HE[b.type]}
                        {b.placeType&&<span style={{fontSize:10,color:'var(--text3)',fontWeight:400,background:'var(--bg3)',padding:'1px 6px',borderRadius:4}}>{b.placeType}</span>}
                      </div>
                      {b.location&&<div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>📍 {b.location}</div>}
                      {b.notes&&<div style={{fontSize:12,color:'var(--text)',marginTop:4,lineHeight:1.6,background:'rgba(79,142,247,0.07)',borderRadius:6,padding:'4px 8px'}}>📝 {b.notes}</div>}
                      <div style={{display:'flex',gap:10,marginTop:4,flexWrap:'wrap',alignItems:'center'}}>
                        {b.rating>0&&<span style={{fontSize:12,color:'var(--amber)',fontWeight:700}}>{'★'.repeat(b.rating)}{'☆'.repeat(5-b.rating)} <span style={{fontSize:10,fontWeight:400,color:'var(--text3)'}}>הדירוג שלי</span></span>}
                        {b.placeRating>0&&<span style={{fontSize:11,color:'var(--text3)'}}>גוגל: ⭐{b.placeRating}</span>}
                        {b.cost>0&&<span style={{fontSize:11,color:'var(--amber)'}}>💰 ₪{b.cost}</span>}
                        {b.durationMins>0&&<span style={{fontSize:11,color:'var(--text3)'}}>⏱ {b.durationMins} דק'</span>}
                        {b.placePhone&&<span style={{fontSize:11,color:'var(--accent)'}}>📞 {b.placePhone}</span>}
                        {b.placeWebsite&&<a href={b.placeWebsite} target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--accent)'}} onClick={e=>e.stopPropagation()}>🌐 {b.placeWebsite.replace(/^https?:\/\//,'').split('/')[0]}</a>}
                      </div>
                    </div>
                  </div>;
                })
              }
              {(day.notes||day.summary)&&<div style={{fontSize:11,color:'var(--text2)',padding:'6px 10px',background:'rgba(79,142,247,0.08)',borderRadius:6,marginTop:4,lineHeight:1.6}}>
                {day.notes&&<div>📝 {day.notes}</div>}
                {day.summary&&<div>📌 {day.summary}</div>}
              </div>}
            </div>;
          })}
        </ReportSection>}

        {/* בנק אטרקציות */}
        {trip.interestBank.length>0&&<ReportSection title="🌟 בנק אטרקציות">
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(210px,1fr))',gap:8}}>
            {trip.interestBank.map(item=>(
              <div key={item.id} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'10px 12px'}}>
                <div style={{fontWeight:600,fontSize:13}}>{item.name}</div>
                {item.placeType&&<div style={{fontSize:10,color:'var(--text3)',marginTop:1}}>{item.placeType}</div>}
                {item.address&&<div style={{fontSize:11,color:'var(--text3)',marginTop:3,lineHeight:1.4}}>📍 {item.address}</div>}
                <div style={{display:'flex',gap:8,marginTop:4,flexWrap:'wrap'}}>
                  {item.rating&&<span style={{fontSize:11,color:'var(--amber)'}}>⭐ {item.rating}</span>}
                  {item.openStatus&&<span style={{fontSize:10,color:item.openStatus==='פתוח עכשיו'?'var(--green)':'var(--red)'}}>{item.openStatus}</span>}
                </div>
                {item.phone&&<div style={{fontSize:11,color:'var(--accent)',marginTop:2}}>📞 {item.phone}</div>}
                {item.website&&<a href={item.website} target="_blank" rel="noreferrer" style={{fontSize:11,color:'var(--accent)',display:'block',marginTop:2}} onClick={e=>e.stopPropagation()}>🌐 {item.website.replace(/^https?:\/\//,'').split('/')[0]}</a>}
              </div>
            ))}
          </div>
        </ReportSection>}

        {/* הוצאות */}
        {trip.expenses.length>0&&<ReportSection title={`💰 הוצאות — סה"כ ₪${totalExp.toFixed(0)}`}>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:14}}>
            {Object.entries(expByCat).sort(([,a],[,b])=>b-a).map(([cat,sum])=>(
              <div key={cat} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:8,padding:'5px 12px',fontSize:12,display:'flex',gap:6,alignItems:'center'}}>
                <span style={{color:CAT_COLORS[cat]||'var(--text3)',fontWeight:600}}>{cat}</span>
                <span style={{color:'var(--text2)'}}>₪{sum.toFixed(0)}</span>
              </div>
            ))}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:2}}>
            {trip.expenses.map(e=>(
              <div key={e.id} style={{display:'flex',gap:8,padding:'5px 8px',background:'var(--surface2)',borderRadius:6,fontSize:12,flexWrap:'wrap'}}>
                <span style={{color:'var(--text3)',minWidth:78,flexShrink:0}}>{e.date||'—'}</span>
                <span style={{color:CAT_COLORS[e.category]||'var(--text3)',fontWeight:600,minWidth:55,flexShrink:0}}>{e.category||'—'}</span>
                <span style={{flex:1,color:'var(--text)'}}>{e.description}</span>
                {e.notes&&<span style={{color:'var(--text3)',fontStyle:'italic'}}>{e.notes}</span>}
                <span style={{color:'var(--amber)',fontWeight:700,flexShrink:0}}>₪{e.amount||0}</span>
              </div>
            ))}
          </div>
        </ReportSection>}

        {/* הערות כלליות */}
        {trip.generalNotes&&<ReportSection title="📝 הערות כלליות">
          <div style={{whiteSpace:'pre-wrap',fontSize:13,lineHeight:1.85,color:'var(--text2)',padding:'10px 14px',background:'var(--surface2)',borderRadius:8}}>{trip.generalNotes}</div>
        </ReportSection>}

        {/* פתקים מהירים */}
        {trip.quickNotes?.length>0&&<ReportSection title="📌 פתקים מהירים">
          <div style={{display:'flex',flexDirection:'column',gap:5}}>
            {trip.quickNotes.map((n,i)=>(
              <div key={i} style={{fontSize:12,color:'var(--text2)',padding:'5px 10px',background:'var(--surface2)',borderRadius:6,borderRight:'3px solid var(--amber)'}}>
                {typeof n==='string'?n:n.text||''}
              </div>
            ))}
          </div>
        </ReportSection>}

        {/* ציוד */}
        {(trip.packingList||[]).length>0&&(()=>{
          const done=(trip.packingList||[]).filter(i=>i.done);
          const undone=(trip.packingList||[]).filter(i=>!i.done);
          return <ReportSection title={`🎒 ציוד — ${done.length}/${trip.packingList.length} נארזו`}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:4}}>
              {done.map(item=>(
                <div key={item.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'var(--green)'}}>
                  <span>✅</span><span style={{textDecoration:'line-through',opacity:.7}}>{item.text}</span>
                  {item.category&&<span style={{fontSize:10,color:'var(--text3)'}}>[{item.category}]</span>}
                </div>
              ))}
              {undone.map(item=>(
                <div key={item.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'var(--text2)'}}>
                  <span>⬜</span><span>{item.text}</span>
                  {item.category&&<span style={{fontSize:10,color:'var(--text3)'}}>[{item.category}]</span>}
                </div>
              ))}
            </div>
          </ReportSection>;
        })()}

        {/* קניות */}
        {(trip.shoppingList||[]).length>0&&(()=>{
          const done=(trip.shoppingList||[]).filter(i=>i.done);
          const undone=(trip.shoppingList||[]).filter(i=>!i.done);
          return <ReportSection title={`🛒 קניות — ${done.length}/${trip.shoppingList.length} נקנו`}>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(170px,1fr))',gap:4}}>
              {done.map(item=>(
                <div key={item.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'var(--green)'}}>
                  <span>✅</span><span style={{textDecoration:'line-through',opacity:.7}}>{item.text}</span>
                  {item.category&&<span style={{fontSize:10,color:'var(--text3)'}}>[{item.category}]</span>}
                </div>
              ))}
              {undone.map(item=>(
                <div key={item.id} style={{display:'flex',alignItems:'center',gap:5,fontSize:12,color:'var(--text2)'}}>
                  <span>⬜</span><span>{item.text}</span>
                  {item.category&&<span style={{fontSize:10,color:'var(--text3)'}}>[{item.category}]</span>}
                </div>
              ))}
            </div>
          </ReportSection>;
        })()}

        {/* מסמכים */}
        {(trip.documents||[]).length>0&&<ReportSection title="📁 מסמכים">
          <div style={{display:'flex',flexDirection:'column',gap:4}}>
            {trip.documents.map(d=>(
              <div key={d.id} style={{display:'flex',gap:8,padding:'6px 10px',background:'var(--surface2)',borderRadius:6,fontSize:12,alignItems:'center'}}>
                <span>📄</span>
                <span style={{fontWeight:600}}>{d.title}</span>
                {d.notes&&<span style={{color:'var(--text3)',flex:1}}>— {d.notes}</span>}
                {d.savedAt&&<span style={{color:'var(--text3)',fontSize:11}}>{new Date(d.savedAt).toLocaleDateString('he-IL')}</span>}
              </div>
            ))}
          </div>
        </ReportSection>}

        {/* כלי הרכב */}
        {trip.vehicle&&(trip.vehicle.waterFillDate||trip.vehicle.wasteEmptyDate)&&<ReportSection title="🚐 מצב כלי הרכב">
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            {trip.vehicle.waterFillDate&&<div style={{padding:'8px 14px',background:'rgba(79,142,247,0.1)',borderRadius:8,border:'1px solid rgba(79,142,247,0.3)'}}>
              <div style={{fontSize:11,color:'var(--text3)'}}>💧 מילוי מים אחרון</div>
              <div style={{fontWeight:700,fontSize:13,color:'#4f8ef7'}}>{new Date(trip.vehicle.waterFillDate).toLocaleDateString('he-IL')}</div>
              {(trip.vehicle.waterLog||[]).length>1&&<div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>סה"כ {trip.vehicle.waterLog.length} מילויים</div>}
            </div>}
            {trip.vehicle.wasteEmptyDate&&<div style={{padding:'8px 14px',background:'rgba(245,158,11,0.1)',borderRadius:8,border:'1px solid rgba(245,158,11,0.3)'}}>
              <div style={{fontSize:11,color:'var(--text3)'}}>🪣 ריקון קקי אחרון</div>
              <div style={{fontWeight:700,fontSize:13,color:'#f59e0b'}}>{new Date(trip.vehicle.wasteEmptyDate).toLocaleDateString('he-IL')}</div>
              {(trip.vehicle.wasteLog||[]).length>1&&<div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>סה"כ {trip.vehicle.wasteLog.length} ריקונים</div>}
            </div>}
          </div>
        </ReportSection>}

        {/* תחתית */}
        <div style={{marginTop:28,paddingTop:12,borderTop:'1px solid var(--border)',fontSize:11,color:'var(--text3)',textAlign:'center'}}>
          דו"ח נוצר: {new Date().toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'2-digit'})}
        </div>
      </div>
    </div>
  </div>;
}

/* ══════════════════════════════════
   ERROR BOUNDARY
══════════════════════════════════ */
class ErrorBoundary extends React.Component {
  constructor(p){super(p);this.state={err:null,info:null};}
  static getDerivedStateFromError(e){return{err:e};}
  componentDidCatch(e,i){console.error('CaravanControl crash:',e,i?.componentStack);}
  render(){
    if(this.state.err){
      const msg=String(this.state.err);
      const isData=msg.includes('undefined')||msg.includes('null')||msg.includes('forEach')||msg.includes('map')||msg.includes('filter');
      return(
        <div style={{height:'100%',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:18,padding:32,background:'var(--bg)'}}>
          <div style={{fontSize:52}}>⚠️</div>
          <div style={{fontSize:20,fontWeight:800,color:'var(--text)'}}>שגיאה בטעינת האפליקציה</div>
          <div style={{fontSize:13,color:'var(--text2)',maxWidth:420,textAlign:'center',lineHeight:1.8}}>
            {isData?'נתוני הטיול אינם תואמים את הגרסה הנוכחית. לחץ "אפס ונסה שוב" כדי לנקות את הנתונים המקומיים ולרענן.':'אירעה שגיאה בלתי צפויה. נסה לרענן את הדף.'}
          </div>
          <div style={{fontSize:11,color:'var(--text3)',fontFamily:'monospace',maxWidth:460,wordBreak:'break-word',textAlign:'center',opacity:.7}}>{msg}</div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap',justifyContent:'center'}}>
            <button className="btn btn-primary" onClick={()=>location.reload()}>🔄 רענן דף</button>
            <button className="btn btn-danger" onClick={()=>{try{localStorage.removeItem('caravanCtrl_he');}catch(e){}location.reload();}}>🗑️ אפס ונסה שוב</button>
          </div>
          <div style={{fontSize:11,color:'var(--text3)',textAlign:'center',lineHeight:1.7}}>
            ⚠️ <strong>אפס ונסה שוב</strong> ימחק את הנתונים המקומיים בדפדפן זה בלבד.<br/>
            הטיולים השמורים ב-Firebase לא יימחקו.
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

/* ══════════════════════════════════
   APP
══════════════════════════════════ */
function App(){
  const saved=useMemo(()=>loadState(),[]);
  const[settings,setSettings]=useState(()=>{
    const def={githubToken:'',githubUsername:'nimrodekel-hub',githubRepo:'PlanMyTrip',
      googleMapsKey:'AIzaSyAZhMPQ3rdplpqNhYx5oNrZV5HJfcTq1Dw',theme:'dark',
      firebaseUrl:FB_URL, syncKey:''};
    const merged={...def,...(saved?.settings||{})};
    // אם אין Firebase URL — הכנס את ברירת המחדל
    // תמיד השתמש בכתובת הנכונה — לא כתובת הקונסול
    merged.firebaseUrl=FB_URL;
    // אם אין syncKey — צור אחד אוטומטית
    if(!merged.syncKey) merged.syncKey=genSyncKey();
    return merged;
  });
  const[trips,setTrips]=useState(()=>{
    const raw=saved?.trips;
    if(raw?.length>0){const n=raw.map(normTrip).filter(Boolean);if(n.length>0)return n;}
    return[defaultTrip('הטיול הראשון שלי')];
  });
  const[activeId,setActiveId]=useState(saved?.activeId||(saved?.trips?.[0]?.id??null));
  const[tab,setTab]=useState('map');
  const[mobilePanel,setMobilePanel]=useState('map'); // 'map'|'timeline'|'bank'
  const[ghBusy,setGhBusy]=useState(false);
  const[syncStatus,setSyncStatus]=useState('idle'); // 'idle'|'syncing'|'synced'|'error'
  const[hlDay,setHlDay]=useState(null);
  const[hlItem,setHlItem]=useState(null);
  const ghSha=useRef(null);
  const autoSyncTimer=useRef(null);
  const skipNextPush=useRef(false);
  const syncMounted=useRef(false);

  useEffect(()=>saveState({settings,trips,activeId}),[settings,trips,activeId]);
  useEffect(()=>{document.body.className=settings.theme==='light'?'light':'';},[settings.theme]);

  // ── טעינה אוטומטית בעת פתיחה ──
  useEffect(()=>{
    const{firebaseUrl:fbUrl,syncKey,githubToken:tok,githubUsername:user,githubRepo:repo}=settings;

    if(fbUrl&&syncKey){
      // Firebase — המסלול המועדף
      setSyncStatus('syncing');
      fbRead(fbUrl,syncKey)
        .then(data=>{
          if(data?.trips?.length>0){
            const loaded=data.trips.map(normTrip).filter(Boolean);
            if(loaded.length>0){
              skipNextPush.current=true;
              setTrips(loaded);
              if(data.activeId) setActiveId(data.activeId);
              toast('הטיול נטען מ-Firebase ✓','success');
            }
          }
          setSyncStatus('synced');
        })
        .catch(()=>setSyncStatus('error'));
    } else if(tok&&user&&repo){
      // GitHub API — מסלול גיבוי
      setSyncStatus('syncing');
      ghLoad(tok,user,repo,'trip_data.json')
        .then(({content,sha})=>{
          ghSha.current=sha;
          if(content.trips?.length>0){
            skipNextPush.current=true;
            setTrips(content.trips);
            if(content.activeId) setActiveId(content.activeId);
            toast('נטען מגיטהאב ✓','success');
          }
          setSyncStatus('synced');
        })
        .catch(()=>setSyncStatus('idle'));
    } else {
      // אין סנכרון — הצג תזכורת חד-פעמית במחשב
      if(!(navigator.maxTouchPoints>0)&&!window.matchMedia('(max-width:768px)').matches){
        setTimeout(()=>toast('☁️ הסנכרון לא מוגדר — עבור להגדרות ⚙️ להפעלה','info'),4000);
      }
    }
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[]);

  // ── שמירה אוטומטית אחרי כל שינוי (debounce 2s) ──
  useEffect(()=>{
    if(!syncMounted.current){syncMounted.current=true;return;}
    if(skipNextPush.current){skipNextPush.current=false;return;}
    const{firebaseUrl:fbUrl,syncKey,githubToken:tok,githubUsername:user,githubRepo:repo}=settings;
    if(!fbUrl&&(!tok||!user||!repo)) return;
    setSyncStatus('syncing');
    clearTimeout(autoSyncTimer.current);
    autoSyncTimer.current=setTimeout(async()=>{
      try{
        if(fbUrl&&syncKey){
          await fbWrite(fbUrl,syncKey,{trips,activeId,savedAt:new Date().toISOString()});
        } else if(tok&&user&&repo){
          if(!ghSha.current){try{const r=await ghLoad(tok,user,repo,'trip_data.json');ghSha.current=r.sha;}catch{}}
          const res=await ghSave(tok,user,repo,'trip_data.json',{trips,activeId,savedAt:new Date().toISOString()},ghSha.current);
          ghSha.current=res.content.sha;
        }
        setSyncStatus('synced');
      }catch(e){setSyncStatus('error');console.error('Sync error:',e.message);}
    },2000);
    return ()=>clearTimeout(autoSyncTimer.current);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  },[trips,activeId]);

  const trip=useMemo(()=>trips.find(t=>t.id===activeId)||trips[0]||null,[trips,activeId]);

  const updTrip=useCallback(upd=>{
    if (typeof upd==='function') setTrips(ts=>ts.map(t=>t.id===activeId?upd(t):t));
    else setTrips(ts=>ts.map(t=>t.id===upd.id?upd:t));
  },[activeId]);

  const newTrip=(name,template=null)=>{
    const t=template?{...template,id:uid(),name:name||template.name+' עותק'}:defaultTrip(name||'טיול חדש');
    setTrips(ts=>[...ts,t]); setActiveId(t.id);
    toast(`הטיול "${t.name}" נוצר`,'success');
  };
  const loadTrip=(id,direct=null)=>{
    if (direct){setTrips(ts=>ts.map(t=>t.id===direct.id?direct:t));return;}
    setActiveId(id); setTab('timeline');
  };
  const delTrip=id=>{
    const rest=trips.filter(t=>t.id!==id);
    setTrips(rest); if(activeId===id)setActiveId(rest[0]?.id||null);
  };
  const addToBank=useCallback(item=>{
    if (!trip) return;
    updTrip({...trip,interestBank:[...trip.interestBank,{...item,id:uid()}]});
  },[trip,updTrip]);

  const addToDay=useCallback((dayId,item)=>{
    if (!trip) return;
    const day=trip.days.find(d=>d.id===dayId);
    if (!day) return;
    const sorted=[...day.blocks].sort((a,b)=>a.startTime.localeCompare(b.startTime));
    const last=sorted[sorted.length-1];
    const start=last?addMins(last.startTime,last.durationMins):(day.currentTime||'09:00');
    const newBlock=defaultBlock('activity',start);
    newBlock.title=item.name;
    newBlock.location=item.address||'';
    if(item.lat){newBlock.lat=item.lat; newBlock.lng=item.lng;}
    if(item.placeId) newBlock.placeId=item.placeId;
    if(item.rating) newBlock.placeRating=item.rating;
    if(item.userRatingsTotal) newBlock.placeUserRatings=item.userRatingsTotal;
    if(item.openStatus) newBlock.placeOpenStatus=item.openStatus;
    if(item.todayHours) newBlock.placeTodayHours=item.todayHours;
    if(item.phone) newBlock.placePhone=item.phone;
    if(item.website) newBlock.placeWebsite=item.website;
    if(item.photoUrl) newBlock.placePhotoUrl=item.photoUrl;
    if(item.placeType) newBlock.placeType=item.placeType;
    const updatedDay={...day,blocks:[...day.blocks,newBlock]};
    updTrip({...trip,days:trip.days.map(d=>d.id===dayId?updatedDay:d)});
  },[trip,updTrip]);

  const push=async(s=settings)=>{
    setGhBusy(true); setSyncStatus('syncing');
    try{
      if(s.firebaseUrl&&s.syncKey){
        await fbWrite(s.firebaseUrl,s.syncKey,{trips,activeId,savedAt:new Date().toISOString()});
        toast('נשמר ב-Firebase ✓','success');
      } else {
        if(!ghSha.current){try{const r=await ghLoad(s.githubToken,s.githubUsername,s.githubRepo,'trip_data.json');ghSha.current=r.sha;}catch{}}
        const res=await ghSave(s.githubToken,s.githubUsername,s.githubRepo,'trip_data.json',{trips,activeId,savedAt:new Date().toISOString()},ghSha.current);
        ghSha.current=res.content.sha;
        toast('נדחף לגיטהאב ✓','success');
      }
      setSyncStatus('synced');
    }catch(e){
      setSyncStatus('error');
      if(e.message==='rules_denied'){
        toast('🔒 Firebase חסם גישה — יש לעדכן Rules. עבור ל-🔗 חיבוריות לפרטים','error');
      } else {
        toast(`שגיאת שמירה: ${e.message}`,'error');
      }
    }
    finally{setGhBusy(false);}
  };
  const pull=async(s=settings)=>{
    setGhBusy(true); setSyncStatus('syncing');
    try{
      let data=null;
      if(s.firebaseUrl&&s.syncKey){
        data=await fbRead(s.firebaseUrl,s.syncKey);
        toast('נטען מ-Firebase ✓','success');
      } else {
        const{content,sha}=await ghLoad(s.githubToken,s.githubUsername,s.githubRepo,'trip_data.json');
        ghSha.current=sha; data=content;
        toast('נמשך מגיטהאב ✓','success');
      }
      if(data?.trips){const loaded=data.trips.map(normTrip).filter(Boolean);if(loaded.length>0){skipNextPush.current=true;setTrips(loaded);if(data.activeId)setActiveId(data.activeId);}}
      setSyncStatus('synced');
    }catch(e){setSyncStatus('error');toast(`שגיאת טעינה: ${e.message}`,'error');}
    finally{setGhBusy(false);}
  };

  const TABS=[
    {id:'map',label:'🗺️ מפה'},
    {id:'timeline',label:'🗓 לוח זמנים'},
    {id:'expenses',label:'💰 הוצאות'},
    {id:'documents',label:'📁 מסמכים'},
    {id:'packing',label:'🎒 ציוד'},
    {id:'shopping',label:'🛒 קניות'},
    {id:'notes',label:'📝 הערות'},
    {id:'report',label:'📋 דו"ח'},
    {id:'connectivity',label:'🔗 חיבוריות'},
    {id:'settings',label:'⚙️ הגדרות'},
  ];

  const noTrip=<div className="empty-state" style={{height:'100%'}}>
    <div className="emoji">🚐</div>
    <div style={{fontWeight:600,color:'var(--text)'}}>אין טיול פעיל</div>
    <p>עבור להגדרות ⚙️ כדי ליצור טיול חדש.</p>
    <button className="btn btn-primary" onClick={()=>setTab('settings')}>⚙️ הגדרות</button>
  </div>;

  const renderMain=()=>{
    if (!trip&&tab!=='settings'&&tab!=='connectivity') return noTrip;
    switch(tab){
      case 'map': return (
        <div className="map-view-3col">
          {/* עמודה 1: מפה */}
          <div className="map-col map-col-map">
            <MapView mapsKey={settings.googleMapsKey} trip={trip} onAddToBank={addToBank} onAddToDay={addToDay}
              highlightDay={hlDay} highlightItem={hlItem}/>
          </div>
          {/* backdrop בסלולר */}
          <div className={`mob-panel-backdrop${mobilePanel!=='map'?' show':''}`}
            onClick={()=>setMobilePanel('map')}/>
          {/* עמודה 2: לוח זמנים */}
          <div className={`map-col map-col-timeline${mobilePanel==='timeline'?' mob-open':''}`}>
            {trip?<TimelineTab trip={trip} onUpdate={updTrip} compact={true}
              onLocate={(lat,lng)=>window.__gmFocus?.(lat,lng)}
              onFocusDay={(dayId,dayIndex,blocks)=>setHlDay({dayId,dayIndex,blocks})}
              onFocusItem={(lat,lng,name)=>{setHlItem({lat,lng,name});setHlDay(null);}}
            />:noTrip}
          </div>
          {/* עמודה 3: בנק אטרקציות */}
          <div className={`map-col map-col-bank${mobilePanel==='bank'?' mob-open':''}`}>
            {trip?<BankPanel trip={trip} onUpdate={updTrip}
              onLocate={(lat,lng)=>window.__gmFocus?.(lat,lng)}
              onFocusItem={(lat,lng,name)=>{setHlItem({lat,lng,name});setHlDay(null);}}
              onClose={()=>setMobilePanel('map')}
            />:noTrip}
          </div>
        </div>
      );
      case 'timeline': return <TimelineTab trip={trip} onUpdate={updTrip}/>;
      case 'expenses': return <ExpensesTab trip={trip} onUpdate={updTrip}/>;
      case 'documents': return <DocsTab trip={trip} onUpdate={updTrip} settings={settings}/>;
      case 'packing': return <Checklist title="רשימת ציוד" emoji="🎒" items={trip.packingList} onUpdate={items=>updTrip({...trip,packingList:items})}/>;
      case 'shopping': return <Checklist title="רשימת קניות" emoji="🛒" items={trip.shoppingList} onUpdate={items=>updTrip({...trip,shoppingList:items})}/>;
      case 'notes': return <NotesTab trip={trip} onUpdate={updTrip}/>;
      case 'report': return <ReportTab trip={trip}/>;
      case 'connectivity': return <ConnectivityTab settings={settings} onSettings={setSettings} onPush={push} onPull={pull} ghBusy={ghBusy} syncStatus={syncStatus}/>;
      case 'settings': return <SettingsTab settings={settings} onSettings={setSettings} trips={trips} activeTrip={trip} onNewTrip={newTrip} onLoadTrip={loadTrip} onDeleteTrip={delTrip} onPush={push} onPull={pull} ghBusy={ghBusy} genKey={genSyncKey}/>;
      default: return null;
    }
  };

  return <div style={{display:'flex',flexDirection:'column',height:'100%'}}>
    <div className="app-header">
      <VehicleHeader trip={trip} theme={settings.theme} syncStatus={syncStatus} hasGh={!!settings.githubToken} hasFb={!!(settings.firebaseUrl&&settings.syncKey)} onThemeToggle={()=>setSettings(s=>({...s,theme:s.theme==='dark'?'light':'dark'}))} onUpdate={updTrip} onGoSettings={()=>setTab('connectivity')}/>
      <div className="tab-bar">
        {TABS.map(t=>(
          <button key={t.id} className={`tab-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
    </div>
    <div className="main-content">{renderMain()}</div>
    <nav className="mobile-bottom-nav">
      {TABS.map(t=>{
        const [icon,...words]=t.label.split(' ');
        return <button key={t.id} className={`mobile-nav-btn${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>
          <span className="mobile-nav-icon">{icon}</span>
          <span className="mobile-nav-label">{words.join(' ')}</span>
        </button>;
      })}
      {tab==='map'&&<>
        <button className={`mobile-nav-btn${mobilePanel==='timeline'?' active':''}`}
          style={mobilePanel==='timeline'?{color:'var(--green)',borderTopColor:'var(--green)'}:{}}
          onClick={()=>setMobilePanel(p=>p==='timeline'?'map':'timeline')}>
          <span className="mobile-nav-icon">📅</span>
          <span className="mobile-nav-label">לוז</span>
        </button>
        <button className={`mobile-nav-btn${mobilePanel==='bank'?' active':''}`}
          style={mobilePanel==='bank'?{color:'var(--amber)',borderTopColor:'var(--amber)'}:{}}
          onClick={()=>setMobilePanel(p=>p==='bank'?'map':'bank')}>
          <span className="mobile-nav-icon">⭐</span>
          <span className="mobile-nav-label">אטרקציות</span>
        </button>
      </>}
    </nav>
    <Toasts/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
</body>
